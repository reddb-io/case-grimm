<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive Grimm tales reader with ontology and on-device AI helpers.">
  <title>Grimm Graph Reader</title>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="assets/style.css?v=20260513-7">
</head>
<body>
  <div id="app">Loading...</div>
  <script src="assets/app.js?v=20260513-7"></script>
  <script>
    window.$docsify = {
      name: 'Grimm Graph Reader',
      repo: '',
      loadSidebar: true,
      coverpage: true,
      subMaxLevel: 2,
      auto2top: true,
      search: {
        paths: 'auto',
        placeholder: 'Search',
        noData: 'No results'
      },
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            if (window.GrimmDocs) window.GrimmDocs.mount();
          });
        }
      ]
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
