# yaml-language-server: $schema=./schemas/ontology.schema.json

# =============================================================================
# Grimm Gold Ontology — v2
# =============================================================================
#
# This file is the SHARED VOCABULARY across all 201 canonical tales. Each
# entry below is a reusable concept (an archetype, a world-law, an affect,
# etc.) that per-tale yaml files reference by label.
#
# -----------------------------------------------------------------------------
# WHY THE 4-FACET CATEGORIZATION
# -----------------------------------------------------------------------------
#
# Every entry carries four orthogonal facets. Each facet answers a
# different scholarly question; combining them gives multi-dimensional
# access to the vocabulary.
#
#   1. `tier`   — Aristotelian: what kind of being is this concept?
#                  • phenomenal  = it EXISTS in the tale-world (you can
#                                  point at it: a frog, a forest, a number)
#                  • structural  = it is a RECURRING PATTERN that
#                                  organises stories (archetype,
#                                  Proppian function, plot shape)
#                  • operational = it is a RULE OR FORCE that makes the
#                                  tale-world work (world-law, agency,
#                                  affect, speech-act, transformation)
#
#                  Why it matters: querying "all the rules of the
#                  tale-world" or "all the recurring patterns" becomes
#                  a single attribute filter rather than a long OR over
#                  many node_types.
#
#   2. `scope`  — at what level does this concept attach?
#                  • entity  = a character or object trait (Cinderella
#                              has `agency_virtue`; the wolf has
#                              `arc_predator`)
#                  • tale    = a whole-story property (Snow White
#                              `moral_regime: violent_punishment`)
#                  • world   = a universal rule across all tales
#                              (law_promise_binds_reality)
#
#                  Why it matters: lets us pivot between
#                  character-analysis, tale-analysis, and
#                  world-analysis without re-categorising.
#
#   3. `lens`   — through which academic tradition is this concept best
#                 understood?
#                  • propp       — narrative-function morphology
#                  • atu         — Aarne-Thompson-Uther type/motif index
#                  • structural  — generic narrative structure (laws,
#                                  agency, regimes)
#                  • cognitive   — affect, identity, intention
#                  • material    — physical/biological tale-world objects
#
#                  Why it matters: comparative folkloristics builds on
#                  different traditions; tagging concepts by their
#                  primary lens makes the ontology legible to scholars
#                  approaching from different schools.
#
#   4. `domains`— cross-cutting tags that group concepts THEMATICALLY
#                  across all categories (e.g. `[forest, threshold]`
#                  appears on `loc_forest`, `threshold_forest`, AND
#                  `law_forest_suspends_domestic_order`).
#
#                  Why it matters: the question "what does the forest
#                  REPRESENT?" cannot be answered within a single
#                  node_type. Domain tags solve it as a single filter
#                  that cross-cuts the 16 ontology categories.
#
# Together these 4 facets create a multi-dimensional faceted classification:
# any entry can be reached by drilling along any axis (tier ∩ scope ∩
# lens ∩ domain) and any query can use any single facet.
#
# -----------------------------------------------------------------------------
# THE 16 CATEGORIES
# -----------------------------------------------------------------------------
#
# Each top-level key below is a `node_type` in the graph. Categories are
# distinct because each captures a different KIND of concept; conflating
# them would lose either expressivity or queryability.
#
#   PHENOMENAL TIER (the tale-world's furniture):
#     species, being_types, locations, magic_objects, symbol_numbers
#
#   STRUCTURAL TIER (the plot-machine's recurring shapes):
#     archetypes, narrative_functions
#
#   OPERATIONAL TIER (the forces that make tales work):
#     world_laws, agency_modes, existential_states, threshold_types,
#     transformation_modes, speech_acts, moral_regimes, affects
#
#   META:
#     edge_labels (vocabulary for relationships between entities)
#
# ATU tale-type entries live in `atu.yaml`; tale-type links are kept out
# of this ontology file so it remains a concept vocabulary.
#
# The `themes` category from v1 was DROPPED — it was an unprincipled
# grab-bag that duplicated operational concepts (`theme_curse` ≡
# `law_curse_requires_counter_condition`) and structural ones
# (`theme_metamorphosis` ≡ `transformation_modes`). Its content
# redistributed cleanly into operational concepts + domain tags.
# =============================================================================

version: 2


# =============================================================================
# ARCHETYPES — structural tier, scope: entity
# =============================================================================
# Why this category: a character may have many properties (species,
# being_type, agency, states) but ONE NARRATIVE ROLE per tale. Archetype
# is that role: predator, helper, oppressed maiden. Cross-tale queries
# ("all the wolves-as-predators") are a single archetype filter.

archetypes:

  arc_animal_helper:
    name: Animal Helper
    description: |
      Speaking or magical animal who aids the protagonist — sometimes
      as donor (gives gift, performs service), sometimes as cursed
      being seeking release.
    rationale: |
      Distinct from `arc_enchanted_prince` (which transforms) and from
      `agency_animal_aid` (a mode of power, not a role). Many tales
      have animal helpers who never transform (doves to Cinderella);
      they need their own slot.
    tier: structural
    scope: entity
    lens: structural
    domains: [animal, helper]
    related: [agency_animal_aid, arc_enchanted_prince]
    examples: [the_frog_king_frog_form, doves_helping_cinderella]

  arc_wise_helper:
    name: Wise Helper
    description: |
      Human helper, often old, marginal, or socially powerless, who
      understands a hidden danger and guides the protagonist through
      concealment, timing, counsel, or escape.
    rationale: |
      Distinct from `arc_supernatural_donor`, whose aid comes from
      otherworldly power, and from `arc_animal_helper`, whose aid is
      species-marked. The wise helper has no magic and may even be
      trapped by the villains, but possesses situational knowledge.
      KHM 40's old woman can save the bride because she knows the
      robber-house routine and the sleeping-draught opportunity.
    tier: structural
    scope: entity
    lens: structural
    domains: [helper, counsel, old-age, danger, rescue]
    related: [agency_speech, agency_cunning, speech_warning]
    examples: [robber_bridegroom_old_woman, devil_golden_hairs_robber_old_woman]

  arc_clever_peasant_bride:
    name: Clever Peasant Bride
    description: |
      Low-born woman whose practical intelligence solves courtly
      riddles, corrects bad judgments, and turns authority's own words
      into the means of restoration.
    rationale: |
      Distinct from `arc_wise_helper`, who advises another protagonist,
      and from `arc_trickster`, whose cunning normally aims at private
      profit or deception. The clever peasant bride is herself the
      tested protagonist and later queen: her intelligence is juridical
      and relational, used to free her father, expose an absurd
      verdict, and preserve marriage without openly defying the king.
      Naming the role supports queries over female wisdom, peasant-
      court mobility, and legal-paradox tales.
    tier: structural
    scope: entity
    lens: structural
    domains: [wisdom, peasant, bride, judgment, social-ascent]
    related: [agency_cunning, agency_speech, speech_riddle, moral_restorative]
    examples: [peasants_clever_daughter]

  arc_wise_child:
    name: Wise Child
    description: |
      Young, low-status, or socially uncredentialed child whose answers
      display wisdom strong enough to instruct, defeat, or be adopted
      by adult authority.
    rationale: |
      Distinct from `arc_clever_peasant_bride`, whose wisdom is tied
      to marriage, legal judgment, and adult courtship, and from
      `arc_trickster`, whose cleverness profits through deception.
      The wise child is socially small but cognitively sovereign: the
      shepherd boy answers royal cosmic questions without fraud,
      proving that rank does not monopolize wisdom. The slot supports
      queries over child-wisdom exempla and status inversion through
      answer-giving rather than marriage or trickery.
    tier: structural
    scope: entity
    lens: cognitive
    domains: [child, wisdom, answer, low-status, authority]
    related: [agency_speech, agency_cunning, speech_riddle, agency_social_rank]
    examples: [the_shepherd_boy]

  arc_enchanted_prince:
    name: Enchanted Prince
    description: |
      A royal figure trapped in non-human or non-royal form by a curse,
      awaiting a specific release condition. Lives in two character
      nodes (animal/altered form + human form) linked by TRANSFORMS_INTO.
    rationale: |
      Earns its own slot because it combines `state_cursed` + royalty +
      pending-release in a way no other archetype does. The
      animal-form is functionally `arc_animal_helper`, but the prince
      is more than a helper — he is the QUEST'S OBJECT, the bride's
      destined husband. Without this archetype the tale-type ATU 440
      ("animal bridegroom") becomes ungraphable.
    tier: structural
    scope: entity
    lens: structural
    domains: [royalty, curse, transformation]
    related: [state_cursed, state_transformed, transform_animal_human, arc_animal_helper]
    examples: [the_frog_king_frog_form, the_raven_princess, hut_forest_kings_son]

  arc_enchanted_animal_bride:
    name: Enchanted Animal Bride
    description: |
      Royal or marriageable female figure hidden in animal form, often
      as a cat, frog, bird, or other small creature, who tests or
      receives humble service before appearing as a human bride.
    rationale: |
      Distinct from `arc_enchanted_prince`, which models the more common
      animal bridegroom role, and from `arc_animal_helper`, whose aid
      may never become marriage. The enchanted animal bride is both
      donor and eventual spouse: her animal household directs the hero's
      labour, then her human royal identity converts service into
      marriage, property, and status. KHM 106 needs the slot because the
      tabby-cat is not merely a helper who gives a horse; she is the
      King's daughter and the tale's final bride.
    tier: structural
    scope: entity
    lens: structural
    domains: [animal-bride, royalty, transformation, marriage, service]
    related: [arc_animal_helper, state_transformed, transform_animal_human, agency_animal_aid]
    examples: [poor_millers_cat_princess]

  arc_reluctant_bride:
    name: Reluctant Bride
    description: |
      Female protagonist bound by promise, oath, or paternal command to
      wed someone she initially finds repulsive or unworthy. The arc
      moves from repulsion → reluctant compliance → recognition.
    rationale: |
      Distinguishes from `arc_oppressed_maiden` (who is helpless
      victim) and from `arc_humble_hero` (who is virtuous). The
      reluctant bride is NEITHER virtuous NOR victimised — she's
      petulant, repulsed, and ultimately bound BY HER OWN WORD. This
      moral ambiguity is structurally important: the curse is broken
      not by virtue but by the friction with her own promise.
    tier: structural
    scope: entity
    lens: structural
    domains: [marriage, oath, disgust]
    related: [affect_disgust, state_bound_by_promise, arc_enchanted_prince]
    examples: [the_frog_king_princess]

  arc_murderous_bridegroom:
    name: Murderous Bridegroom
    description: |
      Male suitor or fiance whose marriage approach masks predatory
      violence, abduction, murder, or cannibal appetite. Courtship is
      the access-method by which the victim is moved toward death.
    rationale: |
      Distinct from `arc_predator`, which names consumption-threat in
      general, and from `arc_disguised_villain`, which names false
      appearance as threshold-crossing. The murderous bridegroom is a
      marriage-specific predator: his social legitimacy as suitor is
      the trap. KHM 40 needs this slot because the horror is not merely
      a robber attacking a maiden; it is betrothal converted into a
      death-route.
    tier: structural
    scope: entity
    lens: structural
    domains: [marriage, predator, murder, deception, cannibalism]
    related: [arc_reluctant_bride, arc_predator, arc_disguised_villain, law_disguise_alters_social_reality]
    examples: [robber_bridegroom_suitor]

  arc_coercive_animal_bridegroom:
    name: Coercive Animal Bridegroom
    description: |
      Animal suitor who presses a human girl into leaving home and
      entering an animal household or wedding arrangement, without the
      release-logic of an enchanted prince.
    rationale: |
      Distinct from `arc_enchanted_prince`, whose animal form is a
      curse awaiting human restoration, and from
      `arc_murderous_bridegroom`, whose courtship masks murder. The
      coercive animal bridegroom is socially uncanny rather than
      redemptive: he repeats invitations, removes the bride from her
      household, and organises a non-human wedding. KHM 66 needs this
      slot because the hare is not revealed as a prince and is not
      punished as a murderer; his bridegroom role itself is the threat.
    tier: structural
    scope: entity
    lens: structural
    domains: [animal-bridegroom, coercion, marriage, abduction, household]
    related: [sp_hare, arc_reluctant_bride, law_decoy_bride_buys_escape]
    examples: [hares_bride_little_hare]

  arc_hybrid_outcast_bridegroom:
    name: Hybrid Outcast Bridegroom
    description: |
      Male marriage figure born or marked as animal-bodied or
      part-animal and socially rejected at home, whose beastly exterior
      later becomes removable or redeemable through marriage.
    rationale: |
      Distinct from `arc_enchanted_prince`, who is usually royal and
      cursed before the tale begins, and from
      `arc_coercive_animal_bridegroom`, whose animal courtship remains
      socially uncanny without release. The hybrid outcast bridegroom
      joins kinship shame, animal body, property exile, promise-claim,
      and final humanization. KHM 108 needs the slot because Hans is
      not a frog-prince waiting in water; he is a half-hedgehog child
      unwanted by his father, self-exiled with livestock, and redeemed
      only when the second kingdom honours its bond. KHM 144 extends
      the slot to a royal donkey-child whose animal surface conceals a
      human bridegroom and whose acceptance at court permits release.
    tier: structural
    scope: entity
    lens: structural
    domains: [animal-bridegroom, hybrid, outcast, marriage, promise]
    related: [being_animal_human_hybrid, sp_hedgehog, sp_donkey, law_burned_animal_skin_releases_human_form, law_first_homecoming_claims_promised_child]
    examples: [hans_hedgehog_form, donkey_prince]

  arc_faithful_servant:
    name: Faithful Servant
    description: |
      A retainer whose loyalty to their master is so strong it manifests
      bodily (Faithful Henry's iron heart-bands) or as endurance over
      long separation.
    rationale: |
      Distinct from `arc_wise_helper` (who advises but isn't bonded)
      and from `arc_animal_helper` (animal, not human). The faithful
      servant has the unique trait that LOYALTY ITSELF is the magic —
      it produces material effects (iron bands, supernatural
      patience). This is the structural reason it deserves its own
      slot rather than being a `traits: [loyal]` tag.
    tier: structural
    scope: entity
    lens: structural
    domains: [loyalty, service, kinship-by-oath]
    related: [affect_loyalty, agency_endurance]
    examples: [faithful_henry, faithful_john]

  arc_discarded_service_animal:
    name: Discarded Service Animal
    description: |
      Domestic animal whose former labour, guarding, or service is
      forgotten once age, weakness, or bodily loss makes it seem
      useless to its human owner.
    rationale: |
      Distinct from `arc_faithful_servant`, which marks human retainers
      bound by oath or office, and from generic `arc_animal_helper`,
      which helps a protagonist without necessarily having a prior
      service contract. The discarded service animal has already served
      inside a human economy and is threatened when utility appears to
      end. KHM 48 needs this role because Old Sultan's crisis comes
      from losing teeth after long faithful service, not from wild
      predation or ordinary animal trickery.
    tier: structural
    scope: entity
    lens: structural
    domains: [animal, service, old-age, loyalty, disposal]
    related: [affect_loyalty, agency_domestic_labor, sp_dog]
    examples: [old_sultan]

  arc_neglected_elder:
    name: Neglected Elder
    description: |
      A frail parent or grandparent whose bodily decline leads younger
      household members to exclude, underfeed, shame, or materially
      downgrade them inside the family.
    rationale: |
      Distinct from `arc_discarded_service_animal`, which concerns
      animals valued by utility, and from `arc_oppressed_maiden`, which
      concerns young women subordinated before marriage. The neglected
      elder is a kinship-role at the other end of life: weakness tests
      whether household care survives lost productivity and bodily
      inconvenience. KHM 78 needs this archetype because the old man's
      exclusion from the table is precisely a failure of filial order.
      KHM 145 uses the same elder-role in a punitive miniature: the
      aged father is denied a share of the meal and leaves without
      complaint, while the punishment falls on the son.
    tier: structural
    scope: entity
    lens: structural
    domains: [old-age, kinship, care, household, exclusion]
    related: [moral_filial_reciprocity, obj_elder_wooden_bowl, agency_endurance]
    examples: [old_man_grandfather, ungrateful_aged_father]

  arc_oath_enforcer:
    name: Oath Enforcer
    description: |
      Authority figure (typically parent or king) who compels the
      protagonist to honour a promise they would otherwise break. The
      enforcer is the social-rank vehicle of `law_promise_binds_reality`.
    rationale: |
      Many tales have parents/kings who do NOT enforce oaths — they
      just exist. This archetype names the SPECIFIC role of being the
      vehicle that makes the world-law materialise in plot. Without
      it, the king in Frog King looks generic; with it, we capture
      his structural function (he's the reason promises BIND, not just
      sit there).
    tier: structural
    scope: entity
    lens: structural
    domains: [authority, oath, kinship]
    related: [agency_social_rank, law_promise_binds_reality, speech_command]
    examples: [the_frog_king_father]

  arc_youngest_sibling:
    name: Underestimated Youngest Sibling
    description: |
      Last of three (or more) siblings — often the protagonist
      regardless of being initially dismissed.
    rationale: |
      The ordinal position is itself a recurring structural marker in
      Grimm — the YOUNGEST being the right answer (in Three Feathers,
      Golden Bird, Water of Life). It is a tale-grammar slot, not just
      a description. Worth its own archetype because it pre-determines
      narrative outcome: the youngest is the one who will succeed.
    tier: structural
    scope: entity
    lens: structural
    domains: [kinship, ordinal-marker]
    related: [num_3, num_7]

  arc_oppressed_maiden:
    name: Oppressed Maiden
    description: |
      Young female protagonist subordinated inside a household by
      stepmother, mother-in-law, sisters, or other domestic authority.
      Her virtue is tested through labour, deprivation, humiliation,
      and obedience under unjust conditions.
    rationale: |
      Distinct from `arc_silent_bride` (trial by muteness),
      `arc_imprisoned_maiden` (spatial confinement), and
      `arc_naive_victim` (epistemic gullibility). The oppressed maiden
      is not primarily fooled or locked away; she is socially lowered
      and forced to work or suffer inside a hostile household order.
      KHM 13's stepdaughter, Cinderella, Mother Holle's good daughter,
      and many later heroines need a shared archetype for domestic
      persecution before reward.
    tier: structural
    scope: entity
    lens: structural
    domains: [maiden, household, oppression, stepfamily, labour]
    related: [arc_cruel_stepmother, moral_kindness_rewarded, agency_endurance]
    examples: [three_little_men_stepdaughter, cinderella]

  arc_predator:
    name: Predator
    description: |
      Character whose narrative function is to threaten, hunt, and
      consume another — wolves, witches, cats-vs-mice, ogres, foxes.
    rationale: |
      Distinguishes from `arc_evil_witch` (specifically female,
      magical) — the predator slot is species-agnostic and describes
      pure consumption-function. A character can be predator without
      being witch (the cat in KHM 2 is mundane animal predator),
      or witch without being predator (some witches curse but don't
      eat). The two archetypes capture different threat-modes.
    tier: structural
    scope: entity
    lens: structural
    domains: [violence, consumption, threat]
    related: [agency_violence, arc_trickster]
    examples: [cat_in_partnership, lrc_wolf, gingerbread_witch]

  arc_trickster:
    name: Trickster
    description: |
      Wins through cunning, deception, and timing rather than direct
      force. The fox in many KHM, the cat in KHM 2, clever servants
      who outwit masters.
    rationale: |
      Distinct from `arc_predator` (direct threat through force) —
      trickster can be a non-violent winner (Fox in Fox and Cat
      saves himself by cunning, never eats). Many characters are
      BOTH (the cat in KHM 2 tricks then eats) — they carry both
      archetypes simultaneously. Naming the modes separately lets
      us see WHICH MODE wins in a given tale.
    tier: structural
    scope: entity
    lens: structural
    domains: [cunning, deception]
    related: [agency_cunning, speech_lie, arc_predator]
    examples: [cat_in_partnership, fox_and_cat_fox]

  arc_master_thief:
    name: Master Thief
    description: |
      Professional thief whose identity is defined by technical mastery
      of locks, disguise, timing, and social misdirection, often proving
      skill through impossible thefts rather than through ordinary
      predation or need.
    rationale: |
      Distinct from `arc_trickster`, which covers any cunning winner,
      and from `arc_predator`, which takes by force. The master thief
      is a craft specialist: in KHM 192 his theft is openly tested by
      the count in three escalating domains, while his own ethics
      distinguish stealing rich surplus from harming the poor. Naming
      the role lets queries find theft as professional expertise rather
      than incidental deception.
    tier: structural
    scope: entity
    lens: structural
    domains: [theft, craft, disguise, cunning, social-rank]
    related: [agency_cunning, state_disguised, moral_trickster_wins]
    examples: [master_thief_son, thief_master_master_thief]

  arc_treacherous_travel_companion:
    name: Treacherous Travel Companion
    description: |
      Companion encountered on the road who first appears as a partner
      in shared travel, labour, or hunger, but exploits the journey to
      harm, extort, abandon, or falsely accuse the protagonist.
    rationale: |
      Distinct from `arc_false_hero`, who claims a completed heroic
      deed, and from `arc_envious_witness`, who observes and accuses
      without necessarily sharing the road. The treacherous travel
      companion violates provisional fellowship itself: in KHM 107 the
      shoemaker receives shared food and drink, then sells bread for
      eyes, abandons the blind tailor at the gallows, and later invents
      false boasts to ruin him at court. The role enables queries over
      companionship turned into betrayal rather than kin rivalry or
      courtly envy.
    tier: structural
    scope: entity
    lens: structural
    domains: [companion, betrayal, travel, envy, extortion]
    related: [arc_trickster, arc_envious_witness, moral_retributive, affect_envy]
    examples: [two_travellers_shoemaker]

  arc_discharged_soldier:
    name: Discharged Soldier
    description: |
      Former soldier released from war or service with little pay,
      food, or social protection, forced into wandering, begging,
      trickery, or magical encounter.
    rationale: |
      Distinct from generic `sp_human` and from `arc_trickster`: the
      discharged soldier is a historical-social folktale role. His
      military past gives him toughness, appetite, and readiness for
      violence, while dismissal leaves him poor and mobile. KHM 81
      needs the slot because Brother Lustig's generosity, bargaining,
      fraud, castle-devil beating, and afterlife trick all start from
      being a demobilized soldier with only bread and coins. KHM 146
      uses the peaceful agrarian variant: the poor brother leaves
      soldiering because he cannot support himself, and his turn to
      farming creates the marvel that changes his status.
    tier: structural
    scope: entity
    lens: structural
    domains: [soldier, poverty, wandering, war, trickster]
    related: [agency_violence, agency_cunning, moral_trickster_wins]
    examples: [brother_lustig, turnip_poor_soldier_farmer]

  arc_compulsive_gambler:
    name: Compulsive Gambler
    description: |
      Figure whose whole identity and social fate are governed by
      gambling: they risk food, shelter, money, world-order, and even
      afterlife placement on play.
    rationale: |
      Distinct from `arc_trickster`, who uses cunning flexibly, and
      from `arc_fool`, whose losses come from misunderstanding. The
      compulsive gambler may be clever, but every gift and threshold is
      converted back into play. KHM 82 needs this archetype because
      Hansel gambles away house, alms, half the world, Lucifer's
      devils, and heavenly order; gambling is not an episode but his
      ontological identity.
    tier: structural
    scope: entity
    lens: cognitive
    domains: [gambling, compulsion, trickster, money, afterlife]
    related: [arc_trickster, law_winning_game_objects_totalize_play, moral_trickster_wins]
    examples: [gambling_hansel]

  arc_naive_victim:
    name: Naive Victim
    description: |
      Character destroyed by trusting too freely — operates on the
      false belief that partnerships, promises, or appearances are
      sincere when they are not.
    rationale: |
      Critically distinct from `arc_oppressed_maiden`: the oppressed
      maiden is INNOCENT (her suffering is unjust); the naive victim
      is CULPABLE (her suffering is the consequence of her own
      naïveté). The narrator-moral on the cat-and-mouse tale ("that
      is the way of the world") rebukes the mouse for trusting, not
      the cat for predating. Without this archetype we cannot
      capture the cynical-fable moral architecture.
    tier: structural
    scope: entity
    lens: structural
    domains: [naivety, deception, victim]
    related: [moral_naive_punished, state_deceived]
    examples: [mouse_in_partnership, little_red_cap]

  arc_willful_child:
    name: Willful Child
    description: |
      Child protagonist or victim whose own obstinacy, curiosity, or
      refusal of parental warning drives them into danger.
    rationale: |
      Distinct from `arc_naive_victim`, who is destroyed by trusting a
      deceiver, and from `arc_abandoned_child`, whose danger begins in
      adult betrayal. The willful child actively crosses the boundary
      they were told not to cross. KHM 43 needs this role because the
      girl is not lured by Frau Trude; she seeks the witch-house after
      a parental prohibition and is punished for that transgressive
      curiosity.
    tier: structural
    scope: entity
    lens: structural
    domains: [child, disobedience, curiosity, prohibition]
    related: [law_prohibition_invites_violation, affect_curiosity, speech_prohibition, moral_naive_punished]
    examples: [frau_trude_girl, willful_child]

  arc_disguised_villain:
    name: Disguised Villain
    description: |
      Predator or antagonist who approaches the victim under a false
      bodily, vocal, or social appearance, using disguise to cross a
      protected domestic threshold.
    rationale: |
      Distinct from `arc_trickster`, whose power is broad tactical
      deception, and from `state_disguised`, which names the condition
      rather than the narrative role. The disguised villain is the
      actor-role that turns surface resemblance into access: wolf as
      mother goat, wolf as grandmother, witch as peddler. KHM 26 needs
      the role because the grandmother-costume and bed-scene are not
      incidental clothing but the predator's way of becoming socially
      admissible to the child.
    tier: structural
    scope: entity
    lens: structural
    domains: [disguise, predator, deception, threshold]
    related: [state_disguised, speech_lie, arc_predator]
    examples: [wolf_as_mother_goat, wolf_as_grandmother]

  arc_prohibition_giver:
    name: Prohibition Giver
    description: |
      The figure who issues an interdiction or rule that the
      protagonist is told not to break — and which becomes the test
      of the tale. Eden's God, Bluebeard, the Virgin Mary in KHM 3,
      witches with "don't open this door" warnings.
    rationale: |
      Distinct from `arc_oath_enforcer` (who compels someone to keep
      their OWN promise) — the prohibition_giver creates the RULE
      others will be tested by. This is Propp's "interdiction"
      function reified as a character role. The role is structurally
      important because it sets up the law-grammar of the tale: if
      no prohibition_giver, no `law_prohibition_invites_violation`
      activates.
    tier: structural
    scope: entity
    lens: structural
    domains: [authority, prohibition, test]
    related: [speech_prohibition, law_prohibition_invites_violation]
    examples: [our_ladys_child_mary, fitchers_bird_wizard]

  arc_silent_bride:
    name: Silent Bride
    description: |
      Maiden who marries the king (or prince) while unable to speak —
      typically due to curse, punishment, or sacred vow of silence.
      Her muteness becomes the structural crux: she cannot defend
      herself against false accusation, cannot confess to lift her
      curse, cannot reveal her identity.
    rationale: |
      Distinct from `arc_reluctant_bride` (who can speak but is
      unwilling). The silent bride's silence is IMPOSED, not chosen,
      and it carries the tale's main tension — her trial-by-silence
      is the test of her fate. Recurs across KHM 3 (Mary takes her
      voice), KHM 49 (Six Swans heroine vows silence), KHM 9 (Twelve
      Brothers). Without this archetype the muteness motif scatters
      across unrelated nodes.
    tier: structural
    scope: entity
    lens: structural
    domains: [silence, marriage, trial]
    related: [state_mute, transform_loss_of_voice]
    examples: [our_ladys_child_queen, six_swans_sister]

  arc_repentant_sinner:
    name: Repentant Sinner
    description: |
      The protagonist whose moral arc moves through transgression,
      stubborn denial, escalating consequence, and finally
      repentance — typically at the moment of greatest threat (the
      stake, the gallows, death's edge).
    rationale: |
      The structural backbone of religious-legend tales (the
      Children's Legends in KHM, Our Lady's Child KHM 3). Distinct
      from `arc_humble_hero` (whose virtue is sustained) — the
      repentant sinner's virtue is RECOVERED from sin. The arc
      requires a specific moral-time-shape: sin first, then suffering,
      then confession, then forgiveness. Naming the archetype lets
      us identify tales operating in this register without conflating
      with tales of innocent suffering.
    tier: structural
    scope: entity
    lens: structural
    domains: [sin, repentance, religious]
    related: [moral_repentance, speech_confession, affect_repentance]
    examples: [our_ladys_child_queen]

  arc_fearless_fool:
    name: Fearless Fool
    description: |
      Hero whose distinguishing feature is the absence of a basic
      human affect — typically fear. Considered "stupid" by his family
      and community precisely because he lacks the responses that
      organise ordinary life. Goes forth to "learn" the missing
      affect, and wins every supernatural encounter on the way.
    rationale: |
      Distinct from `arc_humble_hero` (who has virtue) and from
      `arc_fool` (Clever-Elsie-style, mocked for absurd reasoning).
      The fearless fool's strength is exactly his DEFICIT — what
      should be a defect is, in this tale-world, the perfect tool
      against ghosts (who feed on fear). The archetype names a
      structurally rare hero-type: one whose advantage is an
      ABSENCE rather than a virtue or skill.
    tier: structural
    scope: entity
    lens: structural
    domains: [foolishness, fearlessness, anti-hero]
    related: [state_fearless, law_fearlessness_defeats_supernatural, moral_comic_inversion]
    examples: [youth_who_went_forth_to_learn_fear]

  arc_protective_mother:
    name: Protective Mother
    description: |
      Mother figure whose defining narrative act is protecting her
      children from external threat — including, when necessary,
      performing rescue-by-violence (cutting open the wolf to retrieve
      swallowed kids; cutting Little Red Cap from the wolf). Distinct
      from generic motherhood: this archetype names the mother as
      ACTIVE RESCUER.
    rationale: |
      Distinct from `arc_oath_enforcer` (which is paternal-rank
      authority): the protective mother does not enforce social
      contract, she fights for kin. And distinct from generic mother-
      as-presence (e.g. the king's wife who simply exists in many
      tales). The structural test: does she perform a rescue act
      (surgical, devouring-reversal, retrieval-from-threat)? If yes,
      this archetype applies. The act is what defines her — the
      mother-goat in KHM 5 cuts open the wolf's belly; Little Red
      Cap's grandmother is rescued by a comparable surgical act.
    tier: structural
    scope: entity
    lens: structural
    domains: [maternal, rescue, kinship]
    related: [law_devouring_can_be_reversed, affect_maternal_love, agency_violence]
    examples: [seven_kids_mother_goat]

  arc_envious_witness:
    name: Envious Witness
    description: |
      Courtier or attendant who observes the protagonist's actions and,
      not understanding their purpose, interprets them as evidence of
      betrayal or wickedness. Drives the false accusation that
      structurally tests the protagonist's loyalty against the
      master's suspicion.
    rationale: |
      Distinct from `arc_naive_victim` (who is deceived) — the envious
      witness IS NOT deceived; they simply lack context for the
      protagonist's protective actions and FILL THE GAP WITH SUSPICION.
      Their function is to materialise the social cost of secret
      loyalty (John can't explain why he killed the horse, burned the
      garment, sucked blood from the bride — the courtiers turn
      misunderstanding into accusation).
    tier: structural
    scope: entity
    lens: structural
    domains: [envy, witness, false-accusation]
    related: [affect_envy, arc_faithful_servant]
    examples: [faithful_john_attendants]

  arc_envious_kin_persecutor:
    name: Envious Kin Persecutor
    description: |
      Sister, aunt, in-law, or other close kin whose envy of marriage,
      fertility, rank, or favor leads them to injure the heroine or her
      children from inside the family circle.
    rationale: |
      Distinct from `arc_envious_witness`, who misreads and accuses
      from outside the central household, and from `arc_cruel_stepmother`,
      who has substitute-maternal authority over children. The envious
      kin persecutor acts from lateral family rivalry: in KHM 96 the
      queen's sisters throw her children into the water and replace the
      births with animal accusations because they lack children and
      royal centrality. The slot supports queries over sibling and
      in-law persecution without flattening them into stepmother tales.
    tier: structural
    scope: entity
    lens: structural
    domains: [envy, kinship, sibling, false-accusation, fertility]
    related: [affect_envy, speech_lie, moral_retributive]
    examples: [three_little_birds_false_sisters]

  arc_fool:
    name: Fool
    description: |
      Comic protagonist whose reasoning, obedience, or practical
      judgement is structurally defective. The fool's actions are not
      malicious or heroic; they expose the absurdity of applying a
      rule, social script, or household instruction without situational
      understanding.
    rationale: |
      Distinct from `arc_literal_fool`, whose error is specifically
      semantic literalism toward speech-acts. `arc_fool` is broader:
      Hans in KHM 32 follows every maternal correction exactly, but
      always in the next and wrong context. The archetype lets comic
      folly tales be queried without forcing them into trickster,
      victim, or fearless-hero roles.
    tier: structural
    scope: entity
    lens: structural
    domains: [foolishness, obedience, schwank, household]
    related: [law_misapplied_instruction_cascades, moral_comic_inversion]
    examples: [clever_hans_hans]

  arc_literal_fool:
    name: Literal Fool
    description: |
      Protagonist whose distinguishing trait is taking figurative or
      non-human speech at face value: animal cries treated as
      counter-offers, sales-bargains, sworn guarantees. The
      literalism produces absurd legal demands which, by the schwank's
      logic, end up rewarding the fool.
    rationale: |
      Distinct from `arc_fearless_fool` (deficit = fear) and from
      `arc_naive_victim` (passively deceived). The literal fool is
      neither stupid-in-conduct nor victimised — his deficit is a
      missing layer of pragmatic interpretation. The tale-world
      ratifies the literal reading: he sues the butcher and gets to
      the king. Names the schwank-type hero whose accidental cunning
      derives from refusing figurative speech.
    tier: structural
    scope: entity
    lens: structural
    domains: [foolishness, literalism, schwank, peasant]
    related: [law_speech_taken_literally, moral_comic_inversion, moral_trickster_wins]
    examples: [good_bargain_peasant]

  arc_unlaughing_princess:
    name: Unlaughing Princess
    description: |
      Princess whose defining narrative property is that she has never
      laughed in her life; her parent has promised her hand (or a
      reward) to whoever can make her laugh. Making her laugh is the
      bridal-task / reward-trigger.
    rationale: |
      Distinct from `arc_silent_bride` (whose silence is endured under
      religious prohibition) — this princess is not under any
      prohibition; her unlaughingness is constitutional, a
      psychological deficit that the tale-world weaponises into a
      quest condition. Defines a recurring Grimm motif (also in
      Goose-Girl-at-Spring, The Golden Goose).
    tier: structural
    scope: entity
    lens: structural
    domains: [royalty, laughter, bridal-task]
    related: [law_laughter_releases_reward]
    examples: [good_bargain_princess, the_golden_goose]

  arc_speculator:
    name: Speculator on Reward
    description: |
      Third party who, on hearing of a forthcoming reward, buys a
      share of it in advance from the recipient (at discount) — and
      so receives whatever the reward actually turns out to be,
      including unexpected punishment. Function: materialises the
      schwank's anti-middleman ethic.
    rationale: |
      Distinct from `arc_envious_witness` (who watches but does not
      transact) and from `arc_trickster` (who deceives actively). The
      speculator is structurally defined by a TRANSACTION on an
      undelivered promise: he buys a claim sight-unseen. The schwank
      uses him to convert the king's punishment (five hundred blows)
      from harm-to-protagonist into comeuppance-to-speculator. A
      recurring Grimm figure: soldier-at-the-gate in KHM 7; the Jew
      in KHM 7 and KHM 110.
    tier: structural
    scope: entity
    lens: structural
    domains: [greed, transaction, schwank, middleman]
    related: [affect_greed, moral_trickster_wins]
    examples: [good_bargain_sentinel, good_bargain_jew]

  arc_extraordinary_companion:
    name: Extraordinary Companion
    description: |
      Helper whose single exaggerated bodily capacity — strength,
      sight, speed, breath, appetite, cold, heat, or other physical
      extremity — solves one part of a collective impossible task.
    rationale: |
      Distinct from `arc_supernatural_donor`, who gives objects or
      judgment, and from `arc_animal_helper`, whose help comes through
      species difference. Extraordinary companions are recruited into
      a team because their bodies are specialized instruments: one
      tears up trees, one shoots a fly's eye at two miles, one blows
      regiments into the sky, one outruns the princess, and one freezes
      the iron room. This archetype enables queries over ATU 513
      ensemble-power tales without treating every companion as a
      separate species or being type.
    tier: structural
    scope: entity
    lens: structural
    domains: [helper, companion, body, task, ensemble]
    related: [agency_extraordinary_body, law_specialized_companions_solve_impossible_tasks]
    examples: [how_six_strong_companion, how_six_sharp_shooter, golden_goose_hungry_man, strong_hans_fir_twister, strong_hans_rock_splitter]

  arc_superstrong_youth:
    name: Superstrong Youth
    description: |
      Young male protagonist whose body is transformed or trained into
      superhuman strength, so ordinary farm, craft, and service labour
      become comic arenas of excess.
    rationale: |
      Distinct from `arc_extraordinary_companion`, who is recruited as
      one specialised helper within an ensemble, and from `being_giant`,
      which names a kind of oversized being. The superstrong youth is a
      protagonist role: his strength is the whole plot engine, forcing
      family non-recognition, failed tools, exploitative labour
      bargains, impossible murder attempts, and final wandering. KHM 90
      needs this slot because Thumbling becomes giant-like without
      simply being a generic giant antagonist.
    tier: structural
    scope: entity
    lens: structural
    domains: [strength, youth, giant, labor, schwank]
    related: [agency_extraordinary_body, being_giant]
    examples: [the_young_giant, strong_hans]

  arc_false_hero:
    name: False Hero
    description: |
      Character who claims the protagonist's completed quest, bride,
      treasure, or victory as their own, usually by betrayal after the
      true hero has already succeeded.
    rationale: |
      Distinct from `arc_false_bride`, which substitutes within a
      marriage role, and from `arc_envious_witness`, who observes and
      accuses without completing the theft. The false hero steals a
      public heroic identity: in KHM 57 the elder brothers throw the
      youngest into a well and bring home the Golden Bird, Golden
      Horse, and princess as if they had won them. This slot enables
      queries for stolen quest-credit and exposed imposture.
    tier: structural
    scope: entity
    lens: structural
    domains: [imposture, quest, sibling, theft, recognition]
    related: [state_hidden_identity, moral_retributive, arc_envious_witness]
    examples: [golden_bird_elder_brothers, strong_hans_fir_twister, strong_hans_rock_splitter]

  arc_dragon_slayer:
    name: Dragon Slayer
    description: |
      Hero whose public claim to bride, kingdom, or rank rests on
      confronting and killing a dragon or analogous many-headed monster
      that demands periodic human sacrifice.
    rationale: |
      Distinct from `arc_false_hero`, which steals the claim after the
      deed, and from generic `arc_trickster`, whose victory comes by
      cunning. The dragon slayer is defined by a public rescue against
      a sacrificial monster and by proof of the kill. KHM 60 needs this
      slot because the whole royal marriage and false-hero exposure
      turn on who truly killed the seven-headed dragon.
    tier: structural
    scope: entity
    lens: structural
    domains: [dragon, monster, sacrifice, rescue, bride-reward]
    related: [being_dragon, arc_false_hero, agency_violence, moral_retributive]
    examples: [two_brothers_younger_huntsman]

  arc_greedy_one:
    name: Greedy One / Insatiable Wisher
    description: |
      Character whose appetite for wealth, rank, power, or cosmic
      authority grows precisely because previous wishes have been
      granted. Satisfaction never terminates desire.
    rationale: |
      Distinct from `arc_speculator`, who opportunistically profits
      from one bargain, and from `arc_predator`, whose greed is bodily
      consumption. The greedy one converts fulfilled wishes into a new
      baseline and demands more. KHM 19's Ilsabil moves from cottage to
      castle, king, emperor, pope, and divine control; the archetype
      lets queries find tales where escalating desire, not lack, drives
      the catastrophe.
    tier: structural
    scope: entity
    lens: structural
    domains: [greed, wishing, escalation, power, rank]
    related: [affect_greed, speech_wish, law_insatiable_wishing_reverts_gifts]
    examples: [fisherman_wife_ilsabil]

  arc_cruel_stepmother:
    name: Cruel Stepmother
    description: |
      Substitute maternal figure who persecutes children, stepchildren,
      or their fortunes through abuse, enchantment, exile, murder, or
      substitution of her own child.
    rationale: |
      Distinct from `arc_protective_mother` (maternal care) and from
      generic `arc_envious_witness` (envy without household authority).
      The cruel stepmother has domestic power over vulnerable children
      and uses that power to invert mothering into harm. KHM 11 needs
      this role because the stepmother beats the siblings, enchants the
      brooks, murders the queen, and installs her daughter as false
      bride. The archetype is central across Grimm, especially Snow
      White and Cinderella-like tales.
    tier: structural
    scope: entity
    lens: structural
    domains: [kinship, household, persecution, envy]
    related: [affect_envy, being_witch, arc_false_bride]
    examples: [little_brother_stepmother, snow_white_queen]

  arc_false_bride:
    name: False Bride / Substituted Queen
    description: |
      Impostor placed in the rightful bride's or queen's position,
      usually by kinship conspiracy, disguise, or magical alteration.
      Her function is to occupy a social role while the true woman is
      hidden, dead, exiled, or silenced.
    rationale: |
      Distinct from `state_disguised` (surface condition) and from
      `arc_envious_witness` (observer/accuser). The false bride is a
      structural role in marriage plots: she attempts to inherit the
      heroine's rank, bed, child, or recognition. KHM 11's one-eyed
      daughter lies in the queen's bed in the queen's shape; later
      Goose-Girl and White Bride/Black Bride variants repeat the same
      role. Naming it lets queries find bride-substitution tales.
    tier: structural
    scope: entity
    lens: structural
    domains: [marriage, substitution, disguise, envy]
    related: [state_disguised, state_hidden_identity, arc_cruel_stepmother]
    examples: [little_brother_false_queen, goose_girl_waiting_maid]

  arc_imprisoned_maiden:
    name: Imprisoned Maiden
    description: |
      Young woman confined away from ordinary social life by a guardian,
      curse-worker, parent, or hostile authority. Her enclosure is
      usually spatially extreme: tower, locked room, forest house, or
      inaccessible chamber.
    rationale: |
      Distinct from `arc_silent_bride` (silence under trial) and
      `arc_reluctant_bride` (marriage obligation). The imprisoned
      maiden's defining condition is spatial/social sequestration: no
      door, no stairs, no visitors except the controller. Rapunzel is
      the paradigm, and later tales repeat locked-away daughters,
      tower-maidens, and hidden brides. The archetype enables queries
      for female confinement as plot engine rather than treating tower
      location as sufficient.
    tier: structural
    scope: entity
    lens: structural
    domains: [confinement, maiden, tower, isolation]
    related: [loc_tower, state_hidden_identity, agency_endurance]
    examples: [rapunzel]

  arc_taboo_desiring_father:
    name: Taboo-Desiring Father
    description: |
      Father-king whose grief, oath, or desire turns toward marrying
      his own daughter, converting paternal and royal authority into a
      forbidden marriage threat.
    rationale: |
      Distinct from `arc_predator`, who threatens primarily by hunting
      or consumption, and from ordinary father-figures who arrange
      marriages for daughters. This archetype names the specific ATU
      510B danger: kinship authority collapses into illicit courtship,
      and the daughter's survival requires delay, disguise, and flight
      rather than negotiation. KHM 65 needs it because the king's power
      as father and ruler is exactly what makes refusal structurally
      impossible inside the household.
    tier: structural
    scope: entity
    lens: structural
    domains: [kinship, incest-taboo, marriage, authority, flight]
    related: [affect_taboo_desire, law_impossible_bride_gifts_delay_forced_marriage, arc_oppressed_maiden]
    examples: [allerleirauh_father_king]

  arc_supernatural_donor:
    name: Supernatural Donor / Tester
    description: |
      Otherworldly or magical figure who tests a protagonist's conduct
      through a small request, task, or encounter, then grants a reward
      or punishment calibrated to that conduct.
    rationale: |
      Distinct from `arc_animal_helper` (helper role, often aiding
      without testing) and from `arc_prohibition_giver` (sets a
      forbidden action). The supernatural donor judges behaviour:
      sharing bread, sweeping snow, greeting politely, refusing aid.
      KHM 13's three little men reward the courteous stepdaughter and
      punish the selfish daughter; Mother Holle and many later tales
      repeat the same moral engine. This archetype makes donor-test
      tales queryable across species and being-types.
    tier: structural
    scope: entity
    lens: propp
    domains: [donor, test, reward, punishment, hospitality]
    related: [law_kindness_to_hidden_donors_rewarded, moral_kindness_rewarded]
    examples: [three_little_men]

  arc_wild_man_donor:
    name: Wild Man Donor
    description: |
      Hairy, uncivilized, forest- or water-bound male figure who first
      appears as danger or captive monster, but becomes the hero's
      initiatory guardian, tester, and helper after release.
    rationale: |
      Distinct from `arc_supernatural_donor`, who may simply test and
      reward conduct, and from `arc_enchanted_prince`, who is usually
      a marriage partner trapped in animal form. The wild man donor is
      ambivalent and initiatory: he drags hunters and dogs under water,
      is caged like a beast, demands release, tests the boy at the
      golden well, then supplies war-horses, armour, and final treasure
      after his own enchantment is broken. KHM 136 needs the slot so
      Iron John is not flattened into generic donor, predator, or king.
    tier: structural
    scope: entity
    lens: structural
    domains: [wild-man, forest, initiation, donor, enchantment]
    related: [arc_supernatural_donor, arc_enchanted_prince, loc_forest, state_cursed]
    examples: [iron_john]

  arc_supernatural_godfather:
    name: Supernatural Godfather
    description: |
      Otherworldly sponsor chosen to stand as godparent for a child,
      granting fortune, healing skill, knowledge, or a dangerous gift
      bound to non-human rules.
    rationale: |
      Distinct from `arc_supernatural_donor`, whose encounter is a
      general test-and-reward scene, and from `arc_oath_enforcer`,
      whose role is human authority over promises. The supernatural
      godfather creates fictive kinship: the gift is not merely found
      but inherited through ritual sponsorship. ATU 332 needs this
      role because Death or a horned infernal figure becomes family-
      sponsor, patron, and threat at once.
    tier: structural
    scope: entity
    lens: atu
    domains: [godparent, death, gift, kinship, supernatural]
    related: [being_death, being_devil, obj_death_diagnostic_remedy, law_death_position_determines_healing]
    examples: [the_godfather_stranger, godfather_death]

  arc_grotesque_task_helper:
    name: Grotesque Task Helper
    description: |
      Helper whose exaggerated body shows the cost of specialised
      labour and who completes an impossible domestic task in exchange
      for social recognition, kinship naming, or a place at the table.
    rationale: |
      Distinct from `arc_supernatural_donor`, who tests conduct and
      rewards virtue. The grotesque task helper solves labour rather
      than judges character, and their body is evidence: broad foot
      from treading, hanging lip from licking, broad thumb from
      twisting thread. KHM 14 needs this role because the helpers'
      deformity is what frees the bride from future spinning. The slot
      supports queries for helper bodies that reveal labour costs.
    tier: structural
    scope: entity
    lens: structural
    domains: [helper, labour, body, domestic-work, grotesque]
    related: [agency_domestic_labor, moral_comic_inversion]
    examples: [three_spinning_women_helpers]

  arc_abandoned_child:
    name: Abandoned Child
    description: |
      Child deliberately left in wilderness, forest, water, or road by
      parents or guardians because household resources, fear, or malice
      override the duty of care.
    rationale: |
      Distinct from `arc_oppressed_maiden` (domestic subordination)
      and from `arc_naive_victim` (deceived trust). The abandoned child
      is structurally defined by expulsion from the household into a
      lethal outside. KHM 15 uses the role twice: Hansel and Gretel are
      led into the forest and left by the fire. The archetype enables
      queries over child-exposure, famine households, and returns from
      abandonment.
    tier: structural
    scope: entity
    lens: structural
    domains: [child, abandonment, forest, household, famine]
    related: [loc_forest, law_forest_suspends_domestic_order, arc_cruel_stepmother]
    examples: [hansel, gretel]

  arc_pious_orphan:
    name: Pious Orphan
    description: |
      Parentless child whose vulnerability is joined to religious
      trust, goodness, and generosity toward people in equal or greater
      bodily need.
    rationale: |
      Distinct from `arc_abandoned_child`, whose plot centers on
      deliberate caregiver exposure, and from `arc_oppressed_maiden`,
      whose suffering is structured by household persecution. The
      pious orphan has no household left at all; her agency comes
      through faith and almsgiving despite total poverty. KHM 153
      needs this archetype because the girl is not rescued from a
      villain but rewarded after self-divesting charity under divine
      order.
    tier: structural
    scope: entity
    lens: cognitive
    domains: [orphan, piety, poverty, charity, vulnerability]
    related: [moral_providential_election, moral_kindness_rewarded, affect_pity]
    examples: [the_star_money]

  arc_foundling_child:
    name: Foundling Child
    description: |
      Child removed from ordinary parental care by accident, animal
      abduction, exposure, or discovery, then raised inside another
      household under a name that remembers the finding.
    rationale: |
      Distinct from `arc_abandoned_child`, whose crisis starts with
      deliberate caregiver disposal, and from `arc_youngest_sibling`,
      whose role comes from birth order. The foundling is defined by
      interrupted origin and adoptive naming: Fundevogel is carried off
      by a bird of prey, found in a tree by the forester, and named for
      that event. This slot enables queries over displaced children
      whose identity is anchored in how they were found rather than in
      bloodline rank or abandonment.
    tier: structural
    scope: entity
    lens: structural
    domains: [foundling, child, adoption, naming, animal-abduction]
    related: [arc_abandoned_child, sp_bird, loc_tree]
    examples: [foundling_bird_fundevogel]

  arc_changeling:
    name: Changeling
    description: |
      Otherworldly substitute child placed in a human cradle in place
      of the stolen human infant, marked by uncanny body, appetite,
      age, speech, or behaviour.
    rationale: |
      Distinct from `arc_abandoned_child`, where human caregivers
      expose or leave a child, and from `being_dwarf`, which names the
      general small supernatural being-type. The changeling is a
      relational role created by substitution: the human mother loses
      her child and receives a grotesque replacement who eats, drinks,
      and speaks with impossible age. KHM 39 needs this archetype to
      model elf-child theft without flattening the substitute into a
      generic little man.
    tier: structural
    scope: entity
    lens: structural
    domains: [child, substitution, elves, cradle, uncanny]
    related: [being_dwarf, law_absurd_task_exposes_changeling, moral_restorative]
    examples: [elves_changeling]

  arc_luck_child:
    name: Luck-Child
    description: |
      Child marked at birth by caul, omen, prophecy, or fate so that
      hostile attempts to destroy or divert them become the very means
      by which their promised fortune is fulfilled.
    rationale: |
      Distinct from `arc_abandoned_child`, whose plot begins with
      exposure by family need or malice, and from `arc_youngest_sibling`,
      whose success comes from ordinal position. The luck-child is
      structurally protected by foretold fortune: sale, drowning,
      murder-letter, forest thieves, and impossible hell-quest all turn
      into adoption, marriage, wealth, and victory. KHM 29 needs this
      archetype because the hero's agency is less clever planning than
      being carried by a fate that makes enemy actions self-defeating.
    tier: structural
    scope: entity
    lens: structural
    domains: [luck, prophecy, child, fate, reversal]
    related: [law_fated_luck_fulfills_prophecy, speech_prophecy, moral_trickster_wins]
    examples: [devil_golden_hairs_luck_child]

  arc_wondrous_twin:
    name: Wondrous Twin / Gold Twin
    description: |
      One of a pair of siblings born or generated through magical
      substance, often marked by shared material tokens, matching
      animals, or identical appearance that allows substitution and
      rescue.
    rationale: |
      Distinct from `arc_youngest_sibling`, which depends on ordinal
      family position, and from generic `arc_luck_child`, whose fortune
      may be singular and prophecy-driven. Wondrous twins are relational
      from origin: in KHM 85 the divided fish body produces two golden
      children, two golden foals, and two golden lilies, so each brother
      has a counterpart and a fate-token. The archetype supports ATU
      303 queries over doubled heroes without forcing every twin into
      dragon-slayer or false-hero roles.
    tier: structural
    scope: entity
    lens: structural
    domains: [twins, gold, birth, life-token, rescue]
    related: [obj_life_reporting_plant, agency_object_mediation]
    examples: [gold_children_first_brother, gold_children_second_brother]

  arc_tiny_hero:
    name: Tiny Hero
    description: |
      Protagonist whose body is radically smaller than human scale but
      whose wit, voice, and mobility let them act effectively inside
      spaces and bodies ordinary people cannot enter.
    rationale: |
      Distinct from `arc_fool`, whose comic force is defective
      judgment, and from `arc_luck_child`, whose safety comes from
      fate. The tiny hero's agency is spatial and acoustic: Thumbling
      drives from a horse's ear, escapes into a mouse-hole, sleeps in a
      snail-shell, survives cow and wolf interiors, and uses hidden
      speech to redirect larger actors. The archetype enables queries
      for scale-based heroism across Tom Thumb / Thumbling variants.
    tier: structural
    scope: entity
    lens: structural
    domains: [smallness, mobility, hidden-agency, trickster, child]
    related: [law_tiny_body_enables_hidden_agency, moral_trickster_wins]
    examples: [thumbling]

  arc_treacherous_spouse:
    name: Treacherous Spouse
    description: |
      Husband or wife who uses the intimacy and trust of marriage to
      betray, murder, abandon, or replace the spouse, often with a new
      lover or political advantage in view.
    rationale: |
      Distinct from `arc_false_bride`, who impersonates or substitutes
      for a rightful bride, and from generic `arc_trickster`, whose
      deception is not necessarily marital. The treacherous spouse is
      already inside the lawful marriage bond; the violation is
      therefore betrayal from within intimacy. KHM 16 needs this
      because the resurrected queen does not usurp another bride's
      place: she murders the husband who fulfilled the burial oath and
      plots remarriage to the skipper.
    tier: structural
    scope: entity
    lens: structural
    domains: [marriage, betrayal, murder, intimacy, adultery]
    related: [law_promise_binds_reality, speech_lie, moral_retributive]
    examples: [three_snake_leaves_young_queen]

  arc_hypocritical_cleric:
    name: Hypocritical Cleric
    description: |
      Religious office-holder who uses sacred authority, preaching,
      ritual trust, or public piety for private appetite, deception,
      or sexual access.
    rationale: |
      Distinct from `being_divine`, which names supernatural sacred
      agency, and from generic `arc_trickster`, whose deception need
      not be institutional. The hypocritical cleric's power comes from
      a social-sacred office: in KHM 95 the parson turns the pulpit
      itself into a device for removing the husband. The slot enables
      queries over anticlerical schwanks, religious hypocrisy, and
      sacred speech misused as domestic manipulation.
    tier: structural
    scope: entity
    lens: structural
    domains: [cleric, hypocrisy, religion, adultery, schwank]
    related: [agency_social_rank, agency_speech, speech_lie, moral_retributive]
    examples: [old_hildebrand_parson]

  arc_proud_task_princess:
    name: Proud Task Princess
    description: |
      Royal bride-figure who withholds marriage from a socially lower
      or unwanted suitor by imposing dangerous, impossible, or escalating
      tasks, often after an initial task has already been satisfied.
    rationale: |
      Distinct from `arc_reluctant_bride`, who is bound by oath to a
      repulsive partner, and from `arc_unlaughing_princess`, whose
      affective lack defines the trial. The proud task princess is a
      status-gatekeeper: her pride converts marriage into serial ordeal.
      KHM 17 needs this because the king's daughter rejects the servant
      after he retrieves the sea-ring and keeps adding tasks until the
      animal helpers and Apple of Life overcome her pride.
    tier: structural
    scope: entity
    lens: structural
    domains: [princess, pride, marriage, difficult-task, social-rank]
    related: [func_difficult_task, agency_social_rank, affect_pride]
    examples: [white_snake_princess]

  arc_proud_rejecting_bride:
    name: Proud Rejecting Bride
    description: |
      Royal bride-figure who rejects suitors through mockery,
      rank-scorn, bodily ridicule, or refusal before any trial or task
      can begin.
    rationale: |
      Distinct from `arc_proud_task_princess`, who converts marriage
      into explicit tasks, and from `arc_reluctant_bride`, whose
      refusal is driven by disgust, fear, or oath-pressure rather than
      social contempt. The proud rejecting bride attacks suitors'
      worth directly, using rank and appearance as weapons. KHM 52
      needs this role because the princess does not impose a quest; she
      ridicules every suitor until her father and Thrushbeard answer
      pride with staged social descent.
    tier: structural
    scope: entity
    lens: structural
    domains: [princess, pride, marriage, mockery, social-rank]
    related: [affect_pride, agency_social_rank, moral_humbling_reform]
    examples: [king_thrushbeard_princess]


# =============================================================================
# WORLD_LAWS — operational tier, scope: world
# =============================================================================
# Why this category: rules of reality that the tale-world OBEYS, not
# rules that characters know. World laws are what makes a folktale
# different from realist fiction. They're the ontological grammar.

world_laws:

  law_promise_binds_reality:
    name: Promise Binds Reality
    description: |
      Promises, vows, and bargains create binding consequences beyond
      ordinary social agreement. Breaking is not merely impolite — the
      tale-world materially enforces compliance.
    rationale: |
      The single most generative world-law in Grimm — it underlies the
      Frog King, Rumpelstiltskin, the Fisherman's Wife, many magic
      bargains. Without naming it as a law (rather than just a theme
      like "broken promise"), we cannot say WHY the tale-world makes
      promises bind. The law makes the difference between "she felt
      guilty" (realism) and "the father commands her, the frog enters
      her bedchamber" (fairy-tale ontology) explicit.
    tier: operational
    scope: world
    lens: structural
    domains: [oath, promise]
    related: [speech_promise, state_bound_by_promise, arc_oath_enforcer]
    examples: [the_frog_king, rumpelstiltskin]

  law_first_homecoming_claims_promised_child:
    name: First Homecoming Encounter Claims the Promised Child
    description: |
      A promise to give whatever first meets the traveller at home or
      in the courtyard converts the domestic greeting scene into a
      binding claim, usually over a daughter who runs out to welcome
      the returning parent.
    rationale: |
      Distinct from broad `law_promise_binds_reality`, which covers
      any oath, bargain, or pledge. This law names the specific
      first-encounter formula: the promised object is unknown when the
      vow is made, and the emotional homecoming that should restore
      the family instead transfers a child into marriage obligation.
      KHM 108 uses it twice, contrasting a deceitful written evasion
      with a king whose daughter willingly fulfils the same formula.
    tier: operational
    scope: world
    lens: structural
    domains: [promise, homecoming, daughter, marriage, return]
    related: [law_promise_binds_reality, speech_promise, state_bound_by_promise, arc_reluctant_bride]
    examples: [hans_hedgehog_first_princess, hans_hedgehog_second_princess]

  law_personal_release_promise_rejects_substitutes:
    name: Personal Release Promise Rejects Substitutes
    description: |
      A promise to release and marry an enchanted being must be fulfilled
      by the exact promised person; socially convenient substitutes
      cannot satisfy the bond even if they perform the same outward task.
    rationale: |
      Distinct from broad `law_promise_binds_reality`, which says that
      vows bind, and from `arc_false_bride`, which names a rival role.
      This law names the operational test of identity: miller's daughter
      and swineherd's daughter can scrape the iron, but the enchanted
      speaker detects their lower household origins and refuses them.
      KHM 127 needs it because the promise binds the king's daughter
      personally, not any beautiful replacement sent by her father.
    tier: operational
    scope: world
    lens: structural
    domains: [promise, identity, substitute, bride, enchantment]
    related: [law_promise_binds_reality, state_bound_by_promise, arc_reluctant_bride, arc_false_bride]
    examples: [iron_stove_millers_daughter, iron_stove_swineherds_daughter]

  law_broken_speech_limit_exiles_released_bridegroom:
    name: Broken Speech Limit Exiles Released Bridegroom
    description: |
      After a bride releases an enchanted bridegroom, a narrowly limited
      home visit depends on verbal restraint; speaking beyond the limit
      removes the bridegroom across remote and dangerous thresholds.
    rationale: |
      Distinct from `law_forbidden_light_exiles_animal_bridegroom`,
      where accidental light breaks the marriage, and from
      `law_homecoming_kiss_erases_bride_memory`, where another person's
      kiss causes forgetting. Here the bride's own excess speech to her
      father reopens distance: the stove disappears beyond glass
      mountains, piercing swords, and a lake. The law supports queries
      over lost-husband tales where the failure is not sight or memory
      but too much speech at home.
    tier: operational
    scope: world
    lens: structural
    domains: [speech, taboo, homecoming, lost-husband, threshold]
    related: [speech_promise, state_forgotten_bride, law_voice_recognizes_forgotten_bride, threshold_doorway]
    examples: [iron_stove_three_word_limit]

  law_disguised_status_descent_humbles:
    name: Disguised Status Descent Humbles
    description: |
      A high-status character's pride can be corrected by a staged
      descent into poverty, labour, and public shame, orchestrated by a
      disguised superior who later reveals the lesson.
    rationale: |
      Distinct from `law_disguise_alters_social_reality`, where
      disguise makes others misrecognise a person, and from
      `law_promise_binds_reality`, where oath-keeping alone drives the
      plot. Here disguise is pedagogical theatre: King Thrushbeard
      becomes fiddler, beggar-husband, and hussar so the princess
      experiences hunger, work, market failure, kitchen service, and
      ridicule. KHM 52 needs the law for queries over rank inversion,
      corrective humiliation, and pride reformation rather than mere
      marriage deception.
    tier: operational
    scope: world
    lens: structural
    domains: [humiliation, disguise, social-rank, labour, marriage]
    related: [state_disguised, arc_proud_rejecting_bride, moral_humbling_reform, agency_social_rank]
    examples: [king_thrushbeard]

  law_insatiable_wishing_reverts_gifts:
    name: Insatiable Wishing Reverts Gifts
    description: |
      Repeatedly granted wishes escalate desire rather than satisfying
      it; when the wisher exceeds the tale-world's final boundary, all
      previous gains collapse back to the original poverty or lack.
    rationale: |
      Distinct from `law_promise_binds_reality`, which enforces a
      pledge, and from `law_kindness_to_hidden_donors_rewarded`, which
      rewards conduct. This law is about the unstable economy of
      magical wish-granting: each granted rank licenses a greater
      demand until the request to occupy divine order triggers total
      reversal. KHM 19 is the paradigm and needs a law that explains
      why the gifts vanish, not merely that the wife was greedy.
    tier: operational
    scope: world
    lens: structural
    domains: [wishing, greed, escalation, reversal, power]
    related: [arc_greedy_one, speech_wish, moral_overreach_reversal]
    examples: [the_fisherman_and_his_wife]

  law_secret_breach_reverts_fish_gift:
    name: Secret Breach Reverts Fish Gift
    description: |
      A supernatural fish grants household abundance on condition that
      its source remain undisclosed; speaking the source instantly
      collapses the gift back into poverty.
    rationale: |
      Distinct from `law_insatiable_wishing_reverts_gifts`, where
      escalating desire overreaches a final boundary, and from
      `law_promise_binds_reality`, where a social pledge constrains
      conduct. Here one disclosed sentence is enough: castle, cupboard,
      clothing, and food vanish because the source of luck is named.
      KHM 85 needs this law because its ATU 555 opening is not about
      asking for too much but about curiosity breaking a secrecy
      condition.
    tier: operational
    scope: world
    lens: structural
    domains: [fish, secrecy, abundance, curiosity, reversal]
    related: [sp_fish, affect_greed, law_insatiable_wishing_reverts_gifts]
    examples: [the_gold_children]

  law_divided_magic_body_generates_gold_triplets:
    name: Divided Magic Body Generates Gold Triplets
    description: |
      A magical creature's body is divided and distributed among human,
      animal, and earth recipients, producing parallel golden offspring,
      animals, and plants.
    rationale: |
      Distinct from `law_magic_bird_organs_generate_gold`, where
      specific organs produce recurring wealth for the eater, and from
      ordinary fertility blessings. KHM 85's golden fish body is
      multiplexed: two pieces eaten by the wife become two gold
      children, two fed to the horse become two gold foals, and two
      buried in the ground become two gold lilies. The law lets
      substance-distribution and parallel life-token generation be
      queried apart from simple treasure or birth magic.
    tier: operational
    scope: world
    lens: material
    domains: [body, fish, gold, twins, plants, horses]
    related: [sp_fish, obj_life_reporting_plant, arc_wondrous_twin, sp_horse]
    examples: [the_gold_children]

  law_nature_mirrors_moral_excess:
    name: Nature Mirrors Moral Excess
    description: |
      Weather, sea, sky, wind, and landscape visibly intensify in step
      with moral disorder or overreaching desire. The natural world is
      an affective diagnostic, not neutral scenery.
    rationale: |
      Distinct from `law_forest_suspends_domestic_order`, which names a
      jurisdictional change after entering the forest, and from
      `loc_sea`, which is a place-type. This law tracks environmental
      mirroring: in KHM 19 the sea moves from clear to green-yellow,
      purple, black, boiling, and mountainous as Ilsabil's wishes
      escalate. It enables queries for tales where landscape records
      moral pressure before punishment lands.
    tier: operational
    scope: world
    lens: cognitive
    domains: [nature, weather, sea, moral-state, escalation]
    related: [loc_sea, affect_greed, moral_overreach_reversal]
    examples: [the_fisherman_and_his_wife]

  law_curse_requires_counter_condition:
    name: Curse Requires Counter-Condition
    description: |
      A curse is real and persistent but bounded by a specific release
      condition. Common counter-conditions: act of kindness, marriage,
      transgression of false form, recognition.
    rationale: |
      Curses in Grimm are NEVER unconditional or arbitrary — they
      always have a release-rule, often known only to the curse-worker.
      This is the ontological complement to `state_cursed`: the state
      describes the being, the law describes the world's rule that
      bounds the state. Together they let us model curse-economy
      (every curse implies a release path).
    tier: operational
    scope: world
    lens: structural
    domains: [curse, release]
    related: [state_cursed, transform_release_by_violence, transform_curse]
    examples: [the_frog_king, briar_rose, the_raven]

  law_enchanted_perimeter_immobilizes_intruders:
    name: Enchanted Perimeter Immobilizes Intruders
    description: |
      A magical boundary around a hostile dwelling fixes intruders in
      place once they cross the measured perimeter. The boundary acts
      before combat or negotiation and can only be suspended by the
      boundary-holder or a counter-magic.
    rationale: |
      Distinct from `threshold_forest`, where the whole forest changes
      jurisdiction, and from `state_trapped`, which names mundane
      confinement. KHM 69 needs this law because the witch's castle
      generates a precise one-hundred-pace immobilising circle:
      men stand fast, maidens become birds, and Joringel can only
      re-enter after the flower cancels the perimeter. This enables
      queries for spatial magic whose power is measured as distance
      from a lair.
    tier: operational
    scope: world
    lens: structural
    domains: [threshold, castle, witchcraft, immobilization, perimeter]
    related: [threshold_enchantment_circle, being_witch, num_100, state_trapped]
    examples: [jorinda_and_joringel]

  law_disenchanting_flower_breaks_witchcraft:
    name: Disenchanting Flower Breaks Witchcraft
    description: |
      A found flower, recognized through dream or quest, frees beings,
      doors, cages, and hostile magical space from witchcraft by
      direct touch.
    rationale: |
      Distinct from `law_curse_requires_counter_condition`, which
      only says that a release condition exists, and from
      `obj_enchanting_wand`, which authorizes active transformation.
      This law names a contact-based botanical counter-magic: in KHM
      69 the blood-red flower neutralizes the castle perimeter, opens
      the door, breaks the bird-cages' enchantment, and prevents the
      witch from bewitching again. It supports queries for vegetal
      remedies that undo magic without violence, marriage, or speech.
    tier: operational
    scope: world
    lens: material
    domains: [flower, counter-magic, witchcraft, restoration, touch]
    related: [obj_disenchanting_flower, law_curse_requires_counter_condition, being_witch, moral_restorative]
    examples: [jorinda_and_joringel]

  law_four_leaf_clover_sight_breaks_illusion:
    name: Four-Leaf Clover Sight Breaks Illusion
    description: |
      Possession of a four-leaf clover grants clear sight through
      magical deception, letting the bearer publicly identify the
      ordinary thing beneath an enchanted appearance and dissolve the
      illusion.
    rationale: |
      Distinct from `law_disenchanting_flower_breaks_witchcraft`, where
      touch with a magical flower releases bodies and doors from a
      witch's enchantment, and from `state_deceived`, which only names
      a victim's condition. KHM 149 needs this law because the girl
      does not counterspell by force; the clover changes perception so
      "beam" is seen as straw, and public naming makes the crowd see
      it too. The node supports queries over truth-sight objects,
      illusion exposure, and anti-enchantment perception.
    tier: operational
    scope: world
    lens: material
    domains: [illusion, sight, clover, truth, disenchantment]
    related: [obj_four_leaf_truth_clover, state_deceived, being_wizard, speech_testimony]
    examples: [beam_truth_clover]

  law_revenge_illusion_transfers_public_shame:
    name: Revenge Illusion Transfers Public Shame
    description: |
      A shamed enchanter can answer exposure by casting a new perceptual
      illusion on the exposer at a public threshold, making the former
      truth-teller appear foolish or indecent before the crowd.
    rationale: |
      Distinct from `law_four_leaf_clover_sight_breaks_illusion`, which
      cancels deception through clear sight, and from ordinary
      `moral_retributive`, which presumes legitimate justice. KHM 149
      needs this law because the magician's revenge mirrors the first
      exposure: he was driven away in shame when beam became straw; she
      is driven away in ridicule when stream becomes flax-field. The
      law enables queries over magical shame-reversal and perception as
      social weapon.
    tier: operational
    scope: world
    lens: cognitive
    domains: [illusion, revenge, shame, crowd, perception]
    related: [law_four_leaf_clover_sight_breaks_illusion, being_wizard, affect_shame, moral_comic_inversion]
    examples: [beam_bride_flax_illusion]

  law_might_unmakes_promise:
    name: Might Unmakes Promise
    description: |
      In beast-fable and secular-cynical tales, partnerships between
      unequal parties do not bind: the stronger party can break the
      vow, betray the partner, and consume them. No supernatural
      enforcement intervenes.
    rationale: |
      The structural INVERSE of `law_promise_binds_reality`. Captures
      the subgenre-distinction between magic tales (where promises
      have ontological weight enforced by parental authority and
      cosmic regularity) and beast fables (where promises are merely
      social, and power-imbalance trivially dissolves them). Without
      this contrast law, we cannot distinguish KHM 2 (where the cat
      breaks the partnership freely) from KHM 1 (where the king
      enforces the princess's promise). The Grimm corpus contains
      BOTH worlds; the gold layer must model both.
    tier: operational
    scope: world
    lens: structural
    domains: [oath, promise, power-imbalance]
    related: [arc_predator, arc_naive_victim, moral_naive_punished]
    examples: [cat_and_mouse_in_partnership]

  law_human_artifice_overmasters_animal_force:
    name: Human Artifice Overmasters Animal Force
    description: |
      Human strength exceeds animal strength not through bare body but
      through tools, weapons, tactics, and technical misrecognition:
      gun, blade, and calculated retreat turn a predator's charge into
      defeat.
    rationale: |
      Distinct from `law_might_unmakes_promise`, where stronger animal
      force simply overrides a partnership, and from
      `law_collective_noise_magnifies_the_weak`, where a group wins by
      confusing enemies. KHM 72 needs this law because the fox's thesis
      is explicitly comparative: no animal can withstand man, so
      animals must use cunning. The wolf tests bodily courage against a
      hunter's firearm and hanger, then explains the weapons as stick,
      breath, and white rib. This slot enables queries over tales where
      human technology, not moral virtue or magic, defeats animal force.
    tier: operational
    scope: world
    lens: material
    domains: [human, animal, weapon, technology, predator]
    related: [sp_human, sp_wolf, sp_fox, agency_violence, agency_cunning]
    examples: [the_wolf_and_the_man]

  law_gluttony_traps_predator:
    name: Gluttony Traps the Predator
    description: |
      A predator or stronger companion can obtain food safely through a
      cunning helper's limited plan, but repeated over-eating or
      returning for more exposes the predator to human punishment,
      injury, or death.
    rationale: |
      Distinct from `law_might_unmakes_promise`, where strength
      simply dominates a weaker partner, and from `affect_greed`,
      which names the felt desire. This law names the operational
      consequence of appetite without limit: in KHM 73 the fox can
      steal one lamb, six pancakes, and escape through the cellar-hole,
      but the wolf's demand for more makes him noisy, beaten, fat, and
      finally stuck. It enables queries over predator tales where
      hunger ceases to be hunting power and becomes self-entrapment.
    tier: operational
    scope: world
    lens: structural
    domains: [gluttony, predator, appetite, trap, animal-tale]
    related: [affect_greed, arc_predator, sp_wolf, sp_fox, moral_retributive]
    examples: [the_wolf_and_the_fox]

  law_feigned_injury_compels_care:
    name: Feigned Injury Compels Care
    description: |
      A trickster pretends to be badly injured so that the recently
      harmed or deceived victim must carry, nurse, or protect the
      trickster, turning the victim's remaining compassion or kin duty
      into transport.
    rationale: |
      Distinct from `law_feigned_death_tests_fidelity`, where apparent
      death tests a spouse's loyalty, and from `law_gluttony_traps_
      predator`, where appetite creates the trap. KHM 74 needs this
      law because the fox's decisive trick occurs after the she-wolf is
      already scalded: he lies that every limb is broken, and her
      concern makes her carry him home. This slot enables queries over
      false suffering as a tactical extraction of care.
    tier: operational
    scope: world
    lens: cognitive
    domains: [deception, injury, care, kinship, transport]
    related: [arc_trickster, speech_lie, affect_pity, sp_fox]
    examples: [the_fox_and_his_cousin]

  law_single_escape_skill_beats_boasted_arts:
    name: Single Escape Skill Beats Boasted Arts
    description: |
      One modest, embodied escape skill can preserve life better than a
      large advertised repertoire of cleverness when danger arrives
      suddenly.
    rationale: |
      Distinct from `law_boast_generates_reputation`, where a boast
      creates social power, and from `agency_cunning`, which can be a
      real tactical capacity. KHM 75 needs this law because the fox's
      hundred arts and sackful of cunning fail at the instant of the
      hounds, while the cat's single art — climbing a tree — succeeds.
      This slot enables queries over tales where practical minimalism
      defeats performative expertise.
    tier: operational
    scope: world
    lens: cognitive
    domains: [skill, escape, boast, prudence, animal-tale]
    related: [sp_cat, sp_fox, affect_pride, moral_prudential_retreat]
    examples: [the_fox_and_the_cat]

  law_endless_prayer_suspends_predation:
    name: Endless Prayer Suspends Predation
    description: |
      A prey group delays being eaten by securing permission for a
      final pious act, then making that act indefinitely long so that
      death remains formally pending but narratively never arrives.
    rationale: |
      Distinct from `law_might_unmakes_promise`, where brute force
      simply cancels social obligation, and from `law_speech_taken_
      literally`, where misunderstanding drives the joke. KHM 86 needs
      this law because the geese do not overpower or deceive the fox
      with false facts; they convert his small concession into an
      endless ritual delay. The slot enables queries over tales where
      speech-time itself, especially prayer, suspends violence.
    tier: operational
    scope: world
    lens: structural
    domains: [prayer, delay, predation, animal-tale, comic-suspension]
    related: [speech_prayer, arc_predator, sp_fox, sp_goose, moral_comic_inversion]
    examples: [the_fox_and_the_geese]

  law_prohibition_invites_violation:
    name: Prohibition Invites Violation
    description: |
      Any explicitly stated prohibition will be tested and broken.
      The act of forbidding generates the desire to transgress — the
      Pandora pattern, the Eden pattern, the forbidden door. The
      law operates regardless of whether the protagonist is wicked:
      curiosity alone suffices.
    rationale: |
      A meta-narrative world-law that connects all "forbidden door"
      tales (Our Lady's Child, Fitcher's Bird, Bluebeard variants).
      Distinct from `law_promise_binds_reality` because the binding
      runs the OTHER way: a prohibition does not BIND obedience, it
      INVITES transgression. The law captures Propp's interdiction-
      violation pair as a generative cosmic regularity, not just a
      sequence of two functions.
    tier: operational
    scope: world
    lens: structural
    domains: [prohibition, curiosity, transgression]
    related: [arc_prohibition_giver, speech_prohibition, affect_curiosity]
    examples: [our_ladys_child, fitchers_bird]

  law_golden_well_marks_failed_guardianship:
    name: Golden Well Marks Failed Guardianship
    description: |
      A forbidden golden spring or well must be guarded from pollution;
      each accidental contact gilds the body part that touched it,
      making failed obedience visible and eventually producing a
      hidden golden-hair identity sign.
    rationale: |
      Distinct from `law_prohibition_invites_violation`, which names
      the broad pressure to break a ban, and from
      `law_true_fit_reveals_identity`, where an object fits only the
      rightful person. Here the mark is generated by failed
      guardianship: finger, hair, and whole head touch the gold well
      across a threefold trial. KHM 136 needs this law because the
      boy's expulsion, poverty-learning, cap disguise, princess
      recognition, festival proof, and final marriage all depend on
      golden hair as both fault-mark and hidden royal sign.
    tier: operational
    scope: world
    lens: material
    domains: [well, gold, prohibition, initiation, hidden-identity]
    related: [loc_well, obj_golden_ball, state_hidden_identity, arc_wild_man_donor, num_3]
    examples: [iron_john_golden_well]

  law_repentance_restores:
    name: Repentance Restores
    description: |
      Sincere confession of fault, at the moment of greatest danger,
      undoes prior consequences. The lost is returned, the cursed is
      released, the condemned is saved. The law is specifically
      sacred-register: it only operates within a moral economy of
      sin/forgiveness.
    rationale: |
      Distinct from `law_curse_requires_counter_condition` (which is
      mechanistic — counter-condition met, curse lifted, no moral
      content) — `law_repentance_restores` REQUIRES inner moral
      change. The queen's confession in KHM 3 doesn't just satisfy a
      release-condition mechanically; it expresses repentance, which
      is what triggers Mary's forgiveness. Without naming this
      separately, religious-legend tales' moral architecture
      collapses into the same model as magic-curse tales.
    tier: operational
    scope: world
    lens: structural
    domains: [repentance, forgiveness, religious]
    related: [arc_repentant_sinner, moral_repentance, speech_confession]
    examples: [our_ladys_child]

  law_fearlessness_defeats_supernatural:
    name: Fearlessness Defeats the Supernatural
    description: |
      Ghosts, spirits, and supernatural threats derive their power
      from the fear they provoke. A protagonist who feels no fear is
      immune: the ghosts cannot harm what cannot be terrified.
    rationale: |
      A distinctive world-law of the haunted-castle / horror-jocular
      subgenre. Distinct from `law_promise_binds_reality` and
      `law_curse_requires_counter_condition` — this law specifies a
      MECHANISM of supernatural threat (fear-feeding) and its
      counter (fearless-witness). Without naming it, KHM 4's plot
      reads as "hero is too dumb to notice" — but the structural
      truth is "the supernatural cannot bind the fearless."
    tier: operational
    scope: world
    lens: structural
    domains: [fear, supernatural, immunity]
    related: [arc_fearless_fool, state_fearless, affect_fear, being_spirit]
    examples: [youth_who_went_forth_to_learn_fear]

  law_devouring_can_be_reversed:
    name: Devouring Can Be Reversed
    description: |
      In Grimm's tale-world, being swallowed whole is not death.
      The devoured remain alive inside the devourer until rescued
      by surgical or violent retrieval. Belly-as-prison rather than
      belly-as-tomb.
    rationale: |
      A specific world-law of the magic-register that distinguishes
      Grimm's predator tales from the beast-fable register (KHM 2
      where devouring is final). The kids in KHM 5 are swallowed and
      rescued intact; the same applies to Little Red Cap and her
      grandmother. Without this law we lose the ontological
      distinction: in beast-fable consumption ends life, in magic-
      tale consumption is reversible. The law explains WHY the
      mother's surgical rescue WORKS rather than being macabre.
    tier: operational
    scope: world
    lens: structural
    domains: [devouring, body, reversibility]
    related: [state_devoured_but_alive, arc_protective_mother]
    examples: [the_wolf_and_the_seven_young_kids, little_red_cap]

  law_prophecy_compels_sacrifice:
    name: Prophecy Compels Sacrifice
    description: |
      One who overhears prophetic speech (often from non-human
      mouths — ravens, fish, winds) becomes OBLIGATED to act on it
      AND bears a material cost for telling. The information is
      asymmetric: those who know, must act in silence; if they
      speak the prophecy, they pay with their body (petrification,
      death, mutilation).
    rationale: |
      A distinctive world-law of magic-tale subgenre. Distinct from
      `law_curse_requires_counter_condition` because the cost falls on
      the PROPHET-KEEPER (not the cursed), and from
      `law_promise_binds_reality` because no promise was made — the
      binding is purely epistemic. KHM 6 is the paradigm: John
      overhears ravens, must act on three warnings, and turns to
      stone the moment he explains why. The law gives a structural
      reason for the "silent loyal servant" trope.
    tier: operational
    scope: world
    lens: structural
    domains: [prophecy, silence, knowledge, sacrifice]
    related: [speech_prophecy, state_petrified, arc_faithful_servant, transform_petrification]
    examples: [faithful_john]

  law_fated_luck_fulfills_prophecy:
    name: Fated Luck Fulfills Prophecy
    description: |
      A foretold lucky destiny protects itself by converting hostile
      interventions into steps toward fulfilment rather than allowing
      them to cancel the prophecy.
    rationale: |
      Distinct from `law_prophecy_compels_sacrifice`, where knowledge
      of prophecy imposes cost on the hearer, and from `law_promise_
      binds_reality`, where a voluntary utterance binds action. Here
      prophecy is not a burden but a resilient fate: the king's attempt
      to drown the caul-born child creates the foundling adoption; the
      death-letter becomes a marriage-letter; the hell-quest brings
      wealth and finally traps the greedy king at the ferry. This law
      enables queries over tales where opposition accelerates, rather
      than blocks, predicted fortune.
    tier: operational
    scope: world
    lens: structural
    domains: [fate, luck, prophecy, reversal, child]
    related: [arc_luck_child, speech_prophecy, moral_trickster_wins]
    examples: [the_devil_with_the_three_golden_hairs]

  law_purity_blocks_infernal_claim:
    name: Purity Blocks Infernal Claim
    description: |
      The devil can claim a promised human only if bodily or spiritual
      impurity gives him access; washing, tears, prayer, and pious
      innocence create a protective boundary he cannot cross.
    rationale: |
      Distinct from `law_promise_binds_reality`, which makes a pledge
      socially or magically binding, and from `law_repentance_restores`,
      where confession after sin restores the guilty. Here the innocent
      is protected before any fall: clean body, tear-washed stumps, and
      fear of God defeat the devil's contractual claim even after the
      father has promised her. KHM 31 needs this law because mutilation
      does not save the devil's bargain; purity nullifies infernal
      access.
    tier: operational
    scope: world
    lens: structural
    domains: [purity, devil, tears, piety, protection]
    related: [being_devil, law_promise_binds_reality, moral_restorative]
    examples: [the_girl_without_hands]

  law_false_letters_exile_innocent:
    name: False Letters Exile the Innocent
    description: |
      Written commands can be intercepted and substituted so that a
      protective message becomes accusation, death-sentence, or exile
      against an innocent absent party.
    rationale: |
      Distinct from `speech_lie`, which is immediate spoken deception,
      and from `law_fated_luck_fulfills_prophecy`, where the false
      letter reverses to fulfil destiny. This law names the material
      communication vulnerability itself: messengers sleep, letters are
      swapped, and distant authority acts on forged text. KHM 29 uses a
      death-letter changed to marriage; KHM 31 uses repeated devilish
      substitutions to exile the queen and child. The entry enables
      queries over textual mediation, absence, and false authority.
    tier: operational
    scope: world
    lens: structural
    domains: [letter, deception, exile, absence, authority]
    related: [speech_lie, agency_cunning, state_hidden_identity]
    examples: [the_devil_with_the_three_golden_hairs, the_girl_without_hands]

  law_feigned_death_tests_fidelity:
    name: Feigned Death Tests Fidelity
    description: |
      A spouse's apparent death creates a social experiment: grief,
      courtship, remarriage, and household succession reveal whether
      the surviving partner remains faithful or is ready to replace
      the absent body.
    rationale: |
      Distinct from `state_liminal_dead`, where a body occupies a
      supernatural border between death and return, and from ordinary
      `speech_lie`, where falsehood is only verbal. Here the deception
      is staged bodily and domestically: old Mr Fox lies under the
      bench as if dead, watches suitors arrive, and punishes the wife
      and rabble only when the wedding is about to begin. The law
      captures a comic fidelity-test structure specific to KHM 38.
    tier: operational
    scope: world
    lens: structural
    domains: [death, marriage, fidelity, test, deception]
    related: [arc_treacherous_spouse, state_liminal_dead, speech_lie, moral_retributive]
    examples: [wedding_mrs_fox_old_mr_fox]

  law_false_sermon_displaces_husband:
    name: False Sermon Displaces Husband
    description: |
      A trusted religious speaker converts public preaching into a
      private deception, inventing a sacred cure or pilgrimage that
      removes the husband from home and opens the domestic space to
      adultery.
    rationale: |
      Distinct from `law_false_letters_exile_innocent`, where written
      messages are swapped in transit, and from ordinary `speech_lie`,
      which deceives one listener directly. Here the lie borrows the
      pulpit's public authority: the parson's sermon creates a fake
      pilgrimage to the Göckerli hill, and the husband obeys because
      sacred speech has been made to look communal and remedial. The
      law supports queries over anticlerical jokes where institution,
      not just clever speech, makes the fraud credible.
    tier: operational
    scope: world
    lens: structural
    domains: [cleric, sermon, deception, adultery, pilgrimage]
    related: [arc_hypocritical_cleric, speech_lie, loc_church, state_deceived]
    examples: [old_hildebrand_false_sermon]

  law_hidden_basket_return_exposes_adultery:
    name: Hidden Basket Return Exposes Adultery
    description: |
      A deceived husband is carried home concealed in a market basket
      or similar container, turning the adulterous household's own
      merriment into the scene of exposure and punishment.
    rationale: |
      Distinct from `law_feigned_death_tests_fidelity`, where a spouse
      stages death to test future conduct, and from `law_false_oracle_exposes_hidden_goods`,
      where a trickster stages prophecy for profit. KHM 95 uses hidden
      return rather than oracle or feigned death: the egg-merchant's
      basket lets Hildebrand witness the parson and wife, join the song
      from concealment, and then cudgel the parson out. The node keeps
      container-concealment, song exposure, and adulterer punishment
      queryable as one schwank mechanism.
    tier: operational
    scope: world
    lens: structural
    domains: [adultery, concealment, basket, song, punishment]
    related: [agency_object_mediation, agency_music, arc_trickster, moral_retributive]
    examples: [old_hildebrand_egg_basket]

  law_blood_restores_petrified:
    name: Blood Restores the Petrified
    description: |
      The petrification produced by speaking forbidden prophecy is
      undone by the freely-offered blood of the petrified one's
      closest kin to the petrifier's master. The blood-substance is
      the price; the willingness-to-give is the moral condition.
    rationale: |
      Distinct from `law_curse_requires_counter_condition` (which
      typically uses non-bodily counter-conditions: kindness,
      naming, recognition). The blood-magic law is the SPECIFIC
      counter for petrification. It also encodes a moral test on
      the petrifier's master (the king must be willing to sacrifice
      his own children to restore his servant). Worth its own slot
      because the law operates with both material AND moral
      conditions — pure blood without willingness fails.
    tier: operational
    scope: world
    lens: structural
    domains: [blood, sacrifice, restoration, kin]
    related: [state_petrified, transform_resurrection_by_blood, moral_reciprocal_sacrifice]
    examples: [faithful_john]

  law_body_sacrifice_opens_threshold:
    name: Body Sacrifice Opens the Threshold
    description: |
      When a magical key or donor-gift is lost, the redeemer's own body
      can substitute as the price of passage through a sealed otherworld
      threshold.
    rationale: |
      Distinct from `law_blood_restores_petrified`, where kin-blood
      revives a petrified person, and from `law_curse_requires_counter_
      condition`, which names the broad requirement of release. This
      law isolates the threshold mechanism: the sister loses the star's
      drumstick-key, cuts off her little finger, and uses it to open
      the Glass mountain. The entry supports later queries over bodily
      cost, missing keys, and sacrificial entry into enchanted spaces.
    tier: operational
    scope: world
    lens: structural
    domains: [body, sacrifice, threshold, key, kinship]
    related: [law_curse_requires_counter_condition, threshold_doorway, moral_restorative]
    examples: [the_seven_ravens]

  law_serpent_medicine_restores_life:
    name: Serpent Medicine Restores Life
    description: |
      A remedy learned from serpents can reverse bodily death when
      applied to the corpse in the proper pattern. The life-principle
      returns materially through the medicine, not through repentance,
      blood sacrifice, or divine pardon.
    rationale: |
      Distinct from `law_blood_restores_petrified`, which answers
      prophecy-cost petrification with kin-blood, and from
      `law_repentance_restores`, which requires confession in a sacred
      register. KHM 16's green leaves are empirical folk medicine:
      the husband witnesses serpents revive one another, copies the
      technique on his wife, and the servant later repeats it on him.
      This slot lets queries separate material resurrection-remedies
      from moral or sacrificial restorations.
    tier: operational
    scope: world
    lens: structural
    domains: [resurrection, medicine, snake, leaves, body]
    related: [obj_life_restoring_leaves, transform_resurrection_by_remedy, sp_snake]
    examples: [the_three_snake_leaves]

  law_magic_bird_organs_generate_gold:
    name: Magic Bird Organs Generate Gold
    description: |
      Eating the heart and liver of a wondrous golden bird grants the
      eater a recurrent morning production of gold beneath the pillow.
      The power attaches to the ingested organs, not to ownership of
      the bird as treasure.
    rationale: |
      Distinct from `obj_golden_bird`, where the bird is a stolen or
      quested animate treasure, and from abundance objects that obey a
      formula. In KHM 60 the goldsmith owns and eats the bird's body
      but receives nothing because the poor twins accidentally consume
      the true operative organs. The law supports queries over wealth
      generated through ingestion, body-parts, and hidden transfer of
      fortune.
    tier: operational
    scope: world
    lens: material
    domains: [gold, bird, ingestion, body-part, fortune]
    related: [obj_magic_bird_heart_liver, obj_golden_bird]
    examples: [two_brothers_twins]

  law_life_root_restores_dismembered_body:
    name: Life-Root Restores Dismembered Body
    description: |
      A healing root placed in the mouth can rejoin a severed head,
      repair wounds, restore heartbeat, and return life to a recently
      killed body.
    rationale: |
      Distinct from `law_serpent_medicine_restores_life`, whose remedy
      is learned from snakes and applied with leaves to eyes and mouth,
      and from `law_blood_restores_petrified`, which requires kin-blood
      and moral sacrifice. KHM 60 uses a root fetched by the hare under
      time pressure; it can even correct a head attached the wrong way.
      The slot enables queries over plant-remedy resurrection that
      specifically repairs dismemberment.
    tier: operational
    scope: world
    lens: material
    domains: [resurrection, root, dismemberment, animal-helper, body]
    related: [obj_life_restoring_root, transform_resurrection_by_remedy, arc_animal_helper]
    examples: [two_brothers_younger_huntsman, two_brothers_elder_huntsman]

  law_false_oracle_exposes_hidden_goods:
    name: False Oracle Exposes Hidden Goods
    description: |
      A trickster stages an animal, object, or bundle as an oracle and
      uses prior overheard knowledge to make its noises appear
      prophetic, revealing hidden food, valuables, lovers, or shameful
      secrets for profit.
    rationale: |
      Distinct from `law_animal_language_reveals_hidden_order`, where
      a character truly understands animal speech, and from
      `speech_prophecy`, where the tale-world grants future knowledge.
      In KHM 61 the raven knows nothing; the little peasant pinches it
      to croak and supplies the interpretation from what he overheard.
      The law isolates staged divination as a schwank technology for
      turning concealed adultery and food into money.
    tier: operational
    scope: world
    lens: structural
    domains: [oracle, deception, animal, adultery, schwank]
    related: [arc_trickster, obj_false_oracle_raven, speech_lie, moral_trickster_wins]
    examples: [little_peasant]

  law_accidental_utterance_performs_omniscience:
    name: Accidental Utterance Performs Omniscience
    description: |
      A false expert's ordinary words accidentally coincide with hidden
      facts, and guilty listeners interpret the coincidence as proof of
      supernatural or professional knowledge.
    rationale: |
      Distinct from `law_false_oracle_exposes_hidden_goods`, where the
      trickster already knows the secret and stages an oracle to reveal
      it, and from `law_speech_taken_literally`, where a fool treats
      non-human sounds as binding speech. In KHM 98 Crabb counts dishes
      for his wife, says his own name over a covered crab, and looks
      for a cock in an ABC book; thieves and servants supply the hidden
      meaning themselves. The slot supports queries over lucky
      imposture, guilty projection, and accidental detection.
    tier: operational
    scope: world
    lens: cognitive
    domains: [omniscience, imposture, coincidence, guilt, schwank]
    related: [arc_trickster, speech_boast, state_deceived, moral_trickster_wins]
    examples: [dr_know_all_crabb]

  law_reconfinement_tricks_dangerous_spirit:
    name: Reconfinement Tricks Dangerous Spirit
    description: |
      A released supernatural being who threatens the liberator can be
      defeated by inducing it to demonstrate re-entry into its former
      prison, allowing the human to seal it again and renegotiate.
    rationale: |
      Distinct from `law_promise_binds_reality`, where a spoken vow
      enforces conduct, and from `law_quarreling_giants_lose_magic_objects`,
      where the human exploits dispute among stronger beings. In KHM
      99 the scholar survives Mercurius not by force or exorcism but
      by epistemic bait: "prove you were really in the bottle." Once
      the spirit re-enters, the cork restores human leverage. The slot
      supports queries over bottle-imp/genie containment and cunning
      reversal of released danger.
    tier: operational
    scope: world
    lens: structural
    domains: [spirit, bottle, containment, trickery, bargain]
    related: [being_spirit, agency_cunning, arc_trickster, moral_trickster_wins]
    examples: [spirit_bottle_mercurius]

  law_infernal_service_refuse_becomes_gold:
    name: Infernal Service Refuse Becomes Gold
    description: |
      Service under the Devil converts humiliating, dirty labour into
      wealth: the worker leaves hell unwashed and apparently paid with
      sweepings, but the refuse becomes gold once carried back to the
      human world.
    rationale: |
      Distinct from `law_promise_binds_reality`, which names the
      binding force of a bargain, and from generic magical treasures,
      which simply appear as rewards. This law captures KHM 100's
      specific infernal economy: obedience to a degrading service term,
      visible soot and uncleanliness, and contemptible refuse are the
      very media through which wages become treasure. It enables
      queries over devil-service tales where pollution, labour, and
      reward are inseparable rather than incidental.
    tier: operational
    scope: world
    lens: material
    domains: [devil, hell, service, labour, dirt, gold]
    related: [being_devil, loc_hell, agency_domestic_labor, affect_greed, moral_faithful_service_rewarded]
    examples: [sooty_brother_hans]

  law_infernal_substitution_threat_restores_stolen_wages:
    name: Infernal Substitution Threat Restores Stolen Wages
    description: |
      A thief who steals infernal wages can be forced to restore them
      by the threat of taking the robbed worker's place in hellish
      service.
    rationale: |
      Distinct from `moral_retributive`, which classifies the tale's
      justice pattern, and from ordinary intimidation, which threatens
      bodily harm or legal punishment. Here the coercive force is
      positional substitution: the landlord must return the gold
      because theft exposes him to the protagonist's former infernal
      office. The slot supports queries over stolen rewards restored
      through replacement-threats rather than recognition tokens,
      courts, or combat.
    tier: operational
    scope: world
    lens: structural
    domains: [theft, devil, hell, substitution, wages, coercion]
    related: [being_devil, loc_hell, moral_retributive, affect_fear, law_infernal_service_refuse_becomes_gold]
    examples: [sooty_brother_landlord]

  law_devil_pact_unclean_endurance_wins_freedom:
    name: Devil Pact Unclean Endurance Wins Freedom
    description: |
      A desperate person may accept a fixed-term pact with the Devil in
      which survival under visible uncleanliness, social revulsion, and
      religious abstention determines whether the Devil gains the soul
      or the human returns free and wealthy.
    rationale: |
      Distinct from `law_infernal_service_refuse_becomes_gold`, where
      the protagonist labours inside hell and refuse becomes wages, and
      from `law_promise_binds_reality`, which only names the binding
      force of a bargain. KHM 101's test is endurance in the human
      world: no washing, combing, nail-cutting, or paternoster for
      seven years while the Devil waits for death. The law supports
      queries over devil pacts where pollution, time, prayer-abstinence,
      and soul-risk form the wager.
    tier: operational
    scope: world
    lens: structural
    domains: [devil, pact, endurance, uncleanliness, soul, time]
    related: [being_devil, state_infernal_unclean, law_promise_binds_reality, agency_endurance, affect_fear]
    examples: [bearskin]

  law_grave_watch_promise_defends_sinner_soul:
    name: Grave Watch Promise Defends Sinner Soul
    description: |
      A promise to keep watch beside a dead person's grave obligates
      the living watcher to remain through the nocturnal danger, and
      the fulfilled vigil can delay or block an infernal claim on the
      soul.
    rationale: |
      Distinct from `law_promise_binds_reality`, which names obligation
      in general, and from `threshold_grave`, which names the boundary
      function of burial places. This law captures a specific ritual
      grammar: the debtor accepts food under a grave-watch condition,
      the promise carries him into the churchyard at night, and
      remaining at the mound creates the condition under which the
      Devil's claim can be contested. It supports queries over vigils,
      burial promises, and salvation mediated by the faithful living
      rather than by direct divine intervention.
    tier: operational
    scope: world
    lens: structural
    domains: [grave, vigil, promise, soul, devil, salvation]
    related: [state_bound_by_promise, threshold_grave, loc_churchyard, loc_tomb, being_devil, moral_restorative]
    examples: [the_grave_mound]

  law_bottomless_boot_delays_devil_until_sunrise:
    name: Bottomless Boot Delays Devil Until Sunrise
    description: |
      A cut-soled boot placed over a hidden hole turns a devil's bribe
      into an impossible filling task; repeated trips for more gold
      consume the night until sunrise forces the infernal claimant to
      flee.
    rationale: |
      Distinct from `law_top_bottom_crop_bargain_tricks_devil`, where
      agricultural literalism defeats a crop-share contract, and from
      `law_overheard_infernal_riddle_breaks_soul_bargain`, where stolen
      knowledge breaks a devil pact. Here the trick is material and
      temporal: an ordinary soldier converts footwear into a bottomless
      container, exploits the Devil's bribery, and wins by delaying
      rather than overpowering or sanctifying him. The law enables
      queries over infernal defeat by improvised objects, false
      measures, and sunrise deadlines.
    tier: operational
    scope: world
    lens: material
    domains: [devil, boot, gold, trickster, time, sunrise]
    related: [being_devil, arc_discharged_soldier, agency_cunning, agency_object_mediation, affect_greed, moral_trickster_wins]
    examples: [the_grave_mound]

  law_toast_formula_petrifies_robber_band:
    name: Toast Formula Petrifies Robber Band
    description: |
      A fearless soldier can turn a drinking toast into a binding
      command: when the bottle is brandished and the robbers are told
      to keep mouths open and right hands raised, they become motionless
      until a second formula releases them.
    rationale: |
      Distinct from `law_formula_commands_magic_objects`, where a
      fixed command activates a named magical object, and from
      `law_collective_noise_magnifies_the_weak`, where robbers flee
      through misrecognition. This law captures KHM 199's unexplained
      veteran trick: courage, bottle, convivial speech, and military
      command posture combine to arrest a whole robber table without
      combat. It enables queries over robber defeat by performative
      speech, temporary petrification, and soldierly command rather
      than by weapons or legal authority.
    tier: operational
    scope: world
    lens: structural
    domains: [soldier, robber, toast, petrification, bottle, command]
    related: [arc_discharged_soldier, agency_speech, agency_cunning, state_petrified, moral_trickster_wins]
    examples: [the_boot_of_buffalo_leather]

  law_restricted_formula_preserves_innocents_until_exposure:
    name: Restricted Formula Preserves Innocents Until Exposure
    description: |
      A supernatural bargain can bind innocent people to a tiny set of
      repeated answers that look self-incriminating under hostile
      questioning, while also preserving their wealth and lives until
      the hidden guilty party can be publicly exposed.
    rationale: |
      Distinct from `law_speech_taken_literally`, where ordinary
      misunderstanding creates comic error, and from generic
      `law_promise_binds_reality`, where the obligation itself is the
      central force. Here the formula is a trapdoor speech regime:
      "All three of us," "For money," and "And quite right too" can
      be read as confession, yet obedience keeps the apprentices alive
      until the Devil releases them to testify against the innkeeper.
      KHM 120 needs the law for queries over constrained speech,
      infernal bargains that target a different soul, and false
      confession scenes resolved by forensic exposure.
    tier: operational
    scope: world
    lens: structural
    domains: [devil, formula, false-confession, speech, innocence, murder]
    related: [being_devil, speech_bargain, speech_testimony, state_bound_by_promise, obj_forensic_token, moral_retributive]
    examples: [the_three_apprentices]

  law_overheard_infernal_riddle_breaks_soul_bargain:
    name: Overheard Infernal Riddle Breaks Soul Bargain
    description: |
      A devil's time-bound bargain over human service can be escaped
      when the impossible riddle's answer is coaxed from the Devil in
      his own household, overheard by the bound human, and repeated at
      the final claim.
    rationale: |
      Distinct from `law_secret_name_breaks_supernatural_claim`, where
      a hidden name breaks a helper's claim, and from
      `law_devil_pact_unclean_endurance_wins_freedom`, where the human
      wins by bodily endurance. Here the solution is infernal domestic
      eavesdropping: the Devil's grandmother feeds and questions him,
      the soldier listens under the stone, and the three answers about
      dog-fish, whale rib, and horse's hoof void the seven-year service
      bargain. KHM 125 needs the law for queries over devil riddles,
      grandmother mediation, and knowledge stolen from hell's own
      household.
    tier: operational
    scope: world
    lens: structural
    domains: [devil, riddle, bargain, eavesdropping, grandmother, freedom]
    related: [being_devil, speech_riddle, speech_bargain, state_bound_by_promise, loc_hell, moral_trickster_wins]
    examples: [the_devil_and_his_grandmother]

  law_split_betrothal_token_recognizes_true_bridegroom:
    name: Split Betrothal Token Recognizes True Bridegroom
    description: |
      A divided ring or comparable betrothal token proves continuity
      between a socially repulsive earlier suitor and the restored
      bridegroom when the two halves are reunited.
    rationale: |
      Distinct from `law_true_fit_reveals_identity`, which depends on
      bodily fit, and from `law_kitchen_tokens_reveal_hidden_bride`,
      where a concealed bride communicates indirectly through food.
      Here recognition is covenantal and dyadic: each betrothed carries
      half of a private object, and the exact join verifies the restored
      man's identity. KHM 101 needs this law because Bearskin's clean,
      handsome appearance creates a second misrecognition that only the
      split ring can resolve.
    tier: operational
    scope: world
    lens: material
    domains: [recognition, betrothal, ring, identity, marriage]
    related: [obj_betrothal_recognition_token, agency_object_mediation, state_hidden_identity, law_promise_binds_reality]
    examples: [obj_bearskin_split_ring]

  law_insulted_small_royalty_summons_total_war:
    name: Insulted Small Royalty Summons Total War
    description: |
      An insult against the offspring or household of a tiny animal
      ruler can escalate into formal war between whole animal domains,
      because honor and legitimacy attach to the small nest as strongly
      as to any human palace.
    rationale: |
      Distinct from `moral_retributive`, which names the justice
      regime after a wrong, and from `law_collective_noise_magnifies_the_weak`,
      where weak bodies win by frightening misrecognition. KHM 102
      needs a law for escalation: the bear's contempt for a wren nest
      becomes a political injury, mobilizing four-footed animals
      against birds and insects. The slot enables queries over animal-
      polity tales where rank, insult, and kin honor turn small scale
      into sovereign conflict.
    tier: operational
    scope: world
    lens: structural
    domains: [animal-tale, insult, sovereignty, war, kinship]
    related: [sp_bird, sp_bear, loc_nest, affect_pride, moral_retributive]
    examples: [willow_wren_bear_king]

  law_tiny_sting_breaks_command_signal:
    name: Tiny Sting Breaks Command Signal
    description: |
      A small flying or stinging creature can defeat a stronger army by
      attacking the enemy commander's bodily signal, making the army
      misread pain as retreat.
    rationale: |
      Distinct from `law_collective_noise_magnifies_the_weak`, where
      collective sound creates terror, and from generic `agency_cunning`,
      which names clever capacity but not the tactical mechanism. In
      KHM 102 the gnat learns that the fox's tail is the battle signal,
      and the hornet stings under that tail until it drops. The whole
      four-footed army routs because a command sign has been converted
      into an involuntary pain response.
    tier: operational
    scope: world
    lens: material
    domains: [insect, signal, war, body, misrecognition]
    related: [sp_insect, sp_fox, agency_cunning, agency_violence, law_insulted_small_royalty_summons_total_war]
    examples: [willow_wren_bear_hornet]

  law_tiny_trickster_wins_animal_kingship_contests:
    name: Tiny Trickster Wins Animal Kingship Contests
    description: |
      In an animal sovereignty contest, the smallest competitor can
      defeat stronger bodies by exploiting the contest's exact spatial
      rule: riding hidden above the highest flyer, then entering a
      lower hole than larger birds can reach.
    rationale: |
      Distinct from `law_tiny_sting_breaks_command_signal`, where a
      small creature wins by attacking an enemy's battle signal, and
      from `law_tiny_body_enables_hidden_agency`, where smallness is a
      general mobility advantage. KHM 171 needs this law because the
      nameless bird's kingship depends on two formal contests whose
      extremes are gamed: height is won by hidden passengerhood, depth
      by mouse-hole access. The slot enables queries over animal tales
      where sovereignty is decided by rule-exploitation rather than
      force, lineage, or public consent.
    tier: operational
    scope: world
    lens: structural
    domains: [animal-tale, kingship, contest, smallness, cunning]
    related: [arc_trickster, agency_cunning, sp_bird, loc_heaven, moral_trickster_wins]
    examples: [willow_wren_nameless_bird]

  law_positional_spouse_double_wins_repeated_race:
    name: Positional Spouse-Double Wins Repeated Race
    description: |
      A slow contestant can defeat a faster runner by placing an
      indistinguishable spouse or double at the far end of a fixed
      course, so arrival itself is simulated at both endpoints and each
      repetition deepens the runner's exhaustion.
    rationale: |
      Distinct from `law_tiny_trickster_wins_animal_kingship_contests`,
      where rule-exploitation depends on hidden smallness in kingship
      contests, and from generic `agency_cunning`, which does not name
      the mechanism. KHM 187 needs this law because the hedgehog does
      not outrun the hare; he converts marriage resemblance and furrow
      geometry into a positional illusion that the hare repeats until
      death.
    tier: operational
    scope: world
    lens: structural
    domains: [race, double, spouse, deception, exhaustion, animal-tale]
    related: [sp_hedgehog, sp_hare, agency_cunning, affect_pride, moral_trickster_wins]
    examples: [the_hare_and_the_hedgehog]

  law_top_bottom_crop_bargain_tricks_devil:
    name: Top-Bottom Crop Bargain Tricks Devil
    description: |
      A crop-share bargain divided by "what is above ground" versus
      "what is under the earth" can be exploited by choosing successive
      crops whose useful yield lies on the opposite side of the agreed
      share.
    rationale: |
      Distinct from `law_promise_binds_reality`, which only says a
      bargain compels later conduct, and from `law_overheard_infernal_
      riddle_breaks_soul_bargain`, where knowledge breaks a time-bound
      devil pact. This law is agronomic literalism: the peasant wins
      because turnips and wheat place value in different vertical
      zones. KHM 189 needs it because the devil is not defeated by
      holiness, force, or riddling, but by a contract whose terms ignore
      crop morphology.
    tier: operational
    scope: world
    lens: structural
    domains: [agriculture, bargain, devil, literalism, crop, trickster]
    related: [being_devil, speech_bargain, agency_cunning, loc_field, moral_trickster_wins]
    examples: [the_peasant_and_the_devil]

  law_failed_sentinel_creates_nocturnal_etiology:
    name: Failed Sentinel Creates Nocturnal Etiology
    description: |
      A watcher's failure to guard a trapped trickster becomes an
      origin explanation for later animal habits: public shame drives
      the watcher into night activity, while hatred of the escape-place
      redirects future predation.
    rationale: |
      Distinct from `law_fearful_misrecognition_turns_signs_deadly`,
      where perception creates harm in the moment, and from generic
      `moral_retributive`, which names punishment without explaining
      species behaviour. KHM 171 needs this law because the owl's
      dozing at the mouse-hole does not merely let the wren escape; it
      explains why owls avoid daylight and pursue mice. The slot
      supports queries over etiological endings where a single failed
      social duty becomes permanent animal conduct.
    tier: operational
    scope: world
    lens: material
    domains: [etiology, watch, night, shame, predation]
    related: [sp_bird, affect_shame, agency_endurance, moral_retributive]
    examples: [willow_wren_owl_sentinel]

  law_envious_insult_marks_animal_body:
    name: Envious Insult Marks Animal Body
    description: |
      In an etiological animal tale, a losing competitor's resentful
      insult against the rightful winner can become a permanent bodily
      mark on the insulter's species.
    rationale: |
      Distinct from `law_etiological_mishap_marks_species`, where an
      accident explains a material feature, and from
      `law_failed_sentinel_creates_nocturnal_etiology`, where a failed
      duty explains later behaviour. KHM 172 needs this law because
      the sole's sideways mouth is neither accident nor practical
      adaptation; it is punishment for envy after a fair kingship race.
      The slot enables queries over animal-body etiologies grounded in
      social emotion and insult.
    tier: operational
    scope: world
    lens: material
    domains: [etiology, body-mark, envy, insult, animal-tale]
    related: [affect_envy, sp_fish, moral_retributive, agency_speech]
    examples: [sole_side_mouth]

  law_immoderate_pasture_creates_eternal_herding_call:
    name: Immoderate Pasture Creates Eternal Herding Call
    description: |
      In a pastoral animal etiology, choosing an extreme pasture makes
      cattle either too wild or too weak to obey; the failed herding
      command then survives as the permanent call of a bird species.
    rationale: |
      Distinct from `law_envious_insult_marks_animal_body`, where a
      social insult creates a bodily mark, and from
      `law_failed_sentinel_creates_nocturnal_etiology`, where failed
      guarding creates later animal conduct. KHM 173 needs this law
      because the bittern's and hoopoe's cries are produced by failed
      pastoral judgment: rich meadow and barren hill are opposite
      immoderations, but both break domestic order and fix the old
      commands into species voice. The slot enables queries over
      animal-call origins grounded in work, husbandry, and ecological
      measure rather than combat or punishment.
    tier: operational
    scope: world
    lens: material
    domains: [etiology, pasture, moderation, birds, cattle, labour]
    related: [moral_moderation_preserves_order, agency_domestic_labor, agency_speech, sp_bird, sp_cattle, loc_meadow, loc_mountain]
    examples: [bittern_call, hoopoe_call]

  law_unchecked_formula_abundance_floods_world:
    name: Unchecked Formula Abundance Floods World
    description: |
      A magic food-producing object obeys its start formula literally
      and keeps producing until the exact stop formula is spoken; if
      the user lacks the counter-command, abundance turns into flood,
      blockage, and communal crisis.
    rationale: |
      Distinct from `law_formula_commands_magic_objects`, which names
      the broad activation pattern for formulaic objects, and from
      `law_insatiable_wishing_reverts_gifts`, where desire escalates
      through repeated wishes. KHM 103 needs the narrower law because
      the mother is not greedy and the pot is not malicious: the
      catastrophe comes from one missing stop phrase. The slot supports
      queries over magic-mill and porridge-pot tales where excess food
      becomes landscape and must be eaten through.
    tier: operational
    scope: world
    lens: material
    domains: [formula, magic-object, food, abundance, overflow]
    related: [law_formula_commands_magic_objects, obj_self_cooking_pot, affect_hunger, moral_restorative]
    examples: [sweet_porridge_pot]

  law_fatal_imitation_of_trickster_profit:
    name: Fatal Imitation of Trickster Profit
    description: |
      Dupes imitate the trickster's reported profitable action without
      understanding the hidden fraud that produced the gain, turning
      the same action into loss, death, or collective ruin.
    rationale: |
      Distinct from `law_misapplied_instruction_cascades`, where a fool
      repeats instructions in the wrong context. Here the mistake is
      competitive imitation of an opaque profit story: rich peasants
      kill all their cows expecting high prices for skins, then later
      drown themselves after believing the peasant found sheep beneath
      the water. The law enables queries for schwanks where greed
      copies the surface of trickery and destroys itself.
    tier: operational
    scope: world
    lens: structural
    domains: [imitation, greed, trickster, profit, punishment]
    related: [moral_trickster_wins, affect_greed, arc_naive_victim]
    examples: [little_peasant]

  law_execution_container_invites_place_swap:
    name: Execution Container Invites Place-Swap
    description: |
      A condemned trickster confined in a sack, barrel, chest, or other
      portable execution container escapes by persuading an ambitious
      passerby that the container is actually the route to office,
      wealth, wisdom, or status.
    rationale: |
      Distinct from ordinary escape-by-force and from
      `law_false_oracle_exposes_hidden_goods`, which uses staged
      prophecy. In KHM 61 the peasant is sealed in a hole-pierced
      barrel for drowning but convinces the shepherd that entry will
      make him mayor. The law names the exact ATU 1737 mechanism:
      status desire moves the dupe into the death-place. KHM 146
      expands the mechanism from civic office to intellectual status:
      a near-hanged brother repackages his sack as the "Sack of
      Wisdom," and the student's hunger for knowledge makes him take
      the prisoner's place.
    tier: operational
    scope: world
    lens: structural
    domains: [execution, container, substitution, ambition, schwank]
    related: [moral_trickster_wins, arc_trickster]
    examples: [little_peasant, turnip_sack_of_wisdom]

  law_death_position_determines_healing:
    name: Death's Position Determines Healing
    description: |
      Healing is permitted only when Death stands by the patient's
      head; when Death stands by the feet, the sick person belongs to
      Death and no remedy can save them.
    rationale: |
      Distinct from `law_serpent_medicine_restores_life`, where a
      remedy reverses death by technique, and from generic prophecy,
      which merely tells the future. Here the healer's power is
      diagnostic and jurisdictional: the remedy works because Death's
      spatial position marks whether life is still legally available.
      ATU 332 requires this law because both success and forbidden
      overreach depend on reading Death's place around the bed.
    tier: operational
    scope: world
    lens: structural
    domains: [death, medicine, diagnosis, fate, bed]
    related: [being_death, obj_death_diagnostic_remedy, arc_supernatural_godfather, agency_object_mediation]
    examples: [the_godfather, godfather_death]

  law_life_candle_measures_lifespan:
    name: Life-Candle Measures Lifespan
    description: |
      Each human life is materially represented by a burning candle;
      the candle's size shows remaining life, and its extinction
      immediately ends the person's life.
    rationale: |
      Distinct from `law_death_position_determines_healing`, which
      governs whether a sick person may be cured at a bed. The life-
      candle law moves from diagnosis to ontology: life itself is
      externalised as flame, measurable in Death's underground store.
      KHM 44 needs this law because the physician's final fate is not
      decided at a sickbed but by Death letting his own little candle
      fall and go out.
    tier: operational
    scope: world
    lens: material
    domains: [death, life, candle, measure, fate]
    related: [being_death, obj_life_candle, loc_cave, moral_retributive]
    examples: [obj_godfather_death_life_candles]

  law_transferred_animal_years_shape_human_aging:
    name: Transferred Animal Years Shape Human Aging
    description: |
      Human life can be extended by years surrendered from animals, but
      each borrowed span carries the donor species' burden, decline, or
      comic behaviour into the matching stage of human aging.
    rationale: |
      Distinct from `law_life_candle_measures_lifespan`, where life is
      measured by an external flame, and from `law_ailments_are_deaths_
      messengers`, where bodily decline warns of death. KHM 176 needs
      this law because age is not merely longer or shorter: the ass's,
      dog's, and monkey's rejected years become qualitative phases of
      human life. The slot enables queries over tales where animal
      ontology explains human embodiment, old age, and lifespan
      arithmetic.
    tier: operational
    scope: world
    lens: material
    domains: [lifespan, aging, animals, body, creation, comedy]
    related: [being_divine, sp_human, sp_donkey, sp_dog, sp_monkey, num_30, num_70, moral_comic_inversion]
    examples: [the_duration_of_life]

  law_divine_estate_distribution_orders_social_body:
    name: Divine Estate Distribution Orders the Social Body
    description: |
      Divine blessing assigns people to unequal ranks and trades so the
      post-paradise world can function as an interdependent body:
      rulers, merchants, scholars, peasants, fishers, smiths, weavers,
      tailors, servants, and other workers each supply what the others
      lack.
    rationale: |
      Distinct from `moral_heavenly_equality`, where earthly rank does
      not affect salvation, and from `law_divine_token_confers_office`,
      where a single sign elevates one despised person into sacred
      office. This law explains the origin of a whole social ecology.
      KHM 180 needs it because the hidden children are not excluded
      after discovery; God blesses them into necessary labour roles and
      justifies the division as mutual support, "like the limbs of one
      body."
    tier: operational
    scope: world
    lens: structural
    domains: [creation, estates, labour, hierarchy, providence, body]
    related: [being_divine, agency_social_rank, agency_domestic_labor, speech_blessing, moral_divine_social_interdependence]
    examples: [eves_various_children]

  law_wasted_grain_reduces_divine_abundance:
    name: Wasted Grain Reduces Divine Abundance
    description: |
      When humans use abundant sacred food carelessly, divine order
      withdraws part of the crop's fruitfulness, leaving a reduced but
      merciful remnant for innocent creatures.
    rationale: |
      Distinct from `law_divine_estate_distribution_orders_social_body`,
      where God blesses unequal labour roles into social order, and
      from `law_total_almsgiving_draws_heavenly_replacement`, where
      surrendered goods are restored from heaven. This law is agrarian
      etiology: corn once bore from bottom to top, but a mother used
      beautiful ears as cleaning rags, so God curtailed the grain while
      sparing enough for birds. KHM 194 needs it for queries over food
      waste, sacred abundance, crop origins, and mercy toward animals.
    tier: operational
    scope: world
    lens: material
    domains: [grain, agriculture, divine-justice, abundance, waste, birds]
    related: [being_divine, agency_domestic_labor, sp_bird, moral_moderation_preserves_order, affect_pity]
    examples: [the_ear_of_corn]

  law_ailments_are_deaths_messengers:
    name: Ailments Are Death's Messengers
    description: |
      Ordinary bodily decline can fulfil Death's promise of prior
      warning: fever, dizziness, gout, toothache, failing sight, ringing
      ears, and nightly sleep count as messengers sent before Death
      arrives in person.
    rationale: |
      Distinct from `law_death_position_determines_healing`, where
      Death's spatial position decides whether a patient may recover,
      and from `law_life_candle_measures_lifespan`, where lifespan is
      externalised as candle-flame. Here the signs are experiential and
      retrospective: the man expected a special envoy, but Death treats
      repeated sickness and sleep as sufficient summons. KHM 177 needs
      this law for queries over memento-mori tales where mortality
      warns through the body before it claims the person.
    tier: operational
    scope: world
    lens: material
    domains: [death, sickness, sleep, warning, body, mortality]
    related: [being_death, speech_promise, speech_warning, moral_memento_mori]
    examples: [deaths_messengers]

  law_staged_rescue_restores_worth:
    name: Staged Rescue Restores Worth
    description: |
      A simulated danger and rescue can make an apparently useless
      servant or animal visibly valuable again, reversing a planned
      disposal or punishment.
    rationale: |
      Distinct from `law_devouring_can_be_reversed`, where a real
      predator's body contains living victims, and from generic
      trickery, which may only produce advantage for the trickster.
      This law concerns social valuation: a loyal but aged servant is
      spared because a staged rescue persuades the owner that service
      still exists. KHM 48 needs it because Old Sultan's survival
      depends on a fake wolf-abduction that creates public proof of
      usefulness.
    tier: operational
    scope: world
    lens: structural
    domains: [rescue, performance, old-age, service, value]
    related: [arc_discarded_service_animal, agency_cunning, moral_faithful_service_rewarded]
    examples: [old_sultan]

  law_feigned_carcass_traps_predator_for_restored_service:
    name: Feigned Carcass Traps Predator for Restored Service
    description: |
      A discarded service animal regains household value when a
      trickster helper makes it lie like carrion, lures a predator with
      the promise of meat, binds the predator to the apparent carcass,
      and turns the staged prey-body into proof of strength.
    rationale: |
      Distinct from `law_staged_rescue_restores_worth`, where the
      aged animal is saved by a simulated rescue of a child, and from
      `law_gluttony_traps_predator`, where appetite traps the predator
      inside its own overconsumption. Here the old horse cannot fight
      or plough; value is restored by fox-managed misrecognition:
      lion reads horse as food, accepts binding for easier eating, and
      is dragged to the master's door as evidence. KHM 132 needs the
      law for queries over discarded-service tales where predator
      capture, not child rescue, reopens domestic maintenance.
    tier: operational
    scope: world
    lens: structural
    domains: [service, old-age, trickery, carrion, predator, restoration]
    related: [arc_discarded_service_animal, sp_horse, sp_fox, sp_lion, moral_faithful_service_rewarded]
    examples: [the_fox_and_the_horse]

  law_ingested_animal_grants_language:
    name: Ingested Animal Grants Language
    description: |
      Eating a marked animal or animal-derived dish grants access to
      non-human speech: birds, fish, ducks, ants, or other creatures
      become intelligible and actionable as information sources.
    rationale: |
      Distinct from `agency_speech`, which covers ordinary utterance,
      and from `law_music_attracts`, which compels listeners without
      semantic understanding. This law names the bodily acquisition of
      cross-species comprehension. KHM 17's servant tastes the white
      snake and immediately understands sparrows, ducks, fish, ants,
      and ravens; without this slot animal-help would look accidental
      rather than enabled by a prior ingestion.
    tier: operational
    scope: world
    lens: cognitive
    domains: [animal-language, ingestion, knowledge, snake, speech]
    related: [agency_animal_language, obj_language_granting_food, sp_snake]
    examples: [the_white_snake]

  law_animal_language_reveals_hidden_order:
    name: Animal Language Reveals Hidden Order
    description: |
      Non-human speech discloses facts inaccessible to ordinary human
      authority: concealed treasure, the reason for an enchantment, a
      future office, or the words needed to perform a sacred role. The
      plot advances because a human can understand and act on that
      animal discourse.
    rationale: |
      Distinct from `law_ingested_animal_grants_language`, which names
      one mechanism for acquiring the skill. This law names what the
      skill DOES in the tale-world. In KHM 33 the son learns dog,
      bird, and frog speech from masters; the dogs reveal the treasure
      and curse-condition, frogs foretell the papacy, and doves supply
      liturgical speech. The value of the despised education is
      vindicated by hidden order becoming audible.
    tier: operational
    scope: world
    lens: cognitive
    domains: [animal-language, revelation, knowledge, prophecy, enchantment]
    related: [agency_animal_language, speech_prophecy, arc_animal_helper, law_ingested_animal_grants_language]
    examples: [the_three_languages_son, white_snake_servant]

  law_rescued_animals_repay_kindness:
    name: Rescued Animals Repay Kindness
    description: |
      Animals saved from death, hunger, trampling, or captivity later
      return with exactly the aid needed to complete otherwise
      impossible human tasks, including retrieval, sorting, bride
      identification, or concealment.
    rationale: |
      Distinct from `law_kindness_to_hidden_donors_rewarded`, where
      small supernatural donors test politeness while concealed in
      humble form. Here the beings are plainly animals in distress,
      and repayment is reciprocal memory: fish retrieve a sea-ring,
      ants sort millet, ravens fetch the Apple of Life, and in KHM 191
      raven, fish, and fox provide increasingly intimate hiding places.
      The law makes animal gratitude a repeatable operational rule
      rather than a loose helper motif.
    tier: operational
    scope: world
    lens: structural
    domains: [animal, kindness, reciprocity, difficult-task, helper]
    related: [arc_animal_helper, agency_animal_aid, moral_kindness_rewarded]
    examples: [the_white_snake, the_queen_bee, the_sea_hare]

  law_grateful_animals_hide_hero_from_omnivision:
    name: Grateful Animals Hide Hero from Omnivision
    description: |
      Animals whose lives were spared repay mercy by converting their
      own bodies, nests, stomachs, or transformative knowledge into
      hiding places that defeat a royal searcher's supernatural sight.
    rationale: |
      Distinct from `law_rescued_animals_repay_kindness`, which names
      the broader reciprocity pattern, and from `law_animal_advice_
      requires_exact_obedience`, where the animal mainly gives route
      instructions. This law names the particular KHM 191 mechanism:
      the raven hides the youth in an egg, the fish in its stomach,
      and the fox wins by turning him into a sea-hare concealed under
      the princess's own hair. The query it enables is not just
      "animal helper", but embodied concealment against omnivision.
    tier: operational
    scope: world
    lens: structural
    domains: [animal-helper, concealment, sight, transformation, marriage-test]
    related: [law_rescued_animals_repay_kindness, agency_animal_aid, agency_extraordinary_body, state_hidden_identity, transform_animal_human]
    examples: [the_sea_hare]

  law_animal_advice_requires_exact_obedience:
    name: Animal Advice Requires Exact Obedience
    description: |
      A speaking animal helper gives precise travel, lodging, or object-
      handling instructions; success depends on obeying the lowly or
      plain option instead of choosing the splendid, obvious, or socially
      attractive one.
    rationale: |
      Distinct from `law_rescued_animals_repay_kindness`, where animals
      later repay a rescue with task-help. Here the animal's main gift
      is procedural knowledge, and the protagonist repeatedly fails by
      improving the instruction aesthetically: bright inn over bad inn,
      golden cage over wooden cage, golden saddle over plain saddle,
      parental farewell over immediate flight. KHM 57 needs this law
      because the whole quest advances through ignored and then partly
      obeyed fox counsel.
    tier: operational
    scope: world
    lens: structural
    domains: [animal-helper, advice, obedience, quest, temptation]
    related: [arc_animal_helper, speech_warning, moral_disobedience_punished]
    examples: [golden_bird_fox]

  law_parental_bird_counsel_maps_worldly_dangers:
    name: Parental Bird Counsel Maps Worldly Dangers
    description: |
      A bird-parent can translate the dispersed experiences of young
      birds into practical warnings about human spaces, traps,
      predators, and the proper way to survive in the world.
    rationale: |
      Distinct from `law_animal_advice_requires_exact_obedience`,
      where an animal helper instructs a human quester in a single
      procedure, and from generic `speech_warning`, which only names
      the utterance type. Here animal counsel is pedagogical and
      comparative: gardens, court stables, roads, mountains, and
      churches each generate a different survival rule for vulnerable
      birds. KHM 157 needs this law for queries over parental animal
      instruction, dispersed child experience, human-world danger, and
      prudential religious fable.
    tier: operational
    scope: world
    lens: cognitive
    domains: [animal, counsel, parenthood, danger, prudence, piety]
    related: [sp_bird, speech_warning, agency_speech, moral_providential_protection, num_4]
    examples: [the_sparrow_and_his_four_children]

  law_delayed_godfather_key_reveals_hidden_inheritance:
    name: Delayed Godfather Key Reveals Hidden Inheritance
    description: |
      A godparental gift seems worthless in childhood, but becomes
      operative at a named maturity threshold, opening a hidden castle,
      treasure, helper, or vocation that belonged to the child all
      along.
    rationale: |
      Distinct from `obj_forbidden_key`, where a key materializes
      prohibition and transgression. Here the key is deferred
      inheritance: it stores a promise across childhood until age,
      place, and lock coincide. KHM 126 needs this law because
      Ferdinand's poverty is not solved immediately at baptism; the
      godfather's key only proves valuable when the heath-castle
      appears at fourteen and yields the white horse.
    tier: operational
    scope: world
    lens: structural
    domains: [godparent, key, inheritance, maturity, gift]
    related: [arc_supernatural_godfather, obj_delayed_inheritance_key, loc_castle]
    examples: [ferdinand_faithful_godfather_key]

  law_unopened_treasure_suspends_reader_desire:
    name: Unopened Treasure Suspends Reader Desire
    description: |
      A discovered key and matching chest can bring the tale to the
      threshold of revelation, but the narrative withholds the opening
      and asks the listener to wait for the wonderful contents.
    rationale: |
      Distinct from `law_password_opens_hidden_mountain_treasure`,
      where the treasure is actually accessed, and from
      `law_delayed_godfather_key_reveals_hidden_inheritance`, where a
      key resolves an inheritance plot. KHM 200 makes non-disclosure
      the mechanism: the boy finds key, lock, and fit, but the tale
      ends before the lid opens. The law enables queries over closure
      refusal, reader/listener desire, and wonder generated by an
      unopened object rather than by revealed treasure.
    tier: operational
    scope: tale
    lens: structural
    domains: [key, treasure, suspense, closure, wonder, narration]
    related: [agency_object_mediation, affect_curiosity, obj_delayed_inheritance_key, moral_open_ended_wonder]
    examples: [the_golden_key]

  law_provisioned_passage_pacifies_monsters:
    name: Provisioned Passage Pacifies Monsters
    description: |
      A dangerous crossing succeeds when the traveller brings exactly
      the food or supplies needed by monstrous boundary-keepers, turning
      would-be predators into harmless or helpful beings.
    rationale: |
      Distinct from `law_rescued_animals_repay_kindness`, where prior
      compassion creates a later debt, and from
      `law_animal_advice_requires_exact_obedience`, where the helper's
      procedure is the central rule. Provisioned passage names the
      material diplomacy of the crossing itself: meat for giants and
      bread for birds converts tearing and eye-picking into assistance.
      This supports queries over quests where logistics, not battle,
      opens the otherworld route.
    tier: operational
    scope: world
    lens: material
    domains: [provision, monster, passage, food, quest]
    related: [being_giant, sp_bird, loc_ship, agency_speech]
    examples: [ferdinand_faithful_meat_ship, ferdinand_faithful_bread_ship]

  law_grave_tree_channels_maternal_aid:
    name: Grave Tree Channels Maternal Aid
    description: |
      A plant rooted in a dead mother's grave mediates protective help:
      prayers or wishes spoken there bring birds, garments, recognition,
      or punishment on the mother's behalf.
    rationale: |
      Distinct from `law_kindness_to_hidden_donors_rewarded`, where
      unknown donors test conduct, and from generic `agency_animal_aid`,
      where animals simply help. Cinderella's aid is genealogical and
      memorial: tears water the hazel on the grave, the bird answers
      her wishes, and the pigeons expose false brides. This law lets
      queries find dead-kin / grave-plant mediation rather than
      flattening it into anonymous animal magic.
    tier: operational
    scope: world
    lens: structural
    domains: [mother, grave, tree, birds, protection]
    related: [loc_tomb, loc_tree, arc_protective_mother, agency_animal_aid]
    examples: [cinderella]

  law_excessive_mourning_burdens_dead_child:
    name: Excessive Mourning Burdens the Dead Child
    description: |
      A living parent's continual tears materially disturb a dead
      child's rest, wetting the burial garment and keeping the child
      from sleeping peacefully in the grave.
    rationale: |
      Distinct from `law_grave_tree_channels_maternal_aid`, where
      tears at a grave generate protective help, and from
      `law_dead_matter_reveals_murder`, where remains speak truth
      about a crime. Here grief is not evidentiary or empowering; it is
      a burden placed on the beloved dead. KHM 109 needs this law
      because the child returns not to accuse anyone or seek revival,
      but to teach the mother that love must release the dead into
      divine keeping.
    tier: operational
    scope: world
    lens: material
    domains: [grief, tears, dead-child, burial, rest]
    related: [affect_grief, state_liminal_dead, obj_burial_shroud, loc_tomb]
    examples: [the_shroud_child]

  law_hidden_alms_money_binds_dead_child_to_restless_search:
    name: Hidden Alms-Money Binds Dead Child to Restless Search
    description: |
      A dead child who kept money intended for charity cannot rest in
      the grave until the concealed coins are found and given to the
      poor recipient for whom they were meant.
    rationale: |
      Distinct from `law_excessive_mourning_burdens_dead_child`, where
      a living parent's grief prevents rest, and from
      `law_maternal_rod_quiets_posthumous_disobedience`, where
      willfulness persists as bodily disobedience. Here the blockage is
      misdirected alms: the child returns silently to search the floor
      for the hidden farthings, and rest is restored only when the
      parents complete the interrupted charitable transfer. KHM 154
      needs this law for queries over dead-child restitution,
      household haunting, and charity obligations that bind beyond
      death.
    tier: operational
    scope: world
    lens: material
    domains: [dead-child, alms, money, haunting, restitution, charity]
    related: [state_liminal_dead, affect_guilt, moral_restorative, moral_compassionate_aid]
    examples: [the_stolen_farthings]

  law_maternal_rod_quiets_posthumous_disobedience:
    name: Maternal Rod Quiets Posthumous Disobedience
    description: |
      A disobedient child's unresolved willfulness persists after
      burial as a body part rising from the grave, and only the
      mother's disciplinary blow makes the dead child rest beneath the
      earth.
    rationale: |
      Distinct from `law_excessive_mourning_burdens_dead_child`, where
      the living parent's grief prevents rest, and from
      `law_dead_matter_reveals_murder`, where remains testify about a
      hidden crime. Here the dead child's own disobedience remains
      bodily active after burial: the arm keeps rising until maternal
      authority completes what illness and burial could not. KHM 117
      needs this law for queries over religious exempla where obedience
      is enforced even across the grave.
    tier: operational
    scope: world
    lens: material
    domains: [disobedience, child, grave, discipline, rest]
    related: [arc_willful_child, obj_maternal_discipline_rod, state_liminal_dead, threshold_grave]
    examples: [willful_child_arm]

  law_true_fit_reveals_identity:
    name: True Fit Reveals Identity
    description: |
      A garment, shoe, ring, or bodily measure fits only the rightful
      person; failed or forced fit exposes imposture, while true fit
      restores hidden identity and rightful marriage.
    rationale: |
      Distinct from `state_hidden_identity`, which names concealment,
      and from `obj_recognition_shoe`, which is one material carrier.
      This law names the recognition mechanism: the object has a
      quasi-forensic relation to the body. KHM 21's golden slipper
      rejects bloodied false brides and fits Cinderella "like a glove,"
      revealing the true bride.
    tier: operational
    scope: world
    lens: structural
    domains: [recognition, identity, fit, body, marriage]
    related: [state_hidden_identity, obj_recognition_shoe, arc_false_bride]
    examples: [cinderella]

  law_dewless_flower_reveals_night_homecoming:
    name: Dewless Flower Reveals Night Homecoming
    description: |
      Among identical enchanted flowers, the one that spent the night
      indoors can be identified because field-dew did not fall on it;
      the absence of a natural trace reveals the transformed wife and
      enables her release.
    rationale: |
      Distinct from `law_true_fit_reveals_identity`, where an object
      proves rightful identity by bodily fit, and from
      `law_paradox_condition_proves_wisdom`, where cleverness solves a
      formal impossible condition. Here recognition depends on an
      environmental negative sign: the flower-wife's permitted night at
      home leaves no dew, while her field-bound companions are marked
      by it. KHM 160 needs this law for queries over riddle logic,
      plant transformation, marital recognition, and absence-as-proof.
    tier: operational
    scope: world
    lens: material
    domains: [riddle, flower, dew, recognition, transformation, marriage]
    related: [speech_riddle, transform_plant_human, state_transformed, affect_love, loc_field]
    examples: [a_riddling_tale]

  law_poison_transfers_through_consumption:
    name: Poison Transfers Through Consumption
    description: |
      Poison does not stop with its first victim. It can pass through
      flesh into another eater, making a corpse or cooked dish lethal
      because of what the body previously consumed.
    rationale: |
      Distinct from generic killing or witchcraft: this law names a
      material chain of toxic causality. In KHM 22 the poison kills the
      horse, enters the raven that eats the horse, and then kills the
      twelve robbers who eat raven soup. The entry enables queries for
      tales where food, corpse, and poison transfer agency across
      bodies.
    tier: operational
    scope: world
    lens: material
    domains: [poison, food, corpse, transfer, death]
    related: [being_witch, obj_poisoned_food, moral_retributive]
    examples: [the_riddle]

  law_truth_mirror_ranks_beauty:
    name: Truth Mirror Ranks Beauty
    description: |
      A speaking mirror or reflective oracle answers status questions
      truthfully, ranking beauty across a territory and revealing when
      a hidden rival has displaced the questioner.
    rationale: |
      Distinct from `law_dead_matter_reveals_murder`, where truth
      emerges from remains, and from `speech_prophecy`, which predicts
      future events. This law names a present-tense ranking mechanism:
      the mirror's repeated answers convert beauty into public-order
      information, expose Snow White's survival, and keep the queen's
      envy operational. KHM 53 needs it because the villain does not
      merely believe a rival exists; an object with truth-jurisdiction
      continually verifies and localizes her.
    tier: operational
    scope: world
    lens: structural
    domains: [mirror, beauty, truth, envy, ranking]
    related: [obj_truth_mirror, affect_envy, arc_cruel_stepmother, speech_testimony]
    examples: [obj_snow_white_truth_mirror]

  law_removable_death_token_restores_life:
    name: Removable Death Token Restores Life
    description: |
      A deathlike or lethal condition caused by a material object can
      be reversed when the object is cut away, pulled out, or otherwise
      dislodged before burial fixes the death socially.
    rationale: |
      Distinct from `law_serpent_medicine_restores_life`, where an
      external remedy revives the dead, and from
      `law_devouring_can_be_reversed`, where an intact body is rescued
      from inside a predator. Here the harmful object itself is the
      switch: laces, comb, and apple-piece suspend or kill Snow White
      until the object is removed. The law lets queries find tales
      where rescue depends on extracting the death-agent, not on a new
      healing substance, repentance, or counter-curse.
    tier: operational
    scope: world
    lens: material
    domains: [poison, object, death, body, reversal]
    related: [obj_poisoned_food, obj_display_coffin, state_liminal_dead, moral_restorative]
    examples: [obj_snow_white_stay_laces, obj_snow_white_poisoned_comb, obj_snow_white_poisoned_apple]

  law_glass_coffin_bolt_releases_living_maiden:
    name: Glass-Coffin Bolt Releases Living Maiden
    description: |
      A living maiden held in enchanted sleep inside a transparent
      coffin is released when the destined helper pushes back the
      coffin's bolt and raises the lid.
    rationale: |
      Distinct from `law_removable_death_token_restores_life`, where a
      harmful object inside or on the body must be removed from a
      deathlike victim, and from `law_softened_death_becomes_timed_sleep`,
      where sleep ends by completed time. Here the body is alive and
      visible, but the prison is architectural: bolt, lid, glass, and
      helper action make liberation possible. KHM 163 needs this law
      for queries over transparent living prisons, Sleeping-Beauty
      variants without a century term, and release by opening rather
      than by medicine, kiss, or time.
    tier: operational
    scope: world
    lens: material
    domains: [coffin, glass, imprisonment, sleep, maiden, release]
    related: [obj_enchanted_glass_coffin_prison, arc_imprisoned_maiden, state_imprisoned, state_enchanted_sleep, moral_restorative]
    examples: [the_glass_coffin]

  law_glass_mountain_opens_to_underworld_captivity:
    name: Glass Mountain Opens to Underworld Captivity
    description: |
      A slippery glass mountain can act as a sealed vertical threshold:
      a failed crossing opens the mountain, swallows the bride-like
      figure into an underground cave, and closes before rescuers can
      locate the entry.
    rationale: |
      Distinct from `loc_mountain`, which names ordinary elevation, and
      from `law_glass_coffin_bolt_releases_living_maiden`, where a
      transparent container displays a captive who can be released by
      opening its bolt. This law captures the glass mountain as an
      active trap: courtship crossing becomes descent, the surface
      erases the entry point, and years of underground servitude follow.
      It enables queries over glass barriers whose material smoothness
      is not scenery but a mechanism of bride-loss and subterranean
      imprisonment.
    tier: operational
    scope: world
    lens: material
    domains: [glass, mountain, captivity, descent, bride, underworld]
    related: [loc_glass_mountain, loc_cave, arc_imprisoned_maiden, state_imprisoned]
    examples: [old_rinkrank]

  law_captive_threshold_trap_extorts_escape_tool:
    name: Captive Threshold Trap Extorts Escape Tool
    description: |
      A captive can reverse household control by sealing the captor
      outside, leaving a small opening as bait, trapping the captor's
      vulnerable body part in that threshold, and forcing disclosure of
      the hidden escape tool.
    rationale: |
      Distinct from `law_decoy_bride_buys_escape`, where a substitute
      presence lets the bride flee a marriage scene, and from generic
      `agency_cunning`, which does not name the mechanism. In KHM 196
      the princess does not overpower Old Rinkrank; she turns his own
      house boundary against him, catches his beard in the window, and
      makes pain reveal the ladder. The law supports queries over
      domestic captivity broken through threshold control, body-part
      leverage, and coerced access to the captor's private tool.
    tier: operational
    scope: world
    lens: structural
    domains: [captivity, threshold, window, body, escape, tool]
    related: [state_imprisoned, threshold_doorway, agency_cunning, agency_object_mediation, moral_restorative]
    examples: [old_rinkrank]

  law_nested_animal_body_yields_crystal_power_object:
    name: Nested Animal Body Yields Crystal Power Object
    description: |
      A curse-breaking object may be hidden inside a sequence of animal
      bodies: a slain beast releases a fiery bird, the bird drops a
      burning egg, and the egg contains the crystal object that destroys
      the enchanter's power.
    rationale: |
      Distinct from `law_removable_death_token_restores_life`, where
      the harmful object is removed from the victim's body, and from
      `law_rescued_animals_repay_kindness`, where animals help because
      mercy created a reciprocal debt. This law captures KHM 197's
      externalized power-chain: combat, aerial pursuit, fire danger,
      water-cooling, and egg-shell opening all have to occur in order
      before the liberating crystal ball can be used. It enables
      queries over nested containers, animal bodies as magical storage,
      and enchantment broken by retrieving a concealed power-object.
    tier: operational
    scope: world
    lens: material
    domains: [animal-body, egg, crystal, enchantment, power-object, release]
    related: [obj_crystal_ball, sp_cattle, sp_bird, sp_whale, agency_violence, agency_animal_aid, moral_restorative]
    examples: [the_crystal_ball]

  law_dead_matter_reveals_murder:
    name: Dead Matter Reveals Murder
    description: |
      Human remains or death-marked objects can preserve a hidden crime
      and later disclose it through song, speech, or evidentiary
      manifestation before a witness or authority.
    rationale: |
      Distinct from `state_liminal_dead`, where a dead person returns
      as an active presence, and from ordinary `speech_confession`,
      where the guilty speak. This law gives testimony to matter: a
      bone cut into a horn-mouthpiece sings who killed it and why. KHM
      28 requires it because justice comes not from human suspicion but
      from the murdered body's remnant becoming a truth-bearing object.
    tier: operational
    scope: world
    lens: structural
    domains: [murder, truth, bone, testimony, music]
    related: [state_liminal_dead, speech_testimony, obj_singing_bone, moral_retributive]
    examples: [the_singing_bone]

  law_guilt_reads_natural_light_as_accusation:
    name: Guilt Reads Natural Light as Accusation
    description: |
      A murderer who has hidden a crime interprets ordinary sunlight,
      reflection, or another natural sign as the return of the victim's
      dying prophecy, and this guilty reading draws the secret into
      speech and public judgment.
    rationale: |
      Distinct from `law_dead_matter_reveals_murder`, where remains or
      objects testify by themselves, and from `speech_confession`,
      where a guilty person freely discloses guilt for repentance.
      Here the sun does not literally speak; the murderer supplies the
      accusatory meaning because the victim's last words have remained
      active inside his conscience. KHM 115 needs the law because the
      coffee-saucer reflection becomes evidence only through his own
      compelled explanation to his wife, gossip, and trial.
    tier: operational
    scope: world
    lens: cognitive
    domains: [murder, guilt, sunlight, confession, justice]
    related: [speech_confession, affect_guilt, moral_retributive]
    examples: [bright_sun_tailor]

  law_maternal_blood_token_guards_rank:
    name: Maternal Blood Token Guards Rank
    description: |
      A small blood-marked token given by the mother preserves moral
      and dynastic protection during travel; while it remains with the
      child it speaks on the mother's behalf and restrains displacement.
    rationale: |
      Distinct from `law_blood_restores_petrified`, where sacrificed
      kin-blood revives stone, and from `law_false_blood_evidence_
      convicts_innocent`, where blood is fabricated proof. KHM 89
      needs this law because the three drops of the queen's blood do
      not heal or accuse; they guard the bride's rank by answering her
      distress. Once the handkerchief floats away, the servant can
      force the role-exchange. The slot enables queries over maternal
      blood as protective speech-token rather than wound or evidence.
    tier: operational
    scope: world
    lens: material
    domains: [blood, mother, protection, rank, journey]
    related: [affect_maternal_love, speech_testimony, state_hidden_identity, obj_maternal_blood_token]
    examples: [the_goose_girl]

  law_salt_love_misread_exiles_true_child:
    name: Salt-Love Misread Exiles the True Child
    description: |
      A truthful comparison of filial love to salt is misread by royal
      pride as insult or insufficiency, causing the loving child to be
      exiled until the value of the humble substance and the child are
      recognized after loss.
    rationale: |
      Distinct from `law_maternal_blood_token_guards_rank`, where a
      mother's token protects a bride during travel, and from
      `law_true_fit_reveals_identity`, where bodily fit identifies the
      rightful person. KHM 179 needs this law because exile begins
      from semantic misvaluation: salt sounds low beside sugar and
      dress, but it names what makes food livable. The slot enables
      queries over love-test tales where necessary humble value is
      rejected by status-pride and restored through repentance.
    tier: operational
    scope: world
    lens: cognitive
    domains: [salt, love, filial, speech, exile, recognition]
    related: [speech_testimony, affect_pride, state_hidden_identity, moral_restorative]
    examples: [goose_girl_well_princess]

  law_pearl_tears_authenticate_lost_child:
    name: Pearl Tears Authenticate the Lost Child
    description: |
      Tears that become pearls or jewels preserve a bodily signature of
      the lost child; when one of those precious tears reappears, kin
      can recognize that the hidden or exiled child is still alive.
    rationale: |
      Distinct from `law_object_confession_circumvents_forced_oath`,
      where speech routed through an object exposes a wrong, and from
      `law_kitchen_tokens_reveal_hidden_bride`, where deliberately
      placed tokens invite courtship recognition. KHM 179 needs this
      law because the pearl in the emerald book is neither confession
      nor ordinary treasure: it is an embodied trace of the princess's
      grief, uniquely matching the jewels that used to fall from her
      eyes. The slot supports queries over affect-made-material as
      kinship proof.
    tier: operational
    scope: world
    lens: material
    domains: [tears, pearls, grief, recognition, kinship, hidden-identity]
    related: [obj_pearl_tears, affect_grief, state_hidden_identity, agency_object_mediation]
    examples: [obj_goose_girl_well_pearl]

  law_object_confession_circumvents_forced_oath:
    name: Object Confession Circumvents Forced Oath
    description: |
      A truth-bound or oath-silenced victim can disclose the hidden
      wrong by speaking to an object or enclosed thing rather than to a
      human being, allowing a concealed listener to hear without the
      victim breaking the oath directly.
    rationale: |
      Distinct from `speech_confession`, where the guilty self-accuse,
      and from `law_dead_matter_reveals_murder`, where the object
      itself testifies. In KHM 89 the true bride cannot tell any human
      at court because the false bride forced an oath; telling the iron
      stove lets the old king hear the truth from outside the pipe. The
      slot supports queries over constrained truth-telling, overheard
      lament, and speech routed through objects.
    tier: operational
    scope: world
    lens: structural
    domains: [oath, testimony, object, overhearing, hidden-identity]
    related: [state_bound_by_promise, speech_testimony, state_hidden_identity, moral_retributive]
    examples: [the_goose_girl]

  law_cheese_rind_test_reveals_domestic_measure:
    name: Cheese-Rind Test Reveals Domestic Measure
    description: |
      A small eating test can reveal a prospective spouse's household
      judgment: wastefulness, carelessness, or measured thrift becomes
      visible in how the cheese rind is handled.
    rationale: |
      Distinct from `law_paradox_condition_proves_wisdom`, where a
      formal riddle is solved by clever staging, and from
      `law_true_fit_reveals_identity`, where an object proves a hidden
      rightful person. Here there is no mystery identity and no
      supernatural test; ordinary table behaviour becomes diagnostic
      evidence for marriage choice. KHM 155 needs this law for queries
      over domestic prudence, food-handling tests, maternal counsel,
      and spouse selection by small material habits.
    tier: operational
    scope: world
    lens: material
    domains: [marriage, food, prudence, household, test, thrift]
    related: [agency_object_mediation, agency_domestic_labor, moral_prudent_selection, num_3]
    examples: [brides_on_their_trial]

  law_discarded_flax_reveals_domestic_industry:
    name: Discarded Flax Reveals Domestic Industry
    description: |
      Textile waste can become a visible diagnostic of marriage-worth:
      one woman throws usable flax away in idleness, while another
      gathers, cleans, spins, and wears it as proof of industry.
    rationale: |
      Distinct from `law_fake_domestic_omens_suspend_labor`, where a
      lazy spouse avoids work by deception, and from
      `law_cheese_rind_test_reveals_domestic_measure`, where a planned
      food test reveals prudence before betrothal. Here the bride's own
      irritated waste becomes material evidence only after a servant's
      labour transforms it into a dress and the bride accidentally
      names its source. KHM 156 needs this law for queries over
      textile leftovers, self-exposing idleness, servant industry, and
      marriage re-selection by domestic labour evidence.
    tier: operational
    scope: world
    lens: material
    domains: [textile, flax, idleness, industry, marriage, evidence]
    related: [agency_domestic_labor, agency_object_mediation, affect_sloth, moral_prudent_selection, obj_spinning_wheel]
    examples: [odds_and_ends]

  law_self_sentence_punishes_false_bride:
    name: Self-Sentence Punishes False Bride
    description: |
      A hidden wrongdoer is asked to judge a described offender and,
      not recognizing herself in the account, pronounces the punishment
      that will be applied to her.
    rationale: |
      Distinct from ordinary `moral_retributive`, which names the
      closure regime, and from `speech_riddle`, where answering solves
      an intellectual test. KHM 89 needs a mechanism term because the
      old king's riddle-like narration makes the false bride author her
      own death sentence; justice is not merely imposed from outside
      but mirrored through her own harsh judgment.
    tier: operational
    scope: world
    lens: cognitive
    domains: [judgment, self-condemnation, false-bride, punishment, riddle]
    related: [arc_false_bride, speech_riddle, moral_retributive]
    examples: [the_goose_girl]

  law_drowned_bride_returns_as_white_duck:
    name: Drowned Bride Returns as White Duck
    description: |
      A true bride thrown from a bridge into water does not vanish; she
      returns as a white duck through the kitchen water-channel, asks
      after kin and the false bride, and can be restored to human form
      when the animal neck is cut by the rightful authority.
    rationale: |
      Distinct from `transform_revenant_bird`, where a murdered child
      becomes a singing bird that exposes crime through song, and from
      `law_enchanted_water_transforms`, where drinking charged water
      triggers animal form. Here the water-murder itself produces a
      liminal water-bird bride whose repeated domestic visit routes
      truth through servants and the hearth before restoration. KHM
      135 needs this law to connect bridge-murder, duck-form return,
      kitchen testimony, and false-bride exposure without flattening
      the episode into generic bird transformation.
    tier: operational
    scope: world
    lens: structural
    domains: [false-bride, water, duck, revenant, testimony, restoration]
    related: [arc_false_bride, sp_duck, state_liminal_dead, loc_river, speech_testimony]
    examples: [the_white_bride_and_the_black_one]

  law_birth_substitution_false_animal_accusation:
    name: Birth Substitution Creates False Animal Accusation
    description: |
      A newborn royal child is removed or killed and replaced in report
      by an animal birth, making the mother appear monstrous,
      polluted, or unfit for marriage and rule.
    rationale: |
      Distinct from `law_false_blood_evidence_convicts_innocent`,
      where a fabricated blood token proves an alleged crime, and from
      `arc_false_bride`, where a rival occupies the wife's body or
      bed. Here the false evidence is reproductive: dog and cat births
      are reported in place of human children until the king's trust
      breaks and the queen is imprisoned. KHM 96 needs this law for
      ATU 707's birth-substitution mechanism, where dynastic truth is
      attacked through the mother's maternity.
    tier: operational
    scope: world
    lens: structural
    domains: [birth, substitution, false-accusation, animals, maternity]
    related: [arc_envious_kin_persecutor, affect_envy, speech_lie, state_imprisoned]
    examples: [three_little_birds_false_births]

  law_truth_bird_reveals_hidden_lineage:
    name: Truth Bird Reveals Hidden Lineage
    description: |
      A magic or prophetic bird preserves the suppressed truth of
      birth, kinship, or crime and later sings that truth before the
      authority who can restore the family.
    rationale: |
      Distinct from `law_dead_matter_reveals_murder`, where remains
      testify after death, and from `law_voice_recognizes_forgotten_bride`,
      where a beloved voice restores memory. The truth bird is an
      external witness to dynastic substitution: in KHM 96 the bird
      sings at each water-casting and finally identifies the three
      children to the king. The node supports queries over ATU 707's
      bird-of-truth structure and over animal testimony that restores
      lineage rather than merely exposes murder.
    tier: operational
    scope: world
    lens: structural
    domains: [bird, truth, lineage, testimony, restoration]
    related: [obj_truth_telling_bird, speech_testimony, arc_foundling_child, moral_restorative]
    examples: [three_little_birds_truth_bird]

  law_stolen_healing_water_frames_true_quester:
    name: Stolen Healing Water Frames True Quester
    description: |
      False heroes steal the life-giving remedy won by the true quester
      and replace it with harmful liquid, so the healer appears to be a
      poisoner while the thieves receive the healing credit.
    rationale: |
      Distinct from `law_false_blood_evidence_convicts_innocent`,
      where fabricated blood proves an alleged bodily crime, and from
      `arc_false_hero`, which names the role rather than the mechanism.
      KHM 97 needs the law because the decisive betrayal is material
      substitution: water of life becomes salt sea-water in the cup.
      The node supports queries over stolen remedies, inverted healing,
      false sons, and silence under coercive threat.
    tier: operational
    scope: world
    lens: material
    domains: [healing-water, false-hero, substitution, poisoning, sibling]
    related: [obj_water_of_life, arc_false_hero, state_deceived, moral_retributive]
    examples: [water_of_life_stolen_cup]

  law_golden_road_recognizes_true_deliverer:
    name: Golden Road Recognizes True Deliverer
    description: |
      A prepared royal road or path admits the true bridegroom because
      he follows it without self-conscious calculation, while false
      claimants avoid or spoil it and are refused.
    rationale: |
      Distinct from `law_true_fit_reveals_identity`, where bodily fit
      proves identity, and from `law_animal_advice_requires_exact_obedience`,
      where correct following of counsel secures a quest object. Here
      recognition is spatial and affective: the false brothers avoid
      the golden road out of possessive caution, but the true deliverer
      rides straight because he is thinking of the princess. The slot
      supports queries over path-recognition, true wooer tests, and
      false-hero exclusion without courtroom proof.
    tier: operational
    scope: world
    lens: structural
    domains: [road, recognition, false-hero, bridegroom, gold]
    related: [arc_false_hero, loc_road, affect_love, moral_restorative]
    examples: [water_of_life_golden_road]

  law_contagious_lament_cascades:
    name: Contagious Lament Cascades
    description: |
      One injury or grief-utterance can pass from listener to listener,
      causing each being or object to enact a stronger sympathetic
      response until the whole local world is undone.
    rationale: |
      Distinct from `law_etiological_mishap_marks_species`, which
      explains a lasting mark on a kind, and from `law_collective_noise_
      magnifies_the_weak`, where coordinated sound creates tactical
      advantage. This law names cumulative affective contagion: flea
      screams, door creaks, broom sweeps, cart runs, ash burns, tree
      shakes, girl breaks pitcher, spring floods everything. KHM 30
      needs a law for narrative escalation by repeated lament rather
      than by task, combat, or moral choice.
    tier: operational
    scope: world
    lens: structural
    domains: [lament, contagion, cascade, affect, destruction]
    related: [affect_grief, moral_comic_inversion, being_animated_object]
    examples: [little_louse_and_little_flea]

  law_hoarded_share_chokes_holder:
    name: Hoarded Share Chokes the Holder
    description: |
      Food promised for sharing becomes fatal when one partner hides
      and tries to swallow it alone; the withheld portion lodges in the
      body and turns private appetite into immediate danger.
    rationale: |
      Distinct from `law_gluttony_traps_predator`, where an already
      predatory figure is caught by excessive return for food, and from
      `affect_greed`, which names the motive. This law names the
      material consequence of broken sharing: the nut kernel itself
      stops the hen's throat, and help arrives too late. KHM 80 needs
      the slot because the whole funeral cascade begins in a violated
      food agreement, not in arbitrary accident alone.
    tier: operational
    scope: world
    lens: material
    domains: [food, sharing, greed, choking, body]
    related: [affect_greed, affect_hunger, moral_comic_inversion]
    examples: [the_death_of_the_little_hen]

  law_hidden_elder_food_becomes_clinging_burden:
    name: Hidden Elder-Food Becomes Clinging Burden
    description: |
      Food concealed from an aged parent or elder mutates into a
      punitive animal burden attached to the offender's body, forcing
      the denied act of feeding to continue without rest.
    rationale: |
      Distinct from `law_child_mirror_reveals_filial_future`, where
      elder neglect is corrected by intergenerational recognition, and
      from `law_hoarded_share_chokes_holder`, where a broken sharing
      agreement kills the hoarder directly. Here the withheld meal is
      not consumed: it transforms into a toad that externalizes filial
      failure on the son's face. KHM 145 needs the law because the
      punishment is a permanent bodily attachment and feeding duty,
      not social reform, confession, or simple food-theft reversal.
    tier: operational
    scope: world
    lens: material
    domains: [food, old-age, filial-duty, transformation, punishment, body]
    related: [arc_neglected_elder, sp_toad, affect_greed, moral_retributive]
    examples: [ungrateful_son_face_toad]

  law_witnessed_fire_demands_compassionate_extinguishing:
    name: Witnessed Fire Demands Compassionate Extinguishing
    description: |
      Seeing a vulnerable guest's clothing or body catch fire creates
      an immediate obligation to extinguish it, even if ordinary water
      is absent and the helper must spend tears as substitute water.
    rationale: |
      Distinct from `law_kindness_to_hidden_donors_rewarded`, where a
      visitor tests hospitality and repays conduct, and from
      `moral_mercy_over_judgment`, where divine restraint corrects
      harsh punishment. KHM 150 has no reward, judge, or explicit
      punishment; it is a direct moral address in which the boy's
      failure is the gap between kind invitation and necessary bodily
      aid. The law makes actionable compassion queryable: fire seen
      must be put out, and pity that does not become water is morally
      insufficient.
    tier: operational
    scope: world
    lens: cognitive
    domains: [compassion, fire, old-age, hospitality, tears, aid]
    related: [affect_pity, loc_hearth, agency_object_mediation, moral_compassionate_aid]
    examples: [old_beggar_woman_burning_rags]

  law_cruel_caregiving_converts_simple_error_into_fatal_despair:
    name: Cruel Caregiving Converts Simple Error into Fatal Despair
    description: |
      When a dependent child is starved, beaten, and threatened instead
      of taught, ordinary mistakes become existential danger. Hunger
      makes small thefts or failures likely, blows make correction
      terrifying, and fear of the next punishment can drive the child
      toward death.
    rationale: |
      Distinct from `law_foolish_remedy_compounds_loss`, where a fool's
      attempted repair worsens a material problem, and from
      `law_unrepaired_small_defect_cascades_into_disaster`, where
      ignored maintenance causes mechanical loss. Here the causal force
      is abusive dependency: the boy's errors are framed by hunger,
      beatings, and adult refusal to teach. KHM 185 needs the law
      because the final grave-death grows from a household regime of
      cruelty, not from innate wickedness or comic foolishness.
    tier: operational
    scope: world
    lens: cognitive
    domains: [abuse, orphan, hunger, punishment, despair, dependency]
    related: [affect_despair, affect_hunger, affect_fear, agency_domestic_labor, moral_retributive]
    examples: [the_poor_boy_in_the_grave]

  law_total_almsgiving_draws_heavenly_replacement:
    name: Total Almsgiving Draws Heavenly Replacement
    description: |
      Complete self-divesting charity can convert heavenly signs into
      material provision: once the giver has surrendered food and every
      garment to the needy, new clothing and money fall from above.
    rationale: |
      Distinct from `law_kindness_to_hidden_donors_rewarded`, where
      disguised testers reward polite conduct, and from
      `law_witnessed_fire_demands_compassionate_extinguishing`, where
      compassion is a practical duty without exchange closure. Here
      the recipients are openly poor and cold, the giver is poorer than
      they are, and the reward arrives only after total divestment.
      KHM 153 needs this law for queries over almsgiving, pious
      poverty, heavenly money, and replacement garments rather than
      generic kindness tests.
    tier: operational
    scope: world
    lens: material
    domains: [charity, almsgiving, heaven, money, garment, poverty]
    related: [arc_pious_orphan, affect_pity, loc_heaven, moral_providential_election, moral_kindness_rewarded]
    examples: [the_star_money]

  law_blooming_rose_marks_heavenly_child_return:
    name: Blooming Rose Marks Heavenly Child Return
    description: |
      A rose given by a beautiful divine child can function as a timed
      sign: when it comes into full bloom, the aided child dies happily,
      implying return to the heavenly helper.
    rationale: |
      Distinct from `law_total_almsgiving_draws_heavenly_replacement`,
      where heaven replaces surrendered goods, and from generic
      `moral_providential_protection`, which names protection without a
      visible clock. In Legend 3 the rose is not a reward to spend or a
      proof token in court; it synchronizes earthly death with sacred
      return. The law enables queries over flowers as devotional time
      markers, child death softened as heavenly reception, and signs
      whose fulfilment is bloom rather than speech.
    tier: operational
    scope: world
    lens: material
    domains: [rose, child, death, heaven, sign, timing]
    related: [being_divine, loc_heaven, affect_joy, moral_providential_protection]
    examples: [legend_03_the_rose]

  law_voluntary_poverty_and_humility_open_heaven:
    name: Voluntary Poverty and Humility Open Heaven
    description: |
      A high-born person who willingly exchanges rank, clothing, money,
      and recognition for years of poverty, begging, prayer, and patient
      suffering can reach heaven at death.
    rationale: |
      Distinct from `moral_heavenly_equality`, where rich and poor are
      equal after salvation, and from `law_total_almsgiving_draws_
      heavenly_replacement`, where charity produces material reward.
      Here poverty is deliberately chosen as a discipline: the prince
      puts on beggar clothing, refuses wealth, endures misrecognition,
      and receives sacramental closure. The law supports queries over
      humility as route, poverty as ascetic practice, and royal
      self-emptying in religious legends.
    tier: operational
    scope: world
    lens: structural
    domains: [poverty, humility, heaven, prince, prayer, asceticism]
    related: [loc_heaven, speech_prayer, agency_endurance, moral_providential_protection]
    examples: [legend_04_poverty_and_humility_lead_to_heaven]

  law_refused_bread_bleeds_as_divine_accusation:
    name: Refused Bread Bleeds as Divine Accusation
    description: |
      Bread denied to starving kin can turn to blood when cut, making
      the refused food itself accuse the hard-hearted household before
      human help arrives too late.
    rationale: |
      Distinct from `law_dead_matter_reveals_murder`, where remains
      disclose a past crime, and from generic `moral_retributive`,
      which classifies punishment without naming its sign. In Legend 5
      the loaf is not poisoned or magical food for abundance; it is the
      withheld meal made visibly bloody after charity fails. The law
      enables queries over Eucharistic or devotional food signs,
      kinship refusal, hunger, and divine accusation embedded in
      household bread.
    tier: operational
    scope: world
    lens: material
    domains: [bread, blood, hunger, charity, kinship, divine-judgment]
    related: [affect_hunger, affect_pity, speech_prayer, moral_retributive]
    examples: [legend_05_gods_food]

  law_judgment_word_interrupts_visible_grace:
    name: Judgment Word Interrupts Visible Grace
    description: |
      A careless human condemnation of another sinner can interrupt
      visible divine favor: angelic companionship and food disappear
      until the speaker repents and accepts penance.
    rationale: |
      Distinct from generic `moral_retributive`, which names punishment
      but not its devotional mechanism, and from `speech_curse`, where
      words act directly as hostile magic. In Legend 6 the hermit's
      single phrase about a condemned man breaks a daily economy of
      angelic aid. The law supports queries over judgment, mercy,
      penitence, and speech whose harm lies in usurping divine
      judgment rather than in cursing.
    tier: operational
    scope: world
    lens: structural
    domains: [judgment, mercy, penance, angel, speech, grace]
    related: [moral_mercy_over_judgment, moral_repentance, speech_testimony, agency_speech]
    examples: [legend_06_the_three_green_twigs]

  law_dry_branch_sprouts_when_penance_converts_sinners:
    name: Dry Branch Sprouts When Penance Converts Sinners
    description: |
      A dry branch carried as penance can put out green twigs at the
      penitent's death when his confession turns other sinners toward
      repentance.
    rationale: |
      Distinct from `law_blooming_rose_marks_heavenly_child_return`,
      where a flower is a timed sign of heavenly reception, and from
      generic restorative morality. In Legend 6 the dead wood is a
      penance object, pillow, and final proof: it greens only after the
      hermit's testimony converts the robbers. The law enables queries
      over dry wood, penitential objects, death signs, and repentance
      that becomes contagious through narrated sin.
    tier: operational
    scope: world
    lens: material
    domains: [penance, branch, repentance, death, conversion, green]
    related: [moral_repentance, agency_endurance, speech_testimony, num_3]
    examples: [legend_06_the_three_green_twigs]

  law_sacred_flower_cup_releases_stuck_cart:
    name: Sacred Flower Cup Releases Stuck Cart
    description: |
      A humble flower can become the vessel of hospitality to a sacred
      visitor; once it carries the offered wine, the immobilized cart is
      released.
    rationale: |
      Distinct from ordinary `moral_kindness_rewarded`, which marks the
      reward pattern without naming its object logic. In Legend 7 the
      obstacle is not solved by force but by Marian improvisation: a
      bindweed flower becomes a glass, receives wine, and converts
      hospitality into movement. The law supports queries over sacred
      visitors, flower-vessels, roadside distress, and etiological
      naming of devotional plants.
    tier: operational
    scope: world
    lens: material
    domains: [flower, wine, hospitality, road, mary, release]
    related: [being_divine, agency_object_mediation, speech_request, moral_kindness_rewarded]
    examples: [legend_07_our_ladys_little_glass]

  law_revenant_church_reframes_loss_as_mercy:
    name: Revenant Church Reframes Loss as Mercy
    description: |
      A nocturnal church filled with the dead can reveal that a child's
      early death prevented later criminal damnation, turning grief and
      accusation against God into gratitude.
    rationale: |
      Distinct from general `moral_providential_protection`, which
      names the theological regime without the scene-form that discloses
      it. In Legend 8 dead kin occupy the church and show the mother
      the gallows and wheel that awaited her sons. The law supports
      queries over revenant liturgy, child death, providential loss,
      and visions that transform blame into thanksgiving.
    tier: operational
    scope: world
    lens: structural
    domains: [death, church, revenant, grief, providence, judgment]
    related: [being_spirit, state_liminal_dead, loc_church, loc_gallows, moral_providential_protection]
    examples: [legend_08_the_aged_mother]

  law_child_feeding_sacred_image_invites_heavenly_wedding:
    name: Child Feeding Sacred Image Invites Heavenly Wedding
    description: |
      A child's literal piety toward a sacred image can make the image
      eat, grow strong, speak, and invite the child to a heavenly
      wedding fulfilled through death after communion.
    rationale: |
      Distinct from `obj_sacred_answering_image`, which names the
      material image type, and from generic `moral_providential_
      protection`, which does not capture the feeding exchange. In
      Legend 9 the boy mistakes church for heaven and image for God,
      but the tale treats that error as pure devotion: his shared food
      animates the image and leads him to eternal wedding. The law
      supports queries over child piety, animated devotional images,
      sacramental death, and literal belief rewarded rather than
      corrected.
    tier: operational
    scope: world
    lens: material
    domains: [child, image, food, church, heaven, wedding]
    related: [obj_sacred_answering_image, loc_church, loc_heaven, affect_joy, moral_providential_protection]
    examples: [legend_09_the_heavenly_wedding]

  law_marian_hazel_branch_protects_against_serpents:
    name: Marian Hazel Branch Protects Against Serpents
    description: |
      A hazel bush that shelters Our Lady from an adder receives a
      lasting protective virtue: its green branch becomes protection
      against snakes and creeping things.
    rationale: |
      Distinct from ordinary botanical etiology because the protection
      is granted by blessing after reciprocal shelter. In Legend 10
      the hazel first protects Mary, then Mary declares that it shall
      protect others. The law supports queries over Marian plant
      blessings, serpent danger, protective branches, and sacred
      etiology attached to household apotropaic practice.
    tier: operational
    scope: world
    lens: material
    domains: [mary, hazel, branch, snake, blessing, protection]
    related: [being_divine, sp_snake, speech_blessing, loc_forest, moral_providential_protection]
    examples: [legend_10_the_hazel_branch]

  law_hypothetical_fear_contagion:
    name: Hypothetical Fear Contagion
    description: |
      A merely possible future disaster is treated as emotionally
      present and spreads from speaker to listeners as if it had
      already happened. Each listener accepts the imagined chain of
      conditions and joins the lament instead of correcting the
      improbability.
    rationale: |
      Distinct from `law_contagious_lament_cascades`, where an actual
      death or accident triggers escalating grief. In KHM 34 no child
      exists, no pickaxe has fallen, and no death has occurred; Elsie
      imagines marriage, childbirth, future beer-drawing, and a falling
      tool, and the household mourns the hypothetical as real. The law
      names comic forethought becoming social affect.
    tier: operational
    scope: world
    lens: cognitive
    domains: [fear, forethought, hypothetical, contagion, household]
    related: [arc_fool, affect_fear, moral_comic_inversion]
    examples: [clever_elsie]

  law_hypothetical_gain_escalates_domestic_quarrel:
    name: Hypothetical Gain Escalates Domestic Quarrel
    description: |
      An imagined chain of future household profit is treated as if it
      already creates rights, duties, scarcity, and ownership, so
      spouses begin fighting in the present over goods that do not yet
      exist.
    rationale: |
      Distinct from `law_hypothetical_fear_contagion`, where an
      imagined future disaster spreads as fear and lament, and from
      `law_labor_avoidance_exchange_converts_care_to_loss`, where a
      real stored gain is destroyed during future care-planning. KHM
      168 needs this law because Lisa's non-existent florins, cow,
      calf, and milk become grounds for immediate marital accusation,
      insult, and bodily restraint. The slot enables queries over
      domestic schwanks where projection itself materializes conflict
      before any property has been acquired.
    tier: operational
    scope: world
    lens: cognitive
    domains: [hypothetical, marriage, property, livestock, quarrel]
    related: [agency_speech, agency_domestic_labor, affect_anger, affect_greed, sp_cattle, moral_comic_inversion]
    examples: [lean_lisa]

  law_fearful_misrecognition_turns_signs_deadly:
    name: Fearful Misrecognition Turns Signs Deadly
    description: |
      Harmless or ambiguous sensory signs are interpreted as mortal
      danger, and the frightened group's own response creates the
      injury, humiliation, or death that no real enemy threatened.
    rationale: |
      Distinct from `law_hypothetical_fear_contagion`, where an
      imagined future disaster spreads without an external stimulus,
      and from `law_accidental_noise_routes_rogues`, where misread
      signs accidentally help the protagonists. Here fear is self-
      destructive: a beetle's hum becomes a war drum, a hare becomes a
      dragon, and a frog's croak is heard as a drowned leader calling
      the rest into the river. KHM 119 needs the law to query comic
      cowardice where perception, dialect, and panic turn harmless
      signs into fatal action.
    tier: operational
    scope: world
    lens: cognitive
    domains: [fear, misrecognition, collective, animal, death, schwank]
    related: [arc_fool, affect_fear, state_deceived, sp_insect, sp_hare, sp_frog, threshold_river]
    examples: [the_seven_swabians]

  law_etiological_mishap_marks_species:
    name: Etiological Mishap Marks the Species
    description: |
      A comic accident involving one exemplary creature or object
      becomes the origin explanation for a permanent visible mark on
      all later members of its kind.
    rationale: |
      Distinct from `moral_retributive`, which punishes a wrongdoer,
      and from `moral_comic_inversion`, which names the tale's comic
      regime. This is an operational origin-law: one bean bursts,
      is sewn with black thread, and all beans thereafter bear a black
      seam. The entry enables queries for Grimm etiologies where a
      present-day feature is explained by a narrative mishap.
    tier: operational
    scope: world
    lens: structural
    domains: [etiology, body-mark, comedy, origin, food]
    related: [moral_comic_inversion, obj_needle_thread]
    examples: [straw_coal_and_bean]

  law_role_exchange_breaks_domestic_order:
    name: Role Exchange Breaks Domestic Order
    description: |
      A household division of labour works only while each member
      performs the role fitted to their body and competence; forced
      novelty or envious role-swapping turns ordinary tasks into fatal
      hazards.
    rationale: |
      Distinct from `law_etiological_mishap_marks_species`, which
      explains a visible bodily mark, and from `agency_domestic_labor`,
      which names labour as a mode of action. This law names a comic
      causal grammar: cooking, fetching wood, and drawing water are
      safe in the established arrangement but become lethal when
      redistributed by resentment. KHM 23 requires it because every
      death follows from misassigned domestic work rather than from a
      quest, curse, or ordinary predator plot.
    tier: operational
    scope: world
    lens: structural
    domains: [domestic, labour, role-exchange, comedy, misassignment]
    related: [agency_domestic_labor, moral_comic_inversion, being_animated_object]
    examples: [the_mouse_the_bird_and_the_sausage]

  law_collective_noise_magnifies_the_weak:
    name: Collective Noise Magnifies the Weak
    description: |
      Individually exhausted or discarded animals can become powerful
      when their bodies and voices are stacked into a single confusing
      collective performance that stronger enemies misrecognise as a
      supernatural or juridical threat.
    rationale: |
      Distinct from `law_music_attracts`, where music charms listeners
      toward the performer, and from ordinary `agency_violence`, where
      force is direct. In KHM 27 the animals' braying, barking,
      mewing, crowing, window-breaking, scratching, biting, kicking,
      and shouting convert weakness into amplified terror. The robbers
      flee not because the animals are objectively stronger but because
      collective sound and surprise make them seem like witch, knife
      man, monster, and judge.
    tier: operational
    scope: world
    lens: structural
    domains: [music, noise, collective, weakness, misrecognition]
    related: [agency_music, agency_violence, moral_trickster_wins]
    examples: [the_bremen_town_musicians]

  law_specialized_companions_solve_impossible_tasks:
    name: Specialized Companions Solve Impossible Tasks
    description: |
      A leader assembles companions with extreme, single-purpose bodily
      powers, then succeeds because each companion answers exactly the
      task or countermeasure suited to that power.
    rationale: |
      Distinct from `law_collective_noise_magnifies_the_weak`, where a
      weak group's combined sound produces misrecognition, and from
      `law_militarized_objects_create_sovereignty`, where portable
      magic objects create force. Here the operative machinery is a
      team of bodies: speed wins the water race, sight and marksmanship
      wake the runner, cold defeats the iron room, strength carries the
      kingdom's treasure, and breath scatters pursuing regiments. KHM
      71 needs this law to model ensemble capacity rather than lone
      heroism.
    tier: operational
    scope: world
    lens: structural
    domains: [companions, body, task, ensemble, impossible-task]
    related: [arc_extraordinary_companion, agency_extraordinary_body, moral_trickster_wins]
    examples: [how_six_men_got_on_in_the_world, the_six_servants]

  law_giant_nurture_magnifies_body:
    name: Giant Nurture Magnifies Body
    description: |
      A tiny or undersized child raised and fed by a giant can grow
      into a body scaled to giant strength rather than to ordinary
      human family measure.
    rationale: |
      Distinct from `state_transformed`, which only names altered
      form, and from `law_tiny_body_enables_hidden_agency`, where
      smallness remains the advantage. KHM 90 needs this law because
      the original thumb-sized child is not cured by medicine or magic
      object; six years of giant suckling and forest strength-tests
      convert him into a young giant. This slot enables queries over
      nurture-as-ontological-scaling in strong-boy tales.
    tier: operational
    scope: world
    lens: material
    domains: [giant, nurture, growth, strength, child]
    related: [arc_superstrong_youth, being_giant, agency_extraordinary_body]
    examples: [the_young_giant]

  law_life_ring_confers_strength_and_lion_mastery:
    name: Life-Ring Confers Strength and Lion Mastery
    description: |
      A ring guarding the apple of the Tree of Life closes on the
      quester's arm, sends extraordinary strength through the body, and
      turns the guarding lion into a faithful companion.
    rationale: |
      Distinct from `law_wishing_ring_obeys_but_exposes_broken_promise`,
      where a ring executes wishes, and from
      `law_animal_advice_requires_exact_obedience`, where an animal
      helper gives counsel. Here the ring is not a command tool but a
      bodily investiture: passing the hand through it to take the apple
      makes the hero strong enough to burst the gate and converts the
      lion from guardian into servant. KHM 121 needs this law for
      queries over Tree-of-Life quests where strength, token, apple,
      and animal lordship are acquired in one material action.
    tier: operational
    scope: world
    lens: material
    domains: [tree-of-life, ring, strength, lion, quest-object]
    related: [obj_life_strength_ring, obj_life_apple, sp_lion, agency_extraordinary_body]
    examples: [the_kings_son_who_feared_nothing]

  law_blow_wage_reverses_greedy_employer:
    name: Blow-Wage Reverses Greedy Employer
    description: |
      A superstrong worker offers labour for no money but reserves the
      right to pay the employer in blows; greedy masters accept the
      bargain as savings and later face bodily consequences they cannot
      withstand.
    rationale: |
      Distinct from `law_coercive_retrieval_voids_exchange`, where
      force retrieves traded goods, and from generic `moral_retributive`,
      which names the justice regime. KHM 90 needs this law because the
      smith and bailiff are not defeated by normal wage negotiation but
      by accepting an impossible bodily contract: the worker's "small
      blow" kicks the smith over hay, and the delayed annual blows send
      the bailiff and wife into the air. The slot supports queries over
      labour bargains where greed misprices bodily power.
    tier: operational
    scope: world
    lens: structural
    domains: [labor, wage, greed, strength, punishment]
    related: [arc_superstrong_youth, affect_greed, agency_extraordinary_body, moral_retributive]
    examples: [the_young_giant]

  law_rogue_company_weaponizes_household:
    name: Rogue Company Weaponizes Household
    description: |
      A mixed company of animals and animated objects can occupy
      ordinary household fixtures as hidden traps, turning hearth,
      towel, chair, bed, door, or analogous domestic supports into a
      sequential ambush against the host or target.
    rationale: |
      Distinct from `law_collective_noise_magnifies_the_weak`, where
      coordinated sound and misrecognition defeat enemies, and from
      `law_role_exchange_breaks_domestic_order`, where labour
      misassignment causes domestic collapse. This law names trap-
      placement inside the house: the rogues do not simply travel or
      make noise; they convert domestic comfort into staged injury.
      KHM 10 and KHM 41 share this mechanism even though one injures an
      inn host and the other kills Herr Korbes.
    tier: operational
    scope: world
    lens: material
    domains: [household, trap, rogue-company, animated-object, punishment]
    related: [being_animated_object, agency_cunning, agency_violence, moral_retributive]
    examples: [the_pack_of_ragamuffins, herr_korbes]

  law_silent_endurance_redeems:
    name: Silent Endurance Redeems
    description: |
      A transformation or threatened death can be undone only by a long
      period of absolute silence: the redeemer may not speak, laugh, or
      defend herself until the appointed term is complete.
    rationale: |
      Distinct from `law_repentance_restores` (speech-confession
      restores) and from `law_prophecy_compels_sacrifice` (knowledge
      must remain silent because speaking carries bodily cost).
      Silent-endurance redemption is the inverse: silence itself is the
      active work that frees kin. KHM 9 requires seven speechless years
      to restore twelve raven-brothers; KHM 49 and related tales repeat
      the same grammar. This law enables queries for tales where rescue
      happens through disciplined non-speech rather than action.
    tier: operational
    scope: world
    lens: structural
    domains: [silence, endurance, kinship, redemption]
    related: [state_mute, arc_silent_bride, moral_silent_endurance]
    examples: [twelve_brothers_sister]

  law_silent_torment_releases_enchanted_princess:
    name: Silent Torment Releases Enchanted Princess
    description: |
      A promised rescuer frees an enchanted princess and kingdom by
      enduring nights of beating, stabbing, death, or dismemberment
      without speaking until the hostile powers' time expires.
    rationale: |
      Distinct from `law_silent_endurance_redeems`, where prolonged
      silence is the protagonist's vow to save kin, and from
      `law_curse_requires_counter_condition`, which names release
      conditions in general. KHM 92 needs a specific law because the
      prince's silence is not social endurance but ritual non-response
      under violent torment: twelve and then twenty-four black men
      lose power at midnight, and the enchanted snake-princess can
      revive him with water of life. This slot supports queries over
      enchanted-castle releases by silent suffering.
    tier: operational
    scope: world
    lens: structural
    domains: [silence, torment, enchantment, castle, rescue]
    related: [state_cursed, agency_endurance, obj_water_of_life, moral_restorative]
    examples: [the_king_of_the_golden_mountain]

  law_failed_silence_gaze_taboo_sinks_enchanted_castle:
    name: Failed Silence and Gaze Taboo Sinks Enchanted Castle
    description: |
      An enchanted castle and its black-clad princesses can be released
      only if the rescuer keeps a fixed term of not speaking to them
      and not looking at them; fearful outside intervention with
      scalding water partially alters them, voids the release, and
      makes the castle sink back into the mountain.
    rationale: |
      Distinct from `law_silent_endurance_redeems`, where silence is
      chosen to redeem kin through labour, and from
      `law_silent_torment_releases_enchanted_princess`, where the
      rescuer must endure violence without crying out. Here the
      condition combines silence, no-gaze, time, and non-interference:
      the hero's mother reframes the enchanted women as dangerous and
      supplies boiling water, so the rescue becomes an irreversible
      failure. KHM 137 needs this law for queries over failed
      disenchantment, black/white partial transformation, and
      subterranean castles closed by violated taboos.
    tier: operational
    scope: world
    lens: structural
    domains: [silence, gaze, enchantment, castle, failure, water]
    related: [state_cursed, loc_castle, loc_mountain, affect_fear, num_3]
    examples: [the_three_black_princesses]

  law_redeeming_garments_restore_body:
    name: Redeeming Garments Restore Body
    description: |
      Garments made under a release condition can restore transformed
      kin to human bodies when placed on them; an unfinished garment
      produces incomplete restoration.
    rationale: |
      Distinct from `law_silent_endurance_redeems`, which names the
      long non-speech ordeal, and from generic
      `law_curse_requires_counter_condition`, which does not specify
      the material instrument. KHM 49 needs this law because the six
      years of silence are inseparable from sewing six shirts of
      starwort, and the missing left sleeve leaves the youngest brother
      with a swan's wing instead of an arm. The slot enables queries for
      transformation reversal through crafted clothing, textile labour,
      and partial restoration.
    tier: operational
    scope: world
    lens: material
    domains: [garment, textile, transformation, kinship, restoration]
    related: [law_silent_endurance_redeems, obj_redeeming_shirt, transform_animal_human, agency_domestic_labor]
    examples: [six_swans_starwort_shirts]

  law_softened_death_becomes_timed_sleep:
    name: Softened Death Becomes Timed Sleep
    description: |
      A fatal curse cannot be erased outright, but a remaining blessing
      can commute death into a deep sleep with a fixed duration and
      eventual awakening.
    rationale: |
      Distinct from `law_curse_requires_counter_condition`, which names
      the broad release logic, and from `law_repentance_restores`,
      where moral confession repairs sin. Here the counterforce does
      not undo the curse; it edits its ontology from death to sleep and
      fixes the term. KHM 50 needs this law because the twelfth Wise
      Woman explicitly cannot undo the evil sentence, only soften it
      into a hundred-year sleep.
    tier: operational
    scope: world
    lens: structural
    domains: [curse, sleep, fate, mitigation, time]
    related: [state_enchanted_sleep, being_fairy, speech_curse, num_100]
    examples: [briar_rose]

  law_fated_time_opens_thorn_threshold:
    name: Fated Time Opens Thorn Threshold
    description: |
      A dangerous vegetative barrier blocks premature rescuers, but
      when the appointed term is complete it changes from lethal thorns
      into flowers and opens by itself.
    rationale: |
      Distinct from `threshold_forest`, where the boundary is a general
      crossing into wild magical space, and from ordinary `state_trapped`,
      where a tool or snare immobilises a body. This law makes time the
      access condition: courage before the hundred years fails, while
      arrival at the fated day makes the hedge part harmlessly. KHM 50
      needs it because the prince succeeds by temporal alignment as
      much as by bravery or desire.
    tier: operational
    scope: world
    lens: structural
    domains: [thorn, threshold, time, sleep, castle, fate]
    related: [threshold_thorn_hedge, state_enchanted_sleep, num_100, loc_castle]
    examples: [briar_rose_thorn_hedge]

  law_loyal_pair_magic_flight:
    name: Loyal Pair Magic Flight
    description: |
      A pair bound by a repeated promise not to abandon one another can
      evade pursuit through coordinated transformations into plants,
      buildings, water, animals, or analogous paired forms.
    rationale: |
      Distinct from `law_disguise_alters_social_reality`, where a
      surface disguise fools recognition, and from
      `law_curse_requires_counter_condition`, where an imposed curse
      waits for release. Magic flight is active fugitive ontology: the
      children choose new forms in response to approaching pursuers, and
      the paired transformation preserves their bond. KHM 51 needs this
      law because each escape is preceded by "never leave me" and
      answered by a matching transformation pair: rose-tree/rose,
      church/chandelier, fishpond/duck.
    tier: operational
    scope: world
    lens: structural
    domains: [magic-flight, loyalty, transformation, pursuit, children]
    related: [transform_fugitive_pair, affect_loyalty, state_transformed]
    examples: [foundling_bird]

  law_forbidden_light_exiles_animal_bridegroom:
    name: Forbidden Light Exiles Animal Bridegroom
    description: |
      An enchanted spouse who safely alternates between animal and
      human form is lost when forbidden light touches him, triggering
      a second transformation and a fixed period of wandering exile.
    rationale: |
      Distinct from `law_curse_requires_counter_condition`, which
      names the broad release logic, and from `law_fated_time_opens_
      thorn_threshold`, where time itself opens access. KHM 88 needs
      this law because the lion-prince is already partly released at
      night, but one candle-ray changes him into a dove for seven
      years and launches the bride's quest. The slot enables queries
      over animal-bridegroom tales where seeing, light, or exposure
      breaks domestic happiness and produces the lost-husband search.
    tier: operational
    scope: world
    lens: structural
    domains: [animal-bridegroom, light, transformation, exile, lost-husband]
    related: [arc_enchanted_prince, state_transformed, sp_lion, sp_bird, num_7]
    examples: [the_singing_springing_lark]

  law_burned_animal_skin_releases_human_form:
    name: Burned Animal Skin Releases Human Form
    description: |
      When an animal or hybrid exterior is shed and immediately burned,
      the non-human covering cannot return, allowing the hidden human
      body or identity to remain.
    rationale: |
      Distinct from `transform_animal_human`, which only names the
      form-crossing, and from `law_forbidden_light_exiles_animal_
      bridegroom`, where exposure damages the marriage. Here fire is
      therapeutic and decisive: helpers, watchmen, or an older king
      destroy the cast-off skin so the bridegroom can no longer return
      to animal appearance. KHM 108 needs the law because release
      depends on coordinated burning of the hedgehog skin; KHM 144
      needs it because the ass-skin is burned outside after the hidden
      youth is seen by moonlight.
    tier: operational
    scope: world
    lens: material
    domains: [animal-skin, fire, transformation, marriage, release]
    related: [obj_cast_off_animal_skin, transform_animal_human, state_transformed, arc_hybrid_outcast_bridegroom]
    examples: [obj_hans_hedgehog_skin, obj_donkey_ass_skin]

  law_trace_tokens_guide_lost_spouse_quest:
    name: Trace Tokens Guide Lost-Spouse Quest
    description: |
      A transformed or fleeing beloved leaves small periodic tokens
      behind, such as blood-drops and feathers, allowing the faithful
      seeker to follow a path through otherwise trackless distance.
    rationale: |
      Distinct from `law_speaking_blood_decoys_pursuit`, where blood
      delays discovery by imitating voice, and from ordinary trail
      objects, which a protagonist deliberately drops. KHM 88 needs
      this law because the dove-husband himself produces the trail at
      every seventh step: red blood and white feather are not clues to
      a crime, but a fragile navigation contract between lost spouses.
      The slot enables queries over quests driven by bodily or avian
      trace evidence rather than by maps, helpers, or roads.
    tier: operational
    scope: world
    lens: material
    domains: [trail, blood, feather, spouse-quest, loyalty]
    related: [affect_loyalty, state_transformed, obj_trail, law_voice_recognizes_forgotten_bride]
    examples: [the_singing_springing_lark]

  law_thrown_objects_raise_pursuit_obstacles:
    name: Thrown Objects Raise Pursuit Obstacles
    description: |
      Small portable objects thrown behind fleeing children or lovers
      expand into large landscape barriers that slow or stop a
      supernatural pursuer.
    rationale: |
      Distinct from `law_loyal_pair_magic_flight`, where the fugitives
      transform themselves into paired forms. Here the fugitives remain
      themselves; the changing ontology belongs to objects cast behind
      them. Brush, comb, and mirror become hills of bristles, teeth, and
      glass, turning domestic grooming tools into terrain. KHM 79 needs
      this law to keep obstacle-making magic flight queryable apart
      from body-transformation flight.
    tier: operational
    scope: world
    lens: material
    domains: [magic-flight, pursuit, object, obstacle, landscape]
    related: [agency_object_mediation, threshold_well]
    examples: [the_water_nix]

  law_full_moon_golden_gifts_raise_water_captive_by_degrees:
    name: Full-Moon Golden Gifts Raise Water Captive by Degrees
    description: |
      A faithful spouse can briefly open the water-nix's hold by using
      golden objects at the full moon. Each offering is taken by the
      water and raises the captive farther from the depths until the
      final domestic tool brings the whole body ashore.
    rationale: |
      Distinct from `law_thrown_objects_raise_pursuit_obstacles`, where
      portable objects become barriers during escape, and from
      `law_voice_recognizes_forgotten_bride`, where song restores
      memory. Here objects do not become terrain or tokens of identity;
      comb, flute, and spinning-wheel function as staged ransom rites
      addressed to the pond itself. KHM 181 needs the law because the
      husband's restoration is incremental, lunar, material, and
      spouse-mediated.
    tier: operational
    scope: world
    lens: material
    domains: [water, captivity, full-moon, golden-object, spouse-rescue]
    related: [being_water_nix, agency_object_mediation, agency_music, affect_loyalty, moral_restorative]
    examples: [the_nixie_of_the_mill_pond]

  law_shapeshift_duel_resolves_mastery:
    name: Shapeshift Duel Resolves Mastery
    description: |
      Rival magicians, thieves, or pupils pursue one another through a
      sequence of tactical animal forms; each form answers the previous
      form until one chooses a predatory or superior body that destroys
      the other.
    rationale: |
      Distinct from `law_loyal_pair_magic_flight`, where allied
      fugitives transform together to hide from pursuers. The
      shapeshift duel is adversarial and pedagogical: master and pupil
      share the same art, so superiority is decided by responsive
      metamorphosis. KHM 68 needs this law because the apprentice wins
      only after matching sparrow and fish forms, then choosing fox
      against the master's cock.
    tier: operational
    scope: world
    lens: structural
    domains: [transformation, duel, apprenticeship, mastery, pursuit]
    related: [transform_shapeshift_duel, agency_cunning, being_wizard]
    examples: [the_thief_and_his_master]

  law_form_binding_object_blocks_return:
    name: Form-Binding Object Blocks Return
    description: |
      A removable object attached to a transformed body prevents the
      shapeshifter from returning to human form until someone removes
      it.
    rationale: |
      Distinct from `state_transformed`, which names the condition,
      and from `obj_enchanting_wand`, which enables transformation.
      This law isolates restraint through equipment: the bridle does
      not transform the youth into a horse, but it keeps the horse-form
      locked and transfers control to whoever owns or removes it. KHM
      68 needs it because the father's mistake selling the horse with
      its bridle nearly traps the apprentice with his master.
    tier: operational
    scope: world
    lens: material
    domains: [transformation, restraint, object, horse, control]
    related: [obj_form_binding_bridle, state_transformed, transform_shapeshift_duel]
    examples: [the_thief_and_his_master]

  law_speech_taken_literally:
    name: Speech Taken Literally
    description: |
      In the schwank tale-world, ANY utterance — animal cry, dog bark,
      frog croak — can be treated by a character as a binding human
      speech-act (offer, agreement, oath), and the tale-world will
      not contradict the reading. The error is not corrected by the
      narrative; instead the literal interpretation becomes the
      legal/social fact that drives subsequent events.
    rationale: |
      Distinct from `law_promise_binds_reality` (which is about
      voluntary human oaths) and from `law_might_unmakes_promise`
      (which is about breaking, not over-honoring). Speech-taken-
      literally is the SPECIFIC schwank-law that produces absurd
      petitions: a peasant suing dogs for unpaid meat-money, frogs
      for thalers. The tale neither punishes nor corrects the
      literalism — it follows where the literal reading leads.
      Without this law, schwank-petitions read as nonsense; with it,
      they read as the tale-world's own logic.
    tier: operational
    scope: world
    lens: structural
    domains: [literalism, speech, schwank, animal-talk]
    related: [arc_literal_fool, moral_comic_inversion]
    examples: [good_bargain_peasant]

  law_paradox_condition_proves_wisdom:
    name: Paradox Condition Proves Wisdom
    description: |
      A ruler or tester poses mutually exclusive conditions, and the
      successful answer is an embodied compromise that satisfies every
      clause without directly violating any of them.
    rationale: |
      Distinct from `speech_riddle`, which is the speech-form of the
      test, and from `law_speech_taken_literally`, where comic error
      treats speech as binding. Here the law names the operational
      solution: not clothed/not naked, not riding/not walking, not in
      the road/not out of it can all be fulfilled through liminal
      material staging. KHM 94 needs this slot because intelligence is
      proven by occupying the exact boundary between opposites.
    tier: operational
    scope: world
    lens: structural
    domains: [riddle, paradox, wisdom, courtship, threshold]
    related: [speech_riddle, agency_cunning, arc_clever_peasant_bride, num_3]
    examples: [peasants_clever_daughter_riddle]

  law_unanswerable_cosmic_questions_yield_to_reframing:
    name: Unanswerable Cosmic Questions Yield to Reframing
    description: |
      A wise respondent can answer impossible questions about cosmic
      scale by changing the conditions of counting, substituting an
      equally uncountable analogue, or narrating a time-scale beyond
      human measurement.
    rationale: |
      Distinct from `law_paradox_condition_proves_wisdom`, where a
      paradoxical courtship condition is met by embodied compromise,
      and from ordinary `speech_riddle`, where a hidden answer is
      recovered. Here the answer does not count ocean drops, stars, or
      eternity directly; it exposes the impossible scale of the
      question by demanding river-stoppage, producing uncountable paper
      points, and imagining the Diamond Mountain worn away by a bird.
      KHM 152 needs this law for queries over wisdom contests that
      defeat authority through epistemic reframing rather than
      deception, magic, or private knowledge.
    tier: operational
    scope: world
    lens: cognitive
    domains: [wisdom, riddle, counting, cosmos, authority, time]
    related: [arc_wise_child, speech_riddle, agency_speech, agency_cunning, num_3]
    examples: [the_shepherd_boy]

  law_truthful_answer_preserves_donor_matter:
    name: Truthful Answer Preserves Donor Matter
    description: |
      When a supernatural donor asks what a traveller carries or makes,
      the answer fixes the object's resulting reality: evasive or
      contemptuous answers become worthless substitutions, while a
      truthful answer preserves or completes the healing or wonder
      object.
    rationale: |
      Distinct from `law_speech_taken_literally`, where a fool treats
      ordinary speech or animal cries as legal fact, and from
      `law_formula_commands_magic_objects`, where fixed formulas
      activate objects. Here the donor's question is a truth-test over
      material intent: apples become frogs' legs or hogs' bristles for
      dismissive elder brothers, while Hans's truthful apples remain
      curative and his truthful boat becomes land-swift. KHM 165 needs
      this law for queries over donor interrogation, honesty, object
      preservation, and failed elder-brother quest attempts.
    tier: operational
    scope: world
    lens: material
    domains: [truth, donor, objects, healing, quest, substitution]
    related: [arc_supernatural_donor, speech_testimony, agency_object_mediation, moral_restorative]
    examples: [the_griffin]

  law_counter_absurdity_exposes_bad_judgment:
    name: Counter-Absurdity Exposes Bad Judgment
    description: |
      An unjust or impossible verdict is corrected by staging an
      equally impossible analogy, forcing authority to recognise that
      its own judgment has violated ordinary causal order.
    rationale: |
      Distinct from `law_speech_taken_literally`, where absurdity comes
      from naive interpretation, and from `law_self_sentence_punishes_false_bride`,
      where a wrongdoer condemns herself by analogy. In KHM 94 the dry-
      land fishing scene is a deliberate judicial counterexample: if
      an ox can have a foal, a person can fish without water. The node
      supports queries over legal cleverness, peasant petitions, and
      verdicts reversed through performed analogy.
    tier: operational
    scope: world
    lens: structural
    domains: [judgment, absurdity, analogy, justice, peasant]
    related: [agency_cunning, agency_speech, arc_clever_peasant_bride, moral_restorative]
    examples: [peasants_clever_daughter_dry_land_fishing]

  law_dearest_literalism_restores_marriage:
    name: Dearest Literalism Restores Marriage
    description: |
      A dismissal command allowing one chosen possession to be taken
      away is answered literally and affectionately: the dismissed
      spouse takes the beloved person rather than goods, reversing
      banishment without breaking the command.
    rationale: |
      Distinct from `law_speech_taken_literally`, where literalism is
      comic misunderstanding, and from `law_promise_binds_reality`,
      where an oath externally enforces conduct. Here literal
      obedience becomes restorative cunning: the queen obeys the king's
      stated permission but redefines "dearest and best" as the king
      himself. The slot makes queryable a recurring legal-affective
      maneuver: command compliance that transforms punishment into
      reconciliation.
    tier: operational
    scope: world
    lens: structural
    domains: [marriage, literalism, affection, exile, reconciliation]
    related: [affect_love, agency_cunning, speech_command, moral_restorative]
    examples: [peasants_clever_daughter_dearest_thing]

  law_bad_faith_marital_literalism_masks_violence:
    name: Bad-Faith Marital Literalism Masks Violence
    description: |
      A spouse under legal order to keep peace can twist a marital
      formula into a literal loophole, reframing continued attacks as
      technical obedience until public authority rejects the wordplay.
    rationale: |
      Distinct from `law_speech_taken_literally`, where comic error
      comes from naivete, and from `law_dearest_literalism_restores_
      marriage`, where literal compliance repairs a relationship. KHM
      170 needs this law because the tailor knows the promise's moral
      purpose and evades it through bad-faith semantics: hair-pulling
      and thrown tools become "sharing joy and sorrow" only by
      redefining injury as alternating feeling. The slot enables
      queries over legalistic abuse, rejected loopholes, and authority
      correcting domestic violence.
    tier: operational
    scope: world
    lens: structural
    domains: [marriage, law, literalism, violence, loophole]
    related: [law_promise_binds_reality, speech_promise, agency_violence, agency_social_rank, moral_retributive]
    examples: [sharing_joy_and_sorrow]

  law_misapplied_instruction_cascades:
    name: Misapplied Instruction Cascades
    description: |
      In a formulaic comic tale, a correction that would have solved
      the previous mistake is preserved as an absolute rule and applied
      to the next, materially different situation. Each new obedience
      therefore creates the next failure, and the chain escalates by
      repeating the same question-answer-instruction sequence.
    rationale: |
      Distinct from `law_speech_taken_literally`, where words or
      animal cries become binding speech-acts. Here the problem is not
      interpreting a phrase but transferring practical advice across
      incompatible objects: needle-to-sleeve, knife-to-pocket,
      goat-to-rope, bacon-to-head, calf-to-stall, bride-to-friendly
      eyes. KHM 143 extends the same mechanism to road speech:
      "not much," "get it full," pity for a poor soul, and carrion-in-
      pit each arrive one scene too late. This law names the
      operational engine of misapplied correction comedy.
    tier: operational
    scope: world
    lens: structural
    domains: [instruction, obedience, formula, household, comedy]
    related: [arc_fool, agency_speech, moral_comic_inversion]
    examples: [clever_hans_hans, going_travelling_youth]

  law_self_willed_service_replaces_orders:
    name: Self-Willed Service Replaces Orders
    description: |
      A servant hears and understands a master's order but abandons the
      assigned task in favor of whatever his own preference finds more
      interesting, with the tale ironically naming this disobedience
      as wisdom.
    rationale: |
      Distinct from `law_misapplied_instruction_cascades`, where a fool
      obeys instructions in the wrong context, and from
      `law_idle_boast_catalogue_escalates_neglect`, where speakers
      boast about refusing labour. Here there is a single failed errand:
      the servant is sent to find a cow, does not look for it, and
      treats three blackbirds as the better discovery. KHM 162 needs
      this law for queries over servant disobedience, anti-work
      schwanks, and ironic wisdom that replaces obligation with whim.
    tier: operational
    scope: world
    lens: cognitive
    domains: [servant, disobedience, task, wisdom, labour, comedy]
    related: [arc_fool, agency_domestic_labor, agency_speech, speech_command, moral_comic_inversion]
    examples: [the_wise_servant]

  law_foolish_remedy_compounds_loss:
    name: Foolish Remedy Compounds Loss
    description: |
      A small household mistake is answered by a remedial action that
      consumes, destroys, or exposes a more valuable resource than the
      original loss. The attempted repair is treated as practical by
      the fool but increases the damage at each step.
    rationale: |
      Distinct from `law_misapplied_instruction_cascades`, where a
      taught rule is transferred to the wrong later situation. Here no
      pedagogical formula drives the error: Catherine invents remedies
      on the spot. Flour is spent to hide spilled beer, pots are broken
      into decorations after gold is traded away, butter is applied to
      road-ruts as medicine, and cheeses are sent after one another.
      The law enables queries for domestic comic tales where repair
      itself is the destructive force.
    tier: operational
    scope: world
    lens: structural
    domains: [foolishness, household, repair, loss, comedy]
    related: [arc_fool, agency_domestic_labor, moral_comic_inversion]
    examples: [frederick_and_catherine]

  law_unrepaired_small_defect_cascades_into_disaster:
    name: Unrepaired Small Defect Cascades into Disaster
    description: |
      A minor practical fault that could be fixed early becomes a chain
      of escalating material failure when ignored: missing nail becomes
      missing shoe, limp, stumble, fall, broken limb, lost transport,
      bodily burden, and failed timing.
    rationale: |
      Distinct from `law_foolish_remedy_compounds_loss`, where a bad
      attempted repair causes more damage, and from
      `law_misapplied_instruction_cascades`, where a taught rule is
      moved to the wrong context. Here the disaster comes from refusing
      repair altogether. KHM 184 needs the law because the narrative is
      almost pure causal sequence: each later loss is the deferred cost
      of dismissing the first missing nail.
    tier: operational
    scope: world
    lens: material
    domains: [neglect, maintenance, cascade, horse, haste, proverb]
    related: [sp_horse, agency_domestic_labor, speech_warning, moral_prudent_pacing]
    examples: [the_nail]

  law_labor_avoidance_exchange_converts_care_to_loss:
    name: Labor-Avoidance Exchange Converts Care to Loss
    description: |
      Domestic work is repeatedly avoided by exchanging living care
      obligations for supposedly easier arrangements, but the imagined
      management of future labour destroys the stored gain already won.
    rationale: |
      Distinct from `law_fake_domestic_omens_suspend_labor`, where a
      lazy spouse avoids work through deception, and from
      `law_diminishing_exchange_reframed_as_luck`, where serial trades
      are interpreted as fortune by a single contented fool. Here the
      laziness is conjugal and managerial: one goat is shifted to a
      wife, two goats are traded for a beehive that works by itself,
      honey is stored, and a hypothetical child/goose problem makes
      Trina's disciplinary zeal smash the real pitcher. KHM 164 needs
      this law for queries over anti-labour marriage, care outsourcing,
      passive yield, and comic loss caused by imagined future work.
    tier: operational
    scope: world
    lens: cognitive
    domains: [laziness, marriage, labour, exchange, livestock, honey]
    related: [affect_sloth, agency_domestic_labor, speech_bargain, moral_comic_inversion, sp_goat, sp_insect]
    examples: [lazy_harry]

  law_novelty_converts_utility_to_treasure:
    name: Novelty Converts Utility to Treasure
    description: |
      Ordinary animals or tools become enormously valuable when carried
      to a community that lacks them and can immediately use their
      practical function.
    rationale: |
      Distinct from magical treasure laws, where wealth is produced by
      enchantment, and from `law_speech_taken_literally`, where error
      comes from semantic misreading. KHM 70's cock, scythe, and cat
      are not magical; they become fortunes because each brother finds
      a place where common household utility is unknown. This law
      enables queries over knowledge-as-wealth, trade by asymmetrical
      familiarity, and comic ethnography of useful objects.
    tier: operational
    scope: world
    lens: material
    domains: [trade, novelty, utility, knowledge, fortune]
    related: [agency_object_mediation, moral_trickster_wins, loc_island]
    examples: [the_three_children_of_fortune, the_owl]

  law_marvel_gift_revalues_humble_crop:
    name: Marvel Gift Revalues Humble Crop
    description: |
      A humble agricultural product becomes royal treasure when its
      impossible scale or singularity makes it a marvel fit for gift
      exchange rather than ordinary market sale or eating.
    rationale: |
      Distinct from `law_novelty_converts_utility_to_treasure`, where
      common tools become valuable because another community lacks
      their use, and from donor-gift laws where treasure comes from a
      supernatural helper. KHM 146 needs this law because the turnip is
      materially useless as food or sale relative to its size; its
      value appears only when the poor soldier-farmer offers it to the
      king as a wonder. This enables queries over agrarian marvels,
      courtly gift revaluation, and poverty changed by non-magical
      excess.
    tier: operational
    scope: world
    lens: material
    domains: [agriculture, gift, marvel, poverty, king, value]
    related: [obj_giant_turnip, agency_object_mediation, moral_kindness_rewarded]
    examples: [turnip_princess_of_turnips]

  law_missing_tool_invites_destructive_overkill:
    name: Missing Tool Invites Destructive Overkill
    description: |
      A community lacking the ordinary tool for a simple problem uses
      excessive force instead, damaging the very field, house, or
      resource it means to protect.
    rationale: |
      Distinct from `law_foolish_remedy_compounds_loss`, where a lone
      fool invents escalating household repairs, and from
      `law_militarized_objects_create_sovereignty`, where weapons are
      effective power. Here military force substitutes for missing
      practical knowledge: islanders shoot ripe corn with cannon, and
      later a kingdom fires cannon to remove an unknown cat, burning
      down the palace. The slot connects ATU 1202 and ATU 1281 as one
      operational comic logic of over-equipment.
    tier: operational
    scope: world
    lens: material
    domains: [foolishness, tool, cannon, overkill, destruction]
    related: [obj_cannon, law_foolish_remedy_compounds_loss, moral_comic_inversion]
    examples: [the_three_children_of_fortune]

  law_accidental_noise_routes_rogues:
    name: Accidental Noise Routes Rogues
    description: |
      Hidden weak or foolish actors defeat thieves by accidentally
      dropping, spilling, or sounding ordinary objects from concealment;
      the rogues misrecognise the event as supernatural danger and
      flee, leaving stolen property behind.
    rationale: |
      Distinct from `law_collective_noise_magnifies_the_weak`, where a
      coordinated group deliberately performs a frightening composite
      body. This law covers non-strategic success: Catherine sheds
      pears, vinegar, and finally a house-door from a tree because the
      load is heavy, not because she has planned an ambush. The thieves'
      mistaken "the devil is coming" converts incompetence into
      recovery of the gold. The slot supports cross-tale queries over
      comic misrecognition where accident, not cunning, wins.
    tier: operational
    scope: world
    lens: structural
    domains: [noise, misrecognition, thieves, devil, comedy]
    related: [law_collective_noise_magnifies_the_weak, affect_fear, moral_comic_inversion, loc_tree]
    examples: [frederick_and_catherine]

  law_stolen_food_redirected_by_threat_lie:
    name: Stolen Food Redirected by Threat-Lie
    description: |
      A domestic trickster who has consumed prepared food avoids blame
      by telling the guest that the host intends bodily violence and
      telling the host that the guest stole the missing food; the
      host's pursuit then confirms the guest's fear.
    rationale: |
      Distinct from `speech_lie`, which names the utterance type, and
      from `law_speech_taken_literally`, where comic error comes from
      sincere literal misunderstanding. Here a deliberately paired lie
      makes two innocent parties misread each other in opposite
      directions: the guest flees to save his ears, the master chases
      to recover one chicken, and the cook's theft disappears into the
      pursuit. KHM 77 needs this law for the ATU 1741 servant-trick
      grammar of appetite protected by social misdirection.
    tier: operational
    scope: world
    lens: structural
    domains: [food, theft, lie, pursuit, domestic-labour, schwank]
    related: [speech_lie, agency_domestic_labor, affect_hunger, moral_trickster_wins]
    examples: [clever_grethel]

  law_invited_table_theft_redirects_punishment_to_dependents:
    name: Invited Table Theft Redirects Punishment to Dependents
    description: |
      A household authority can entice dependent animals or servants to
      take forbidden food, then avoid the returning authority's
      punishment, leaving the dependents to receive the blows for a
      transgression they were pressured into committing.
    rationale: |
      Distinct from `law_stolen_food_redirected_by_threat_lie`, where
      the food thief strategically lies to redirect blame, and from
      `law_speech_taken_literally`, where misunderstanding drives the
      action. Here everyone understands the risk; the asymmetry is
      power. KHM 190 needs this law because the little dogs explicitly
      predict the beating, the countryman overrides their refusal, and
      afterward he mocks their belated complaint.
    tier: operational
    scope: world
    lens: structural
    domains: [household, food, punishment, dependence, animals, authority]
    related: [sp_dog, agency_speech, agency_violence, affect_fear, moral_naive_punished]
    examples: [the_crumbs_on_the_table]

  law_fake_domestic_omens_suspend_labor:
    name: Fake Domestic Omens Suspend Labor
    description: |
      A household trickster invents supernatural or fatal signs around
      ordinary work tools, making another person abandon the labour
      demand and accept the resulting disorder.
    rationale: |
      Distinct from `law_stolen_food_redirected_by_threat_lie`, where
      appetite is hidden by redirecting blame between guest and host,
      and from `law_false_oracle_exposes_hidden_goods`, where a fake
      oracle accidentally reveals theft. Here the lie is a work-
      avoidance technology: a death-cry in the forest prevents the reel
      from being made, and a cock-crow rule makes tow appear to be
      ruined yarn. KHM 128 needs this law for domestic schwanks where
      false omens neutralize textile labour.
    tier: operational
    scope: world
    lens: structural
    domains: [domestic-labour, lie, omen, spinning, laziness]
    related: [agency_domestic_labor, speech_lie, obj_spinning_wheel, moral_trickster_wins]
    examples: [lazy_spinner_forest_omen, lazy_spinner_tow_kettle]

  law_foolish_collateral_inverts_sale_value:
    name: Foolish Collateral Inverts Sale Value
    description: |
      A fool accepts part of the sold property itself as security for
      future payment, treating subtraction from the bargain as if it
      were protection for the bargain.
    rationale: |
      Distinct from `law_foolish_remedy_compounds_loss`, where attempted
      repair increases damage, and from `law_equivocal_poverty_terms_
      mimic_wealth`, where verbal ambiguity drives misvaluation. In
      KHM 104 Trina lets the cattle-dealer take two cows without money
      because he leaves the third cow as "security"; the pledge is not
      added collateral but the unsold remainder of the very herd being
      lost. The slot enables queries over comic household economics
      where security, price, and property are structurally confused.
    tier: operational
    scope: world
    lens: cognitive
    domains: [foolishness, trade, collateral, cattle, household]
    related: [arc_fool, agency_domestic_labor, moral_comic_inversion]
    examples: [wise_folks_trina]

  law_false_afterlife_courier_extracts_goods:
    name: False Afterlife Courier Extracts Goods
    description: |
      A trickster claims to have come from heaven, hell, or another
      afterlife region and uses the victim's concern for a dead relative
      to extract money, clothes, animals, or other goods for delivery.
    rationale: |
      Distinct from `speech_lie`, which names the utterance type, and
      from `law_wish_knapsack_contains_targets`, where afterlife
      movement is magically enforced. This is a secular schwank fraud:
      the afterlife is invoked only as a credible postal route for
      gullibility. KHM 104 needs it because Hans profits by posing as a
      man fallen from heaven and then as someone who knows that man,
      turning mourning and piety into purse and horse.
    tier: operational
    scope: world
    lens: cognitive
    domains: [afterlife, heaven, fraud, grief, goods, schwank]
    related: [loc_heaven, speech_lie, arc_trickster, arc_fool, moral_trickster_wins]
    examples: [wise_folks_hans]

  law_material_token_authenticates_tall_tale:
    name: Material Token Authenticates Tall Tale
    description: |
      An impossible or exaggerated first-person story is anchored by a
      concrete object allegedly brought back from the impossible place,
      making the object function as comic proof rather than ordinary
      evidence.
    rationale: |
      Distinct from `law_false_afterlife_courier_extracts_goods`,
      where a trickster fraudulently exploits belief in heaven, and
      from `law_trophy_tokens_expose_false_rescuer`, where tokens
      settle a real legal dispute. Here the tale advertises its own
      impossible scale and then offers a prop as playful authentication:
      KHM 112's flail from heaven is not sober evidence but a material
      wink that "no one could have any doubt" of an impossible
      sky-climb. The slot supports queries over lying tales, tall-tale
      proofs, and comic material authentication.
    tier: operational
    scope: world
    lens: material
    domains: [tall-tale, proof, heaven, object, comedy]
    related: [obj_forensic_token, loc_heaven, moral_comic_inversion]
    examples: [obj_flail_heavenly_flail]

  law_house_snake_feeding_sustains_child_vitality:
    name: House-Snake Feeding Sustains Child Vitality
    description: |
      A child's regular sharing of milk, bread, or household food with
      a small snake creates a reciprocal life-bond: the snake brings
      treasures and the child thrives, but killing the snake causes the
      child to waste away and die.
    rationale: |
      Distinct from `law_rescued_animals_repay_kindness`, where an
      animal later returns help after a rescue, and from
      `law_serpent_medicine_restores_life`, where snakes reveal a
      technical resurrection remedy. KHM 105 needs a domestic-serpent
      law because the snake is neither enemy nor helper-on-command; it
      is a household familiar whose food-sharing sustains the child's
      growth. The slot supports queries over milk-snake, house-spirit,
      and child-vitality legends.
    tier: operational
    scope: world
    lens: material
    domains: [snake, child, milk, household, vitality]
    related: [sp_snake, obj_serpent_treasure, affect_pity, moral_retributive]
    examples: [stories_about_snakes_first_child]

  law_faithful_service_to_animal_bride_reveals_reward:
    name: Faithful Service to Animal Bride Reveals Reward
    description: |
      A despised or underestimated servant who faithfully serves an
      animal mistress for a fixed term receives the promised reward only
      after returning home still poor-looking; the animal then appears
      as a royal bride with superior wealth, horse, and transformed
      dwelling.
    rationale: |
      Distinct from `law_kindness_to_hidden_donors_rewarded`, where a
      brief courteous act sorts kind and unkind characters, and from
      `law_promise_binds_reality`, which only states that a bargain
      binds. KHM 106 is built from long service and delayed revelation:
      Hans chops, mows, builds, and waits seven years for a cat who is
      also a King's daughter. The law enables queries over animal-bride
      tales where labour, humiliation, and hidden royal identity are the
      path to reward.
    tier: operational
    scope: world
    lens: structural
    domains: [animal-bride, service, reward, transformation, marriage]
    related: [arc_enchanted_animal_bride, agency_domestic_labor, agency_endurance, moral_restorative, num_7]
    examples: [poor_millers_boy_hans]

  law_serpent_treasure_requires_reciprocal_respect:
    name: Serpent Treasure Requires Reciprocal Respect
    description: |
      A snake may bring jewels, crowns, or hidden treasure in response
      to a proper textile, food, or friendship offering, but seizure of
      the treasure without reciprocal return breaks the exchange and
      destroys the serpent source.
    rationale: |
      Distinct from generic `moral_kindness_rewarded`, which sorts
      human conduct, and from magical treasure laws where wealth simply
      appears or regenerates. In KHM 105 the orphan spreads a blue silk
      handkerchief, the snake brings a golden crown, and when the crown
      is removed the snake dies in grief. The law makes serpent wealth
      queryable as a fragile reciprocal relation, not merely a found
      object.
    tier: operational
    scope: world
    lens: material
    domains: [snake, treasure, reciprocity, grief, textile]
    related: [sp_snake, obj_serpent_treasure, agency_object_mediation, moral_retributive]
    examples: [stories_about_snakes_orphan]

  law_companion_hunger_extorts_body:
    name: Companion Hunger Extorts Body
    description: |
      A travel companion who controls food in the wilderness can turn
      bread into bodily ransom, demanding an eye, limb, or other
      irreversible bodily loss from the starving companion in exchange
      for survival.
    rationale: |
      Distinct from `law_gluttony_traps_predator`, where excessive
      appetite traps the eater, and from generic `agency_violence`,
      which names force but not the exchange structure. KHM 107 needs
      this law because the shoemaker's cruelty is economic and bodily:
      he sells bread first for the right eye, then for the left, making
      hunger a contract that produces blindness. The slot supports
      queries over starvation extortion, bodily price, and betrayal by
      road companions.
    tier: operational
    scope: world
    lens: material
    domains: [hunger, companion, body, eye, extortion]
    related: [arc_treacherous_travel_companion, affect_hunger, state_blind, agency_violence]
    examples: [two_travellers_tailor]

  law_gallows_dew_restores_stolen_eyes:
    name: Gallows Dew Restores Stolen Eyes
    description: |
      Dew fallen at night beneath the gallows can restore sight when a
      blind person washes the empty eye sockets with it, especially
      after overhearing the dead reveal the remedy.
    rationale: |
      Distinct from `law_serpent_medicine_restores_life`, where an
      animal remedy restores the dead body, and from ordinary healing
      tears or water. Here the remedy belongs to execution space and
      the speech of hanged sinners: the gallows, dew, corpse-speech,
      and dawn washing together reverse the companion's mutilation.
      KHM 107 needs the law for queries over liminal-death medicine,
      restored sight, and knowledge overheard at execution places.
    tier: operational
    scope: world
    lens: material
    domains: [gallows, dew, blindness, healing, death]
    related: [loc_gallows, obj_gallows_dew, state_blind, agency_speech, moral_restorative]
    examples: [two_travellers_tailor]

  law_child_mirror_reveals_filial_future:
    name: Child Mirror Reveals Filial Future
    description: |
      A child's imitation or announced future repetition of adult
      conduct reveals that harsh treatment of elders will return upon
      the current adults when they age.
    rationale: |
      Distinct from `law_speech_taken_literally`, where humour comes
      from semantic misreading, and from `moral_humbling_reform`, which
      names the tale-level outcome. This law names the causal mechanism:
      the grandson does not scold his parents directly; he mirrors
      their wooden-bowl treatment forward into their own old age. KHM
      78 needs the term because reform happens through intergenerational
      example, not punishment, magic, or official judgment.
    tier: operational
    scope: world
    lens: cognitive
    domains: [child, old-age, kinship, imitation, moral-recognition]
    related: [arc_neglected_elder, obj_elder_wooden_bowl, moral_filial_reciprocity, affect_shame]
    examples: [the_old_man_and_his_grandson]

  law_divine_token_confers_office:
    name: Divine Token Confers Office
    description: |
      A visible sacred sign, usually mediated by white birds or other
      celestial agents, overrides ordinary uncertainty and authorises a
      person for a high office, marriage, or role. Human witnesses
      recognise the sign as a mandate rather than as personal merit.
    rationale: |
      Distinct from `speech_prophecy`, which tells the future, and
      from `law_fated_luck_fulfills_prophecy`, where hostile attempts
      create the foretold outcome. Divine-token election is public and
      institutional: in KHM 33 two snow-white doves settle the papal
      succession by perching on the young count's shoulders. The law
      lets sacred-office tales be queried without reducing election to
      generic luck.
    tier: operational
    scope: world
    lens: structural
    domains: [divine-token, office, election, birds, sacred]
    related: [being_divine, sp_bird, speech_prophecy, moral_providential_election]
    examples: [the_three_languages_doves]

  law_divine_punishment_reserved:
    name: Divine Punishment Reserved
    description: |
      In the sacred realm, judgment over sinners belongs to God alone.
      A lesser being who tries to punish from heaven usurps divine
      authority and is expelled or corrected, even when the observed
      sin is real.
    rationale: |
      Distinct from `moral_retributive`, where punishment properly
      balances wrong, and from `law_prohibition_invites_violation`,
      where a forbidden act tempts transgression. KHM 35 turns on
      jurisdiction: the tailor sees theft from God's seat and throws
      the golden footstool down at the sinner, but God says that if He
      judged as the tailor judges, no heavenly furniture would remain.
      The law names mercy and reserved authority as sacred order.
    tier: operational
    scope: world
    lens: structural
    domains: [judgment, mercy, heaven, authority, punishment]
    related: [being_divine, loc_heaven, moral_mercy_over_judgment]
    examples: [tailor_in_heaven]

  law_heavenly_appearances_exceed_faultfinding_judgment:
    name: Heavenly Appearances Exceed Faultfinding Judgment
    description: |
      In heaven, arrangements that look clumsy, crooked, leaky, idle,
      or backward to an earthly critic may still belong to a hidden
      sacred order; compulsive correction becomes the fault, not the
      apparent disorder.
    rationale: |
      Distinct from `law_divine_punishment_reserved`, where the issue
      is unauthorized punishment, and from `law_counter_absurdity_
      exposes_bad_judgment`, where a human absurdity exposes a bad
      legal verdict. KHM 178 needs this law because Pfriem's whole
      trial is epistemic pride: beam, bucket, cart, and winged horses
      look wrong under craft logic, but heaven's order exceeds his
      trade-trained criticism. The slot enables queries over religious
      comic tales where humility means suspending judgment before
      hidden divine arrangements.
    tier: operational
    scope: world
    lens: cognitive
    domains: [heaven, judgment, pride, craft, hidden-order, comedy]
    related: [being_divine, loc_heaven, affect_pride, affect_anger, moral_comic_inversion]
    examples: [master_pfriem]

  law_heavenly_rejoicing_marks_rare_rich_salvation:
    name: Heavenly Rejoicing Marks Rare Rich Salvation
    description: |
      Heaven may greet a saved rich person with exceptional music and
      rejoicing not because earthly rank still counts there, but
      because such a soul is rare; equal blessedness can coexist with
      unequal celebration of unusual salvation.
    rationale: |
      Distinct from `law_divine_punishment_reserved`, where heaven's
      order limits who may punish, and from `moral_kindness_rewarded`,
      where conduct receives direct recompense. KHM 167 needs this
      law because the peasant's complaint misreads heavenly joy as
      class partiality; Saint Peter reframes it as statistical
      astonishment at a rich man's admission. The slot enables
      queries over religious-comic tales where heaven reverses earthly
      status logic without denying equal salvation.
    tier: operational
    scope: world
    lens: structural
    domains: [heaven, class, rich, salvation, music]
    related: [moral_heavenly_equality, loc_heaven, being_divine, agency_music]
    examples: [the_peasant_in_heaven]

  law_infernal_creation_marks_goat_body:
    name: Infernal Creation Marks Goat Body
    description: |
      Creatures made by the Devil carry harmful nature and visible
      bodily traces of infernal frustration, such as bitten tails and
      devilish eyes.
    rationale: |
      Distinct from `law_sacrificed_helper_body_becomes_rightful_tree`,
      where a goat's body becomes a posthumous helper, and from generic
      `being_devil`, which names the maker rather than the mark left on
      creatures. KHM 148 needs this law because goat traits are
      explained as layered consequences of infernal creation: long
      tails snag, the Devil bites them off, and after losing
      compensation he puts his own eyes into the remaining goats. The
      node supports queries over etiologies where animal anatomy
      records maker, anger, and moral nature.
    tier: operational
    scope: world
    lens: material
    domains: [etiology, goat, devil, body-mark, creation]
    related: [being_devil, sp_goat, affect_anger, moral_comic_inversion]
    examples: [lords_animals_goats]

  law_exceptional_leaf_tree_voids_infernal_debt:
    name: Exceptional Leaf-Tree Voids Infernal Debt
    description: |
      A payment condition tied to a universal seasonal sign can be
      defeated by a single exceptional tree whose leaves have not
      fallen, delaying the claimant until the condition closes again.
    rationale: |
      Distinct from ordinary bargain-breaking and from
      `law_overheard_infernal_riddle_breaks_soul_bargain`, where a
      human escapes the Devil through hidden knowledge. Here divine
      jurisdiction defeats infernal damages by exploiting a precise
      wording: payment is due when oak leaves fall, but one church oak
      in Constantinople still has leaves, and by the time the Devil
      finds it the other oaks are green again. KHM 148 needs the law to
      query seasonal loopholes, divine legal wit, and delayed infernal
      claims.
    tier: operational
    scope: world
    lens: structural
    domains: [devil, bargain, season, tree, delay, payment]
    related: [being_devil, being_divine, loc_tree, loc_church, moral_comic_inversion]
    examples: [constantinople_oak_debt]

  law_disguise_alters_social_reality:
    name: Disguise Alters Social Reality
    description: |
      A visible surface alteration, mask, costume, or noisy sign can be
      accepted socially as evidence that a person is not who they are.
      Once other speakers ratify the altered surface, the character's
      practical identity is displaced even without magical
      transformation.
    rationale: |
      Distinct from `state_disguised`, which names the condition of
      altered appearance on an entity. This is the world-law: the
      social field treats the alteration as real enough to change
      access, recognition, or belonging. KHM 34 needs it because a
      fowler's net with bells makes Elsie doubt herself; Hans's answer
      that "Elsie is within" completes the identity displacement and
      expels her from the village.
    tier: operational
    scope: world
    lens: cognitive
    domains: [disguise, identity, social-recognition, deception, exile]
    related: [state_disguised, state_self_unrecognized, speech_lie]
    examples: [clever_elsie]

  law_master_thief_trials_escalate_guarded_intimate_sacred_theft:
    name: Master-Thief Trials Escalate Guarded, Intimate, and Sacred Theft
    description: |
      A ruler tests a self-declared master thief by assigning a sequence
      of impossible thefts that escalate across protected domains:
      guarded property, intimate bedchamber tokens, and sacred or
      clerical persons.
    rationale: |
      Distinct from generic `law_disguise_alters_social_reality`, which
      explains how disguise works, and from ordinary trickster-profit
      laws where a single deception extracts goods. This law names the
      test architecture of KHM 192: the thief must steal the count's
      guarded horse, the sheet and wedding-ring from the sleeping
      couple, and finally the parson and clerk from church. The query it
      enables is theft as escalating proof of mastery over military
      watch, marital privacy, and sacred authority.
    tier: operational
    scope: world
    lens: structural
    domains: [theft, test, disguise, bedchamber, church, authority]
    related: [arc_master_thief, agency_cunning, state_disguised, loc_stable, loc_bedchamber, loc_church]
    examples: [the_master_thief]

  law_gendered_tests_threaten_disguise:
    name: Gendered Tests Threaten Disguise
    description: |
      Socially coded objects or bodily habits are used as diagnostic
      tests to expose a concealed gender or identity: gait over peas,
      attraction to spinning-wheels, gestures, clothing, or domestic
      reflexes.
    rationale: |
      Distinct from `law_disguise_alters_social_reality`, where a
      surface disguise is accepted as socially real. This law names the
      counter-mechanism: an examiner tries to make the hidden identity
      betray itself through embodied habit. KHM 67 needs it because the
      lion's truth-claim is operationalized through two gendered tests,
      and the disguised women survive only by consciously performing
      against the expected signs.
    tier: operational
    scope: world
    lens: cognitive
    domains: [disguise, gender, test, recognition, body]
    related: [state_disguised, law_disguise_alters_social_reality, obj_spinning_wheel, agency_cunning]
    examples: [the_twelve_huntsmen]

  law_impossible_bride_gifts_delay_forced_marriage:
    name: Impossible Bride-Gifts Delay Forced Marriage
    description: |
      An unwanted bride delays or attempts to avert a forced marriage by
      demanding objects that should be impossible to procure: celestial
      garments, animal-skin mantles, supernatural textiles, or other
      excessive bride-gifts.
    rationale: |
      Distinct from generic difficult tasks, which test a suitor's
      worth, and from `law_promise_binds_reality`, where the binding
      force is the vow itself. Here the task is defensive rhetoric:
      the threatened bride invents material impossibility to buy safety
      from an illegitimate marriage. KHM 65 needs this law because the
      daughter does not seek gifts as courtship luxury; she uses them
      as a delaying shield against her father's taboo desire.
    tier: operational
    scope: world
    lens: structural
    domains: [marriage, difficult-task, bride-gift, delay, flight]
    related: [arc_taboo_desiring_father, obj_celestial_dresses, obj_fur_disguise_mantle, affect_fear]
    examples: [allerleirauh]

  law_kitchen_tokens_reveal_hidden_bride:
    name: Kitchen Tokens Reveal Hidden Bride
    description: |
      A hidden or socially lowered bride reveals herself indirectly by
      placing private recognition tokens in food prepared from a
      kitchen position, letting domestic service carry royal identity
      across rank boundaries.
    rationale: |
      Distinct from `law_true_fit_reveals_identity`, where a body-fit
      test identifies the rightful person, and from `obj_forensic_token`,
      which proves a crime. This law names a quieter recognition
      mechanism: food-service becomes message-delivery. In KHM 65 the
      golden ring, spinning-wheel, and reel hidden in the king's soup
      create a three-step inquiry that exposes the servant as the
      festival bride without requiring her to announce herself.
    tier: operational
    scope: world
    lens: material
    domains: [recognition, kitchen, food, token, hidden-identity]
    related: [obj_hidden_bride_token, agency_domestic_labor, agency_object_mediation, state_hidden_identity]
    examples: [allerleirauh]

  law_tower_confinement_outlasts_ruined_kingdom:
    name: Tower Confinement Outlasts Ruined Kingdom
    description: |
      A sealed tower sentence can isolate a maiden so completely that
      time, daylight, family authority, and even the surrounding kingdom
      pass away while the captive survives inside and must dig herself
      back into a changed world.
    rationale: |
      Distinct from `state_imprisoned`, which names confinement as a
      condition, and from `loc_tower`, which names the vertical place.
      This law captures KHM 198's temporal violence: seven years of
      food, darkness, silence, and walled separation end not in paternal
      release but in abandonment after war has ruined castle, town, and
      fields. It enables queries over tower imprisonment where the
      prison does not merely hide the maiden; it preserves her beyond
      the social order that imprisoned her.
    tier: operational
    scope: world
    lens: structural
    domains: [tower, confinement, time, abandonment, war, survival]
    related: [loc_tower, state_imprisoned, agency_endurance, affect_love, moral_restorative]
    examples: [maid_maleen]

  law_liminal_bride_sayings_and_token_expose_substitution:
    name: Liminal Bride Sayings and Token Expose Substitution
    description: |
      A coerced substitute bride can preserve truth by speaking to
      roadside thresholds on the way to church and by receiving a
      private token from the bridegroom; later, the false bride's
      inability to repeat the sayings or account for the token exposes
      the substitution.
    rationale: |
      Distinct from `law_voice_recognizes_forgotten_bride`, where song
      or voice directly restores memory, and from `law_kitchen_tokens_
      reveal_hidden_bride`, where hidden objects placed in food carry
      identity. Here recognition is distributed across liminal speech
      and a bridal ornament: nettle, foot-bridge, church-door, and
      chain together make the true church marriage testable after the
      false bride tries to reclaim it. The slot supports queries over
      wedding-procession thresholds, coerced bridal substitution, and
      recognition by remembered utterance plus wearable token.
    tier: operational
    scope: world
    lens: structural
    domains: [bride, substitution, church, threshold, speech, token]
    related: [arc_false_bride, state_hidden_identity, threshold_doorway, loc_church, obj_betrothal_recognition_token, speech_testimony, moral_retributive]
    examples: [maid_maleen]

  law_formula_commands_magic_objects:
    name: Formula Commands Magic Objects
    description: |
      A specific spoken formula activates an otherwise portable object
      or animal, causing it to produce abundance, wealth, or punishment
      until the proper counter-command or completed action ends the
      effect.
    rationale: |
      Distinct from `law_promise_binds_reality`, where human vows bind
      later conduct, and from `agency_speech`, which names a general
      power mode. This law is object-operational: "Little table,
      spread thyself," "Bricklebrit," and "Out of the sack, Cudgel"
      each trigger a material mechanism. KHM 36 needs one law linking
      the table, gold-ass, and cudgel as a single magic-object grammar.
    tier: operational
    scope: world
    lens: structural
    domains: [formula, magic-object, abundance, punishment, speech]
    related: [agency_speech, obj_wishing_table, obj_gold_dropping_ass, obj_cudgel_in_sack]
    examples: [wishing_table_eldest_son, wishing_table_second_son, wishing_table_third_son]

  law_textile_tools_summon_wooer_and_prepare_house:
    name: Textile Tools Summon Wooer and Prepare House
    description: |
      Blessed inherited textile tools respond to a maiden's sung wish:
      the spindle runs ahead trailing golden thread, the shuttle weaves
      a splendid path, and the needle outfits the house so a suitable
      bridegroom can recognize humble poverty as inner wealth.
    rationale: |
      Distinct from `law_formula_commands_magic_objects`, where command
      formulas trigger portable abundance or punishment, and from
      `law_kitchen_tokens_reveal_hidden_bride`, where objects carry
      identity messages through service. Here domestic craft itself is
      animated as courtship infrastructure: work-tools do not simply
      produce goods, they escort the wooer, transform the threshold,
      and make the house socially ready. KHM 188 needs this law because
      the bride is chosen through pious textile labour rather than
      rank, beauty contest, lost token, or imposed task.
    tier: operational
    scope: world
    lens: material
    domains: [textile, craft, courtship, house-preparation, magic-object, bride-choice]
    related: [obj_charmed_textile_tools, obj_spinning_wheel, obj_needle_thread, agency_domestic_labor, speech_wish]
    examples: [the_spindle_the_shuttle_and_the_needle]

  law_password_opens_hidden_mountain_treasure:
    name: Password Opens Hidden Mountain Treasure
    description: |
      A spoken name-formula opens and shuts a mountain that conceals a
      cavern of treasure; forgetting or corrupting the exact formula
      traps the intruder inside until the treasure-guards return.
    rationale: |
      Distinct from `law_formula_commands_magic_objects`, where speech
      activates portable objects such as tables, asses, pots, or
      cudgels, and from `law_body_sacrifice_opens_threshold`, where
      bodily cost opens access. Here the formula is a password for a
      landscape threshold: "Semsi mountain" opens the mountain, while
      the greedy brother's "Simeli" fails because greed has displaced
      memory. KHM 142 needs this law for queries over hidden hoards,
      exact password speech, mountain-cavern thresholds, and greed
      punished through failed access.
    tier: operational
    scope: world
    lens: structural
    domains: [formula, mountain, treasure, password, greed, threshold]
    related: [agency_speech, loc_mountain, loc_cave, affect_greed, moral_retributive]
    examples: [simeli_mountain]

  law_sacrificed_helper_body_becomes_rightful_tree:
    name: Sacrificed Helper Body Becomes Rightful Tree
    description: |
      When a persecuted heroine's magical animal helper is killed by
      envious kin, the animal's buried remains can return as a tree
      whose silver leaves and golden fruit obey only the rightful
      owner and follow her into her new household.
    rationale: |
      Distinct from `law_grave_tree_channels_maternal_aid`, where the
      tree grows from dead maternal memory, and from
      `law_formula_commands_magic_objects`, where spoken commands
      activate abundance directly. Here persecutory violence does not
      cancel help; it changes its material carrier from living goat and
      food-table into buried entrails, miraculous tree, selective
      fruit, and portable rightful property. KHM 130 needs the law
      because the goat's death is not the end of aid but the moment
      that makes social recognition and marriage possible.
    tier: operational
    scope: world
    lens: material
    domains: [helper-death, tree, goat, rightful-owner, abundance, envy]
    related: [sp_goat, loc_tree, obj_wishing_table, arc_oppressed_maiden, affect_envy]
    examples: [one_eye_two_eyes_three_eyes]

  law_formulaic_consent_circulates_through_household:
    name: Formulaic Consent Circulates Through Household
    description: |
      A suitor's marriage request is passed through every named
      household member in a repeated question-and-answer chain, so
      bride-choice becomes comic household consensus rather than
      private romance, paternal command, or heroic achievement.
    rationale: |
      Distinct from `law_promise_binds_reality`, where one utterance
      creates obligation, and from `law_irresistible_request_overrides_judgment`,
      where a magical gift forces consent. Here nothing supernatural
      compels agreement; the tale's force is oral-formula structure:
      the same request, thanks, location question, and conditional
      consent circulate from father to mother to siblings to bride,
      ending in a dowry/trade joke. KHM 131 needs the law so nonsense
      courtship tales can be queried as speech-chain architecture, not
      as thin marriage plots.
    tier: structural
    scope: tale
    lens: structural
    domains: [courtship, formula, household, consent, nonsense, speech]
    related: [speech_request, speech_promise, agency_speech, moral_comic_inversion]
    examples: [fair_katrinelje_and_pif_paf_poltrie]

  law_formulaic_name_chain_accumulates_household:
    name: Formulaic Name Chain Accumulates Household
    description: |
      A question-and-answer chant builds a household inventory one name
      at a time, then repeats the whole list as a shared travel or
      companionship formula.
    rationale: |
      Distinct from `law_formulaic_consent_circulates_through_household`,
      where repeated questions move marriage consent through family
      authority, and from `law_nonsense_catalogue_suspends_causality`,
      where contradictions replace ordinary causality. Here the action
      is purely oral and cumulative: Walpe, Cham, Wild, Hippodadle, and
      From-thy-work-do-not-budge become a growing household chain whose
      pleasure lies in repeated naming. KHM 140 needs this slot for
      queries over formula tales where domestic roles are assembled by
      chant rather than by plot events.
    tier: structural
    scope: tale
    lens: structural
    domains: [formula, household, naming, cumulative, nonsense, speech]
    related: [speech_request, agency_speech, agency_domestic_labor, moral_comic_inversion]
    examples: [domestic_servants]

  law_nonsense_catalogue_suspends_causality:
    name: Nonsense Catalogue Suspends Causality
    description: |
      A comic tale proceeds by stacking impossible statements as if
      each were ordinary fact: disabled bodies perform contradictory
      feats, unusable objects function, and impossible spaces nest
      inside one another without explanation.
    rationale: |
      Distinct from `law_material_token_authenticates_tall_tale`,
      where an impossible first-person story is anchored by a proof
      object, and from `law_formulaic_consent_circulates_through_household`,
      where nonsense is carried by repeated dialogue. Here the whole
      plot is a catalogue of violated causality: the blind son shoots,
      the lame son catches, the naked son pockets, a bottomless boat is
      boarded, and a chapel sits inside a tree. KHM 138 needs this slot
      for queries over pure nonsense tales where contradiction itself,
      not trickery or magic, is the organizing law.
    tier: structural
    scope: tale
    lens: structural
    domains: [nonsense, impossibility, body, object, space, comedy]
    related: [arc_fool, being_animated_object, moral_comic_inversion, num_2, num_3]
    examples: [knoist_and_his_three_sons, the_story_of_schlauraffen_land, the_ditmarsh_tale_of_wonders]

  law_idle_boast_catalogue_escalates_neglect:
    name: Idle Boast Catalogue Escalates Neglect
    description: |
      A comic tale can be organized as a serial catalogue of speakers
      who compete by boasting ever more extreme refusals of work,
      care, movement, self-preservation, or service obligation.
    rationale: |
      Distinct from `law_nonsense_catalogue_suspends_causality`, where
      impossible contradictions replace causal order, and from
      `law_inverted_succession_rewards_extreme_idleness`, where one
      royal decision converts laziness into inheritance. Here the
      structure is cumulative servant self-report: each speaker
      converts neglected labour, animal care, bodily injury, hunger,
      road danger, lost property, or dismissed service into evidence
      of superior idleness. KHM 151b needs this law for queries over
      laziness catalogues, anti-labour schwanks, and comic neglect
      without collapsing them into pure nonsense.
    tier: structural
    scope: tale
    lens: structural
    domains: [laziness, servants, catalogue, labour, neglect, comedy]
    related: [affect_sloth, agency_domestic_labor, speech_boast, moral_comic_inversion, num_12]
    examples: [the_twelve_idle_servants]

  law_blue_light_pipe_summons_bound_servitor:
    name: Blue-Light Pipe Summons Bound Servitor
    description: |
      Lighting a pipe or similar smoking instrument from a blue,
      never-extinguished magical flame summons a small bound servitor
      who must obey the bearer's commands.
    rationale: |
      Distinct from `law_formula_commands_magic_objects`, where spoken
      words activate an object directly, and from
      `obj_summoning_knapsack`, which releases a troop. This law makes
      ignition and smoke the summoning interface: the soldier does not
      command the blue light by formula, but uses it to light his pipe,
      after which the black mannikin appears and asks for orders. KHM
      116 needs the law to query magical servitors bound to flame,
      tobacco, and portable light rather than to spoken command alone.
    tier: operational
    scope: world
    lens: material
    domains: [blue-light, pipe, smoke, servitor, command]
    related: [obj_blue_summoning_light, obj_summoning_pipe, being_dwarf, agency_object_mediation]
    examples: [obj_blue_light]

  law_summoning_ring_commands_air_spirits:
    name: Summoning Ring Commands Air Spirits
    description: |
      A ring taken from a defeated dwarf can summon spirits of the air
      when turned on the finger; those spirits recognize the wearer as
      master and provide transport, information, or rescue on command.
    rationale: |
      Distinct from `law_wishing_ring_obeys_but_exposes_broken_promise`,
      where the ring carries out wishes but becomes dangerous through
      a broken promise, and from `law_music_attracts`, where sound
      summons helpers. KHM 166 needs this law because the sparkling
      ring is not a general wish engine: turning it calls a specific
      aerial servitor group that lifts Hans from underground and later
      carries him into the boat. The slot enables queries over magic
      rings as command interfaces to bound spirits rather than only
      wish-objects or recognition tokens.
    tier: operational
    scope: world
    lens: material
    domains: [ring, spirits, air, command, transport]
    related: [obj_wishing_ring, being_spirit, agency_object_mediation, loc_cave, loc_sea]
    examples: [obj_strong_hans_summoning_ring]

  law_mismatched_body_parts_transfer_agency:
    name: Mismatched Body Parts Transfer Agency
    description: |
      A body restored with another creature's or criminal's part
      inherits that part's former drives, capacities, or compulsions:
      a thief's hand steals, cat's eyes see in animal fashion, and a
      pig's heart pulls the human body toward piggish rooting.
    rationale: |
      Distinct from `law_correct_bone_order_restores_life`, where
      proper anatomical ordering restores the original person, and
      from `transform_resurrection_by_remedy`, where medicine revives
      without altering identity. This law captures a comic material
      ontology of partial embodiment: organs are not neutral spare
      parts but carriers of prior agency. KHM 118 needs it for queries
      over replacement limbs, borrowed animal perception, and bodily
      identity fractured by technical repair.
    tier: operational
    scope: world
    lens: material
    domains: [body, surgery, replacement, animal-trait, theft, comic]
    related: [obj_rejoining_salve, state_maimed, sp_cat, sp_pig, moral_comic_inversion]
    examples: [the_three_army_surgeons]

  law_correct_bone_order_restores_life:
    name: Correct Bone Order Restores Life
    description: |
      A dismembered or boiled corpse can be restored only when the
      cleaned bones are placed back in their proper bodily order before
      sacred revivifying speech is spoken.
    rationale: |
      Distinct from `transform_resurrection_by_remedy`, where a leaf,
      root, or water heals the dead, and from `law_dead_matter_reveals_
      murder`, where bones testify rather than revive. Here
      resurrection is technical and sacred at once: St. Peter can boil
      the body, arrange the white bones naturally, and speak the
      Trinity formula; Brother Lustig imitates the visible steps but
      fails when he lays the bones in confusion. KHM 81 needs this law
      to query resurrection scenes where anatomical order is the
      condition of life.
    tier: operational
    scope: world
    lens: material
    domains: [resurrection, bones, body-order, sacred-speech, imitation]
    related: [being_divine, speech_command, moral_mercy_over_judgment]
    examples: [brother_lustig_first_princess, brother_lustig_second_princess]

  law_sacred_forge_rejuvenates_body:
    name: Sacred Forge Rejuvenates Body
    description: |
      Under divine authority, forge fire, quenching water, and blessing
      can remake an aged or infirm body into youthful health.
    rationale: |
      Distinct from `law_correct_bone_order_restores_life`, where a
      dead body is boiled, anatomically reassembled, and resurrected,
      and from ordinary smithcraft, which works iron rather than human
      flesh. KHM 147 needs this law because rejuvenation is staged as a
      smithing process only when performed by the Lord: the beggar is
      heated red-hot, cooled in the quenching tub, blessed, and emerges
      young. The node supports queries over sacred craft, fire-water
      body remaking, and rejuvenation miracles.
    tier: operational
    scope: world
    lens: material
    domains: [forge, fire, water, rejuvenation, divine, body]
    related: [being_divine, loc_forge, speech_blessing, moral_mercy_over_judgment]
    examples: [old_man_made_young_beggar]

  law_imitated_miracle_without_authority_deforms_body:
    name: Imitated Miracle Without Authority Deforms Body
    description: |
      A human imitator who copies the visible procedure of a sacred
      miracle without its divine authority or exact art converts
      healing into bodily deformation and wider comic harm.
    rationale: |
      Distinct from `law_fatal_imitation_of_trickster_profit`, where
      greed copies a profit trick, and from `law_correct_bone_order_
      restores_life`, where failure comes from wrong anatomical
      ordering. Here the smith sees the forge-rejuvenation closely but
      mistakes sacred power for transferable craft technique. KHM 147
      needs this law because the mother-in-law is not restored; she is
      burned, shrivelled, and her terrified pregnant witnesses give
      birth to apes. The law lets failed miracle imitation be queried
      apart from failed commerce, failed resurrection, and ordinary
      violence.
    tier: operational
    scope: world
    lens: material
    domains: [imitation, miracle, forge, deformation, birth, etiology]
    related: [law_sacred_forge_rejuvenates_body, loc_forge, sp_ape, moral_comic_inversion]
    examples: [old_man_made_young_mother_in_law]

  law_wish_knapsack_contains_targets:
    name: Wish-Knapsack Contains Targets
    description: |
      A magical knapsack receives whatever the owner wishes into it:
      food, devils, or even the owner himself can be transferred into
      the bag by directed wish-speech.
    rationale: |
      Distinct from `obj_summoning_knapsack`, which releases soldiers,
      and from `obj_cudgel_in_sack`, which houses a single punitive
      weapon. Brother Lustig's knapsack is inward-pulling and
      jurisdiction-breaking: it steals roasted geese, traps nine
      devils, terrifies Hell, and finally gets its owner into Heaven
      through the bars. KHM 81 needs this law because the bag's power
      is not abundance or combat alone but containment by wish.
    tier: operational
    scope: world
    lens: material
    domains: [knapsack, wish, containment, devils, food, heaven]
    related: [obj_wish_knapsack, speech_wish, being_devil, loc_heaven]
    examples: [brother_lustig]

  law_winning_game_objects_totalize_play:
    name: Winning Game Objects Totalize Play
    description: |
      Cards or dice granted as supernatural favours make every game
      winnable, allowing the gambler to convert money, property,
      people, devils, and even cosmic order into stakes.
    rationale: |
      Distinct from `law_wish_speech_materializes_reality`, where
      wishes directly alter reality, and from `law_formula_commands_
      magic_objects`, where a command activates an object for a fixed
      material output. Here the objects keep the social form of play:
      Hansel must gamble, but the game has become cosmically rigged in
      his favour. KHM 82 needs this law because his cards and dice let
      him win half the world and Lucifer's devils, pushing gambling
      beyond vice into world-threatening structure.
    tier: operational
    scope: world
    lens: structural
    domains: [gambling, cards, dice, winning, world-order]
    related: [obj_winning_cards_dice, arc_compulsive_gambler, moral_trickster_wins]
    examples: [gambling_hansel]

  law_diminishing_exchange_reframed_as_luck:
    name: Diminishing Exchange Reframed as Luck
    description: |
      A sequence of materially worsening trades is experienced by the
      protagonist as increasing good fortune because each exchange
      removes a current discomfort, fear, or burden.
    rationale: |
      Distinct from `law_coercive_retrieval_voids_exchange`, where a
      stronger party reclaims traded goods, and from ordinary
      foolishness, where loss is simply not understood. In KHM 83 Hans
      repeatedly loses objective value, but each loss solves the felt
      problem of the moment: weight, danger, thirst, legal fear, work,
      and finally burden itself. This law makes subjective luck
      queryable apart from market value.
    tier: operational
    scope: world
    lens: cognitive
    domains: [exchange, luck, value, burden, happiness]
    related: [arc_fool, moral_contentment_over_possession, agency_object_mediation]
    examples: [hans_in_luck]

  law_equivocal_poverty_terms_mimic_wealth:
    name: Equivocal Poverty Terms Mimic Wealth
    description: |
      Literally true phrases about humble objects or conditions are
      chosen because they can be misheard as signs of property, money,
      food abundance, or land.
    rationale: |
      Distinct from `speech_lie`, where the speaker simply states
      falsehood, and from `law_speech_taken_literally`, where the
      hearer innocently over-literalizes an instruction. Here the
      wooer engineers ambiguity: a hot place behind the stove becomes
      a "snug berth," one farthing becomes "money in hand," bread in
      milk becomes "bread to break," and trouser patches sound like
      fields. KHM 84 needs this law because marriage is secured by
      double-meaning property language rather than by open deception.
    tier: operational
    scope: world
    lens: cognitive
    domains: [marriage, poverty, ambiguity, property, speech]
    related: [speech_lie, agency_cunning, moral_trickster_wins]
    examples: [hans_married]

  law_trapped_death_suspends_mortality:
    name: Trapped Death Suspends Mortality
    description: |
      When the personified figure of Death is immobilised or bound,
      ordinary mortality stops for everyone until Death is released.
    rationale: |
      Distinct from `law_death_position_determines_healing`, where
      Death's location decides whether a single patient can be healed,
      and from `law_life_candle_measures_lifespan`, where lifespan is
      indexed by flame. This law names jurisdictional absence: Hansel's
      tree does not save only him, but prevents anyone from dying for
      seven years. KHM 82 needs the term because cosmic mortality is
      made dependent on Death's freedom of movement.
    tier: operational
    scope: world
    lens: structural
    domains: [death, mortality, trap, time, cosmic-order]
    related: [being_death, obj_sticky_fruit_tree, num_7]
    examples: [gambling_hansel]

  law_celestial_light_displaced_unsettles_dead:
    name: Celestial Light Displaced Unsettles the Dead
    description: |
      When a celestial light is treated as portable property, stolen,
      divided, and buried, its misplaced illumination wakes the dead
      into renewed worldly activity until sacred authority restores the
      light to its proper heavenly place.
    rationale: |
      Distinct from `law_trapped_death_suspends_mortality`, where
      Death's immobilization suspends dying for the living, and from
      `law_heavenly_rejoicing_marks_rare_rich_salvation`, where heaven
      interprets salvation. KHM 175 needs this law because the moon's
      movement across realms changes what the dead can do: darkness
      keeps them asleep, buried moonlight wakes them into tavern,
      dance, quarrel, and revolt-like noise, and Saint Peter's
      relocation of the moon re-separates the dead from social life.
      The slot enables queries over cosmic objects whose wrong
      placement alters afterlife order.
    tier: operational
    scope: world
    lens: material
    domains: [moon, light, afterlife, dead, cosmic-order, theft]
    related: [obj_portable_celestial_light, loc_world_below, loc_heaven, being_divine, state_liminal_dead, moral_cosmic_order_restored]
    examples: [the_moon]

  law_coercive_retrieval_voids_exchange:
    name: Coercive Retrieval Voids Exchange
    description: |
      A bargain or exchange is formally made, but the giver then uses
      superior magical force to reclaim the traded object, keeping both
      the payment received and the property surrendered.
    rationale: |
      Distinct from `law_might_unmakes_promise`, where inequality lets
      a stronger partner break a social promise, and from
      `law_formula_commands_magic_objects`, which only names object
      activation. Here the story's economic rule is coercive
      accumulation: the third brother trades the wishing-cloth three
      times, then sends summoned soldiers to take it back each time.
      KHM 54 needs this law because the plot turns a sequence of
      exchanges into unilateral acquisition by force.
    tier: operational
    scope: world
    lens: structural
    domains: [exchange, coercion, magic-object, property, force]
    related: [law_formula_commands_magic_objects, obj_summoning_knapsack, agency_violence, moral_trickster_wins]
    examples: [the_knapsack_the_hat_and_the_horn]

  law_militarized_objects_create_sovereignty:
    name: Militarized Objects Create Sovereignty
    description: |
      Portable magic objects that summon troops, fire artillery, or
      destroy fortifications can convert a private wanderer into a
      ruler by overwhelming household, city, and royal resistance.
    rationale: |
      Distinct from `law_boast_generates_reputation`, where social
      belief makes a hero seem mighty, and from ordinary
      `agency_violence`, where force is bodily or institutional. This
      law names object-mediated sovereignty: knapsack soldiers, hat
      cannon, and siege horn defeat brothers, royal troops, king, and
      princess until no one can oppose the possessor. KHM 54 needs it
      to query tales where kingship is produced by magical military
      capacity rather than election, marriage merit, or inheritance.
    tier: operational
    scope: world
    lens: material
    domains: [military, magic-object, sovereignty, artillery, conquest]
    related: [obj_summoning_knapsack, obj_artillery_hat, obj_siege_horn, agency_object_mediation, moral_trickster_wins]
    examples: [the_knapsack_the_hat_and_the_horn]

  law_false_boast_imposes_impossible_task:
    name: False Boast Imposes Impossible Task
    description: |
      A claim made to increase status is accepted literally by power,
      turning the boast into an impossible labour demand whose failure
      carries death, marriage, or other high-stakes consequences.
    rationale: |
      Distinct from `law_boast_generates_reputation`, where listeners
      inflate a small feat into heroic identity, and from ordinary
      `speech_lie`, which merely deceives. Here false prestige becomes
      a binding task: the miller says his daughter can spin straw into
      gold, and the king immediately imprisons her with straw, wheel,
      reel, and a death condition. KHM 55 needs this law because the
      daughter suffers the ontological cost of someone else's boast.
    tier: operational
    scope: world
    lens: structural
    domains: [boast, lie, labour, task, status]
    related: [speech_lie, speech_boast, obj_spinning_wheel, agency_social_rank]
    examples: [rumpelstiltskin]

  law_secret_name_breaks_supernatural_claim:
    name: Secret Name Breaks Supernatural Claim
    description: |
      A supernatural claimant's power over a child, bargain, or victim
      depends on the claimant's name remaining unknown; correctly
      speaking the name cancels the claim.
    rationale: |
      Distinct from `speech_riddle`, where an answer wins a formal
      contest, and from `law_promise_binds_reality`, where the promise
      itself remains binding. This law makes hidden identity the weak
      point of supernatural contract: the manikin can claim the
      queen's child until a messenger overhears and reports his name,
      allowing the queen to speak "Rumpelstiltskin." KHM 55 needs it
      for queries over name-magic, secrecy, and contract escape.
    tier: operational
    scope: world
    lens: cognitive
    domains: [name, secrecy, contract, child, magic]
    related: [speech_name_guess, law_promise_binds_reality, being_dwarf, state_hidden_identity]
    examples: [rumpelstiltskin]

  law_tiny_body_enables_hidden_agency:
    name: Tiny Body Enables Hidden Agency
    description: |
      Extreme smallness lets a character enter concealed positions,
      animal bodies, containers, holes, and ears, so that their voice
      or motion appears to come from nowhere or from another being. The
      size deficit becomes tactical power.
    rationale: |
      Distinct from `state_hidden_identity`, where identity is
      concealed socially, and from `state_devoured_but_alive`, which
      names one captivity condition. This law names the repeated engine
      of KHM 37: Thumbling's thumb-size body lets him drive a horse
      from its ear, escape buyers through a mouse-hole, shelter in a
      snail-shell, survive inside a cow and wolf, and make larger
      people misread the source of speech.
    tier: operational
    scope: world
    lens: material
    domains: [smallness, concealment, voice, mobility, trickster]
    related: [arc_tiny_hero, state_devoured_but_alive, agency_cunning]
    examples: [thumbling]

  law_boast_generates_reputation:
    name: Boast Generates Reputation
    description: |
      A compact public boast, inscription, or self-advertisement is
      accepted by others as evidence of heroic power, even when its
      original referent was trivial or ambiguous.
    rationale: |
      Distinct from `law_speech_taken_literally`, where a fool treats
      animal sounds or words as legal fact, and from `speech_lie`,
      which is ordinary counter-truth. This law names reputation as an
      operational force: "Seven at one stroke" meant flies, but towns,
      giants, soldiers, and kings infer slain men. KHM 20 needs it
      because the tailor's social ascent is powered by the public
      afterlife of a boast, not by actual strength.
    tier: operational
    scope: world
    lens: cognitive
    domains: [boast, reputation, misrecognition, heroism, schwank]
    related: [speech_boast, obj_boast_girdle, state_deceived, moral_trickster_wins]
    examples: [the_brave_little_tailor, the_giant_and_the_tailor]

  law_laughter_releases_reward:
    name: Laughter Releases the Reward
    description: |
      A standing reward (typically the princess's hand or a sum of
      money) is bound to the singular condition of eliciting laughter
      from a person who has never laughed; once the laughter occurs,
      the reward-obligation is irrevocably triggered and the
      reward-promiser must deliver something — though the schwank
      lets him substitute.
    rationale: |
      Distinct from `law_promise_binds_reality` (which binds any
      promise) — this law specifies a particular trigger-condition
      (laughter-from-unlaughing) and a particular structural role
      (king-as-rewarder). Captures the schwank/märchen sub-mechanism
      where laughter is itself a quest-completion event. The peasant
      doesn't intend to make the princess laugh; the fact-of-laughing
      is enough to trigger the reward-obligation, which makes the
      law impersonal (no merit required — affect-elicited is enough).
    tier: operational
    scope: world
    lens: structural
    domains: [laughter, reward, bridal-task, schwank]
    related: [arc_unlaughing_princess, moral_comic_inversion]
    examples: [good_bargain_princess]

  law_sticky_wonder_object_collects_interferers:
    name: Sticky Wonder Object Collects Interferers
    description: |
      A magical object or animal causes anyone who tries to seize,
      pluck, pull, or separate it without right to stick fast, forming
      a growing procession that the rightful carrier can move as a
      comic train.
    rationale: |
      Distinct from `law_laughter_releases_reward`, where the public
      effect is the princess's laughter, and from ordinary punishment
      magic, where a single offender is harmed. The sticky object makes
      greed and officious correction cumulative: daughters, parson,
      sexton, and labourers each try to interfere and become part of
      the display. KHM 64 needs this law because the golden goose's
      adhesive power is the mechanism that manufactures the laughter-
      releasing spectacle.
    tier: operational
    scope: world
    lens: material
    domains: [sticky-object, procession, greed, laughter, comedy]
    related: [obj_golden_goose, law_laughter_releases_reward, moral_comic_inversion]
    examples: [the_golden_goose]

  law_music_attracts:
    name: Music Attracts and Compels
    description: |
      In the tale-world, music played upon the right instrument
      reaches any nearby ear — wild beasts emerge from cover, humans
      drop their work, otherworldly beings appear — and the listener
      is compelled to come, follow, dance, or yield.
    rationale: |
      Distinct from `law_promise_binds_reality` (which acts on
      contract) and from `law_speech_taken_literally` (semantic).
      Music-attracts is the SPECIFIC operational law that lets a
      fiddle pull a wolf from a thicket, a pipe compel an army. The
      compulsion is affective and non-rational; the listener cannot
      refuse. Worth its own slot because several tales hinge on
      it (KHM 8, 56, 110).
    tier: operational
    scope: world
    lens: structural
    domains: [music, compulsion, sound]
    related: [agency_music]
    examples: [the_strange_musician]

  law_irresistible_request_overrides_judgment:
    name: Irresistible Request Overrides Judgment
    description: |
      A granted power makes any later request impossible to refuse,
      even when the authority hearing it believes refusal would be
      prudent or protective.
    rationale: |
      Distinct from `law_wish_speech_materializes_reality`, where the
      speaker's wish directly changes the world, and from
      `law_promise_binds_reality`, where a prior pledge binds conduct.
      Here the operative force is request-as-compulsion: the servant
      asks to play once before execution, the judge verbally permits
      it, and the narration explains that he could not refuse because
      of the gift. KHM 110 needs this law because the third donor-gift
      is not the fiddle itself but compulsory consent from others.
    tier: operational
    scope: world
    lens: structural
    domains: [request, compulsion, judgment, donor-gift, speech]
    related: [speech_request, agency_speech, law_music_attracts]
    examples: [the_jew_among_thorns]

  law_imitation_trap_overpowers_brute:
    name: Imitation Trap Overpowers Brute
    description: |
      A smaller trickster defeats a stronger animal or giant by making
      the brute imitate a staged skill-test, then converting the
      imitation setup into mechanical restraint or panic.
    rationale: |
      Distinct from `law_music_attracts`, where sound itself compels
      movement, and from `law_boast_generates_reputation`, where public
      misreading creates status. Here the trickster's advantage is
      pedagogical deception: the bear believes he is learning nut-
      cracking and fiddling, but the "lesson" moves his claws into the
      vise. KHM 114 needs the law because the tailor survives not by
      strength or reputation, but by turning the bear's desire to
      imitate human skill into captivity and later threat-memory.
    tier: operational
    scope: world
    lens: cognitive
    domains: [trickster, imitation, brute-force, trap, animal]
    related: [arc_trickster, state_trapped, state_deceived, agency_cunning]
    examples: [cunning_tailor_bear]

  law_speaking_blood_decoys_pursuit:
    name: Speaking Blood Decoys Pursuit
    description: |
      Drops of blood or similar life-substance can answer in a person's
      voice from separated locations, delaying discovery of flight,
      murder, or substitution.
    rationale: |
      Distinct from `law_dead_matter_reveals_murder`, where remains
      disclose truth and enable justice. Speaking-blood decoys conceal
      truth for a fugitive: the murdered daughter's blood answers from
      stairs, kitchen, and bed so the witch searches the wrong places
      before discovering her own child. KHM 56 needs it because blood
      is not evidence here; it is a time-buying false presence.
    tier: operational
    scope: world
    lens: material
    domains: [blood, voice, decoy, pursuit, murder]
    related: [obj_speaking_blood_decoy, law_dead_matter_reveals_murder, agency_object_mediation]
    examples: [obj_sweetheart_roland_blood_drops]

  law_decoy_bride_buys_escape:
    name: Decoy Bride Buys Escape
    description: |
      A substitute object dressed or positioned as the bride can satisfy
      a coercive groom's expectation long enough for the real bride to
      leave the marriage scene and return to safety.
    rationale: |
      Distinct from `law_speaking_blood_decoys_pursuit`, where living
      blood imitates voice from several household points, and from
      `arc_false_bride`, where a rival attempts to occupy the bride's
      social role. Here the substitute is knowingly inert: it does not
      claim marriage, it buys time. KHM 66 needs the law because the
      girl's only counterpower inside the hare's wedding-house is to
      make a straw-doll perform her visible place by the cooking pan
      while she escapes.
    tier: operational
    scope: world
    lens: material
    domains: [decoy, bride, escape, substitution, marriage]
    related: [obj_decoy_bride_doll, arc_coercive_animal_bridegroom, agency_object_mediation]
    examples: [the_hares_bride]

  law_voice_recognizes_forgotten_bride:
    name: Voice Recognizes Forgotten Bride
    description: |
      A sung or spoken voice can restore a lover's forgotten bond,
      overriding enchantment, social replacement, or new wedding
      arrangements and revealing the true bride.
    rationale: |
      Distinct from `law_true_fit_reveals_identity`, where recognition
      comes through bodily fit with an object, and from
      `law_music_attracts`, where sound compels movement or dancing.
      This law makes voice a memory-key: Roland has forgotten the
      maiden under another woman's influence, but when her song reaches
      him he knows the voice and rejects the false wedding. KHM 56
      needs it for queries over forgotten betrothals resolved by sound
      rather than by token, shoe, or confession.
    tier: operational
    scope: world
    lens: cognitive
    domains: [voice, memory, bride, recognition, fidelity]
    related: [state_forgotten_bride, agency_music, affect_loyalty, moral_restorative]
    examples: [sweetheart_roland]

  law_sacred_proxy_answers_watch:
    name: Sacred Proxy Answers Watch
    description: |
      A sacred image or relic answers a tyrannical watch-call in the
      hero's place, allowing the hero to sleep while the ordeal's
      formal response requirement is still satisfied.
    rationale: |
      Distinct from `law_speaking_blood_decoys_pursuit`, where blood
      imitates a fugitive's voice to delay discovery, and from
      `law_voice_recognizes_forgotten_bride`, where voice restores
      memory. Here the speaking/answering proxy is sacred material
      enlisted by a helper inside an execution-threat ordeal. KHM 113
      needs the law because the stone images of St. Christopher do not
      expose or remember anyone; they satisfy the father's hourly call
      while the prince sleeps on the threshold.
    tier: operational
    scope: world
    lens: material
    domains: [ordeal, sacred-image, proxy, sleep, bride-winning]
    related: [obj_sacred_answering_image, agency_object_mediation, threshold_doorway]
    examples: [obj_two_kings_st_christopher_images]

  law_hidden_clerk_voice_misattributed_to_sacred_image:
    name: Hidden Clerk Voice Misattributed to Sacred Image
    description: |
      A private devotional request in church is overheard by a hidden
      clerk or church functionary whose reply is mistaken for speech
      from a saintly image, turning prayer into comic argument with
      sacred material.
    rationale: |
      Distinct from `law_sacred_proxy_answers_watch`, where a sacred
      image truly answers in another person's place, and from
      `law_speech_taken_literally`, where ordinary or animal speech is
      legally ratified by literal interpretation. Here the comedy
      depends on source-confusion inside sacred space: the clerk's
      gruff prohibition is human eavesdropping, but the maid hears it
      as the child Mary interrupting Saint Anne. KHM 139 needs this law
      for queries over anticlerical chapel jokes, misattributed sacred
      speech, and prayer transformed into quarrel.
    tier: structural
    scope: tale
    lens: structural
    domains: [church, prayer, misattribution, sacred-image, marriage, schwank]
    related: [speech_prayer, speech_prohibition, loc_church, obj_sacred_answering_image, moral_comic_inversion]
    examples: [the_maid_of_brakel]

  law_summoned_earth_workers_complete_tasks:
    name: Summoned Earth-Workers Complete Tasks
    description: |
      A helper can summon collective subterranean workers by ritual
      handling of an object and formulaic speech; the workers complete
      landscape-scale impossible labour before the deadline.
    rationale: |
      Distinct from `law_rescued_animals_repay_kindness`, where prior
      mercy creates later animal aid, and from
      `law_secret_night_labor_restores_honest_poverty`, where hidden
      little men repair craft-poverty without a command scene. Here
      the aid is commanded, collective, and earth-bound: a knotted
      handkerchief struck on the ground calls earth-workers who cut
      forest, cleanse pond, and build a castle on a mountain. KHM 113
      needs the law to query impossible-task completion by summoned
      labour rather than gratitude, skill, or animal repayment.
    tier: operational
    scope: world
    lens: structural
    domains: [impossible-task, subterranean, labor, formula, helper]
    related: [being_dwarf, obj_summoning_handkerchief, agency_domestic_labor, agency_speech]
    examples: [two_kings_earth_workers]

  law_compassionate_helper_completes_oppressive_tasks:
    name: Compassionate Helper Completes Oppressive Tasks
    description: |
      A supernatural helper who appears in response to an oppressed
      girl's tears can complete impossible domestic or architectural
      tasks while the girl sleeps, converting punitive labour into
      finished work before the deadline.
    rationale: |
      Distinct from `law_summoned_earth_workers_complete_tasks`, where
      a formula and object call collective subterranean labour, and
      from `law_kindness_to_hidden_donors_rewarded`, where the human's
      prior conduct toward a tester decides reward. Here the helper
      arrives from pity and acts directly: feathers are picked, a pond
      is emptied, and a castle is built because the stepmother's tasks
      are abusive rather than pedagogical. KHM 186 needs the law for
      queries over impossible labour relieved by compassionate
      old-woman helpers.
    tier: operational
    scope: world
    lens: structural
    domains: [impossible-task, oppression, helper, sleep, labour, castle]
    related: [arc_supernatural_donor, arc_oppressed_maiden, agency_domestic_labor, affect_pity, moral_restorative]
    examples: [the_true_sweetheart_the_true_bride]

  law_wishing_ring_completes_witch_tasks_while_hero_sleeps:
    name: Wishing Ring Completes Witch Tasks while Hero Sleeps
    description: |
      A captive bride's wishing ring can complete impossible landscape
      tasks for the hero while he sleeps, moving water, sorting fish,
      felling and stacking forest, and preparing the fire that will
      expose the witch's final enchantment.
    rationale: |
      Distinct from `law_summoned_earth_workers_complete_tasks`, where
      a formula calls collective workers, and from
      `law_compassionate_helper_completes_oppressive_tasks`, where a
      donor helper appears from pity. Here the captive bride is both
      helper and person to be rescued; the ring is her operational
      instrument against the witch. KHM 193 needs this law because the
      drummer's courage matters, but the actual task completion comes
      from the bride's controlled wish-object.
    tier: operational
    scope: world
    lens: material
    domains: [wishing-ring, impossible-task, witch, sleep, rescue, bride]
    related: [obj_wishing_ring, being_witch, state_imprisoned, agency_object_mediation, law_voice_recognizes_forgotten_bride]
    examples: [the_drummer]

  law_homecoming_kiss_erases_bride_memory:
    name: Homecoming Kiss Erases Bride Memory
    description: |
      A parental kiss at the home threshold can erase the returning
      bridegroom's memory of his rescued bride and of the mission to
      fetch her, leaving her abandoned near the household.
    rationale: |
      Distinct from `state_forgotten_bride`, which names the bride's
      resulting condition, and from `law_voice_recognizes_forgotten_
      bride`, which names the later repair. This law isolates the
      causal trigger: the motherly greeting does not deceive by words
      or substitute a bride directly; the kiss changes memory at the
      moment the prince is about to bring the bride into courtly
      recognition. KHM 113 needs it for queries over family authority,
      memory loss, and failed bride retrieval.
    tier: operational
    scope: world
    lens: cognitive
    domains: [memory, kiss, homecoming, bride, mother]
    related: [state_forgotten_bride, law_voice_recognizes_forgotten_bride, affect_loyalty]
    examples: [two_kings_prince]

  law_reserved_betrothal_kiss_restores_bride_memory:
    name: Reserved Betrothal Kiss Restores Bride Memory
    description: |
      A kiss reserved by a betrothal condition can restore the
      bridegroom's forgotten bond when placed on the forbidden or
      protected cheek, making the true bride recognizable again.
    rationale: |
      Distinct from `law_voice_recognizes_forgotten_bride`, where song
      or spoken voice itself unlocks memory, and from
      `law_homecoming_kiss_erases_bride_memory`, where a household kiss
      causes forgetting. Here the kiss is covenantal and corrective:
      the bride forbids any other kiss on the left cheek, later kisses
      that cheek herself, and the prince's eyes clear. KHM 186 needs
      the law because the song prepares recognition, but the reserved
      betrothal kiss completes it.
    tier: operational
    scope: world
    lens: cognitive
    domains: [kiss, memory, betrothal, bride, recognition, fidelity]
    related: [state_forgotten_bride, law_voice_recognizes_forgotten_bride, affect_loyalty, affect_love]
    examples: [the_true_sweetheart_the_true_bride]

  law_wonder_gifts_purchase_recognition_nights:
    name: Wonder Gifts Purchase Recognition Nights
    description: |
      Rare magical gifts coveted by a rival bride can be bartered for
      nights near a forgotten bridegroom, creating repeated chances
      for speech, memory, and recognition.
    rationale: |
      Distinct from `law_kitchen_tokens_reveal_hidden_bride`, where
      objects identify a hidden bride through food service, and from
      `obj_hidden_bride_token`, where a private token communicates
      identity. Here the gifts are exchange currency: dresses, golden
      birds, or similar wonders are surrendered to the rival bride not
      for display alone, but to buy access to the sleeping or guarded
      bridegroom. KHM 88 and KHM 113 need the law because recognition
      depends on converting wonder-goods into hearing-distance nights.
    tier: operational
    scope: world
    lens: material
    domains: [recognition, bride, gift, barter, night]
    related: [state_forgotten_bride, law_voice_recognizes_forgotten_bride, obj_hidden_bride_token, speech_bargain]
    examples: [obj_two_kings_walnut_dresses, obj_lark_sun_dress]

  law_enchanted_water_transforms:
    name: Enchanted Water Transforms
    description: |
      Water that has been bewitched, blessed, or otherwise charged
      changes the drinker's body or state immediately on contact:
      human becomes beast, thirst becomes curse, or a healing draught
      restores life.
    rationale: |
      Distinct from `law_curse_requires_counter_condition`, which
      governs how a curse is undone, and from `threshold_well`, which
      marks vertical passage. This law names water-as-agent: drinking
      is the trigger. KHM 11's brooks speak their own transformation
      conditions and turn the brother into a roebuck when drops touch
      his lips. Later water-of-life and nixie tales use water as
      transformative substance in different moral registers.
    tier: operational
    scope: world
    lens: structural
    domains: [water, transformation, thirst, curse]
    related: [loc_brook, transform_curse, state_transformed]
    examples: [little_brother_third_brook]

  law_sibling_lament_reveals_bewitched_humanity:
    name: Sibling Lament Reveals Bewitched Humanity
    description: |
      Transformed siblings retain kinship speech across animal bodies;
      their shared lament lets a human witness recognise that the
      animals are bewitched children and interrupt the threatened
      slaughter.
    rationale: |
      Distinct from `law_enchanted_water_transforms`, which names water
      as the transformation trigger, and from `law_voice_recognizes_forgotten_bride`,
      where voice restores memory of a human bride. Here the voice is
      not recognition-token but rescue evidence: fish-brother and
      lamb-sister speak their sorrow across pond and kitchen, causing
      the cook to refuse the stepmother's killing order. KHM 141 needs
      this law for queries over transformed sibling pairs whose human
      identity survives as kinship lament.
    tier: operational
    scope: world
    lens: structural
    domains: [siblings, lament, transformation, speech, rescue, witchcraft]
    related: [arc_cruel_stepmother, transform_animal_human, sp_fish, sp_sheep, agency_speech, moral_restorative]
    examples: [the_lambkin_and_the_little_fish]

  law_transforming_cabbages_alternate_human_donkey_form:
    name: Transforming Cabbages Alternate Human-Donkey Form
    description: |
      Two kinds of enchanted cabbage operate as paired bodily switches:
      eating one kind changes a human into a donkey or ass, while
      eating the other restores the donkey to human form.
    rationale: |
      Distinct from `law_enchanted_water_transforms`, where cursed
      drinking water imposes one animal shape, and from
      `law_burned_animal_skin_releases_human_form`, where a removable
      covering controls form. Cabbage transformation is edible,
      reversible, and usable as punishment: the huntsman first suffers
      the donkey-form accidentally, then weaponizes the two vegetable
      types against the witch, servant, and maiden. KHM 122 needs this
      law for queries over food-based reversible metamorphosis and
      punitive animalisation.
    tier: operational
    scope: world
    lens: material
    domains: [food, cabbage, donkey, transformation, punishment]
    related: [obj_transforming_cabbages, sp_donkey, transform_animal_human, state_transformed, moral_retributive]
    examples: [donkey_cabbages]

  law_plain_ring_breaks_tree_dove_enchantment:
    name: Plain Ring Breaks Tree-Dove Enchantment
    description: |
      A witch's possession of one plain ring sustains an enchantment in
      which a prince is a tree most of the time and a white dove for a
      brief interval; recovering the unadorned ring releases him and
      the household likewise transformed into trees.
    rationale: |
      Distinct from `law_true_fit_reveals_identity`, where a ring or
      shoe proves rightful identity, and from `law_curse_requires_counter_condition`,
      which names release conditions generally. Here the ring is a
      form-binding token hidden among more tempting rings: the heroine
      must ignore glittering decoys, seize the bird-cage that contains
      the plain ring, and wait by the tree. KHM 123 needs the law for
      queries over humble-token selection, witch-held enchantment, and
      transformations split between plant and bird form.
    tier: operational
    scope: world
    lens: material
    domains: [ring, tree, bird, enchantment, witch, release]
    related: [obj_form_binding_ring, transform_plant_human, transform_animal_human, sp_bird, being_witch]
    examples: [the_old_woman_in_the_wood]

  law_opened_enchantment_vessels_restore_household:
    name: Opened Enchantment Vessels Restore Household
    description: |
      Household, estate, and people compressed into glass containers
      can return to natural scale and form when the right person opens
      the enclosing chests or bottles.
    rationale: |
      Distinct from `law_plain_ring_breaks_tree_dove_enchantment`,
      where one humble token breaks a tree-bird curse, and from
      `transform_punitive_objectification`, which names reduction into
      inert matter but not the release mechanism. In KHM 163 the castle
      is miniature in one glass chest, the people are smoke in glass
      vessels, and restoration happens by moving and opening the
      containers. The law supports queries over reversible
      miniaturization, smoke confinement, estate restoration, and
      container-based enchantment.
    tier: operational
    scope: world
    lens: material
    domains: [glass, vessel, miniaturization, smoke, household, restoration]
    related: [transform_punitive_objectification, state_transformed, loc_castle, agency_object_mediation, moral_restorative]
    examples: [the_glass_coffin]

  law_monster_household_eavesdropping_yields_remedies:
    name: Monster-Household Eavesdropping Yields Remedies
    description: |
      A hero hidden inside a monster's household can obtain answers to
      multiple human-world afflictions when a safer household insider
      asks the monster about them during the night.
    rationale: |
      Distinct from `law_overheard_infernal_riddle_breaks_soul_bargain`,
      where a devil-riddle releases a bound soldier from a soul bargain,
      and from ordinary `speech_riddle`, where a question is publicly
      posed as a test. In KHM 165 Hans hides under the Griffin's bed,
      the Griffin's wife redirects suspicion and asks about a lost key,
      a sick daughter, and a lake-carrier's bondage, and the answers
      become remedies and rewards. This law supports queries over
      dangerous-knowledge quests, monster wives as mediators, hidden
      listening, and multi-problem remedy circuits.
    tier: operational
    scope: world
    lens: cognitive
    domains: [monster, eavesdropping, remedies, questions, household, knowledge]
    related: [being_griffin, arc_wise_helper, speech_request, speech_testimony, agency_cunning]
    examples: [the_griffin]

  law_midwater_replacement_transfers_ferry_burden:
    name: Midwater Replacement Transfers Ferry Burden
    description: |
      An endless carrying or ferrying obligation can be escaped by
      setting a passenger down in the middle of the crossing, making
      that replacement inherit the burden.
    rationale: |
      Distinct from `law_execution_container_invites_place_swap`, where
      a condemned trickster talks another person into entering the
      death-container, and from `law_fated_luck_fulfills_prophecy`,
      where the king's opposition accelerates the luck-child's destiny.
      Here the rule belongs to the crossing itself: the tall lake
      carrier remains bound until he deposits one traveler midlake.
      KHM 165 needs this law because Hans's answer frees the carrier
      and later makes the greedy king the first replacement, causing
      his death and clearing Hans's marriage claim.
    tier: operational
    scope: world
    lens: structural
    domains: [ferry, lake, burden, replacement, crossing, punishment]
    related: [loc_lake, threshold_river, affect_greed, moral_retributive]
    examples: [the_griffin]

  law_craft_masterpiece_arbitrates_inheritance:
    name: Craft Masterpiece Arbitrates Inheritance
    description: |
      When an indivisible household inheritance cannot be fairly
      divided, heirs may be sent to learn trades, and the one who
      performs the most astonishing masterpiece receives the property
      by skill rather than birth order.
    rationale: |
      Distinct from `law_promise_binds_reality`, where a prior vow
      compels distribution, and from trickster inheritance tales where
      fools profit from novelty or fraud. This law makes craft
      excellence the fair judge: shaving a running hare, shoeing a
      galloping horse, and fencing off rain become comparable tests.
      KHM 124 needs the law for queries over apprenticeship, artisan
      mastery, nonviolent inheritance arbitration, and sibling harmony
      after competition.
    tier: operational
    scope: world
    lens: structural
    domains: [craft, inheritance, apprenticeship, siblings, mastery]
    related: [agency_domestic_labor, num_3, moral_faithful_service_rewarded]
    examples: [the_three_brothers]

  law_inverted_succession_rewards_extreme_idleness:
    name: Inverted Succession Rewards Extreme Idleness
    description: |
      Royal succession can be decided by a comic contest in which the
      heir who proves the most extreme refusal to act receives the
      kingdom.
    rationale: |
      Distinct from `law_craft_masterpiece_arbitrates_inheritance`,
      where skill fairly arbitrates property, and from
      `law_laughter_releases_reward`, where laughter completes a
      task. Here the inheritance rule itself is inverted: bodily
      self-preservation, ordinary prudence, and useful action all lose
      to the most absurd boast of idleness. KHM 151 needs this law
      because succession is awarded not by primogeniture, virtue, or
      craft, but by a negative capacity carried to the point of
      accepting death rather than raising a hand.
    tier: operational
    scope: world
    lens: structural
    domains: [succession, laziness, inheritance, contest, inversion]
    related: [agency_social_rank, speech_boast, affect_sloth, moral_comic_inversion, num_3]
    examples: [the_three_sluggards]

  law_coordinated_crafts_complete_rescue:
    name: Coordinated Crafts Complete Rescue
    description: |
      A rescue succeeds because several trained specialists each perform
      one indispensable craft-action in sequence: finding, stealing,
      shooting, repairing, or otherwise solving a stage that no single
      person could complete alone.
    rationale: |
      Distinct from `law_specialized_companions_solve_impossible_tasks`,
      where recruited companions have extreme bodily powers, and from
      `law_craft_masterpiece_arbitrates_inheritance`, where craft
      demonstrations decide property. Here craft is collective rescue
      machinery: astronomer, thief, huntsman, and tailor each supply a
      non-substitutable operation, and the final reward is divided
      because every craft has equal causal weight. KHM 129 needs this
      law for queries over cooperative apprenticeship tales and
      non-hierarchical specialist ensembles.
    tier: operational
    scope: world
    lens: structural
    domains: [craft, rescue, brothers, cooperation, apprenticeship]
    related: [law_craft_masterpiece_arbitrates_inheritance, law_specialized_companions_solve_impossible_tasks, agency_domestic_labor, num_4]
    examples: [the_four_skilful_brothers]

  law_kindness_to_hidden_donors_rewarded:
    name: Kindness to Hidden Donors Is Rewarded
    description: |
      Courteous, generous conduct toward disguised, humble, small, or
      liminal beings triggers material blessing, while selfish or
      contemptuous conduct toward the same beings triggers deforming
      punishment.
    rationale: |
      Distinct from `law_promise_binds_reality` (contract) and from
      `law_repentance_restores` (forgiveness after confession). This
      law is about conduct before the protagonist knows the stakes:
      sharing bread with little men, sweeping for them, greeting them
      politely. KHM 13 encodes the law in parallel episodes where two
      girls meet the same donors and receive opposite fates. It is a
      core Grimm operational rule for kindness-test tales.
    tier: operational
    scope: world
    lens: structural
    domains: [kindness, donor-test, hospitality, reward, punishment]
    related: [arc_supernatural_donor, moral_kindness_rewarded]
    examples: [three_little_men_stepdaughter, hut_forest_youngest_daughter]

  law_otherworld_coal_gift_tests_contentment:
    name: Otherworld Coal Gift Tests Contentment
    description: |
      A worthless-looking gift from little otherworldly people becomes
      treasure when accepted once after submitting to their frightening
      rite, but an attempted second harvest from greed reverts the
      treasure to coal and leaves a lasting bodily mark.
    rationale: |
      Distinct from `law_kindness_to_hidden_donors_rewarded`, where
      courtesy to humble testers sorts kind and unkind people, and from
      `law_insatiable_wishing_reverts_gifts`, where escalating wishes
      collapse a wish-economy. Here the gift is material ambiguity:
      coal becomes gold only under the right disposition and timing.
      KHM 182 needs the law because the tailor and goldsmith both pass
      the first rite, but only the goldsmith's greedy return turns both
      new and previous gold back into coal and fixes deformity on his
      body.
    tier: operational
    scope: world
    lens: material
    domains: [little-people, coal, gold, greed, contentment, bodily-mark]
    related: [being_dwarf, arc_supernatural_donor, affect_greed, moral_overreach_reversal]
    examples: [the_little_folks_presents]

  law_animal_hospitality_breaks_house_enchantment:
    name: Animal Hospitality Breaks House Enchantment
    description: |
      In an enchanted household, a guest who feeds, waters, and kindly
      touches resident animals before satisfying herself passes the
      hidden hospitality test; neglect keeps the enchantment intact
      and brings confinement or servitude.
    rationale: |
      Distinct from `law_kindness_to_hidden_donors_rewarded`, where
      the tested beings are usually small, humble, or disguised
      donors, and from `law_rescued_animals_repay_kindness`, where
      animals later return a practical favour. KHM 169 needs this law
      because the hen, cock, and cow are not incidental livestock:
      they are transformed attendants whose feeding releases the
      king's son and changes the forest hut back into a palace. The
      slot enables queries over tales where animal care is the exact
      disenchantment condition.
    tier: operational
    scope: world
    lens: structural
    domains: [animal-care, hospitality, enchantment, forest, household]
    related: [law_kindness_to_hidden_donors_rewarded, sp_hen, sp_rooster, sp_cattle, state_transformed, transform_animal_human, moral_kindness_rewarded]
    examples: [the_hut_in_the_forest]

  law_secret_night_labor_restores_honest_poverty:
    name: Secret Night Labor Restores Honest Poverty
    description: |
      Hidden otherworldly workers complete a poor but conscientious
      person's unfinished craft-labour overnight, converting scarce
      materials into saleable abundance until the household can repay
      the aid.
    rationale: |
      Distinct from `law_kindness_to_hidden_donors_rewarded`, where
      reward follows an explicit kindness test, and from
      `law_otherworld_labor_manifests_as_weather`, where work below
      changes the weather above. Here the supernatural labour is
      secret, nocturnal, and economic: the shoemaker cuts leather at
      night, the little men sew it into perfect shoes by morning, and
      repeated sales restore independence before gratitude ends the
      service. The law captures craft-help rather than donor judgment.
    tier: operational
    scope: world
    lens: structural
    domains: [labor, craft, night, poverty, elves]
    related: [being_dwarf, agency_domestic_labor, moral_restorative]
    examples: [elves_shoemaker_elves]

  law_otherworld_time_displaces_human_time:
    name: Otherworld Time Displaces Human Time
    description: |
      Time spent inside a hidden or otherworldly dwelling is not equal
      to time in the human household; a short visit within the magical
      space may return the visitor years later.
    rationale: |
      Distinct from `law_otherworld_labor_manifests_as_weather`, which
      links otherworld work to earthly weather, and from simple
      `threshold_doorway`, which marks crossing without temporal
      consequence. In KHM 39 the servant-girl thinks she has stayed
      three days in the hollow mountain, but seven years have passed
      at home and her masters have died. The law is therefore a
      temporal threshold-effect, not merely a strange location.
    tier: operational
    scope: world
    lens: structural
    domains: [time, otherworld, mountain, absence, return]
    related: [loc_mountain, threshold_doorway, num_3, num_7]
    examples: [elves_servant_girl]

  law_absurd_task_exposes_changeling:
    name: Absurd Task Exposes Changeling
    description: |
      A deliberately impossible miniature domestic task provokes the
      changeling into laughter or speech, revealing its otherworldly
      age and forcing the return of the stolen human child.
    rationale: |
      Distinct from `law_speech_taken_literally`, where mistaken
      semantics drive comic action, and from `law_devouring_can_be_
      reversed`, where a child is recovered from a body. The
      changeling episode depends on diagnostic absurdity: boiling
      water in egg-shells is so impossible that the substitute laughs
      and betrays its pre-human age. KHM 39 needs this law because the
      restoration is triggered by exposing the substitute, not by
      force, prayer, or bargain.
    tier: operational
    scope: world
    lens: structural
    domains: [changeling, domestic-task, laughter, exposure, restoration]
    related: [arc_changeling, agency_speech, moral_restorative]
    examples: [elves_changeling]

  law_otherworld_labor_manifests_as_weather:
    name: Otherworld Labor Manifests as Weather
    description: |
      Domestic labour performed in an otherworldly household can appear
      in the human world as atmospheric change; bed-shaking below
      produces snow above.
    rationale: |
      Distinct from `agency_domestic_labor`, which names work as a
      mode of power, and from `law_nature_mirrors_moral_excess`, where
      weather mirrors emotion or moral escalation. This law names a
      vertical cosmology of work: the hidden household is materially
      connected to the surface world, so correct service in Mother
      Holle's bedchamber becomes falling snow on earth. KHM 24 needs
      it because the supernatural donor is not only a judge of conduct
      but also a weather-making mistress of domestic order.
    tier: operational
    scope: world
    lens: structural
    domains: [weather, snow, domestic-labour, otherworld, verticality]
    related: [agency_domestic_labor, arc_supernatural_donor, threshold_well]
    examples: [frau_holle]

  law_forest_suspends_domestic_order:
    name: Forest Suspends Domestic Order
    description: |
      Crossing into the forest removes ordinary household protections
      and exposes children, brides, servants, or animals to predation,
      enchantment, hunger, disorientation, and other altered rules.
    rationale: |
      Distinct from `threshold_forest`, which names the crossing-point
      or boundary. This law names what happens after crossing: the
      forest is not neutral scenery but a jurisdiction where parental
      care can fail, trails vanish, witches lure, beasts hunt, and
      strange helpers appear. KHM 15 is paradigmatic: the household
      abandons children, breadcrumb navigation fails, and a witch's
      edible house replaces domestic shelter. This entry was already
      implied by forest-threshold related-links and deserves a full
      slot for cross-tale forest queries.
    tier: operational
    scope: world
    lens: structural
    domains: [forest, threshold, household, predation, disorientation]
    related: [threshold_forest, loc_forest, arc_abandoned_child, arc_predator]
    examples: [hansel_and_gretel, little_brother_and_little_sister]

  law_wish_speech_materializes_reality:
    name: Wish-Speech Materializes Reality
    description: |
      A spoken or internally formed wish directly creates, transforms,
      summons, restores, or reclassifies reality without requiring a
      separate magical object, donor task, or formula.
    rationale: |
      Distinct from `speech_wish`, which names the utterance type, and
      from `law_formula_commands_magic_objects`, where a set formula
      activates an external object. Here wish-speech itself is the
      world-law: palace, companion, animal punishment, ladder, game,
      witness speech, and bride restoration appear because the boy
      wishes them. KHM 76 needs this slot so wish-powered causality can
      be queried apart from ordinary commands or greed-driven wish
      overreach.
    tier: operational
    scope: world
    lens: structural
    domains: [wish, speech, creation, transformation, summoning]
    related: [speech_wish, agency_speech, transform_animal_human]
    examples: [the_pink]

  law_angry_wish_literalizes_birth:
    name: Angry Birth-Wish Literalizes Monstrous Form
    description: |
      A frustrated parent's wish for a child, even under an impossible
      or animal condition, is fulfilled literally in the child's body.
    rationale: |
      Distinct from broad `law_wish_speech_materializes_reality`,
      where wish-speech can create many kinds of outcomes, and from
      `law_birth_substitution_false_animal_accusation`, where animal
      birth is a lie used against the mother. This law concerns a real
      birth shaped by angry wording: the father asks for a child "even
      if it be a hedgehog," and the child arrives half hedgehog, half
      boy. The slot enables queries over malformed or animal-marked
      births caused by parental speech rather than by enchantment or
      slander.
    tier: operational
    scope: world
    lens: structural
    domains: [birth, wish, anger, animal-form, kinship]
    related: [law_wish_speech_materializes_reality, speech_wish, affect_anger, being_animal_human_hybrid]
    examples: [hans_hedgehog_form]

  law_unruled_wishes_waste_the_gift:
    name: Unruled Wishes Waste the Gift
    description: |
      A granted wish-power fulfills the speaker's actual utterances
      or formed wishes exactly, so impatience, anger, envy, or domestic
      resentment consume the gift before deliberate desire can use it.
    rationale: |
      Distinct from `law_insatiable_wishing_reverts_gifts`, where
      escalation after fulfilled wishes collapses the whole reward,
      and from `law_wish_speech_materializes_reality`, where wish-
      speech is a general creative power. KHM 87 needs this law because
      the rich man's punishment is not that he asks too high, but that
      he cannot govern speech long enough to ask wisely: a horse dies,
      a wife is stuck on a saddle, and the last wish must undo the
      second. The slot enables queries over wish tales where character
      disorder, not magical scarcity, wastes the boon.
    tier: operational
    scope: world
    lens: cognitive
    domains: [wish, anger, greed, speech, self-punishment]
    related: [speech_wish, affect_greed, affect_anger, law_wish_speech_materializes_reality]
    examples: [the_poor_man_and_the_rich_man]

  law_wishing_ring_obeys_but_exposes_broken_promise:
    name: Wishing Ring Obeys but Exposes Broken Promise
    description: |
      A ring transports or summons according to the wearer's wish, but
      when the wearer uses it against a promised restriction the wish
      works while simultaneously breaking the relationship it served.
    rationale: |
      Distinct from `law_wish_speech_materializes_reality`, where
      wish-speech broadly creates reality, and from `law_promise_binds_
      reality`, where a pledge itself enforces conduct. KHM 92 needs
      this law because the ring faithfully brings the king home and
      later brings wife and child to him, but the second use violates
      the queen's condition and triggers her theft of ring, child, and
      kingdom. The slot enables queries over obedient magic objects
      that become dangerous through promise-breach.
    tier: operational
    scope: world
    lens: material
    domains: [ring, wish, promise, transport, loss]
    related: [obj_wishing_ring, speech_wish, law_promise_binds_reality, state_bound_by_promise]
    examples: [the_king_of_the_golden_mountain]

  law_quarreling_giants_lose_magic_objects:
    name: Quarreling Giants Lose Magic Objects
    description: |
      Giants who cannot divide inherited magic objects invite a smaller
      clever passerby to arbitrate, and the arbitrator obtains the
      objects by testing them one by one.
    rationale: |
      Distinct from `law_blow_wage_reverses_greedy_employer`, where
      bodily strength reverses a labour bargain, and from ordinary
      theft by force. KHM 92 needs this law because the hero's second
      recovery depends on inheritance arbitration: the giants' dispute
      gives him access to cloak, sword, and boots, and testing their
      properties lets him vanish with all three. The slot supports ATU
      518-style queries over disputed magic objects lost to cunning.
    tier: operational
    scope: world
    lens: structural
    domains: [giants, inheritance, magic-objects, arbitration, trickster]
    related: [being_giant, agency_cunning, obj_invisibility_cloak, obj_decapitating_sword, obj_many_league_boots]
    examples: [the_king_of_the_golden_mountain]

  law_false_blood_evidence_convicts_innocent:
    name: False Blood Evidence Convicts the Innocent
    description: |
      Blood placed on garments, tools, or nearby matter can function as
      fabricated proof, making an innocent person socially legible as
      murderer, negligent parent, or source of loss.
    rationale: |
      Distinct from `law_dead_matter_reveals_murder`, where material
      evidence exposes the truth, and from `obj_blood_marked_test_token`,
      where blood records a real forbidden act. This law names the
      inverted forensic grammar: blood lies, authority believes it, and
      punishment follows until later testimony reverses the false case.
      KHM 76 needs the term because the queen's tower sentence is
      produced by staged chicken blood rather than by her conduct.
    tier: operational
    scope: world
    lens: material
    domains: [blood, false-evidence, accusation, judgment, kinship]
    related: [obj_false_blood_evidence, speech_lie, state_deceived, moral_retributive]
    examples: [the_pink]

  law_trophy_tokens_expose_false_rescuer:
    name: Trophy Tokens Expose the False Rescuer
    description: |
      A true rescuer keeps bodily trophies, named garments, or other
      private tokens from the rescue scene; when a false claimant later
      demands the reward, the missing trophies expose the lie.
    rationale: |
      Distinct from `law_true_fit_reveals_identity`, where the token
      identifies a hidden person by fit, and from
      `law_false_blood_evidence_convicts_innocent`, where fabricated
      evidence deceives authority. Here proof is withheld by the true
      rescuer until a false-hero claim appears. KHM 111 needs the law
      because the huntsman keeps giant tongues and the princess's
      named textile/shoe pieces; KHM 60's dragon tongues follow the
      same false-rescuer exposure grammar.
    tier: operational
    scope: world
    lens: material
    domains: [proof, false-hero, trophy, rescue, judgment]
    related: [arc_false_hero, obj_forensic_token, speech_testimony, moral_retributive]
    examples: [skilful_huntsman_giant_tongues, two_brothers_dragon_tongues]

  law_underworld_basket_descent_invites_companion_betrayal:
    name: Underworld Basket Descent Invites Companion Betrayal
    description: |
      When a hero depends on companions above ground to lower and
      raise a basket, rope, or similar vertical passage apparatus, the
      companions can convert rescue into betrayal by drawing up the
      rescued women first and then cutting, dropping, or withholding
      the return passage.
    rationale: |
      Distinct from `arc_false_hero`, which names the impostor role,
      and from `law_trophy_tokens_expose_false_rescuer`, which names a
      proof mechanism after the betrayal. This law names the spatial
      vulnerability itself: the true rescuer is separated from the
      surface by a controllable vertical threshold. KHM 91 and KHM 166
      need the slot for queries over descent tales where the rope or
      basket turns helper-cooperation into the false heroes' weapon.
    tier: operational
    scope: world
    lens: structural
    domains: [underworld, basket, rope, false-hero, rescue]
    related: [arc_false_hero, threshold_well, loc_cave, agency_cunning, moral_retributive]
    examples: [the_gnome, strong_hans]

  law_divine_feeding_sustains_innocent_confinement:
    name: Divine Feeding Sustains Innocent Confinement
    description: |
      A sacred helper keeps a wrongly confined innocent alive by
      bringing food across an otherwise sealed boundary until the
      appointed ordeal is complete.
    rationale: |
      Distinct from `moral_providential_election`, which explains a
      tale's vertical moral order, and from ordinary animal aid, where
      animals help by practical skill. This law names the operational
      miracle of survival under impossible deprivation: the tower is
      sealed from sun, moon, food, and drink, but dove-shaped angels
      carry nourishment twice a day. It enables queries over religious
      sustenance scenes rather than only over divine beings in general.
    tier: operational
    scope: world
    lens: structural
    domains: [divine, food, confinement, innocence, endurance]
    related: [being_divine, sp_bird, agency_endurance, loc_tower]
    examples: [the_pink]


# =============================================================================
# AGENCY_MODES — operational tier, scope: entity
# =============================================================================
# Why this category: in fairy tales the SOURCE OF POWER is rarely
# generic action — it is specifically named (cunning, virtue, speech,
# violence). Agency modes capture WHERE the protagonist's effectiveness
# comes from, which determines what works for whom in tale-grammar.

agency_modes:

  agency_speech:
    name: Speech
    description: |
      Power flows through saying — naming, commanding, bargaining,
      cursing, blessing, vowing. Words are generative, not descriptive.
    rationale: |
      Distinct from `speech_acts` (which are specific UTTERANCE TYPES);
      agency_speech is the META-power that says "this character's
      effectiveness derives from what they say, not what they do."
      Rumpelstiltskin's magic is naming; the princess's power is the
      promise. Capturing it as agency lets queries find "all
      speech-powered actors."
    tier: operational
    scope: entity
    lens: structural
    domains: [speech, language]
    related: [speech_promise, speech_command, speech_curse, law_promise_binds_reality]

  agency_animal_aid:
    name: Animal Aid
    description: |
      Power comes through animals who guide, retrieve, warn, advise,
      or give gifts.
    rationale: |
      Distinguishes the protagonist's POWER MODE from the helper's
      ARCHETYPE. Cinderella has `agency_animal_aid` (her power is via
      the doves); the doves have `arc_animal_helper` (their role is
      to help). One is hers, one is theirs.
    tier: operational
    scope: entity
    lens: structural
    domains: [animal, helper]
    related: [arc_animal_helper]

  agency_animal_language:
    name: Animal Language
    description: |
      Power comes from understanding non-human speech and turning
      animal reports, complaints, warnings, or promises into plot
      knowledge.
    rationale: |
      Distinct from `agency_animal_aid`, where animals perform tasks
      for a human, and from `agency_speech`, which concerns human
      performative utterance. Animal-language agency is cognitive:
      the human can hear what other people cannot. KHM 17 needs it
      because the servant proves innocence, rescues animals, and wins
      tasks only after the white snake grants interspecies
      comprehension.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [animal-language, hearing, knowledge, interspecies]
    related: [law_ingested_animal_grants_language, agency_animal_aid]
    examples: [white_snake_servant]

  agency_social_rank:
    name: Social Rank
    description: |
      Power flows from royal, parental, marital, or household authority.
    rationale: |
      Names the power of POSITION rather than person. A king's command
      works because he is king, not because of cunning or virtue. This
      lets us distinguish tales where authority is the engine (Frog
      King's father enforcing the oath) from tales where the
      protagonist must overcome authority (Hansel & Gretel's father
      yields to stepmother's authority).
    tier: operational
    scope: entity
    lens: structural
    domains: [authority, kinship]
    related: [arc_oath_enforcer, speech_command]

  agency_violence:
    name: Violence
    description: |
      Power through bodily force — striking, throwing, killing, cutting.
      May be liberating (princess throws frog → curse breaks) or
      destructive (witch eats children).
    rationale: |
      Violence in Grimm is morally ambivalent — it can release curses
      (Frog King) or destroy innocents (Wolf and Seven Kids). Naming
      it as agency lets us track WHO uses it and HOW (liberating vs.
      destructive) without conflating with archetype.
    tier: operational
    scope: entity
    lens: structural
    domains: [violence, body]
    related: [transform_release_by_violence]

  agency_extraordinary_body:
    name: Extraordinary Body
    description: |
      Power flows from an exaggerated bodily capacity that exceeds
      ordinary human scale: impossible strength, sight, speed, breath,
      cold-making, appetite, hearing, or comparable physical extremity.
    rationale: |
      Distinct from `agency_violence`, which is direct force, and from
      `agency_object_mediation`, where an external tool carries power.
      In extraordinary-companion tales the body itself is the
      specialized instrument: the runner removes a leg to slow down,
      the shooter targets a fly's eye miles away, and the cap-wearer's
      body-weather relation freezes a heated room. This mode lets
      queries find supernormal embodied utility without requiring each
      ability to become a separate species.
    tier: operational
    scope: entity
    lens: structural
    domains: [body, ability, companion, impossible-task, extremity]
    related: [arc_extraordinary_companion, law_specialized_companions_solve_impossible_tasks]
    examples: [how_six_runner, how_six_blower, how_six_frost_man]

  agency_endurance:
    name: Endurance
    description: |
      Power through surviving — waiting, bearing, persisting under
      deprivation, exile, humiliation, or repeated trials.
    rationale: |
      The opposite of `agency_violence` and `agency_speech` — power
      through NOT-acting, through holding the position. Many heroines
      (Cinderella, Mother Holle's good daughter, Goose-Girl) have
      endurance as their mode. It is morally distinct from cunning or
      strength.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [time, patience]
    related: [arc_faithful_servant, affect_loyalty]

  agency_cunning:
    name: Cunning
    description: |
      Power through wit, deception, timing, and tactical reading of a
      situation. The trickster's mode.
    rationale: |
      Distinct from `agency_speech` (the medium of execution) —
      cunning is the META-STRATEGY of seeing-through and outmaneuvering.
      Gretel pushes the witch into the oven by reading the witch's
      assumptions; the cat in KHM 2 reads the mouse's trust and
      exploits it. Cunning can be exercised silently or via speech.
      Naming it as agency separates "what works" from "how it's done."
    tier: operational
    scope: entity
    lens: cognitive
    domains: [cunning, deception, tactical]
    related: [arc_trickster, speech_lie]

  agency_object_mediation:
    name: Object Mediation
    description: |
      Power exercised through a material carrier that preserves,
      redirects, proves, or executes agency: trail tokens, keys,
      body-remnants, garments, food, tools, or recognition objects.
    rationale: |
      Distinct from `agency_cunning`, which is the actor's tactical
      intelligence, and from `magic_objects`, which classifies the
      thing itself. Object mediation names the operational mode where
      plot agency is routed through matter. KHM 40 needs it twice:
      peas and lentils restore the path when ashes vanish, and the
      severed finger with ring proves the murder when speech alone
      might be dismissed as a dream.
    tier: operational
    scope: entity
    lens: material
    domains: [object, evidence, path, material-agency]
    related: [obj_forensic_token, law_dead_matter_reveals_murder, agency_cunning]
    examples: [obj_robber_bridegroom_pea_lentil_trail, obj_robber_bridegroom_finger_ring]

  agency_music:
    name: Music (Fiddle, Pipe, Song)
    description: |
      Power through musical performance — fiddling, piping, singing —
      that attracts, charms, compels listeners (animal, human, or
      otherworldly) to follow, dance, or yield.
    rationale: |
      Distinct from `agency_speech` (semantic content) and
      `agency_cunning` (tactical wit). Music is a NON-SEMANTIC affective
      compulsion: a fiddle pulls a wolf out of a thicket; a pipe
      compels a king's army to dance. Worth its own slot because the
      power-source is sound-as-such, not the words sung. Recurs in
      KHM 8 (Strange Musician), KHM 110 (Jew Among Thorns), KHM 56
      (Sweetheart Roland singing-tree).
    tier: operational
    scope: entity
    lens: structural
    domains: [music, compulsion, sound, art]
    related: [law_music_attracts]

  agency_domestic_labor:
    name: Domestic Labor
    description: |
      Power, obligation, or social value produced through household
      work: spinning, sweeping, cooking, washing, sewing, cleaning,
      and other repeated tasks by which domestic order is maintained.
    rationale: |
      Distinct from `agency_endurance` (surviving hardship) and
      `agency_cunning` (strategic evasion). Domestic labour can itself
      be a demanded power-source: queens test girls by spinning flax,
      stepmothers impose impossible housework, helpers transform labour
      into reward. KHM 14 makes spinning the entire marriage condition,
      while later Cinderella/Mother Holle tales turn household labour
      into moral testing. Naming it enables cross-tale labour queries.
    tier: operational
    scope: entity
    lens: structural
    domains: [labour, domestic, household, spinning]
    related: [arc_oppressed_maiden, arc_grotesque_task_helper]


# =============================================================================
# EXISTENTIAL_STATES — operational tier, scope: entity
# =============================================================================
# Why this category: states are not properties (like archetype) but
# ALTERED MODES OF BEING that change what a character is allowed to do,
# know, be, or receive in the tale-world. A `state_cursed` character is
# ontologically different from a healthy one — the world treats them
# differently.

existential_states:

  state_cursed:
    name: Cursed
    description: |
      A being bound by hostile or transformative magic, with a defined
      release condition.
    rationale: |
      Different from `transform_curse` (the mode of transformation)
      and from `affect_*` (which is felt emotion). State_cursed is the
      ontological STATUS — what the being IS right now. Many tales
      need to query "characters currently cursed" without caring how
      they got there.
    tier: operational
    scope: entity
    lens: structural
    domains: [curse, transformation]
    related: [law_curse_requires_counter_condition, transform_curse, transform_release_by_violence]

  state_transformed:
    name: Transformed
    description: |
      A being whose body, form, species, or material status has changed
      from one mode of being to another.
    rationale: |
      Distinct from `state_cursed` because not every transformation is
      hostile (a prince can be transformed by virtue, by reward, by
      his own act). The state names the FACT of altered form
      regardless of cause.
    tier: operational
    scope: entity
    lens: structural
    domains: [transformation]
    related: [transformation_modes, state_cursed]

  state_hidden_identity:
    name: Hidden Identity
    description: |
      True identity exists but is concealed — by curse, disguise, vow
      of silence, or social non-recognition.
    rationale: |
      Crucially different from `state_cursed`: a hidden identity may
      not be cursed (Cinderella is concealed by ash-soot social
      lowering, no curse). And a curse may not hide identity (Snow
      White's death is not concealment). The two states co-occur in
      enchanted-prince tales but are separable in others.
    tier: operational
    scope: entity
    lens: structural
    domains: [identity, disguise]
    related: [state_cursed, arc_enchanted_prince]

  state_imprisoned:
    name: Imprisoned
    description: |
      A character is confined by social or judicial authority inside a
      built enclosure such as tower, dungeon, locked room, or walled
      cell, with movement controlled by others.
    rationale: |
      Distinct from `state_trapped`, which names mechanical capture
      by snares, wedges, or bonds, and from `arc_imprisoned_maiden`,
      which is a role-pattern for secluded maidens. Imprisonment is a
      broader status: queens, servants, villains, and innocents can all
      be held by command and architecture. KHM 76 needs it for both the
      falsely accused queen in the tower and the punished cook in the
      dungeon.
    tier: operational
    scope: entity
    lens: structural
    domains: [confinement, punishment, authority, architecture]
    related: [loc_tower, loc_dungeon, agency_social_rank, state_trapped]
    examples: [pink_queen, pink_old_cook]

  state_liminal_dead:
    name: Liminal Dead / Returning Dead
    description: |
      A murdered or dead character is not fully absent: they return
      silently or intermittently, often at night, to nurse, protect,
      ask after kin, reveal wrong, or await recognition before full
      life is restored or the haunting ends.
    rationale: |
      Distinct from `being_spirit` (a type of being) and from ordinary
      death, which removes a character from action. The liminal dead
      remain relationally active: KHM 11's suffocated queen returns to
      nurse her child and stroke the roebuck, then receives life again
      when recognised. This state enables queries for murdered mothers,
      revenant spouses, and truth-bearing night visitants without
      classifying them as generic ghosts.
    tier: operational
    scope: entity
    lens: structural
    domains: [death, return, motherhood, recognition]
    related: [being_spirit, state_hidden_identity, affect_maternal_love]
    examples: [little_brother_true_queen]

  state_enchanted_sleep:
    name: Enchanted Sleep
    description: |
      Magical suspension in which a person, household, court, or whole
      castle remains alive but inactive, sealed from ordinary time until
      a fated duration or release encounter is complete.
    rationale: |
      Distinct from `state_liminal_dead`, where death or murder creates
      return, and from ordinary sleep, which has no world-ordering
      force. Enchanted sleep freezes social action without killing it:
      fire, animals, servants, rulers, and princess all pause together
      and resume from the same gesture. KHM 50 needs this state because
      Briar Rose's curse is precisely death commuted into time-bound
      suspended life.
    tier: operational
    scope: entity
    lens: structural
    domains: [sleep, curse, suspended-life, time, castle]
    related: [law_softened_death_becomes_timed_sleep, law_fated_time_opens_thorn_threshold, state_cursed]
    examples: [briar_rose, briar_rose_sleeping_court]

  state_bound_by_promise:
    name: Bound by Promise
    description: |
      A character's future actions are constrained by a vow, bargain,
      or pledged exchange.
    rationale: |
      The ENTITY-level dual of `law_promise_binds_reality` (the
      world-level rule). The law explains why promises bind; the state
      attaches to a SPECIFIC character at a SPECIFIC moment. Together
      they let us track who is currently oath-bound across a tale's
      timeline.
    tier: operational
    scope: entity
    lens: structural
    domains: [oath, promise]
    related: [law_promise_binds_reality, speech_promise]

  state_infernal_unclean:
    name: Infernal Unclean
    description: |
      A human body is visibly marked by devilish contract conditions:
      unwashed skin, uncut hair and nails, uncombed beard, or comparable
      pollution that makes others read the person as monstrous or
      socially untouchable.
    rationale: |
      Distinct from `state_disguised`, where surface alteration is
      chosen to hide identity, and from `state_transformed`, where the
      body changes species or ontology. Infernal uncleanliness is a
      contract-state: the body remains human, but dirt, hair, claws,
      and prayer-abstinence make a devil pact visible. KHM 100 and
      KHM 101 both need a reusable state for protagonists whose reward
      depends on remaining repulsive until a fixed term ends.
    tier: operational
    scope: entity
    lens: material
    domains: [devil, uncleanliness, body, appearance, pact]
    related: [being_devil, law_devil_pact_unclean_endurance_wins_freedom, law_infernal_service_refuse_becomes_gold]
    examples: [sooty_brother_hans, bearskin_soldier]

  state_forgotten_bride:
    name: Forgotten Bride / Forgotten Betrothed
    description: |
      A rightful beloved or pledged bride remains faithful while the
      bridegroom forgets her under enchantment, social pressure, or
      another woman's influence and approaches a false wedding.
    rationale: |
      Distinct from `state_hidden_identity`, where others cannot see
      who someone is, and from `arc_false_bride`, which names the
      replacement figure. The forgotten bride is remembered by herself
      but lost from the bridegroom's mind; the plot turns on restoring
      memory rather than exposing a disguise or fitting a token. KHM 56
      needs it because Roland's true bride waits, keeps fidelity, and
      is restored only when her voice reaches him.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [bride, memory, fidelity, abandonment, recognition]
    related: [law_voice_recognizes_forgotten_bride, affect_loyalty, arc_false_bride]
    examples: [sweetheart_roland_maiden]

  state_deceived:
    name: Deceived
    description: |
      A character is operating on false beliefs implanted by another's
      deception. Until the deception is exposed (or the character is
      destroyed), all their decisions are made against a false world.
    rationale: |
      Distinct from `state_hidden_identity` (where a true identity
      hides from view of OTHERS) — state_deceived is when the
      character's OWN INNER WORLD is false. Critical for naive-victim
      tales: the mouse believes the cat goes to christenings, makes
      every decision on that basis. The state names her epistemic
      condition, which structurally precedes her destruction.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [deception, naivety]
    related: [arc_naive_victim, speech_lie, arc_trickster]

  state_self_unrecognized:
    name: Self-Unrecognized
    description: |
      A character cannot confirm their own identity and must seek
      external social confirmation. The crisis is internal doubt about
      "am I myself?" rather than ordinary disguise from others.
    rationale: |
      Distinct from `state_hidden_identity`, where others fail to know
      who someone is, and from `state_deceived`, where false belief is
      implanted about the world. Self-unrecognition is reflexive: in
      KHM 34 Elsie wakes under a net of bells, doubts whether she is
      Clever Elsie, asks Hans whether Elsie is inside, and accepts his
      answer as proof that she is not herself.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [identity, self-doubt, deception, recognition]
    related: [state_hidden_identity, state_disguised, law_disguise_alters_social_reality]
    examples: [clever_elsie]

  state_trapped:
    name: Trapped
    description: |
      A character is physically immobilised by a mechanical constraint:
      paws wedged in a cleft, limbs tied to springing branches, neck
      fastened by a tightening cord, or analogous non-magical capture.
    rationale: |
      Distinct from `state_bound_by_promise` (social/performative
      constraint), `state_devoured_but_alive` (captivity inside a
      predator's body), and `state_petrified` (ontological immobility).
      `state_trapped` names mundane but plot-active immobilisation.
      KHM 8 needs this because each animal listener is neutralised by
      a different trap after music draws it near; later tales use cages,
      locked rooms, pits, and snares in comparable ways. The state lets
      queries ask who is capturable by tools rather than by magic.
    tier: operational
    scope: entity
    lens: structural
    domains: [captivity, body, tool, immobilisation]
    related: [agency_cunning, agency_violence]
    examples: [strange_musician_wolf, strange_musician_fox, strange_musician_hare]

  state_mute:
    name: Mute
    description: |
      A character is unable to speak — typically by punishment, curse,
      or sacred vow. The muteness is structurally important: it
      prevents the character from defending themselves, confessing
      truth, or revealing their identity.
    rationale: |
      Distinct from `state_cursed` (which can include but is not
      limited to muteness) — state_mute names the SPECIFIC loss of
      voice as a folktale-grammar element. Many tales' tension hinges
      precisely on the inability to speak (KHM 3 queen cannot
      confess; KHM 49 Six Swans heroine cannot defend herself
      against accusation). The structural payoff is in the FINAL
      restoration of speech, which marks the resolution.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [silence, speech-loss]
    related: [arc_silent_bride, transform_loss_of_voice, transform_restoration_by_confession]

  state_fearless:
    name: Fearless
    description: |
      Constitutive incapacity to feel fear. Not bravery (which presumes
      fear overcome) but the ABSENCE of the fear-affect entirely.
      Renders the bearer immune to supernatural threats that operate
      via terror.
    rationale: |
      Distinct from `affect_courage` (which is bravery DESPITE fear) —
      state_fearless is fear's absence, not its overcoming. The youth
      in KHM 4 is not brave; he simply cannot register what others
      feel. Without naming the state separately, his strange immunity
      is unexplained: with it, the tale becomes legible as "the
      fearless cannot be bound by fear-magic." Recurs in the
      "stupid Hans defeats the ogre" pattern of jocular tales.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [fearlessness, immunity, anti-affect]
    related: [arc_fearless_fool, affect_fear, law_fearlessness_defeats_supernatural]
    examples: [youth_who_went_forth_to_learn_fear]

  state_blind:
    name: Blind
    description: |
      Loss of sight as wound, punishment, curse-effect, or ordeal. The
      character remains alive and mobile but cannot visually recognise
      persons, paths, or truth until healing or recognition occurs.
    rationale: |
      Distinct from `state_mute` (loss of speech) and `state_hidden_identity`
      (identity concealed from others). Blindness removes perception
      rather than voice or status. Rapunzel's prince survives the
      tower fall but wanders blind for years until tears restore his
      sight; later tales use blindness as kinship-test and bodily
      consequence. The state lets queries find perception-loss arcs.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [sight, wound, perception, restoration]
    related: [affect_grief, agency_endurance]
    examples: [rapunzel_prince]

  state_maimed:
    name: Maimed
    description: |
      Body permanently or semi-permanently deprived of a limb, hand,
      tongue, eye, or other member, changing what the character can do
      and how others recognise or care for them.
    rationale: |
      Distinct from `state_blind`, which isolates sight-loss, and from
      `state_liminal_dead`, where death or murder creates return.
      Maiming is bodily lack while alive: the girl without hands cannot
      pluck fruit by hand, receives silver hands, carries a child
      through exile, and is finally restored. A general state supports
      later tales of severed hands, tongues, eyes, and other bodily
      tokens without creating a separate state for each wound.
    tier: operational
    scope: entity
    lens: material
    domains: [body, wound, hand, mutilation, restoration]
    related: [agency_endurance, obj_prosthetic_hands]
    examples: [girl_without_hands_queen]

  state_disguised:
    name: Disguised
    description: |
      A being's body, voice, or appearance has been altered to
      conceal their true identity. Distinct from `state_hidden_identity`
      in that disguise is a BODY-SURFACE modification — wolf whitens
      his paws, lowers his voice; a witch dresses as old peddler.
      The true being is fully present underneath; only the surface
      lies.
    rationale: |
      Distinct from `state_hidden_identity` (which is identity-
      concealment with no necessary body modification) and from
      `state_transformed` (which is actual body-change). Disguise
      is a third category: surface-level, reversible, intentional
      deception. Worth its own slot because so many predator tales
      hinge on disguise (Wolf as grandmother, Wolf as mother goat,
      Witch as peddler). Each tale should name the mode of
      concealment precisely.
    tier: operational
    scope: entity
    lens: structural
    domains: [disguise, deception, body-surface]
    related: [arc_disguised_villain, speech_lie, agency_cunning]
    examples: [wolf_as_mother_goat, wolf_as_grandmother]

  state_devoured_but_alive:
    name: Devoured but Alive
    description: |
      A being has been swallowed but remains alive inside the
      devourer. Awaits rescue. The state is bounded — devouring
      can be reversed by surgical retrieval; the being inside
      is intact, breathing, often able to speak.
    rationale: |
      The entity-level dual of `law_devouring_can_be_reversed`.
      Worth its own state because tales structurally distinguish
      "eaten dead" (mouse in KHM 2) from "swallowed whole alive"
      (kids in KHM 5, Red Cap and grandmother in KHM 26). Without
      this state we conflate two ontologically different
      consumption-outcomes. The state lets us track who is
      RESCUABLE from a belly.
    tier: operational
    scope: entity
    lens: structural
    domains: [devouring, body, captivity]
    related: [law_devouring_can_be_reversed, arc_protective_mother]
    examples: [seven_kids_in_wolf_belly, little_red_cap_in_wolf]

  state_petrified:
    name: Petrified
    description: |
      Turned to stone — body immobile, but in some cases still
      sentient and able to speak (the petrified stone of Faithful
      John speaks from its bedroom corner). Awaits revival via
      blood-magic or analogous counter-condition.
    rationale: |
      Distinct from `state_cursed` (which can include but is broader
      than petrification) and from generic death — the petrified is
      neither dead nor alive in the ordinary sense. Has its own
      release-mechanism (`law_blood_restores_petrified`). Worth its
      own slot because petrification recurs as a distinctive form of
      paying-the-cost (KHM 6 John; later tales of stone-witnesses;
      etc.) and carries specific tale-grammar.
    tier: operational
    scope: entity
    lens: structural
    domains: [stone, petrification, suspended-life]
    related: [transform_petrification, law_blood_restores_petrified, law_prophecy_compels_sacrifice]
    examples: [faithful_john_petrified]


# =============================================================================
# THRESHOLD_TYPES — operational tier, scope: world
# =============================================================================
# Why this category: in folktales certain places and objects don't just
# exist (`location`) — they MARK CROSSINGS BETWEEN ORDERS OF REALITY.
# The forest isn't just woodland; it's where domestic rules suspend.
# Naming threshold-function separately from location-substance lets us
# query "all crossings into the magical" without listing locations.

threshold_types:

  threshold_forest:
    name: Forest Threshold
    description: |
      Boundary between household/civic order and wild, magical,
      predatory, or testing space. Crossing changes the rules of
      conduct.
    rationale: |
      The forest in Hansel & Gretel and Little Red Cap is not just
      scenery; it is the SPACE WHERE THE TALE'S LAWS CHANGE. Modelling
      this as a threshold lets us connect `loc_forest` to
      `law_forest_suspends_domestic_order` and to all the predator
      archetypes that live there.
    tier: operational
    scope: world
    lens: structural
    domains: [forest, wilderness]
    related: [loc_forest, law_forest_suspends_domestic_order]

  threshold_enchantment_circle:
    name: Enchantment Circle
    description: |
      Measured magical perimeter around a place or being. Crossing it
      triggers an automatic spell such as immobilisation,
      transformation, or exclusion.
    rationale: |
      Distinct from `threshold_forest`, which marks entry into wild
      space as a whole, and from `threshold_doorway`, which marks a
      building crossing. KHM 69's circle is defined by distance from
      the witch's castle: within one hundred paces, ordinary movement
      fails and maidens become birds. Naming this threshold separates
      measurable perimeter-magic from broader landscape liminality.
    tier: operational
    scope: world
    lens: structural
    domains: [circle, boundary, measurement, witchcraft, immobilization]
    related: [law_enchanted_perimeter_immobilizes_intruders, num_100, loc_castle]
    examples: [loc_jorinda_joringel_hundred_pace_circle]

  threshold_well:
    name: Well Threshold
    description: |
      Vertical passage into hidden depth — water, otherworld, magical
      aid, or transformation. Often the site of a bargain with a
      non-human helper.
    rationale: |
      Wells in Grimm are not pumping stations — they are passages
      between this-world and other-world (Frog King, Mother Holle).
      Naming the threshold-function tells us that bargaining or
      falling-in at a well triggers ontological change.
    tier: operational
    scope: world
    lens: structural
    domains: [water, depth, bargain]
    related: [loc_well, agency_animal_aid]
    examples: [the_frog_king_well]

  threshold_river:
    name: River-Crossing Threshold
    description: |
      Horizontal water boundary that must be crossed by bridge, boat,
      wading, or other passage, often turning travel into danger,
      disposal, testing, or irreversible separation.
    rationale: |
      Distinct from `threshold_well`, which is vertical descent into
      depth, and from `loc_river`, which names the place-type. The
      river threshold marks the crossing problem itself: whether a
      traveller can pass, misunderstands how to pass, or is carried
      away. KHM 119 needs this threshold because the Moselle does not
      merely serve as scenery; misheard crossing advice becomes the
      death mechanism for the Swabian allies.
    tier: operational
    scope: world
    lens: structural
    domains: [water, river, crossing, danger, travel]
    related: [loc_river, law_fearful_misrecognition_turns_signs_deadly, affect_fear]
    examples: [loc_seven_swabians_moselle]

  threshold_doorway:
    name: Doorway Threshold
    description: |
      Boundary between domestic interior and external order. A cursed
      or non-human being crossing breaks the ordinary regime of the
      household.
    rationale: |
      Captures the structurally important moment in Frog King when the
      frog crosses the dining-hall door — the promise made at the
      well now MUST be honoured here. Distinguishes ordinary doors
      (which are just `location` features) from RITUAL doors that
      carry a tale's promise-binding into the domestic.
    tier: operational
    scope: world
    lens: structural
    domains: [domestic, crossing]
    related: [law_promise_binds_reality]

  threshold_forbidden_door:
    name: Forbidden-Door Threshold
    description: |
      A specific door bearing an explicit prohibition against
      opening. Crossing it is by definition transgression. The
      Bluebeard door, Mary's 13th door of heaven, the Fitcher's Bird
      blood-room door.
    rationale: |
      Distinct from `threshold_doorway` (which is a general
      domestic/ordering crossing). The forbidden-door threshold
      carries `law_prohibition_invites_violation` and pre-marks
      whatever lies beyond as transgressive knowledge. Worth its
      own slot because the same threshold-grammar recurs across
      multiple tales — and because the act of crossing is itself
      the structural pivot of the tale.
    tier: operational
    scope: world
    lens: structural
    domains: [prohibition, transgression, doorway]
    related: [law_prohibition_invites_violation, obj_forbidden_key, speech_prohibition]
    examples: [our_ladys_child_thirteenth_door, fitchers_bird_blood_room]

  threshold_gate:
    name: Gate Threshold
    description: |
      Boundary between road/countryside and civic authority: the place
      where travellers enter town, guards watch, dogs gather, and
      information or bargains can be intercepted before the court is
      reached.
    rationale: |
      Distinct from `threshold_doorway` (domestic or chamber boundary)
      and from `threshold_forest` (wild/magical boundary). The gate is
      a public civic threshold: it mediates market, road, and royal
      access. KHM 7 uses the gate twice as a schwank hinge: first the
      peasant entrusts meat to dogs there, then a sentinel speculates
      on his promised reward there. This deserves its own slot because
      it enables queries for tales where justice, rumor, or commerce is
      redirected at the edge of town/court.
    tier: operational
    scope: world
    lens: structural
    domains: [civic, public, threshold, commerce, schwank]
    related: [loc_gate, loc_castle, agency_social_rank]
    examples: [loc_town_gate_good_bargain]

  threshold_grave:
    name: Grave Threshold
    description: |
      Boundary between the social world of the living and the enclosed
      domain of burial: grave, tomb, vault, or crypt. Crossing it while
      alive makes death a spatial condition before it becomes bodily
      final.
    rationale: |
      Distinct from `loc_tomb`, which names the material place. The
      threshold marks the crossing event and its rule-change: sentries,
      bolts, coffins, provisions, and burial vows place a living person
      inside death's jurisdiction. KHM 16 requires this because the
      husband's oath is enforced not abstractly but by entry into the
      royal vault with his wife's corpse.
    tier: operational
    scope: world
    lens: structural
    domains: [threshold, death, burial, oath, enclosure]
    related: [loc_tomb, state_bound_by_promise, law_promise_binds_reality]
    examples: [loc_royal_vault_three_snake_leaves]

  threshold_thorn_hedge:
    name: Thorn-Hedge Threshold
    description: |
      Vegetative barrier around a sleeping or enchanted place, lethal
      while the appointed time is incomplete and passable when the
      release term arrives.
    rationale: |
      Distinct from `threshold_forest`, which marks entry into wild
      space, and from `threshold_gate`, which is civic access. The
      thorn-hedge is a living temporal lock: it kills premature kings'
      sons but becomes flowers for the destined arrival. KHM 50 needs
      this threshold because the castle is not hidden by distance or
      architecture, but sealed by time-growing plants.
    tier: operational
    scope: world
    lens: material
    domains: [thorn, hedge, plants, threshold, time]
    related: [law_fated_time_opens_thorn_threshold, loc_castle, state_enchanted_sleep]
    examples: [briar_rose_thorn_hedge]


# =============================================================================
# TRANSFORMATION_MODES — operational tier, scope: entity
# =============================================================================
# Why this category: HOW transformation happens matters as much as that
# it happens. A reward-transformation (humble peasant → prince) means
# something different from a punishment-transformation (haughty brother
# → stone) even if the end-state is similar.

transformation_modes:

  transform_animal_human:
    name: Animal-Human Transformation
    description: |
      A being crosses between animal and human form.
    rationale: |
      Animal↔human transformation is so central to a wide tale-cluster
      (ATU 425 series, ATU 440, ATU 451) that it earns its own mode
      regardless of cause (curse vs. reward vs. disguise).
    tier: operational
    scope: entity
    lens: structural
    domains: [transformation, body]
    related: [arc_enchanted_prince, state_cursed]

  transform_plant_human:
    name: Plant-Human Transformation
    description: |
      A human, animal, or household retainer is changed into a tree,
      plant, or other rooted vegetal form and later restored to living
      bodily agency.
    rationale: |
      Distinct from `transform_animal_human`, where mobility and
      species-instinct remain active in animal form. Plant-human
      transformation immobilizes the person as landscape: the prince
      can embrace only when the tree softens, while servants and horses
      stand as trees until the ring releases them. KHM 123 needs this
      transformation mode so tree-enchantments are not flattened into
      generic animal metamorphosis or mere location.
    tier: operational
    scope: entity
    lens: material
    domains: [tree, plant, transformation, immobilization, enchantment]
    related: [state_transformed, loc_tree, law_plain_ring_breaks_tree_dove_enchantment]
    examples: [old_woman_wood_prince_tree, old_woman_wood_servants_trees]

  transform_curse:
    name: Curse Transformation
    description: |
      Change imposed by hostile or wounded supernatural speech.
    rationale: |
      Names the CAUSE of transformation, complementing
      `transform_animal_human` (which names the FORM). A curse may
      transform a person into a stone, a bird, or an animal — the
      curse-mode is the same; the animal-mode is one specialisation.
    tier: operational
    scope: entity
    lens: structural
    domains: [curse, transformation]
    related: [state_cursed, speech_curse, law_curse_requires_counter_condition]

  transform_punitive_objectification:
    name: Punitive Objectification
    description: |
      A person is transformed into an inert usable object or substance
      as punishment, disposal, or magical exploitation.
    rationale: |
      Distinct from `transform_petrification`, where stone-suspension
      preserves a person for possible restoration, and from
      `transform_curse`, which names a curse-speech cause. Punitive
      objectification emphasizes the endpoint and use-value: a girl
      becomes a block of wood so the witch can burn and warm herself.
      The mode supports queries for tales where transformation is not
      release, disguise, or enchantment, but reduction of a person to
      material.
    tier: operational
    scope: entity
    lens: structural
    domains: [transformation, punishment, object, body, consumption]
    related: [state_transformed, being_witch, agency_violence]
    examples: [frau_trude_girl]

  transform_release_by_violence:
    name: Release by Violence
    description: |
      Paradoxical mode where a violent act (throwing, striking,
      beheading) breaks rather than worsens a curse. The aggressor
      typically intends harm, not liberation.
    rationale: |
      Not just an instance of `transform_curse` reversed — this is a
      DISTINCT mechanism that requires its own slot because it inverts
      moral causality (intended-harm produces liberation). Frog King
      is the paradigm; The Raven and Iron John have analogous beats.
      A unified vocabulary lets comparative-folkloristics studies
      query for it cross-corpus.
    tier: operational
    scope: entity
    lens: structural
    domains: [curse, violence, release]
    related: [transform_curse, agency_violence, law_curse_requires_counter_condition]
    examples: [the_frog_king_frog_form]

  transform_loss_of_voice:
    name: Loss of Voice
    description: |
      Speech faculty taken away as punishment or trial. The being is
      otherwise intact (body, mind, identity) but cannot speak. Often
      the structural setup for a long silent endurance arc.
    rationale: |
      Distinct from `transform_curse` (which usually changes form) —
      this transformation removes a single faculty, leaving the
      being recognisably themselves but disabled. It is the specific
      mechanism that produces `state_mute`. Naming the mode as
      distinct lets us track tales structured around silent-endurance
      (Mary's child queen, Six Swans heroine) separately from
      tales structured around body-change.
    tier: operational
    scope: entity
    lens: structural
    domains: [silence, punishment, faculty-loss]
    related: [state_mute, transform_restoration_by_confession]

  transform_restoration_by_confession:
    name: Restoration by Confession
    description: |
      The transformative undoing achieved through sincere verbal
      acknowledgement of fault. The voice returns, the curse lifts,
      the lost is recovered — but only when the speech-act of
      confession is genuine.
    rationale: |
      The sacred-register counterpart to `transform_release_by_violence`.
      Where Frog King breaks his curse through someone else's violent
      act, Mary's child breaks hers through her own confession. The
      two modes encode opposite moral universes (release-against-will
      vs. release-through-will), and both deserve naming. Without it
      we cannot capture how religious-legend tales resolve.
    tier: operational
    scope: entity
    lens: structural
    domains: [confession, release, religious]
    related: [speech_confession, moral_repentance, law_repentance_restores]
    examples: [our_ladys_child_queen]

  transform_reassembly:
    name: Reassembly
    description: |
      A being whose dismembered parts come together to form a unified
      whole, either as supernatural horror or as restoration after
      mutilation.
    rationale: |
      Distinct from `transform_animal_human` (which crosses species)
      and from `transform_curse` (which imposes form). Reassembly is
      the inverse of dismemberment: bodies coming-together rather than
      apart. KHM 4 uses it as horror when a half-man joins himself;
      KHM 46 uses it restoratively when the clever sister orders the
      murdered sisters' limbs and they return to life. A single mode
      lets queries find dismembered-body reconstitution without
      assuming whether the result is threat or rescue.
    tier: operational
    scope: entity
    lens: structural
    domains: [body, supernatural, horror, restoration]
    related: [being_spirit, state_liminal_dead, moral_restorative]
    examples: [haunted_castle_half_man, fitchers_bird_sisters]

  transform_decapitation_restoration:
    name: Decapitation and Restoration
    description: |
      A head is cut off and either reattached so life continues, or
      withheld so death and succession follow from the failed
      restoration.
    rationale: |
      Distinct from `transform_reassembly`, which concerns scattered
      bodies becoming whole, and from `transform_release_by_violence`,
      where violence breaks a curse. Decapitation-restoration is a
      controlled bodily operation that can be performed, demonstrated,
      or strategically withheld. KHM 126 needs it because the queen's
      head-cutting magic first proves reversible on Ferdinand, then
      becomes lethal when she refuses to restore the noseless king.
    tier: operational
    scope: entity
    lens: material
    domains: [body, head, restoration, violence, succession]
    related: [agency_violence, moral_retributive, moral_restorative]
    examples: [ferdinand_faithful_head_trial, ferdinand_faithful_king_beheading]

  transform_revenant_bird:
    name: Revenant Bird Transformation
    description: |
      A murdered or death-marked human returns as a singing bird whose
      flight, song, and gifts expose the crime and prepare restoration
      or vengeance.
    rationale: |
      Distinct from `transform_animal_human`, which names ordinary
      animal-human form exchange, and from `state_liminal_dead`, which
      names the dead-but-active condition. Revenant bird transformation
      is a specific posthumous vehicle: the victim's remains become
      avian song, mobility, and agency. KHM 47 needs it because the
      boy's bones under the juniper tree become a beautiful bird that
      sings the murder, gathers gifts, kills the murderer, and returns
      as the little brother.
    tier: operational
    scope: entity
    lens: structural
    domains: [bird, death, transformation, testimony, restoration]
    related: [state_liminal_dead, sp_bird, agency_music, law_dead_matter_reveals_murder]
    examples: [juniper_tree_bird]

  transform_fugitive_pair:
    name: Fugitive Pair Transformation
    description: |
      Coordinated shape-changing in which two fugitives become a linked
      pair of forms — plant and flower, church and chandelier, pond and
      duck — so pursuers misrecognise or fail to retrieve them.
    rationale: |
      Distinct from `transform_animal_human`, which names animal-human
      crossings, and from `state_disguised`, which is surface disguise
      without ontological change. Fugitive-pair transformation is
      relational: each new body is chosen with the other, and pursuit
      fails because the pair hides as a meaningful composite. KHM 51
      needs this mode because the escape sequence is not a curse or a
      single disguise, but three adaptive paired metamorphoses.
    tier: operational
    scope: entity
    lens: structural
    domains: [transformation, flight, pair, disguise, pursuit]
    related: [law_loyal_pair_magic_flight, state_transformed, affect_loyalty]
    examples: [foundling_bird_fundevogel, foundling_bird_lina]

  transform_shapeshift_duel:
    name: Shapeshift Duel
    description: |
      Competitive sequence of intentional transformations in which two
      opponents change forms in response to one another until one form
      gives decisive advantage.
    rationale: |
      Distinct from `transform_fugitive_pair`, where paired forms
      protect allies, and from `transform_animal_human`, which only
      records the direction of species crossing. Shapeshift duel names
      the strategic pattern: each new body is a move in a contest. KHM
      68 needs this mode because sparrow, fish, cock, and fox are not
      isolated transformations; they are turns in a master-apprentice
      struggle over who truly commands the art.
    tier: operational
    scope: entity
    lens: structural
    domains: [transformation, duel, animal-form, mastery]
    related: [law_shapeshift_duel_resolves_mastery, state_transformed, agency_cunning]
    examples: [thief_master_youth, thief_master_master_thief]

  transform_petrification:
    name: Petrification
    description: |
      A being is turned to stone — typically as the material cost of
      speaking forbidden knowledge (a prophecy that must remain
      silent). The petrification may be partial (knee-down, waist-
      down, head-down depending on what was revealed) or complete.
    rationale: |
      Distinct from `transform_curse` (which requires a hostile
      curse-worker — petrification here is automatic, mechanical
      consequence of speaking) and from `transform_release_by_
      violence` (which is liberating; petrification is punitive).
      Worth its own slot because petrification is the specific
      mechanism produced by `law_prophecy_compels_sacrifice`.
    tier: operational
    scope: entity
    lens: structural
    domains: [stone, sacrifice, speech-cost]
    related: [state_petrified, speech_prophecy, law_prophecy_compels_sacrifice]
    examples: [faithful_john]

  transform_resurrection_by_blood:
    name: Resurrection by Blood
    description: |
      A petrified or otherwise dead being is restored to life by the
      blood of the petrifier's master's closest kin (typically
      children). The blood is materially the substance of restoration;
      the master's willingness to sacrifice the kin is the moral
      condition.
    rationale: |
      Distinct from `transform_release_by_violence` (Frog King:
      violence releases a curse without sacrifice) and from
      `transform_restoration_by_confession` (verbal restoration in
      religious register). Blood-resurrection is the specific
      magical-MATERIAL counter to petrification, with an attached
      moral test on the sacrificer. Worth its own slot because no
      other transformation requires kin-blood specifically.
    tier: operational
    scope: entity
    lens: structural
    domains: [blood, sacrifice, resurrection, kin]
    related: [state_petrified, law_blood_restores_petrified, moral_reciprocal_sacrifice]
    examples: [faithful_john]

  transform_resurrection_by_remedy:
    name: Resurrection by Remedy
    description: |
      A dead body is restored to life by an external curative substance
      applied to the body: leaves, water, salve, herb, or analogous
      folk-medicine token.
    rationale: |
      Distinct from `transform_resurrection_by_blood`, where kin-blood
      and sacrifice are the operative price, and from
      `transform_restoration_by_confession`, where speech and moral
      repentance restore. Remedy-resurrection is material and
      technique-like: someone learns or possesses the correct medicine
      and applies it. KHM 16's three green leaves are the first clear
      paradigm, and later water-of-life or healing-herb tales can reuse
      the same mode without multiplying object-specific transforms.
    tier: operational
    scope: entity
    lens: structural
    domains: [resurrection, medicine, body, herb, water-of-life]
    related: [obj_life_restoring_leaves, law_serpent_medicine_restores_life]
    examples: [three_snake_leaves_young_queen, three_snake_leaves_young_king]


# =============================================================================
# SPEECH_ACTS — operational tier, scope: entity
# =============================================================================
# Why this category: in Grimm speech doesn't describe — it ACTS. Naming
# it, promising it, cursing it makes it real. Speech-acts are the
# fine-grained mechanism by which `agency_speech` works.

speech_acts:

  speech_promise:
    name: Promise
    description: |
      A pledge that creates obligation.
    rationale: |
      The atomic unit of `law_promise_binds_reality`. Naming it as a
      speech_act lets us track WHO promised WHAT — and therefore who
      can be enforced upon by whom.
    tier: operational
    scope: entity
    lens: structural
    domains: [oath, speech]
    related: [law_promise_binds_reality, state_bound_by_promise]

  speech_command:
    name: Command
    description: |
      Authoritative speech moving others into action.
    rationale: |
      Distinct from `speech_promise` (which binds the speaker) — a
      command binds the LISTENER. The frog-king's father COMMANDS his
      daughter to open the door; this is not a promise but an
      authority-act. Modelling both lets us see who is the
      authority-source vs. who is oath-bound.
    tier: operational
    scope: entity
    lens: structural
    domains: [authority, speech]
    related: [agency_social_rank, arc_oath_enforcer]

  speech_bargain:
    name: Bargain
    description: |
      Reciprocal speech establishing exchange.
    rationale: |
      "I will do X if you give Y" is structurally different from a
      one-sided promise ("I vow to do X"). The bargain creates mutual
      binding. Many magic tales hinge on the bargain (Frog King,
      Rumpelstiltskin, Fisherman's Wife) — naming it lets us find them.
    tier: operational
    scope: entity
    lens: structural
    domains: [exchange, oath]
    related: [law_promise_binds_reality, speech_promise]

  speech_wish:
    name: Wish
    description: |
      Spoken desire directed toward a magical granter, wishing-object,
      or wish-mediating figure. It asks reality to change rather than
      promising, commanding, bargaining, or confessing.
    rationale: |
      Distinct from `speech_command`, which binds a subordinate, and
      from `speech_bargain`, which establishes exchange. A wish has no
      reciprocal price stated by the wisher; its power depends on a
      magical responder. KHM 19's repeated requests to the Flounder
      require this slot because the wife's escalation is made from
      wish-speech, not from legal command or negotiated bargain.
    tier: operational
    scope: entity
    lens: structural
    domains: [wish, desire, magic, speech]
    related: [arc_greedy_one, law_insatiable_wishing_reverts_gifts, affect_greed]
    examples: [fisherman_wife_ilsabil]

  speech_request:
    name: Request
    description: |
      Speech act that asks another person or authority to grant a
      favor, mercy, object, action, or exception, without itself being
      a binding promise, command, wish, or confession.
    rationale: |
      Distinct from `speech_command`, which depends on rank, and from
      `speech_wish`, which asks reality or magic to change directly.
      A request is socially weaker unless a tale-law empowers it. KHM
      110 needs this slot because the servant's final "let me play
      once more" is neither command nor magical wish; its force comes
      from the donor-gift that makes requests irrefusable.
    tier: operational
    scope: entity
    lens: structural
    domains: [request, favor, speech, consent]
    related: [law_irresistible_request_overrides_judgment, agency_speech]
    examples: [jew_among_thorns_servant_final_request]

  speech_boast:
    name: Boast
    description: |
      Self-magnifying speech, inscription, or public claim that presents
      the speaker as stronger, braver, richer, or higher in status than
      ordinary evidence warrants.
    rationale: |
      Distinct from `speech_lie`, which asserts a specific false fact
      to deceive a particular listener, and from `speech_command`,
      which directs action. A boast may be technically true but
      pragmatically misleading. KHM 20's "Seven at one stroke" is true
      of flies and false by implication of men; tracking boast-speech
      lets queries find reputation-driven schwank heroes.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [boast, reputation, speech, ambiguity, status]
    related: [law_boast_generates_reputation, obj_boast_girdle, arc_trickster]
    examples: [brave_little_tailor]

  speech_riddle:
    name: Riddle
    description: |
      Enigmatic utterance whose answer is hidden in compressed,
      paradoxical, or private narrative knowledge. It is posed as a
      test of intelligence and often binds marriage or death stakes.
    rationale: |
      Distinct from `speech_boast`, which inflates reputation, and
      from `speech_wish`, which asks reality to change. A riddle is
      adversarial knowledge-speech: whoever controls the answer
      controls the outcome. KHM 22 needs this because the prince's
      private poison-chain becomes a public marriage/death test.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [riddle, knowledge, test, marriage, death-stakes]
    related: [arc_proud_task_princess, state_hidden_identity]
    examples: [riddle_prince]

  speech_name_guess:
    name: Name Guess / Name Utterance
    description: |
      Speech-act that tries, discovers, or correctly utters a hidden
      personal name when that name controls a bargain, identity, or
      supernatural claim.
    rationale: |
      Distinct from `speech_riddle`, which asks for an answer to an
      encoded problem, and from `speech_testimony`, which reports a
      witnessed event. A name guess acts directly on hidden identity:
      saying "Rumpelstiltskin" breaks the manikin's claim to the child
      because the unknown name was his contractual advantage. KHM 55
      needs this speech-act to keep name-magic visible as a mechanism,
      not just as generic guessing.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [name, secrecy, identity, speech, magic]
    related: [law_secret_name_breaks_supernatural_claim, state_hidden_identity, speech_riddle]
    examples: [rumpelstiltskin_queen]

  speech_lie:
    name: Lie
    description: |
      Intentionally false assertion designed to produce belief in the
      listener that is contrary to the speaker's actual knowledge or
      intent.
    rationale: |
      Distinct from `speech_promise` (which is sincere by intent) and
      from `speech_command` (which is authoritative regardless of
      truth-value). The lie is a speech-act whose CONTENT is
      counter-truth — and it's the engine of every trickster tale
      and many predator-victim encounters (Wolf-as-Grandmother lies
      to Little Red Cap, Cat lies about godmothering). Worth its own
      slot because the moral weight of a lie differs from a broken
      promise: a lie REIFIES false belief in the victim
      (`state_deceived`), while a broken promise merely fails to act.
    tier: operational
    scope: entity
    lens: structural
    domains: [deception, speech]
    related: [arc_trickster, agency_cunning, state_deceived]

  speech_curse:
    name: Curse
    description: |
      Harm-causing speech or utterance-like enchantment that imposes a
      hostile condition on a person, place, object, or substance.
    rationale: |
      Distinct from `speech_prohibition` (which forbids action) and
      from `speech_prophecy` (which reveals future events). A curse
      changes reality by speaking harm into it: a witch bewitches
      brooks so their running speech announces and enacts animal
      transformation. The ontology already uses curse as a causal
      neighbour of `transform_curse`; giving the speech-act its own
      slot lets us query who or what performs curse-speech.
    tier: operational
    scope: entity
    lens: structural
    domains: [curse, speech, harm, transformation]
    related: [transform_curse, state_cursed, law_curse_requires_counter_condition]
    examples: [little_brother_bewitched_brooks, frog_king_witch]

  speech_blessing:
    name: Blessing
    description: |
      Beneficial sacred, magical, or ritual speech that restores,
      protects, authorizes, or improves a person, object, or condition.
    rationale: |
      Distinct from `speech_curse`, which imposes harm, and from
      `speech_prayer`, which asks sacred order for help. A blessing is
      effective positive speech: in KHM 141 the wise woman's blessing
      is the restorative act that returns the lambkin and little fish
      to human form. Naming it supports queries over beneficent
      utterance as counter-magic rather than flattening it into generic
      request, command, or prayer.
    tier: operational
    scope: entity
    lens: structural
    domains: [blessing, speech, restoration, protection, counter-magic]
    related: [speech_curse, speech_prayer, transform_animal_human, moral_restorative]
    examples: [lambfish_wise_woman]

  speech_prohibition:
    name: Prohibition
    description: |
      Negative imperative speech: "do not do X." Issued by an
      authority figure to a subordinate, marking some action or
      place as forbidden.
    rationale: |
      Distinct from `speech_command` (which is a positive imperative,
      "do X"). The prohibition is the structural OPPOSITE — it
      forbids rather than directs. In folktale grammar, every
      prohibition is the setup for a violation (`law_prohibition_
      invites_violation`). Mary's "Beware of opening it" sets up the
      tale's entire moral trajectory. Without naming the act
      separately, prohibition becomes invisible as a tale-grammar
      element.
    tier: operational
    scope: entity
    lens: structural
    domains: [authority, prohibition, speech]
    related: [arc_prohibition_giver, law_prohibition_invites_violation]

  speech_confession:
    name: Confession
    description: |
      Sincere verbal acknowledgement of a fault, sin, or hidden truth.
      Inverse of `speech_lie`: the lie conceals counter-truth, the
      confession reveals concealed truth.
    rationale: |
      Critically distinct from `speech_lie`. In religious-register
      tales, confession is the SPEECH-ACT that triggers
      `law_repentance_restores`. The queen's "Yes, Mary, I did it"
      is what stops the fire and returns the children. It is not
      merely a declarative — it is a performative speech-act with
      restorative power. Worth its own slot because no other
      speech-act has this restorative function.
    tier: operational
    scope: entity
    lens: structural
    domains: [truth, confession, repentance]
    related: [arc_repentant_sinner, law_repentance_restores, transform_restoration_by_confession]

  speech_prayer:
    name: Prayer
    description: |
      Ritual address to divine or sacred order, usually spoken before
      danger, death, judgment, or transformation, and treated as more
      than ordinary request-speech.
    rationale: |
      Distinct from `speech_wish`, which asks magic to change reality,
      and from `speech_bargain`, which sets terms with another actor.
      Prayer invokes sacred time and moral standing. KHM 86 needs the
      slot because the geese's request works specifically by asking
      not to die in sin, then extending prayer without end; generic
      begging would miss the tale's pious-comic mechanism.
    tier: operational
    scope: entity
    lens: structural
    domains: [prayer, piety, speech, death, ritual]
    related: [law_endless_prayer_suspends_predation, moral_mercy_over_judgment, loc_church]
    examples: [the_fox_and_the_geese]

  speech_warning:
    name: Warning
    description: |
      Speech that identifies danger before it fully occurs and urges
      avoidance, concealment, return, or tactical caution.
    rationale: |
      Distinct from `speech_prophecy`, which reveals future events,
      and from `speech_command`, which authoritatively orders action.
      Warning is danger-speech from a helper or witness: the caged
      bird and the old woman in KHM 40 do not foretell a remote fate;
      they interpret the present house as a murder-site and redirect
      the bride's conduct. This slot enables queries for tales where
      survival begins with heeding a warning.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [danger, counsel, speech, survival]
    related: [arc_wise_helper, arc_animal_helper, agency_speech]
    examples: [robber_bridegroom_bird, robber_bridegroom_old_woman]

  speech_testimony:
    name: Testimony
    description: |
      Speech, song, or narrated account presented as evidence before a
      community, ruler, judge, or household, exposing a hidden wrong.
    rationale: |
      Distinct from `speech_confession`, where the guilty self-accuse,
      and from `speech_riddle`, where knowledge is withheld as a test.
      Testimony is outward-facing proof-speech: the singing bone tells
      the king what happened; later brides and witnesses can narrate
      crimes under dream, song, or formal accusation. The category lets
      queries track truth entering public judgment.
    tier: operational
    scope: entity
    lens: structural
    domains: [truth, evidence, judgment, speech]
    related: [law_dead_matter_reveals_murder, moral_retributive]
    examples: [singing_bone_horn]

  speech_prophecy:
    name: Prophecy
    description: |
      Revelation of future events. Distinct from `speech_curse`
      (which CAUSES harm) and from `speech_command` (which orders
      action) — prophecy only DISCLOSES what will be. In Grimm,
      prophetic speech is typically uttered by non-human voices
      (ravens, fish, doves) and overheard rather than addressed.
    rationale: |
      Worth its own slot because prophecy carries a UNIQUE
      operational signature: knowing it is asymmetric (the
      overhearer becomes silently bound), and re-speaking it
      carries material cost (`law_prophecy_compels_sacrifice` →
      `transform_petrification`). No other speech-act has this
      epistemic-cost economy.
    tier: operational
    scope: entity
    lens: structural
    domains: [prophecy, future, knowledge]
    related: [law_prophecy_compels_sacrifice, state_petrified, transform_petrification]
    examples: [faithful_john_ravens]


# =============================================================================
# MORAL_REGIMES — operational tier, scope: tale
# =============================================================================
# Why this category: each tale has a JUSTICE MODEL — how its closure
# distributes reward/punishment/restoration. Naming this as a regime
# (not just describing) lets us compare tales' moral architectures.

moral_regimes:

  moral_restorative:
    name: Restorative Justice
    description: |
      The tale's closure restores an order that had been disrupted
      (curse lifted, kin reunited, prince re-humanised) rather than
      punishing wickedness or rewarding virtue per se.
    rationale: |
      Distinct from `moral_retributive` (which would punish the witch)
      and `moral_arbitrary` (luck). Frog King ends restoratively —
      the curse-worker is never punished, the princess is not
      explicitly rewarded for virtue (she was disgusted, not virtuous);
      WHAT MATTERS is that the prince is restored, Henry's bands fall
      away. The tale's moral architecture is repair, not justice.
    tier: operational
    scope: tale
    lens: structural
    domains: [justice, harmony]
    related: [transform_release_by_violence, law_curse_requires_counter_condition]

  moral_open_ended_wonder:
    name: Open-Ended Wonder
    description: |
      The tale withholds final knowledge or reward at the exact point
      where revelation seems imminent, making expectation itself the
      closing affect.
    rationale: |
      Distinct from `moral_restorative`, where the broken order is
      visibly repaired, and from `moral_trickster_wins`, where success
      is legible through a completed reversal. Open-ended wonder has
      no shown payoff: the listener stands with the character before a
      still-unopened object or future disclosure. KHM 200 needs this
      regime because its final force is not what lies in the box, but
      the invitation to keep waiting for it.
    tier: operational
    scope: tale
    lens: cognitive
    domains: [wonder, suspense, closure, curiosity, narration]
    related: [affect_curiosity, law_unopened_treasure_suspends_reader_desire]
    examples: [the_golden_key]

  moral_naive_punished:
    name: Naive Punished
    description: |
      Naïveté itself is the moral failure: the trusting party is
      destroyed, the deceiving party prevails, and the narrator
      ratifies the outcome as "the way of the world." No virtue is
      rewarded; no wickedness is punished; trust is rebuked.
    rationale: |
      Distinct from `moral_retributive` (the cat would be punished —
      she isn't), `moral_arbitrary` (the outcome would be chance — it
      isn't, it's a direct consequence of naïveté). And distinct from
      `moral_violent_punishment` (the violence here is against the
      VICTIM, not the wrongdoer). This regime captures the cynical-
      realist register of beast fables: the moral lesson is "don't
      trust" rather than "be good." Without this category, we conflate
      the cat-and-mouse tale's moral architecture with hero-victory
      tales, losing the genre's distinctive ethic.
    tier: operational
    scope: tale
    lens: structural
    domains: [cynicism, naivety, predator-prey]
    related: [arc_naive_victim, arc_predator, law_might_unmakes_promise]
    examples: [cat_and_mouse_in_partnership]

  moral_disobedience_punished:
    name: Disobedience Punished
    description: |
      The tale's closure validates a warning or prohibition by
      destroying the one who knowingly disobeys it; the dangerous
      authority or monster may remain unpunished.
    rationale: |
      Distinct from `moral_naive_punished`, where the failure is
      trusting false appearances, and from `moral_retributive`, where
      wrongdoers are punished by proportional justice. Here the moral
      center is obedience to interdiction: the child hears the warning,
      violates it anyway, and the catastrophe confirms the warning's
      truth. KHM 43 needs this regime because Frau Trude wins; the
      tale punishes the girl's obstinate curiosity rather than the
      witch's violence.
    tier: operational
    scope: tale
    lens: structural
    domains: [obedience, prohibition, punishment, child, warning]
    related: [arc_willful_child, law_prohibition_invites_violation, speech_prohibition, affect_curiosity]
    examples: [frau_trude, willful_child]

  moral_repentance:
    name: Repentance
    description: |
      The tale's moral arc moves through sin → suffering → confession
      → forgiveness. The protagonist commits a fault, refuses to
      acknowledge it, suffers escalating consequences, finally
      confesses at the moment of greatest danger, and is restored.
    rationale: |
      Distinct from `moral_restorative` (which has no moral
      content — Frog King restores without sin) and from
      `moral_retributive` (which punishes wrongdoer without
      forgiveness). The repentance regime requires the SPECIFIC
      moral-time-shape of sin-suffering-confession-forgiveness, with
      forgiveness contingent on inner change. Defines the religious-
      legend subgenre of Grimm (Our Lady's Child, the Children's
      Legends).
    tier: operational
    scope: tale
    lens: structural
    domains: [repentance, forgiveness, religious]
    related: [arc_repentant_sinner, law_repentance_restores, speech_confession, affect_repentance]
    examples: [our_ladys_child]

  moral_comic_inversion:
    name: Comic Inversion
    description: |
      The tale's resolution arrives via anticlimactic reversal — the
      object of the long quest is delivered by trivial domestic means.
      The expected source of the resolution (the haunted castle, the
      hero's labour) fails; the unexpected source (cold water and
      fish; a wife's trick) succeeds. The moral is the humour itself.
    rationale: |
      Distinct from `moral_restorative` (which has earnest closure),
      `moral_retributive` (justice), `moral_repentance` (religious).
      Comic-inversion is the structural ethic of jocular tales: the
      tale rewards the SUBVERSION of its own quest-logic. KHM 4's
      hero never learns fear from the supernatural; he learns it
      from a bucket. The genre's moral is "your grand quests are
      undone by household contingency." Worth its own regime because
      it defines a substantial portion of Grimm's jocular subgenre.
    tier: operational
    scope: tale
    lens: structural
    domains: [comedy, anticlimax, inversion]
    related: [arc_fearless_fool, arc_fool]
    examples: [youth_who_went_forth_to_learn_fear, hans_in_luck]

  moral_heavenly_equality:
    name: Heavenly Equality
    description: |
      Heavenly order denies that earthly wealth, poverty, or rank
      changes a soul's final worth: the blessed poor and the blessed
      rich receive the same delights even when heaven reacts
      differently to the rarity of their arrival.
    rationale: |
      Distinct from `moral_mercy_over_judgment`, which rebukes a
      would-be punisher, and from `moral_providential_election`, which
      publicly raises a despised person into office. Heavenly equality
      is not promotion or pardon; it is interpretive correction. KHM
      167 needs the regime because the peasant's earthly expectation
      of class partiality is explicitly refuted by Saint Peter's
      assurance that he is "just as dear" and will enjoy every delight.
      The slot supports queries over afterlife tales where social rank
      is equalized rather than inverted into punishment or reward.
    tier: operational
    scope: tale
    lens: structural
    domains: [heaven, equality, class, salvation, religious-comedy]
    related: [law_heavenly_rejoicing_marks_rare_rich_salvation, loc_heaven, being_divine, moral_comic_inversion]
    examples: [the_peasant_in_heaven]

  moral_retributive:
    name: Retributive Justice
    description: |
      Wrongdoers receive proportional, often mirror-image punishment
      for their wrongs. The wolf who devours children drowns by the
      weight of stones substituted for them; deceivers are exposed
      and shamed; predators are killed. The moral order is balanced
      by inverting the predator's own act.
    rationale: |
      Distinct from `moral_restorative` (which RESTORES without
      necessarily punishing the antagonist — the witch in some tales
      simply vanishes), from `moral_violent_punishment` (which
      punishes violently but not necessarily mirror-justly), and from
      `moral_naive_punished` (which punishes the VICTIM for trusting).
      The retributive regime specifically uses the wrongdoer's own
      act as the template of their punishment: KHM 5's wolf swallows
      children to fill his belly → his belly is filled with stones
      that drown him.
    tier: operational
    scope: tale
    lens: structural
    domains: [justice, mirror, balance]
    related: [arc_predator, law_devouring_can_be_reversed, law_hidden_elder_food_becomes_clinging_burden]
    examples: [the_wolf_and_the_seven_young_kids, little_red_cap, the_ungrateful_son]

  moral_moderation_preserves_order:
    name: Moderation Preserves Order
    description: |
      Sustainable care depends on avoiding extremes: too much
      abundance and too much scarcity can equally destroy the practical
      order a household, herd, or worker is meant to maintain.
    rationale: |
      Distinct from `moral_overreach_reversal`, which cancels gains
      after escalating desire, and from `moral_comic_inversion`, where
      reversal itself supplies the humour. KHM 173 states the lesson
      directly: "That is the way when one has no moderation." The
      regime deserves its own slot because neither herdsman is a
      villain or trickster; the moral center is measured conditions as
      the basis of good labour. It enables queries over tales where
      ecological or practical middle-measure, rather than punishment
      or reward, is the explicit ethical order.
    tier: operational
    scope: tale
    lens: structural
    domains: [moderation, labour, pasture, household-order, ecology]
    related: [law_immoderate_pasture_creates_eternal_herding_call, agency_domestic_labor, sp_cattle, loc_meadow]
    examples: [the_bittern_and_hoopoe]

  moral_overreach_reversal:
    name: Overreach Reversal
    description: |
      A character who escalates beyond proper measure loses the very
      gains that earlier seemed legitimate or tolerable. The moral
      closure is reduction back to the starting point, not bodily
      punishment.
    rationale: |
      Distinct from `moral_retributive`, which mirrors a wrongdoer's
      injury with punishment, and from `moral_restorative`, which
      repairs a disrupted order for the protagonist. Overreach reversal
      answers hubris by cancellation: cottage, castle, kingship,
      empire, and papacy vanish when the wife asks to be like God. The
      regime is needed for wish-tales where excess desire collapses
      accumulated privilege rather than killing the desirer.
    tier: operational
    scope: tale
    lens: structural
    domains: [hubris, greed, reversal, rank, wishing]
    related: [arc_greedy_one, law_insatiable_wishing_reverts_gifts, affect_greed]
    examples: [the_fisherman_and_his_wife]

  moral_humbling_reform:
    name: Humbling Reform
    description: |
      Pride, rank-scorn, or contempt is corrected through staged
      humiliation and practical labour; the protagonist is restored only
      after acknowledging wrong and accepting a humbled self-understanding.
    rationale: |
      Distinct from `moral_retributive`, which closes by punishing a
      villain, and from `moral_overreach_reversal`, which simply cancels
      excessive gains. Humbling reform is punitive but educative: the
      proud character survives the humiliation and is reintegrated after
      repentance or confession. KHM 52 needs this moral regime because
      the princess is not destroyed for mockery; her pride is broken by
      beggar-marriage, failed labour, public shame, and then restored
      into true marriage.
    tier: operational
    scope: tale
    lens: structural
    domains: [humility, pride, reform, humiliation, labour]
    related: [law_disguised_status_descent_humbles, arc_proud_rejecting_bride, affect_shame, affect_pride]
    examples: [king_thrushbeard]

  moral_filial_reciprocity:
    name: Filial Reciprocity
    description: |
      Household care is restored when younger adults recognise that
      their treatment of an aged parent models the treatment they may
      receive from their own children.
    rationale: |
      Distinct from `moral_kindness_rewarded`, which sorts parallel
      characters by kindness, and from `moral_retributive`, which
      punishes wrongdoing. Filial reciprocity reforms rather than
      destroys: the parents cry, bring the grandfather back to the
      table, and tolerate his frailty. KHM 78 needs this regime because
      its moral architecture is intergenerational reversal made
      visible, not reward, vengeance, or magical restoration.
    tier: operational
    scope: tale
    lens: cognitive
    domains: [old-age, kinship, care, shame, reciprocity]
    related: [law_child_mirror_reveals_filial_future, arc_neglected_elder, affect_shame]
    examples: [the_old_man_and_his_grandson]

  moral_contentment_over_possession:
    name: Contentment over Possession
    description: |
      The tale's closure treats felt lightness, freedom from worry, and
      cheerful self-interpretation as more decisive than retaining
      material wealth.
    rationale: |
      Distinct from `moral_trickster_wins`, where the protagonist
      profits at others' expense, and from `moral_overreach_reversal`,
      where excessive desire cancels gains. Contentment over possession
      is paradoxically non-accumulative: Hans ends with nothing, yet
      the tale closes on happiness, burdenlessness, and return home.
      KHM 83 needs this regime because market loss and subjective
      fortune move in opposite directions.
    tier: operational
    scope: tale
    lens: cognitive
    domains: [contentment, wealth, loss, luck, burden]
    related: [law_diminishing_exchange_reframed_as_luck, arc_fool, affect_joy]
    examples: [hans_in_luck]

  moral_reciprocal_sacrifice:
    name: Reciprocal Sacrifice
    description: |
      Restoration happens because both parties prove willing to
      sacrifice their dearest. The servant offers his life by speaking
      the prophecy; the master offers his children's blood to revive
      the servant. Each must pass the other's test for the cycle to
      close. The moral logic is symmetric loyalty.
    rationale: |
      Distinct from `moral_restorative` (which restores without
      requiring active sacrifice — Frog King's princess does nothing
      morally) and from `moral_retributive` (which punishes wrongdoer
      not tests loyalty). Reciprocal-sacrifice is the SPECIFIC
      architecture of high-loyalty tales (Faithful John, Faithful
      Ferdinand variants): the parties prove their bond by mutual
      willingness to give the unbearable.
    tier: operational
    scope: tale
    lens: structural
    domains: [loyalty, sacrifice, reciprocity]
    related: [arc_faithful_servant, law_blood_restores_petrified, affect_loyalty]
    examples: [faithful_john]

  moral_faithful_service_rewarded:
    name: Faithful Service Rewarded
    description: |
      Long service and continued loyalty are finally acknowledged with
      protection, food, shelter, or renewed standing after a threat of
      abandonment.
    rationale: |
      Distinct from `moral_kindness_rewarded`, which sorts parallel
      characters by conduct toward testers, and from `moral_trickster_
      wins`, which celebrates clever opportunism. Faithful-service
      reward is relational: a servant or service animal has a history
      of loyalty, is undervalued, and then receives care once loyalty
      becomes visible again. KHM 48 needs this regime because Old
      Sultan's trick works only to restore a deserved household place;
      he then proves the moral by refusing to betray his master for
      the wolf.
    tier: operational
    scope: tale
    lens: structural
    domains: [loyalty, service, old-age, reward, household]
    related: [arc_discarded_service_animal, affect_loyalty, law_staged_rescue_restores_worth]
    examples: [old_sultan]

  moral_silent_endurance:
    name: Silent Endurance
    description: |
      The tale's moral closure rewards a protagonist who accepts
      prolonged silence, social misrecognition, and false accusation in
      order to redeem others. Vindication comes only when the fixed
      term is complete.
    rationale: |
      Distinct from `moral_repentance` (the protagonist must confess a
      fault) and from `moral_reciprocal_sacrifice` (two parties mirror
      each other's sacrifice). Here the protagonist is innocent, but
      must not defend herself; the moral logic values steadfast
      endurance under unjust accusation. KHM 9, KHM 49, and sister-
      redeemer tales require this regime because their closure is not
      merely restoration, but restoration purchased by non-speech.
    tier: operational
    scope: tale
    lens: structural
    domains: [silence, endurance, accusation, kinship]
    related: [law_silent_endurance_redeems, arc_silent_bride, state_mute]
    examples: [the_twelve_brothers, six_swans]

  moral_kindness_rewarded:
    name: Kindness Rewarded, Unkindness Punished
    description: |
      Parallel characters are sorted by everyday conduct toward weak,
      humble, or supernatural testers. The kind one receives beauty,
      wealth, marriage, or restoration; the unkind one receives
      ugliness, animal emissions, death, or social exposure.
    rationale: |
      Distinct from `moral_retributive` (punishes a villain's specific
      injury) and `moral_restorative` (repairs disruption). This regime
      is comparative and didactic: two girls face the same test, and
      their treatment of minor beings reveals worth. KHM 13's
      stepdaughter and stepsister form the paradigm; Mother Holle and
      later kind/unkind girl tales recur. It deserves a slot because
      the tale's justice model is moral sorting, not merely revenge.
    tier: operational
    scope: tale
    lens: structural
    domains: [kindness, test, reward, punishment, doubles]
    related: [law_kindness_to_hidden_donors_rewarded, arc_supernatural_donor, moral_retributive]
    examples: [the_three_little_men_in_the_forest, mother_holle]

  moral_trickster_wins:
    name: Trickster Wins
    description: |
      The tale's closure rewards the protagonist who, through
      accidental cunning, literalism, or sheer dumb luck, prevails
      over those who tried to exploit him — the speculators,
      middlemen, and informers come away with the king's blows or
      the bad coat, while the fool walks home with the money.
    rationale: |
      Distinct from `moral_retributive` (which punishes a primary
      wrongdoer in a moral-arc shape) and from `moral_comic_inversion`
      (which is about anticlimactic resolution of a quest). The
      trickster-wins regime is specifically about WHO PROFITS at
      story's end: the protagonist always; his exploiters never.
      The schwank's moral core. Pairs naturally with
      `moral_comic_inversion` in jocular tales but is the distinct
      end-state ethic (who-comes-out-ahead) rather than the
      quest-shape ethic (how-the-quest-resolves).
    tier: operational
    scope: tale
    lens: structural
    domains: [trickster, schwank, anti-middleman, peasant-luck]
    related: [arc_literal_fool, arc_speculator, moral_comic_inversion]
    examples: [good_bargain_peasant, hans_in_luck]

  moral_stigmatized_accuser_punished:
    name: Stigmatized Accuser Punished
    description: |
      The tale's closure transfers guilt onto a socially stigmatized
      accuser and validates their punishment, often after the
      protagonist uses coercive trickery to reverse a legal charge.
    rationale: |
      Distinct from ordinary `moral_retributive`, where punishment
      answers a clearly established injury, and from
      `moral_trickster_wins`, which only records who profits. This
      regime marks harmful social logic: KHM 110 frames the Jewish
      complainant through anti-Jewish stereotypes, lets the judge
      disbelieve the servant on explicitly prejudicial grounds, then
      converts a coerced confession into execution. Naming the regime
      keeps the dataset queryable for discriminatory moral structures
      without treating the stereotype as an ontological truth.
    tier: operational
    scope: tale
    lens: structural
    domains: [scapegoat, prejudice, accusation, punishment, schwank]
    related: [moral_trickster_wins, moral_retributive, agency_music]
    examples: [the_jew_among_thorns]

  moral_providential_election:
    name: Providential Election
    description: |
      A person dismissed by family or society is revealed as chosen by
      a higher order. Advancement is not earned through force,
      clever bargaining, or courtly merit, but through a providential
      convergence of hidden knowledge, mercy, and public sacred sign.
    rationale: |
      Distinct from `moral_restorative`, which repairs a disruption,
      and from `moral_trickster_wins`, which rewards opportunistic
      cleverness. Providential election is vertical: the despised
      learner becomes pope because animal speech and divine doves show
      that his apparently useless knowledge belongs to sacred order.
      KHM 33 needs this moral regime because its closure is religious
      recognition, not comic reversal or revenge.
    tier: operational
    scope: tale
    lens: structural
    domains: [providence, election, sacred, humility, hidden-knowledge]
    related: [law_divine_token_confers_office, law_animal_language_reveals_hidden_order, being_divine]
    examples: [the_three_languages]

  moral_providential_protection:
    name: Providential Protection
    description: |
      The tale's moral closure teaches that a small vulnerable being
      survives by combining harmless livelihood, prayerful trust, and
      patient endurance under divine care.
    rationale: |
      Distinct from `moral_providential_election`, where divine order
      publicly raises a despised person into office, and from
      `moral_prudential_retreat`, where safety comes from withdrawal
      before danger. Providential protection does not elect the
      youngest sparrow to rank; it states a way of living: feed without
      injuring others, take refuge in church, clear small insects, pray
      like the young ravens, and trust that no sparrow falls outside
      God's will. KHM 157 needs this regime for religious animal
      fables where survival is theological and practical at once.
    tier: operational
    scope: tale
    lens: cognitive
    domains: [providence, protection, piety, vulnerability, endurance]
    related: [law_parental_bird_counsel_maps_worldly_dangers, speech_prayer, agency_endurance, loc_church]
    examples: [the_sparrow_and_his_four_children]

  moral_industrious_piety_rewarded:
    name: Industrious Piety Rewarded
    description: |
      Humble work, inherited blessing, religious constancy, and
      generosity are revealed as true wealth; marriage or security
      arrives because the protagonist's poor household is already rich
      in vocation and divine favour.
    rationale: |
      Distinct from `moral_kindness_rewarded`, which sorts parallel
      characters through comparative tests, and from
      `moral_providential_election`, which raises an overlooked person
      into sacred or public office. Industrious piety is domestic and
      vocational: the maiden is not tested against a cruel double and
      does not win by cleverness, but by continuing blessed textile
      labour and sharing surplus after bereavement. KHM 188 needs this
      regime because the prince's paradox "poorest and richest" is
      solved by work, blessing, and household sufficiency.
    tier: operational
    scope: tale
    lens: cognitive
    domains: [piety, labour, poverty, blessing, marriage, household]
    related: [law_textile_tools_summon_wooer_and_prepare_house, arc_pious_orphan, agency_domestic_labor, speech_blessing]
    examples: [the_spindle_the_shuttle_and_the_needle]

  moral_mercy_over_judgment:
    name: Mercy over Judgment
    description: |
      The tale's moral closure rebukes harsh punishment by a lesser
      judge and asserts that mercy, patience, or reserved divine
      authority must govern sinners more than impulsive retaliation.
    rationale: |
      Distinct from `moral_retributive`, which validates punishment as
      proportional justice, and from `moral_repentance`, which restores
      the sinner after confession. Here the sinner is not the old woman
      who steals cloth but the tailor who presumes the right to punish
      her from heaven. KHM 35 needs this moral regime because its punch
      line is theological restraint: no one shall punish there but the
      Lord.
    tier: operational
    scope: tale
    lens: structural
    domains: [mercy, judgment, heaven, restraint, sin]
    related: [law_divine_punishment_reserved, being_divine, loc_heaven]
    examples: [tailor_in_heaven]

  moral_cosmic_order_restored:
    name: Cosmic Order Restored
    description: |
      The tale closes by returning a displaced cosmic force to its
      proper realm, so that living world, dead world, and heaven regain
      their separated functions.
    rationale: |
      Distinct from `moral_mercy_over_judgment`, where heaven corrects
      punitive zeal, and from `moral_comic_inversion`, where reversal
      itself is the comic ethic. KHM 175 is comic in tone, but its
      closure is structurally cosmogonic: Saint Peter does not reward
      or punish a single protagonist; he restores a misplaced moon to
      heaven and orders the awakened dead back into graves. The regime
      enables queries over tales whose final moral logic is cosmic
      placement and boundary-restoration rather than individual
      justice.
    tier: operational
    scope: tale
    lens: structural
    domains: [cosmic-order, afterlife, heaven, boundary, restoration]
    related: [law_celestial_light_displaced_unsettles_dead, loc_heaven, loc_world_below, being_divine]
    examples: [the_moon]

  moral_compassionate_aid:
    name: Compassionate Aid
    description: |
      The tale's moral closure insists that pity must become practical
      help for a vulnerable body, not remain a kind word, invitation,
      or passive feeling.
    rationale: |
      Distinct from `moral_kindness_rewarded`, where good conduct is
      compensated, and from `moral_retributive`, where wrong conduct is
      punished. Compassionate aid has no exchange closure: KHM 150 ends
      with an address to the hearer that the boy ought to extinguish
      the beggar-woman's burning rags, even with tears if no water is
      available. The regime is needed for ethical miniatures where the
      point is immediate mercy toward suffering rather than reward,
      reform, or punishment.
    tier: operational
    scope: tale
    lens: cognitive
    domains: [compassion, aid, suffering, vulnerability, mercy]
    related: [law_witnessed_fire_demands_compassionate_extinguishing, affect_pity]
    examples: [the_old_beggar_woman]

  moral_divine_social_interdependence:
    name: Divine Social Interdependence
    description: |
      The tale's moral closure teaches that unequal offices can still
      belong to one providential order when each station supports the
      rest. Rank and labour are interpreted as necessary functions of
      one social body rather than as isolated rewards or insults.
    rationale: |
      Distinct from `moral_providential_election`, where divine order
      raises one overlooked person into office, and from
      `moral_humbling_reform`, where pride is corrected through
      humiliation. Here Eve's complaint about unequal gifts is answered
      by a structural theology of work: if all children were princes,
      no one would grow, grind, bake, smith, weave, build, sew, or feed
      the world. KHM 180 needs the regime because its final lesson is
      social interdependence under divine will.
    tier: operational
    scope: tale
    lens: structural
    domains: [social-order, labour, hierarchy, providence, body]
    related: [law_divine_estate_distribution_orders_social_body, being_divine, agency_social_rank, agency_domestic_labor]
    examples: [eves_various_children]

  moral_prudent_selection:
    name: Prudent Selection
    description: |
      The tale's moral order rewards careful choice based on small
      observable habits, especially household conduct that predicts
      future marriage, labour, or material well-being.
    rationale: |
      Distinct from `moral_kindness_rewarded`, where characters are
      tested for generosity, and from `moral_restorative`, where a
      broken order is repaired. Prudent selection is prospective:
      nothing has gone wrong yet, but a minor sign lets the chooser
      avoid mismatch and enter a stable union. KHM 155 needs this
      regime because the shepherd's happy marriage follows from
      reading cheese-eating as evidence of proportionate domestic
      judgment.
    tier: operational
    scope: tale
    lens: cognitive
    domains: [prudence, marriage, choice, household, judgment]
    related: [law_cheese_rind_test_reveals_domestic_measure, agency_object_mediation, agency_domestic_labor]
    examples: [brides_on_their_trial]

  moral_prudential_retreat:
    name: Prudential Retreat
    description: |
      Survival depends on recognizing a supernatural danger that cannot
      be defeated, judged, or repaired, and withdrawing before the
      danger turns violent.
    rationale: |
      Distinct from `moral_retributive`, which punishes the wrongdoer,
      and from `moral_restorative`, which repairs the harmed order.
      Prudential retreat leaves the dangerous being in place; the
      protagonist's success is simply getting out alive after a truth
      becomes visible. KHM 42 needs this regime because the horned
      godfather is not defeated or converted: the healer becomes
      alarmed and runs out.
    tier: operational
    scope: tale
    lens: cognitive
    domains: [prudence, escape, danger, supernatural, recognition]
    related: [affect_fear, being_devil, threshold_doorway]
    examples: [the_godfather]

  moral_prudent_pacing:
    name: Prudent Pacing
    description: |
      The tale's moral closure teaches that speed must yield to timely
      maintenance when a small delay prevents a larger loss. Practical
      haste is judged by its whole causal cost, not by the immediate
      minutes it appears to save.
    rationale: |
      Distinct from `moral_prudential_retreat`, where survival depends
      on withdrawing from supernatural danger, and from
      `moral_moderation_preserves_order`, where extremes disrupt a
      stable ecology or household measure. Prudent pacing is temporal
      and mechanical: the merchant refuses two chances to repair the
      horse because he is in haste, then arrives late on foot. KHM 184
      needs the regime because the final sentence states the proverb
      directly: "Hasten slowly."
    tier: operational
    scope: tale
    lens: cognitive
    domains: [prudence, haste, maintenance, timing, consequence]
    related: [law_unrepaired_small_defect_cascades_into_disaster, speech_warning, agency_domestic_labor]
    examples: [the_nail]

  moral_memento_mori:
    name: Memento Mori
    description: |
      The tale's moral closure teaches that mortality has already been
      announcing itself through ordinary bodily weakness, illness,
      sleep, and aging; failing to read those reminders does not cancel
      Death's claim.
    rationale: |
      Distinct from `moral_retributive`, where a wrongdoer receives
      punishment, and from `moral_prudential_retreat`, where the lesson
      is to escape danger while escape remains possible. Memento mori
      is not a rescue ethic: it teaches recognition and acceptance of
      mortal signs. KHM 177 needs this regime because the man is not
      punished for villainy; he simply cannot argue that sickness and
      sleep were not warnings.
    tier: operational
    scope: tale
    lens: cognitive
    domains: [mortality, sickness, sleep, warning, acceptance]
    related: [law_ailments_are_deaths_messengers, being_death, speech_warning]
    examples: [deaths_messengers]


# =============================================================================
# AFFECTS — operational tier, scope: entity
# =============================================================================
# Why this category: affect is the FELT FORCE that drives a character's
# choice. Distinct from theme (which is paradigmatic recurrence) and
# from archetype (which is structural role).

affects:

  affect_disgust:
    name: Disgust
    description: |
      Visceral aversion to physical contact, presence, or appearance.
    rationale: |
      Disgust is the engine of Frog King's curse-release: the princess
      acts out of revulsion, not virtue, and her violence breaks the
      enchantment. Naming the affect makes the paradox legible: the
      tale rewards an UNVIRTUOUS impulse, complicating any
      simple-virtue reading. No other affect captures this aversion.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [body, aversion]
    related: [agency_violence, transform_release_by_violence]

  affect_loyalty:
    name: Loyalty
    description: |
      Sustained affective bond to a person or master.
    rationale: |
      Distinct from `affect_love` (romantic/erotic) and from
      `affect_longing` (for absent object). Loyalty is the bond
      IDENTITY itself — Faithful Henry IS his bond. It manifests
      physically (iron bands). The affect needs its own slot because
      its phenomenology differs from love: love seeks union, loyalty
      seeks endurance.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [loyalty, kinship-by-oath]
    related: [arc_faithful_servant, agency_endurance]

  affect_greed:
    name: Greed
    description: |
      Appetite for MORE — wealth, food, status, control — that
      escalates beyond satiation. Greed differs from hunger
      (which is bodily-need) in that greed has no terminal point.
    rationale: |
      Distinct from `affect_hunger` (which can be satisfied — eat
      and you stop) — greed has no satiation. The cat in KHM 2
      eats the WHOLE pot over three trips, then eats the mouse
      who would expose her. Hunger would stop at fullness; greed
      eliminates the witness. The two affects drive very different
      narrative arcs.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [appetite, accumulation, escalation]
    related: [arc_predator, arc_greedy_one]

  affect_hunger:
    name: Hunger
    description: |
      Bodily need or appetite for food, ranging from ordinary lack to
      impossible, task-solving consumption.
    rationale: |
      Distinct from `affect_greed`, which seeks accumulation beyond
      need, and from `affect_longing`, which is desire for an absent
      person, food, place, or condition. Hunger is somatic and
      consumptive: Hansel and Gretel read the edible house through it,
      and KHM 64's forest man can eat a mountain of bread because his
      hunger never closes. Naming it enables queries over appetite as
      survival pressure, lure, or magical helper capacity.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [hunger, food, appetite, body, consumption]
    related: [affect_greed, obj_edible_house, agency_endurance]
    examples: [golden_goose_hungry_man]

  affect_despair:
    name: Despair
    description: |
      Felt conviction that no survivable future remains. Despair is not
      merely grief over loss or fear of danger; it collapses imagined
      options until self-destruction, surrender, or death-seeking can
      appear as the only escape.
    rationale: |
      Distinct from `affect_grief`, which mourns an actual loss, and
      from `affect_fear`, which responds to danger that might still be
      avoided. Despair is a cognitive enclosure: the poor boy believes
      the next beating will kill him and decides to seek death before
      the farmer returns. KHM 185 needs the affect so abused-child and
      fatal-hopelessness plots remain queryable without blaming them
      on ordinary sadness or cowardice.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [despair, hopelessness, death, abuse, suffering]
    related: [affect_grief, affect_fear, law_cruel_caregiving_converts_simple_error_into_fatal_despair]
    examples: [poor_boy_orphan]

  affect_sloth:
    name: Sloth
    description: |
      A drive toward non-exertion: refusal to rise, work, move,
      respond, care for bodies or animals, or preserve one's own
      comfort when action would be required.
    rationale: |
      Distinct from `agency_endurance`, where not-acting can be
      virtuous persistence under trial, and from `affect_hunger`,
      which is bodily need. Sloth is comic and anti-labour: the lazy
      son, servant, or spouse treats effort itself as the enemy, even
      when inaction causes injury, hunger, ruined property, or social
      dismissal. A dedicated affect lets queries find idleness-driven
      tales across succession contests, servant catalogues, and
      domestic work-avoidance schwanks without reducing them to mere
      endurance.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [laziness, idleness, labour, refusal, comedy]
    related: [agency_endurance, agency_domestic_labor, speech_boast, moral_comic_inversion]
    examples: [the_three_sluggards, the_twelve_idle_servants, the_lazy_spinner]

  affect_longing:
    name: Longing
    description: |
      Persistent desire for an absent, forbidden, or inaccessible
      person, food, place, or condition. Unlike momentary curiosity, it
      intensifies over time and can make the body waste away or compel
      repeated visits.
    rationale: |
      Distinct from `affect_greed` (accumulation) and from
      `affect_love_at_first_sight` (instant erotic fixation). Longing
      is sustained lack felt in the body: Rapunzel's mother pines for
      rampion, and the prince repeatedly returns to the forest because
      Rapunzel's song touches his heart. Naming it lets queries find
      tales where desire across a boundary starts the plot.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [desire, lack, boundary, body]
    related: [loc_garden]
    examples: [rapunzel_mother, rapunzel_prince]

  affect_taboo_desire:
    name: Taboo Desire
    description: |
      Desire directed toward a person or relation that the tale-world
      marks as forbidden, especially incestuous or kinship-violating
      marriage desire.
    rationale: |
      Distinct from `affect_longing`, which can be innocent desire for
      an inaccessible object or person, and from
      `affect_love_at_first_sight`, which marks sudden erotic fixation
      without necessarily violating kinship law. Taboo desire is
      morally and structurally dangerous because the desire itself
      corrupts an existing relation. KHM 65 needs it because the
      father does not merely long for a bride like his dead wife; he
      reclassifies his daughter as that bride despite the councillors'
      explicit warning.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [desire, taboo, kinship, marriage, danger]
    related: [arc_taboo_desiring_father, law_impossible_bride_gifts_delay_forced_marriage, affect_fear]
    examples: [allerleirauh_father_king]

  affect_love:
    name: Love
    description: |
      Personal attachment that seeks union, preservation, or return of
      the beloved, especially in spouse and courtship relations where
      the bond is chosen rather than purely kinship or oath-bound.
    rationale: |
      Distinct from `affect_loyalty`, which endures as duty or service,
      and from `affect_love_at_first_sight`, which marks sudden erotic
      fixation at first view. Love here is relational and sustained:
      the clever queen takes the king as the dearest thing in her eyes,
      and his tears restore the marriage. The slot is needed because
      many Grimm reconciliations are driven neither by legal duty nor
      by first-sight enchantment, but by an existing chosen bond.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [love, marriage, attachment, reconciliation]
    related: [affect_loyalty, affect_love_at_first_sight, law_dearest_literalism_restores_marriage]
    examples: [peasants_clever_daughter, peasants_clever_king]

  affect_lust:
    name: Lust
    description: |
      Sexual or erotic appetite that seeks bodily access rather than
      marriage, loyalty, or sustained union, especially when it breaks
      household, clerical, or social boundaries.
    rationale: |
      Distinct from `affect_love`, which preserves or restores a chosen
      bond, and from `affect_taboo_desire`, which is defined by
      forbidden kinship. Lust in KHM 95 is opportunistic adulterous
      appetite: the parson and the wife want a day together and build
      deception around that wish. Naming it keeps anticlerical and
      adultery schwanks from being flattened into generic greed or
      romance.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [lust, adultery, appetite, marriage, hypocrisy]
    related: [affect_love, arc_treacherous_spouse, arc_hypocritical_cleric]
    examples: [old_hildebrand_parson, old_hildebrand_wife]

  affect_curiosity:
    name: Curiosity
    description: |
      Drive toward hidden knowledge, restricted information, the
      unseen-behind-the-door. Distinct from greed (which seeks
      possession) or hunger (which seeks bodily need): curiosity
      seeks KNOWING.
    rationale: |
      The driver of the prohibition-violation pattern. Pandora's
      curiosity, Eve's curiosity, Mary's child's curiosity — all
      the same affect, all producing the same plot. Worth its own
      slot because no other affect produces this specific
      transgressive movement (curiosity is amoral; it leads to
      both knowledge AND fall). The affect lets us identify tales
      structured around forbidden-knowledge.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [knowledge, transgression]
    related: [law_prohibition_invites_violation, speech_prohibition]
    examples: [our_ladys_child_queen, fitchers_bird_third_sister]

  affect_pride:
    name: Pride
    description: |
      Refusal to acknowledge fault — the affective stance that
      sustains denial against mounting evidence and consequence.
      Often described in religious tales as "hard ice of pride."
    rationale: |
      Distinct from `affect_shame` (which is felt-recognition of
      fault) — pride is REFUSAL of that recognition. The queen in
      KHM 3 lies three, then six, then nine times under increasing
      consequence; what holds the lie is pride, not the original
      fault. Naming the affect lets us distinguish characters whose
      sin is in the original act (curious touch) from characters
      whose sin is in the SUSTAINED denial. Religious-register
      tales typically frame the latter as the deeper sin.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [pride, denial, sin]
    related: [arc_repentant_sinner, speech_lie, affect_shame]

  affect_shame:
    name: Shame
    description: |
      Felt-recognition of fault. Distinct from pride (which refuses
      recognition) and from repentance (which acts on recognition).
      Shame is the inner-knowledge of fault, often suppressed.
    rationale: |
      The intermediate affect between sin and repentance. In KHM 3,
      the queen FEELS the lie (her heart beats; she cannot meet
      Mary's eye) but pride converts shame into renewed denial.
      Worth its own slot because it occupies a distinct phase in
      the religious-arc emotional trajectory.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [shame, fault, hidden]
    related: [affect_pride, affect_repentance]

  affect_repentance:
    name: Repentance
    description: |
      The felt-shift from denial to acknowledgement: a sudden inner
      breaking-through that produces confession. Distinct from
      `affect_shame` (which precedes and can be suppressed) and
      from `affect_guilt` (which is sustained burden).
    rationale: |
      Names the SPECIFIC affective movement that triggers
      `speech_confession` and through it `law_repentance_restores`.
      The text marks it explicitly: "the hard ice of pride melted,
      her heart was moved by repentance." Without the affect we
      cannot trace the inner cause of the resolving speech-act.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [repentance, religious, breakthrough]
    related: [arc_repentant_sinner, speech_confession, moral_repentance]

  affect_guilt:
    name: Guilt
    description: |
      Sustained inner burden of having committed a wrong, especially a
      hidden wrong whose social consequences have not yet arrived.
      Guilt keeps the deed psychologically present even when the world
      appears to have forgotten it.
    rationale: |
      Distinct from `affect_shame`, which is felt exposure before self
      or others, and from `affect_repentance`, which turns fault into
      moral transformation or confession. Guilt can remain secret,
      defensive, and unrepentant; it makes neutral signs feel
      accusatory. KHM 115 needs it because the murderer does not seek
      forgiveness: sunlight touches coffee, and his private burden
      makes him explain the hidden murder that later condemns him.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [guilt, secrecy, murder, conscience, confession]
    related: [speech_confession, law_guilt_reads_natural_light_as_accusation, moral_retributive]
    examples: [bright_sun_tailor]

  affect_fear:
    name: Fear
    description: |
      Anticipation of imminent harm — the constricting affect that
      drives flight, freezing, hiding, or appeasement. Distinct from
      `affect_shame` (which is felt-recognition of fault) and
      `affect_disgust` (visceral aversion to contact).
    rationale: |
      The default emotional bedrock of horror-register tales. Most
      tales presuppose fear as a normal response (the wolf is
      fearsome, the witch is fearsome). KHM 4 thematises fear by
      ABSENCE — its hero lacks it and the tale teaches both him
      and us what it is. Naming the affect lets us mark its presence
      across tales (when fear motivates flight) AND its specifically
      named absence in jocular-fearless tales.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [fear, body, constriction]
    related: [state_fearless, affect_disgust, affect_shame]

  affect_courage:
    name: Courage
    description: |
      Bravery under known danger: the character recognizes risk but
      continues into descent, combat, rescue, or disclosure anyway.
    rationale: |
      Distinct from `state_fearless`, where fear is absent as a
      constitutive deficit, and from `affect_loyalty`, where attachment
      motivates endurance. Courage names action despite danger. KHM 91
      needs it because Hans is not incapable of fear in the jocular-
      horror sense; he simply goes lower than the elder huntsmen,
      enters the dragon rooms, anticipates betrayal, and persists.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [courage, fear, ordeal, descent, combat]
    related: [affect_fear, state_fearless, arc_dragon_slayer]
    examples: [the_gnome_hans]

  affect_pity:
    name: Pity / Compassion
    description: |
      Tender concern for another being's suffering, weakness, wound, or
      apparent distress, including comic misdirected pity toward things
      treated as if they could hurt.
    rationale: |
      Distinct from `affect_maternal_love`, which is kin-bonded care,
      and from `affect_grief`, which responds to loss. Pity can be
      momentary and wrongly targeted: Catherine pities cart-ruts as
      "torn and skinned" earth and wastes butter to soothe them. The
      affect deserves a slot because Grimm tales often turn compassion
      into donor-reward, rescue, or, in schwank, comic misapplication.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [compassion, care, suffering, misrecognition]
    related: [moral_kindness_rewarded, law_foolish_remedy_compounds_loss]
    examples: [frederick_and_catherine]

  affect_grief:
    name: Grief
    description: |
      The sustained affective weight of loss — for lost loved ones,
      lost children, lost faculties. Distinct from `affect_repentance`
      (which is grief-for-fault-in-self) and from `affect_shame`
      (which is felt-recognition of fault).
    rationale: |
      Grief is a structurally important driver in many Grimm tales:
      Faithful Henry's iron bands hold his grieving heart together;
      the mother goat weeps for her swallowed children; the Goose-
      Girl's grief sustains her endurance. Naming the affect lets
      us trace how loss MOTIVATES action across tales.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [loss, sorrow]
    related: [arc_faithful_servant, arc_protective_mother]

  affect_joy:
    name: Joy
    description: |
      Felt gladness, delight, relief, or merriment that drives a
      character to accept, celebrate, or reinterpret an event as good.
    rationale: |
      Distinct from `affect_longing`, which moves toward an absent
      object, and from `affect_greed`, which seeks accumulation. Joy is
      not acquisitive; it can arise from release, restoration, or even
      losing a burden. KHM 83 needs it because Hans's trades are
      governed less by calculation than by repeated delight and relief:
      he is heartily delighted, contented, jumps for joy, and runs home
      light-hearted.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [joy, relief, happiness, contentment]
    related: [moral_contentment_over_possession, law_diminishing_exchange_reframed_as_luck]
    examples: [hans_in_luck]

  affect_maternal_love:
    name: Maternal Love
    description: |
      The specific bond between mother and child that motivates
      protection, sacrifice, and rescue. Distinct from generic
      `affect_love` (romantic) and from `affect_loyalty` (oath-bond).
    rationale: |
      Worth its own slot because maternal love produces a SPECIFIC
      class of actions in Grimm: protective violence (cutting open
      the wolf), endurance through loss (the queen mourning her
      taken children), and willingness to perform surgical or
      sacrificial acts. The affect names what drives the
      `arc_protective_mother` archetype. Without it we conflate
      mother-protection with generic love-of-kin.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [maternal, love, kinship]
    related: [arc_protective_mother, agency_violence]
    examples: [seven_kids_mother_goat]

  affect_love_at_first_sight:
    name: Love at First Sight
    description: |
      A coercive amorous fascination triggered by a single visual
      encounter — typically with a portrait or sudden glimpse. The
      affect is so total it produces fainting, illness, and
      irrational quest-action. Distinct from courtship love
      (developed over time).
    rationale: |
      The motor of bride-quest tales: a king sees a portrait, faints,
      will risk all to acquire the painted woman (KHM 6 paradigm;
      KHM 92 King of the Golden Mountain variants). Worth its own
      slot because the affect's intensity is what JUSTIFIES the
      subsequent abduction-by-deception (the king is not predator,
      he is love-stricken). Without it the quest-by-portrait pattern
      reads as random; with it, it's a coherent affective economy.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [love, sight, instant]
    related: [obj_dangerous_portrait, agency_violence]
    examples: [faithful_john_young_king]

  affect_envy:
    name: Envy
    description: |
      Resentment of another's fortune, beauty, or favoured position.
      In Grimm typically motivates wickedness from social-rank
      figures (the wicked queen who envies Snow-White) or undermining
      from attendants (courtiers envying Faithful John).
    rationale: |
      Distinct from `affect_greed` (which seeks ACCUMULATION of
      goods) and from `affect_pride` (which refuses fault). Envy is
      OTHER-DIRECTED — it cannot tolerate another's prosperity.
      Required to model the wicked-stepmother / wicked-courtier
      pattern that recurs throughout the corpus.
    tier: operational
    scope: entity
    lens: cognitive
    domains: [envy, resentment]
    related: [arc_envious_witness, arc_cruel_stepmother]

  affect_anger:
    name: Anger
    description: |
      Hot reactive affect to perceived insult, theft, or refusal —
      drives abrupt destructive action (throwing money to frogs,
      driving a petitioner out with a broomstick, ordering a
      whipping). Quick to rise, quick to dissipate.
    rationale: |
      Distinct from `affect_envy` (sustained other-directed
      resentment) and from `affect_grief` (loss). Anger is reactive
      and action-coupling: in schwank tales it generates the absurd
      action that drives the plot (peasant hurls his thalers into
      the pond out of anger; the king first orders blows, then
      laughs). Worth its own slot because anger-as-engine is a
      distinct schwank/comic motor and recurs across the corpus
      (Rumpelstiltskin's self-rending, the king's tempers).
    tier: operational
    scope: entity
    lens: cognitive
    domains: [anger, reaction, schwank]
    related: [agency_violence, moral_comic_inversion]
    examples: [good_bargain_peasant]


# =============================================================================
# SPECIES — phenomenal tier, scope: entity
# =============================================================================
# Why this category: many character properties depend on biological
# form (wolves eat, frogs jump, princesses are human). Species names the
# substance regardless of role or state.

species:

  sp_human:
    name: Human
    description: Default biological human form.
    rationale: |
      Required as the comparator — when a character is sp_human,
      `state_transformed` doesn't apply; when they're sp_frog as the
      cursed prince, it does. Without sp_human as baseline, we cannot
      detect transformation.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [body]

  sp_frog:
    name: Frog
    description: |
      Amphibian. In Grimm often the form of a cursed prince.
      Symbolically liminal — water/land, cold/warm.
    rationale: |
      Frogs in Grimm are not just animals — they are LIMINAL animals
      (amphibian, between elements). The species name carries this
      symbolic charge implicitly. Cross-tale queries for
      "liminal-creature-as-cursed-form" can hit sp_frog via its
      domain tags.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, amphibian, water]

  sp_toad:
    name: Toad
    description: |
      Warty amphibian creature, often appearing in enclosed uncanny
      households, punitive transformations, or clinging curse-forms
      rather than open ponds or wells.
    rationale: |
      Distinct from `sp_frog`, which carries the liminal water/land
      prince-form of Frog King and prophetic frog scenes. Toads in
      KHM 127 are house-dwellers, servants, and hidden king's children:
      their amphibian form signals enchantment inside a domestic
      otherworld, not a pond-side bargain. KHM 145 adds the punitive
      toad as transformed withheld food, attached to the offender's
      face. A separate species slot lets queries distinguish toad-
      house donor scenes and curse-burdens from frog-bridegroom and
      frog-oracle scenes.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, amphibian, house, enchantment]
    related: [sp_frog, state_transformed, arc_supernatural_donor, law_hidden_elder_food_becomes_clinging_burden]
    examples: [iron_stove_toads, ungrateful_son_face_toad]

  sp_horse:
    name: Horse
    description: Equine.
    rationale: |
      Royal carriages, hero's mount, faithful steed (Falada in
      Goose-Girl). Distinct from generic "animal" because horses
      occupy a specific Indo-European cultural register — they belong
      to royal-rank semantics.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, mount]

  sp_donkey:
    name: Donkey / Ass
    description: |
      Working equine associated with burdens, mills, stubborn endurance,
      humble labour, and comic or humiliating low status. In Grimm it
      can also become the paradoxical animal surface of hidden royalty.
    rationale: |
      Distinct from `sp_horse`, which carries royal, martial, and
      mounted-status semantics. The donkey is the exhausted labouring
      animal: KHM 27 begins when years of sack-carrying leave the ass
      too weak for work and therefore disposable. KHM 144 turns that
      low-status species into a royal son and bridegroom, making the
      contrast with courtly rank analytically important. A separate
      species lets queries distinguish humble work-beasts from noble
      mounts and from animal-bridegroom forms.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, labour, burden, humility]
    related: [agency_endurance, agency_domestic_labor, arc_hybrid_outcast_bridegroom]
    examples: [bremen_donkey, donkey_prince]

  sp_cat:
    name: Cat
    description: |
      Feline. In Grimm typically domestic, often trickster or
      ambiguous companion (KHM 2 partnership, KHM 75 Fox and Cat).
    rationale: |
      The cat is the canonical domestic-but-untrustworthy animal.
      Distinct from sp_dog (loyal) and sp_fox (wild trickster) —
      sp_cat occupies a household-but-self-interested register that
      no other species does.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, domestic, predator]

  sp_mouse:
    name: Mouse
    description: |
      Small rodent. Common prey-animal in fables, often standing for
      naïveté or small-virtue (KHM 2).
    rationale: |
      The structural prey-pair with sp_cat. Naming it explicitly lets
      us model the predator-prey species pairing which is itself a
      tale-grammar element (cat-vs-mouse, fox-vs-hen, wolf-vs-kid).
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, prey, small]

  sp_hedgehog:
    name: Hedgehog
    description: |
      Small spiny animal whose quills make bodily contact dangerous
      and whose curled, low, bristling body marks it as socially
      difficult to handle or domesticate.
    rationale: |
      Distinct from `sp_mouse`, which is small prey, and from
      `sp_rooster`, which provides vocal domestic signal. The hedgehog
      matters because its body is defensive surface: Hans cannot be
      nursed, cannot lie in an ordinary bed, and later wounds the false
      princess with his skin. A species slot lets queries find spiny
      defensive animality and hybrid animal-bridegroom bodies without
      reducing them to generic `sp_bird` or `sp_human`.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, spines, smallness, defense, hybrid]
    related: [being_animal_human_hybrid, agency_violence]
    examples: [hans_hedgehog_form]

  sp_dog:
    name: Dog
    description: |
      Canine. Domestic animal — typically faithful, occasionally
      magical (the dogs with red-hot chains in KHM 4 are
      ghost-dogs, not domestic).
    rationale: |
      Distinct from `sp_cat` (independent, ambiguous) — sp_dog is
      the loyal-bonded species. Worth its own slot for predator-prey
      taxonomies and for cross-tale "all the loyal animal helpers"
      queries.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, domestic, loyal]

  sp_fish:
    name: Fish
    description: |
      Aquatic animal. In Grimm typically appears as helper (the
      announcing fish in some Briar-Rose variants) or as humble
      everyday creature (the gudgeons in KHM 4).
    rationale: |
      Distinct from `sp_frog` (amphibian-liminal) — fish is purely
      aquatic. Their use in KHM 4 (gudgeons in cold water make the
      young king finally shudder) is humorously mundane, contrasting
      with the supernatural beasts; the species choice matters.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, aquatic]

  sp_whale:
    name: Whale
    description: |
      Vast sea-dwelling animal whose tale power comes from scale,
      depth, spouting water, and command of the open sea rather than
      from ordinary fish smallness or catchability.
    rationale: |
      Distinct from `sp_fish`, which covers ordinary aquatic creatures,
      and from `sp_bird`, which gives vertical help through flight. The
      whale in KHM 197 is a transformed brother whose oceanic body can
      raise house-high waves and cool the burning egg before the
      crystal ball melts. A whale slot keeps large sea-animal rescue
      agency queryable without flattening it into generic fish.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, aquatic, sea, scale, transformation]
    related: [sp_fish, loc_sea, transform_animal_human, agency_animal_aid]
    examples: [crystal_ball_whale_brother]

  sp_crab:
    name: Crab
    description: |
      Aquatic or shore-creature with sideways, clawed movement, used in
      comic wonder catalogues as an impossible pursuer of faster land
      animals.
    rationale: |
      Distinct from `sp_insect`, which covers tiny swarming creatures,
      and from `sp_fish`, which covers swimming aquatic animals. The
      crab's absurdity in KHM 159 depends on its body-plan: a slow,
      sideways, clawed creature chases a hare "at full speed." A
      species slot keeps crustacean inversion queryable without
      misclassifying it as insect or generic fish.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, aquatic, claws, comedy, inversion]
    related: [sp_hare, law_nonsense_catalogue_suspends_causality]
    examples: [ditmarsh_crab]

  sp_bird:
    name: Bird
    description: |
      Avian form: ravens, doves, pigeons, and other birds who fly,
      speak, prophesy, help, or embody transformed humans.
    rationale: |
      Distinct from mammal species such as `sp_wolf`, `sp_fox`, and
      `sp_hare`: birds carry vertical mobility and often mediate
      between human and otherworldly registers. KHM 6 uses prophetic
      ravens; KHM 9 turns brothers into ravens; Cinderella and later
      tales use doves as helpers. A general `sp_bird` is preferable to
      separate species for every bird when the plot-function is avian
      mobility or bird-form transformation.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, bird, flight, transformation]
    related: [transform_animal_human]
    examples: [faithful_john_ravens, twelve_brothers_ravens]

  sp_swan:
    name: Swan
    description: |
      Large white water-bird whose avian form carries beauty, liminal
      flight, and enchanted kinship rather than ordinary bird-helper
      function.
    rationale: |
      Distinct from generic `sp_bird`, which is enough when only flight
      or avian transformation matters. Swans in the sister-redeemer
      complex carry a specific bodily poetics: white transformed
      brothers arrive in formation, shed swan-skins like garments, and
      can be restored or left partly swan-bodied by textile magic. KHM
      49 needs the species slot because "swan" is not interchangeable
      with raven or dove in the tale's visual and material grammar.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, bird, water-bird, transformation, kinship]
    related: [sp_bird, transform_animal_human]
    examples: [six_swans_brothers_swan_form]

  sp_rooster:
    name: Rooster / Cock
    description: |
      Domestic male fowl whose crowing announces time, weather, danger,
      or arrival. Its voice often functions as a small but piercing
      signal in comic and household tales.
    rationale: |
      Distinct from general `sp_bird`, which covers avian mobility,
      prophecy, and transformation. The rooster's tale-function is
      vocal and domestic: in KHM 24 it announces golden and pitchy
      returns; in KHM 27 its crow becomes the top note in the animals'
      frightening collective performance; in KHM 149 the cock becomes
      the visible carrier of an illusionary beam. The species is
      reusable for cock-and-hen, farmyard, and dawn-announcement tales.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, bird, domestic, voice, dawn]
    related: [agency_speech, agency_music, law_four_leaf_clover_sight_breaks_illusion]
    examples: [frau_holle_cock, bremen_rooster, beam_enchanted_cock]

  sp_hen:
    name: Hen
    description: |
      Domestic female fowl, usually marked by farmyard food, eggs,
      pecking, nesting, and cock-and-hen partnership rather than by
      the rooster's crowing signal.
    rationale: |
      Distinct from `sp_rooster`, whose recurring tale-function is
      voice and dawn announcement, and from generic `sp_bird`, which
      is too broad for farmyard food-sharing plots. KHM 80 needs hen as
      a species slot because the cock-hen pair structures the whole
      tale: nut-sharing agreement, choking, funeral procession, and
      final mate-grief all depend on the domestic fowl pairing.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, bird, domestic, farmyard, food]
    related: [sp_rooster, affect_hunger, law_hoarded_share_chokes_holder]
    examples: [death_little_hen]

  sp_duck:
    name: Duck
    description: |
      Domestic or semi-wild waterfowl whose agency often comes from
      swimming, splashing, ferrying, or belonging simultaneously to
      farmyard and water.
    rationale: |
      Distinct from general `sp_bird`, which covers flight and avian
      voice, and from `sp_rooster`, whose role is domestic crowing.
      Ducks carry water-access: in KHM 10 the duck escapes down a
      stream, and in KHM 41 the duck waits on the well-pole and uses
      water against Herr Korbes. A species slot supports queries for
      bird-helpers or rogues whose plot power is aquatic rather than
      aerial.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, bird, water, domestic, farmyard]
    related: [loc_well, loc_brook, agency_animal_aid]
    examples: [pack_ragamuffins_duck, herr_korbes_duck]

  sp_goose:
    name: Goose
    description: |
      Domestic waterfowl, larger than a duck and associated in Grimm
      with farmyard value, golden feathers, procession comedy, or
      goose-herding status.
    rationale: |
      Distinct from `sp_duck`, whose recurring power is aquatic escape
      or retrieval, and from generic `sp_bird`, which covers avian form
      broadly. The goose in KHM 64 is not merely a bird: its golden
      feathers attract theft, its body carries sticky magic, and its
      public train wins the bride by laughter. A species slot also
      prepares later goose-girl/goose-herd tales without collapsing
      them into ducks.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, bird, domestic, waterfowl, farmyard]
    related: [sp_duck, obj_golden_goose, law_sticky_wonder_object_collects_interferers]
    examples: [golden_goose_khm64]

  sp_deer:
    name: Deer / Roebuck
    description: |
      Cervid forest animal: swift, beautiful, huntable. In Grimm it is
      often an enchanted human form or a vulnerable quarry in the royal
      hunt.
    rationale: |
      Distinct from `sp_horse` (mount/royal transport), `sp_hare`
      (small swift prey), and `sp_goat` (domestic pastoral prey). The
      deer carries forest-hunt semantics: beauty, flight, pursuit, and
      danger of being mistaken for mere game. KHM 11's brother becomes
      a roebuck, is nearly killed by hunters, and remains emotionally
      human. A species slot lets queries find enchanted deer/quarry
      figures across forest-hunt tales.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, forest, prey, hunt, transformation]
    related: [transform_animal_human, loc_forest]
    examples: [little_brother_roebuck]

  sp_wolf:
    name: Wolf
    description: |
      Canid predator. The archetypal threatening animal in Grimm —
      Red Cap's wolf, the seven kids' wolf, the wolf-of-the-fold.
      Almost always cast as predator-deceiver: combines threat with
      disguise.
    rationale: |
      Distinct from `sp_dog` (loyal-domestic) — sp_wolf is the
      wild-threatening species. The pairing of wolf-and-prey
      structures multiple tales. Worth its own slot because the
      species itself carries a specific danger-semantic in the
      Grimm tale-world.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, predator, wild]

  sp_goat:
    name: Goat
    description: |
      Domestic ruminant. In Grimm typically the prey-species opposite
      the wolf — mother goats, seven kids, three goats — but also a
      humble pastoral helper whose body can mediate food, inheritance,
      and household fortune.
    rationale: |
      Distinct from `sp_horse` (royal) and `sp_dog` (loyal-companion)
      — goats are humble livestock, sometimes anthropomorphised as
      vulnerable households (KHM 5), sometimes bound to abundance
      formulas and sacrificed-helper transformation (KHM 130), and
      sometimes etiologically marked by infernal creation (KHM 148).
      Worth its own species because goat-ness carries pastoral prey,
      humble provider, and devil-mark semantics that do not fit horses,
      cattle, sheep, or dogs.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, domestic, prey]
    related: [law_sacrificed_helper_body_becomes_rightful_tree, law_formula_commands_magic_objects, law_infernal_creation_marks_goat_body]
    examples: [seven_kids_mother_goat, one_eye_two_eyes_three_eyes_goat, lords_animals_goats]

  sp_bear:
    name: Bear
    description: |
      Large wild forest animal, physically powerful but often comically
      frightened or outwitted by smaller beings in beast episodes.
    rationale: |
      Distinct from `sp_wolf`, whose core role is predatory deception,
      and from `sp_fox`, whose role is cunning. The bear carries brute
      size and force; KHM 36 uses that size comically when even the
      bear flees the shaved goat's shining eyes. A species slot lets
      later bear helpers, bridegrooms, and dupes connect cleanly.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, wild, strength, forest]
    related: [agency_violence, loc_forest]
    examples: [wishing_table_bear]

  sp_lion:
    name: Lion
    description: |
      Large predatory feline whose narrative force is forest royalty,
      strength, and prestige, even when it appears in a comic beast
      sequence rather than as a fully developed antagonist.
    rationale: |
      Distinct from `sp_bear`, which carries brute forest size, and
      from `sp_wolf`, which carries devouring deception. The lion is
      the high-status beast: in KHM 38 it appears among Mrs Fox's
      rejected forest suitors, extending the courtship scale from
      domestic dog and swift hare to a royal predator who still lacks
      the fox traits she demands.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, wild, predator, strength, royalty]
    related: [agency_violence, loc_forest, sp_fox]
    examples: [wedding_mrs_fox_lion_suitor]

  sp_ape:
    name: Ape
    description: |
      Human-like wild animal used etiologically to explain a malformed
      or deformed birth as the origin of a non-human species.
    rationale: |
      Distinct from generic `sp_human`, because KHM 147 treats the
      ape-child as neither ordinary infant nor transformed adult, and
      from `sp_bear` or other forest animals whose force is predation
      or strength. The apes arise from terrified prenatal witnessing
      of a failed rejuvenation, so the species carries deformation,
      imitation, and origin-story semantics. A separate species slot
      lets etiological animal origins be queried without flattening
      apes into undifferentiated wild creatures.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, etiology, deformation, birth, forest]
    related: [law_imitated_miracle_without_authority_deforms_body, loc_forest]
    examples: [old_man_made_young_ape_children]

  sp_monkey:
    name: Monkey
    description: |
      Human-like animal associated with play, grimacing, pranks,
      imitation, appetite, and comedy that may conceal sadness or
      bodily insufficiency.
    rationale: |
      Distinct from `sp_ape`, whose Grimm use is etiological
      deformation after failed sacred imitation, and from `sp_human`,
      whose later old-age foolishness is explained through borrowed
      monkey-years rather than literal species identity. KHM 176 needs
      monkey as its own species because the final ten years of human
      life are mapped to monkey behaviour: merry pranks, faces that
      make people laugh, sour reward, and sadness hidden behind mirth.
      The slot enables queries over comic anthropomorphic aging without
      flattening monkeys into apes.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, comedy, imitation, aging, performance]
    related: [sp_human, law_transferred_animal_years_shape_human_aging, moral_comic_inversion]
    examples: [duration_life_monkey]

  sp_bee:
    name: Bee
    description: |
      Small stinging insect whose collective or precise bodily action
      can overcome a larger creature despite apparent weakness.
    rationale: |
      Distinct from `sp_ant`, which marks collective labour, and from
      `sp_insect`, the generic tiny-creature category. The bee's plot
      force is the sting: in KHM 36 the weak bee succeeds where fox and
      bear fail by stinging the shaved goat. A species slot supports
      later helper-swarm and stinging-punishment motifs.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, insect, sting, smallness]
    related: [agency_violence, sp_insect]
    examples: [wishing_table_bee]

  sp_cattle:
    name: Cattle
    description: |
      Domestic bovines: cows, calves, bulls, and oxen. In Grimm they
      appear as farm wealth, meat, labour, or comic livestock handled
      by socially inept humans.
    rationale: |
      Distinct from `sp_goat` and `sp_sheep`: cattle are larger
      property-animals and often mark household economy rather than
      predator-prey vulnerability. KHM 32 needs the calf as the item
      whose size makes Hans's inherited carrying-rule ridiculous.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, domestic, livestock, farm]
    related: [agency_domestic_labor, loc_stable]
    examples: [clever_hans_calf]

  sp_pig:
    name: Pig
    description: |
      Domestic swine valued for pork, fat, sausages, and household
      meat; often handled as portable livestock or comic property.
    rationale: |
      Distinct from `sp_cattle`, which carries milk, plough, and large
      farm-wealth semantics, and from `sp_goose`, which carries
      feathers and feast poultry. The pig in KHM 83 matters because it
      is traded for the cow precisely as meat and sausages, then
      becomes legally risky property in the lad's theft scare. A
      species slot keeps pig-as-meat economy queryable.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, domestic, livestock, meat, farm]
    related: [agency_domestic_labor, affect_hunger]
    examples: [hans_luck_pig]

  sp_sheep:
    name: Sheep
    description: |
      Domestic ovine livestock. Usually a humble flock animal, valued
      for meat, wool, or farmyard abundance and vulnerable to human or
      predatory handling.
    rationale: |
      Distinct from `sp_goat` (which carries the wolf-and-kids prey
      grammar) and from `sp_cattle` (large farm property). KHM 32
      needs sheep because the final grotesque misunderstanding turns
      the stable flock's eyes into a false courtship gift.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, domestic, livestock, flock]
    related: [agency_domestic_labor, loc_stable]
    examples: [clever_hans_sheep]

  sp_fox:
    name: Fox
    description: |
      Wild canid. In Grimm the proverbial cunning-beast — paired with
      or opposed to wolf, sometimes outwitted by smaller creatures,
      sometimes ally in revenge.
    rationale: |
      Distinct from `sp_wolf` (devouring-predator) and `sp_dog`
      (loyal-companion). The fox carries a SPECIFIC cunning-semantics
      that several tales lean on (KHM 8, 38, 73, 75).
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, wild, cunning]

  sp_hare:
    name: Hare
    description: |
      Wild lagomorph. Small, swift, easily startled. Often a duped
      prey or a runner in race-tales.
    rationale: |
      Distinct from `sp_mouse` (domestic-small) and `sp_dog`. The
      hare names the wild-prey-swift species that recurs in beast
      tales (KHM 8, KHM 187 The Hare and the Hedgehog).
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, wild, prey, swift]

  sp_sea_hare:
    name: Sea-Hare
    description: |
      Small wondrous animal form used as a marketable pet-like creature
      and hiding body rather than as the swift wild hare of beast
      fable.
    rationale: |
      Distinct from `sp_hare`, whose Grimm function is speed, preyhood,
      and race logic. The sea-hare in KHM 191 is not a runner; it is a
      transformed concealment-form that can be bought by the princess
      and hidden beneath her braids. Naming the species keeps the title
      creature and its embodied hiding function queryable without
      collapsing it into ordinary hares.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, transformation, concealment, market, courtship]
    related: [sp_hare, transform_animal_human, law_grateful_animals_hide_hero_from_omnivision]
    examples: [sea_hare_youth_form]

  sp_snake:
    name: Snake / Serpent
    description: |
      Serpentine animal associated with earth-depth, hidden treasure,
      household familiarity, medicine, revival, and dangerous
      punishment.
    rationale: |
      Distinct from generic reptile or monster categories because
      Grimm snakes carry a precise symbolic ambivalence: they can kill
      or punish, but they also know life-restoring remedies and may
      act as treasure-bearing house familiars. KHM 16 needs `sp_snake`
      because the serpent pair reveal resurrection medicine; KHM 105
      needs the same species because the small snake's feeding bond and
      crown-treasure are neither ordinary pet behaviour nor monster
      predation.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, serpent, medicine, treasure, household, death]
    related: [obj_life_restoring_leaves, law_serpent_medicine_restores_life, law_house_snake_feeding_sustains_child_vitality, law_serpent_treasure_requires_reciprocal_respect]
    examples: [three_snake_leaves_first_snake, three_snake_leaves_second_snake, stories_about_snakes_first_snake]

  sp_ant:
    name: Ant
    description: |
      Tiny social insect, usually appearing as a multitude under an
      ant-king. Ants excel at collective sorting, gathering, and
      rescuing impossible quantities of scattered grains or seeds.
    rationale: |
      Distinct from generic `sp_insect` because ant tales depend on
      collective micro-labour: thousands of small bodies accomplish
      the fine sorting task no human hand can finish before dawn.
      KHM 17's ant-king and his people gather ten sacks of millet,
      making ants the paradigmatic animal helpers for impossible
      granularity tasks.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, insect, collective, labour, smallness]
    related: [agency_animal_aid, law_rescued_animals_repay_kindness]
    examples: [white_snake_ant_king]

  sp_insect:
    name: Insect / Small Crawling Creature
    description: |
      Tiny arthropod or crawling creature used in miniature domestic,
      comic, or fable registers where exact species matters less than
      smallness and vulnerability.
    rationale: |
      Distinct from `sp_ant`, whose recurring Grimm function is
      collective labour and repayment, and from `sp_fly`, whose role is
      often mock-heroic counting or nuisance. KHM 30's louse and flea
      are not task-helpers or boast-counts; they are a tiny domestic
      pair whose accident begins a cumulative lament. A generic insect
      slot avoids overfitting separate one-off species while preserving
      small-creature semantics.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, insect, smallness, domestic, vulnerability]
    related: [sp_ant, sp_fly, law_contagious_lament_cascades]
    examples: [little_louse, little_flea]

  sp_fly:
    name: Fly
    description: |
      Small swarming insect drawn to food, sweetness, carrion, or
      domestic refuse. In comic tales flies can become a mock-heroic
      enemy whose defeat is exaggerated into glory.
    rationale: |
      Distinct from `sp_ant`, whose semantics are collective labour
      and repayment. Flies carry nuisance and swarm semantics. KHM 20
      requires this species because the whole reputation machine turns
      on the difference between killing seven flies and being believed
      to have killed seven men; without `sp_fly`, the boast's literal
      basis disappears from the graph.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, insect, swarm, nuisance, food]
    related: [law_boast_generates_reputation, num_7]
    examples: [brave_tailor_seven_flies]

  sp_unicorn:
    name: Unicorn
    description: |
      Horned magical beast, usually wild, dangerous, and singular. Its
      horn makes frontal attack deadly but also makes it vulnerable to
      being trapped in a tree.
    rationale: |
      Distinct from ordinary horse (`sp_horse`) and from generic
      supernatural beings: the unicorn's tale-grammar is defined by
      the horn. KHM 20 uses that horn as both threat and capture
      mechanism, and later unicorn episodes can reuse this species
      without treating it as a mundane animal.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, magical, horn, forest, capture]
    related: [loc_forest, agency_violence]
    examples: [brave_tailor_unicorn]

  sp_boar:
    name: Wild Boar
    description: |
      Heavy, tusked forest animal whose danger comes from charging,
      goring, and destructive momentum.
    rationale: |
      Distinct from generic livestock or forest animal because the
      wild boar is a specific ordeal-beast in European folktale:
      strong, angry, hard to stop, but capturable through doors, pits,
      or buildings. KHM 20's boar defeats huntsmen but is trapped by
      the tailor in a chapel.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [animal, forest, tusk, charge, hunt]
    related: [loc_forest, agency_violence]
    examples: [brave_tailor_wild_boar]


# =============================================================================
# BEING_TYPES — phenomenal tier, scope: entity
# =============================================================================
# Why this category: a witch isn't a SPECIES (she's biologically human)
# but she also isn't ordinary. Being_type names FOLKLORIC KINDS that
# don't fit zoological taxonomy. The separation from species is
# essential: a witch eats children (her being_type predicts), not
# because she is human (her species).

being_types:

  being_witch:
    name: Witch
    description: |
      Magical, liminal, often predatory or punitive female figure —
      enchantress, curse-worker, child-eater.
    rationale: |
      Cannot be reduced to `sp_human + arc_evil_witch` — the
      being_type is what allows the witch to perform magic in the
      first place. It's the ONTOLOGICAL CATEGORY that the tale-world
      uses, parallel to species. Without being_types we conflate
      "human with magic powers" and "humanoid magical creature."
    tier: phenomenal
    scope: entity
    lens: material
    domains: [magic, liminal, female]

  being_water_nix:
    name: Water-Nix / Water Nixie
    description: |
      Female water-dwelling supernatural being who lives below a well,
      pond, or other water-depth and can seize, keep, command, or
      pursue humans who cross into her domain.
    rationale: |
      Distinct from `being_witch`, whose power is domestic or forest-
      liminal magic, and from ordinary water locations such as
      `loc_well`. The water-nix is a being-type whose authority comes
      from underwater habitation and capture: children fall into her
      well, are carried off below, and must labour for her until they
      escape. KHM 79 needs the slot so later nix, mermaid, and mill-
      pond captures can be queried as water-being encounters rather
      than generic witch episodes.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [water, nix, supernatural, captivity, pursuit]
    related: [loc_well, threshold_well, law_thrown_objects_raise_pursuit_obstacles]
    examples: [water_nix_nix]

  being_wizard:
    name: Wizard
    description: |
      Human-like male magic-worker whose power includes disguise,
      coercion, enchantment, predatory abduction, or other amoral
      supernatural control.
    rationale: |
      Distinct from `being_witch`, which marks the female witch /
      enchantress register, and from `being_devil`, whose power is
      infernal and theological. The wizard is magical but not
      necessarily demonic; in KHM 46 he changes appearance, kidnaps
      girls, imposes a forbidden-room test, and murders them in a
      blood-chamber. In KHM 149 he works as public illusionist and
      revenge-caster rather than murderer. The being-type lets queries
      find male human-like magic antagonists without classifying them
      as devils or spirits.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [magic, wizard, disguise, abduction, predation, illusion]
    related: [arc_murderous_bridegroom, law_prohibition_invites_violation, state_disguised, law_revenge_illusion_transfers_public_shame]
    examples: [fitchers_bird_wizard, beam_enchanter]

  being_fairy:
    name: Fairy / Wise Woman
    description: |
      Female supernatural gift-giver or curse-worker whose power is
      social, ceremonial, and fate-shaping: she blesses, withholds,
      mitigates, or curses at birth, feast, or threshold moments.
    rationale: |
      Distinct from `being_witch`, whose magic usually works through
      predation, household danger, or hostile enchantment, and from
      `being_divine`, whose authority is sacred-normative. The fairy or
      wise woman is mercurial and ceremonial: invitation, exclusion,
      plate-count, and spoken gift determine the child's fate. KHM 50
      needs this being-type because the twelve invited Wise Women and
      the thirteenth excluded one operate as courtly fate-speakers, not
      as witches in a forest hut or divine judges.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [fairy, wise-woman, gift, curse, fate, birth]
    related: [arc_supernatural_donor, speech_prophecy, speech_curse, num_12, num_13]
    examples: [briar_rose_wise_women, briar_rose_thirteenth_wise_woman]

  being_divine:
    name: Divine Being
    description: |
      Sacred-register figure of normative-salvific authority: the
      Virgin Mary, Christ, angels, saints, God. Distinct from
      being_witch (magical-amoral, often predatory) and
      being_fairy (magical-amoral, mercurial): the divine is
      magical-MORAL, embodying the tale-world's normative order.
    rationale: |
      Religious-legend tales need their own being-type because the
      Virgin Mary cannot be classified as a witch (she is not
      threatening), nor as a fairy (she does not bargain or play
      tricks). Her magic is sacred-normative — she sets prohibition,
      enforces consequence, offers forgiveness. The category is
      structurally important: tales with `being_divine` operate
      under religious-register laws (`law_prohibition_invites_
      violation`, `law_repentance_restores`), tales with being_witch
      operate under predatory-magical laws. The being_type tells us
      which world we're in.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [sacred, divine, normative]
    related: [arc_prohibition_giver, moral_repentance, law_repentance_restores]
    examples: [our_ladys_child_mary]

  being_celestial:
    name: Celestial Body
    description: |
      Personified sun, moon, star, or planetary body who can speak,
      threaten, shelter, or give magical aid at the edge of the world.
    rationale: |
      Distinct from `being_divine`, which belongs to sacred-normative
      religion, and from `being_spirit`, which is death-adjacent or
      haunting. Celestial bodies in Grimm are cosmic persons: the sun
      may devour, the moon may smell human flesh, and stars may sit on
      chairs and give keys. KHM 25 requires this being-type because
      its helper/danger sequence is astronomical rather than animal,
      human, or divine.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [celestial, sun, moon, star, otherworld]
    related: [arc_supernatural_donor, threshold_doorway]
    examples: [seven_ravens_sun, seven_ravens_moon, seven_ravens_morning_star]

  being_wind:
    name: Personified Wind
    description: |
      Speaking directional or night wind treated as an elemental person:
      able to travel everywhere, answer questions, summon other winds,
      give counsel, and direct a seeker across the world.
    rationale: |
      Distinct from `being_celestial`, which covers sun, moon, and
      stars, and from `being_spirit`, which is death-adjacent or
      haunting. KHM 88 needs the wind as its own being-type because the
      heroine's route is solved not by an astronomical body but by an
      elemental network: night wind asks east, west, and south wind,
      and south wind has seen the lost dove. The slot supports queries
      over atmospheric helpers and directional knowledge.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [wind, direction, element, travel, counsel]
    related: [arc_supernatural_donor, agency_speech, loc_sea]
    examples: [the_singing_springing_lark_night_wind]

  being_devil:
    name: Devil
    description: |
      Infernal supernatural being associated with hell, predatory
      appetite for human flesh, hidden knowledge, bargains, punishments,
      and dangerous impossible tasks.
    rationale: |
      Distinct from `being_witch` (human-like magical antagonist),
      `being_spirit` (haunting/death-adjacent presence), and
      `being_divine` (sacred-normative authority). The devil belongs
      to an infernal knowledge economy: he is dangerous to approach but
      can accidentally reveal the hidden causes of human-world
      afflictions. KHM 29 needs this being-type because the hero's
      quest goes to hell not for a generic monster but for a named
      infernal source of golden hairs and secret answers.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [devil, hell, infernal, knowledge, danger]
    related: [loc_hell, speech_prophecy, moral_retributive]
    examples: [devil_golden_hairs_devil]

  being_death:
    name: Death
    description: |
      Personified Death: an otherworldly figure whose presence marks
      whether a human life can continue, and whose claims outrank
      ordinary medicine, rank, wealth, and desire.
    rationale: |
      Distinct from `being_devil`, who bargains and deceives for
      infernal gain, and from `being_spirit`, which is a haunting or
      revenant presence. Death is not a ghost or tempter but a cosmic
      office: in ATU 332 Death stands at head or feet, grants or
      withholds healing jurisdiction, and in KHM 44 acts as godfather
      directly.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [death, fate, medicine, equality, office]
    related: [law_death_position_determines_healing, arc_supernatural_godfather, moral_retributive]
    examples: [the_godfather_death_figure, godfather_death]

  being_spirit:
    name: Spirit
    description: |
      Incorporeal or partly-corporeal supernatural presence that
      lingers in places (haunted castles, gallows, graveyards),
      guards treasure, or returns from death. Includes ghosts,
      revenants, the half-man-from-chimney, the bearded-giant-guardian.
    rationale: |
      Distinct from `being_witch` (predatory-female-magical, on the
      living plane) and from `being_divine` (sacred-normative).
      The spirit is the death-adjacent magical-amoral being. Tales
      with haunted-castle ordeals (KHM 4 paradigmatically) deploy
      a whole menagerie of spirits — they need a unified being-type
      to share the law of fear-feeding (`law_fearlessness_defeats_
      supernatural`).
    tier: phenomenal
    scope: entity
    lens: material
    domains: [supernatural, death, haunting]
    related: [arc_fearless_fool, law_fearlessness_defeats_supernatural, affect_fear]
    examples: [haunted_castle_spirits, gallows_hanged_men]

  being_animated_object:
    name: Animated Object
    description: |
      A manufactured or material thing that acts as a character:
      speaking, travelling, making bargains, taking revenge, or causing
      bodily harm without being a biological species.
    rationale: |
      Distinct from `magic_objects`, which are objects used by others,
      and from species, which names biological form. Animated objects
      need a being_type because they can be edge participants with
      agency: KHM 10's pin and needle travel, bargain for carriage
      space, and later injure the host. This slot enables queries for
      object-persons without pretending they are humans or animals.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [object, animation, agency]
    related: [agency_cunning]
    examples: [pack_ragamuffins_pin, pack_ragamuffins_needle]

  being_dwarf:
    name: Dwarf / Little Man / Elf
    description: |
      Small humanoid otherworldly being, often living in a forest,
      mountain, or small house. May test humans, grant gifts, impose
      curses, or perform magical labour.
    rationale: |
      Distinct from `being_witch` (human-like magical antagonist) and
      `being_spirit` (death-adjacent presence). Dwarfs/little men are
      compact donor-judges: socially humble in appearance but
      magically authoritative. KHM 13's three little men grant beauty,
      gold-speech, royal marriage, ugliness, toads, and death. A single
      being-type covers "dwarf", "elf", and "little man" while keeping
      their donor-test role separate as `arc_supernatural_donor`.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [dwarf, elf, small-being, donor, forest]
    related: [arc_supernatural_donor, law_kindness_to_hidden_donors_rewarded]
    examples: [three_little_men]

  being_giant:
    name: Giant
    description: |
      Oversized humanoid being whose strength, appetite, and dwelling
      scale exceed ordinary human measure. Giants may be predators,
      rivals, donors, or dupes in strength-contests.
    rationale: |
      Distinct from `being_dwarf`, which encodes small hidden power,
      and from `being_spirit`, which is death-adjacent. Giants are
      material excess: enormous bodies, trees as weapons, sheep as
      food, caverns as houses. KHM 20 needs this being-type because
      the tailor defeats giants by exploiting their strength and
      gullibility rather than by fighting them as ordinary humans.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [giant, size, strength, cave, forest]
    related: [agency_violence, arc_naive_victim]
    examples: [brave_tailor_mountain_giant, brave_tailor_two_giants]

  being_dragon:
    name: Dragon
    description: |
      Many-headed or fire-breathing monster whose presence imposes
      territorial devastation, tribute, or human sacrifice until a hero
      kills it.
    rationale: |
      Distinct from `sp_boar` or other dangerous animals because the
      dragon is a folkloric monster rather than a zoological species:
      it bargains, speaks, breathes fire, demands virgins, and marks a
      bride-reward dragon-slayer complex. KHM 60 needs a being-type
      because the seven-headed dragon is the public crisis whose defeat
      creates the false-hero claim.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [dragon, monster, fire, sacrifice, many-headed]
    related: [arc_dragon_slayer, agency_violence]
    examples: [two_brothers_dragon]

  being_griffin:
    name: Griffin
    description: |
      Hybrid wonder-bird or monster-being: physically powerful,
      dangerous to humans, and associated with otherworld passage or
      hidden knowledge.
    rationale: |
      Distinct from `sp_bird`, which names ordinary avian form, and
      from `being_dragon`, which marks devastation, tribute, and combat
      monstrosity. Grimm griffins are liminal hybrids: in KHM 88 the
      griffin is a transport-being across the Red Sea; in KHM 165 the
      Griffin is a man-eating household monster who nevertheless knows
      hidden remedies, lost keys, and ferry laws. Broadening this slot
      enables queries over griffins as passage-and-knowledge beings
      without flattening them into dragons or ordinary birds.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [hybrid, bird, transport, knowledge, monster, otherworld]
    related: [sp_bird, loc_sea, loc_lake, agency_object_mediation, speech_testimony]
    examples: [the_singing_springing_lark_griffin, the_griffin]

  being_animal_human_hybrid:
    name: Animal-Human Hybrid
    description: |
      Being whose body combines human and animal parts at the same
      time, rather than alternating between whole human and whole
      animal form.
    rationale: |
      Distinct from `state_transformed`, which can describe any altered
      form, and from `arc_enchanted_prince`, which is a role. The
      animal-human hybrid is a phenomenal kind: the tale-world treats
      the body as simultaneously human kin and animal surface. KHM 108
      needs this because Hans is "a hedgehog in the upper part" and
      "a boy in the lower," producing domestic rejection, special
      bedding, quill-danger, and later skin-shedding release.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [hybrid, animal-human, body, transformation, kinship]
    related: [sp_human, sp_hedgehog, state_transformed, transform_animal_human]
    examples: [hans_hedgehog_form]


# =============================================================================
# SYMBOL_NUMBERS — structural tier, scope: tale
# =============================================================================
# Why this category: numbers in Grimm are not quantities but RITUAL
# MARKERS. Three brothers, seven dwarfs, twelve dancers — the number
# encodes tale-grammar (3 = test, 7 = completion, 12 = cosmic).

symbol_numbers:

  num_1:
    name: One
    description: |
      Singular-number: the single eye, single child, lone survivor, or
      exclusive owner whose narrative force comes from being undoubled
      and undivided.
    rationale: |
      Distinct from `num_2` as pair/mutuality and from `num_3` as
      iterative test. One usually marks isolation, uniqueness, or a
      body reduced to a single organ or actor. KHM 130 needs the number
      because One-Eye's single eye is both bodily identity and the
      weakness that lets Two-Eyes put all her surveillance to sleep.
    tier: structural
    scope: tale
    lens: structural
    domains: [number, singularity, isolation, body]
    related: [num_2, num_3]
    examples: [one_eye_two_eyes_three_eyes]

  num_2:
    name: Two
    description: |
      Pair-number: couples, matched companions, double witnesses, or
      twinned small agents whose force comes from acting as a pair.
    rationale: |
      Distinct from `num_3` (iterated test) and `num_12` (complete
      set). Two marks pairing and mutuality: cock-and-hen, pin-and-
      needle, brother-and-sister, bride-and-groom. KHM 10 is built
      from paired actors rather than a triple sequence, so tracking
      `num_2` lets queries find tales whose structure rests on dyads.
    tier: structural
    scope: tale
    lens: structural
    domains: [number, pairing, dyad]
    related: [num_3]
    examples: [pack_ragamuffins_cock, pack_ragamuffins_pin]

  num_3:
    name: Three
    description: |
      The most common ritual number in Grimm — three tasks, three
      sisters, three nights.
    rationale: |
      Three is structurally generative: it sets up REPETITION-WITH-
      VARIATION (first attempt fails, second fails, third succeeds).
      Naming it as a symbol_number lets us track "tales structured
      around triple iteration."
    tier: structural
    scope: tale
    lens: structural
    domains: [number, ritual]

  num_4:
    name: Four
    description: |
      Quartet-number: four companions, four directions, fourfold
      balance, or complete small group.
    rationale: |
      Distinct from `num_3` (ritual repetition/completion) and
      `num_7` (sacred or ordeal duration). Four often marks a stable
      ensemble or spatial completeness. KHM 27 needs it because the
      donkey, dog, cat, and rooster work only as a four-part stack and
      four-voice band; no single animal wins alone.
    tier: structural
    scope: tale
    lens: structural
    domains: [number, quartet, ensemble, balance]
    related: [law_collective_noise_magnifies_the_weak]
    examples: [the_bremen_town_musicians]

  num_6:
    name: Six
    description: |
      Six marks a closed sibling set, task-set, or ordeal count: six
      brothers, six transformed bodies, six years, or six crafted
      release objects.
    rationale: |
      Distinct from `num_3` as iterative test and from `num_7` as
      sacred fullness or long ordeal duration. Six often appears as a
      bounded practical total: enough to form a group, but counted by
      exact work rather than cosmic completion. KHM 49 needs it because
      the tale aligns six brothers, six swans, six years, and six
      shirts, and the unfinished sixth sleeve visibly measures the
      incompletion of the redemptive labour.
    tier: structural
    scope: tale
    lens: structural
    domains: [number, siblings, task, garment, completion]
    related: [num_3, num_7, law_redeeming_garments_restore_body]
    examples: [six_swans_brothers_swan_form, six_swans_starwort_shirts]

  num_7:
    name: Seven
    description: |
      Marked number of completion, fullness, luck, or closed set: seven
      children, seven hanged men, seven thalers that must not be
      mistaken for eight.
    rationale: |
      Seven is a high-frequency Grimm number, distinct from `num_3`
      (test-iteration) and from `num_12` (cosmic totality). It often
      marks a complete vulnerable group or a charged count whose exact
      value matters. KHM 7 adds a schwank use: seven is the correct
      commercial count that the literal fool defends against a misheard
      "eight." Tracking it lets number queries include both ritual
      sets and comic arithmetic disputes.
    tier: structural
    scope: tale
    lens: structural
    domains: [number, completion, luck, arithmetic]
    related: [num_3, num_8, law_speech_taken_literally]
    examples: [seven_kids_others, youth_seven_hanged_men, good_bargain_peasant]

  num_8:
    name: Eight
    description: |
      Marked number of excess, abundance, or count-displacement: eight
      white horses as royal grandeur; "eight" as the mistaken count
      heard in frogs' cries against the peasant's seven thalers.
    rationale: |
      Eight is less ritually loaded than `num_3`, `num_7`, or `num_12`,
      but it still receives narrative emphasis. In KHM 1 it indexes
      royal pomp; in KHM 7 it functions as one-too-many, the comic
      miscount that triggers literalist bargaining with frogs. Keeping
      it as a symbol number lets comparative queries distinguish
      marked non-ritual counts from unmarked quantities.
    tier: structural
    scope: tale
    lens: structural
    domains: [number, abundance, excess, arithmetic]
    related: [num_7]

  num_9:
    name: Nine
    description: |
      Marked number of heightened completion or superlative abundance,
      especially when a bodily count reaches the exact measure required
      for recognition, status, or selection.
    rationale: |
      Distinct from `num_7`, which often marks sacred completion or
      luck, and from `num_12`, which marks cosmic totality. KHM 38
      uses nine as a comparative marriage threshold: one through eight
      tails are insufficient, while a suitor with nine tails matches
      old Mr Fox and becomes acceptable. The number therefore indexes
      exact resemblance and status-fit, not mere quantity.
    tier: structural
    scope: tale
    lens: structural
    domains: [number, completion, resemblance, courtship, selection]
    related: [sp_fox, law_feigned_death_tests_fidelity]
    examples: [wedding_mrs_fox_nine_tail_suitor]

  num_12:
    name: Twelve
    description: |
      Cosmic completion — twelve apostles, twelve hours, twelve
      months, twelve brothers, twelve huntsmen, twelve dancing
      princesses. The number of FULLNESS, with no remainder.
    rationale: |
      Twelve in Grimm always marks closure of a cycle or set.
      Distinct from 3 (test-iteration) and 7 (luck/luminance). Many
      tales use 12 as a structural marker of a complete domain
      (heaven, the year, the court). Naming it lets us connect
      twelve-keyed tales (KHM 3, KHM 49 Six Swans→Twelve Brothers,
      KHM 67 Twelve Huntsmen).
    tier: structural
    scope: tale
    lens: structural
    domains: [number, completion, cosmic]

  num_13:
    name: Thirteen
    description: |
      One beyond twelve — transgression, the excluded, the forbidden.
      The thirteenth fairy excluded from Briar Rose's christening,
      the thirteenth key (Mary's child), the unlucky one.
    rationale: |
      Thirteen in Grimm is ALWAYS the disruptive excess: it's the
      slot that should not exist but does, the door that should
      remain closed. Worth its own slot (and distinct from num_12)
      because the semantic charge inverts: 12 = closed/complete,
      13 = transgressive/uncanny.
    tier: structural
    scope: tale
    lens: structural
    domains: [number, transgression, uncanny]
    related: [law_prohibition_invites_violation]

  num_30:
    name: Thirty
    description: |
      Standard initial life allotment in the lifespan-origin tale:
      enough to mark a full creaturely term before any animal complaint
      or human extension changes it.
    rationale: |
      Distinct from `num_12`, which marks cosmic completeness, and
      from `num_100`, which marks century-scale enchantment. KHM 176
      makes thirty the divine baseline assigned to ass, dog, monkey,
      and man alike before the animals reject part of it and man asks
      for more. The number supports queries over lifespan arithmetic
      and initial allotment rather than ordeal, testing, or totality.
    tier: structural
    scope: tale
    lens: structural
    domains: [number, lifespan, baseline, creation, aging]
    related: [law_transferred_animal_years_shape_human_aging]
    examples: [the_duration_of_life]

  num_70:
    name: Seventy
    description: |
      Composite human lifespan formed from thirty human years plus the
      surrendered animal years of ass, dog, and monkey.
    rationale: |
      Distinct from `num_100`, which signals a long enchanted term,
      and from `num_30`, which is the starting allotment. KHM 176 uses
      seventy as a constructed human total whose internal structure is
      qualitative: vigorous human years, burdened ass-years, declining
      dog-years, and foolish monkey-years. The number is useful for
      querying tales where duration is explained by layered symbolic
      arithmetic.
    tier: structural
    scope: tale
    lens: structural
    domains: [number, lifespan, aging, totality, arithmetic]
    related: [law_transferred_animal_years_shape_human_aging, sp_human]
    examples: [the_duration_of_life]

  num_74:
    name: Seventy-Four
    description: |
      Exhaustive repetition count in the hare-and-hedgehog race: the
      seventy-fourth run is the point where prideful speed collapses
      into bodily death.
    rationale: |
      Distinct from ritual numbers such as `num_3`, `num_7`, and
      `num_12`. Seventy-four is not a general sacred count; it is a
      narrated exhaustion total. KHM 187 names it because the hare's
      repeated demand to run again becomes measurable bodily depletion,
      and the final count anchors the race's etiological warning.
    tier: structural
    scope: tale
    lens: structural
    domains: [number, repetition, exhaustion, race, animal-tale]
    related: [law_positional_spouse_double_wins_repeated_race, sp_hare]
    examples: [the_hare_and_the_hedgehog]

  num_100:
    name: One Hundred
    description: |
      Long-duration completion number: a century-scale term that seals
      a spell, sleep, exile, or waiting period beyond ordinary human
      impatience.
    rationale: |
      Distinct from `num_7`, which often marks sacred ordeal duration,
      and from `num_12`, which marks a completed set. One hundred is
      temporal vastness rather than ritual sequence: it makes premature
      rescue impossible and lets an entire castle fall outside ordinary
      time. KHM 50 needs it because the softened curse is not merely
      "long sleep" but a hundred-year term whose completion opens the
      thorn hedge.
    tier: structural
    scope: tale
    lens: structural
    domains: [number, time, duration, sleep, completion]
    related: [state_enchanted_sleep, law_fated_time_opens_thorn_threshold]
    examples: [briar_rose]


# =============================================================================
# LOCATIONS — phenomenal tier, scope: world
# =============================================================================
# Why this category: locations here are UNIVERSAL TYPES (the concept of
# "forest", "well"). Tale-specific INSTANCES live in per-tale yaml
# (`loc_forest_hansel_and_gretel`) linked via `instance_of`.
# Separation: universals support cross-tale queries
# ("what happens in forests?"); instances support per-tale grounding.

locations:

  loc_forest:
    name: Forest
    description: |
      Liminal wilderness adjacent to the household. Site of testing,
      bargains, predation, transformations.
    rationale: |
      The forest is the single most semantically loaded location in
      Grimm. Its universal type lets us connect 30+ tales' forest
      instances to shared archetypes (predators live there), laws
      (domestic rules suspend), thresholds (crossing it changes
      conduct). Without the universal, each tale's forest is
      orphan-data.
    tier: phenomenal
    scope: world
    lens: material
    domains: [forest, wilderness]
    related: [threshold_forest]

  loc_well:
    name: Well
    description: |
      Vertical passage into water/depth. Frequent site of bargains
      with non-human helpers.
    rationale: |
      Wells recur as otherworld-portals (Frog King's well, Mother
      Holle's well). The universal type connects these via
      `threshold_well`.
    tier: phenomenal
    scope: world
    lens: material
    domains: [water, depth]
    related: [threshold_well]

  loc_castle:
    name: Castle
    description: |
      Seat of royal authority and domestic order.
    rationale: |
      Many tales open or close at a castle. The universal type
      anchors royal-rank semantics — `arc_oath_enforcer`s live in
      castles, weddings end in castles.
    tier: phenomenal
    scope: world
    lens: material
    domains: [royalty, household]

  loc_courtyard:
    name: Courtyard
    description: |
      Open interior space of a house, village, castle, or palace where
      arrivals, greetings, guards, processions, and public household
      transitions become visible.
    rationale: |
      Distinct from `loc_gate`, which is the outer threshold, and from
      `loc_castle`, which names the whole royal complex. The courtyard
      is the first domestic-public space after return: in KHM 108 the
      person who first runs into the royal courtyard fulfills the
      promise formula. A universal supports queries over homecoming,
      welcome, guard display, and public transfer inside household
      authority.
    tier: phenomenal
    scope: world
    lens: material
    domains: [courtyard, homecoming, public, household, royalty]
    related: [loc_gate, loc_castle, law_first_homecoming_claims_promised_child]
    examples: [loc_hans_first_courtyard, loc_hans_second_courtyard]

  loc_house:
    name: House
    description: |
      Generic dwelling. The site of ordinary domestic life — meals,
      sleep, shared partnership.
    rationale: |
      Distinct from `loc_castle` (royal) and `loc_cottage` (typically
      poor or isolated). The house is the neutral household. In KHM 2
      the cat and mouse share a house — neither royal nor wild. This
      neutrality MATTERS: it's the bourgeois-domestic register where
      partnerships are made and broken.
    tier: phenomenal
    scope: world
    lens: material
    domains: [domestic, household]

  loc_bedchamber:
    name: Bedchamber
    description: |
      Sleeping room where marriage, vulnerability, night secrecy, or
      bodily transformation becomes private and decisive.
    rationale: |
      Distinct from `loc_house`, the whole dwelling, and `loc_hearth`,
      the domestic fire-centre. The bedchamber is a ritual interior:
      Frog King presses the bed-promise there, enchanted spouses reveal
      or hide bodies there, and KHM 108's skin-removal succeeds only
      when watchmen wait outside the chamber at night. A universal lets
      bedroom promise, marriage, and transformation scenes be queried
      without flattening them into generic house or castle space.
    tier: phenomenal
    scope: world
    lens: material
    domains: [sleep, marriage, secrecy, transformation, night]
    related: [loc_house, loc_castle, law_burned_animal_skin_releases_human_form]
    examples: [loc_hans_second_bedchamber]

  loc_road:
    name: Road
    description: |
      Human-made travel line between households, villages, fields, and
      forests. It carries walkers, carts, ruts, tradespeople, thieves,
      and errand movement through otherwise separate social spaces.
    rationale: |
      Distinct from `threshold_forest`, which names a boundary
      crossing into wild liminal order, and from `loc_field`, which is
      agricultural labour-space. The road is a mundane connector where
      mistakes travel: Catherine chases a dog into the field, follows
      Frederick after the pedlars, sees cart-ruts as wounded earth, and
      turns provisions into failed road-remedies. A reusable road type
      supports queries over itinerant schwank episodes, trade, pursuit,
      and journey errors.
    tier: phenomenal
    scope: world
    lens: material
    domains: [travel, road, village, trade, pursuit]
    related: [threshold_forest, loc_field]
    examples: [loc_frederick_catherine_road]

  loc_village:
    name: Village
    description: |
      Small human settlement outside courtly authority: a place of
      shelter, labour, local gossip, strangers, hired service, and
      temporary social reintegration after wilderness or exile.
    rationale: |
      Distinct from `loc_castle`, where royal rank governs action, and
      from `loc_house`, which is a single domestic unit. A village is a
      social aggregate: Joringel can live there as a shepherd while he
      remains separated from Jorinda and from the witch's castle. This
      universal supports queries over non-royal communal space,
      low-status labour, and transitional refuge between magical and
      domestic orders.
    tier: phenomenal
    scope: world
    lens: material
    domains: [village, community, labour, refuge, social-space]
    related: [loc_road, loc_field, agency_domestic_labor]
    examples: [loc_jorinda_joringel_village]

  loc_town:
    name: Town
    description: |
      Civic settlement larger and more public than a village, with
      proclamations, gates, crowds, commerce, and contact with royal or
      municipal authority.
    rationale: |
      Distinct from `loc_village`, which marks small local community,
      and from `loc_castle`, where royal household authority is
      concentrated. The town is the public civic arena where news,
      royal contests, gates, and spectators gather. KHM 71 needs it
      because the race is publicly proclaimed in a town before the
      king's daughter and the soldier's servant compete.
    tier: phenomenal
    scope: world
    lens: material
    domains: [town, civic, public, proclamation, crowd]
    related: [loc_gate, loc_castle, loc_marketplace]
    examples: [loc_how_six_race_town]

  loc_island:
    name: Island
    description: |
      Bounded land separated by water from the familiar mainland.
      Islands often preserve local ignorance, alternative customs, or
      isolated abundance that makes ordinary mainland objects strange.
    rationale: |
      Distinct from `loc_forest`, where liminality is wild and
      magical, and from `loc_village`, where social life remains
      contiguous with ordinary roads and fields. The island is
      separated enough for knowledge to diverge: in KHM 70, three
      islands lack cocks, scythes, or cats, turning common inheritance
      into treasure. A reusable island type supports comparative
      queries over geographic isolation and novelty value.
    tier: phenomenal
    scope: world
    lens: material
    domains: [island, water-boundary, isolation, trade, novelty]
    related: [law_novelty_converts_utility_to_treasure, loc_road]
    examples: [loc_three_children_cock_island, loc_three_children_scythe_island, loc_three_children_cat_island]

  loc_witch_house:
    name: Witch-House
    description: |
      Dwelling controlled by a witch, where hospitality, curiosity, or
      shelter turns into magical danger.
    rationale: |
      Distinct from neutral `loc_house` and from `obj_edible_house`,
      which is a food-architecture lure. The witch-house is a social
      and ontological environment: entering it places the visitor under
      the witch's rules whether or not the house itself is edible.
      KHM 43 needs this location-type because the whole ATU 334
      grammar centers on visiting the witch's household and seeing its
      uncanny occupants.
    tier: phenomenal
    scope: world
    lens: material
    domains: [witch, house, danger, threshold, hospitality]
    related: [being_witch, loc_house, threshold_doorway, law_prohibition_invites_violation]
    examples: [loc_frau_trude_house, loc_witch_house_hansel_gretel, loc_witch_house_riddle]

  loc_cellar:
    name: Cellar
    description: |
      Below-house storage space for beer, food, tools, and household
      reserves. It is domestic but vertically separated from the room
      where family and guests wait.
    rationale: |
      Distinct from `loc_house`, the general dwelling, because cellar
      scenes often isolate a worker beneath the household and turn
      storage objects into plot hazards or secrets. KHM 34 needs the
      cellar as the place where a beer-fetching chore becomes a comic
      prophecy of future death under the suspended pickaxe.
    tier: phenomenal
    scope: world
    lens: material
    domains: [domestic, storage, underground, household]
    related: [loc_house, agency_domestic_labor]
    examples: [loc_clever_elsie_cellar]

  loc_stable:
    name: Stable
    description: |
      Farm outbuilding where domestic animals are kept, tied, fed, or
      stalled. It belongs to the household economy but is governed by
      livestock handling rather than ordinary human etiquette.
    rationale: |
      Distinct from `loc_house`, the human dwelling, and from
      `loc_forest`, the wild threshold. KHM 32's final joke requires a
      stable because Hans imports courtship advice into the livestock
      zone, cuts out animal eyes, and throws them at Grethel.
    tier: phenomenal
    scope: world
    lens: material
    domains: [farm, domestic, livestock, outbuilding]
    related: [sp_cattle, sp_sheep, agency_domestic_labor]
    examples: [loc_clever_hans_stable]

  loc_barn:
    name: Barn
    description: |
      Farm outbuilding for vehicles, fodder, grain, tools, or animals,
      adjacent to the house but not identical with human dwelling space.
    rationale: |
      Distinct from `loc_stable`, where livestock keeping governs the
      scene, and from `loc_house`, where human domestic etiquette
      governs. A barn is a storage and vehicle zone. KHM 41 needs it
      because the mice draw the carriage into the barn before the
      travelling company distributes itself through Herr Korbes's
      house as traps.
    tier: phenomenal
    scope: world
    lens: material
    domains: [farm, storage, vehicle, domestic, outbuilding]
    related: [loc_house, loc_stable, agency_domestic_labor]
    examples: [loc_herr_korbes_barn]

  loc_forge:
    name: Forge
    description: |
      Smithing workplace where iron is heated, shaped, shod, repaired,
      or tested, often converting ordinary bodies or tools into usable
      instruments of departure.
    rationale: |
      Distinct from `loc_stable`, where animals are kept, and from
      `obj_anvil`, the smithing block itself. The forge is the
      production-site: in KHM 108 the rooster becomes a rideable mount
      only after being shod there, and later the second shoeing marks
      Hans's final departure. A universal location supports queries
      over smith-work, shoeing, iron preparation, and transformation of
      tools or mounts before quest movement.
    tier: phenomenal
    scope: world
    lens: material
    domains: [smithing, iron, craft, preparation, departure]
    related: [obj_anvil, sp_rooster, agency_object_mediation, law_sacred_forge_rejuvenates_body]
    examples: [loc_hans_hedgehog_forge, loc_old_man_made_young_forge]

  loc_mill:
    name: Mill
    description: |
      Rural work-site where grain, water, labour, and household meet;
      often placed by a stream, dam, or road and occupied by miller,
      miller's wife, or mill servants.
    rationale: |
      Distinct from `loc_house`, which is generic domestic dwelling,
      and from `loc_hearth`, which is the cooking interior. A mill is
      a labour-house with water and grain infrastructure. KHM 29 needs
      it because the floating child is rescued at the mill-dam and
      adopted by the childless miller couple; later miller families and
      mill-pond tales can reuse the same spatial type.
    tier: phenomenal
    scope: world
    lens: material
    domains: [mill, labour, water, grain, adoption]
    related: [agency_domestic_labor, loc_brook]
    examples: [loc_luck_child_mill]

  loc_hearth:
    name: Hearth
    description: |
      Domestic fire-place where cooking, warming, burning, and household
      transformation occur. It is a small but charged centre of food,
      fire, and domestic labour.
    rationale: |
      Distinct from `loc_house`, which names the whole dwelling, and
      from `loc_forest`, where wild danger begins. The hearth is the
      domestic fire-node: beans become broth, straw becomes fuel, coal
      carries live fire, and many later tales use hearth or stove as
      the place where household material changes state. KHM 18 needs
      the universal because the entire escape begins from hearth logic.
    tier: phenomenal
    scope: world
    lens: material
    domains: [hearth, fire, cooking, domestic, food]
    related: [loc_house, agency_domestic_labor]
    examples: [loc_hearth_straw_coal_bean]

  loc_church:
    name: Church
    description: |
      Christian religious building, often a storage place or sanctuary
      space in Grimm. In KHM 2 the pot of fat is stored under the
      altar.
    rationale: |
      Distinct from `loc_castle` (royal/secular authority) and
      `loc_house` (private domestic). The church is the SACRED-SECULAR
      institutional space — assumed safe, often weaponised as cover
      for transgression (cat goes "to be godmother" → deceptive
      cover). Without the universal we lose the sacred-space
      semantics that several tales lean on.
    tier: phenomenal
    scope: world
    lens: material
    domains: [sacred, institution, storage]

  loc_churchyard:
    name: Churchyard
    description: |
      Burial ground attached to or surrounding a church: a sacred
      public enclosure where graves, tombs, night watches, funeral
      memory, and uncanny encounters can occur outside the church
      building itself.
    rationale: |
      Distinct from `loc_church`, which is the religious building, and
      from `loc_tomb`, which is the individual burial place. A
      churchyard is a shared sacred-death field: the living can enter
      it at night, sit beside particular graves, and encounter the
      dead or their claimants without crossing into a sealed vault.
      The universal supports queries over burial-ground scenes that
      are neither indoor worship nor enclosed tomb confinement.
    tier: phenomenal
    scope: world
    lens: material
    domains: [sacred, grave, burial, death, enclosure]
    related: [loc_church, loc_tomb, threshold_grave]
    examples: [loc_grave_mound_churchyard, loc_singing_bone_churchyard_tomb]

  loc_rome:
    name: Rome
    description: |
      The papal city and seat of Christian institutional authority in
      Grimm's religious register. It marks not just a city but the
      place where sacred office becomes publicly recognised.
    rationale: |
      Distinct from `loc_church`, a building, and from `loc_castle`,
      secular authority. KHM 33 requires Rome because the despised son
      travels there after the frogs' prophecy, enters the church after
      the pope's death, and is chosen by a miraculous token. The city
      anchors papal succession as institutional, not merely private.
    tier: phenomenal
    scope: world
    lens: material
    domains: [city, sacred, papacy, institution]
    related: [loc_church, law_divine_token_confers_office, moral_providential_election]
    examples: [loc_three_languages_rome]

  loc_heaven:
    name: Heaven
    description: |
      The sacred-celestial domain — abode of the divine, of the
      blessed dead, of angels. Distinct from earthly settings in
      that its laws are normative-divine, not magical-arbitrary.
    rationale: |
      Distinct from `loc_castle` (royal-mundane) and from any
      otherworldly magical realm — heaven is specifically the
      religious-register otherworld. Tales that move characters
      into or out of heaven (Mary's child, Christ in some of the
      Children's Legends) are operating in religious-register, and
      the location anchors this.
    tier: phenomenal
    scope: world
    lens: material
    domains: [sacred, celestial, divine]
    related: [being_divine, law_heavenly_rejoicing_marks_rare_rich_salvation]
    examples: [loc_peasant_heaven_gate, loc_peasant_heaven_inside]

  loc_purgatory:
    name: Purgatory
    description: |
      Intermediate afterlife threshold marked by weeping, wailing,
      waiting, and exclusion from both Heaven's blessed order and
      Hell's infernal society.
    rationale: |
      Distinct from `loc_heaven`, where divine gatekeeping governs
      entry, and from `loc_hell`, where devils receive or reject souls.
      Purgatory is a third afterlife door: in KHM 82 it refuses Hansel
      not because he is too holy or too damned, but because his gambling
      would add disorder to an already lamenting place. The slot
      supports queries over Catholic afterlife geography in comic
      religious tales.
    tier: phenomenal
    scope: world
    lens: material
    domains: [afterlife, purgatory, threshold, lament, exclusion]
    related: [loc_heaven, loc_hell, moral_comic_inversion]
    examples: [loc_gambling_hansel_purgatory_door]

  loc_world_below:
    name: World Below
    description: |
      Subterranean region of the dead beneath the living world, where
      graves, sleep, darkness, and afterlife activity can gather
      without being identical to Hell or Purgatory.
    rationale: |
      Distinct from `loc_hell`, which is infernal and devil-governed,
      from `loc_purgatory`, which is a Catholic threshold of lament,
      and from `loc_tomb`, which is a single burial enclosure. KHM 175
      needs this location because the reunited moon pieces illuminate
      a collective underworld: the dead wake, drink, dance, brawl, and
      make noise that reaches heaven. The slot supports queries over
      non-infernal underworld scenes where the dead have social space.
    tier: phenomenal
    scope: world
    lens: material
    domains: [underworld, afterlife, dead, darkness, subterranean]
    related: [state_liminal_dead, loc_heaven, loc_hell, loc_purgatory, loc_tomb]
    examples: [loc_moon_world_below]

  loc_wilderness:
    name: Wilderness
    description: |
      Unstructured exile-space, distinct from the forest. The
      wilderness has no inhabitants, no helpers, no predators — it
      is pure deprivation, where the exiled live on roots and nuts
      in hollow trees, where neither domestic nor magical order
      reaches.
    rationale: |
      Distinct from `loc_forest` (which can be home to predators,
      helpers, witches, dwarfs — a populated magical space). The
      wilderness is a NEGATIVE space: characters are sent there to
      survive purely on endurance. Mary's child queen lives in the
      wilderness, not the forest. Cinderella variants where the
      heroine is exiled often go to wilderness. Worth separating
      because the structural function differs — wilderness is the
      space of pure penance/endurance, not encounter.
    tier: phenomenal
    scope: world
    lens: material
    domains: [exile, deprivation, endurance]
    related: [agency_endurance, arc_repentant_sinner]

  loc_gallows:
    name: Gallows
    description: |
      Execution site, often with hanged corpses still in place. In
      Grimm a liminal-uncanny space where the dead linger and where
      heroes may be tested by encounter with corpses or spirits.
    rationale: |
      Distinct from `loc_castle` (royal/secular) and `loc_wilderness`
      (negative-empty). The gallows is structurally a SPACE OF
      LIMINAL DEAD — neither a graveyard (sacred enclosure) nor a
      wilderness. KHM 4's seven hanged men sit there; the hero
      brings them down to warm by the fire. Worth its own slot
      because the gallows-encounter is a recurring trope (KHM 4,
      possibly others) with distinct grammar.
    tier: phenomenal
    scope: world
    lens: material
    domains: [death, liminal, execution]
    related: [being_spirit]

  loc_tomb:
    name: Tomb / Grave Vault
    description: |
      Enclosed burial-place: grave, tomb, vault, or crypt. A corpse is
      housed there, but the living may also be confined there by vow,
      punishment, ordeal, or attempted burial-alive.
    rationale: |
      Distinct from `loc_gallows`, which is public execution-space,
      and from `loc_church`, which is sacred institution. The tomb is
      death's enclosed domestic analogue: table, coffin, provisions,
      bolts, and sentries can make it a temporary house for the living
      and dead together. KHM 16's royal vault is the plot's first
      resurrection laboratory and deserves a reusable universal.
    tier: phenomenal
    scope: world
    lens: material
    domains: [death, burial, enclosure, corpse, vault]
    related: [threshold_grave, state_bound_by_promise]
    examples: [loc_royal_vault_three_snake_leaves]

  loc_dungeon:
    name: Dungeon
    description: |
      Deep or enclosed prison space under royal, judicial, or household
      authority, used to hold condemned, suspected, or punished figures
      away from ordinary social life.
    rationale: |
      Distinct from `loc_tower`, whose force is vertical isolation,
      and from `loc_tomb`, which belongs to death and burial even when
      the living are confined there. A dungeon is punitive enclosure:
      the king can throw Faithful John into one, and KHM 76's cook is
      cast into the deepest dungeon after exposure. The universal lets
      prison scenes be queried without flattening them into generic
      castle space.
    tier: phenomenal
    scope: world
    lens: material
    domains: [prison, punishment, enclosure, authority, underground]
    related: [state_imprisoned, loc_castle, agency_social_rank]
    examples: [loc_pink_deepest_dungeon]

  loc_meadow:
    name: Meadow
    description: |
      Open green space — pastoral, often where animals graze or
      sleep. Distinct from forest (enclosed-liminal) and
      wilderness (negative-empty): meadow is BENIGN-OPEN.
    rationale: |
      Worth its own slot because the meadow plays a SPECIFIC
      structural role in some tales: it's where the wolf sleeps
      after gorging (KHM 5), where animals gather peacefully (many
      pastoral tales). Distinguishes from forest (which is
      threatening-liminal) — the meadow is the calm-open space.
    tier: phenomenal
    scope: world
    lens: material
    domains: [pastoral, open, daylight]

  loc_field:
    name: Field
    description: |
      Cultivated working land: corn, grain, hay, or crops awaiting
      cutting. It belongs to household economy but demands labour
      rather than leisure or grazing.
    rationale: |
      Distinct from `loc_meadow`, which is open pastoral space, and
      from `loc_garden`, which is enclosed cultivated nature. KHM 34's
      field is a labour site: Hans sends Elsie to cut corn for bread,
      but food and sleep displace work, enabling the bell-net identity
      trick.
    tier: phenomenal
    scope: world
    lens: material
    domains: [agriculture, labour, grain, household-economy]
    related: [agency_domestic_labor, loc_meadow]
    examples: [loc_clever_elsie_field]

  loc_garden:
    name: Garden
    description: |
      Cultivated enclosure attached to a house, castle, or magical
      dwelling. Flowers, herbs, fruit, and forbidden plant-actions
      often concentrate transformation or kinship conditions there.
    rationale: |
      Distinct from `loc_forest` (wild, liminal) and `loc_meadow`
      (open pastoral). The garden is domesticated nature: ordered,
      bounded, and therefore suited to prohibition, plucking, and
      symbolic plant tests. KHM 9's twelve lilies stand in the
      bewitched hut's garden and are materially identical with the
      brothers' fate. A universal `loc_garden` lets queries find tales
      where cultivated plants hold family or transformation stakes.
    tier: phenomenal
    scope: world
    lens: material
    domains: [garden, plants, domestic-nature, transformation]
    related: [loc_house, loc_castle, transform_animal_human]
    examples: [loc_garden_twelve_brothers]

  loc_tree:
    name: Tree
    description: |
      Singular tree used as perch, hiding place, bridge-point, trap,
      gallows-adjacent support, or vertical refuge.
    rationale: |
      Distinct from `loc_forest`, which names the whole wilderness.
      Grimm plots often hinge on a particular tree as a vertical tool:
      the tailor sits above sleeping giants and later dodges behind a
      tree so the unicorn traps its horn; silent brides sit in trees;
      animals nest in them. A universal tree type lets queries find
      these micro-locations without flattening them into forest.
    tier: phenomenal
    scope: world
    lens: material
    domains: [tree, verticality, forest, hiding, trap]
    related: [loc_forest, threshold_forest]
    examples: [loc_giant_tree_brave_tailor, loc_unicorn_tree_brave_tailor]

  loc_thorn_thicket:
    name: Thorn Thicket
    description: |
      Dense growth of thorns, briars, or brambles that tears clothing,
      scratches bodies, blocks movement, or turns forced motion into
      bodily punishment.
    rationale: |
      Distinct from `threshold_thorn_hedge`, which marks an enchanted
      perimeter around Briar Rose's castle, and from generic
      `loc_forest`, which names broad wilderness. The thorn thicket is
      a local injuring medium: in KHM 110 music compels dancing inside
      it, so the bushes themselves become the punitive instrument. A
      universal location supports queries over bramble punishment,
      painful entanglement, and thorn-mediated trials without
      flattening them into forest space.
    tier: phenomenal
    scope: world
    lens: material
    domains: [thorn, thicket, pain, entanglement, punishment]
    related: [threshold_thorn_hedge, loc_forest, agency_violence]
    examples: [loc_jew_thorns_thicket]

  loc_nest:
    name: Nest
    description: |
      Bird or small-animal dwelling, nursery, and kinship seat. In
      animal-political tales it may be treated as a palace or house
      whose honor must be defended.
    rationale: |
      Distinct from `loc_tree`, which is a broad vertical perch or
      support, and from `loc_house`, which is human domestic
      architecture. A nest is an animal household scaled around young,
      feeding, and vulnerability. KHM 102 requires the type because the
      bear misreads the willow-wren's nest as an inadequate royal
      palace; the same place is nursery, house, and sovereign residence.
    tier: phenomenal
    scope: world
    lens: material
    domains: [nest, bird, household, kinship, animal-tale]
    related: [sp_bird, loc_tree, law_insulted_small_royalty_summons_total_war]
    examples: [loc_willow_wren_nest]

  loc_tower:
    name: Tower
    description: |
      Vertically isolated structure, often without ordinary access.
      Used to sequester maidens, guard treasure, test courage, or
      separate a character from social life.
    rationale: |
      Distinct from `loc_castle` (a whole royal complex) and
      `loc_house` (domestic dwelling). A tower is defined by vertical
      inaccessibility: Rapunzel's has no stairs or door, only a high
      window. That spatial grammar creates the need for hair-ladders,
      songs heard from below, and dangerous falls. A universal tower
      type lets queries find vertical confinement and ascent scenes.
    tier: phenomenal
    scope: world
    lens: material
    domains: [tower, verticality, confinement, ascent]
    related: [arc_imprisoned_maiden]
    examples: [loc_tower_rapunzel, loc_church_tower_youth]

  loc_cave:
    name: Cave / Cavern
    description: |
      Hollow underground or mountainside dwelling, often inhabited by
      giants, spirits, animals, or robbers. It is enclosed, oversized,
      and outside domestic law.
    rationale: |
      Distinct from `loc_house` (human domestic) and `loc_tower`
      (built vertical enclosure). The cave is a natural non-human
      house. KHM 20's giants eat by the fire and sleep in oversized
      beds there, making it the spatial counterpart of giant scale.
      Later robber-cave and dwarf-cave tales can reuse the same type.
    tier: phenomenal
    scope: world
    lens: material
    domains: [cave, mountain, giant, enclosure, wilderness]
    related: [being_giant, loc_forest]
    examples: [loc_giant_cavern_brave_tailor]

  loc_hell:
    name: Hell
    description: |
      Infernal underworld or demonic dwelling: black, sooty, dangerous,
      and ruled by devilish beings, yet reachable by a living traveller
      in quest logic.
    rationale: |
      Distinct from `loc_cave` (natural enclosure), `loc_forest`
      (liminal wilderness), and `loc_castle` (secular authority).
      Hell is an ontological region with its own inhabitants and
      knowledge-economy. KHM 29 requires it because the hero must enter
      the devil's home to obtain hairs and answers; later devil tales
      can query infernal descent separately from generic underground
      or wilderness scenes.
    tier: phenomenal
    scope: world
    lens: material
    domains: [hell, infernal, underworld, devil, quest]
    related: [being_devil, threshold_doorway]
    examples: [loc_devil_golden_hairs_hell]

  loc_mountain:
    name: Mountain
    description: |
      Elevated wilderness landform: summit, slope, or high pass where
      travellers meet powerful beings, look over the world, or enter
      caves.
    rationale: |
      Distinct from `loc_forest` (enclosed wilderness) and `loc_tower`
      (built verticality). The mountain is natural elevation. KHM 20's
      tailor meets the first giant at the highest point of the road,
      linking ascent, world-overlook, and giant encounter in a way a
      generic forest label would miss.
    tier: phenomenal
    scope: world
    lens: material
    domains: [mountain, height, wilderness, encounter]
    related: [loc_forest, loc_cave, being_giant]
    examples: [loc_mountain_brave_tailor]

  loc_glass_mountain:
    name: Glass Mountain
    description: |
      Inaccessible or enchanted mountain made of glass, used as a
      slippery crossing test, a magical prison, or a hard threshold
      between ordinary travel and hidden captivity.
    rationale: |
      Distinct from `loc_mountain`, which names elevation alone, and
      from `obj_enchanted_glass_coffin_prison`, which is a portable or
      chamber-like container. The glass mountain is landscape as
      material ordeal: characters must cross, climb, open, or enter a
      transparent-smooth barrier whose glass substance determines what
      kinds of motion are possible. It recurs across Grimm as both
      obstacle and prison, so it deserves a location universal rather
      than a generic mountain instance.
    tier: phenomenal
    scope: world
    lens: material
    domains: [glass, mountain, threshold, prison, ascent]
    related: [loc_mountain, loc_cave, law_glass_mountain_opens_to_underworld_captivity, state_imprisoned]
    examples: [loc_rinkrank_glass_mountain, loc_drummer_glass_mountain, loc_iron_stove_glass_mountain]

  loc_ship:
    name: Ship
    description: |
      Sea-vessel — typically the vehicle of bride-abduction quests
      (KHM 6), trade voyages, or otherworld-passage. A ship is a
      mobile location: characters cross water on it, are confined
      to it, or use it as a deceptive frame.
    rationale: |
      Worth its own slot because ships have a SPECIFIC structural
      role: they are LIMINAL CONFINEMENT-VEHICLES. The princess in
      KHM 6 cannot escape once aboard; the same applies in many
      bride-quest tales. The ship is also the typical scene of
      overheard-prophecy (ravens flying above the ship). Without
      the universal we lose the connective layer between many sea-
      voyage tales.
    tier: phenomenal
    scope: world
    lens: material
    domains: [vessel, mobile, sea, confinement]

  loc_sea:
    name: Sea
    description: |
      Open ocean — the great undifferentiated water-realm between
      lands. Distinct from `loc_river` (linear) and `loc_well`
      (vertical) — sea is HORIZONTAL VAST.
    rationale: |
      Worth its own slot because crossing the sea is structurally
      a tale-mode of OTHERWORLD-PASSAGE in many Grimm tales (KHM 6
      crosses the sea to reach the Golden Dwelling). The sea is
      where prophecy is overheard, where treachery is performed,
      where the hero is bound for return-trip with the captured
      bride.
    tier: phenomenal
    scope: world
    lens: material
    domains: [water, vast, otherworld-passage]

  loc_lake:
    name: Lake
    description: |
      Large enclosed body of still water that can be crossed by ship,
      inhabited by fish, or bordered by otherworldly beings.
    rationale: |
      Distinct from `loc_pond`, which is small and rural, and from
      `loc_sea`, which is vast open passage between lands. The lake is
      bounded but large enough to stage voyage, retrieval, and monster
      encounter at once. KHM 126 needs it because the fish is rescued
      at the shore, the pen falls into the water, and the giant/bird
      passage to the bride's castle is organized across the lake.
    tier: phenomenal
    scope: world
    lens: material
    domains: [water, crossing, shore, fish, quest]
    related: [loc_ship, sp_fish, being_giant]
    examples: [loc_ferdinand_faithful_lake]

  loc_pond:
    name: Pond
    description: |
      Small still body of fresh water — habitation of frogs. Bounded,
      shallow, beside a road; the kind of water a peasant walks past
      on the way home from market.
    rationale: |
      Distinct from `loc_well` (vertical, threshold, often
      otherworldly), from `loc_sea` (vast otherworld-passage), and
      from `loc_meadow` (dry). The pond is the rural-mundane water:
      no threshold-semantics, just the habitat of speaking-frog
      hecklers in schwank tales. Worth a universal because the
      pond-as-roadside-frog-court motif recurs in Grimm beyond KHM 7.
    tier: phenomenal
    scope: world
    lens: material
    domains: [water, rural, frogs]

  loc_marsh:
    name: Marsh
    description: |
      Wetland or swampy ground inhabited by frogs and other liminal
      water creatures. It is neither open road nor enclosed pond, but a
      damp threshold where animal voices can be overheard.
    rationale: |
      Distinct from `loc_pond`, which is a bounded still water, and
      from `loc_brook`, which is flowing water. KHM 33's prophetic
      frogs sit in a marsh on the way to Rome; the location matters
      because it stages prophecy as overheard amphibian speech beside
      a journey, not as a formal oracle.
    tier: phenomenal
    scope: world
    lens: material
    domains: [water, wetland, frogs, threshold]
    related: [sp_frog, speech_prophecy, agency_animal_language]
    examples: [loc_three_languages_marsh]

  loc_brook:
    name: Brook / Spring
    description: |
      Small running freshwater source in forest or wilderness: a place
      of thirst, listening, drinking, and sometimes enchantment.
    rationale: |
      Distinct from `loc_well` (vertical depth/otherworld access),
      `loc_pond` (still water), and `loc_sea` (vast passage). A brook
      is moving, audible water; KHM 11's sister can hear the brook's
      curse as it runs, and drinking from it triggers transformation.
      The universal supports queries for water-as-agent scenes where
      thirst and movement matter more than depth.
    tier: phenomenal
    scope: world
    lens: material
    domains: [water, running-water, thirst, forest]
    related: [law_enchanted_water_transforms, threshold_well]
    examples: [little_brother_third_brook]

  loc_bridge:
    name: Bridge
    description: |
      Built crossing over water, ravine, or road-gap. A bridge is a
      liminal passage where following, betrayal, attack, or recognition
      can happen between two ordered spaces.
    rationale: |
      Distinct from `loc_brook`, which names the water, and from
      `threshold_doorway`, which marks domestic entry. A bridge is a
      transitional structure: KHM 28's murder occurs when the elder
      brother lets the younger go first and strikes from behind halfway
      across. Naming bridges separately supports queries over betrayal
      at crossings and bodies hidden beneath passageways.
    tier: phenomenal
    scope: world
    lens: material
    domains: [bridge, crossing, water, betrayal, threshold]
    related: [loc_brook, agency_violence]
    examples: [loc_bridge_singing_bone]

  loc_river:
    name: River / Stream
    description: |
      Flowing watercourse large enough to carry bodies, barrels,
      boats, or transformed beings. Often marks disposal, return, or
      downstream passage.
    rationale: |
      Distinct from `loc_brook` (small drinking water) and `loc_sea`
      (vast otherworld-passage). Rivers and streams in Grimm are
      horizontal carriers: KHM 13's queen is thrown into a stream and
      returns as a duck through the gutter; the punished barrel rolls
      down into the river. A universal river type lets queries connect
      water-disposal, return, and current-borne punishment scenes.
    tier: phenomenal
    scope: world
    lens: material
    domains: [water, river, current, disposal, return]
    related: [loc_brook, loc_sea]
    examples: [loc_stream_three_little_men]

  loc_inn:
    name: Inn (Wirtshaus)
    description: |
      Rural-roadside drinking and lodging house. Site of money-counting,
      drunken speech, accidental disclosures, the peasant's pause
      between adventures.
    rationale: |
      Distinct from `loc_house` (private domestic) and `loc_castle`
      (royal). The inn is the COMMERCIAL-SEMIPUBLIC space — neither
      home nor authority, where peasants count money, brag, and are
      overheard by informers. Schwank-essential setting; recurs from
      KHM 7 onward (Brother Lustig, Gambling Hansel).
    tier: phenomenal
    scope: world
    lens: material
    domains: [commerce, public, schwank, drink]

  loc_gate:
    name: Gate
    description: |
      Public entry point into town, city, castle, or courtly space.
      Guards, animals, petitioners, and opportunists can gather there
      before the protagonist reaches formal authority.
    rationale: |
      Distinct from `loc_house` (private domestic) and `loc_castle`
      (seat of authority). The gate is the public edge of civic order:
      not yet the court, no longer the open road. KHM 7 needs this
      universal because the town gate is where meat becomes entrusted
      to dogs and where the sentinel intercepts the king's promised
      reward. A `loc_gate` type enables cross-tale queries for liminal
      civic transactions, guard encounters, and overheard bargains.
    tier: phenomenal
    scope: world
    lens: material
    domains: [civic, public, threshold, commerce]
    related: [threshold_gate, loc_castle, loc_inn]
    examples: [loc_town_gate_good_bargain]

  loc_marketplace:
    name: Marketplace
    description: |
      Public commercial square where goods are displayed, priced,
      bought, broken, mocked, or socially witnessed by townspeople.
    rationale: |
      Distinct from `loc_inn`, where commerce is mixed with drink and
      lodging, and from `loc_gate`, the civic edge. The marketplace is
      central public exposure: a character's labour and status become
      visible as sale, failure, or shame. KHM 52 needs it because the
      princess's pottery-selling humiliation only works in an open
      market where buyers, passers-by, and the hussar can turn fragile
      wares into public disgrace.
    tier: phenomenal
    scope: world
    lens: material
    domains: [market, commerce, public, shame, labour]
    related: [agency_domestic_labor, agency_social_rank, moral_humbling_reform]
    examples: [loc_king_thrushbeard_marketplace]


# =============================================================================
# MAGIC_OBJECTS — phenomenal tier, scope: world
# =============================================================================
# Why this category: like locations, universal magic-object types
# enable cross-tale connection. The "golden ball" recurs (Frog King,
# Iron Hans) — that recurrence is queryable only with a universal.

magic_objects:

  obj_golden_ball:
    name: Golden Ball
    description: |
      Princess's plaything. A small, precious, easily-lost token whose
      recovery from a well or pond initiates the plot.
    rationale: |
      The golden ball appears in Frog King AND Iron Hans (where the
      iron man steals it). Its universal status lets us see this as a
      RECURRING NARRATIVE TRIGGER — the lost-toy-as-plot-engine.
      Without the universal, the two tales' balls are unconnected.
    tier: phenomenal
    scope: world
    lens: material
    domains: [royalty, plaything, recovery-from-water]
    related: [loc_well]

  obj_forbidden_key:
    name: Forbidden Key
    description: |
      The specific key — among a set of permitted keys — that opens a
      forbidden door. Mary's 13th key, Bluebeard's wife's small key,
      Fitcher's Bird's key.
    rationale: |
      Distinct from generic keys: the forbidden key carries the
      prohibition. It is the physical object that materialises
      `speech_prohibition` and `law_prohibition_invites_violation`.
      Its presence guarantees that the prohibition will be tested.
      Universal status because the same object-role recurs across
      multiple tales of the type.
    tier: phenomenal
    scope: world
    lens: material
    domains: [key, prohibition, transgression]
    related: [speech_prohibition, law_prohibition_invites_violation]

  obj_delayed_inheritance_key:
    name: Delayed Inheritance Key
    description: |
      Key given in infancy or childhood that remains apparently useless
      until a later threshold, when it opens the hidden place containing
      the child's true inheritance.
    rationale: |
      Distinct from `obj_forbidden_key`, which tempts violation, and
      from ordinary key-sets that merely grant access. The delayed
      inheritance key is a temporal object: it stores godparental
      sponsorship until the child reaches the right age and place. KHM
      126 needs the type because the poor godfather's only gift becomes
      meaningful only when Ferdinand is fourteen and the heath-castle
      appears.
    tier: phenomenal
    scope: world
    lens: material
    domains: [key, inheritance, godparent, childhood, threshold]
    related: [law_delayed_godfather_key_reveals_hidden_inheritance, arc_supernatural_godfather]
    examples: [obj_ferdinand_faithful_key]

  obj_blood_marked_test_token:
    name: Blood-Marked Test Token
    description: |
      Portable object entrusted to a forbidden-room test that records
      transgression by receiving indelible blood or another mark that
      cannot be cleaned away.
    rationale: |
      Distinct from `obj_forbidden_key`, which opens the forbidden
      place. The blood-marked token does not grant access; it proves
      that access occurred. In KHM 46 the egg becomes a forensic
      witness because blood from the murder-room returns however much
      the girl washes it. The universal object supports Bluebeard-type
      queries over portable proof of forbidden knowledge.
    tier: phenomenal
    scope: world
    lens: material
    domains: [blood, proof, prohibition, transgression, test]
    related: [law_prohibition_invites_violation, threshold_forbidden_door, obj_forbidden_key]
    examples: [obj_fitchers_bird_egg]

  obj_speaking_blood_decoy:
    name: Speaking Blood Decoy
    description: |
      Placed drops of blood that answer from separated locations in a
      missing person's voice, imitating presence long enough to delay
      pursuit or discovery.
    rationale: |
      Distinct from `obj_blood_marked_test_token`, where blood records
      forbidden contact as evidence. Speaking blood is active decoy
      matter: it produces voice from stairs, kitchen, and bed, staging
      a false household routine while the heroine flees. KHM 56 needs a
      universal for blood that speaks to conceal, not to accuse.
    tier: phenomenal
    scope: world
    lens: material
    domains: [blood, voice, decoy, household, pursuit]
    related: [law_speaking_blood_decoys_pursuit, agency_object_mediation]
    examples: [obj_sweetheart_roland_blood_drops]

  obj_maternal_blood_token:
    name: Maternal Blood Token
    description: |
      Handkerchief, cloth, or small keepsake marked with a mother's
      blood and entrusted to a departing child as portable protection.
    rationale: |
      Distinct from `obj_blood_marked_test_token`, where blood proves
      forbidden transgression, and from `obj_speaking_blood_decoy`,
      where blood impersonates a fugitive's voice. The Goose Girl's
      three drops of blood are neither evidence nor decoy: they are a
      maternal authority-token that speaks warning and loses its
      protective force only when carried away by the stream. The node
      enables queries over blood as kinship protection.
    tier: phenomenal
    scope: entity
    lens: material
    domains: [blood, mother, token, protection, journey]
    related: [law_maternal_blood_token_guards_rank, affect_maternal_love, speech_testimony]
    examples: [the_goose_girl_blood_handkerchief]

  obj_false_blood_evidence:
    name: False Blood Evidence
    description: |
      Blood from an unrelated victim placed on clothing, bedding,
      tools, or other visible matter to fabricate proof of violence or
      negligent loss.
    rationale: |
      Distinct from `obj_blood_marked_test_token`, where blood records
      a real transgression, and from `obj_speaking_blood_decoy`, where
      blood actively imitates a voice. False blood evidence is inert
      but socially operative: it persuades witnesses or rulers that an
      innocent person is guilty. KHM 76 needs this object because hen's
      blood on the queen's garments manufactures the case against her.
    tier: phenomenal
    scope: world
    lens: material
    domains: [blood, evidence, deception, accusation, garment]
    related: [law_false_blood_evidence_convicts_innocent, obj_forensic_token, speech_lie]
    examples: [obj_pink_chicken_blood]

  obj_elder_wooden_bowl:
    name: Elder's Wooden Bowl / Trough
    description: |
      Low-status eating vessel assigned to an aged family member whose
      spilling, trembling, or bodily decline has made ordinary table
      fellowship inconvenient.
    rationale: |
      Distinct from ordinary food vessels, which simply serve meals,
      and from `obj_forensic_token`, which proves a hidden crime. The
      elder's wooden bowl is a material index of household exclusion:
      it replaces shared tableware with a durable, cheap vessel suited
      to someone treated like a nuisance. KHM 78 needs the object
      because the grandson's future trough makes the parents understand
      the moral reversal.
    tier: phenomenal
    scope: world
    lens: material
    domains: [bowl, food, old-age, household, humiliation]
    related: [arc_neglected_elder, law_child_mirror_reveals_filial_future, moral_filial_reciprocity]
    examples: [obj_old_man_wooden_bowl, obj_grandson_little_trough]

  obj_decoy_bride_doll:
    name: Decoy Bride Doll
    description: |
      Doll, mannequin, dressed bundle, or comparable substitute placed
      where a bride is expected to be, usually to simulate presence
      while the true bride flees.
    rationale: |
      Distinct from `obj_speaking_blood_decoy`, which answers in a
      voice, and from `arc_false_bride`, which names a person occupying
      another's role. The decoy bride doll is a passive object made
      socially legible by clothes, posture, and placement. KHM 66 needs
      it because a straw-doll in the girl's clothes and holding a spoon
      is enough to delay the hare until the maiden has returned to her
      mother.
    tier: phenomenal
    scope: world
    lens: material
    domains: [doll, decoy, bride, substitution, escape]
    related: [law_decoy_bride_buys_escape, agency_object_mediation]
    examples: [obj_hares_bride_straw_doll]

  obj_enchanted_iron_stove_prison:
    name: Enchanted Iron Stove Prison
    description: |
      Iron stove or hearth-object used as an enchanted prison for a
      royal person, speaking from inside until the right bride releases
      him by scraping through the metal.
    rationale: |
      Distinct from ordinary `loc_hearth`, which is household fire
      space, and from `obj_decoy_bride_doll`, which substitutes for a
      person. The enchanted iron stove is both container and voice:
      it hides the prince, issues the bargain, tests substitute brides,
      and becomes the material surface of release. KHM 127 needs the
      type because the bridegroom is not animal-bodied but object-
      enclosed; without this slot object-bridegroom enchantments are
      flattened into generic imprisonment.
    tier: phenomenal
    scope: world
    lens: material
    domains: [stove, iron, imprisonment, enchantment, bridegroom]
    related: [arc_enchanted_prince, state_imprisoned, law_personal_release_promise_rejects_substitutes]
    examples: [obj_iron_stove_prison]

  obj_enchanting_wand:
    name: Enchanting Wand
    description: |
      Portable wand or rod used by a witch, helper, or fugitive to
      perform intentional transformations or other directed magic.
    rationale: |
      Distinct from `obj_forbidden_key`, which grants access, and from
      `obj_spinning_wheel`, which channels labour. The wand is a
      hand-held authorization device for shape-changing: in KHM 56 the
      heroine steals the witch's wand and uses it to transform herself
      and Roland through the magic flight. This object type supports
      queries over portable transformation technology.
    tier: phenomenal
    scope: world
    lens: material
    domains: [magic-object, wand, transformation, witchcraft, flight]
    related: [transform_fugitive_pair, law_loyal_pair_magic_flight, being_witch]
    examples: [obj_sweetheart_roland_magic_wand]

  obj_sacred_answering_image:
    name: Sacred Answering Image
    description: |
      Holy statue, icon, or relic that can answer in a human's place
      during an ordeal, serving as both devotional image and active
      speech proxy.
    rationale: |
      Distinct from `obj_speaking_blood_decoy`, whose voice belongs to
      life-substance, and from ordinary church furniture or relics that
      remain passive. This object type is sacred material with agency:
      the St. Christopher images nod and answer the father's hourly
      calls, satisfying the watch-rule while the prince sleeps. KHM 113
      needs it to query saint-image intervention separately from blood
      decoys, magic wands, or helper speech.
    tier: phenomenal
    scope: world
    lens: material
    domains: [sacred-image, proxy, speech, ordeal, sleep]
    related: [law_sacred_proxy_answers_watch, agency_object_mediation, loc_bedchamber]
    examples: [obj_two_kings_st_christopher_images]

  obj_summoning_handkerchief:
    name: Summoning Handkerchief
    description: |
      Cloth or handkerchief that, when knotted, struck, or otherwise
      ritually handled with a spoken formula, summons hidden helpers to
      appear and work.
    rationale: |
      Distinct from `obj_maternal_blood_token`, which protects by
      kinship authority, and from `obj_hidden_bride_token`, which
      communicates identity. The summoning handkerchief is not a
      keepsake or recognition token; it is an operational call-device.
      In KHM 113 the princess knots and strikes the cloth on the earth
      to command earth-workers, then uses it again to dismiss them.
    tier: phenomenal
    scope: world
    lens: material
    domains: [handkerchief, summoning, formula, helper, labor]
    related: [law_summoned_earth_workers_complete_tasks, agency_speech, agency_object_mediation]
    examples: [obj_two_kings_knotted_handkerchief]

  obj_sleeping_draught:
    name: Sleeping Draught
    description: |
      Drink or food deliberately given to put a bridegroom, guard, or
      witness into unnatural sleep so that speech, recognition, or
      rescue fails for a night.
    rationale: |
      Distinct from `state_enchanted_sleep`, which names a broader
      suspended condition, and from ordinary food objects. The sleeping
      draught is tactical and social: someone administers it to block
      hearing at the exact recognition moment. KHM 88 and KHM 113 both
      need the type because the faithful bride's access is temporarily
      neutralized not by locked space alone, but by drugged sleep.
    tier: phenomenal
    scope: world
    lens: material
    domains: [sleep, drink, recognition, deception, night]
    related: [state_enchanted_sleep, law_voice_recognizes_forgotten_bride, state_forgotten_bride]
    examples: [obj_lark_sleeping_draught, obj_two_kings_sleeping_drink]

  obj_disenchanting_flower:
    name: Disenchanting Flower
    description: |
      Magical flower whose touch cancels enchantment, opens sealed
      spaces, restores transformed beings, or disables hostile magic.
    rationale: |
      Distinct from `obj_enchanting_wand`, which performs magic by
      directed use, and from `obj_form_binding_bridle`, which sustains
      a transformed form. The disenchanting flower is a botanical
      counter-agent: its power lies in contact, recognition, and
      restoration rather than command. KHM 69 needs this object type
      because the blood-red flower with pearl-like dew is the material
      bridge between dream-knowledge and the undoing of witchcraft.
    tier: phenomenal
    scope: world
    lens: material
    domains: [flower, counter-magic, restoration, touch, witchcraft]
    related: [law_disenchanting_flower_breaks_witchcraft, state_transformed, being_witch]
    examples: [obj_jorinda_joringel_blood_red_flower]

  obj_four_leaf_truth_clover:
    name: Four-Leaf Truth Clover
    description: |
      Four-leaf clover whose possession grants truth-sight, making
      magical deception fail before the bearer's perception and speech.
    rationale: |
      Distinct from `obj_disenchanting_flower`, which works by touch to
      release beings and magical space, and from generic lucky plants.
      The four-leaf clover in KHM 149 does not produce wealth or a
      wish; it changes epistemic access. The girl sees the beam as
      straw because the clover makes her "so wise that no deception
      could stand out against her." A universal object supports
      queries over botanical truth-sight and disenchantment by seeing.
    tier: phenomenal
    scope: world
    lens: material
    domains: [clover, sight, truth, illusion, disenchantment]
    related: [law_four_leaf_clover_sight_breaks_illusion, state_deceived, being_wizard]
    examples: [obj_beam_four_leaf_clover]

  obj_form_binding_bridle:
    name: Form-Binding Bridle
    description: |
      Bridle, harness, collar, or similar fitted equipment that keeps a
      shapeshifter constrained in animal form until removed.
    rationale: |
      Distinct from ordinary horse tack and from `obj_enchanting_wand`,
      which authorizes active magic. The form-binding bridle is a
      restraint object: it attaches to the transformed body and blocks
      return to human agency. KHM 68 needs a universal because the
      apprentice explicitly warns that the bridle must be removed after
      sale; when the father forgets, ownership and bodily freedom shift
      to the master-thief until the maid removes it.
    tier: phenomenal
    scope: world
    lens: material
    domains: [bridle, restraint, transformation, horse, control]
    related: [law_form_binding_object_blocks_return, transform_shapeshift_duel, sp_horse]
    examples: [obj_thief_master_bridle]

  obj_many_league_boots:
    name: Many-League Boots / Seven-League Boots
    description: |
      Magical footwear that compresses travel distance so each step
      covers an hour's walk, many leagues, or another impossible span.
    rationale: |
      Distinct from `obj_recognition_shoe`, whose power is identifying
      the rightful person by fit. Many-league boots do not recognize;
      they accelerate pursuit or travel, changing spatial scale. KHM 56
      needs this type because the witch's pursuit becomes dangerous
      only after she puts on boots where every step covers an hour's
      walk.
    tier: phenomenal
    scope: world
    lens: material
    domains: [magic-object, footwear, travel, pursuit, distance]
    related: [threshold_forest, law_loyal_pair_magic_flight, agency_endurance]
    examples: [obj_sweetheart_roland_many_league_boots]

  obj_wishing_ring:
    name: Wishing Ring
    description: |
      Magical ring whose turning, wearing, or spoken wish transports
      the bearer or summons others to the bearer's location.
    rationale: |
      Distinct from `obj_hidden_bride_token`, where a ring reveals
      identity through recognition, and from generic wish-speech where
      no object mediates the act. The wishing ring is a portable
      transport-and-summoning device. KHM 92 needs it because the
      ring's obedience both enables homecoming and exposes promise-
      breach when the king summons his wife and child against her
      condition.
    tier: phenomenal
    scope: world
    lens: material
    domains: [ring, wish, transport, promise, magic-object]
    related: [law_wishing_ring_obeys_but_exposes_broken_promise, speech_wish]
    examples: [the_king_of_the_golden_mountain_ring, obj_strong_hans_summoning_ring]

  obj_invisibility_cloak:
    name: Invisibility Cloak
    description: |
      Magical cloak or mantle that makes the wearer unseen, allowing
      theft, infiltration, escape, or secret entry into hostile spaces.
    rationale: |
      Distinct from `obj_fur_disguise_mantle`, which hides social rank
      under animal-like clothing, and from `state_disguised`, where
      the wearer remains visible under a false surface. Invisibility is
      absence from sight. KHM 92 needs this object because the hero
      uses the giants' cloak to enter the false wedding unseen and
      control the banquet before revealing himself.
    tier: phenomenal
    scope: world
    lens: material
    domains: [cloak, invisibility, infiltration, magic-object]
    related: [state_hidden_identity, agency_cunning, law_quarreling_giants_lose_magic_objects]
    examples: [the_king_of_the_golden_mountain_cloak]

  obj_wishing_cloak:
    name: Wishing Cloak
    description: |
      Magical cloak or mantle that transports the wearer to a desired
      place as soon as the cloak is thrown over the shoulders and a
      destination is wished.
    rationale: |
      Distinct from `obj_invisibility_cloak`, which hides the wearer,
      and from `obj_wishing_ring`, which performs wish-transport
      through a ring. The wishing cloak is wearable locomotion: it
      turns a garment into instant travel across ordinary distance.
      KHM 122 needs this object because the huntsman's ascent to the
      Garnet Mountain, betrayal there, and later loss of mobility all
      depend on mantle-mediated transport.
    tier: phenomenal
    scope: world
    lens: material
    domains: [cloak, wish, transport, garment, magic-object]
    related: [speech_wish, agency_object_mediation, obj_invisibility_cloak, obj_wishing_ring]
    examples: [obj_donkey_cabbages_wishing_cloak]

  obj_form_binding_ring:
    name: Form-Binding Ring
    description: |
      Ring whose possession sustains or releases a transformed body
      rather than merely proving identity or granting wishes.
    rationale: |
      Distinct from `obj_wishing_ring`, which obeys wish-speech, and
      from `obj_betrothal_recognition_token`, which confirms a
      relationship. A form-binding ring is an enchantment control
      token: while the witch possesses it, the prince remains tree/dove
      and cannot regain human form. KHM 123 needs the object type for
      queries over rings that govern metamorphosis directly.
    tier: phenomenal
    scope: world
    lens: material
    domains: [ring, transformation, enchantment, witch, release]
    related: [law_plain_ring_breaks_tree_dove_enchantment, state_transformed, transform_plant_human]
    examples: [obj_old_woman_wood_plain_ring]

  obj_decapitating_sword:
    name: Decapitating Command Sword
    description: |
      Magical sword that executes a verbal formula by cutting off every
      head except the speaker's.
    rationale: |
      Distinct from ordinary weapons and from `obj_cudgel_in_sack`,
      whose power is beating. This sword fuses weapon and command-
      speech: the phrase "all heads off but mine" produces immediate
      mass decapitation. KHM 92 needs the object because final kingship
      is restored not by duel but by formulaic sovereign violence.
    tier: phenomenal
    scope: world
    lens: material
    domains: [sword, command, decapitation, violence, magic-object]
    related: [agency_violence, speech_command, law_quarreling_giants_lose_magic_objects]
    examples: [the_king_of_the_golden_mountain_sword]

  obj_keys_of_heaven:
    name: Keys of Heaven
    description: |
      The set of keys to the 13 doors of heaven in Mary's keeping —
      twelve permitted, one (the 13th) forbidden.
    rationale: |
      Universal type that distinguishes this specific religious-tale
      motif from generic key-sets. The 12+1 structure encodes
      `num_12` (cosmic completion) + `num_13` (transgressive excess).
    tier: phenomenal
    scope: world
    lens: material
    domains: [sacred, key, prohibition]
    related: [obj_forbidden_key, num_12, num_13]

  obj_anvil:
    name: Anvil
    description: |
      Smith's working block. In Grimm a frequent site of
      strength-tests — the smith's apprentice cleaves it, the iron
      man bends it, the hero traps the bearded giant by splitting
      it and burying his beard in the crack.
    rationale: |
      Universal type because the anvil-test recurs (KHM 4, Iron Hans
      KHM 136, others). It is a SPECIFIC tale-grammar slot: the
      mundane object that becomes the arena of strength-display.
    tier: phenomenal
    scope: world
    lens: material
    domains: [strength, smithing, trial]

  obj_dangerous_portrait:
    name: Dangerous Portrait
    description: |
      Painted image of a (usually royal, usually female) figure
      whose mere viewing triggers `affect_love_at_first_sight` so
      intense that the viewer faints and resolves to win the
      depicted person at any cost. Distinct from ordinary portraits.
    rationale: |
      Universal because the portrait-as-bride-quest-trigger recurs
      (KHM 6 paradigm; also King of the Golden Mountain variants).
      The portrait is not decorative — it is a magic_object whose
      EFFECT on the viewer initiates the quest. Naming it as
      universal lets us connect tales structured by this trigger.
    tier: phenomenal
    scope: world
    lens: material
    domains: [image, love, danger, royalty]
    related: [affect_love_at_first_sight]
    examples: [faithful_john_princess_portrait]

  obj_fiddle:
    name: Fiddle
    description: |
      Portable bowed string instrument whose playing can attract,
      delight, or compel listeners. In music-tales it is not merely an
      entertainment object but the material focus of `agency_music`.
    rationale: |
      Distinct from generic treasure or tool: the fiddle is the
      repeatable instrument through which musical compulsion becomes
      plot-action. KHM 8 uses the fiddle to draw wolf, fox, hare, and
      woodcutter through the forest; KHM 110 uses fiddle-music to force
      dancing in thorns. A universal `obj_fiddle` lets queries connect
      musical agency to its material carrier across tales rather than
      treating each instrument as isolated prop-data.
    tier: phenomenal
    scope: world
    lens: material
    domains: [music, instrument, compulsion, sound]
    related: [agency_music, law_music_attracts]
    examples: [obj_fiddle_strange_musician]

  obj_never_miss_gun:
    name: Never-Miss Gun
    description: |
      Firearm that always hits whatever the bearer aims at, turning
      marksmanship from skill into guaranteed magical accuracy.
    rationale: |
      Distinct from ordinary weapons and from `obj_fiddle`, whose
      power is musical compulsion. The never-miss gun is a donor-gift
      that collapses chance and skill: in KHM 110 the servant can bring
      down the bird in the thorn-bushes because the gun hits everything
      he aims at. A universal object supports later perfect-aim weapon
      variants without confusing them with mundane firearms.
    tier: phenomenal
    scope: world
    lens: material
    domains: [weapon, gun, marksmanship, donor-gift, accuracy]
    related: [agency_object_mediation, agency_violence]
    examples: [obj_jew_thorns_never_miss_gun]

  obj_far_seeing_telescope:
    name: Far-Seeing Telescope
    description: |
      Optical instrument that lets its bearer see hidden or distant
      events on earth or in heaven, turning knowledge of location into
      a quest-solving craft.
    rationale: |
      Distinct from `obj_truth_mirror`, which answers status questions,
      and from `obj_never_miss_gun`, which guarantees action after a
      target is found. The far-seeing telescope is a knowledge tool:
      it reveals the princess on the sea-rock before any rescue can
      begin. KHM 129 needs the object because the astronomer's craft is
      materialized in the glass, not in animal language, prophecy, or
      ordinary scouting.
    tier: phenomenal
    scope: world
    lens: material
    domains: [vision, instrument, knowledge, distance, quest]
    related: [agency_object_mediation, law_coordinated_crafts_complete_rescue]
    examples: [obj_four_skilful_telescope]

  obj_bagpipes:
    name: Bagpipes
    description: |
      Portable wind instrument whose music can mark uncanny presence,
      attract attention, and give a marginal figure audible agency at
      a distance.
    rationale: |
      Distinct from `obj_fiddle`, a bowed string instrument usually
      tied to dance-compulsion. Bagpipes in KHM 108 work as forest
      broadcast: kings hear beautiful music before they see the strange
      cock-mounted hedgehog, and the sound becomes his means of being
      encountered from above. A separate object keeps pipe, fiddle, and
      song-based agency queryable without flattening all music into one
      prop.
    tier: phenomenal
    scope: world
    lens: material
    domains: [music, instrument, sound, forest, attraction]
    related: [agency_music, law_music_attracts]
    examples: [obj_hans_hedgehog_bagpipes]

  obj_lute:
    name: Lute
    description: |
      Portable plucked string instrument whose mastered performance
      gives an otherwise marginal or uncanny figure courtly presence.
    rationale: |
      Distinct from `obj_fiddle`, whose Grimm use often compels
      dancing, and from `obj_bagpipes`, which broadcasts uncanny
      presence across forest distance. The lute in KHM 144 is refined
      learned art: the donkey's unsuitable fore-feet should make
      mastery impossible, but his perseverance turns music into a
      passport through the gate and into the royal court. A universal
      lute object lets courtly musical legitimacy be queried separately
      from dance-compulsion or animal-helper calls.
    tier: phenomenal
    scope: world
    lens: material
    domains: [music, instrument, court, refinement, animal-bridegroom]
    related: [agency_music, law_music_attracts, arc_hybrid_outcast_bridegroom]
    examples: [obj_donkey_lute]

  obj_animal_helper_flute:
    name: Animal-Helper Flute
    description: |
      Small wind instrument given by a grateful animal; playing it
      summons that animal's aid, especially to retrieve something lost
      in water.
    rationale: |
      Distinct from `obj_fiddle`, whose power compels listeners, and
      from `obj_bagpipes`, which broadcasts presence. The animal-helper
      flute is a reciprocal call-token: its music activates a specific
      rescued animal's promise. KHM 126 needs the object because the
      fish's aid is not constant companionship but an instrument-
      mediated rescue of the pen dropped into the lake.
    tier: phenomenal
    scope: world
    lens: material
    domains: [music, instrument, animal-helper, water, retrieval]
    related: [law_rescued_animals_repay_kindness, agency_animal_aid, sp_fish]
    examples: [obj_ferdinand_faithful_flute]

  obj_singing_bone:
    name: Singing Bone
    description: |
      Human bone or bone-instrument that sings the truth of a hidden
      murder when played or handled.
    rationale: |
      Distinct from ordinary instruments such as `obj_fiddle`, whose
      music attracts or compels, and from corpse locations such as
      `loc_tomb`. The singing bone is both body-remnant and testimony
      device: its music is evidentiary speech. KHM 28 needs a universal
      object so later truth-bearing remains or bone-instruments can be
      connected across murder-revelation tales.
    tier: phenomenal
    scope: world
    lens: material
    domains: [bone, music, testimony, murder, relic]
    related: [law_dead_matter_reveals_murder, speech_testimony, agency_music]
    examples: [singing_bone_horn]

  obj_forensic_token:
    name: Forensic Token
    description: |
      Body part, garment, ring, blood-marked item, or death-adjacent
      object that materially proves a concealed crime before witnesses.
    rationale: |
      Distinct from `obj_singing_bone`, which actively sings or speaks,
      and from `obj_recognition_shoe`, which identifies a rightful
      person by fit. A forensic token does not need to speak; its
      evidentiary force comes from being a material fragment of the
      crime-scene. KHM 40's severed finger with the gold ring turns the
      bride's "dream" narration into public proof.
    tier: phenomenal
    scope: world
    lens: material
    domains: [evidence, murder, body, token, judgment]
    related: [law_dead_matter_reveals_murder, speech_testimony, agency_object_mediation]
    examples: [obj_robber_bridegroom_finger_ring]

  obj_redeeming_shirt:
    name: Redeeming Shirt
    description: |
      Shirt or garment sewn as part of an enchantment-breaking task;
      when placed on a transformed body, it restores the human form it
      properly covers.
    rationale: |
      Distinct from `obj_forensic_token`, which proves a hidden truth,
      and from ordinary clothing, which only marks status or modesty.
      The redeeming shirt has operative material agency: fibre,
      stitching, duration, and bodily fit determine whether the curse is
      lifted fully or only partially. KHM 49 needs this object type
      because the starwort shirts are not props but the exact release
      instruments for the swan-brothers, with the missing sleeve
      preserving a swan wing.
    tier: phenomenal
    scope: world
    lens: material
    domains: [garment, textile, restoration, transformation, kinship]
    related: [law_redeeming_garments_restore_body, agency_domestic_labor, transform_animal_human]
    examples: [six_swans_starwort_shirts]

  obj_prosthetic_hands:
    name: Prosthetic Hands
    description: |
      Artificial replacement hands made of precious or crafted material,
      given to a maimed character to restore social appearance and some
      bodily function before full natural restoration.
    rationale: |
      Distinct from ordinary garments or tools because prosthetic hands
      stand between body and object: they mark wound, status, care, and
      recognition. In KHM 31 silver hands allow the king to honour and
      marry the maimed woman, but later their absence proves that her
      natural hands have been restored by God. A universal object lets
      body-restoration and recognition queries connect similar
      prosthetic or replacement-limb motifs.
    tier: phenomenal
    scope: world
    lens: material
    domains: [body, hand, prosthesis, silver, recognition]
    related: [state_maimed, moral_restorative]
    examples: [obj_silver_hands_girl_without_hands]

  obj_rejoining_salve:
    name: Rejoining Salve
    description: |
      Portable curative ointment that causes severed or removed body
      parts to join directly to a body when smeared on the wound.
    rationale: |
      Distinct from `obj_prosthetic_hands`, which replaces missing
      limbs with crafted artificial objects, and from
      `obj_life_restoring_leaves`, which revives the dead as a whole.
      Rejoining salve is technical medicine: it makes anatomical
      attachment possible, but does not guarantee that the attached
      part is the original one. KHM 118 needs this object because the
      surgeons' art works materially while still producing wrong-body
      comic consequences.
    tier: phenomenal
    scope: world
    lens: material
    domains: [medicine, body, salve, surgery, repair]
    related: [transform_resurrection_by_remedy, law_mismatched_body_parts_transfer_agency, state_maimed]
    examples: [obj_army_surgeons_rejoining_salve]

  obj_spinning_wheel:
    name: Spinning Wheel / Distaff Work
    description: |
      Tool-system for spinning flax or thread: wheel, treadle, distaff,
      wetting, twisting, and skein-making. In Grimm it often marks
      feminine domestic labour, marriage-worthiness, or its comic
      rejection.
    rationale: |
      Distinct from generic tools because spinning is a recurring
      gendered labour-test with symbolic force. KHM 14's three rooms
      of flax, the helpers' deformed bodies, and the bridegroom's final
      ban all hinge on spinning technology. A universal object lets us
      connect spinning wheels, flax rooms, and spindle/shuttle/needle
      tales without collapsing them into undifferentiated work.
    tier: phenomenal
    scope: world
    lens: material
    domains: [spinning, labour, textile, domestic]
    related: [agency_domestic_labor, arc_grotesque_task_helper]
    examples: [obj_flax_rooms_three_spinning_women]

  obj_charmed_textile_tools:
    name: Charmed Textile Tools
    description: |
      Inherited spindle, shuttle, needle, reel, or related textile
      implements that retain blessing, move autonomously, weave or sew
      with supernatural speed, and mediate courtship or recognition.
    rationale: |
      Distinct from `obj_spinning_wheel`, which names the labour
      technology, and from `obj_needle_thread`, which can repair bodies
      or garments without acting as a courtship agent. Charmed textile
      tools are tool-agents: they carry the household's virtue outward
      and make private industry publicly legible. KHM 188 needs this
      object because spindle, shuttle, and needle perform three linked
      actions that no single ordinary tool slot captures.
    tier: phenomenal
    scope: world
    lens: material
    domains: [textile, tool, magic-object, craft, courtship, domestic]
    related: [law_textile_tools_summon_wooer_and_prepare_house, agency_domestic_labor, agency_object_mediation]
    examples: [obj_spindle_shuttle_needle]

  obj_edible_house:
    name: Edible House
    description: |
      Dwelling made from food, sweets, bread, cake, sugar, gingerbread,
      or analogous edible materials. It presents shelter and abundance
      while functioning as lure or trap.
    rationale: |
      Distinct from `loc_house`, which is a place-type, and from
      ordinary food. The edible house fuses architecture and appetite:
      hungry children read it as rescue, while the predator uses it as
      bait. KHM 15's bread-cake-sugar house is the paradigm. A universal
      object lets queries connect food-architecture, hunger lures, and
      predator hospitality across variants.
    tier: phenomenal
    scope: world
    lens: material
    domains: [food, house, lure, hunger, predation]
    related: [loc_house, arc_predator, law_forest_suspends_domestic_order]
    examples: [obj_witch_edible_house_hansel_gretel]

  obj_life_restoring_leaves:
    name: Life-Restoring Leaves
    description: |
      Plant leaves or herb-token whose contact with a corpse's wounds,
      eyes, mouth, or analogous life-points restores breath, blood,
      and bodily animation.
    rationale: |
      Distinct from `transform_resurrection_by_remedy`, which names
      the process, and from generic plants or food. The leaves are the
      portable material carrier of revival-power: they can be observed,
      picked up, guarded by a servant, and reused. KHM 16's three green
      snake-leaves require a universal object so later healing-herb
      tales can connect object, law, and transformation mode.
    tier: phenomenal
    scope: world
    lens: material
    domains: [leaf, herb, resurrection, medicine, snake]
    related: [law_serpent_medicine_restores_life, transform_resurrection_by_remedy, sp_snake]
    examples: [obj_three_green_snake_leaves]

  obj_life_restoring_root:
    name: Life-Restoring Root
    description: |
      Healing root fetched from a distant mountain and placed in the
      mouth of the dead or wounded to restore life and repair bodily
      rupture.
    rationale: |
      Distinct from `obj_life_restoring_leaves`, which are learned
      from serpent medicine, and from `obj_death_diagnostic_remedy`,
      which works only under Death's jurisdiction. The life-root in
      KHM 60 belongs to the animal-helper economy: the hare knows its
      mountain source, fetches it in time, and the root rejoins a
      severed head. A separate object lets plant-resurrection remedies
      be queried by material form and narrative source.
    tier: phenomenal
    scope: world
    lens: material
    domains: [root, resurrection, medicine, mountain, animal-helper]
    related: [law_life_root_restores_dismembered_body, transform_resurrection_by_remedy, arc_animal_helper]
    examples: [obj_two_brothers_life_root]

  obj_water_of_life:
    name: Water of Life
    description: |
      Life-restoring liquid that revives a dead, wounded, or decapitated
      body when applied by a helper or rescuer.
    rationale: |
      Distinct from `obj_life_restoring_leaves` and
      `obj_life_restoring_root`, which are vegetal remedies. Water of
      Life is a liquid resurrection substance, often held in a bottle
      or fetched from a distant source. KHM 92 uses it when the
      princess rubs the silent sufferer back to life after the black
      men cut off his head; KHM 97 will later make it a quest object.
    tier: phenomenal
    scope: world
    lens: material
    domains: [water, resurrection, healing, remedy, life]
    related: [transform_resurrection_by_remedy, moral_restorative]
    examples: [the_king_of_the_golden_mountain]

  obj_death_diagnostic_remedy:
    name: Death-Diagnostic Remedy
    description: |
      Water, herb, or analogous remedy granted by a supernatural
      godfather that heals only when Death's position permits healing
      and otherwise confirms that death is unavoidable.
    rationale: |
      Distinct from `obj_life_restoring_leaves`, which revive an
      already dead body by material technique. The death-diagnostic
      remedy is conditional: it does not overpower Death, but operates
      inside Death's jurisdiction. KHM 42 uses water and KHM 44 uses an
      herb; both need one universal object so ATU 332 can be queried
      by remedy-function rather than substance.
    tier: phenomenal
    scope: world
    lens: material
    domains: [medicine, death, diagnosis, water, herb]
    related: [law_death_position_determines_healing, being_death, arc_supernatural_godfather]
    examples: [obj_godfather_wonderful_water, obj_godfather_death_herb]

  obj_life_candle:
    name: Life-Candle
    description: |
      Candle-flame that embodies and measures a person's remaining
      life; when the flame goes out, the corresponding person dies.
    rationale: |
      Distinct from generic fire or hearth-light, which warms, cooks,
      or destroys. A life-candle is an external life-token controlled
      in Death's domain. It is not a remedy, weapon, or prophecy: it
      is the material index of lifespan. KHM 44 needs a universal
      object so the candle cave can be queried as life-measurement
      rather than ordinary illumination.
    tier: phenomenal
    scope: world
    lens: material
    domains: [candle, life, death, measure, flame]
    related: [law_life_candle_measures_lifespan, being_death, loc_cave]
    examples: [obj_godfather_death_life_candles, obj_godfather_death_physician_candle]

  obj_gallows_dew:
    name: Gallows Dew
    description: |
      Night dew collected from grass beneath or around the gallows,
      able to restore stolen or lost sight when applied to empty eye
      sockets.
    rationale: |
      Distinct from `obj_death_diagnostic_remedy`, which diagnoses
      Death's permission to heal, and from `obj_life_restoring_leaves`,
      which revive the dead by vegetal medicine. Gallows dew is a
      liminal execution-place substance: it is ordinary moisture
      transformed by contact with death-space and revealed through the
      hanged men's speech. KHM 107 needs the universal so restored-
      eyesight episodes can be queried by material remedy and place.
    tier: phenomenal
    scope: world
    lens: material
    domains: [dew, gallows, healing, blindness, liminal]
    related: [law_gallows_dew_restores_stolen_eyes, loc_gallows, state_blind]
    examples: [obj_two_travellers_gallows_dew]

  obj_language_granting_food:
    name: Language-Granting Food
    description: |
      Secret or marked food, usually animal flesh, whose tasting grants
      the eater understanding of animal speech.
    rationale: |
      Distinct from ordinary food and from `obj_life_restoring_leaves`,
      which heals death. Language-granting food changes perception and
      knowledge, not vitality. KHM 17's covered dish of white snake
      flesh gives the servant access to hidden animal reports; a
      universal object connects this material token to the cognitive
      law and agency mode it unlocks.
    tier: phenomenal
    scope: world
    lens: material
    domains: [food, animal-language, knowledge, snake, ingestion]
    related: [law_ingested_animal_grants_language, agency_animal_language, sp_snake]
    examples: [obj_white_snake_dish]

  obj_giant_turnip:
    name: Giant Turnip
    description: |
      Enormous cultivated root vegetable whose impossible size turns
      ordinary subsistence agriculture into a courtly marvel and gift.
    rationale: |
      Distinct from abundance objects such as `obj_wishing_table`,
      which magically produce food on command, and from ordinary food,
      which is valuable because it can be eaten. The giant turnip in
      KHM 146 is too singular for market or kitchen value: its scale
      makes it a present for the king, and royal wonder converts it
      into wealth. A universal object supports queries over agrarian
      marvels where excess size, not enchantment, generates value.
    tier: phenomenal
    scope: world
    lens: material
    domains: [food, root-crop, agriculture, marvel, gift]
    related: [law_marvel_gift_revalues_humble_crop, agency_object_mediation]
    examples: [obj_turnip_giant_turnip]

  obj_self_cooking_pot:
    name: Self-Cooking Pot
    description: |
      Small vessel that produces cooked food when addressed by a start
      formula and stops only when addressed by the matching stop
      formula.
    rationale: |
      Distinct from `obj_wishing_table`, which provides a whole table
      setting, and from `obj_wishing_cloth`, which supplies ready food
      across a surface. A self-cooking pot is a container-process: it
      continuously cooks from within and can therefore overflow if the
      command sequence is incomplete. KHM 103 needs the universal
      because the little pot is both hunger remedy and flood engine.
    tier: phenomenal
    scope: world
    lens: material
    domains: [pot, food, abundance, formula, cooking]
    related: [law_unchecked_formula_abundance_floods_world, law_formula_commands_magic_objects, agency_object_mediation]
    examples: [obj_sweet_porridge_pot]

  obj_transforming_cabbages:
    name: Transforming Cabbages
    description: |
      Paired cabbages or cabbage leaves whose eating changes a human
      into a donkey/ass or restores donkey-form back to human shape.
    rationale: |
      Distinct from `obj_poisoned_food`, which harms or suspends life,
      and from `obj_language_granting_food`, which changes perception.
      Transforming cabbages alter species-form directly and are paired:
      bad cabbage animalises, good cabbage restores. KHM 122 needs the
      object because the same food first traps the hero, then becomes
      his exact instrument of retributive justice.
    tier: phenomenal
    scope: world
    lens: material
    domains: [food, cabbage, donkey, transformation, reversal]
    related: [law_transforming_cabbages_alternate_human_donkey_form, transform_animal_human, sp_donkey]
    examples: [obj_donkey_cabbages_bad_cabbage, obj_donkey_cabbages_good_cabbage]

  obj_life_apple:
    name: Apple of Life
    description: |
      Golden or life-giving apple from the Tree of Life, eaten or
      divided to produce love, vitality, long life, or marriage closure.
    rationale: |
      Distinct from generic fruit, treasure, or healing leaves. The
      Apple of Life is both quest-object and consummation food: it must
      be fetched from a remote life-tree and then shared to transform
      the relational state of the bride. KHM 17 makes it the final
      task-object that turns proud refusal into mutual love.
    tier: phenomenal
    scope: world
    lens: material
    domains: [apple, tree-of-life, love, vitality, quest-object]
    related: [affect_love_at_first_sight, moral_kindness_rewarded]
    examples: [obj_golden_apple_white_snake]

  obj_life_strength_ring:
    name: Life-Tree Strength Ring
    description: |
      Ring hanging before a life-apple that must be passed through to
      take the fruit; once closed on the arm, it pours bodily strength
      into the bearer and marks rightful possession.
    rationale: |
      Distinct from `obj_wishing_ring`, which grants spoken wishes,
      and from `obj_betrothal_recognition_token`, which verifies a
      relationship. The life-strength ring is a threshold-object for a
      quest fruit: it tests reach, transfers power into the body, and
      proves who truly won the apple. KHM 121 needs this object type
      because the giant's bride does not accept the apple without the
      ring, and the giant's attempts to steal it structure the first
      half of the tale.
    tier: phenomenal
    scope: world
    lens: material
    domains: [ring, tree-of-life, strength, recognition, quest]
    related: [law_life_ring_confers_strength_and_lion_mastery, obj_life_apple, agency_extraordinary_body]
    examples: [obj_kings_son_life_ring]

  obj_serpent_treasure:
    name: Serpent Treasure
    description: |
      Jewels, crowns, pearls, bright stones, golden toys, or similar
      valuables brought from a snake's hidden hoard in response to
      food-sharing, cloth-offering, or respectful contact.
    rationale: |
      Distinct from generic treasure because the value is relational
      and subterranean: it comes from a serpent's hidden reserve and
      marks a fragile exchange with humans. KHM 105 needs the type for
      both the small snake's pretty gifts to the child and the golden
      crown placed on the orphan's silk handkerchief. Naming it allows
      queries over snake-hoard motifs without folding them into
      ordinary royal or quest treasure.
    tier: phenomenal
    scope: world
    lens: material
    domains: [snake, treasure, crown, jewel, hidden-hoard]
    related: [sp_snake, law_house_snake_feeding_sustains_child_vitality, law_serpent_treasure_requires_reciprocal_respect]
    examples: [obj_stories_snake_treasures, obj_stories_snake_crown]

  obj_pearl_tears:
    name: Pearl Tears
    description: |
      Tears that fall from a character's eyes as pearls, jewels, or
      precious stones, turning grief into portable wealth and identity
      evidence.
    rationale: |
      Distinct from `obj_serpent_treasure`, which comes from a hidden
      animal hoard, and from generic recognition tokens such as rings
      or shoes. Pearl tears are affect made material: in KHM 179 the
      princess's weeping leaves pearls on the road and one pearl later
      proves her continued existence to her mother. The object type
      enables queries over magical bodily emissions where emotion
      becomes treasure and kinship proof.
    tier: phenomenal
    scope: world
    lens: material
    domains: [tears, pearls, grief, treasure, recognition]
    related: [law_pearl_tears_authenticate_lost_child, affect_grief, state_hidden_identity]
    examples: [obj_goose_girl_well_pearl]

  obj_golden_bird:
    name: Golden Bird
    description: |
      Precious bird with golden feathers, usually theft-marked and
      quest-generating; its feather, body, cage, or song measures royal
      desire and true possession.
    rationale: |
      Distinct from generic `sp_bird`, which names animal kind, and
      from `obj_life_apple`, which is a food/quest-object. The Golden
      Bird is animate treasure: it steals golden apples, loses a
      feather worth more than a kingdom, cries when mishandled, and
      later sings only when the true hero returns. KHM 57 needs a
      universal for golden-bird quest objects across ATU 550 variants.
    tier: phenomenal
    scope: world
    lens: material
    domains: [bird, gold, quest-object, theft, recognition]
    related: [sp_bird, law_animal_advice_requires_exact_obedience]
    examples: [obj_golden_bird_khm57]

  obj_magic_bird_heart_liver:
    name: Magic Bird Heart and Liver
    description: |
      The operative internal organs of a wondrous golden bird whose
      eating transfers the bird's wealth-generating power to the eater.
    rationale: |
      Distinct from `obj_golden_bird`, which names the animate treasure
      as a whole, and from ordinary food, which satisfies hunger but
      does not create fortune. KHM 60 turns the valuable essence inward:
      the goldsmith eats the bird but loses the magical organs to the
      poor twins, so the recurring gold appears under their pillows.
      This object supports queries over body-part magic and accidental
      ingestion of destiny.
    tier: phenomenal
    scope: world
    lens: material
    domains: [bird, organ, gold, ingestion, fortune]
    related: [law_magic_bird_organs_generate_gold, obj_golden_bird]
    examples: [obj_two_brothers_bird_heart_liver]

  obj_truth_telling_bird:
    name: Truth-Telling Bird
    description: |
      Captive, wall-hung, or otherwise retained bird whose song
      discloses concealed kinship, crime, or rightful identity to the
      authority who can act on it.
    rationale: |
      Distinct from `obj_false_oracle_raven`, whose voice is fraudulent
      and interpreted by a trickster, and from `obj_golden_bird`, which
      is primarily a stolen quest-treasure. The truth-telling bird is a
      witness object: KHM 96's caged bird sings the three children's
      suppressed history and forces royal recognition. Naming it lets
      us query birds that speak juridical truth rather than birds as
      treasure, food, or animal helpers.
    tier: phenomenal
    scope: world
    lens: material
    domains: [bird, truth, testimony, lineage, recognition]
    related: [law_truth_bird_reveals_hidden_lineage, speech_testimony, sp_bird]
    examples: [obj_three_little_birds_truth_bird]

  obj_false_oracle_raven:
    name: False Oracle Raven
    description: |
      Injured or captive raven used by a trickster as a fake divining
      device: the animal's croak is produced physically and then
      interpreted as hidden knowledge.
    rationale: |
      Distinct from genuine animal-language objects or speaking birds.
      The raven does not prophesy; the peasant supplies the oracle from
      overheard facts while pinching the bird to make a sound. This
      object deserves a slot because it connects animal body, fraud,
      hidden domestic shame, and profit in ATU 1535-style peasant
      trickery.
    tier: phenomenal
    scope: world
    lens: material
    domains: [raven, oracle, deception, sound, schwank]
    related: [law_false_oracle_exposes_hidden_goods, arc_trickster, speech_lie]
    examples: [obj_little_peasant_raven]

  obj_golden_horse:
    name: Golden Horse
    description: |
      Supernaturally valuable horse, often faster than the wind, whose
      correct handling requires a plain saddle rather than an ornate
      golden one.
    rationale: |
      Distinct from ordinary `sp_horse` because the horse is a quest
      prize and recognition object, not merely transport. In KHM 57 it
      is promised for the bird, attached to the Golden Castle princess,
      and later refuses to eat while held by false heroes. A universal
      supports queries over ATU 550's linked bird-horse-princess prize
      chain.
    tier: phenomenal
    scope: world
    lens: material
    domains: [horse, gold, quest-object, speed, recognition]
    related: [law_animal_advice_requires_exact_obedience, sp_horse]
    examples: [obj_golden_horse_khm57]

  obj_enchanted_helper_horse:
    name: Enchanted Helper Horse
    description: |
      Horse-form helper who gives counsel, carries the protagonist
      through the quest, and is later revealed or released as an
      enchanted human.
    rationale: |
      Distinct from `obj_golden_horse`, which is mainly a quest-prize,
      and from ordinary `sp_horse`, which only names animal form. The
      enchanted helper horse has subjectivity and plot knowledge: it
      speaks from the stable, plans the dangerous passage, and finally
      becomes a king's son. KHM 126 needs the type so horse-as-adviser
      is not flattened into transport or treasure.
    tier: phenomenal
    scope: world
    lens: material
    domains: [horse, helper, enchantment, advice, transformation]
    related: [arc_animal_helper, arc_enchanted_prince, law_animal_advice_requires_exact_obedience, transform_animal_human]
    examples: [obj_ferdinand_faithful_white_horse]

  obj_golden_goose:
    name: Golden Goose
    description: |
      Goose with feathers of pure gold, granted as a reward for sharing
      poor food with a hidden donor; anyone who tries to steal a
      feather or free someone stuck to it becomes stuck in turn.
    rationale: |
      Distinct from `obj_golden_bird`, which is a quest-object stolen
      from a royal garden, and from ordinary `sp_goose`, which names
      biological form. The Golden Goose is adhesive comic treasure:
      greed for its feathers creates the human train that makes the
      princess laugh. This object supports ATU 571 queries over "all
      stick together" processions and laughter-reward plots.
    tier: phenomenal
    scope: world
    lens: material
    domains: [goose, gold, sticky-object, laughter, donor-reward]
    related: [sp_goose, law_sticky_wonder_object_collects_interferers, law_laughter_releases_reward]
    examples: [obj_golden_goose_khm64]

  obj_needle_thread:
    name: Needle and Thread
    description: |
      Sewing tool-pair used to mend cloth, skin, split bodies, or other
      torn surfaces; in comic etiologies it may leave a visible seam.
    rationale: |
      Distinct from `obj_spinning_wheel`, which produces thread and
      textile as labour, and from generic tools. Needle-and-thread is
      repair technology: it joins what has burst or been cut. KHM 18's
      tailor saves the bean by sewing her together, and black thread
      becomes the species-mark. A universal supports later mending,
      sewing, and body-repair scenes without overloading spinning.
    tier: phenomenal
    scope: world
    lens: material
    domains: [sewing, repair, textile, body, seam]
    related: [agency_domestic_labor, law_etiological_mishap_marks_species]
    examples: [obj_tailor_needle_thread_straw_coal_bean]

  obj_displaced_house_door:
    name: Displaced House Door
    description: |
      A door removed from its hinges and carried away as though the
      security of the house could travel with the physical panel rather
      than remain in its fitted threshold.
    rationale: |
      Distinct from `threshold_doorway`, which names the boundary, and
      from ordinary architecture, which stays in place. The displaced
      door is mobile threshold-material: Catherine bolts the upper half
      but unhinges the lower half, carries it as "security," hangs food
      from it, and finally drops it from a tree to frighten thieves.
      This object type lets ATU 1653A-style "secure the door" jokes be
      queried as material misunderstanding of domestic protection.
    tier: phenomenal
    scope: world
    lens: material
    domains: [door, threshold, household, security, comedy]
    related: [threshold_doorway, law_foolish_remedy_compounds_loss, law_accidental_noise_routes_rogues]
    examples: [obj_frederick_catherine_door]

  obj_fate_reporting_knife:
    name: Fate-Reporting Knife
    description: |
      Knife placed at a parting-point whose bright or rusted side
      reports the life-state of the absent traveller in the direction
      that person took.
    rationale: |
      Distinct from `obj_forensic_token`, which proves a past crime,
      and from ordinary weapons, which cut or kill. The fate-reporting
      knife is a remote life-index: one side remains bright while the
      brother lives and rusts if he dies. KHM 60 needs this object
      because the east-going twin discovers the west-going twin's
      danger through the half-rusted blade and begins the rescue.
    tier: phenomenal
    scope: world
    lens: material
    domains: [knife, fate, kinship, life-token, direction]
    related: [state_liminal_dead, arc_dragon_slayer]
    examples: [obj_two_brothers_fate_knife]

  obj_life_reporting_plant:
    name: Life-Reporting Plant
    description: |
      Plant whose freshness, drooping, withering, blooming, or death
      reports the bodily condition of an absent kinsperson.
    rationale: |
      Distinct from `obj_fate_reporting_knife`, which uses metal
      corrosion to diagnose direction and life, and from ordinary
      plants that serve as food, shelter, or transformation form. A
      life-reporting plant is a living sensor: KHM 85's golden lilies
      reveal whether each gold-child is healthy, ill, dead, or restored.
      This object supports queries over vegetal kinship tokens and
      absent-body diagnostics.
    tier: phenomenal
    scope: world
    lens: material
    domains: [plant, life-token, kinship, diagnosis, gold]
    related: [arc_wondrous_twin, law_divided_magic_body_generates_gold_triplets, agency_object_mediation]
    examples: [obj_gold_children_lilies]

  obj_land_water_ship:
    name: Land-and-Water Ship
    description: |
      Wondrous ship able to sail both on water and across dry land,
      usually demanded as an impossible final bride-winning condition.
    rationale: |
      Distinct from `loc_ship`, which names ordinary vessels as
      journey-spaces. The land-and-water ship is a magic vehicle that
      collapses terrain categories and satisfies a king's evasive task.
      KHM 64 needs it because the king's last attempt to avoid giving
      his daughter fails only when the donor supplies a ship that can
      return sailing on land as well as water.
    tier: phenomenal
    scope: world
    lens: material
    domains: [ship, impossible-task, land, water, bride-winning]
    related: [loc_ship, arc_supernatural_donor]
    examples: [obj_golden_goose_land_water_ship]

  obj_wishing_table:
    name: Wishing Table
    description: |
      Portable table that fills itself with cloth, dishes, wine, and
      replenishing food when addressed by its formula.
    rationale: |
      Distinct from ordinary feast-tables or treasure: the wishing
      table is a self-provisioning domestic object. In KHM 36 its
      value is abundance without labour; its substitution is exposed
      because the false table cannot respond to the command. A
      universal supports later table-set-itself variants and abundance
      object queries.
    tier: phenomenal
    scope: world
    lens: material
    domains: [magic-object, abundance, food, table, formula]
    related: [law_formula_commands_magic_objects, agency_domestic_labor]
    examples: [obj_wishing_table_khm36]

  obj_abundance_cloth:
    name: Abundance Cloth / Wishing Tablecloth
    description: |
      Portable cloth that becomes a meal surface and covers itself with
      cooked dishes when addressed by wish or formula.
    rationale: |
      Distinct from `obj_wishing_table`, whose carrier is the whole
      table, and from ordinary food, which is consumed and gone. The
      abundance cloth is foldable, pocketable meal technology: the
      third brother can feed charcoal-burners in the forest and still
      carry the source of food onward. KHM 54 needs it because the
      cloth is the exchange bait that produces all later military
      objects.
    tier: phenomenal
    scope: world
    lens: material
    domains: [magic-object, abundance, food, cloth, formula]
    related: [law_formula_commands_magic_objects, obj_wishing_table]
    examples: [obj_knapsack_wishing_cloth]

  obj_gold_dropping_ass:
    name: Gold-Dropping Ass
    description: |
      Donkey or ass that produces gold pieces when placed on a cloth
      and addressed by the correct formula.
    rationale: |
      Distinct from ordinary treasure-bearing animals, such as gold-
      laden asses, because the animal itself is the mint. KHM 36's
      second gift converts formulaic speech into renewable wealth and
      is exposed when a substituted ordinary ass cannot produce gold.
      A universal connects gold-producing animal variants across ATU
      563 and related wonder-gift tales.
    tier: phenomenal
    scope: world
    lens: material
    domains: [magic-object, wealth, donkey, formula, treasure]
    related: [law_formula_commands_magic_objects, sp_donkey]
    examples: [obj_gold_ass_khm36]

  obj_gold_summoning_whip:
    name: Gold-Summoning Whip
    description: |
      Small whip whose cracking makes as much gold spring up around
      the bearer as desired.
    rationale: |
      Distinct from `obj_gold_dropping_ass`, where animal-body and
      cloth setup produce gold, and from `obj_wishing_table`, where a
      formula sets a meal. The gold-summoning whip is compact infernal
      credit: a violent gesture makes wealth appear while binding the
      users to the Devil's later claim. KHM 125 needs this object type
      because the soldiers' wealth, seven-year delay, and final right
      to keep the whip all turn on this specific device.
    tier: phenomenal
    scope: world
    lens: material
    domains: [whip, gold, devil, bargain, magic-object]
    related: [law_formula_commands_magic_objects, law_overheard_infernal_riddle_breaks_soul_bargain, being_devil]
    examples: [obj_devil_grandmother_gold_whip]

  obj_cudgel_in_sack:
    name: Cudgel in the Sack
    description: |
      A cudgel kept inside a sack that leaps out on command, beats
      wrongdoers, and returns only when ordered back.
    rationale: |
      Distinct from ordinary weapons because the cudgel is autonomous
      corrective force. In KHM 36 it is the third gift that protects
      itself from substitution and recovers the stolen table and ass by
      beating the innkeeper until he restores them. A universal links
      punitive self-acting objects in wonder-gift tales.
    tier: phenomenal
    scope: world
    lens: material
    domains: [magic-object, punishment, weapon, sack, formula]
    related: [law_formula_commands_magic_objects, moral_retributive]
    examples: [obj_cudgel_sack_khm36]

  obj_portable_celestial_light:
    name: Portable Celestial Light
    description: |
      A moon, star, or comparable heavenly light treated as a material
      lamp: hung from a tree, fuelled, cleaned, stolen, divided, buried,
      or relocated.
    rationale: |
      Distinct from `being_celestial`, which names sun, moon, and
      stars as speaking cosmic persons, and from
      `obj_blue_summoning_light`, whose flame summons a bound helper.
      KHM 175 needs this object type because the moon is not a person
      encountered at the edge of the world; it is a civic lamp, piece
      of property, inheritance share, burial good, and finally
      restored heavenly fixture. The universal enables queries over
      celestial light when it is handled materially rather than
      personified.
    tier: phenomenal
    scope: world
    lens: material
    domains: [moon, light, celestial, lamp, property]
    related: [being_celestial, law_celestial_light_displaced_unsettles_dead, loc_heaven]
    examples: [obj_moon_shining_globe]

  obj_blue_summoning_light:
    name: Blue Summoning Light
    description: |
      Magical flame or lamp that burns blue, never goes out, and
      becomes valuable because it can ignite the act that summons a
      bound helper.
    rationale: |
      Distinct from generic sacred or domestic light, and from
      `obj_summoning_knapsack`, which summons by tapping a container.
      The blue light is not itself the visible helper; it is the
      durable ignition source that lets the soldier call the black
      mannikin whenever he lights the pipe. KHM 116 needs a universal
      for queryable blue-flame servitor objects without collapsing them
      into ordinary treasure or formula objects.
    tier: phenomenal
    scope: world
    lens: material
    domains: [blue-light, flame, summoning, servitor, magic-object]
    related: [law_blue_light_pipe_summons_bound_servitor, obj_summoning_pipe, being_dwarf]
    examples: [obj_blue_light]

  obj_summoning_pipe:
    name: Summoning Pipe
    description: |
      Smoking pipe or comparable instrument that calls a magical helper
      when lit from the correct supernatural source.
    rationale: |
      Distinct from `obj_fiddle`, whose sound compels listeners, and
      from `obj_blue_summoning_light`, which provides the flame. The
      pipe is the user's portable interface: in KHM 116 the soldier
      already has the half-full pipe, but only the blue light turns
      smoking into summoning. Naming it lets object queries separate
      fuel, instrument, and appearing servitor.
    tier: phenomenal
    scope: world
    lens: material
    domains: [pipe, smoke, summoning, tobacco, magic-object]
    related: [law_blue_light_pipe_summons_bound_servitor, agency_object_mediation]
    examples: [obj_blue_light_pipe]

  obj_summoning_knapsack:
    name: Soldier-Summoning Knapsack
    description: |
      Portable bag or pack that releases armed soldiers when tapped,
      placing a ready military unit under the bearer's command.
    rationale: |
      Distinct from `obj_cudgel_in_sack`, whose violence is a single
      self-acting weapon. The knapsack externalizes command: a corporal
      and soldiers appear, obey orders, retrieve property, beat kin,
      and repel royal troops. KHM 54 needs it because military force is
      generated from a humble container rather than from the hero's
      body, rank, or allies.
    tier: phenomenal
    scope: world
    lens: material
    domains: [magic-object, knapsack, soldiers, command, force]
    related: [law_militarized_objects_create_sovereignty, law_coercive_retrieval_voids_exchange, agency_object_mediation]
    examples: [obj_knapsack_soldier_pack]

  obj_wish_knapsack:
    name: Wish-Knapsack
    description: |
      Magical bag or pack whose inside can receive desired things or
      beings by wish, including food, hostile spirits, and the bearer.
    rationale: |
      Distinct from `obj_summoning_knapsack`, which sends soldiers out,
      and from `obj_cudgel_in_sack`, which contains an autonomous
      weapon. The wish-knapsack pulls targets inward: two roasted geese
      appear inside it, nine devils are forced into it, and Brother
      Lustig finally wishes himself inside it after St. Peter hangs it
      in Heaven. A separate object lets container-magic queries
      distinguish inward capture from outward summoning.
    tier: phenomenal
    scope: world
    lens: material
    domains: [knapsack, container, wish, capture, food, devils]
    related: [law_wish_knapsack_contains_targets, speech_wish, being_devil]
    examples: [obj_brother_lustig_knapsack]

  obj_winning_cards_dice:
    name: Winning Cards and Dice
    description: |
      Supernatural gaming implements with which the holder wins every
      game, turning chance into guaranteed acquisition.
    rationale: |
      Distinct from ordinary cards or dice, which preserve risk, and
      from wish-objects, which grant things directly. Winning cards and
      dice keep the form of gambling while abolishing its uncertainty:
      Hansel still plays, but cannot fail to win. KHM 82 needs this
      object type because both world-winning and devil-winning occur
      through game apparatus rather than through speech command alone.
    tier: phenomenal
    scope: world
    lens: material
    domains: [cards, dice, gambling, luck, magic-object]
    related: [law_winning_game_objects_totalize_play, arc_compulsive_gambler]
    examples: [obj_gambling_hansel_cards, obj_gambling_hansel_dice]

  obj_sticky_fruit_tree:
    name: Inescapable Fruit Tree
    description: |
      Fruit-bearing tree from which anyone who climbs up cannot come
      down until the owner permits it.
    rationale: |
      Distinct from `obj_golden_goose`, which sticks touchers into a
      procession, and from ordinary `loc_tree`, which is only a place.
      The inescapable fruit tree is a trap-object with vertical
      jurisdiction: Hansel uses it to hold Death above the ground for
      seven years. A universal supports queries for supernatural seats,
      chairs, trees, or perches that bind visitors until released.
    tier: phenomenal
    scope: world
    lens: material
    domains: [tree, trap, fruit, death, verticality]
    related: [law_trapped_death_suspends_mortality, loc_tree, being_death]
    examples: [obj_gambling_hansel_fruit_tree]

  obj_artillery_hat:
    name: Artillery Hat / Cannon Hat
    description: |
      Wearable magic hat that, when turned on the head, fires cannon or
      artillery-like volleys capable of defeating armed opponents.
    rationale: |
      Distinct from `obj_boast_girdle`, which creates reputation by
      inscription, and from ordinary weapons, which must be wielded by
      hand. The artillery hat turns a minor garment into remote heavy
      force: the wearer rotates it and guns fire as if twelve cannons
      acted together. KHM 54 needs it to distinguish clothing that
      produces military firepower from clothing that signals identity.
    tier: phenomenal
    scope: world
    lens: material
    domains: [magic-object, hat, artillery, cannon, garment]
    related: [law_militarized_objects_create_sovereignty, agency_object_mediation, agency_violence]
    examples: [obj_knapsack_artillery_hat]

  obj_cannon:
    name: Cannon
    description: |
      Heavy artillery weapon used for explosive force against fields,
      buildings, enemies, or misunderstood threats.
    rationale: |
      Distinct from magical artillery objects such as
      `obj_artillery_hat`, where cannon-fire is conjured by a garment.
      Ordinary cannon matter in comic tales because they reveal a
      mismatch between problem and means: KHM 70's islanders use
      cannon to harvest grain and later to remove a cat, turning
      practical ignorance into material destruction. This object type
      supports queries over non-magical militarized overkill.
    tier: phenomenal
    scope: world
    lens: material
    domains: [weapon, cannon, artillery, overkill, destruction]
    related: [law_missing_tool_invites_destructive_overkill, agency_violence]
    examples: [obj_three_children_field_cannon, obj_three_children_palace_cannon]

  obj_siege_horn:
    name: Siege Horn / Fortification-Destroying Horn
    description: |
      Blowable horn whose sound topples walls, fortifications, towns,
      or villages, converting breath and sound into siege destruction.
    rationale: |
      Distinct from `obj_singing_bone`, where a horn-like instrument
      speaks truth, and from `agency_music`, where sound attracts or
      delights. The siege horn is destructive acoustics: blowing it
      collapses built political space itself. KHM 54 needs it because
      the final accession depends not on defeating a troop, but on
      destroying the infrastructure of kingdom and palace resistance.
    tier: phenomenal
    scope: world
    lens: material
    domains: [magic-object, horn, siege, walls, destruction]
    related: [law_militarized_objects_create_sovereignty, agency_object_mediation, agency_violence]
    examples: [obj_knapsack_siege_horn]

  obj_boast_girdle:
    name: Boast Girdle / Inscribed Belt
    description: |
      Wearable inscription that advertises a compressed heroic claim
      and travels with the wearer as portable reputation.
    rationale: |
      Distinct from ordinary garments and from `speech_boast`, which is
      the utterance-type. The girdle makes boast-speech material: it
      can be read by giants, townspeople, soldiers, and kings without
      the tailor needing to repeat or clarify it. KHM 20's "Seven at
      one stroke" belt is the object that turns fly-killing into public
      heroic identity.
    tier: phenomenal
    scope: world
    lens: material
    domains: [garment, inscription, boast, reputation, heroism]
    related: [speech_boast, law_boast_generates_reputation, agency_cunning]
    examples: [obj_seven_at_one_stroke_girdle]

  obj_recognition_shoe:
    name: Recognition Shoe / Slipper
    description: |
      Shoe whose fit identifies the rightful bride, hidden protagonist,
      or true owner. It may be golden, glass, silk, or otherwise marked,
      but its decisive property is exclusive bodily fit.
    rationale: |
      Distinct from generic garments and from `obj_boast_girdle`
      (wearable reputation). The recognition shoe is a test-object:
      it can be tried, forced, bloodied, rejected, and finally fitted.
      KHM 21's golden slipper is paradigmatic and supports later
      comparative queries over shoe/garment recognition motifs.
    tier: phenomenal
    scope: world
    lens: material
    domains: [shoe, recognition, bride, body, fit]
    related: [law_true_fit_reveals_identity, arc_false_bride, state_hidden_identity]
    examples: [obj_golden_slipper_cinderella]

  obj_celestial_dresses:
    name: Celestial Dresses
    description: |
      Splendid garments patterned after sun, moon, stars, or the
      heavens, usually requested or worn as impossible bride-gifts and
      later revealed in festival or recognition scenes.
    rationale: |
      Distinct from ordinary royal clothing and from
      `obj_recognition_shoe`, whose power lies in exclusive bodily fit.
      Celestial dresses magnify hidden royal identity through cosmic
      brightness: they are too excessive for domestic labour and too
      specific to be mere finery. KHM 65 needs a reusable object type
      because the three dresses are first defensive impossibilities,
      then the staged appearances through which the hidden princess
      re-enters courtly visibility.
    tier: phenomenal
    scope: world
    lens: material
    domains: [garment, celestial, bride-gift, recognition, splendour]
    related: [law_impossible_bride_gifts_delay_forced_marriage, state_hidden_identity, num_3]
    examples: [obj_allerleirauh_celestial_dresses]

  obj_fur_disguise_mantle:
    name: Fur Disguise Mantle
    description: |
      Animal-skin or many-furred cloak that hides a royal woman beneath
      an animal-like surface, enabling flight, social descent, and
      survival as a servant or unknown creature.
    rationale: |
      Distinct from `state_disguised`, which names the entity's
      condition, and from `obj_redeeming_shirt`, which restores a
      transformed body. The fur mantle is a material interface between
      species-sign and social status: it lets observers read the
      heroine as beast, rough-skin, or kitchen drudge while her human
      royal body remains underneath. KHM 65 needs it because the
      mantle is both escape technology and the visible cause of the
      name Allerleirauh.
    tier: phenomenal
    scope: world
    lens: material
    domains: [garment, fur, disguise, animality, flight]
    related: [state_disguised, law_disguise_alters_social_reality, arc_taboo_desiring_father]
    examples: [obj_allerleirauh_fur_mantle]

  obj_hidden_bride_token:
    name: Hidden Bride Token
    description: |
      Portable private object placed or displayed by a concealed bride
      to draw recognition without direct public self-disclosure: ring,
      spindle, reel, jewel, or similar identity-bearing token.
    rationale: |
      Distinct from `obj_forensic_token`, which proves a concealed
      crime, and from `obj_recognition_shoe`, which tests bodily fit.
      The hidden bride token is communicative and courtship-oriented:
      it invites inquiry across social rank while preserving the
      heroine's control over revelation. KHM 65 needs this type for
      the ring, spinning-wheel, and reel placed in soup before the
      final bodily reveal.
    tier: phenomenal
    scope: world
    lens: material
    domains: [token, recognition, bride, identity, secrecy]
    related: [law_kitchen_tokens_reveal_hidden_bride, agency_object_mediation, state_hidden_identity]
    examples: [obj_allerleirauh_golden_ring, obj_allerleirauh_golden_reel]

  obj_betrothal_recognition_token:
    name: Betrothal Recognition Token
    description: |
      Portable object, often a divided ring or jewel, exchanged at
      betrothal so the promised pair can later prove identity and
      continuity despite changed appearance, distance, or social
      misrecognition.
    rationale: |
      Distinct from `obj_hidden_bride_token`, where the bride places a
      token to signal from concealment, and from `obj_recognition_shoe`,
      which identifies through bodily fit. A betrothal recognition token
      is relational: it binds two bearers by matched halves or shared
      custody. KHM 101 needs this universal for the broken ring halves
      that prove the handsome stranger is the same Bearskin promised to
      the faithful youngest daughter.
    tier: phenomenal
    scope: world
    lens: material
    domains: [token, ring, betrothal, recognition, identity]
    related: [law_split_betrothal_token_recognizes_true_bridegroom, agency_object_mediation, law_promise_binds_reality]
    examples: [obj_bearskin_split_ring]

  obj_poisoned_food:
    name: Poisoned Food / Drink
    description: |
      Consumable substance whose apparent hospitality conceals lethal
      toxin: drink, soup, meat, fruit, or other food prepared to kill.
    rationale: |
      Distinct from ordinary food and from `obj_language_granting_food`,
      which grants knowledge. Poisoned food weaponises hospitality and
      can transfer its force through bodies. KHM 22 needs a universal
      for the witch's parting draught and the poisoned raven soup that
      kills the robbers.
    tier: phenomenal
    scope: world
    lens: material
    domains: [poison, food, drink, hospitality, murder]
    related: [law_poison_transfers_through_consumption, being_witch]
    examples: [obj_witch_parting_draught_riddle, obj_poisoned_raven_soup]

  obj_truth_mirror:
    name: Truth Mirror / Speaking Looking-Glass
    description: |
      Reflective object that answers spoken questions as a truth oracle,
      especially by comparing visible or hidden persons under a single
      ranking criterion.
    rationale: |
      Distinct from generic magical tools because its power is not
      transport, transformation, or healing; it is adversarial
      information. The mirror makes private vanity into actionable
      knowledge by saying who is fairest and where the rival lives.
      KHM 53 needs a universal for query patterns where an object
      repeatedly verifies rank and exposes hidden survival.
    tier: phenomenal
    scope: world
    lens: material
    domains: [mirror, truth, speech, beauty, surveillance]
    related: [law_truth_mirror_ranks_beauty, speech_testimony, affect_envy]
    examples: [obj_snow_white_truth_mirror]

  obj_crystal_ball:
    name: Crystal Ball
    description: |
      Transparent spherical power-object whose possession and display
      can break an enchanter's power, release cursed figures, and
      transfer rule over an enchanted castle.
    rationale: |
      Distinct from `obj_truth_mirror`, which reveals present truth by
      reflection, and from wish-granting objects, which obey the
      bearer's desire directly. The crystal ball in KHM 197 is not an
      oracle or a toy: it is the material seat or counter-key of the
      enchanter's power, hidden inside an animal-egg sequence and
      effective only when held before him. The object supports queries
      over externalized magical authority and curse-breaking by
      recovered power tokens.
    tier: phenomenal
    scope: world
    lens: material
    domains: [crystal, sphere, enchantment, power, release]
    related: [law_nested_animal_body_yields_crystal_power_object, being_wizard, state_cursed, moral_restorative]
    examples: [obj_crystal_ball_power_token]

  obj_wishing_cap:
    name: Wishing Cap
    description: |
      Portable headwear that transports its wearer instantly to the
      place named or inwardly wished.
    rationale: |
      Distinct from `obj_invisibility_cloak`, which hides the wearer,
      and from `obj_many_league_boots`, which amplify travel by
      walking. The wishing cap turns thought or wish-speech into
      relocation while remaining a contested object that can be won
      through trick arbitration. KHM 197 needs this universal because
      the hero reaches the Castle of the Golden Sun only after taking
      the giants' cap and accidentally activating its transport power.
    tier: phenomenal
    scope: world
    lens: material
    domains: [cap, wish, transport, magic-object, giants]
    related: [speech_wish, law_quarreling_giants_lose_magic_objects, agency_object_mediation]
    examples: [obj_crystal_ball_wishing_cap]

  obj_display_coffin:
    name: Display Coffin / Transparent Bier
    description: |
      Coffin, bier, or burial container that preserves and displays a
      dead or deathlike body instead of hiding it in the ground.
    rationale: |
      Distinct from ordinary coffins, which close death away, and from
      `obj_forensic_token`, which proves a crime through a fragment.
      The display coffin keeps the whole body visible, delays burial,
      and enables later recognition or revival. KHM 53 requires it
      because Snow White's glass coffin lets beauty, name, and royal
      identity remain readable until the prince sees her.
    tier: phenomenal
    scope: world
    lens: material
    domains: [coffin, glass, death, display, recognition]
    related: [state_liminal_dead, law_removable_death_token_restores_life, affect_grief]
    examples: [obj_snow_white_glass_coffin]

  obj_enchanted_glass_coffin_prison:
    name: Enchanted Glass-Coffin Prison
    description: |
      Transparent coffin-like magical container that holds a living
      captive in sleep or suspension until a helper opens its bolt or
      lid.
    rationale: |
      Distinct from `obj_display_coffin`, which displays a dead or
      deathlike body for recognition, and from ordinary prison
      architecture, which hides or confines by walls. The enchanted
      glass coffin is both prison and proof of life: in KHM 163 the
      maiden is asleep, breathing, visible, and able to wake when the
      destined tailor arrives. The type enables queries for transparent
      captivity where the container itself is the release interface.
    tier: phenomenal
    scope: world
    lens: material
    domains: [coffin, glass, prison, sleep, enchantment, release]
    related: [law_glass_coffin_bolt_releases_living_maiden, arc_imprisoned_maiden, state_imprisoned, state_enchanted_sleep]
    examples: [obj_glass_coffin_maiden_prison]

  obj_burial_shroud:
    name: Burial Shroud
    description: |
      Cloth garment or wrapping in which a dead body, especially a
      child or beloved kin member, is laid in the coffin or grave.
    rationale: |
      Distinct from `obj_display_coffin`, which frames a visible whole
      body, and from restorative garments that remake living bodies.
      The burial shroud belongs to the dead person's rest: in KHM 109
      it becomes materially wet from the mother's tears and therefore
      measures whether mourning still burdens the child. A universal
      shroud object lets death, textile, grief, and grave-rest queries
      connect without treating the cloth as generic clothing.
    tier: phenomenal
    scope: world
    lens: material
    domains: [burial, textile, death, grief, child]
    related: [law_excessive_mourning_burdens_dead_child, state_liminal_dead, loc_tomb]
    examples: [obj_shroud_child_shroud]

  obj_maternal_discipline_rod:
    name: Maternal Discipline Rod
    description: |
      Rod, switch, or small staff used by a mother or parental
      authority to strike a disobedient child or child-remnant as final
      correction.
    rationale: |
      Distinct from ordinary weapons, whose function is combat, and
      from `obj_cudgel_in_sack`, whose violence is autonomous magical
      punishment. The maternal rod is disciplinary authority made
      material: in KHM 117 it does not kill the child, who is already
      dead, but completes the correction that allows grave-rest. A
      universal rod object lets obedience, punishment, and parental
      authority be queried materially.
    tier: phenomenal
    scope: world
    lens: material
    domains: [rod, discipline, mother, child, punishment]
    related: [law_maternal_rod_quiets_posthumous_disobedience, arc_willful_child, moral_disobedience_punished]
    examples: [obj_willful_child_rod]

  obj_cast_off_animal_skin:
    name: Cast-Off Animal Skin
    description: |
      Removable animal hide, pelt, or bodily covering left beside the
      transformed person at the moment human form can remain.
    rationale: |
      Distinct from `obj_fur_disguise_mantle`, which is worn to hide a
      human identity, and from ordinary garments. The cast-off animal
      skin is ontological residue: destroying it prevents return to the
      beast or hybrid surface. KHM 108 needs this object because Hans's
      hedgehog skin lies by the bed and must be burned at once for his
      human form to stabilize. KHM 144 repeats the material logic with
      an ass-skin secretly laid aside in the bridal chamber.
    tier: phenomenal
    scope: world
    lens: material
    domains: [animal-skin, transformation, fire, body, release]
    related: [law_burned_animal_skin_releases_human_form, transform_animal_human, state_transformed]
    examples: [obj_hans_hedgehog_skin, obj_donkey_ass_skin]


# =============================================================================
# NARRATIVE_FUNCTIONS — Proppian (to be populated)
# =============================================================================
# Why this category: Vladimir Propp identified ~31 invariant functions
# that occur in a fixed order across folk-narrative. Per-tale yaml uses
# these to record plot-syntagm.

narrative_functions: {}


# =============================================================================
# EDGE_LABELS — meta vocabulary
# =============================================================================
# Why this section: edges (KILLS, MARRIES, PROMISES_TO) form an open
# vocabulary. Common labels are documented here; the rest are
# auto-cataloged from tales/*.yaml.

edge_labels:

  PROMISES_TO:
    description: |
      Promiser → promisee. Creates a `speech_promise` instance plus
      `state_bound_by_promise` on the promiser.
    from: character
    to: character

  COMMANDS:
    description: |
      Authoritative speaker → subordinate, directing action.
    from: character
    to: character

  TRANSFORMS_INTO:
    description: |
      Form A → form B of one identity (two character nodes linked).
    from: character
    to: character

  SERVES:
    description: |
      Faithful servant → master.
    from: character
    to: character

  ENCHANTS:
    description: |
      Curse-worker → cursed being.
    from: character
    to: character

  THROWS_AT:
    description: |
      Physical act of throwing.
    from: character
    to: character

  DECEIVES:
    description: |
      Deceiver → deceived. Generates `state_deceived` on the target.
    from: character
    to: character

  LIES_TO:
    description: |
      A specific instance of deceiving via `speech_lie`. Many DECEIVES
      relationships have at least one LIES_TO edge concretising them.
    from: character
    to: character

  EATS:
    description: |
      Predator → consumed. The defining act of `arc_predator`.
    from: character
    to: character

  PARTNERS_WITH:
    description: |
      Symmetric (emit both directions). Two characters enter shared
      domestic or economic life — often via a speech_promise that
      `law_promise_binds_reality` may or may not enforce.
    from: character
    to: character
    symmetric: true

  STORES_AT:
    description: |
      Owner / partnership → location where a valued item is kept.
    from: character
    to: location

  PROHIBITS:
    description: |
      Prohibition-giver → addressee. Materialises a `speech_prohibition`
      and sets up the conditions for `law_prohibition_invites_violation`.
    from: character
    to: character

  CONFESSES_TO:
    description: |
      Confessor → addressee. Materialises a `speech_confession`.
    from: character
    to: character

  ACCUSES:
    description: |
      Accuser → accused. Often a public/collective accuser (people,
      councillors) toward a silent or otherwise unable-to-defend
      character.
    from: character
    to: character

  TAKES_AWAY:
    description: |
      Authority figure → victim. Removes children, possessions, or
      faculties as consequence/punishment.
    from: character
    to: character

  RESTORES_TO:
    description: |
      Authority figure → recipient. Returns what was taken away,
      conditioned on repentance / confession / counter-condition.
    from: character
    to: character

  GIVES_CHILD_TO:
    description: |
      Parent → custodian. Transfer of a child into another's care
      (the woodcutter gives his daughter to Mary).
    from: character
    to: character

  LACKS:
    description: |
      Character → state/affect/skill that they are constitutively
      missing. Marks an attribute-by-absence (e.g. the fearless
      youth LACKS fear).
    from: character
    to: any

  VISITS:
    description: |
      Character → location they enter or stay in temporarily.
    from: character
    to: location

  DEFEATS:
    description: |
      Victor → defeated antagonist. Generic edge for combat
      outcomes; covers physical combat, contest of strength, ordeal.
    from: character
    to: character

  BANISHES_TO:
    description: |
      Authority → exiled character / destination. The act of
      removing someone from their domain into wilderness, exile,
      or sub-realm.
    from: character
    to: any

  USES:
    description: |
      Character → object they wield or deploy. Generic causal use.
    from: character
    to: magic_object

  RETRIEVES:
    description: |
      Character → object brought back from inaccessibility (well,
      depth, otherworld).
    from: character
    to: magic_object

  ABANDONS:
    description: |
      Character → abandoned party. Leaves them in danger, isolation,
      or unresolved obligation.
    from: character
    to: any

  BINDS_HEART_WITH:
    description: |
      Character → object that constrains their physiological response
      (Faithful Henry's iron bands around his heart).
    from: character
    to: magic_object

  CONTAINS:
    description: |
      Location → sub-location nested within it.
    from: location
    to: location

  ADJACENT_TO:
    description: |
      Location → neighbouring location.
    from: location
    to: location
    symmetric: true

  LEARNS:
    description: |
      Character → state/affect/skill they acquire by experience. The
      dual of `LACKS`: when a learnt state is filled, this edge
      replaces the prior LACKS edge.
    from: character
    to: any

  SWALLOWS_WHOLE:
    description: |
      Predator → swallowed character. The whole-consumption form of
      EATS — preserves the swallowed character alive inside, makes
      `state_devoured_but_alive` apply, and enables rescue.
    from: character
    to: character

  HIDES_IN:
    description: |
      Hider → location/object where they conceal their body.
    from: character
    to: any

  RESCUES_FROM_BELLY:
    description: |
      Rescuer → rescued. Specific form of RESCUES involving surgical
      retrieval from a devourer's stomach. Co-occurs with
      `arc_protective_mother` and `law_devouring_can_be_reversed`.
    from: character
    to: character

  SUBSTITUTES_FOR:
    description: |
      Replacement object → original being. The stones placed in the
      wolf's belly substitute for the rescued kids — the substitution
      both completes the disguise and arms the retributive ending.
    from: magic_object
    to: character

  DISGUISES_AS:
    description: |
      Disguiser → impersonated identity. Materialises `state_disguised`.
    from: character
    to: character

  WARNS:
    description: |
      Warner → recipient of warning. Sets up an `arc_oath_enforcer`
      or `arc_prohibition_giver` move at smaller scale.
    from: character
    to: character

  PROPHESIES:
    description: |
      Prophetic speaker → addressee (or overhearer). Materialises a
      `speech_prophecy` instance.
    from: character
    to: character

  OVERHEARS:
    description: |
      Listener → speaker (or speech-act). The structurally important
      epistemic-acquisition path of prophecies (Faithful John
      overhears the ravens).
    from: character
    to: any

  PETRIFIES_BY:
    description: |
      Petrified character → cause of petrification (typically a
      speech-act they performed).
    from: character
    to: any

  REVIVES_BY_BLOOD:
    description: |
      Reviver → revived. The blood-sacrifice mechanism produced by
      `law_blood_restores_petrified`.
    from: character
    to: character

  FALLS_IN_LOVE_AT_SIGHT:
    description: |
      Lover → beloved (image or person). Triggers
      `affect_love_at_first_sight`.
    from: character
    to: any

  ABDUCTS:
    description: |
      Abductor → abducted. Forcible or deceptive removal of a person
      from their domain. May overlap with MARRIES if the abduction
      is followed by consent (KHM 6) or be its inverse if it isn't.
    from: character
    to: character

  SACRIFICES:
    description: |
      Sacrificer → victim of sacrifice. The sacrificer is typically
      the victim's closest kin (KHM 6 king sacrifices his children
      to revive John).
    from: character
    to: character

  REVEALS_TO:
    description: |
      Speaker → recipient of revelation. Often used for safe
      disclosure (a child reveals to a parent where they hid).
    from: character
    to: character

  KILLS:
    description: |
      Killer → killed. Generic edge for fatal acts.
    from: any
    to: character

  BUYS_CLAIM:
    description: |
      Speculator → reward-recipient. Buys (at discount) a future
      reward-claim before delivery — gets whatever the reward turns
      out to be.
    from: character
    to: character

  INFORMS_ON:
    description: |
      Informer → target. Reports disrespectful speech or wrongdoing
      to authority in hope of being rewarded.
    from: character
    to: character

  PETITIONS:
    description: |
      Petitioner → authority. Seeks justice or audience at court.
    from: character
    to: character

  ENTRUSTS:
    description: |
      Owner → custodian. Hands over property under condition of
      return or payment.
    from: character
    to: any

  LENDS:
    description: |
      Lender → borrower. Temporary transfer with expectation of return.
    from: character
    to: character

  MAKES_LAUGH:
    description: |
      Comic agent → unlaughing target. Elicits laughter and so
      triggers `law_laughter_releases_reward`.
    from: character
    to: character

  ABUSES:
    description: |
      Insulter → target of verbal abuse.
    from: character
    to: any
