# yaml-language-server: $schema=./schemas/atu.schema.json

version: 1

# =============================================================================
# ATU_TYPES — structural tier, scope: tale
# =============================================================================
# Why this category: ATU is the international standard for tale-type
# comparison (used by all of folkloristics since 1910). First-class
# membership in the ontology means each tale's ATU is queryable as a
# node, not just a string property.

atu_types:

  atu_870:
    name: The Three Black Princesses / Maid Maleen
    description: |
      Tale-type cluster around princesses confined away from ordinary
      access and release made contingent on endurance, taboo, or later
      recognition. In the Three Black Princesses branch, a poor
      fisherman's son enters an enchanted mountain castle and fails a
      silence/no-gaze rescue term. In the Maid Maleen branch, a king's
      daughter is walled into a dark tower for seven years, escapes
      after the kingdom has been ruined, becomes a kitchen servant, and
      is recognized as the true bride after a coerced wedding
      substitution.
    rationale: |
      First-class ATU membership keeps these confinement-and-release
      plots distinct from ordinary tower-maiden courtship, false-bride
      substitution, and enchanted-princess rescue. KHM 137 shows the
      failed-disentanglement pole: mountain opening, black castle,
      three black princesses, silence/no-gaze taboo, scalding water,
      half-white transformation, and permanent loss. KHM 198 shows the
      social-recognition pole: father-imposed tower burial, survival
      beyond the ruined kingdom, poverty descent, kitchen service,
      coerced bridal substitution, liminal sayings, and token exposure.
      The node supports comparative queries over confined princesses,
      failed release, tower survival, and true-bride recognition after
      attempted substitution.
    tier: structural
    scope: tale
    lens: atu
    domains: [confinement, princesses, tower, recognition, failed-rescue, substitution]
    related: [arc_imprisoned_maiden, arc_false_bride, law_failed_silence_gaze_taboo_sinks_enchanted_castle, law_tower_confinement_outlasts_ruined_kingdom, law_liminal_bride_sayings_and_token_expose_substitution, loc_mountain, loc_castle, loc_tower]
    examples: [the_three_black_princesses, maid_maleen]

  atu_875:
    name: The Clever Peasant Girl
    description: |
      Tale-type: a poor peasant's daughter proves wisdom by solving a
      paradoxical royal condition, marries the ruler, later corrects an
      unjust judgment through an absurd analogy, and finally restores
      the marriage by taking the king as the dearest thing she may
      remove.
    rationale: |
      First-class ATU membership keeps KHM 94 distinct from generic
      riddle-marriage tales and from trickster schwanks. Its grammar is
      specifically juridical: the heroine's cleverness moves through
      courtship test, legal consultation, unjust verdict, dismissal,
      and reconciliation by exact compliance. The node supports
      comparative queries over wise peasant girls, paradox conditions,
      and lower-status female intelligence at court.
    tier: structural
    scope: tale
    lens: atu
    domains: [wisdom, peasant, riddle, judgment, marriage]
    related: [arc_clever_peasant_bride, law_paradox_condition_proves_wisdom, law_counter_absurdity_exposes_bad_judgment, law_dearest_literalism_restores_marriage]
    examples: [the_peasants_clever_daughter]

  atu_922a:
    name: The Shepherd Boy
    description: |
      Tale-type: a low-status shepherd boy becomes famous for wise
      answers, is tested by a skeptical king, and answers three
      impossible questions: the number of ocean drops, the number of
      stars, and the seconds in eternity. His answers reframe counting
      by river-stoppage, uncountable paper points, and the slow wearing
      away of the Diamond Mountain by a bird. The king adopts him into
      the royal palace.
    rationale: |
      First-class ATU membership separates this child-wisdom riddle
      tale from ATU 875 clever peasant courtship, devil-riddle quests,
      and trickster fraud. Its grammar is compact and epistemic:
      reputation for answers, royal skepticism, three cosmic counting
      questions, non-numeric reframing, and adoption by authority.
      The node supports comparative queries over wise children,
      impossible questions, cosmic scale, and wisdom-based social
      elevation without marriage.
    tier: structural
    scope: tale
    lens: atu
    domains: [wisdom, child, riddle, counting, king, adoption]
    related: [arc_wise_child, law_unanswerable_cosmic_questions_yield_to_reframing, speech_riddle, agency_speech, num_3]
    examples: [the_shepherd_boy]

  atu_923:
    name: Love Like Salt
    description: |
      Tale-type: a king asks his daughters to measure their love for
      him. The youngest gives the truthful but misunderstood comparison
      that she loves him like salt, is angrily driven into exile, and
      lives in hidden low service until a recognition token or later
      revelation restores her to her parents.
    rationale: |
      First-class ATU membership separates the salt-love exile pattern
      from false-bride goose-girl ATU 533 and from ordinary Cinderella-
      like domestic oppression. Its grammar is filial speech test,
      misread necessary substance, punitive banishment, hidden identity
      under humble service, material recognition, parental repentance,
      and restoration. The node supports comparative queries over
      love-like-salt tales, misunderstood truth-speech, filial exile,
      and value recognized only after loss.
    tier: structural
    scope: tale
    lens: atu
    domains: [salt, love-test, exile, hidden-identity, recognition]
    related: [law_salt_love_misread_exiles_true_child, law_pearl_tears_authenticate_lost_child, obj_pearl_tears, state_hidden_identity, moral_restorative]
    examples: [the_goose_girl_at_the_well]

  atu_1360c:
    name: Old Hildebrand
    description: |
      Tale-type: a wife and cleric deceive the husband into leaving on
      a false errand or pilgrimage; a helper warns him and carries him
      home concealed, where a song or staged scene exposes the adultery
      and the husband punishes the lover.
    rationale: |
      First-class ATU membership separates KHM 95 from generic
      adulterous-wife jokes and from false-oracle trickster tales. Its
      distinctive grammar is clerical or loverly displacement of the
      husband, helper-assisted hidden return, sung or theatrical
      revelation, and immediate bodily punishment. The node supports
      comparative queries over anticlerical schwanks, concealed
      husbands, and adultery exposed by household performance.
    tier: structural
    scope: tale
    lens: atu
    domains: [adultery, cleric, concealed-return, song, schwank]
    related: [arc_hypocritical_cleric, arc_treacherous_spouse, law_false_sermon_displaces_husband, law_hidden_basket_return_exposes_adultery]
    examples: [old_hildebrand]

  atu_707:
    name: The Three Golden Children / The Bird of Truth
    description: |
      Tale-type: sisters speak marriage wishes; the youngest marries
      the king or prince and bears wondrous children, who are stolen or
      exposed by envious female kin. The children survive, undertake a
      quest for marvels, and a truth-telling bird reveals their lineage
      so the mother is restored and the persecutors punished.
    rationale: |
      First-class ATU membership keeps KHM 96 distinct from ordinary
      foundling tales and from generic false-accusation plots. Its
      architecture combines three sisters, wondrous royal births,
      child exposure, animal-birth slander, sibling quest, bird-of-
      truth testimony, and maternal restoration. The node supports
      comparative queries over ATU 707 variants such as the dancing
      water, singing tree, and speaking bird complex.
    tier: structural
    scope: tale
    lens: atu
    domains: [wondrous-children, false-accusation, bird-of-truth, siblings, restoration]
    related: [arc_envious_kin_persecutor, law_birth_substitution_false_animal_accusation, law_truth_bird_reveals_hidden_lineage, obj_truth_telling_bird]
    examples: [the_three_little_birds]

  atu_551:
    name: The Water of Life
    description: |
      Tale-type: several sons seek a wonderful healing water for their
      sick father; proud elder sons fail or are trapped, the youngest
      receives donor help, wins the water and a bride, is betrayed by
      false-hero brothers, and is finally recognised and restored.
    rationale: |
      First-class ATU membership keeps KHM 97 distinct from ATU 550's
      golden-bird quest while preserving their shared grammar of donor
      advice, failed elder brothers, magical castle, princess,
      betrayal, and recognition. The type is specifically organised
      around a remedy quest for the father: the water heals, the stolen
      cup frames the true son, and the golden road later re-identifies
      the deliverer. The node enables comparative queries over
      wonderful-remedy quests and sibling false-hero structures.
    tier: structural
    scope: tale
    lens: atu
    domains: [water-of-life, remedy, brothers, false-hero, quest]
    related: [obj_water_of_life, arc_false_hero, law_stolen_healing_water_frames_true_quester, law_golden_road_recognizes_true_deliverer]
    examples: [the_water_of_life]

  atu_610:
    name: The Healing Fruit / The Griffin
    description: |
      Tale-type: a sick princess can be healed by a special fruit, but
      elder brothers fail the donor's truth-test and their offerings
      turn into worthless matter. The youngest succeeds, then must
      satisfy further impossible tasks: a land-swift boat, a hundred
      hares, and a feather from the Griffin. On the Griffin quest he
      gathers answers to other people's troubles and returns wealthy,
      while the greedy king takes the lake-carrier's burden and dies.
    rationale: |
      First-class ATU membership keeps KHM 165 distinct from ATU 551
      healing-water quests and from ATU 461 devil-hair quests. Its
      grammar combines curative fruit, donor truth-testing, escalating
      royal postponements, hare-whistle control, Griffin-household
      eavesdropping, remedy answers for side-quest petitioners, and
      final burden-transfer at the lake. The node supports comparative
      queries over healing-fruit quests, successful youngest fools,
      Griffin knowledge, and kings punished through redirected
      crossings.
    tier: structural
    scope: tale
    lens: atu
    domains: [healing-fruit, youngest-son, griffin, hares, ferry, quest]
    related: [law_truthful_answer_preserves_donor_matter, law_monster_household_eavesdropping_yields_remedies, law_midwater_replacement_transfers_ferry_burden, being_griffin, sp_hare, loc_lake]
    examples: [the_griffin]

  atu_1641:
    name: Doctor Know-All
    description: |
      Tale-type: a low-status impostor gains a reputation as an all-
      knowing doctor or wise man. At a rich household, accidental
      remarks are misread by guilty thieves as direct knowledge, causing
      them to confess or reveal stolen goods and rewarding the impostor.
    rationale: |
      First-class ATU membership separates KHM 98 from deliberate
      false-oracle tales and from ordinary trickster theft. Its core is
      accidental correctness under a false professional identity:
      dish-counting, name coincidence, and book-looking produce
      detection because the guilty hear themselves accused. The node
      supports comparative queries over lucky impostors, criminal
      projection, and comic expertise.
    tier: structural
    scope: tale
    lens: atu
    domains: [doctor, imposture, theft, coincidence, schwank]
    related: [law_accidental_utterance_performs_omniscience, arc_trickster, speech_boast, moral_trickster_wins]
    examples: [dr_know_all]

  atu_331:
    name: The Spirit in the Bottle
    description: |
      Tale-type: a person frees a dangerous spirit, genie, or imp from
      a bottle or similar container; the being threatens death, is
      tricked into re-entering the container, and then grants a reward
      or magic object when released under new terms.
    rationale: |
      First-class ATU membership separates KHM 99 from ordinary donor
      tales and from devil-bargain tales. Its structure is
      containment-release-reconfinement-reward: the spirit's danger is
      real, but human cunning turns the bottle back into leverage.
      The node enables comparative queries over bottle spirits, genie
      containment, Mercurius/imp figures, and reward objects that
      follow coerced renegotiation.
    tier: structural
    scope: tale
    lens: atu
    domains: [spirit, bottle, containment, reward, trickery]
    related: [law_reconfinement_tricks_dangerous_spirit, being_spirit, arc_trickster, moral_trickster_wins]
    examples: [the_spirit_in_the_bottle]

  atu_475:
    name: The Man as Heater of Hell's Kettle
    description: |
      Tale-type: a poor or discharged man hires himself to the Devil,
      serves in hell for a fixed term tending fires or kettles, returns
      unclean with apparently worthless wages that become gold, and
      rises in human society after infernal service.
    rationale: |
      First-class ATU membership separates KHM 100 from generic devil
      bargains and from soldier-trickster tales. Its structure is not
      soul-sale but labour-contract: fixed service, hell-kettle work,
      tabooed washing or grooming, soot-marked identity, refuse turned
      into gold, and upward mobility. The node supports comparative
      queries over infernal labour, devil employment, pollution-as-
      reward, and the "heater of hell's kettle" complex.
    tier: structural
    scope: tale
    lens: atu
    domains: [devil, hell, service, kettle, gold, soldier]
    related: [law_infernal_service_refuse_becomes_gold, law_infernal_substitution_threat_restores_stolen_wages, being_devil, loc_hell, arc_discharged_soldier]
    examples: [the_devils_sooty_brother]

  atu_361:
    name: Bearskin
    description: |
      Tale-type: a desperate man makes a pact with the Devil: for a
      fixed term he must avoid washing, grooming, prayer, or ordinary
      bedding while wearing a marked garment or animal skin. If he
      survives, he gains wealth, a bride, and freedom; if he dies, the
      Devil claims him.
    rationale: |
      First-class ATU membership separates KHM 101 from nearby devil-
      service tales such as KHM 100. Bearskin's grammar is pact-wager
      rather than infernal employment: the hero remains in the human
      world, becomes socially monstrous through unclean appearance,
      wins a compassionate bride by paying her father's debt, and is
      recognised after cleansing by a split ring. The node enables
      comparative queries over never-wash devil pacts, monstrous
      bridegrooms, soul-risk ordeals, and pact-survival rewards.
    tier: structural
    scope: tale
    lens: atu
    domains: [bearskin, devil, pact, uncleanliness, bride, soldier]
    related: [law_devil_pact_unclean_endurance_wins_freedom, law_split_betrothal_token_recognizes_true_bridegroom, state_infernal_unclean, obj_betrothal_recognition_token, arc_discharged_soldier]
    examples: [bearskin]

  atu_221:
    name: The Willow-Wren as King of the Birds
    description: |
      Tale-type: the birds decide to choose a king by contest. The
      eagle flies highest, but a tiny nameless bird hidden in his
      breast-feathers rises above him and claims kingship. When the
      angry birds set a second contest for the one who can go lowest
      into the ground, the tiny bird slips into a mouse-hole and wins
      again. The birds imprison him there under owl guard, but the owl
      falls asleep; the little bird escapes, and the tale explains why
      the owl hides by day, hates mice, and the wren is mocked as
      "king of the hedges."
    rationale: |
      First-class ATU membership separates this bird-kingship etiology
      from the collective bird-versus-beast war of ATU 222. Its grammar
      is electoral rather than military: animal language, refusal of
      monarchy by the plover, assembly of birds, highest-flight contest,
      hidden-rider trick, lowest-depth contest, mouse-hole confinement,
      failed owl sentry, and etiological names and habits. The node
      supports comparative queries over animal kingship, trickster
      sovereignty, origin of bird calls, owl nocturnality, and wren
      naming.
    tier: structural
    scope: tale
    lens: atu
    domains: [birds, kingship, contest, trickster, etiology]
    related: [law_tiny_trickster_wins_animal_kingship_contests, law_failed_sentinel_creates_nocturnal_etiology, arc_trickster, sp_bird, sp_frog, sp_duck, sp_goose, loc_marsh, moral_trickster_wins]
    examples: [the_willow_wren]

  atu_222:
    name: The War of the Birds and Quadrupeds
    description: |
      Tale-type: a dispute or insult between animal rulers escalates
      into war between flying creatures and four-footed animals. The
      smaller aerial side wins through spying, swarm tactics, or
      targeted attack on the enemy's command structure.
    rationale: |
      First-class ATU membership separates KHM 102 from ordinary beast
      fables about one predator and one trickster. Its shape is
      political and collective: insult to the wren's household,
      mobilization of land animals against birds and insects, espionage
      about the fox's tail signal, and rout through a hornet sting. The
      node enables comparative queries over animal wars, bird-versus-
      beast polities, small-creature military cunning, and honor-driven
      escalation.
    tier: structural
    scope: tale
    lens: atu
    domains: [animal-war, birds, quadrupeds, insult, swarm, fable]
    related: [law_insulted_small_royalty_summons_total_war, law_tiny_sting_breaks_command_signal, sp_bird, sp_insect, sp_bear, sp_fox]
    examples: [the_willow_wren_and_the_bear]

  atu_236:
    name: The Bittern and the Hoopoe
    description: |
      Tale-type: two former herdsmen choose opposite bad pastures for
      their cattle. One feeds cows in over-rich meadows, making them
      wild and impossible to gather; the other drives cows onto barren
      sandy hills, making them too weak to rise. Their failed herding
      commands persist as the present cries of the bittern and the
      hoopoe.
    rationale: |
      First-class ATU membership separates this pastoral bird-call
      etiology from bird-kingship ATU 221, animal-war ATU 222, and
      fish-body etiology ATU 250. Its grammar is not contest,
      election, or punishment for envy; it is moderation-failure in
      livestock care: over-abundance and barrenness both destroy
      order, and unsuccessful work-speech becomes a permanent species
      voice. The node supports comparative queries over animal-call
      origins, pastoral moderation, former-human birds, and etiology
      produced by failed labour rather than combat or insult.
    tier: structural
    scope: tale
    lens: atu
    domains: [birds, cattle, pasture, moderation, etiology]
    related: [law_immoderate_pasture_creates_eternal_herding_call, moral_moderation_preserves_order, sp_bird, sp_cattle, agency_domestic_labor, agency_speech]
    examples: [the_bittern_and_hoopoe]

  atu_250:
    name: The Sole and the Flounder
    description: |
      Tale-type: the fishes are discontented because their kingdom has
      no order, law, or justice, so they decide to choose as ruler the
      fish who can cleave through the water most quickly and help the
      weak. In the race the herring comes first, but the flat envious
      sole mocks him as naked; since that time the sole's mouth has
      been on one side as punishment.
    rationale: |
      First-class ATU membership keeps this aquatic kingship etiology
      distinct from bird-kingship ATU 221 and animal-war ATU 222. Its
      grammar is compact: disorder among fishes, demand for a ruler
      who enforces justice, speed contest at the shore, herring victory,
      envious insult by the losing sole, and bodily deformation as
      species-origin. The node supports comparative queries over fish
      polity, animal elections, envy toward winners, and etiological
      body marks.
    tier: structural
    scope: tale
    lens: atu
    domains: [fish, kingship, contest, envy, etiology]
    related: [law_envious_insult_marks_animal_body, sp_fish, loc_sea, affect_envy, agency_social_rank, moral_retributive]
    examples: [the_sole_the_flounder]

  atu_565:
    name: The Magic Mill
    description: |
      Tale-type: a magic production object such as a mill, pot, or
      vessel creates unlimited food or goods when given a formulaic
      command, but disaster follows when the user cannot stop it with
      the required counter-formula.
    rationale: |
      First-class ATU membership separates KHM 103 from ordinary donor-
      food tales and from wish-object tales. Its core is not simply
      abundance but controllability: the same pot that ends poverty and
      hunger floods house, street, and town when operated without the
      stop-word. The node enables comparative queries over magic-mill,
      porridge-pot, and inexhaustible-production tales.
    tier: structural
    scope: tale
    lens: atu
    domains: [magic-mill, pot, food, formula, abundance, overflow]
    related: [law_unchecked_formula_abundance_floods_world, obj_self_cooking_pot, law_formula_commands_magic_objects, affect_hunger]
    examples: [sweet_porridge]

  atu_1384:
    name: A Man Seeks Someone as Stupid as His Wife
    description: |
      Tale-type: a husband judges his wife foolish after a household or
      trade blunder and postpones punishment while searching for anyone
      still more foolish. He encounters victims whose credulity allows
      him to gain money, animals, or other goods, then returns home
      claiming the comparison has saved his wife.
    rationale: |
      First-class ATU membership separates KHM 104 from generic fool
      tales and from ordinary peasant trickster tales. Its structure is
      comparative: one domestic foolish act triggers a search for
      greater folly, and the trickster's profit becomes evidence in a
      ranking of stupidity. The node supports queries over spouse-
      comparison schwanks, false afterlife courier fraud, and household
      economics where foolishness itself becomes profitable.
    tier: structural
    scope: tale
    lens: atu
    domains: [foolishness, wife, husband, trickster, comparison, schwank]
    related: [law_foolish_collateral_inverts_sale_value, law_false_afterlife_courier_extracts_goods, arc_fool, arc_trickster, moral_trickster_wins]
    examples: [wise_folks]

  atu_285:
    name: The Child and the Snake
    description: |
      Tale-type or legend-type: a child forms a familiar relation with
      a snake, often by sharing milk or food. The snake may bring
      treasure, but harm to the snake or breach of the exchange brings
      loss, death, or the end of prosperity.
    rationale: |
      First-class ATU membership keeps KHM 105's snake legends distinct
      from serpent-medicine tales such as ATU 612 and animal-language
      tales such as ATU 673. Its focus is domestic intimacy between
      child and snake: feeding, treasure, maternal misunderstanding,
      grief, and the child's decline after the snake dies. The node
      supports comparative queries over house-snake legends, milk
      offerings, child vitality, and serpent treasure.
    tier: structural
    scope: tale
    lens: atu
    domains: [snake, child, milk, treasure, legend]
    related: [law_house_snake_feeding_sustains_child_vitality, law_serpent_treasure_requires_reciprocal_respect, sp_snake, obj_serpent_treasure]
    examples: [stories_about_snakes]

  atu_672b:
    name: The Serpent's Crown
    description: |
      Tale-type or motif-cluster in which a serpent brings or exposes a
      crown or precious object, and human seizure or failure to respect
      the exchange destroys the serpent or ends the treasure-flow.
    rationale: |
      First-class ATU membership is useful here because KHM 105 is a
      composite of short snake legends. ATU 285 covers the child-snake
      feeding bond, while 672B isolates the golden-crown episode: silk
      cloth, serpent return, missing crown, and grief-death against the
      wall. The node lets later serpent-crown variants be queried
      without forcing them into the milk-child pattern.
    tier: structural
    scope: tale
    lens: atu
    domains: [snake, crown, treasure, textile, grief]
    related: [law_serpent_treasure_requires_reciprocal_respect, obj_serpent_treasure, sp_snake]
    examples: [stories_about_snakes]

  atu_676:
    name: Open Sesame / Simeli Mountain
    description: |
      Tale-type: a poor person discovers robbers or wild men opening a
      treasure mountain or cave by an exact spoken password. He uses
      the formula moderately and improves his household; a greedy
      relative discovers the secret, enters for greater treasure,
      forgets or corrupts the password, and is killed by the returning
      robbers.
    rationale: |
      First-class ATU membership keeps KHM 142 distinct from ordinary
      treasure-donor tales and from portable formula-object tales such
      as ATU 563. Its grammar is threshold-password hoard access:
      overheard formula, hidden cavern, moderate taking, sticky measure
      detection, greedy imitation, forgotten name, and robber execution.
      The node supports comparative queries over Open-Sesame variants,
      mountain treasure, exact formula memory, and greed punished by
      enclosure.
    tier: structural
    scope: tale
    lens: atu
    domains: [treasure, mountain, cave, formula, robbers, greed]
    related: [law_password_opens_hidden_mountain_treasure, loc_mountain, loc_cave, affect_greed, moral_retributive]
    examples: [simeli_mountain]

  atu_402:
    name: The Animal Bride
    description: |
      Tale-type: a low-status or underestimated hero is sent to obtain
      a bride, horse, or comparable prize and encounters a female animal
      who demands service or tests him. The animal later appears as a
      human princess or bride and gives the hero superior wealth,
      marriage, and recognition.
    rationale: |
      First-class ATU membership distinguishes KHM 106 from ordinary
      animal-helper tales and from animal-bridegroom tales. The tabby
      cat is not a mere donor; she is the hidden bride whose household
      service, silver tools, twelve horses, and transformed castle
      reveal the hero's worth. The node supports comparative queries
      over Animal Bride variants such as The Three Feathers and
      cat-princess reward tales.
    tier: structural
    scope: tale
    lens: atu
    domains: [animal-bride, cat, service, horse, marriage, transformation]
    related: [arc_enchanted_animal_bride, law_faithful_service_to_animal_bride_reveals_reward, sp_cat, obj_golden_horse, agency_domestic_labor]
    examples: [the_poor_millers_boy_and_the_cat]

  atu_407a:
    name: A Riddling Tale
    description: |
      Tale-type: women are changed into identical flowers, but one
      flower-wife is allowed to return to her own home at night. Her
      husband is told to gather her from the field; he recognises her
      because no dew has fallen on the flower that spent the night
      indoors, and the act releases her from the flower-form.
    rationale: |
      First-class ATU membership keeps KHM 160 distinct from broader
      animal- or plant-bride tales and from courtly riddle-marriage
      plots. Its structure is compactly ontological: transformation
      into indistinguishable flowers, a nightly exception to the spell,
      a riddle about recognition, and solution through the absence of
      dew. The node supports comparative queries over dew-signs,
      flower enchantment, marital recognition, and riddles whose answer
      depends on environmental evidence.
    tier: structural
    scope: tale
    lens: atu
    domains: [riddle, flower, dew, transformation, marriage, recognition]
    related: [law_dewless_flower_reveals_night_homecoming, transform_plant_human, speech_riddle, loc_field]
    examples: [a_riddling_tale]

  atu_613:
    name: The Two Travellers
    description: |
      Tale-type: two travellers or companions separate morally when one
      betrays, mutilates, or abandons the other. The injured traveller
      receives hidden healing or knowledge, shows mercy to animals, and
      later survives impossible tasks through those animals' repayment,
      while the betrayer is exposed or punished.
    rationale: |
      First-class ATU membership separates KHM 107 from ordinary
      grateful-animal tales and from simple false-accusation plots. Its
      architecture combines road companionship, starvation extortion,
      blindness, gallows-healing, mercy to foal/stork/ducks/bees,
      courtly false boasts, animal-aided task completion, marriage, and
      mirror punishment of the betrayer. The node enables comparative
      queries over the "two travellers" complex rather than only its
      grateful-animal subepisodes.
    tier: structural
    scope: tale
    lens: atu
    domains: [travellers, betrayal, blindness, grateful-animals, tasks, retribution]
    related: [arc_treacherous_travel_companion, law_companion_hunger_extorts_body, law_gallows_dew_restores_stolen_eyes, law_rescued_animals_repay_kindness, law_false_boast_imposes_impossible_task]
    examples: [the_two_travellers]

  atu_440:
    name: The Frog King (or Iron Henry)
    description: |
      Tale-type: a princess loses an object (typically a ball) in a
      well; a frog retrieves it in exchange for a promise to share
      table, plate, and bed; the princess reneges, the parent
      enforces the promise; the frog is transformed back into a
      prince.
    rationale: |
      First-class ATU nodes let us connect Grimm's tale to any tale
      with the same ATU number (Italian, Russian, etc. when we
      expand). The graph becomes folklorically navigable beyond a
      single corpus.
    tier: structural
    scope: tale
    lens: atu
    domains: [animal-bridegroom, curse, promise]
    related: [arc_enchanted_prince, arc_reluctant_bride, transform_release_by_violence]

  atu_441:
    name: Hans the Hedgehog
    description: |
      Tale-type: a child is born as a human-animal hybrid after a
      frustrated parental wish, is rejected in the household, leaves
      with music and livestock, helps lost kings in exchange for the
      first homecoming encounter, punishes the false promise, and is
      released into human form when the animal skin is destroyed after
      a properly honoured marriage.
    rationale: |
      First-class ATU membership separates Hans the Hedgehog from the
      broader animal-bridegroom cycle. Its grammar is not simply a
      cursed prince: angry birth-wish, spiny hybrid body, hearth
      exclusion, rooster-mounted forest herding, first-courtyard
      promise, false/dutiful princess contrast, and burned skin release
      form a specific tale-type. The node enables queries over hybrid
      birth, promise-claimed daughters, spiny animal bridegrooms, and
      redemption by honoured obligation.
    tier: structural
    scope: tale
    lens: atu
    domains: [animal-bridegroom, hybrid, promise, birth-wish, skin-release]
    related: [arc_hybrid_outcast_bridegroom, law_angry_wish_literalizes_birth, law_first_homecoming_claims_promised_child, law_burned_animal_skin_releases_human_form, sp_hedgehog]
    examples: [hans_the_hedgehog]

  atu_430:
    name: The Donkey / Animal Bridegroom with Removable Skin
    description: |
      Tale-type: a royal child is born in donkey form, rejected by the
      mother but accepted by the father as heir. He masters the lute,
      leaves after seeing his animal form reflected in water, enters
      another kingdom through music, marries the princess, secretly
      removes his ass-skin at night, and is fixed in human royal form
      when the old king burns the skin.
    rationale: |
      First-class ATU membership keeps KHM 144 distinct from ATU 441
      "Hans the Hedgehog" and from generic frog-prince release. Its
      grammar is courtly rather than rustic: divine child-granting,
      donkey birth, paternal recognition as heir, musical education,
      well-reflection shame, gate performance, insistence on noble
      rank, bridal-chamber skin removal, witnessed secret, and
      beneficent skin-burning by the bride's father. The node supports
      comparative queries over animal bridegrooms whose social
      legitimacy and musical refinement precede visible humanization.
    tier: structural
    scope: tale
    lens: atu
    domains: [animal-bridegroom, donkey, music, skin-release, royalty, marriage]
    related: [arc_hybrid_outcast_bridegroom, law_burned_animal_skin_releases_human_form, law_music_attracts, obj_lute, sp_donkey]
    examples: [the_donkey]

  atu_431:
    name: The Hut in the Forest
    description: |
      Tale-type: three sisters are sent one after another through a
      forest with food for their father, but birds eat the seed-trails
      and each girl reaches an enchanted forest hut. The first two
      accept food and bedding while neglecting the hut's animals and
      are dropped into the cellar. The youngest feeds and waters the
      hen, cock, and cow before herself, sleeps after prayer, and at
      midnight breaks the enchantment: the hut becomes a palace, the
      old man becomes a king's son, and the animals become attendants.
    rationale: |
      First-class ATU membership keeps KHM 169 distinct from generic
      animal-helper tales and from ordinary kind/unkind girl donor
      tests. Its grammar is a forest-hut hospitality ordeal: three
      sisters, disappearing seed-trails, an old enchanted host, three
      domestic animal judges, feeding-before-self, midnight house
      transformation, prince restoration, and servant-punishment for
      the negligent sisters. The node supports comparative queries
      over animal-directed hospitality, enchanted households, and
      kindness tests whose beneficiaries are transformed court
      attendants.
    tier: structural
    scope: tale
    lens: atu
    domains: [forest, hut, animal-hospitality, enchantment, sisters]
    related: [law_animal_hospitality_breaks_house_enchantment, law_kindness_to_hidden_donors_rewarded, arc_enchanted_prince, arc_supernatural_donor, state_transformed, sp_hen, sp_rooster, sp_cattle, moral_kindness_rewarded]
    examples: [the_hut_in_the_forest]

  atu_425c_425a:
    name: Beauty and the Beast / Animal as Bridegroom and Lost Husband
    description: |
      Tale-type complex in which a father promises a daughter to an
      animal or beast-like bridegroom, the bride discovers his human
      form, loses him through broken conditions or exposure, searches
      across cosmic distance, and recovers him from a false bride.
    rationale: |
      First-class ATU membership keeps KHM 88's composite structure
      queryable: its opening belongs to Beauty-and-the-Beast exchange
      logic, while the long middle and ending belong to the lost-
      husband search, celestial/wind helpers, and bribed nights beside
      the bridegroom. A single node preserves the local Grimm hybrid
      without forcing analysts to choose only the father-promise half
      or only the vanished-husband half.
    tier: structural
    scope: tale
    lens: atu
    domains: [animal-bridegroom, lost-husband, beauty-and-beast, false-bride, spouse-quest]
    related: [arc_enchanted_prince, state_forgotten_bride, law_forbidden_light_exiles_animal_bridegroom, law_voice_recognizes_forgotten_bride, law_broken_speech_limit_exiles_released_bridegroom, obj_enchanted_iron_stove_prison]
    examples: [the_singing_springing_lark, the_iron_stove]

  atu_400:
    name: The Man on a Quest for His Lost Wife
    description: |
      Tale-type: a hero recovers an enchanted or captive bride from a
      witch or remote otherworld, then loses her again through a
      homecoming memory breach. The forgotten bride uses wondrous gifts
      or dresses to buy nights near him until her voice restores his
      memory and the true wedding replaces a false one.
    rationale: |
      First-class ATU membership separates the lost-wife recovery arc
      from animal-bridegroom ATU 425 and from pure magic-flight tales.
      KHM 193 combines glass-mountain ascent, witch tasks, wishing-ring
      rescue, right-cheek forgetting, and three celestial dresses traded
      for recognition nights. The node enables queries over rescued
      brides who must rescue the rescuer's memory after homecoming.
    tier: structural
    scope: tale
    lens: atu
    domains: [lost-wife, forgotten-bride, witch, recognition, celestial-dresses]
    related: [state_forgotten_bride, law_homecoming_kiss_erases_bride_memory, law_voice_recognizes_forgotten_bride, law_wonder_gifts_purchase_recognition_nights]
    examples: [the_drummer]

  atu_533:
    name: The Goose Girl
    description: |
      Tale-type: a princess travelling to her bridegroom is displaced
      by a servant who steals her horse, garments, and bride role;
      the true bride becomes a goose-girl, while tokens, animal
      testimony, overheard lament, and a self-pronounced sentence
      restore her rank and punish the impostor.
    rationale: |
      First-class ATU membership separates this false-bride displacement
      tale from Cinderella-like hidden identity and from animal-
      bridegroom quests. KHM 89 combines maternal blood protection,
      speaking horse testimony, oath-bound silence, goose-herding
      demotion, and public self-condemnation; the ATU node keeps that
      bundle queryable as a coherent international tale type.
    tier: structural
    scope: tale
    lens: atu
    domains: [false-bride, goose-girl, horse, blood-token, hidden-identity]
    related: [arc_false_bride, state_hidden_identity, law_maternal_blood_token_guards_rank, law_object_confession_circumvents_forced_oath, law_self_sentence_punishes_false_bride]
    examples: [the_goose_girl]

  atu_401a_400_560_518:
    name: Enchanted Princess in Her Castle / Lost Wife and Magic Objects
    description: |
      Composite tale-type for KHM 92: a promised child escapes a
      demonic claim, reaches an enchanted castle, releases a princess
      by silent torment, loses wife and kingdom through broken promise
      around a wishing ring, then wins magic objects from quarreling
      giants and returns invisibly to stop the false wedding.
    rationale: |
      First-class ATU membership is useful here precisely because KHM
      92 is not a single clean type. It combines ATU 810-style promised
      soul, 401A enchanted-princess release, 560 magic ring, 518
      quarreling giants' magic objects, and 400 lost-wife return. A
      composite node keeps the actual Grimm structure queryable without
      flattening it to only the castle ordeal or only the lost-wife
      recovery.
    tier: structural
    scope: tale
    lens: atu
    domains: [enchanted-princess, lost-wife, wishing-ring, magic-objects, giants]
    related: [law_silent_torment_releases_enchanted_princess, law_wishing_ring_obeys_but_exposes_broken_promise, law_quarreling_giants_lose_magic_objects, obj_wishing_ring]
    examples: [the_king_of_the_golden_mountain]

  atu_15:
    name: The Theft of Butter (by Playing Godfather)
    description: |
      Tale-type: an animal partners with another to share a store of
      food; the cunning animal sneaks away under false pretexts
      (typically "going to be godfather/mother to a newborn") and
      eats the store alone; reports back to the naive partner with
      revealing names ("Top-off", "Half-done", "All-gone"); when the
      theft is finally discovered, often eats the partner too.
    rationale: |
      Core ATU type for the cat-and-mouse partnership genre.
      Internationally widespread (German, Slavic, Romance variants).
      First-class node lets us connect Grimm's KHM 2 to its
      international cousins when the corpus expands.
    tier: structural
    scope: tale
    lens: atu
    domains: [beast-fable, deception, theft, naive-victim]
    related: [arc_predator, arc_trickster, arc_naive_victim, law_might_unmakes_promise]

  atu_65:
    name: The Wedding of Mrs Fox
    description: |
      Tale-type: the fox's widow or apparently widowed wife receives a
      sequence of animal suitors through a servant-messenger and judges
      them by whether they match the old fox's distinctive traits
      before a comic wedding resolution.
    rationale: |
      First-class ATU membership keeps this beast-courtship tale apart
      from predator-deception and animal-helper plots. Its grammar is
      domestic and comparative: the servant at the door mediates
      suitors, the widow asks for exact fox attributes such as tails,
      red stockings, and pointed mouth, and the wedding either exposes
      the wife's infidelity under a feigned-death test or completes
      remarriage to a proper young fox.
    tier: structural
    scope: tale
    lens: atu
    domains: [beast-fable, courtship, widow, fox, remarriage]
    related: [sp_fox, law_feigned_death_tests_fidelity, num_9, moral_comic_inversion]
    examples: [the_wedding_of_mrs_fox]

  atu_503:
    name: The Elves / Gifts of the Little People
    description: |
      Tale-type complex in which small otherworldly people enter human
      household life as hidden craft-helpers, christening hosts,
      reward-givers, or changeling-substituters, and human conduct or
      diagnostic wit determines restoration, prosperity, or return.
    rationale: |
      First-class ATU membership keeps KHM 39's elf-cycle distinct
      from ordinary donor-test tales and from dwarf bargain tales such
      as Rumpelstiltskin. Its grammar joins three elf registers:
      nocturnal labour that makes the poor shoemaker prosperous, a
      hollow-mountain christening where three days equal seven years,
      and a changeling exposed by egg-shell boiling. The node supports
      queries over little-people gifts, time displacement, and
      child-substitution without splitting the canonical Grimm cluster.
    tier: structural
    scope: tale
    lens: atu
    domains: [elves, little-people, gifts, time-displacement, changeling]
    related: [being_dwarf, law_secret_night_labor_restores_honest_poverty, law_otherworld_time_displaces_human_time, arc_changeling]
    examples: [the_elves, the_little_folks_presents]

  atu_955:
    name: The Robber Bridegroom
    description: |
      Tale-type: a bride or betrothed woman is sent to the bridegroom's
      remote house, discovers that he and his companions are murderers
      or cannibals, escapes with helper aid, and exposes him during the
      wedding feast through narrated testimony and a material token.
    rationale: |
      First-class ATU membership distinguishes the robber-bridegroom
      complex from ordinary Bluebeard forbidden-room tales and from
      generic predator stories. Its grammar is marriage-as-trap: the
      suitor's social role moves the bride toward the murder-house,
      while indirect testimony plus forensic proof reverses the wedding
      into public judgment. KHM 40 needs the type for queries over
      predatory courtship, cannibal houses, and evidentiary bride
      testimony.
    tier: structural
    scope: tale
    lens: atu
    domains: [robber-bridegroom, marriage, murder, cannibalism, testimony]
    related: [arc_murderous_bridegroom, law_dead_matter_reveals_murder, speech_testimony, obj_forensic_token, moral_retributive]
    examples: [the_robber_bridegroom]

  atu_952:
    name: The King and the Soldier / The Boot of Buffalo-Leather
    description: |
      Tale-type: a fearless discharged soldier wanders hungry through a
      forest, meets a lost huntsman whose rank is hidden, insists on
      entering a robber house despite warning, eats at the robbers'
      table, and petrifies the twelve robbers by a bottle-toast formula.
      At daybreak he fetches old comrades to bind the robbers, then
      discovers that the huntsman is the returning king and is rewarded
      for saving him.
    rationale: |
      First-class ATU membership separates this soldier-robber episode
      from robber-bridegroom testimony, animal-noise robber expulsion,
      and ordinary king-in-disguise reward tales. Its grammar is
      veteran fearlessness, buffalo-leather boots as wandering identity,
      hidden royal companion, forest robber house, old-woman warning,
      table intrusion, toast-command petrification, military arrest,
      and final royal recognition. The node supports comparative
      queries over fearless soldiers, robber-house reversals, disguised
      kings, and magic-like speech used as command discipline.
    tier: structural
    scope: tale
    lens: atu
    domains: [soldier, robber, king-disguise, forest, toast, petrification]
    related: [arc_discharged_soldier, law_toast_formula_petrifies_robber_band, state_hidden_identity, loc_forest, loc_house, num_12]
    examples: [the_boot_of_buffalo_leather]

  atu_960:
    name: The Bright Sun Brings It to Light
    description: |
      Tale-type: a poor travelling worker murders a vulnerable stranger
      for presumed money, hides the body, and later settles into
      respectable domestic life. The victim's dying words return when
      sunlight or reflection stirs the murderer's guilt; confession to
      an intimate becomes gossip, trial, and condemnation.
    rationale: |
      First-class ATU membership distinguishes this concealed-murder
      revelation from corpse-token and singing-bone tales. Its grammar
      is psychological and social rather than forensic: last words,
      delayed domestic comfort, natural light misread as accusation,
      intimate confession, broken secrecy, public knowledge, and legal
      judgment. KHM 115 needs the type for queries over guilt,
      murdered strangers, antisemitic social violence, and truth
      becoming public through speech contagion.
    tier: structural
    scope: tale
    lens: atu
    domains: [murder, guilt, sunlight, confession, justice]
    related: [law_guilt_reads_natural_light_as_accusation, speech_confession, affect_guilt, moral_retributive]
    examples: [the_bright_sun_brings_it_to_light]

  atu_85:
    name: The Mouse, the Bird, and the Sausage
    description: |
      Tale-type: mouse, bird, and sausage keep house by a stable
      division of labour; an outside bird shames the wood-gathering
      bird into demanding a role exchange; the sausage is eaten while
      fetching wood, the mouse dies trying to cook like the sausage,
      and the bird drowns while trying to fetch water.
    rationale: |
      First-class ATU membership separates this domestic-animal/object
      fable from predator-deception tales such as ATU 15 and from
      etiological object tales such as ATU 295. The distinctive grammar
      is not theft or origin-marking but catastrophic labour exchange:
      body-specific household work becomes fatal when redistributed
      under social shame and envy.
    tier: structural
    scope: tale
    lens: atu
    domains: [beast-fable, domestic-labour, role-exchange, animated-object, catastrophe]
    related: [law_role_exchange_breaks_domestic_order, agency_domestic_labor, moral_comic_inversion, being_animated_object]
    examples: [the_mouse_the_bird_and_the_sausage]

  atu_710:
    name: Our Lady's Child
    description: |
      Tale-type: a poor parent gives their child to the Virgin Mary
      (or other divine figure); the child grows up in heaven; is
      given keys to forbidden doors; opens the forbidden one; is
      cast back to earth, mute; marries a king; bears children whom
      Mary takes away each time the queen denies her sin; finally
      condemned to the stake, she confesses, and is restored.
    rationale: |
      Core ATU type for the religious-legend register in Grimm. The
      "forbidden door + silent endurance + final confession" pattern
      recurs internationally. First-class node connects KHM 3 to
      international religious-legend cousins.
    tier: structural
    scope: tale
    lens: atu
    domains: [religious, prohibition, repentance, silent-bride]
    related: [arc_silent_bride, arc_repentant_sinner, arc_prohibition_giver, law_prohibition_invites_violation, law_repentance_restores, moral_repentance]

  atu_326:
    name: The Youth Who Wanted to Learn What Fear Is
    description: |
      Tale-type: a young protagonist sets out to learn fear, an affect
      he has never felt; encounters a series of supernatural horrors
      (hanged men at gallows, haunted castle ghosts, ghost-cats,
      revenant cousin, bearded giant); defeats them all by sheer
      fearlessness; wins princess and treasure; finally is taught to
      shudder by his wife pouring cold water with small fish on him
      in bed.
    rationale: |
      Core ATU type for the jocular-horror register: hero defeats
      supernatural through deficit rather than virtue. First-class
      node lets us cluster this tale with international cousins
      (Bavarian and Slavic versions of the same fearless-hero motif).
    tier: structural
    scope: tale
    lens: atu
    domains: [horror, jocular, fearlessness, anti-quest]
    related: [arc_fearless_fool, state_fearless, law_fearlessness_defeats_supernatural, moral_comic_inversion, being_spirit]
    examples: [youth_who_went_forth_to_learn_fear]

  atu_123:
    name: The Wolf and the Kids
    description: |
      Tale-type: a mother goat (or analogous mother) leaves her young
      home alone, warning them not to admit the wolf. The wolf
      disguises himself (soft voice via chalk; white paws via flour)
      and tricks his way in; swallows the children whole; one hides
      and survives. The mother returns, finds the wolf asleep with
      swallowed children intact in his belly, surgically retrieves
      them and replaces them with stones; the stones drown him at the
      well.
    rationale: |
      Core ATU type for the protective-mother / wolf-as-deceiver
      register. Internationally widespread, with the
      disguise-by-substance motif (chalk for voice, flour for paws)
      and the surgical-rescue + stone-substitution motif as defining
      features.
    tier: structural
    scope: tale
    lens: atu
    domains: [predator, disguise, devouring-reversed, retributive]
    related: [arc_protective_mother, arc_predator, law_devouring_can_be_reversed, state_disguised, moral_retributive]
    examples: [the_wolf_and_the_seven_young_kids]

  atu_130:
    name: The Bremen Town Musicians
    description: |
      Tale-type: aged domestic animals threatened with death or disposal
      leave their masters to become musicians. On the road they gather
      as a quartet, discover a robber-house in the forest, frighten the
      robbers away through collective sound and a stacked animal-body,
      and finally keep the house as their new dwelling.
    rationale: |
      First-class ATU membership separates this discarded-animal
      coalition tale from predator fables and magical animal-helper
      tales. Its core grammar is not service to a human hero but mutual
      rescue among exhausted animals: old age becomes survival through
      ensemble, noise, and comic misrecognition. KHM 27 needs the type
      to connect donkey, dog, cat, and rooster as a four-part band
      rather than isolated beast-fable figures.
    tier: structural
    scope: tale
    lens: atu
    domains: [animals, old-age, music, robbers, quartet]
    related: [law_collective_noise_magnifies_the_weak, agency_music, sp_donkey, sp_dog, sp_cat, sp_rooster, num_4]
    examples: [the_bremen_town_musicians]

  atu_101:
    name: Old Sultan
    description: |
      Tale-type: an old faithful dog is threatened with death because
      age has made him seem useless. A wolf helps him stage a child-
      rescue so the master will value him again. When the wolf later
      demands permission to steal livestock, the dog remains loyal to
      the master, exposes the plan, and survives a comic challenge in
      which the wolf and boar misread a lame cat as an armed ally.
    rationale: |
      First-class ATU membership separates this old-service-dog fable
      from discarded-animal coalition tales such as ATU 130 and from
      predator-devouring wolf tales. Its grammar is not flight from
      service, but restoration inside service: staged rescue repairs
      the household bond, and the final conflict tests whether animal
      friendship outranks loyalty to the human master. KHM 48 needs
      the type for queries over aged domestic animals, loyal service,
      staged rescue, and comic animal misrecognition.
    tier: structural
    scope: tale
    lens: atu
    domains: [dog, old-age, loyalty, wolf, staged-rescue, service]
    related: [arc_discarded_service_animal, law_staged_rescue_restores_worth, sp_dog, sp_wolf, moral_faithful_service_rewarded]
    examples: [old_sultan]

  atu_157:
    name: Learning to Fear Men
    description: |
      Tale-type: a wolf or other predator hears that man is stronger
      than animals, boasts that he would attack a man anyway, is shown
      a true adult man, attacks, and is badly wounded by human weapons.
      The animal later misdescribes gun and blade as strange bodily or
      natural forces.
    rationale: |
      Core ATU type for the animal's lesson in human technological
      superiority. It differs from predator-prey consumption tales
      because the conflict is epistemic and comparative: the wolf must
      learn what a "man" is and what human strength means. First-class
      membership lets KHM 72 connect with international "learning to
      fear men" variants while preserving the fox's prudential cunning
      as separate from the wolf's failed bravado.
    tier: structural
    scope: tale
    lens: atu
    domains: [wolf, human, weapon, caution, animal-tale]
    related: [law_human_artifice_overmasters_animal_force, sp_wolf, sp_human, sp_fox, moral_prudential_retreat]
    examples: [the_wolf_and_the_man]

  atu_41:
    name: The Wolf and the Fox in the Storehouse / Overeating in the Pantry
    description: |
      Tale-type: a greedy wolf compels a fox to obtain food. The fox
      repeatedly supplies a safe portion, but the wolf returns for more,
      is beaten, and finally eats so much in a cellar or storehouse that
      he cannot escape through the hole by which he entered.
    rationale: |
      Core ATU type for the wolf-fox gluttony trap. It differs from
      ATU 157 because the wolf's defeat does not come from learning
      human technological superiority, but from appetite defeating
      escape. First-class membership lets KHM 73 connect with
      international storehouse/pantry variants while preserving the
      weaker fox's cunning survival under a coercive wolf-master.
    tier: structural
    scope: tale
    lens: atu
    domains: [wolf, fox, gluttony, cellar, animal-tale]
    related: [law_gluttony_traps_predator, law_might_unmakes_promise, sp_wolf, sp_fox, moral_retributive]
    examples: [the_wolf_and_the_fox]

  atu_3star:
    name: The Fox and His Cousin / Gossip Wolf and the Fox
    description: |
      Tale-type: a she-wolf asks a fox, treated as kin or godparent, to
      help rear her child. The fox uses the obligation to lure her to a
      sheepfold or farm, leaves her to be punished, then pretends to be
      injured so she carries him home before he mocks and abandons her.
    rationale: |
      First-class ATU membership separates this fox-wolf trick from
      ATU 41's gluttony-and-storehouse plot. KHM 74 is not primarily
      about the wolf overeating; it is about the fox exploiting
      godparental trust, kinship obligation, and feigned injury. The
      node keeps short animal trick tales queryable by their social
      mechanism rather than only by species.
    tier: structural
    scope: tale
    lens: atu
    domains: [fox, wolf, godparent, deception, kinship]
    related: [law_feigned_injury_compels_care, sp_fox, sp_wolf, speech_lie, moral_trickster_wins]
    examples: [the_fox_and_his_cousin]

  atu_105:
    name: The Fox and the Cat
    description: |
      Tale-type: a fox boasts of many arts or a sackful of cunning and
      mocks a cat who knows only one art. When hunters and hounds
      arrive, the cat uses its single climbing skill and survives,
      while the fox is caught.
    rationale: |
      Core ATU type for the one-skill-versus-many-arts animal fable.
      It differs from ATU 41 and ATU 3* because the conflict is not
      gluttony or kinship deception, but the contrast between modest
      practical competence and arrogant advertised cleverness. Naming
      it supports comparative queries over animal tales that test
      skill-count, pride, and escape under sudden danger.
    tier: structural
    scope: tale
    lens: atu
    domains: [fox, cat, skill, boast, hounds]
    related: [law_single_escape_skill_beats_boasted_arts, sp_fox, sp_cat, affect_pride, moral_prudential_retreat]
    examples: [the_fox_and_the_cat]

  atu_227:
    name: The Geese Ask for Respite for Prayer
    description: |
      Tale-type: a fox or predator finds geese or analogous prey and
      prepares to eat them. The prey ask permission for a final prayer,
      begin praying aloud, and continue so long that the promised
      eating is indefinitely postponed.
    rationale: |
      First-class ATU membership keeps KHM 86 distinct from predator
      fables where prey escape by running, fighting, hiding, or
      technical skill. Its grammar is comic suspension: a granted
      devotional interval expands until it consumes the plot itself.
      The node supports queries over animal tales where ritual speech,
      not strength or travel, prevents predation.
    tier: structural
    scope: tale
    lens: atu
    domains: [fox, geese, prayer, delay, animal-tale]
    related: [law_endless_prayer_suspends_predation, speech_prayer, sp_fox, sp_goose, moral_comic_inversion]
    examples: [the_fox_and_the_geese]

  atu_275a:
    name: The Race between the Hare and the Hedgehog
    description: |
      Tale-type: a proud swift animal mocks a slower or lower animal,
      accepts a wagered race, and is defeated because the slow animal
      secretly stations an indistinguishable spouse or double at the
      far end of the course to cry that the runner has already arrived.
    rationale: |
      First-class ATU membership separates this beast-race trick from
      general trickster profit tales and from animal kingship contests.
      Its grammar is exact: insult to bodily capacity, wagered race,
      furrow course, hidden mate as positional double, repeated
      "already here" calls, exhaustion death, and etiological warning
      against racing Buxtehude hedgehogs. The node supports queries
      over race deception, paired animal doubles, pride punished by
      speed, and spouse-based trickery.
    tier: structural
    scope: tale
    lens: atu
    domains: [animal-tale, race, hedgehog, hare, pride, double]
    related: [law_positional_spouse_double_wins_repeated_race, sp_hedgehog, sp_hare, moral_trickster_wins]
    examples: [the_hare_and_the_hedgehog]

  atu_652:
    name: The Boy Whose Wishes Always Come True
    description: |
      Tale-type: a child is born with a power by which wishes come
      true; a villain abducts or controls him and falsely accuses the
      mother; the wish-powered boy later exposes the wrong, transforms
      or punishes the villain, restores the beloved, and returns to
      royal kinship.
    rationale: |
      First-class ATU membership keeps the wish-child plot distinct
      from `atu_461` luck-child tales, where prophecy protects the
      hero through enemy reversals. In ATU 652 the decisive engine is
      not fate but performative wish-speech: whatever the child wishes
      materializes. The node supports comparative queries over born
      magical speech, false maternal accusation, flower-bride motifs,
      and punitive transformation.
    tier: structural
    scope: tale
    lens: atu
    domains: [wish-child, false-accusation, transformation, royal-family, flower-bride]
    related: [law_wish_speech_materializes_reality, speech_wish, law_false_blood_evidence_convicts_innocent, moral_retributive]
    examples: [the_pink]

  atu_750a:
    name: The Three Wishes / The Poor Man and the Rich Man
    description: |
      Tale-type: a divine or supernatural traveler tests hospitality
      at opposed rich and poor households. The poor hosts welcome the
      traveler and receive three wise blessings, while the rich host
      seeks the same gift afterward and wastes the wishes through
      anger, greed, or foolish speech.
    rationale: |
      First-class ATU membership keeps this religious three-wishes tale
      distinct from generic wish-power tales and from simple kindness-
      rewarded donor tests. Its grammar is double: hospitality reveals
      moral worth, then wish-speech reveals inner disorder. KHM 87
      needs the type for queries over rich/poor moral contrast,
      divine disguise, and the comic self-punishment of badly governed
      wishes.
    tier: structural
    scope: tale
    lens: atu
    domains: [three-wishes, hospitality, divine, rich-poor, religious-legend]
    related: [law_kindness_to_hidden_donors_rewarded, law_unruled_wishes_waste_the_gift, being_divine, speech_wish, moral_kindness_rewarded]
    examples: [the_poor_man_and_the_rich_man]

  atu_769:
    name: The Dead Child Seeking Rest
    description: |
      Tale-type: a dead child cannot rest because an unresolved tie
      from the living world still burdens the grave. In one form, the
      mother's unceasing tears keep the burial shroud wet until she
      bears grief quietly. In another, a child has hidden farthings
      meant for a poor man and returns daily to seek them until the
      money is found and given away.
    rationale: |
      First-class ATU membership keeps these dead-child rest legends
      distinct from murder-revelation revenant tales and resurrection
      tales. Their shared grammar is devotional and restorative: the
      child returns not to accuse a killer but because rest is blocked
      by an earthly residue, whether wet mourning cloth or hidden alms
      money. The node supports queries over dead-child legends,
      mourning discipline, restitution, household haunting, grave rest,
      and material signs that the dead are not yet released.
    tier: structural
    scope: tale
    lens: atu
    domains: [dead-child, grief, alms, grave, religious-legend]
    related: [law_excessive_mourning_burdens_dead_child, law_hidden_alms_money_binds_dead_child_to_restless_search, obj_burial_shroud, state_liminal_dead, affect_grief, affect_guilt]
    examples: [the_shroud, the_stolen_farthings]

  atu_774e:
    name: The Lord's Animals and the Devil's
    description: |
      Tale-type or etiological legend: God creates the animals and
      chooses the wolf as his dog, while the Devil creates goats. The
      goats' tails snag, the Devil bites them off, their harmful
      grazing brings God's wolves against them, and a seasonal payment
      loophole makes the Devil lose his damages; in rage he gives goats
      devilish eyes.
    rationale: |
      First-class ATU membership keeps KHM 148 distinct from ordinary
      wolf-goat beast tales and from devil-bargain legends. Its grammar
      is etiological and legal-comic: rival creation, faulty goat
      anatomy, agricultural harm, divine wolf enforcement, damage
      claim, oak-leaf timing, Constantinople exception, and final
      body-mark explanation. The node supports queries over animal
      origin legends where divine and infernal creation compete.
    tier: structural
    scope: tale
    lens: atu
    domains: [etiology, goat, wolf, devil, creation, debt, body-mark]
    related: [being_divine, being_devil, sp_goat, sp_wolf, law_infernal_creation_marks_goat_body, law_exceptional_leaf_tree_voids_infernal_debt]
    examples: [the_lords_animals_and_the_devils]

  atu_779:
    name: Divine Rewards and Punishments
    description: |
      Tale-type or religious exemplum: divine order answers a child's
      moral condition through bodily or material signs. In punitive
      form, a willful child dies and remains restless until maternal
      correction quiets the grave. In rewarding form, a pious orphan
      gives away bread and garments to the needy until she owns
      nothing, then receives star-money and a new linen shirt from
      heaven. In etiological form, human carelessness with divine
      abundance causes God to reduce the fruitfulness of corn while
      preserving enough grain for innocent birds.
    rationale: |
      First-class ATU membership keeps these short religious exempla
      queryable as divine moral signs rather than ordinary ghost,
      charity, or kindness-test tales. KHM 117 shows the punitive pole:
      disobedience persists through death as a grave-arm until the
      mother strikes it down. KHM 153 shows the rewarding pole:
      radical almsgiving is answered by heavenly replacement and
      wealth. KHM 194 adds an agrarian etiological pole: wasted corn
      makes divine plenty retract into the reduced ears that now grow.
      The node supports comparative queries over divine reward and
      punishment, child morality, posthumous signs, heavenly provision,
      and sacred food stewardship.
    tier: structural
    scope: tale
    lens: atu
    domains: [divine-justice, child, reward, punishment, religious-legend, agriculture]
    related: [arc_willful_child, arc_pious_orphan, law_maternal_rod_quiets_posthumous_disobedience, law_total_almsgiving_draws_heavenly_replacement, law_wasted_grain_reduces_divine_abundance, moral_disobedience_punished, moral_providential_election]
    examples: [the_wilful_child, the_star_money, the_ear_of_corn]

  atu_660:
    name: The Three Army Surgeons
    description: |
      Tale-type: three surgeons boast of perfect skill by removing
      hand, heart, and eyes overnight, entrust the parts to an inn
      household, lose them through a servant's secret lover and a cat,
      and reattach substitute parts from a thief, a cat, and a pig.
      The restored bodies then reveal compulsions and perceptions
      belonging to the substituted parts.
    rationale: |
      First-class ATU membership separates this medical schwank from
      ordinary resurrection-remedy tales. Its grammar is not successful
      healing but comic misrepair: professional boast, staged self-
      dismemberment, failed domestic custody, illicit substitution,
      technically successful attachment, transferred agency, and
      monetary compensation that cannot restore bodily identity. KHM
      118 needs the type for comparative queries over surgical comedy,
      borrowed organs, and the unstable boundary between body part and
      character.
    tier: structural
    scope: tale
    lens: atu
    domains: [surgery, body-parts, substitution, inn, schwank]
    related: [law_mismatched_body_parts_transfer_agency, obj_rejoining_salve, state_maimed, moral_comic_inversion]
    examples: [the_three_army_surgeons]

  atu_1297:
    name: The Seven Swabians
    description: |
      Tale-type: a comic group of seven Swabian adventurers arm
      themselves with one shared spear, mistake harmless signs for
      military or monstrous danger, survive humiliating panics, then
      mishear river-crossing speech and drown after a frog's croak is
      taken as their leader's call.
    rationale: |
      First-class ATU membership separates this ethnic-regional
      cowardice schwank from generic fool tales. Its structure depends
      on collective bravado and collective fear: seven named men, one
      absurd weapon, hornet-as-drum, hare-as-dragon, boastful verse,
      dialect misunderstanding, frog echo, and total drowning. KHM 119
      needs the type for comparative queries over Swabian jokes,
      grouped fools, shared weapons, and fatal misheard water-crossing
      instructions.
    tier: structural
    scope: tale
    lens: atu
    domains: [swabians, fools, cowardice, misrecognition, river, schwank]
    related: [law_fearful_misrecognition_turns_signs_deadly, arc_fool, affect_fear, num_7, threshold_river]
    examples: [the_seven_swabians]

  atu_360:
    name: The Three Apprentices
    description: |
      Tale-type: three poor travelling apprentices accept a Devil's
      bargain that gives them wealth if they answer every question only
      with a fixed three-part formula. The formula makes them appear to
      confess to an innkeeper's murder, but the Devil preserves them
      until they can speak freely, expose the hidden corpses, and
      deliver the murderer whose soul the Devil wanted.
    rationale: |
      First-class ATU membership separates this tale from ordinary
      devil-pact ordeals and from court false-accusation plots. Its
      grammar is constrained speech: collective poverty, infernal donor
      with asymmetric soul-claim, three fixed answers, hospitable
      misreadings, murder and framed confession, execution delay,
      infernal pardon-coach, released testimony, cellar proof, and
      substitution of the true guilty soul. KHM 120 needs the type for
      queries over formulaic speech, false confession, apprentices,
      innkeeper murderers, and devilish justice.
    tier: structural
    scope: tale
    lens: atu
    domains: [devil, apprentices, formula, false-confession, murder, justice]
    related: [law_restricted_formula_preserves_innocents_until_exposure, being_devil, speech_bargain, speech_testimony, obj_forensic_token, moral_retributive]
    examples: [the_three_apprentices]

  atu_590a:
    name: The Prince Who Feared Nothing
    description: |
      Tale-type: a fearless prince leaves home, treats a giant's toys
      as playthings, wins an apple and ring from the Tree of Life,
      gains strength and a faithful lion, survives the giant's theft
      and blinding, heals his eyes by divine-sign water, then releases
      an enchanted black maiden by silently enduring three nights of
      demonic torment in her castle.
    rationale: |
      First-class ATU membership keeps KHM 121 distinct from KHM 4's
      jocular fear-learning tale and from the broader enchanted-castle
      release complex. Its grammar combines noble fearlessness,
      giant-scale play, Tree-of-Life quest, strength ring, animal
      mastery, betrayal and blinding, providential eye-healing, and a
      three-night silent torment ordeal ending in disenchantment and
      marriage. The node supports queries over fearless princes where
      fearlessness becomes heroic endurance rather than comic deficit.
    tier: structural
    scope: tale
    lens: atu
    domains: [fearlessness, prince, giant, tree-of-life, lion, enchanted-castle]
    related: [state_fearless, law_life_ring_confers_strength_and_lion_mastery, law_silent_torment_releases_enchanted_princess, obj_life_apple, sp_lion]
    examples: [the_kings_son_who_feared_nothing]

  atu_566:
    name: Donkey Cabbages
    description: |
      Tale-type: a kind huntsman receives a wishing-cloak and a
      wealth-producing bird heart from a donor, is robbed by a witch
      and her daughter through love, sleeping magic, and theft, escapes
      from a mountain by cloud, discovers cabbages that turn humans
      into donkeys and back, and uses them to punish and then restore
      the women before marrying the repentant daughter.
    rationale: |
      First-class ATU membership separates this tale from generic
      stolen-magic-object and animal-transformation tales. Its grammar
      combines donor reward, bird-organ gold, wish-transport mantle,
      witch/maiden seduction, Garnet Mountain abandonment, giant-
      overheard cloud escape, reversible cabbage metamorphosis,
      punitive milling, pity-restoration, and marriage. KHM 122 needs
      the type for queries over donkey-cabbage transformations,
      stolen wish-cloaks, and food-based retributive reversal.
    tier: structural
    scope: tale
    lens: atu
    domains: [cabbage, donkey, witch, wishing-cloak, bird-heart, transformation]
    related: [law_transforming_cabbages_alternate_human_donkey_form, law_magic_bird_organs_generate_gold, obj_wishing_cloak, obj_transforming_cabbages, sp_donkey]
    examples: [donkey_cabbages]

  atu_442:
    name: The Old Woman in the Wood
    description: |
      Tale-type: a poor servant-girl survives a robber massacre in the
      forest, receives food, bed, and clothes from tree-locks opened by
      golden keys brought by a white dove, then obeys the dove's silent
      instructions in a witch's house, retrieves a plain ring from a
      bird-cage, and releases a prince and his household from tree and
      dove enchantment.
    rationale: |
      First-class ATU membership separates this tale from general
      enchanted-prince and grateful-animal tales. Its grammar combines
      forest orphaning by robbers, avian provisioning, keyed tree-
      chambers, silence before a witch, refusal of glittering rings,
      recovery of the plain ring from a caged bird, and the revelation
      that tree, dove, servants, and horses are an enchanted royal
      household. KHM 123 needs the type for queries over tree-chamber
      aid, humble-ring selection, and plant/bird split transformation.
    tier: structural
    scope: tale
    lens: atu
    domains: [forest, dove, tree, ring, witch, enchanted-prince]
    related: [law_plain_ring_breaks_tree_dove_enchantment, transform_plant_human, obj_form_binding_ring, sp_bird, being_witch]
    examples: [the_old_woman_in_the_wood]

  atu_654:
    name: The Three Brothers
    description: |
      Tale-type: a father with one indivisible house sends his three
      sons into the world to learn trades and awards the house to the
      son who makes the best masterpiece. The barber shaves a running
      hare, the blacksmith shoes a galloping horse, and the fencing-
      master keeps rain from touching him by swordplay, after which the
      brothers continue living and working together.
    rationale: |
      First-class ATU membership separates this artisan-inheritance
      tale from magical trade-gift tales such as ATU 563 and from
      foolish inheritance-sale schwanks. Its structure is practical and
      ethical: equal paternal love, indivisible ancestral property,
      three apprenticeships, public craft demonstrations, peaceful
      acceptance of judgment, shared household prosperity, and common
      grave. KHM 124 needs the type for comparative queries over craft
      masterpieces, sibling competition without enmity, and trade as
      inheritance arbiter.
    tier: structural
    scope: tale
    lens: atu
    domains: [craft, brothers, inheritance, apprenticeship, masterpiece]
    related: [law_craft_masterpiece_arbitrates_inheritance, agency_domestic_labor, num_3, loc_house]
    examples: [the_three_brothers]

  atu_1950:
    name: The Three Sluggards
    description: |
      Tale-type: a dying king with three beloved sons promises the
      kingdom to whichever son is laziest. Each son boasts a stronger
      refusal to move: not opening an eye despite a falling drop,
      letting a heel burn rather than withdrawing it, and accepting
      hanging rather than raising a hand to cut the rope. The third
      son wins the succession.
    rationale: |
      First-class ATU membership separates this succession-by-idleness
      schwank from ATU 654 craft inheritance and from ordinary fool or
      lazy-servant tales. Its grammar is a three-part boast contest
      where negative action escalates from discomfort to bodily injury
      to death, and royal judgment treats the greatest absurdity as
      proof of fitness. The node supports comparative queries over
      lazy heirs, inverted inheritance rules, competitive boasting,
      and comic self-endangerment.
    tier: structural
    scope: tale
    lens: atu
    domains: [laziness, succession, brothers, boast, inversion]
    related: [law_inverted_succession_rewards_extreme_idleness, affect_sloth, speech_boast, agency_social_rank, num_3, moral_comic_inversion]
    examples: [the_three_sluggards]

  atu_1951:
    name: The Twelve Idle Servants
    description: |
      Tale-type: twelve servants lie on the grass after doing nothing
      all day and compete in boasting their idleness. Their speeches
      turn eating, sleeping, neglected horses, rain injury, slow work,
      unmoved bodies, hunger, cart wounds, dismissal, stolen harness,
      and a stuck cart into a cumulative anti-labour catalogue.
    rationale: |
      First-class ATU membership separates this servant idleness
      catalogue from ATU 1950's royal succession contest and from
      contradiction-nonsense tales such as KHM 138. Its identity lies
      in twelve serial first-person boasts of neglected service rather
      than in plot resolution: the servants compete by showing that
      ordinary labour, bodily care, and property responsibility have
      all been abandoned. The node supports comparative queries over
      lazy servants, anti-work schwanks, cumulative boasting, and
      twelve-part comic inventories.
    tier: structural
    scope: tale
    lens: atu
    domains: [laziness, servants, labour, boast, catalogue]
    related: [law_idle_boast_catalogue_escalates_neglect, affect_sloth, agency_domestic_labor, speech_boast, num_12, moral_comic_inversion]
    examples: [the_twelve_idle_servants]

  atu_812:
    name: The Devil and His Grandmother
    description: |
      Tale-type: three underpaid soldiers desert during war, hide in a
      cornfield, accept rescue and seven years of wealth from the Devil
      disguised as a fiery dragon, then face a soul-claim riddle. The
      merry soldier obtains the answer by hiding in the Devil's
      grandmother's cellar while she questions him, and the soldiers
      answer correctly to keep freedom and the gold-making whip.
    rationale: |
      First-class ATU membership separates this soldier-devil pact from
      infernal service tales and ordinary riddle tales. Its grammar is
      military poverty, desertion, crop-field entrapment, dragon rescue,
      signed seven-year bargain, whip-generated gold, grandmother-led
      eavesdropping, infernal meal riddle, and release by exact
      answer. KHM 125 needs the type for comparative queries over devil
      grandmothers, soldier bargains, and riddles whose answers are
      stolen from the supernatural household.
    tier: structural
    scope: tale
    lens: atu
    domains: [devil, soldier, riddle, grandmother, bargain, gold]
    related: [law_overheard_infernal_riddle_breaks_soul_bargain, obj_gold_summoning_whip, being_devil, speech_riddle, num_7]
    examples: [the_devil_and_his_grandmother]

  atu_815:
    name: The Devil's Money / The Grave-Mound
    description: |
      Tale-type: a rich sinner's awakened conscience leads him to give
      corn to a poor neighbour on condition that the neighbour watch
      three nights by his grave. On the third night a fearless discharged
      soldier joins the vigil, confronts the Devil's claim on the dead
      man's soul, and tricks him into pouring gold into a cut-soled boot
      placed over a hole until sunrise makes the Devil flee.
    rationale: |
      First-class ATU membership separates this grave-vigil salvation
      tale from fixed-term devil pacts, infernal service tales, and
      ordinary trickster bargains. Its grammar is conscience-struck
      avarice, a food gift to the poor, a three-night grave-watch
      promise, a fearless soldier helper, the Devil's claim on a buried
      soul, the bottomless-boot bribe trick, and rescue at sunrise.
      The node supports comparative queries over posthumous soul
      claims, grave watches, soldier tricksters, and infernal defeat by
      impossible measuring containers.
    tier: structural
    scope: tale
    lens: atu
    domains: [devil, grave, soul, soldier, boot, gold, promise]
    related: [law_grave_watch_promise_defends_sinner_soul, law_bottomless_boot_delays_devil_until_sunrise, being_devil, arc_discharged_soldier, moral_restorative]
    examples: [the_grave_mound]

  atu_531:
    name: Ferdinand the Faithful
    description: |
      Tale-type: a poor child receives a delayed godfather gift that
      yields a magical white horse. As a royal outrider, he is betrayed
      by an unfaithful namesake into dangerous bride-fetching tasks,
      but the speaking horse and a rescued fish supply the knowledge
      and retrieval aid needed. The bride later uses decapitation magic
      to replace the noseless king with the faithful hero, and the
      horse is released as a king's son.
    rationale: |
      First-class ATU membership separates this tale from generic
      faithful-servant plots and from ATU 550 animal-helper quest
      chains. Its grammar is name-opposition (Faithful/Unfaithful),
      deferred godfather inheritance, enchanted horse counsel,
      provisioned passage past giants and birds, water-retrieval by a
      fish's flute, and a final head-restoration trial that transfers
      sovereignty. KHM 126 needs the type for comparative queries over
      faithful outriders, treacherous doubles, enchanted helper horses,
      and bride-winning tasks solved by animal counsel.
    tier: structural
    scope: tale
    lens: atu
    domains: [faithful-servant, enchanted-horse, bride-quest, double, decapitation]
    related: [law_delayed_godfather_key_reveals_hidden_inheritance, law_provisioned_passage_pacifies_monsters, obj_enchanted_helper_horse, obj_animal_helper_flute, transform_decapitation_restoration]
    examples: [ferdinand_the_faithful]

  atu_1405:
    name: The Lazy Spinner
    description: |
      Tale-type: a lazy wife avoids textile work by converting missing
      tools and spoiled yarn into apparent supernatural danger. First
      she frightens her husband away from cutting reel-wood by crying a
      death omen from the forest; later she boils tow instead of yarn
      and makes him believe his inattention has transformed the skein.
    rationale: |
      First-class ATU membership separates this domestic work-avoidance
      schwank from generic foolish-wife tales and from servant food-
      theft trickery. Its grammar is specifically textile-labour
      evasion: tangled yarn, missing reel, forest omen, improvised
      loft skein, boiling kettle, cock-crow condition, and the husband's
      silent self-blame. KHM 128 needs the type for comparative queries
      over spinning avoidance, false omens, and household labour jokes.
    tier: structural
    scope: tale
    lens: atu
    domains: [spinning, laziness, marriage, false-omen, schwank]
    related: [law_fake_domestic_omens_suspend_labor, obj_spinning_wheel, agency_domestic_labor, speech_lie, moral_trickster_wins]
    examples: [the_lazy_spinner]

  atu_1408:
    name: Sharing Joy and Sorrow
    description: |
      Tale-type: a violent, quarrelsome husband is imprisoned and made
      to promise that he will no longer beat his wife, but will live in
      peace and share joy and sorrow with her. He resumes abuse by
      pulling hair, chasing her, and throwing tools, then argues before
      the magistrates that he kept the formula because hits made him
      joyful and her sorrowful, while misses reversed the feelings.
      The judges reject the explanation and punish him.
    rationale: |
      First-class ATU membership separates this marital legal-schwank
      from generic foolish-husband tales and from clever literal
      compliance tales. Its grammar is bad-faith reinterpretation of a
      corrective legal promise: prison, release under domestic peace
      condition, renewed violence through technical evasion, courtroom
      explanation, and judicial refusal. The node supports comparative
      queries over household violence, legal formulae, spousal promises,
      and punitive rejection of abusive wordplay.
    tier: structural
    scope: tale
    lens: atu
    domains: [marriage, law, violence, literalism, schwank]
    related: [law_bad_faith_marital_literalism_masks_violence, law_promise_binds_reality, speech_promise, agency_violence, agency_social_rank, moral_retributive]
    examples: [sharing_joy_and_sorrow]

  atu_1430:
    name: Lazy Harry / Lean Lisa
    description: |
      Tale-type: a married couple turns ordinary household economy
      into comic fantasy-planning. In one variant, lazy spouses seek
      to remove work by trading goats for a self-working beehive, and
      the honey is lost during an imagined child-care scenario. In the
      companion variant, an overworked wife imagines assembling four
      florins, buying a cow, selling a fattened calf, and refusing her
      husband even a little milk until the imaginary property plan
      becomes a real quarrel.
    rationale: |
      First-class ATU membership separates this lazy-couple domestic
      economy from the false-omen labour evasion of ATU 1405 and from
      the idleness-boast catalogues of ATU 1950/1951. Its grammar is
      not deception or competition but household rationalization:
      marriage, livestock exchange or projected livestock purchase,
      passive yield, imagined future care or profit, and present-tense
      conflict over not-yet-existing goods. The node supports
      comparative queries over lazy spouses, hyper-laborious spouses,
      work-avoidance trades, imagined cattle economy, and comic
      household planning.
    tier: structural
    scope: tale
    lens: atu
    domains: [laziness, marriage, livestock, household, planning, schwank]
    related: [law_labor_avoidance_exchange_converts_care_to_loss, law_hypothetical_gain_escalates_domestic_quarrel, affect_sloth, affect_anger, agency_domestic_labor, sp_goat, sp_insect, sp_cattle, moral_comic_inversion]
    examples: [lazy_harry, lean_lisa]

  atu_1452:
    name: Choosing a Bride by Domestic Thrift
    description: |
      Tale-type: a man's bride-choice is decided by small domestic
      evidence of thrift, care, and industry. In one form, three
      sisters are tested by how they eat cheese: one swallows the rind,
      one wastes good cheese with the rind, and one removes exactly
      the right amount. In another, a lazy bride discards flax in
      irritation, an industrious servant spins the scraps into a gown,
      and the bride's comment reveals the contrast to the bridegroom.
    rationale: |
      First-class ATU membership separates these domestic bride-choice
      miniatures from riddle-marriage tales and from supernatural
      spinning-helper tales. Their shared grammar is not verbal
      cleverness but material diagnosis: cheese rind or flax scraps
      reveal whether a prospective wife is crude, wasteful, lazy, or
      measured and industrious. The node supports comparative queries
      over spouse selection, food-handling diagnostics, textile waste,
      maternal counsel, servant industry, and prudence tests.
    tier: structural
    scope: tale
    lens: atu
    domains: [marriage, bride-choice, prudence, domestic-labour, thrift]
    related: [law_cheese_rind_test_reveals_domestic_measure, law_discarded_flax_reveals_domestic_industry, moral_prudent_selection, agency_object_mediation, agency_domestic_labor]
    examples: [brides_on_their_trial, odds_and_ends]

  atu_1476:
    name: The Maid of Brakel
    description: |
      Tale-type: a young woman prays in a chapel for a particular
      husband. A hidden clerk overhears and forbids the match in a
      disguised or gruff voice; the woman mistakes the voice for a
      saintly child-image and angrily tells the child to be silent and
      let the mother saint answer.
    rationale: |
      First-class ATU membership separates this chapel-prayer schwank
      from ordinary marriage petitions, true saint miracles, and
      clerical deception plots. Its grammar is compact: private desire
      voiced as prayer, hidden human eavesdropper, false sacred voice,
      misattribution to a devotional image, and comic disrespect toward
      the wrong holy figure. The node supports comparative queries over
      prayer jokes, saint-image misrecognition, anticlerical voice
      tricks, and marriage-desire in sacred space.
    tier: structural
    scope: tale
    lens: atu
    domains: [prayer, chapel, saint, marriage, misattribution, schwank]
    related: [law_hidden_clerk_voice_misattributed_to_sacred_image, speech_prayer, loc_church, moral_comic_inversion]
    examples: [the_maid_of_brakel]

  atu_653:
    name: The Four Skilful Brothers
    description: |
      Tale-type: four poor brothers separate to learn trades and return
      as thief, astronomer, huntsman, and tailor. Their father tests the
      crafts on a bird's nest and eggs; later the same coordinated
      skills rescue a princess from a dragon on a sea-rock, kill the
      dragon, and repair the shattered ship. Because each skill is
      equally necessary, the king divides reward instead of awarding
      the princess to one brother.
    rationale: |
      First-class ATU membership separates this craft-ensemble rescue
      from ATU 654 artisan inheritance and from ATU 513 extraordinary
      companion tales. The brothers are not bodily marvels hired by a
      leader; they are kin who acquire social trades and combine them
      in exact sequence. KHM 129 needs the type for comparative queries
      over cooperative crafts, noncompetitive brothers, far-seeing
      instruments, dragon rescue without bride-marriage, and equal
      reward partition.
    tier: structural
    scope: tale
    lens: atu
    domains: [brothers, craft, dragon, princess-rescue, cooperation]
    related: [law_coordinated_crafts_complete_rescue, obj_far_seeing_telescope, obj_never_miss_gun, obj_needle_thread, being_dragon, num_4]
    examples: [the_four_skilful_brothers]

  atu_1741:
    name: Trickster Wives and Maids
    description: |
      Tale-type: a wife, maid, cook, or analogous domestic subordinate
      eats or steals prepared food, then prevents exposure by deceiving
      the expected guest and the household master so that each one
      interprets the other's actions as proof of the lie.
    rationale: |
      First-class ATU membership separates servant-and-wife trickery
      from fool tales where misunderstanding is accidental. KHM 77 is
      not about incapacity but opportunistic appetite plus tactical
      speech: Grethel eats the fowls, frightens the guest with an ear-
      cutting threat, and accuses him of chicken theft. The node lets
      us query domestic schwanks where low-status household figures
      win by redirecting blame through cooked food and hospitality.
    tier: structural
    scope: tale
    lens: atu
    domains: [servant-trickster, food-theft, hospitality, lie, schwank]
    related: [law_stolen_food_redirected_by_threat_lie, arc_trickster, agency_domestic_labor, moral_trickster_wins]
    examples: [clever_grethel]

  atu_980b:
    name: The Wooden Bowl
    description: |
      Tale-type: an aged parent or grandparent is excluded from normal
      family eating because of frailty and given inferior utensils or
      treatment; a child announces that they are preparing the same
      treatment for the current parents when they are old, causing
      immediate reform.
    rationale: |
      First-class ATU membership distinguishes the elder-care moral
      exemplum from magic tales, trickster schwanks, and generic
      kindness tales. Its grammar is intergenerational: the child does
      not defeat a villain but reveals that neglect of the old becomes
      a model for future neglect. KHM 78 needs the node so wooden-bowl,
      half-blanket, basket, and related elder-saving variants can be
      queried together.
    tier: structural
    scope: tale
    lens: atu
    domains: [old-age, filial-care, wooden-bowl, child-wisdom, exemplum]
    related: [arc_neglected_elder, obj_elder_wooden_bowl, law_child_mirror_reveals_filial_future, moral_filial_reciprocity]
    examples: [the_old_man_and_his_grandson]

  atu_980a:
    name: The Ungrateful Son
    description: |
      Tale-type: a son conceals food from his aged father instead of
      sharing the meal; when the father leaves, the hidden food has
      become a toad that jumps on the son's face, cannot be removed,
      and must be fed forever.
    rationale: |
      First-class ATU membership separates KHM 145 from ATU 980B
      elder-care reform tales such as "The Wooden Bowl." Its grammar
      is punitive rather than corrective: no child mirrors the future,
      no household repents, and no elder is restored to the table. The
      concealed meal becomes a permanent bodily burden, making filial
      refusal visible as a toad on the face. The node supports queries
      over elder-neglect exempla where punishment replaces reform.
    tier: structural
    scope: tale
    lens: atu
    domains: [old-age, filial-duty, food, toad, punishment, exemplum]
    related: [arc_neglected_elder, law_hidden_elder_food_becomes_clinging_burden, sp_toad, moral_retributive]
    examples: [the_ungrateful_son]

  atu_987:
    name: The Beam
    description: |
      Tale-type or magical anecdote: an enchanter performs a public
      illusion in which a cock appears to carry a heavy beam. A girl
      with a four-leaf clover sees the beam as straw and exposes the
      deception, driving the magician away in shame. He later revenges
      himself at her wedding procession by making a flax field appear
      as a swollen stream, so she is ridiculed when the illusion lifts.
    rationale: |
      First-class ATU membership keeps KHM 149 distinct from moral
      "beam in the eye" exempla and from ordinary magician contests.
      Its grammar is perception and counter-perception: spectacle,
      truth-sight clover, public exposure, shame, revenge, wedding
      threshold, false water, blue flax, and transferred ridicule. The
      node supports comparative queries over illusion tales where
      magical sight and social shame are the real stakes.
    tier: structural
    scope: tale
    lens: atu
    domains: [illusion, clover, magician, wedding, shame, perception]
    related: [being_wizard, obj_four_leaf_truth_clover, law_four_leaf_clover_sight_breaks_illusion, law_revenge_illusion_transfers_public_shame, sp_rooster]
    examples: [the_beam]

  atu_461:
    name: The Devil with the Three Golden Hairs
    description: |
      Tale-type: a caul-born luck-child is prophesied to marry the
      king's daughter. The king's attempts to drown him, send him with
      a death-letter, and impose a hell-quest all fail or reverse. With
      help from the devil's grandmother, the hero obtains three golden
      hairs and answers to three riddling afflictions, returns wealthy,
      and tricks the greedy king into taking the ferryman's endless
      burden.
    rationale: |
      First-class ATU membership connects the luck-child / devil-hair
      quest complex without reducing it to generic prophecy or
      trickster victory. Its distinctive grammar is self-fulfilling
      lucky fate, hostile royal countermeasures, letter substitution,
      three problem-questions solved from infernal knowledge, and final
      burden-transfer to the persecuting king. The node supports
      queries over caul-born heroes, hell quests, devil knowledge, and
      fate-driven reversals.
    tier: structural
    scope: tale
    lens: atu
    domains: [luck-child, prophecy, devil, hell, golden-hair, ferry]
    related: [arc_luck_child, law_fated_luck_fulfills_prophecy, being_devil, loc_hell, moral_trickster_wins]
    examples: [the_devil_with_the_three_golden_hairs]

  atu_332:
    name: The Godfather / Godfather Death
    description: |
      Tale-type: a poor parent seeks a godfather for a child and
      receives a supernatural sponsor whose gift makes the parent a
      famous healer. The gift works by reading Death's position near
      the sickbed: at the head healing is permitted, at the feet the
      patient must die. Later episodes test whether the healer respects
      that jurisdiction or survives knowledge of the godfather's
      dangerous non-human nature.
    rationale: |
      First-class ATU membership separates the death-godfather healing
      complex from generic donor gifts, magical herbs, or devil tales.
      Its grammar is fictive kinship with an otherworldly sponsor,
      conditional medical power, Death as spatial verdict, and danger
      around overreach or forbidden recognition. KHM 42 and KHM 44 need
      the same type even though one emphasizes the horned godfather's
      house and the other emphasizes Death's retribution.
    tier: structural
    scope: tale
    lens: atu
    domains: [godfather, death, medicine, fate, forbidden-knowledge]
    related: [arc_supernatural_godfather, being_death, being_devil, law_death_position_determines_healing, obj_death_diagnostic_remedy, law_life_candle_measures_lifespan, moral_prudential_retreat]
    examples: [the_godfather, godfather_death]

  atu_334:
    name: Household of the Witch
    description: |
      Tale-type: a girl or young visitor disregards a warning and goes
      to a witch's house, where uncanny threshold figures or household
      sights reveal the witch's true nature. The visit ends in the
      visitor's destruction, consumption, or magical conversion rather
      than rescue.
    rationale: |
      First-class ATU membership distinguishes the witch-house warning
      tale from forest child-eating plots such as ATU 327A and from
      generic prohibition tales. Its grammar is domestic and
      cautionary: the forbidden place is the witch's household itself,
      curiosity supplies the motion, and the witch wins. KHM 43 needs
      the type because no rescue, repentance, or counter-trick follows
      the violation; the household consumes the visitor.
    tier: structural
    scope: tale
    lens: atu
    domains: [witch, household, prohibition, curiosity, punishment]
    related: [arc_willful_child, being_witch, loc_witch_house, law_prohibition_invites_violation, transform_punitive_objectification]
    examples: [frau_trude]

  atu_335:
    name: Death's Messengers
    description: |
      Tale-type: a human helps personified Death after Death has been
      disabled by a stronger being. In gratitude Death promises not to
      come without warning; later, when Death arrives, the human
      protests, but Death explains that fever, dizziness, gout,
      toothache, failing senses, and sleep were already the promised
      messengers.
    rationale: |
      First-class ATU membership separates this memento-mori legend
      from Godfather Death healing tales and from Cheating Death
      trickster tales. Its grammar is not cure, bargain, or escape:
      Death's temporary defeat suspends mortality, compassionate aid
      restores Death's office, and the promised warning is fulfilled by
      ordinary bodily decline. The node supports comparative queries
      over personified Death, mortality signs, sickness as envoy, and
      failed objections to the final summons.
    tier: structural
    scope: tale
    lens: atu
    domains: [death, sickness, sleep, warning, memento-mori]
    related: [being_death, law_ailments_are_deaths_messengers, moral_memento_mori, speech_promise]
    examples: [deaths_messengers]

  atu_311:
    name: Fitcher's Bird / Abducted Bride Self-Rescue
    description: |
      Tale-type cluster: a bride-like girl is carried away from her
      home by a non-ordinary or predatory groom and must escape by
      managing substitute presences, disguises, or household tasks. In
      the full Fitcher's Bird form, the youngest sister survives a
      forbidden-room test, rescues murdered sisters, and destroys the
      abductor. In compressed animal-bride variants, the heroine is
      carried to an animal hut and escapes the wedding scene through a
      bride-decoy. In the Old Rinkrank branch, a princess is swallowed
      into a glass mountain, serves an underground captor for years,
      and escapes by trapping his beard in a window until he reveals
      the ladder.
    rationale: |
      First-class ATU membership separates this abduction/self-rescue
      complex from robber-bridegroom testimony tales and from religious
      forbidden-door tales. KHM 46 shows the full Bluebeard-sister
      grammar: key-and-egg test, bloody chamber, reassembly, false
      bride staging, bird disguise, and collective burning. KHM 66 is a
      reduced animal-bridegroom branch: no bloody chamber, but the same
      self-rescue logic remains in the bride's manipulation of a decoy
      presence inside the groom's house. KHM 196 preserves the same
      captive-bride self-rescue axis without the bloody chamber: the
      heroine controls household thresholds, traps the captor's beard,
      obtains the escape ladder, and brings kingly punishment back to
      the underground prison.
    tier: structural
    scope: tale
    lens: atu
    domains: [abduction, bride, self-rescue, decoy, disguise, captivity]
    related: [arc_murderous_bridegroom, arc_coercive_animal_bridegroom, arc_imprisoned_maiden, obj_decoy_bride_doll, obj_blood_marked_test_token, transform_reassembly, law_captive_threshold_trap_extorts_escape_tool, moral_retributive]
    examples: [fitchers_bird, the_hares_bride, old_rinkrank]

  atu_720:
    name: The Juniper Tree
    description: |
      Tale-type: a first wife's child is murdered by the stepmother,
      falsely blamed on the half-sister, cooked, and unknowingly eaten
      by the father. The sister gathers the bones and lays them under a
      tree connected to the dead mother; the child returns as a singing
      bird, obtains gifts through repeated testimony-song, kills the
      murderer with a millstone, and is restored to human family life.
    rationale: |
      First-class ATU membership distinguishes this murdered-child /
      revenant-bird cycle from generic stepmother persecution,
      cannibal-house tales, and simple murder-revelation by bone. Its
      grammar combines maternal tree, filicide, unwitting cannibal
      meal, sisterly bone-gathering, avian revenant testimony, gift
      distribution, and millstone retribution. KHM 47 needs the type
      because neither `law_dead_matter_reveals_murder` nor
      `arc_cruel_stepmother` alone captures the full murder-song-
      restoration sequence.
    tier: structural
    scope: tale
    lens: atu
    domains: [murdered-child, stepmother, cannibalism, bird, tree, retribution]
    related: [arc_cruel_stepmother, law_dead_matter_reveals_murder, transform_revenant_bird, loc_tree, sp_bird, moral_retributive, moral_restorative]
    examples: [the_juniper_tree]

  atu_333:
    name: Little Red Riding Hood
    description: |
      Tale-type: a girl carrying food to her sick grandmother is warned
      to keep to the path, meets a wolf in the forest, is diverted by
      flowers, and reaches the house after the wolf has swallowed and
      impersonated the grandmother. A rescuer cuts open the wolf and
      saves both victims; in a second episode, the girl and grandmother
      defeat another wolf by refusing entry and drowning him.
    rationale: |
      First-class ATU membership distinguishes the Red Riding Hood
      predator-initiation tale from the wolf-and-kids household
      disguise pattern. Both use reversible devouring and wolf-disguise,
      but ATU 333 centers on path-violation, forest distraction, the
      grandmother-bed recognition dialogue, and a second learned
      counter-episode. It supports queries over interdiction,
      predatory speech, devouring rescue, and child learning.
    tier: structural
    scope: tale
    lens: atu
    domains: [wolf, forest, path, disguise, devouring, child]
    related: [arc_naive_victim, arc_disguised_villain, law_prohibition_invites_violation, law_devouring_can_be_reversed, law_forest_suspends_domestic_order]
    examples: [little_red_cap]

  atu_516:
    name: Faithful John (the Servant Turned to Stone)
    description: |
      Tale-type: a king's faithful servant overhears prophetic speech
      (ravens, birds) warning of three dangers to his master's bride-
      quest; silently prevents each danger but cannot explain his
      actions; condemned to death by his uncomprehending master, he
      reveals the prophecies and turns to stone. The master, grieving,
      sacrifices his children to restore him via blood-magic; the
      servant resurrects and restores the children too.
    rationale: |
      Core ATU type for the reciprocal-sacrifice / faithful-servant
      register. Distinct from other servant tales by the SPECIFIC
      grammar of prophecy-cost + blood-resurrection + symmetrical
      sacrifice. First-class node connects KHM 6 to international
      Faithful-Henry/John cousins.
    tier: structural
    scope: tale
    lens: atu
    domains: [loyalty, prophecy, petrification, sacrifice, reciprocity]
    related: [arc_faithful_servant, arc_envious_witness, law_prophecy_compels_sacrifice, law_blood_restores_petrified, moral_reciprocal_sacrifice]
    examples: [faithful_john]

  atu_1642:
    name: The Good Bargain
    description: |
      Tale-type: a peasant interprets animal cries (frogs, dogs) as
      commercial speech-acts; throws money to frogs, leaves meat with
      a dog as guarantor; demands payment from the dog's master (the
      butcher) and is beaten. Goes to the king for justice; his
      absurd petition makes the unlaughing princess laugh; king
      promises reward but transmutes it into five hundred blows;
      peasant sells the blow-claim to a speculator-sentinel and a
      speculator-Jew at discount; on collection day the speculators
      receive the blows, the peasant a fortune, and the Jew is
      cheated again over a borrowed coat.
    rationale: |
      Core ATU type for the schwank-of-the-good-bargain register: a
      noodle-tale where peasant literalism + accidental cunning beats
      every middleman. Internationally widespread; first-class node
      lets us connect KHM 7 to its German-Slavic-Romance cousins of
      the "fool's lucky deal" subgenre.
    tier: structural
    scope: tale
    lens: atu
    domains: [schwank, jocular, peasant, anti-middleman, literalism]
    related: [arc_literal_fool, arc_unlaughing_princess, arc_speculator, law_speech_taken_literally, law_laughter_releases_reward, moral_trickster_wins, moral_comic_inversion]
    examples: [the_good_bargain]

  atu_151:
    name: The Strange Musician
    description: |
      Tale-type: a musician travelling alone through the forest plays
      so beautifully that animals come to learn from him. He rejects
      wolf, fox, and hare as unsuitable companions and traps each by
      commanding it through a false lesson. The freed animals seek
      revenge, but a human woodcutter, compelled and delighted by the
      same music, protects the musician with his axe.
    rationale: |
      Core ATU type for the music-compulsion / unwanted-animal-
      companion pattern. First-class ATU membership distinguishes this
      tale from ordinary trickster-beast tales: the initiating force is
      not hunger or bargain but `law_music_attracts`, and the moral
      contrast is between wild listeners who are rejected and the human
      listener who becomes acceptable companion. This node enables
      comparative queries for tales where music summons, sorts, and
      redirects beings.
    tier: structural
    scope: tale
    lens: atu
    domains: [music, compulsion, forest, animal, trickster]
    related: [agency_music, law_music_attracts, state_trapped, obj_fiddle, moral_trickster_wins]
    examples: [the_strange_musician]

  atu_592:
    name: The Jew among Thorns
    description: |
      Tale-type: a poorly paid servant gives his last coins to a
      supernatural donor and receives three gifts: a never-miss gun, a
      fiddle that compels dancing, and requests that cannot be refused.
      He uses the gun and fiddle against a Jewish passerby in thorns,
      is accused before a judge, then uses the final request and fiddle
      at the gallows to reverse the charge and force a confession.
    rationale: |
      First-class ATU membership keeps KHM 110 queryable as a specific
      music-compulsion and legal-reversal schwank, while also marking
      its harmful anti-Jewish narrative structure. It is distinct from
      ATU 151, where music summons forest animals, and from ATU 1642,
      where speculators buy an absurd reward-claim. Here the grammar is
      donor-gifts, thorns, coerced dancing, public judgment, an
      irrefusable last request, and execution of the stigmatized
      accuser.
    tier: structural
    scope: tale
    lens: atu
    domains: [music, compulsion, thorns, antisemitic-schwank, judgment]
    related: [law_music_attracts, law_irresistible_request_overrides_judgment, obj_fiddle, obj_never_miss_gun, moral_stigmatized_accuser_punished]
    examples: [the_jew_among_thorns]

  atu_304:
    name: The Skilful Huntsman
    description: |
      Tale-type: an apprentice becomes a huntsman and receives a gun
      that never misses. In a forest he joins giants, learns that they
      want to abduct a sleeping princess from a tower across a lake,
      kills the warning dog, gathers proof tokens from the princess's
      chamber, kills the giants with a magic sword, and later exposes a
      false claimant through the retained trophies.
    rationale: |
      First-class ATU membership distinguishes KHM 111 from public
      dragon-slayer ATU 300 and from underground princess recovery ATU
      301. Its grammar is stealth rescue rather than public combat:
      perfect marksmanship, giants as abductors, sleeping princess,
      named garment/slipper tokens, severed giant tongues, a false
      captain, and proof-at-feast recognition. The node supports
      comparative queries over skilled huntsmen, false rescuers, and
      trophy-token proof.
    tier: structural
    scope: tale
    lens: atu
    domains: [huntsman, giant, princess, false-hero, proof]
    related: [obj_never_miss_gun, being_giant, arc_false_hero, law_trophy_tokens_expose_false_rescuer, obj_forensic_token]
    examples: [the_skilful_huntsman]

  atu_451:
    name: The Brothers Who Were Turned into Birds
    description: |
      Tale-type: a set of brothers is lost, cursed, exiled, or
      transformed into birds in connection with a sister's birth or
      action. The sister later leaves home to find them and restores
      them by fulfilling the required release condition, whether long
      silent endurance, a recognition token, or sacrificial entry into
      their enchanted dwelling.
    rationale: |
      Core ATU type for the sister-redeemer / bird-brother cycle. It
      differs from general transformation tales because the redeemer is
      a sister whose kinship action, not combat or marriage pursuit,
      releases the bird-brothers. KHM 9 emphasizes silent endurance;
      KHM 25 emphasizes cosmic search, token-recognition, and bodily
      sacrifice at the Glass mountain. First-class ATU membership
      connects KHM 9, KHM 25, KHM 49, and international swan/raven
      variants while preserving subtype differences in per-tale data.
    tier: structural
    scope: tale
    lens: atu
    domains: [siblings, bird-transformation, redemption, kinship, sister-redeemer]
    related: [arc_silent_bride, law_silent_endurance_redeems, law_body_sacrifice_opens_threshold, transform_animal_human, num_7, num_12]
    examples: [the_twelve_brothers, the_seven_ravens, six_swans]

  atu_405:
    name: Jorinde and Joringel
    description: |
      Tale-type: a betrothed pair approaches a witch's enchanted
      castle; the maiden is changed into a bird and caged, while the
      youth is immobilized, released, and later returns with a
      flower or comparable counter-agent that breaks the spell and
      restores the caged maidens.
    rationale: |
      Core ATU type for the bird-maiden / witch-castle rescue pattern.
      It differs from ATU 451 bird-brother redemption because the
      victim is a betrothed maiden, the antagonist is a witch who
      cages many girls, and the solution is a found disenchanting
      object rather than sibling endurance or kinship sacrifice.
      First-class membership lets queries distinguish KHM 69's
      lover-rescue and castle-perimeter magic from broader bird
      transformation clusters.
    tier: structural
    scope: tale
    lens: atu
    domains: [bird-transformation, betrothal, witch, castle, restoration]
    related: [being_witch, obj_disenchanting_flower, law_enchanted_perimeter_immobilizes_intruders, transform_animal_human, atu_451]
    examples: [jorinda_and_joringel]

  atu_1202:
    name: Harvesting Grain with a Cannon
    description: |
      Tale-type or motif: people ignorant of the proper harvest tool
      try to cut grain by shooting it with cannon or comparable heavy
      force, wasting the crop until someone supplies ordinary mowing
      knowledge.
    rationale: |
      Core ATU slot for the comic overkill harvest episode. It differs
      from general fool-tale repair because the error is collective
      technological substitution: artillery stands where a scythe
      should be. KHM 70 embeds this type in the second brother's
      fortune, making the scythe valuable precisely because it solves
      the cannon-harvest absurdity.
    tier: structural
    scope: tale
    lens: atu
    domains: [harvest, cannon, tool, foolishness, overkill]
    related: [law_missing_tool_invites_destructive_overkill, obj_cannon, loc_field]
    examples: [the_three_children_of_fortune]

  atu_1889k:
    name: The Flail from Heaven
    description: |
      Tale-type or tall-tale motif: a peasant's agrarian bargain and a
      lost seed produce impossible abundance; the seed grows into a
      sky-reaching tree, the peasant climbs to heaven, sees angels
      threshing oats, steals a hoe and flail, escapes down a rope of
      chaff, digs out of a deep hole, and keeps the flail as proof.
    rationale: |
      First-class ATU membership keeps KHM 112 with the lying-tale /
      tall-tale complex rather than with religious legends proper. Its
      heaven is comic vertical exaggeration, not moral salvation:
      turnip-seed arithmetic, sky-tree ascent, angelic threshing,
      chaff-rope descent, and the flail as mock evidence form the
      recognisable type. The node supports queries over comic
      impossible journeys, agrarian hyperbole, and material proofs of
      tall tales.
    tier: structural
    scope: tale
    lens: atu
    domains: [tall-tale, heaven, peasant, agriculture, proof]
    related: [law_material_token_authenticates_tall_tale, loc_heaven, loc_field, obj_forensic_token, moral_comic_inversion]
    examples: [the_flail_from_heaven]

  atu_1281:
    name: Burning the Barn to Destroy an Unknown Animal
    description: |
      Tale-type or motif: an unfamiliar animal is mistaken for a
      dangerous monster, and people use fire, cannon, or destructive
      force against the building that contains it.
    rationale: |
      Core ATU slot for the unknown-animal overreaction episode. It is
      distinct from `law_speech_taken_literally`, which concerns the
      interpretation of animal sound as speech; ATU 1281 concerns the
      practical escalation after fear takes over. KHM 70 adapts the
      pattern when the king's people bombard the palace to remove the
      mewing cat.
    tier: structural
    scope: tale
    lens: atu
    domains: [unknown-animal, fear, cannon, building, overkill]
    related: [law_missing_tool_invites_destructive_overkill, law_fearful_misrecognition_turns_signs_deadly, law_speech_taken_literally, affect_fear, obj_cannon, loc_barn, sp_bird]
    examples: [the_three_children_of_fortune, the_owl]

  atu_1650:
    name: Three Brothers Inherit a Rooster, a Scythe, and a Cat
    description: |
      Tale-type: three poor heirs receive ordinary goods, travel until
      each reaches a place where his item or animal is unknown, and
      become rich by selling its practical function as a wonder.
    rationale: |
      Core ATU type for KHM 70's inheritance-and-novelty structure.
      It differs from magical-object tales because the goods are
      common and non-enchanted; fortune comes from geographic
      asymmetry in knowledge, not supernatural power. First-class
      membership lets queries group ordinary-utility fortune tales
      apart from donor-gift, treasure, and trickster fraud cycles.
    tier: structural
    scope: tale
    lens: atu
    domains: [inheritance, trade, novelty, brothers, fortune]
    related: [law_novelty_converts_utility_to_treasure, sp_rooster, sp_cat, loc_island, moral_trickster_wins]
    examples: [the_three_children_of_fortune]

  atu_1651:
    name: Dick Whittington and His Cat
    description: |
      Tale-type: a cat is taken or sold to a place overrun by mice or
      rats and becomes enormously valuable because no cats are known
      there.
    rationale: |
      Core ATU type for the cat-fortune episode embedded in KHM 70.
      It differs from generic cat tales because the cat's ordinary
      predatory function becomes commercial salvation in a rodent-
      plagued polity. Naming it separately lets the third brother's
      episode connect to international Whittington-cat variants while
      still remaining part of the larger ATU 1650 three-inheritance
      frame.
    tier: structural
    scope: tale
    lens: atu
    domains: [cat, mice, trade, fortune, plague]
    related: [sp_cat, sp_mouse, law_novelty_converts_utility_to_treasure, atu_1650]
    examples: [the_three_children_of_fortune]

  atu_210:
    name: The Pack of Ragamuffins
    description: |
      Tale-type: small animal and object rogues travel together,
      commandeer or share transport, and weaponize domestic space:
      either exploiting hospitality and leaving traps behind, or
      entering an absent target's house and occupying fixtures until
      the target is injured or killed.
    rationale: |
      Core ATU type for the rogue-company / bad-guests beast tale.
      Distinct from predator-prey fable types because the plot is not
      about eating or being eaten but about mobile freeloading,
      hospitality abuse, house-ambush, and object-pranks. First-class
      membership lets queries connect KHM 10 with KHM 41, Chanticleer-
      and-Partlet variants, and other travelling-ragamuffin tales where
      a mixed company wins by nuisance, trap, and comic violence rather
      than by virtue.
    tier: structural
    scope: tale
    lens: atu
    domains: [beast-fable, rogue-company, hospitality, house-ambush, trickster]
    related: [moral_trickster_wins, moral_retributive, being_animated_object, loc_inn, loc_house, law_rogue_company_weaponizes_household, agency_cunning]
    examples: [the_pack_of_ragamuffins, herr_korbes]

  atu_450:
    name: Little Brother and Little Sister
    description: |
      Tale-type: abused siblings are persecuted by a witch or cruel
      stepmother and transformed into animal form, commonly through
      enchanted water that makes the brother a deer-like animal. In
      fuller variants the sister keeps him, marries a king, is murdered
      or displaced by a false bride, and returns until recognised; in
      reduced variants both siblings remain transformed until their
      speech or lament reveals their humanity and enables restoration.
    rationale: |
      Core ATU type for the sibling-flight / enchanted-brother /
      false-queen cycle. Distinct from ATU 451, where the sister's
      silence redeems bird-brothers; here the sister's fidelity and
      maternal return, or the siblings' own recognisable speech,
      resolve a stepmother's curse. First-class membership enables
      cross-tale queries for bewitched water, animal-transformed
      siblings, deer-brothers, lamb/fish variants, murdered mothers,
      and false queens.
    tier: structural
    scope: tale
    lens: atu
    domains: [siblings, stepmother, water, animal-transformation, false-bride]
    related: [arc_cruel_stepmother, arc_false_bride, law_enchanted_water_transforms, law_sibling_lament_reveals_bewitched_humanity, sp_deer, sp_sheep, sp_fish, state_liminal_dead]
    examples: [little_brother_and_little_sister, the_lambkin_and_the_little_fish]

  atu_410:
    name: Sleeping Beauty / Enchanted Sleeping Maiden
    description: |
      Tale-type cluster: a maiden or princess is held in enchanted
      sleep or sleep-like confinement until a destined helper reaches
      her, releases or awakens her, and marriage follows. In Briar Rose
      this takes the form of fairy birth gifts, a spindle curse,
      hundred-year castle sleep, and thorn-threshold access. In Glass
      Coffin form, a magician imprisons a living maiden in a transparent
      coffin while her household and castle are likewise contained.
    rationale: |
      First-class ATU membership distinguishes the sleeping-princess
      fate-cycle from generic cursed-maiden or imprisoned-maiden plots.
      Its Grimm variants share a core of suspended maidenhood, protected
      or blocked access, helper arrival, release from sleep-like
      enclosure, and marriage, while differing in mechanism: KHM 50 is
      timed curse-sleep and KHM 163 is glass-container imprisonment.
      The node supports queries over Sleeping Beauty variants, glass
      coffins, fairy birth gifts, century sleep, and transparent living
      prisons without flattening them into generic imprisonment.
    tier: structural
    scope: tale
    lens: atu
    domains: [sleeping-beauty, curse, glass-coffin, sleep, awakening, release]
    related: [being_fairy, law_softened_death_becomes_timed_sleep, law_fated_time_opens_thorn_threshold, law_glass_coffin_bolt_releases_living_maiden, state_enchanted_sleep, obj_enchanted_glass_coffin_prison]
    examples: [briar_rose, the_glass_coffin]

  atu_313:
    name: The Magic Flight
    description: |
      Tale-type: children, lovers, or companions flee a murderous or
      supernatural pursuer. Repeated pursuit is defeated by magical
      transformations or obstacle-making, often in paired forms; the
      final form turns the pursuer's own appetite or violence back on
      them.
    rationale: |
      First-class ATU membership distinguishes the magic-flight pattern
      from ordinary escape or disguise tales. Its grammar is serial
      pursuit plus adaptive metamorphosis: the pursuer nearly catches
      up, the fugitives transform, the pursuers report the wrong
      object, and the next pursuit escalates. KHM 51 needs the type for
      queries over loyal children, fugitive pairs, cannibal household
      threat, and transformation-as-escape.
    tier: structural
    scope: tale
    lens: atu
    domains: [magic-flight, pursuit, transformation, loyalty, children]
    related: [law_loyal_pair_magic_flight, transform_fugitive_pair, law_wonder_gifts_purchase_recognition_nights, state_forgotten_bride, moral_retributive]
    examples: [foundling_bird, the_two_kings_children, the_true_sweetheart_the_true_bride]

  atu_313a:
    name: The Girl Helps the Hero Flee / Transformation Chase
    description: |
      Tale-type subtype of magic flight in which children or a pair of
      fugitives escape a supernatural captor by throwing objects or
      changing forms so that obstacles arise between them and the
      pursuer.
    rationale: |
      Distinct from the broader `atu_313` node, which groups magic
      flight generally, this subtype marks the Grimm cluster where a
      female helper or sister often supplies the decisive escape action
      and pursuit is defeated by serial obstacle-making. KHM 79 needs
      the subtype because the water-nix episode is a compact
      transformation chase without the forgotten-fiancée continuation
      or loyalty-promise structure of KHM 51.
    tier: structural
    scope: tale
    lens: atu
    domains: [magic-flight, obstacle-flight, water-nix, siblings, pursuit]
    related: [atu_313, law_thrown_objects_raise_pursuit_obstacles, being_water_nix]
    examples: [the_water_nix]

  atu_316:
    name: The Nix of the Mill-Pond
    description: |
      Tale-type: a water-nix enriches a desperate miller in exchange
      for the new-born child he misunderstands as an animal. The child
      later becomes a huntsman, is seized at the pond, and is recovered
      by his faithful wife through dream-guided visits to a wise woman,
      full-moon rites, and golden objects that raise him from the water
      by degrees.
    rationale: |
      First-class ATU membership separates this from magic-flight nix
      tales such as KHM 79. Its grammar is water-spirit bargain,
      unwitting child debt, postponed seizure at the water threshold,
      spouse rescue by three lunar offerings, temporary animal
      transformation to survive the released flood, long separation,
      and recognition through the repeated flute air. The node supports
      queries over nixie bargains, lost spouses, underwater captivity,
      full-moon rites, and staged recovery from water.
    tier: structural
    scope: tale
    lens: atu
    domains: [water-nix, bargain, child-debt, spouse-rescue, full-moon, recognition]
    related: [being_water_nix, law_promise_binds_reality, law_full_moon_golden_gifts_raise_water_captive_by_degrees, law_voice_recognizes_forgotten_bride, moral_restorative]
    examples: [the_nixie_of_the_mill_pond]

  atu_1119:
    name: The Ogre Kills His Own Child / Witch Kills Her Own Child
    description: |
      Tale-type: a murderous supernatural parent, ogre, or witch plans
      to kill a victim in bed, but the intended victim changes places
      with the murderer's own child or kin, causing the murderer to
      kill the wrong person.
    rationale: |
      First-class ATU membership separates the self-inflicted murder
      setup from the later magic-flight and forgotten-bride material in
      KHM 56. The distinctive grammar is bed-position substitution:
      the persecuted stepdaughter overhears the plan, moves the
      witch's daughter to the exposed side, and the witch's axe kills
      her own child. This node supports queries over wrong-victim
      violence inside murderous households.
    tier: structural
    scope: tale
    lens: atu
    domains: [wrong-victim, witch, stepmother, bed, murder]
    related: [arc_cruel_stepmother, being_witch, law_speaking_blood_decoys_pursuit, moral_retributive]
    examples: [sweetheart_roland]

  atu_1174:
    name: The Moon
    description: |
      Tale-type: people from a dark land discover the moon in another
      kingdom, treat it as a lamp owned and maintained by civic
      payment, steal it home, and later divide it into burial shares.
      When the buried quarters reunite below the earth, the dead wake
      and resume noisy worldly pleasures until Saint Peter subdues
      them, returns them to their graves, and hangs the moon in heaven.
    rationale: |
      First-class ATU membership separates this cosmogonic religious
      tale from ordinary heavenly-entry schwanks and from personified
      celestial-body encounters. Its grammar is material-cosmic:
      moon-as-lamp, civic maintenance, theft by travellers, fourfold
      inheritance, burial of light, underworld awakening, heavenly
      intervention, and final installation in the sky. The node
      supports comparative queries over moon-origin stories,
      celestial theft, afterlife disorder, and sacred restoration of
      cosmic boundaries.
    tier: structural
    scope: tale
    lens: atu
    domains: [moon, celestial-light, theft, afterlife, cosmic-order]
    related: [law_celestial_light_displaced_unsettles_dead, obj_portable_celestial_light, loc_world_below, loc_heaven, being_divine, num_4]
    examples: [the_moon]

  atu_884:
    name: The Forgotten Bride
    description: |
      Tale-type: a faithful bride or betrothed is forgotten by the
      bridegroom because of enchantment, deathbed promise, social
      pressure, or another woman's influence. She waits or ventures
      near him in disguise, endures displacement, and is recognized at
      or near the rival wedding, restoring the true union.
    rationale: |
      First-class ATU membership keeps the forgotten-betrothed ending
      distinct from ordinary false-bride substitution and from
      recognition by shoe or generic token. Its core is bond rupture
      and restoration: Roland forgets the maiden until song recalls
      him, while KHM 67's king is diverted by a deathbed oath until the
      ring and disguised bride restore his first promise. The type lets
      us query forsaken-fiancée plots across magical memory-loss and
      social obligation variants.
    tier: structural
    scope: tale
    lens: atu
    domains: [forgotten-bride, memory, wedding, fidelity, recognition]
    related: [state_forgotten_bride, law_voice_recognizes_forgotten_bride, law_gendered_tests_threaten_disguise, arc_false_bride, affect_loyalty]
    examples: [sweetheart_roland, the_twelve_huntsmen]

  atu_550:
    name: The Quest for the Golden Bird
    description: |
      Tale-type: a king's golden apples are stolen by a golden bird;
      three sons seek it, but only the youngest heeds a fox-helper
      enough to pass repeated tests involving the right inn, a wooden
      cage, a plain saddle, a princess, a mountain task, and later
      warnings about rescuing condemned brothers and sitting by a well.
      False heroes steal his prizes, but animal aid and recognition by
      bird, horse, and princess restore him.
    rationale: |
      First-class ATU membership distinguishes the Golden Bird quest
      from generic animal-helper or three-brother tales. Its grammar is
      a chain of exact-instruction tests: each splendid option triggers
      capture and a new prize demand, while the fox's guidance links
      bird, horse, princess, false brothers, and final disenchantment.
      KHM 57 needs the type for queries over fox-guided quests,
      stolen golden apples, false heroes, and curse-release by killing
      the animal helper.
    tier: structural
    scope: tale
    lens: atu
    domains: [golden-bird, fox-helper, quest, false-hero, recognition]
    related: [arc_animal_helper, arc_false_hero, law_animal_advice_requires_exact_obedience, obj_golden_bird, obj_golden_horse]
    examples: [the_golden_bird]

  atu_552a:
    name: The Crystal Ball
    description: |
      Tale-type: the youngest son of an enchantress escapes before his
      mother can transform him like his brothers, obtains a wishing cap
      from quarreling giants, reaches the Castle of the Golden Sun, and
      learns that a bewitched princess can be released only by taking a
      crystal ball hidden inside a burning egg carried by a fiery bird
      released from a wild bull. His transformed eagle and whale
      brothers help recover the egg, and the crystal ball destroys the
      enchanter's power.
    rationale: |
      First-class ATU membership separates this quest from ordinary
      golden-bird searches, dragon-slaying, and animal-helper task
      tales. Its grammar is maternal transformation threat, two
      brothers in animal bodies with limited daily humanity, a disputed
      wishing cap, Castle of the Golden Sun, cursed princess whose true
      beauty is mirror-visible, and a nested bull-bird-egg-crystal
      power object. The node supports comparative queries over hidden
      external power, transformed sibling helpers, and rescue quests
      where the decisive object must be extracted from animal bodies.
    tier: structural
    scope: tale
    lens: atu
    domains: [crystal, enchantment, animal-transformation, sibling-helper, quest, castle]
    related: [law_nested_animal_body_yields_crystal_power_object, obj_crystal_ball, obj_wishing_cap, arc_animal_helper, state_transformed, moral_restorative]
    examples: [the_crystal_ball]

  atu_567:
    name: The Magic Bird Heart
    description: |
      Tale-type episode in which a wondrous bird's heart and liver, if
      eaten, produce gold or fortune for the eater. The intended owner
      loses the power when children or another unexpected eater consume
      the operative organs.
    rationale: |
      First-class ATU membership separates KHM 60's opening wealth-
      transfer from the later blood-brothers and dragon-slayer plot.
      The mechanism is ingestion of magical organs, not a quest for an
      external golden bird as in ATU 550. The type supports comparative
      queries over accidental fortune, edible body-part magic, and
      envy-driven exposure of lucky children.
    tier: structural
    scope: tale
    lens: atu
    domains: [magic-bird, gold, ingestion, children, envy]
    related: [law_magic_bird_organs_generate_gold, obj_magic_bird_heart_liver, obj_golden_bird, affect_envy]
    examples: [the_two_brothers]

  atu_300:
    name: The Dragon-Slayer
    description: |
      Tale-type episode in which a hero kills a dragon that demands
      periodic human sacrifice, rescues a princess, keeps proof of the
      victory, and later exposes a false claimant.
    rationale: |
      Distinct from ATU 303's whole blood-brother structure: ATU 300 is
      the embedded public rescue and proof-contest. KHM 60 contains the
      full grammar: black-draped town, princess tribute, many-headed
      dragon, hero's sleep, marshal's false claim, dragon tongues as
      proof, and marriage to the rescued princess. The node enables
      queries over dragon-slaying and false-hero exposure apart from
      twin-substitution episodes.
    tier: structural
    scope: tale
    lens: atu
    domains: [dragon, princess, sacrifice, false-hero, proof]
    related: [arc_dragon_slayer, being_dragon, arc_false_hero, obj_forensic_token, moral_retributive]
    examples: [the_two_brothers]

  atu_303:
    name: The Twin or Blood Brothers
    description: |
      Tale-type: two near-identical brothers separate after receiving
      life-indicating tokens and animal helpers; one wins a bride by
      monster-slaying, is endangered or petrified in an enchanted
      forest, and the other is mistaken for him, preserves the marriage
      boundary, rescues him, and is finally recognised.
    rationale: |
      First-class ATU membership captures KHM 60's full composite
      architecture rather than only the dragon episode or bird-heart
      prologue. Its distinctive grammar is twinning, separation,
      life-token diagnosis, animal retinue, mistaken identity, rescue
      of the petrified brother, and recognition of the true husband.
      The type supports comparative queries over blood-brother tales,
      doubles, animal companions, and chastity-preserving substitution.
    tier: structural
    scope: tale
    lens: atu
    domains: [twins, brothers, life-token, animal-helper, recognition]
    related: [obj_fate_reporting_knife, arc_animal_helper, state_petrified, law_life_root_restores_dismembered_body, arc_dragon_slayer]
    examples: [the_two_brothers]

  atu_301:
    name: The Three Stolen Princesses / Quest for the Vanished Princesses
    description: |
      Tale-type: princesses vanish into an underground or lower world;
      a hero descends by rope, basket, well, or cavern, defeats multiple
      monsters or dragons guarding the princesses, sends them upward,
      is betrayed by companions who cut the rope, escapes by magical
      aid, and exposes the false rescuers.
    rationale: |
      First-class ATU membership keeps KHM 91's structure distinct from
      the public dragon-slayer type ATU 300 and from blood-brother
      adventure chains. Its defining grammar is vertical descent and
      return: the well, basket, bell, underworld chambers, multiple
      princesses, rope betrayal, musical summoning of helpers, and
      final correction of false rescue claims. The node supports
      comparative queries over underground-princess recovery and
      betrayed descent heroes.
    tier: structural
    scope: tale
    lens: atu
    domains: [underworld, princesses, dragon-slayer, false-hero, well]
    related: [threshold_well, arc_dragon_slayer, arc_false_hero, law_music_attracts, being_dwarf]
    examples: [the_gnome]

  atu_301b:
    name: Strong Hans / Underground Princess Recovery with Betraying Companions
    description: |
      Tale-type: a superstrong youth taken into a robber cave as a
      child frees his mother by force, recruits two strength companions,
      descends by basket and rope through a rock-hole, kills a dwarf
      watchman, sends an imprisoned princess upward, is betrayed by
      the companions, escapes by a ring that commands spirits of the
      air, and punishes the false companions before marrying the
      princess.
    rationale: |
      First-class ATU membership keeps KHM 166 connected to the
      vertical-descent princess-recovery complex while preserving its
      strong-boy variant grammar. Unlike KHM 91's multiple dragons,
      musical summoning, and court testimony, this tale foregrounds
      robber-cave childhood, fir-club strength, two inadequate giant
      companions, a single chained princess, a dwarf watchman, and a
      ring-mediated aerial return. The node supports comparative
      queries over ATU 301 variants where superhuman bodily force and
      betrayed underworld descent converge.
    tier: structural
    scope: tale
    lens: atu
    domains: [strong-boy, underworld, princess, false-hero, ring]
    related: [atu_301, arc_superstrong_youth, arc_extraordinary_companion, arc_false_hero, being_dwarf, obj_wishing_ring, law_underworld_basket_descent_invites_companion_betrayal, law_summoning_ring_commands_air_spirits]
    examples: [strong_hans]

  atu_900:
    name: King Thrushbeard
    description: |
      Tale-type: a proud princess rejects and mocks assembled suitors,
      including a king she ridicules by nickname. Her father swears to
      marry her to the first beggar; the mocked king returns disguised
      as a poor musician, marries her, leads her through poverty, failed
      labour, market shame, and kitchen service, then reveals that he
      orchestrated the trials to humble her pride before the true
      wedding is celebrated.
    rationale: |
      First-class ATU membership separates the proud-bride-humbled plot
      from ordinary forced marriage, task-princess, or Cinderella
      degradation tales. Its grammar is rank inversion as moral
      pedagogy: suitor mockery, oath-marriage to apparent poverty,
      staged social descent, public shame, reveal, confession, and
      reintegration. KHM 52 needs the type for queries over proud
      princesses, disguised husbands, corrective humiliation, and
      social-rank pedagogy.
    tier: structural
    scope: tale
    lens: atu
    domains: [pride, marriage, disguise, humiliation, social-rank]
    related: [arc_proud_rejecting_bride, law_disguised_status_descent_humbles, moral_humbling_reform, agency_social_rank]
    examples: [king_thrushbeard]

  atu_502:
    name: The Wild Man as Helper / Iron John
    description: |
      Tale-type: a wild man is captured from a dangerous forest or
      water-place and caged; a prince releases him after a forbidden
      object enters the cage, fails the wild man's golden well test,
      lives in low service with hidden golden hair, receives horses,
      armour, and troops from the wild man, wins war and festival
      tokens anonymously, and is finally recognized and married.
    rationale: |
      First-class ATU membership separates Iron John from ordinary
      donor tales and from beast-bridegroom disenchantment. Its core is
      initiatory ambivalence: the wild man is both danger and helper,
      the prince's disobedience frees him but causes exile, and the
      golden well's mark becomes the sign through which low service,
      anonymous knightly victory, and marriage recognition converge.
      KHM 136 needs the type for queries over wild-man mentorship,
      masculine initiation, golden hair, hidden identity, and enchanted
      helper release.
    tier: structural
    scope: tale
    lens: atu
    domains: [wild-man, initiation, golden-hair, hidden-identity, war, marriage]
    related: [arc_wild_man_donor, law_golden_well_marks_failed_guardianship, obj_golden_ball, state_hidden_identity, moral_restorative]
    examples: [iron_john]

  atu_850:
    name: The Cunning Little Tailor
    description: |
      Tale-type: a proud princess sets a marriage riddle, then adds a
      dangerous animal ordeal when an unsuitable low-status suitor
      answers correctly. A small tailor survives by tricking the bear
      into attempted imitation, trapping it, and later frightening it
      away from the wedding carriage.
    rationale: |
      First-class ATU membership separates this riddle-and-bear
      marriage plot from the broader proud-princess humiliation type
      and from heroic tailor reputation tales. Its grammar is compact:
      exact riddle-answer, violated or deferred marriage promise,
      stable ordeal with a lethal bear, trickster pedagogy, envy-driven
      release of the bear, and final threat by remembered restraint.
      KHM 114 needs the type for queries over low-status suitors,
      animal ordeals, riddle marriage, and cunning over brute force.
    tier: structural
    scope: tale
    lens: atu
    domains: [riddle, tailor, bear, trickster, marriage]
    related: [arc_proud_task_princess, speech_riddle, law_imitation_trap_overpowers_brute, law_promise_binds_reality, moral_trickster_wins]
    examples: [the_cunning_little_tailor]

  atu_709:
    name: Snow White
    description: |
      Tale-type: a child born under the red-white-black beauty formula
      becomes the object of her stepmother's envy. A truth-speaking
      mirror reveals that she surpasses the queen; the girl is spared
      by a huntsman, sheltered by dwarfs, killed or death-suspended by
      serial disguised attacks, displayed in a glass coffin, revived
      when the poison token is removed, married to a prince, and the
      persecutor is punished at the wedding.
    rationale: |
      First-class ATU membership separates Snow White from generic
      cruel-stepmother and sleeping-princess plots. Its grammar joins
      beauty ranking, truth-mirror surveillance, forest exile, dwarf
      household refuge, three disguised murder attempts, visible
      deathlike preservation in glass, accidental poison removal, and
      retributive wedding punishment. KHM 53 needs the type so queries
      can distinguish mirror-driven beauty persecution from donor-test
      stepmother tales and timed-sleep enchantments.
    tier: structural
    scope: tale
    lens: atu
    domains: [snow-white, stepmother, mirror, dwarfs, poison, coffin]
    related: [arc_cruel_stepmother, obj_truth_mirror, law_truth_mirror_ranks_beauty, law_removable_death_token_restores_life, obj_display_coffin]
    examples: [little_snow_white]

  atu_310:
    name: Rapunzel / The Maiden in the Tower
    description: |
      Tale-type: a pregnant woman's longing for a forbidden plant leads
      her husband to steal from an enchantress's garden; the unborn
      child is surrendered. The girl is raised and locked in a tower,
      accessible only by her long hair. A prince discovers the access
      formula through song, visits her, is blinded by a fall after the
      enchantress discovers them, and is finally healed by Rapunzel's
      tears.
    rationale: |
      Core ATU type for the tower-maiden / hair-ladder cycle. It is
      distinct from general imprisoned-maiden tales because the access
      technology is bodily (hair), the initiating bargain concerns a
      pregnancy craving, and the final restoration joins exile,
      blindness, and tear-healing. First-class membership enables
      queries over tower confinement, pregnancy bargains, and bodily
      ladders across international Rapunzel variants.
    tier: structural
    scope: tale
    lens: atu
    domains: [tower, hair, pregnancy, enchantress, longing]
    related: [arc_imprisoned_maiden, loc_tower, affect_longing, state_blind, being_witch]
    examples: [rapunzel]

  atu_403:
    name: The Three Little Men in the Forest
    description: |
      Tale-type: a stepmother favours her own ugly daughter and
      persecutes the beautiful stepdaughter. The stepdaughter is sent
      into winter forest on an impossible task, behaves generously
      toward supernatural little men, and receives gifts of increasing
      beauty, gold-speech, and royal marriage. The unkind daughter
      repeats the test and receives opposite punishments; later a
      false-bride substitution is exposed through the murdered queen's
      transformed return.
    rationale: |
      Core ATU type for the kind-and-unkind-girls / supernatural-donor
      pattern with false-bride continuation. Distinct from simple
      stepmother persecution because the tale is built around a
      controlled moral experiment: two girls meet the same donors under
      contrasting conduct. First-class membership connects KHM 13 to
      Mother Holle, Diamonds and Toads, and international variants.
    tier: structural
    scope: tale
    lens: atu
    domains: [kind-unkind-girls, stepmother, donor-test, false-bride, winter]
    related: [arc_cruel_stepmother, arc_false_bride, arc_supernatural_donor, moral_kindness_rewarded, law_kindness_to_hidden_donors_rewarded]
    examples: [the_three_little_men_in_the_forest, the_white_bride_and_the_black_one]

  atu_480:
    name: The Kind and the Unkind Girls
    description: |
      Tale-type: an oppressed industrious girl enters an otherworld
      through a well, helps speaking bread and apples, serves a
      supernatural woman, and returns covered with gold; her lazy
      counterpart imitates the journey for reward but refuses the same
      tasks and returns marked with pitch.
    rationale: |
      Core ATU type for parallel donor-test tales without the later
      false-bride continuation of ATU 403. KHM 24's structure depends
      on two girls walking the same path through well, oven, tree, and
      donor-house, so their opposed conduct can be evaluated under
      identical conditions. First-class membership keeps this
      kind/unkind-girls test distinct from Cinderella-style recognition
      plots and from spinning-comedy tales such as ATU 501.
    tier: structural
    scope: tale
    lens: atu
    domains: [kind-unkind-girls, well, donor-test, domestic-labour, reward-punishment]
    related: [arc_oppressed_maiden, arc_cruel_stepmother, arc_supernatural_donor, law_kindness_to_hidden_donors_rewarded, law_otherworld_labor_manifests_as_weather]
    examples: [frau_holle]

  atu_501:
    name: The Three Spinning Women
    description: |
      Tale-type: an idle girl is falsely praised as an indefatigable
      spinner and taken to a palace, where she must spin impossible
      rooms of flax in exchange for marriage to a prince. Three strange
      women complete the work if she acknowledges them as aunts at the
      wedding. Their deformed bodies frighten the bridegroom into
      forbidding his bride ever to spin again.
    rationale: |
      Core ATU type for comic domestic-labour evasion. Distinct from
      kind/unkind donor tales because the heroine is not rewarded for
      virtue but for keeping a bargain with grotesque helpers; the
      closure exposes labour's bodily cost and releases her from the
      expected work. First-class membership enables queries over
      spinning, false industry, helper-kinship, and anti-labour comedy.
    tier: structural
    scope: tale
    lens: atu
    domains: [spinning, domestic-labour, helper, marriage, comedy]
    related: [arc_grotesque_task_helper, agency_domestic_labor, obj_spinning_wheel, moral_comic_inversion]
    examples: [the_three_spinning_women]

  atu_500:
    name: The Name of the Supernatural Helper / Rumpelstiltskin
    description: |
      Tale-type: a girl is forced to perform impossible spinning after
      a false boast; a small supernatural helper completes the work in
      exchange for valuables and finally for her future child. After
      she becomes queen and the child is born, the helper's claim can
      be broken only if she discovers and speaks his hidden name.
    rationale: |
      First-class ATU membership separates the secret-name helper plot
      from ordinary spinning-task tales such as ATU 501. Both involve
      impossible textile labour and supernatural aid, but ATU 500 turns
      aid into a child-claiming bargain and resolves through name
      discovery rather than comic kinship or labour release. KHM 55
      needs this node for queries over name-magic, firstborn bargains,
      straw-to-gold transformation, and dangerous helper contracts.
    tier: structural
    scope: tale
    lens: atu
    domains: [secret-name, spinning, firstborn, bargain, helper]
    related: [law_false_boast_imposes_impossible_task, law_secret_name_breaks_supernatural_claim, speech_name_guess, obj_spinning_wheel, being_dwarf]
    examples: [rumpelstiltskin]

  atu_706:
    name: The Girl Without Hands
    description: |
      Tale-type: a father unknowingly promises his daughter to the
      devil. Her piety blocks the devil, but her hands are cut off;
      she leaves home, receives divine aid in a royal garden, marries a
      king, is exiled with her child through forged letters, lives
      under angelic protection until her hands grow back, and is
      finally recognised and reunited.
    rationale: |
      First-class ATU membership captures a distinct pious-exile /
      mutilated-innocent cycle. It is not simply oppressed-maiden
      labour, false-bride substitution, or silent endurance: the plot
      combines infernal bargain, bodily mutilation, divine protection,
      forged-letter exile, seven-year wilderness shelter, miraculous
      hand restoration, and recognition through the silver hands. This
      node supports queries over handless-maiden variants, piety against
      the devil, and persecuted-wife exile.
    tier: structural
    scope: tale
    lens: atu
    domains: [maimed-maiden, devil, piety, false-letters, exile, restoration]
    related: [law_purity_blocks_infernal_claim, law_false_letters_exile_innocent, state_maimed, obj_prosthetic_hands, being_devil, being_divine]
    examples: [the_girl_without_hands]

  atu_327a:
    name: Hansel and Gretel
    description: |
      Tale-type: famine leads parents or a stepmother to abandon
      children in the forest. The children first return by a pebble
      trail, then are lost when birds eat the breadcrumb trail. A bird
      leads them to an edible house owned by a child-eating witch, who
      cages and fattens the boy and forces the girl to work. The girl
      tricks the witch into the oven, frees her brother, takes treasure,
      and returns home.
    rationale: |
      Core ATU type for abandoned children and the cannibal witch's
      edible-house trap. Distinct from general forest-exposure tales
      because it combines failed/working trail technology, food-house
      lure, child-fattening captivity, oven reversal, and treasure
      return. First-class membership enables queries over famine,
      child abandonment, edible architecture, and children outwitting
      predators.
    tier: structural
    scope: tale
    lens: atu
    domains: [abandoned-children, forest, witch, edible-house, cannibalism]
    related: [arc_abandoned_child, arc_cruel_stepmother, arc_predator, obj_edible_house, law_forest_suspends_domestic_order]
    examples: [hansel_and_gretel]

  atu_612:
    name: The Three Snake-Leaves
    description: |
      Tale-type: a vow binds a spouse to burial with the beloved; a
      serpent-learned life-remedy revives the dead; the revived spouse
      later betrays the rescuer with a lover and is exposed and punished.
    rationale: |
      First-class ATU membership connects KHM 16 to resurrection-
      remedy and treacherous-spouse tales without reducing it to
      faithful-servant reciprocity (ATU 516) or false-bride
      substitution (ATU 403/450). Its distinctive grammar is burial
      oath + snake medicine + post-resurrection betrayal.
    tier: structural
    scope: tale
    lens: atu
    domains: [resurrection, snake, betrayal, marriage, burial-oath]
    related: [law_serpent_medicine_restores_life, obj_life_restoring_leaves, arc_treacherous_spouse, threshold_grave]
    examples: [the_three_snake_leaves]

  atu_673:
    name: The White Snake
    description: |
      Tale-type: a servant secretly tastes a white snake and gains the
      language of animals; animal speech first clears him of an
      accusation, then rescued animals repay his kindness by completing
      bride-winning tasks.
    rationale: |
      First-class ATU membership distinguishes KHM 17 from generic
      animal-helper tales. Its distinctive grammar is animal-language
      acquired through ingestion, followed by reciprocal rescues from
      fish, ants, and ravens that solve escalating marriage tasks. The
      type connects cognition, kindness, and animal aid in one queryable
      pattern.
    tier: structural
    scope: tale
    lens: atu
    domains: [animal-language, kindness, animal-helper, difficult-task, marriage]
    related: [law_ingested_animal_grants_language, law_rescued_animals_repay_kindness, agency_animal_language, obj_language_granting_food, obj_life_apple]
    examples: [the_white_snake]

  atu_554:
    name: The Grateful Animals
    description: |
      Tale-type: a simple or despised hero protects small animals from
      harm; later those animals repay the mercy by completing
      impossible tasks or defeating an impossible search. The aid may
      sort tiny objects, retrieve a key from water, identify the
      rightful bride, or hide the hero inside animal bodies and
      transformed forms beyond a proud princess's sight.
    rationale: |
      First-class ATU membership distinguishes the grateful-animal
      task sequence from general animal-language tales such as ATU
      673. In KHM 62 Simpleton does not understand animal speech and
      does not receive a magic food; his power is prior mercy. Ants,
      ducks, and the queen bee each solve the task fitted to their
      bodily capacity, releasing the enchanted castle from stone and
      sleep. KHM 191 uses the same reciprocity in a hide-and-seek
      marriage ordeal: raven, fish, and fox repay spared lives by
      escalating concealment. The node supports comparative queries
      over animal mercy, impossible tasks, hidden bodies, and lowly-
      hero vindication.
    tier: structural
    scope: tale
    lens: atu
    domains: [grateful-animals, kindness, impossible-task, marriage, concealment]
    related: [law_rescued_animals_repay_kindness, law_grateful_animals_hide_hero_from_omnivision, arc_animal_helper, moral_kindness_rewarded, agency_animal_aid]
    examples: [the_queen_bee, the_sea_hare]

  atu_571:
    name: All Stick Together
    description: |
      Tale-type: a despised youngest son receives a golden or wondrous
      bird from a hidden donor after sharing food; greedy or officious
      people touch the bird or one another and stick fast, forming a
      comic procession that makes an unlaughing princess laugh.
    rationale: |
      First-class ATU membership separates the sticky-procession plot
      from generic laughter rewards. The causal core is material:
      Dummling's goose adheres to would-be feather thieves and rescuers
      until the seven-person train becomes a public spectacle. KHM 64
      needs this node for queries over adhesive wonder-objects,
      donor-rewarded simpletons, and laughter-producing processions.
    tier: structural
    scope: tale
    lens: atu
    domains: [sticky-object, golden-goose, laughter, procession, simpleton]
    related: [obj_golden_goose, law_sticky_wonder_object_collects_interferers, law_laughter_releases_reward, arc_unlaughing_princess]
    examples: [the_golden_goose]

  atu_585:
    name: The Spindle, the Shuttle and the Needle
    description: |
      Tale-type: a poor but industrious orphan inherits textile tools
      and a blessing from a pious elder. A prince seeks a bride who is
      both poorest and richest; sung formulas animate the spindle,
      shuttle, and needle so that they guide him back, weave a wondrous
      carpet, furnish the house, and reveal the maiden as the true
      bride.
    rationale: |
      First-class ATU membership separates this textile-bride plot from
      Cinderella recognition, spinning-labour avoidance, and generic
      magic-object command tales. Its grammar is not task escape or
      rank disguise: inherited craft tools, pious domestic industry,
      golden thread, self-weaving carpet, self-furnishing needle, and
      the paradox "poorest and richest" together make the maiden's
      labour itself bride-worthiness. The node supports queries over
      textile agency, humble wealth, and craft-mediated courtship.
    tier: structural
    scope: tale
    lens: atu
    domains: [textile, bride-choice, craft, poverty, piety, magic-object]
    related: [law_textile_tools_summon_wooer_and_prepare_house, obj_charmed_textile_tools, arc_pious_orphan, moral_industrious_piety_rewarded]
    examples: [the_spindle_the_shuttle_and_the_needle]

  atu_513b:
    name: The Land-and-Water Ship
    description: |
      Tale-type episode in which a hero must obtain a ship or vehicle
      that can travel on both land and water, often as the final
      impossible task before receiving a princess.
    rationale: |
      Distinct from ATU 571's sticky-goose procession, though KHM 64
      appends it after the laughter condition. The king has already
      been defeated by laughter, drinking, and eating tasks, so he
      demands a terrain-defying ship as one more evasion. This node
      enables comparative queries over amphibious vehicles and
      escalating impossible bride-tasks.
    tier: structural
    scope: tale
    lens: atu
    domains: [ship, land, water, impossible-task, bride-winning]
    related: [obj_land_water_ship, arc_supernatural_donor, law_kindness_to_hidden_donors_rewarded]
    examples: [the_golden_goose]

  atu_513a:
    name: Six Go through the Whole World / Six Soldiers of Fortune
    description: |
      Tale-type: a discharged soldier or leader recruits companions
      with extraordinary bodily powers, uses their abilities to win a
      royal contest or impossible task, survives the king's attempted
      betrayal, and carries away the kingdom's treasure.
    rationale: |
      Core ATU type for the extraordinary-companion ensemble tale. It
      differs from ATU 513B, where a donor supplies a land-and-water
      ship, because the decisive resource is not a wonder vehicle but a
      coordinated set of specialized bodies. First-class membership
      lets KHM 71 connect with international "six/seven servants" and
      "soldiers of fortune" variants while keeping the team-agency
      pattern distinct from magical-object conquest.
    tier: structural
    scope: tale
    lens: atu
    domains: [companions, soldier, impossible-task, race, treasure]
    related: [arc_extraordinary_companion, agency_extraordinary_body, law_specialized_companions_solve_impossible_tasks, atu_513b]
    examples: [how_six_men_got_on_in_the_world, the_six_servants]

  atu_650a:
    name: The Young Giant / Strong Boy
    description: |
      Tale-type: a tiny or unusual boy is raised into superhuman
      strength, returns unrecognized or uncontainable by his family,
      and then enters labour or service episodes where greedy masters,
      murder attempts, and supernatural dangers are overcome by
      excessive bodily power.
    rationale: |
      First-class ATU membership keeps KHM 90 distinct from tiny-hero
      trickster tales and from extraordinary-companion ensembles. Its
      protagonist does not win by hiding in smallness or by serving a
      team; the entire tale tests what happens when a human child is
      scaled into giant force and ordinary rural contracts cannot hold
      him. The node supports queries over strong-boy initiation,
      giant nurture, smithy strength-tests, and exploitative employers
      punished by blows.
    tier: structural
    scope: tale
    lens: atu
    domains: [strong-boy, giant, labor, smithy, initiation]
    related: [arc_superstrong_youth, law_giant_nurture_magnifies_body, law_blow_wage_reverses_greedy_employer, being_giant, agency_extraordinary_body]
    examples: [the_young_giant]

  atu_671:
    name: The Three Languages
    description: |
      Tale-type: a noble youth is judged stupid because he learns only
      animal languages from three masters. His father rejects him and
      orders him killed, but servants spare him. The youth later uses
      dog speech to free a tower from bewitched treasure-guardians,
      frog prophecy to learn his future papacy, and dove counsel to
      accept and perform the papal office.
    rationale: |
      First-class ATU membership distinguishes the animal-language
      ascent tale from general animal-helper or abandoned-child tales.
      Its core is the delayed value of despised knowledge: three
      animal languages that seem useless within paternal household
      logic become treasure-release, prophecy, divine election, and
      liturgical competence. KHM 33 needs the type for comparative
      queries over learned animal speech, misjudged education, and
      providential elevation.
    tier: structural
    scope: tale
    lens: atu
    domains: [animal-language, education, exile, treasure, papacy]
    related: [agency_animal_language, law_animal_language_reveals_hidden_order, law_divine_token_confers_office, moral_providential_election, num_3]
    examples: [the_three_languages]

  atu_295:
    name: The Straw, the Coal, and the Bean
    description: |
      Tale-type: straw, coal, and bean escape cooking or burning,
      travel together, attempt to cross a brook, and fail comically;
      the surviving bean is sewn together, explaining the black seam
      on beans.
    rationale: |
      First-class ATU membership separates this tiny etiological
      animal/object tale from larger magic tales and beast fables. Its
      distinctive grammar is animated household materials, failed
      bridge-crossing, comic destruction, and a species-origin mark.
      The node supports queries over Grimm's miniature etiologies and
      animated-object comedy.
    tier: structural
    scope: tale
    lens: atu
    domains: [etiology, animated-object, food, fire, comic]
    related: [being_animated_object, law_etiological_mishap_marks_species, loc_hearth, obj_needle_thread, moral_comic_inversion]
    examples: [straw_coal_and_bean]

  atu_555:
    name: The Fisherman and His Wife
    description: |
      Tale-type: a fisherman releases an enchanted fish and, under his
      wife's pressure, repeatedly asks it for escalating wishes until
      her desire to command divine order causes all gains to revert.
    rationale: |
      First-class ATU membership connects the tale to the wish-fish /
      overreaching-wife complex without reducing it to generic
      greed. Its distinctive grammar is reluctant mediation by the
      husband, insatiable wish escalation by the wife, sea-weather
      intensification, and final hovel-reversion.
    tier: structural
    scope: tale
    lens: atu
    domains: [wish, greed, fish, marriage, overreach]
    related: [arc_greedy_one, law_insatiable_wishing_reverts_gifts, law_nature_mirrors_moral_excess, moral_overreach_reversal, speech_wish]
    examples: [the_fisherman_and_his_wife]

  atu_780:
    name: The Singing Bone
    description: |
      Tale-type: two brothers seek a dangerous beast and a bride-reward;
      the younger receives supernatural aid, kills the beast, and is
      murdered by the envious elder, who claims the prize. Years later
      a bone from the victim becomes a musical instrument that sings
      the hidden murder to a shepherd and then to the king, exposing
      the killer.
    rationale: |
      First-class ATU membership distinguishes murder-revelation by
      truth-bearing remains from ordinary fraternal rivalry or
      beast-slaying quest tales. KHM 28's type combines donor-gift,
      boar-slaying, bridge murder, false heroic claim, bone-song
      testimony, and retributive drowning. The node supports queries
      over concealed murder, evidentiary relics, and posthumous
      speech.
    tier: structural
    scope: tale
    lens: atu
    domains: [murder, brothers, bone, testimony, retribution]
    related: [law_dead_matter_reveals_murder, obj_singing_bone, speech_testimony, sp_boar, moral_retributive]
    examples: [the_singing_bone]

  atu_2022:
    name: Little Louse and Little Flea
    description: |
      Tale-type: a tiny domestic accident triggers a cumulative chain
      of lamenting or sympathetic actions by insects, household objects,
      natural things, and a human until water floods and destroys them
      all.
    rationale: |
      First-class ATU membership distinguishes this cumulative-chain
      tale from etiological object comedy and beast fable. The plot is
      built by formulaic repetition: each new participant asks why the
      previous one acts, hears the growing list, and joins with a more
      destructive response. KHM 30 needs this type for queries over
      cumulative tales, affect-contagion, miniature domestic worlds,
      and formulaic escalation.
    tier: structural
    scope: tale
    lens: atu
    domains: [cumulative-tale, insect, lament, household, flood]
    related: [law_contagious_lament_cascades, sp_insect, being_animated_object, moral_comic_inversion]
    examples: [little_louse_and_little_flea]

  atu_785:
    name: Who Ate the Lamb's Heart?
    description: |
      Tale-type episode in which a companion secretly eats the best
      part of an animal, denies it, and is later forced into confession
      or exposed by a division of reward that assigns a share to the
      eater.
    rationale: |
      First-class ATU membership separates the lamb-heart confession
      game from ordinary food theft or gluttony. KHM 81 uses it as a
      moral test between St. Peter and Brother Lustig: the soldier
      denies the heart even under rising water, then admits it when a
      third pile of gold appears. The node supports queries over
      edible proof, denial, and comic confession by reward.
    tier: structural
    scope: tale
    lens: atu
    domains: [food-theft, heart, confession, companion, soldier]
    related: [law_hoarded_share_chokes_holder, speech_lie, affect_greed, arc_discharged_soldier]
    examples: [brother_lustig]

  atu_753:
    name: Christ and the Smith / The Old Man Made Young Again
    description: |
      Tale-type: Christ and St. Peter receive hospitality at a smith's
      house; Christ rejuvenates an aged beggar by forge fire, quenching
      water, and blessing. The smith imitates the procedure on an old
      woman without divine authority, fails grotesquely, and the shock
      produces ape-like children who become the origin of apes.
    rationale: |
      First-class ATU membership separates KHM 147 from ATU 753A
      unsuccessful resuscitation episodes such as Brother Lustig. The
      failed imitation is similar, but the material grammar is
      different: forge, bellows, red-hot fire, quenching tub, blessing,
      rejuvenation, artisan overconfidence, deformation, and etiology.
      The node supports comparative queries over Christ-and-smith
      legends, rejuvenation miracles, and comic origin stories caused
      by imitated sacred craft.
    tier: structural
    scope: tale
    lens: atu
    domains: [christ, smith, forge, rejuvenation, imitation, etiology, apes]
    related: [being_divine, law_sacred_forge_rejuvenates_body, law_imitated_miracle_without_authority_deforms_body, loc_forge, sp_ape, moral_comic_inversion]
    examples: [the_old_man_made_young_again]

  atu_758:
    name: Eve's Various Children
    description: |
      Tale-type: Eve presents her beautiful children to God and hides
      the ugly ones, but God blesses both groups by assigning them
      different social estates, ranks, and trades needed for the whole
      world to be supplied.
    rationale: |
      First-class ATU membership separates this religious etiological
      tale from ordinary reward-and-punishment sorting. The hidden
      children are not rejected or punished after exposure; they are
      given necessary labour roles, and God explains hierarchy as an
      interdependent body. KHM 180 needs the type for queries over
      estate origin, divine blessing, beauty and ugliness, labour
      distribution, and theological explanations of social order.
    tier: structural
    scope: tale
    lens: atu
    domains: [creation, estates, labour, hierarchy, blessing, body]
    related: [law_divine_estate_distribution_orders_social_body, moral_divine_social_interdependence, being_divine, agency_social_rank, agency_domestic_labor]
    examples: [eves_various_children]

  atu_760:
    name: The Nail
    description: |
      Tale-type: a traveller ignores warnings about a missing nail and
      then a missing horseshoe because he is in haste. The small defect
      grows into lameness, stumbling, a broken leg, loss of the horse,
      a burdensome walk home, and late arrival.
    rationale: |
      First-class ATU membership keeps this short proverb-tale
      distinct from animal-helper horse tales, magical horse episodes,
      and broad foolish-servant comedy. Its entire grammar is causal
      compression: nail, shoe, limp, stumble, fall, broken leg, carried
      trunk, delayed homecoming. The node supports queries over
      cumulative practical negligence, cautionary miniatures, and
      "hasten slowly" morals.
    tier: structural
    scope: tale
    lens: atu
    domains: [proverb, haste, horse, nail, negligence, cascade]
    related: [law_unrepaired_small_defect_cascades_into_disaster, moral_prudent_pacing, sp_horse, agency_domestic_labor]
    examples: [the_nail]

  atu_753a:
    name: The Unsuccessful Resuscitation
    description: |
      Tale-type episode in which a sacred or magical healer restores a
      dead person by a difficult procedure, but an imitator repeats the
      visible actions without the needed knowledge and fails.
    rationale: |
      First-class ATU membership distinguishes Brother Lustig's failed
      princess resurrection from general revival tales. The point is
      imitation without competence: he copies boiling, cleaning, and
      formula-speech, but lays the bones in confusion. This node keeps
      sacred resurrection, technical body-order, and failed copycat
      healing queryable together.
    tier: structural
    scope: tale
    lens: atu
    domains: [resurrection, imitation, bones, sacred, failure]
    related: [law_correct_bone_order_restores_life, being_divine, moral_mercy_over_judgment]
    examples: [brother_lustig]

  atu_330b:
    name: The Devil in the Sack
    description: |
      Tale-type episode in which a human traps one or more devils in a
      sack, bag, or knapsack and has them beaten or otherwise punished,
      making infernal beings fear the container thereafter.
    rationale: |
      First-class ATU membership separates the haunted-castle devil
      capture from ordinary ghost tests. In KHM 81 the devils do not
      flee from holiness; they are wished into the knapsack and hammered
      at a smithy. The node supports queries over comic domination of
      hell by container magic and artisan violence.
    tier: structural
    scope: tale
    lens: atu
    domains: [devil, sack, smithy, beating, haunted-castle]
    related: [law_wish_knapsack_contains_targets, obj_wish_knapsack, being_devil, agency_violence]
    examples: [brother_lustig]

  atu_330:
    name: Entering Heaven by a Trick
    description: |
      Tale-type: a roguish human rejected by Heaven and often Hell
      gains admission to Heaven by exploiting a loophole, wager,
      object, chair, sack, or other trick that forces the gatekeeper to
      let him remain.
    rationale: |
      First-class ATU membership distinguishes afterlife-entry trickery
      from moral salvation or divine election. Brother Lustig does not
      earn Heaven by repentance; Hell refuses him out of fear, and he
      enters Heaven by giving St. Peter the knapsack and wishing himself
      into it once it hangs inside. The node enables queries over
      comic eschatology, loophole salvation, and saint-trickster
      contests.
    tier: structural
    scope: tale
    lens: atu
    domains: [heaven, hell, trickster, afterlife, loophole]
    related: [law_wish_knapsack_contains_targets, obj_wish_knapsack, loc_heaven, loc_hell, moral_trickster_wins]
    examples: [brother_lustig]

  atu_330a:
    name: The Smith's Three Wishes / Cheating Death
    description: |
      Tale-type: a sinner or trickster receives three supernatural
      wishes, uses one to trap Death or another afterlife authority,
      disrupts mortality or cosmic order, and later forces entry into
      Heaven or is expelled from it by comic disorder.
    rationale: |
      Distinct from `atu_330`, which names the broader entry-into-
      Heaven-by-trick pattern. ATU 330A preserves the three-wishes
      structure and Death-trapping episode: Hansel asks for winning
      cards, winning dice, and a tree that no climber can leave, then
      uses the tree to halt death for seven years. This node keeps
      three-wish anti-salvation tales queryable apart from sack, chair,
      and loophole-only afterlife tricks.
    tier: structural
    scope: tale
    lens: atu
    domains: [three-wishes, death, gambling, heaven, trickster]
    related: [atu_330, law_trapped_death_suspends_mortality, law_winning_game_objects_totalize_play, obj_sticky_fruit_tree]
    examples: [gambling_hansel]

  atu_1415:
    name: Lucky Hans
    description: |
      Tale-type: a foolishly contented servant receives wages, trades
      them through a chain of decreasing value, interprets every
      exchange as good fortune, and finally loses the last burden while
      remaining happy.
    rationale: |
      First-class ATU membership distinguishes Hans in Luck from
      ordinary fool tales and from trickster exchange tales. The
      distinctive grammar is not simply bad bargaining: every trade is
      subjectively rationalized as relief from the immediately prior
      inconvenience. The node supports comparative queries over
      diminishing-exchange chains, subjective happiness, and
      anti-economic luck.
    tier: structural
    scope: tale
    lens: atu
    domains: [luck, exchange, fool, contentment, burden]
    related: [law_diminishing_exchange_reframed_as_luck, moral_contentment_over_possession, arc_fool]
    examples: [hans_in_luck]

  atu_859b:
    name: Hans Married / Equivocal Wealth Wooing
    description: |
      Tale-type episode in which a poor suitor is represented as
      wealthy through ambiguous descriptions of his place, money,
      bread, clothes, or "patches," leading greedy in-laws to accept a
      marriage based on misread poverty signs.
    rationale: |
      First-class ATU membership distinguishes this marriage-schwank
      from generic poor-bridegroom pretence tales. The defining feature
      is verbal ambiguity backed by literal props: the wooer does not
      invent invisible land, but points to patches on clothing and lets
      the hearers import the property sense. KHM 84 needs the node for
      queries over equivocal wealth, greedy fathers, and comic
      marriage-by-wordplay.
    tier: structural
    scope: tale
    lens: atu
    domains: [marriage, poverty, wordplay, property, schwank]
    related: [law_equivocal_poverty_terms_mimic_wealth, arc_trickster, moral_trickster_wins]
    examples: [hans_married]

  atu_1696:
    name: Clever Hans / Misapplied Instruction
    description: |
      Tale-type: a fool receives a practical phrase, carrying rule, or
      behavioural correction that would have suited the previous
      situation, then applies it unchanged to the next incompatible
      situation. In the courtship version, gifts are mishandled after
      maternal corrections; in the travelling version, repeated road
      formulas offend fishermen, execution witnesses, knackers, and
      cart-drivers in sequence.
    rationale: |
      First-class ATU membership distinguishes the formulaic
      misapplied-instruction tale from generic fool tales and from
      speech-literalism schwanks. Its core is serial pedagogy that
      fails because every lesson is learned one episode too late. KHM
      32 gives the household/courtship form; KHM 143 gives the road-
      formula form. The node connects repeated correction,
      wrong-context obedience, escalating blows, and formulaic comedy
      into one queryable pattern.
    tier: structural
    scope: tale
    lens: atu
    domains: [foolishness, instruction, formula, road, schwank]
    related: [arc_fool, law_misapplied_instruction_cascades, moral_comic_inversion, loc_stable, loc_road]
    examples: [clever_hans, going_a_travelling]

  atu_1450:
    name: Clever Elsie
    description: |
      Tale-type: a supposedly wise young woman imagines a distant
      future domestic accident and draws the whole household into
      lamenting it as present fact. After marriage, she fails a field
      labour task, is covered by a bell-net while sleeping, doubts her
      own identity, accepts her husband's denial, and disappears from
      the village.
    rationale: |
      First-class ATU membership distinguishes KHM 34 from other fool
      tales. Its core is not serial instruction like KHM 32, but
      excessive foresight and identity collapse: hypothetical risk
      becomes communal mourning, then an external sign and social
      answer unmake Elsie's self-recognition. The type supports
      comparative queries for foolish forethought, domestic labour
      failure, and comic self-loss.
    tier: structural
    scope: tale
    lens: atu
    domains: [foolishness, forethought, identity, marriage, domestic-labour]
    related: [arc_fool, law_hypothetical_fear_contagion, law_disguise_alters_social_reality, state_self_unrecognized, moral_comic_inversion]
    examples: [clever_elsie]

  atu_1009:
    name: The Wise Servant
    description: |
      Tale-type: a servant is sent on a practical errand, ignores the
      assigned task, and pursues something that pleases him instead.
      When questioned, he answers that he has found something better
      than the lost object: three birds, one seen, one heard, and one
      chased.
    rationale: |
      First-class ATU membership separates this anti-service schwank
      from serial fool tales such as ATU 1696 and laziness catalogues
      such as ATU 1950. Its core is compact servant disobedience:
      order understood, task not attempted, substitute discovery
      offered as superior, and narrator's ironic advice to follow one's
      own head rather than the master's command. The node supports
      comparative queries over servant autonomy, comic wisdom,
      anti-work advice, and abandoned errands.
    tier: structural
    scope: tale
    lens: atu
    domains: [servant, disobedience, errand, birds, schwank]
    related: [law_self_willed_service_replaces_orders, agency_domestic_labor, speech_command, moral_comic_inversion, sp_bird]
    examples: [the_wise_servant]

  atu_1049:
    name: The Giant and the Tailor
    description: |
      Tale-type: a boasting tailor enters service with a giant and
      repeatedly answers small tasks with exaggerated claims so the
      giant mistakes him for a dangerous sorcerer. The giant finally
      tests him on a willow branch, and the tailor is thrown into the
      air by his own small body and lack of practical strength.
    rationale: |
      First-class ATU membership separates this giant-and-boaster
      schwank from heroic giant killing and from KHM 20's successful
      reputation tale. Its grammar is anti-heroic: boast-speech scares
      a credulous giant into thinking the tailor can carry wells,
      forests, and thousands of boars, but the final bodily test
      exposes the mismatch between talk and capacity. The node supports
      queries over giant gullibility, servant-task exaggeration,
      boast-driven misrecognition, and comic backfire.
    tier: structural
    scope: tale
    lens: atu
    domains: [giant, tailor, boast, servant-task, misrecognition, schwank]
    related: [being_giant, law_boast_generates_reputation, speech_boast, state_deceived, moral_comic_inversion]
    examples: [the_giant_and_the_tailor]

  atu_1030:
    name: The Crop Division with the Devil
    description: |
      Tale-type: a peasant bargains with the devil or another powerful
      owner over the division of field produce. By choosing root crops
      when the devil receives the top, and grain when the devil receives
      the bottom, the peasant keeps the useful harvest both times and
      gains the treasure or profit.
    rationale: |
      First-class ATU membership separates this agrarian devil trick
      from generic pact tales and from peasant fraud cycles. Its grammar
      is the crop-geometry bargain: above-ground versus under-earth
      shares, then a deliberate alternation between turnips and wheat.
      KHM 189 needs this node for queries over agricultural cunning,
      literal contract terms, devils as bad agrarian readers, and
      harvest division as trickster law.
    tier: structural
    scope: tale
    lens: atu
    domains: [devil, peasant, agriculture, bargain, turnip, wheat]
    related: [law_top_bottom_crop_bargain_tricks_devil, being_devil, arc_trickster, moral_trickster_wins]
    examples: [the_peasant_and_the_devil]

  atu_1387:
    name: A Woman Draws Beer in the Cellar
    description: |
      Tale-type episode in which a foolish wife begins a household food
      task, leaves beer running while attending to another problem, and
      then tries to hide or repair the spill through an even more
      wasteful domestic action.
    rationale: |
      First-class ATU membership distinguishes the beer-cellar mishap
      from generic foolish-wife tales and from Clever Elsie's cellar
      forethought. The core is material mismanagement: sausage, dog,
      beer-cask, can, and flour form a chain of practical losses. The
      node supports comparative queries over household-storage comedy,
      failed provisioning, and repair-as-destruction.
    tier: structural
    scope: tale
    lens: atu
    domains: [foolishness, cellar, beer, household, comedy]
    related: [arc_fool, loc_cellar, law_foolish_remedy_compounds_loss, agency_domestic_labor]
    examples: [frederick_and_catherine]

  atu_1373a:
    name: The Crumbs on the Table
    description: |
      Tale-type or animal-schwank: domestic animals are urged by a
      human household member to take forbidden food from the table
      while the stricter mistress is away. The animals foresee
      punishment, yield under pressure, are beaten when the mistress
      returns, and the instigator answers their complaint with mockery.
    rationale: |
      First-class ATU membership separates this tiny domestic-animal
      scene from servant food-theft tales and from loyal-dog service
      fables. Its grammar is social rather than predatory: the powerful
      insider authorizes table transgression but does not protect the
      dependent animals from the returning authority. KHM 190 needs
      this node for queries over table food, unequal household power,
      animal speech, and blame displaced onto dependents.
    tier: structural
    scope: tale
    lens: atu
    domains: [dog, table, food, punishment, household, schwank]
    related: [law_invited_table_theft_redirects_punishment_to_dependents, sp_dog, moral_naive_punished, agency_speech]
    examples: [the_crumbs_on_the_table]

  atu_1385:
    name: A Woman Loses Her Husband's Money
    description: |
      Tale-type episode in which a foolish wife misunderstands hidden
      money, treasure, or coins as valueless counters and lets traders,
      pedlars, or rogues take the household wealth in exchange for
      cheap goods.
    rationale: |
      Distinct from `moral_trickster_wins`, where the protagonist
      profits from a bargain, and from `law_speech_taken_literally`,
      where language makes a claim binding. Here the comedy rests on
      material value blindness: gold is treated as play-counters, pots
      are treated as worth the wealth, and the husband must pursue the
      thieves to recover the loss. The type enables queries for
      household economy damaged by foolish valuation.
    tier: structural
    scope: tale
    lens: atu
    domains: [money, trade, foolishness, household, value]
    related: [arc_fool, law_foolish_remedy_compounds_loss, moral_comic_inversion]
    examples: [frederick_and_catherine]

  atu_1291b:
    name: A Fool Greases the Cracked Earth with Butter
    description: |
      Tale-type episode in which a fool sees ruts, cracks, wounds, or
      marks in the road or earth and treats them as living injuries
      that should be soothed with food, grease, butter, or another
      household substance.
    rationale: |
      Separate from generic lost-provision comedy because the error is
      animistic misreading of landscape: Catherine pities the torn
      road as if cart-ruts were skin wounds. This slot lets queries
      isolate tales where practical goods are wasted through misplaced
      compassion toward matter rather than through greed, theft, or
      ordinary forgetfulness.
    tier: structural
    scope: tale
    lens: atu
    domains: [road, food, compassion, foolishness, materiality]
    related: [loc_road, affect_pity, law_foolish_remedy_compounds_loss]
    examples: [frederick_and_catherine]

  atu_1291:
    name: Sending One Cheese After Another
    description: |
      Tale-type episode in which one rolling or lost food item is
      treated as an agent that can be fetched, called, or accompanied
      by another; successive items are sent after it until all are
      gone.
    rationale: |
      Distinct from `law_misapplied_instruction_cascades`, which
      depends on learned instruction, and from `law_speech_taken_
      literally`, which depends on utterance. The cheese sequence
      turns food into imagined social actors with legs, company, and
      errands. The type supports comparative queries over object-
      personification in fool tales and provision-loss schwanks.
    tier: structural
    scope: tale
    lens: atu
    domains: [food, personification, journey, foolishness, comedy]
    related: [arc_fool, law_foolish_remedy_compounds_loss, loc_road]
    examples: [frederick_and_catherine]

  atu_157a:
    name: The Sparrow and His Four Children
    description: |
      Tale-type: a sparrow's four fledged young are scattered by boys
      and wind before their father can teach them. In autumn the father
      meets them again and questions where each survived: gardens,
      court stables, roads and mountains, and church. Each child
      reports a human danger or a religious lesson, and the youngest
      turns survival into trust in God, prayer, and harmless food.
    rationale: |
      First-class ATU membership separates this didactic bird-family
      fable from animal-war tales and from human prodigal-child
      stories. Its grammar is parental counsel after accidental
      dispersal: four children, four world-spaces, practical warnings
      about guns, snares, stones, and predatory birds, and a final
      church-learned providential maxim. The node supports comparative
      queries over animal-parent pedagogy, bird survival, religious
      fables, and fourfold worldly instruction.
    tier: structural
    scope: tale
    lens: atu
    domains: [bird, parent, counsel, danger, piety, children]
    related: [law_parental_bird_counsel_maps_worldly_dangers, moral_providential_protection, sp_bird, speech_warning, num_4]
    examples: [the_sparrow_and_his_four_children]

  atu_1577:
    name: The Poor Boy in the Grave
    description: |
      Tale-type: an orphan servant is starved and beaten by rich
      caregivers, punished for animal losses and simple mistakes, and
      driven by fear into seeking poison. Misnamed honey and wine lead
      him to a grave, where wine and night-dew kill him; the abusive
      household is then destroyed by fire and conscience.
    rationale: |
      First-class ATU membership separates this tragic exemplum from
      ordinary fool tales about simple mistakes and from religious
      reward tales about pious poverty. Its grammar is social cruelty:
      hunger, blows, impossible care tasks, honest confession, failed
      adult correction, despair, false poison, grave-entry, and
      retributive ruin of the rich household. The node supports
      queries over abused orphans, punitive caregiving, hunger-driven
      error, child death, and conscience punishment.
    tier: structural
    scope: tale
    lens: atu
    domains: [orphan, abuse, hunger, despair, grave, retribution]
    related: [law_cruel_caregiving_converts_simple_error_into_fatal_despair, affect_despair, affect_hunger, moral_retributive]
    examples: [the_poor_boy_in_the_grave]

  atu_173:
    name: The Duration of Life
    description: |
      Tale-type: God assigns a first lifespan to animals and humans.
      The ass, dog, and monkey each find thirty years too long for
      their bodily or social condition and surrender part of their
      allotted time. Man, unsatisfied with thirty vigorous human years,
      receives the animals' discarded years, producing a seventy-year
      life whose later stages resemble ass-burden, dog-decline, and
      monkey-foolishness.
    rationale: |
      First-class ATU membership separates this comic lifespan origin
      from Death-godfather tales, memento-mori warnings, and ordinary
      animal fables. Its grammar is arithmetic and anthropological:
      divine allocation, animal complaint, partial release, human
      extension, and explanatory mapping of human aging onto animal
      modes. The node supports comparative queries over lifespan
      etiologies, transferred animal years, divine apportionment, and
      comic accounts of old age.
    tier: structural
    scope: tale
    lens: atu
    domains: [lifespan, aging, animals, creation, divine, comedy]
    related: [law_transferred_animal_years_shape_human_aging, being_divine, sp_donkey, sp_dog, sp_monkey, num_30, num_70]
    examples: [the_duration_of_life]

  atu_1653a:
    name: Securing the Door
    description: |
      Tale-type episode in which a fool is told to secure the house and
      responds by fastening or carrying the door itself, confusing the
      movable object with the protective function of a fitted doorway.
    rationale: |
      First-class ATU membership keeps this door-security joke distinct
      from ordinary domestic neglect. The error is threshold logic:
      Catherine bolts the upper half, removes the lower half, and
      brings it to Frederick as if the house's safety had moved with
      the door. The type supports queries over material
      misunderstandings of household boundaries.
    tier: structural
    scope: tale
    lens: atu
    domains: [door, threshold, household, foolishness, security]
    related: [obj_displaced_house_door, threshold_doorway, law_foolish_remedy_compounds_loss]
    examples: [frederick_and_catherine]

  atu_1653:
    name: The Robbers under the Tree
    description: |
      Tale-type episode in which people hidden in a tree drop or spill
      objects onto thieves below; the thieves misread the falling
      matter or noise as uncanny danger and flee, leaving booty behind.
    rationale: |
      Distinct from `atu_130`, where aged animals intentionally
      frighten robbers by collective performance. ATU 1653 is a
      vertical concealment and falling-object episode: pears, vinegar,
      and the door descend from the tree, and the thieves' fear does
      the useful work. The node supports queries over accidental
      anti-robber victories and comic supernatural misrecognition.
    tier: structural
    scope: tale
    lens: atu
    domains: [robbers, tree, falling-object, misrecognition, comedy]
    related: [loc_tree, law_accidental_noise_routes_rogues, affect_fear]
    examples: [frederick_and_catherine]

  atu_1383:
    name: A Woman Does Not Know Herself
    description: |
      Tale-type episode in which a woman, after sleep, bodily change,
      altered clothing, or an external answer, cannot decide whether
      she is herself and accepts social confirmation that displaces her
      own identity.
    rationale: |
      Distinct from `atu_1450`, where Clever Elsie's identity collapse
      follows an imposed bell-net disguise. KHM 59 reaches the same
      self-unrecognition through accidental self-stripping in the field
      and Frederick's answer that Catherine is already home. This type
      supports queries for comic identity loss across different
      material causes.
    tier: structural
    scope: tale
    lens: atu
    domains: [identity, self-doubt, foolishness, field, comedy]
    related: [state_self_unrecognized, law_disguise_alters_social_reality, loc_field, arc_fool]
    examples: [frederick_and_catherine, clever_elsie]

  atu_1535:
    name: The Rich Peasant and the Poor Peasant
    description: |
      Tale-type: a poor peasant tricks richer neighbours through a
      sequence of fraudulent gains, including compensation for a lost
      wooden calf, profit from a cowhide/oracle deception, and false
      reports that lure imitators into ruin.
    rationale: |
      First-class ATU membership separates this Unibos-style peasant
      trickster tale from generic fool comedy. Its core is asymmetric
      rural economy: a poor man's staged losses and lies extract a cow,
      money, sheep, and inheritance from richer peasants whose greed
      makes them imitate the surface of his success. The node supports
      queries over peasant trickery, cowhide profit, and rich-villager
      self-destruction.
    tier: structural
    scope: tale
    lens: atu
    domains: [peasant, trickster, cattle, imitation, schwank]
    related: [arc_trickster, law_false_oracle_exposes_hidden_goods, law_fatal_imitation_of_trickster_profit, moral_trickster_wins]
    examples: [the_little_peasant]

  atu_1525a:
    name: The Master Thief
    description: |
      Tale-type: a runaway son returns rich and reveals that he has
      become a master thief. His godfather or ruler spares him from
      justice only if he performs three impossible thefts, typically
      stealing a guarded horse, bedchamber sheet and ring, and clerical
      figures from church.
    rationale: |
      First-class ATU membership separates this professional thief-test
      from generic trickster profit and from magician-apprentice thief
      tales. Its grammar is public proof of mastery: each task crosses
      a stronger social boundary through disguise, drugging, corpse
      decoy, voice imitation, and false apocalypse. KHM 192 needs this
      node for queries over master-thief skill, three-test pardon,
      noble godfather justice, and theft staged against guarded,
      intimate, and sacred spaces.
    tier: structural
    scope: tale
    lens: atu
    domains: [master-thief, theft, disguise, three-tasks, church, bedchamber]
    related: [arc_master_thief, law_master_thief_trials_escalate_guarded_intimate_sacred_theft, moral_trickster_wins, state_disguised]
    examples: [the_master_thief]

  atu_1737:
    name: Trading Places with the Trickster in a Sack
    description: |
      Tale-type episode in which a trickster condemned inside a sack,
      barrel, or similar container escapes execution by persuading
      another person to take his place, usually by claiming the
      container leads to rank, wealth, or marriage.
    rationale: |
      Distinct from ATU 1535's whole rich/poor peasant conflict. ATU
      1737 names the container-swap episode specifically: the condemned
      little peasant uses the shepherd's desire to be mayor to transfer
      the drowning death to him. This supports cross-tale queries over
      execution substitution, ambition, and trickster survival.
    tier: structural
    scope: tale
    lens: atu
    domains: [sack, barrel, execution, substitution, trickster]
    related: [law_execution_container_invites_place_swap, arc_trickster, moral_trickster_wins]
    examples: [the_little_peasant]

  atu_1689a:
    name: The Turnip
    description: |
      Tale-type: a poor former soldier becomes a farmer and grows an
      enormous turnip, presents it to the king, and receives wealth.
      His rich brother imitates the gift-exchange with costly goods
      and receives only the turnip, then tries to murder the poor
      brother, who escapes a sack by persuading a student that it is a
      Sack of Wisdom.
    rationale: |
      First-class ATU membership keeps KHM 146 distinct from ordinary
      lucky-gift tales and from the separate sack-substitution episode
      ATU 1737. Its local grammar combines discharged soldier poverty,
      agrarian marvel, royal revaluation of humble excess, envious
      counter-gift, sibling murder plot, hanging-sack captivity, and
      comic academic ambition. The node supports comparative queries
      over giant-crop gift tales and over variants where the hero's
      second survival depends on converting captivity into advertised
      knowledge.
    tier: structural
    scope: tale
    lens: atu
    domains: [turnip, agriculture, soldier, envy, sack, wisdom, schwank]
    related: [arc_discharged_soldier, law_marvel_gift_revalues_humble_crop, law_execution_container_invites_place_swap, obj_giant_turnip, moral_trickster_wins]
    examples: [the_turnip]

  atu_1791:
    name: Parson Frightened by Supposed Devil
    description: |
      Tale-type episode in which a mundane figure is mistaken for the
      devil or another supernatural being, causing a cleric or witness
      to flee in comic fear.
    rationale: |
      Distinct from `law_fearlessness_defeats_supernatural`, where a
      real supernatural threat loses power before a fearless hero. In
      this episode there is no devil; Catherine's half-naked or
      disorderly appearance in the turnip field is enough for a man
      and the pastor to interpret her as infernal. The type enables
      queries over comic false-devil sightings and clerical panic.
    tier: structural
    scope: tale
    lens: atu
    domains: [devil, misrecognition, clergy, field, comedy]
    related: [being_devil, affect_fear, moral_comic_inversion, loc_field]
    examples: [frederick_and_catherine]

  atu_800:
    name: The Tailor in Heaven
    description: |
      Tale-type: a poor tailor gains entry into heaven by pity while
      God is absent, violates Saint Peter's instruction to sit quietly,
      climbs onto God's seat, sees a woman stealing cloth on earth, and
      throws a golden footstool down at her. God returns, exposes the
      act, and expels the tailor for assuming divine judgment.
    rationale: |
      First-class ATU membership distinguishes this religious comic
      tale from generic sinner-in-heaven stories. Its core is sacred
      jurisdiction: admission by mercy, curiosity toward divine
      omniscience, impulsive punitive judgment, and expulsion under the
      rule that only the Lord punishes in heaven. KHM 35 needs the type
      for comparative queries over heavenly satire, mercy, and improper
      judgment.
    tier: structural
    scope: tale
    lens: atu
    domains: [heaven, tailor, judgment, mercy, religious-comedy]
    related: [law_divine_punishment_reserved, moral_mercy_over_judgment, being_divine, loc_heaven]
    examples: [the_tailor_in_heaven]

  atu_801:
    name: Master Pfriem
    description: |
      Tale-type: an incorrigible faultfinder dreams that he has died
      and entered heaven. Saint Peter warns him not to criticize
      anything there, but he silently judges heavenly labours until an
      apparently backward harnessing of winged horses makes him burst
      out. He is expelled from heaven and wakes still inclined to
      correct earthly household work.
    rationale: |
      First-class ATU membership separates this religious comic
      faultfinder tale from ATU 800, where a sinner wrongly assumes
      divine punishment, and from ATU 802, where Saint Peter explains
      heavenly class paradox. Master Pfriem's grammar is habitual
      criticism: earthly faultfinding, dream-death, conditional
      admission, heavenly apparent absurdities, failed restraint,
      expulsion, and waking non-reform. The node supports comparative
      queries over heavenly satire, prideful craft judgment, hidden
      sacred order, and comic inability to learn.
    tier: structural
    scope: tale
    lens: atu
    domains: [heaven, criticism, pride, craft, religious-comedy]
    related: [law_heavenly_appearances_exceed_faultfinding_judgment, moral_comic_inversion, being_divine, loc_heaven, affect_pride]
    examples: [master_pfriem]

  atu_802:
    name: The Peasant in Heaven
    description: |
      Tale-type: a poor pious peasant and a very rich lord arrive at
      heaven together. Saint Peter admits the rich man first, and
      heaven receives him with music and rejoicing. When the peasant
      enters quietly and complains that heaven seems as partial as
      earth, Saint Peter explains that the peasant is equally dear and
      will enjoy the same delights, but poor people enter heaven every
      day while a rich man arrives only once in a hundred years.
    rationale: |
      First-class ATU membership separates this compact religious
      joke from sinner-in-heaven stories such as ATU 800 and from
      heavenly tall tales such as ATU 1960. Its grammar is not
      unauthorized judgment, trick entry, or comic travel to heaven,
      but an afterlife class paradox: apparent honor for earthly rank
      is reinterpreted as celebration of rare salvation. The node
      supports queries over heavenly equality, rich/poor contrast,
      Saint Peter as gatekeeper, and religious-comic reversal.
    tier: structural
    scope: tale
    lens: atu
    domains: [heaven, class, rich-poor, salvation, religious-comedy]
    related: [law_heavenly_rejoicing_marks_rare_rich_salvation, moral_heavenly_equality, being_divine, loc_heaven, agency_music]
    examples: [the_peasant_in_heaven]

  atu_562:
    name: The Blue Light
    description: |
      Tale-type: a discarded soldier is denied wages, works for a witch,
      retrieves a blue never-extinguished light from a well, is betrayed
      and abandoned below, then discovers that lighting his pipe from
      the blue light summons a bound black mannikin. The servitor
      punishes the witch, abducts the princess for night labour, rescues
      the soldier from execution, and forces the king to yield kingdom
      and bride.
    rationale: |
      First-class ATU membership separates this soldier-and-servitor
      tale from devil-service and formula-object tales. Its grammar is:
      unjust military dismissal, witch labour-contract, well descent and
      betrayal, blue-light acquisition, smoke-summoned helper, coercive
      nocturnal revenge on the princess, failed royal detection, prison
      recovery of the object, and execution-scene reversal. KHM 116
      needs the type for queries over demobilized soldiers, blue flames,
      bound helpers, and violent redistribution of royal power.
    tier: structural
    scope: tale
    lens: atu
    domains: [soldier, blue-light, witch, servitor, revenge, kingship]
    related: [arc_discharged_soldier, law_blue_light_pipe_summons_bound_servitor, obj_blue_summoning_light, being_dwarf, moral_trickster_wins]
    examples: [the_blue_light]

  atu_563:
    name: The Wishing-Table, the Gold-Ass, and the Cudgel in the Sack
    description: |
      Tale-type: three brothers are wrongly driven from home, each
      learns a trade and receives a magic gift: a self-spreading table,
      a gold-producing ass, and a self-acting cudgel. A thieving
      innkeeper substitutes ordinary versions for the first two gifts,
      but the third brother uses the cudgel to recover them, restoring
      the family to abundance.
    rationale: |
      First-class ATU membership distinguishes this wonder-gift cycle
      from generic magic-object tales. Its structure is tripartite:
      false accusation and exile, three craft apprenticeships, two
      stolen abundance gifts, and a punitive third gift that restores
      the first two. KHM 36 needs the type for comparative queries over
      formula-activated objects, sibling trade-gifts, and retributive
      recovery from hospitality theft.
    tier: structural
    scope: tale
    lens: atu
    domains: [magic-object, siblings, trade, hospitality-theft, restoration]
    related: [law_formula_commands_magic_objects, obj_wishing_table, obj_gold_dropping_ass, obj_cudgel_in_sack, moral_retributive, moral_restorative]
    examples: [the_wishing_table_the_gold_ass_and_the_cudgel_in_the_sack]

  atu_569:
    name: The Knapsack, the Hat, and the Horn
    description: |
      Tale-type: poor brothers seek fortune; the elder brothers accept
      silver and gold, while the youngest rejects treasure and gains a
      wishing-cloth, a soldier-summoning knapsack, an artillery hat,
      and a horn that destroys fortifications. By reclaiming the cloth
      after each exchange and using the objects militarily, he defeats
      kin, royal troops, king, and treacherous princess, finally making
      himself ruler.
    rationale: |
      First-class ATU membership separates this magic-object conquest
      tale from ATU 563's restorative household abundance gifts. Both
      use formula objects and threefold acquisition, but KHM 54 is not
      about recovering stolen property from an innkeeper; it escalates
      from hunger to coercive exchange, militarized object command,
      forced marriage, spousal theft, siege destruction, and self-made
      sovereignty. The node supports queries over magical armaments and
      force-based kingship.
    tier: structural
    scope: tale
    lens: atu
    domains: [magic-object, soldiers, artillery, horn, sovereignty, conquest]
    related: [obj_abundance_cloth, obj_summoning_knapsack, obj_artillery_hat, obj_siege_horn, law_coercive_retrieval_voids_exchange, law_militarized_objects_create_sovereignty]
    examples: [the_knapsack_the_hat_and_the_horn]

  atu_700:
    name: Thumbling / Tom Thumb
    description: |
      Tale-type: a child or tailor's son no larger than a thumb proves
      clever and mobile despite tiny size. He goes or is carried into
      the world, uses keyholes, cracks, animal bodies, and hidden voice
      as routes of agency, tricks larger humans, survives passage
      through animal or food interiors, and returns safely to his
      parents.
    rationale: |
      First-class ATU membership distinguishes the small-hero cycle
      from generic trickster or child-exposure tales. Its core is
      scale-based agency: miniature body plus loud, hidden speech lets
      the hero occupy impossible spaces and turn larger humans and
      animals into unwitting vehicles. KHM 37 and KHM 45 need the type
      for comparative queries over Tom Thumb / Thumbling variants,
      swallowed-but-alive episodes, tiny-body mobility, and travel
      episodes where miniature scale turns danger into opportunity.
    tier: structural
    scope: tale
    lens: atu
    domains: [smallness, child, trickster, devouring, return-home]
    related: [arc_tiny_hero, law_tiny_body_enables_hidden_agency, state_devoured_but_alive, moral_trickster_wins, moral_restorative]
    examples: [thumbling, thumbling_as_journeyman]

  atu_1640:
    name: The Brave Little Tailor
    description: |
      Tale-type: a small tailor turns the boast "seven at one stroke"
      into heroic reputation, outwits giants and dangerous beasts, wins
      royal reward, and survives exposure of his low trade.
    rationale: |
      First-class ATU membership distinguishes KHM 20 from generic
      trickster tales: its core is reputation inflation from an
      ambiguous boast plus serial strength-tests solved by cunning.
      The type connects tailor-hero, giant-duping, animal capture, and
      social ascent into one queryable pattern.
    tier: structural
    scope: tale
    lens: atu
    domains: [tailor, boast, giant, trickster, social-ascent]
    related: [arc_trickster, law_boast_generates_reputation, speech_boast, obj_boast_girdle, being_giant]
    examples: [the_brave_little_tailor]

  atu_510a:
    name: Cinderella
    description: |
      Tale-type: an oppressed stepdaughter is degraded to ash and
      domestic labour, receives supernatural or dead-mother aid, attends
      a royal festival in splendid garments, is recognised by a shoe
      test, and her false sisters are exposed and punished.
    rationale: |
      First-class ATU membership connects Cinderella to the persecuted-
      heroine / recognition-shoe cycle without reducing it to generic
      stepmother cruelty. Its distinctive grammar is ash-lowering,
      grave/tree/bird aid, three festival appearances, slipper
      recognition, false-bride blood exposure, and punitive blindness.
    tier: structural
    scope: tale
    lens: atu
    domains: [oppressed-maiden, stepfamily, birds, shoe, recognition]
    related: [arc_oppressed_maiden, arc_cruel_stepmother, arc_false_bride, law_grave_tree_channels_maternal_aid, law_true_fit_reveals_identity, obj_recognition_shoe]
    examples: [cinderella]

  atu_325:
    name: The Magician and His Pupil
    description: |
      Tale-type: a child or apprentice is sent to learn from a magical
      master; recognition or payment conditions bind the apprenticeship.
      After the pupil escapes or is recovered, he uses learned
      shapeshifting for profit, is recaptured or nearly trapped by the
      master, and finally defeats the master in a transformation chase
      or duel.
    rationale: |
      First-class ATU membership separates KHM 68 from ordinary thief
      or trickster tales. Its core is not stealing goods but learning
      the master's magical technique and surpassing him: recognition of
      the transformed pupil, sale as dog/horse, bridle-restraint, and
      sparrow-fish-cock-fox duel. The node enables queries over
      sorcerer-apprentice plots and competitive metamorphosis.
    tier: structural
    scope: tale
    lens: atu
    domains: [apprenticeship, magic, shapeshifting, mastery, trickster]
    related: [law_shapeshift_duel_resolves_mastery, transform_shapeshift_duel, obj_form_binding_bridle, being_wizard]
    examples: [the_thief_and_his_master]

  atu_510b:
    name: All-Kinds-of-Fur / Donkeyskin
    description: |
      Tale-type: a king or father attempts an unnatural marriage with
      his daughter; she demands impossible garments or skins, flees in
      an animal-like disguise when the gifts are obtained, lives
      concealed in low service, appears at royal festivals in splendid
      dress, and is finally recognised through tokens or a partial
      unveiling before marrying another king or prince.
    rationale: |
      First-class ATU membership separates All-Kinds-of-Fur from ATU
      510A Cinderella. Both use ash, domestic labour, festival
      appearances, and hidden identity, but 510B begins with
      incestuous forced-marriage danger and animal-skin disguise rather
      than stepfamily persecution and shoe-fit recognition. KHM 65
      needs the type for queries over Donkeyskin/Catskin variants,
      taboo father-desire, impossible bride-gifts, and fur-disguised
      flight.
    tier: structural
    scope: tale
    lens: atu
    domains: [incest-taboo, disguise, bride-gift, flight, recognition]
    related: [arc_taboo_desiring_father, obj_fur_disguise_mantle, obj_celestial_dresses, law_kitchen_tokens_reveal_hidden_bride, atu_510a]
    examples: [allerleirauh]

  atu_511:
    name: One-Eye, Two-Eyes, and Three-Eyes
    description: |
      Tale-type: a persecuted girl is despised because her ordinary
      body differs from her family's monstrous or marvellous bodies;
      a supernatural helper gives her a formulaic food source through
      an animal, envious kin discover and destroy it, and the helper's
      remains become a miraculous tree that recognizes only the
      rightful heroine.
    rationale: |
      First-class ATU membership separates KHM 130 from Cinderella
      even though both center an oppressed maiden, envious female kin,
      a wondrous tree, and marriage rescue. ATU 511's core is bodily
      normality as stigma, the one/two/three-eye surveillance pattern,
      a formula-goat abundance table, the slaughtered helper's buried
      entrails, and a golden-fruit tree that follows its owner. It
      supports queries over persecuted normality, magical livestock,
      and rightful-property recognition without flattening the tale
      into 510A shoe/festival recognition.
    tier: structural
    scope: tale
    lens: atu
    domains: [oppressed-maiden, sibling-envy, goat, formula, tree, recognition]
    related: [arc_oppressed_maiden, arc_envious_kin_persecutor, sp_goat, law_sacrificed_helper_body_becomes_rightful_tree, atu_510a]
    examples: [one_eye_two_eyes_three_eyes]

  atu_1965:
    name: Knoist and His Three Sons
    description: |
      Tale-type: a brief nonsense catalogue follows a father and three
      sons marked by contradictory bodily conditions through impossible
      actions and spaces: a blind hunter shoots a hare, a lame one
      catches it, a naked one pockets it, a bottomless boat carries
      them, and a chapel with wooden clergy appears inside a tree.
    rationale: |
      First-class ATU membership keeps KHM 138 separate from ordinary
      fool schwanks, tall tales with material proof, and formulaic
      dialogue nonsense. Its structure is not deception, error, or
      marvel quest but bare contradiction stated as fact. The node
      supports comparative queries over impossibility catalogues,
      bodily contradiction, bottomless vessels, nested sacred spaces,
      and punchline verse in nonsense tales.
    tier: structural
    scope: tale
    lens: atu
    domains: [nonsense, impossibility, body, boat, chapel, verse]
    related: [law_nonsense_catalogue_suspends_causality, state_blind, state_maimed, being_animated_object, num_3]
    examples: [knoist_and_his_three_sons]

  atu_1930:
    name: Cockaigne and Wonder-Lie Catalogues
    description: |
      Tale-type: a first-person speaker lists impossible sights in a
      named nonsense land or regional wonder-tale: Rome hanging by a
      thread, footless runners, roasted birds flying, disabled hunters
      catching hares, ploughs or ships moving where they cannot, animals
      doing human work, and a closing admission that the story is made
      of lies.
    rationale: |
      First-class ATU membership keeps KHM 158 and KHM 159 distinct
      from ordinary tall tales with proof-objects and from formulaic
      household nonsense. Their structure is a pure catalogue of
      inverted causal order: disabled bodies outperform animals,
      animals perform labour and violence beyond their kind, food or
      tools behave impossibly, geography reverses itself, and the
      narrator openly frames the whole as lies. The node supports
      comparative queries over Cockaigne traditions, regional wonder
      lies, impossible abundance, animal-role inversion, and nonsense
      enumerations.
    tier: structural
    scope: tale
    lens: atu
    domains: [cockaigne, nonsense, impossibility, abundance, animals, lies]
    related: [law_nonsense_catalogue_suspends_causality, moral_comic_inversion, speech_lie, num_2, num_100]
    examples: [the_story_of_schlauraffen_land, the_ditmarsh_tale_of_wonders]

  atu_1940:
    name: Domestic Servants
    description: |
      Tale-type: a cumulative dialogue asks where a traveller is going
      and then gathers named household relations or servants into a
      repeated formula. Each answer supplies a new comic name, and the
      refrain repeats the whole chain as shared movement toward the
      same destination.
    rationale: |
      First-class ATU membership separates KHM 140 from plot-driven
      servant tales, fool schwanks, and contradiction catalogues such as
      KHM 138. Its structure is oral-formulaic rather than causal:
      destination, husband, child, cradle, and drudge are added by
      question-and-answer, and the pleasure comes from accumulated
      names and repeated cadence. The node supports comparative queries
      over cumulative formula tales, household-name chains, servant
      nonsense, and travel refrains.
    tier: structural
    scope: tale
    lens: atu
    domains: [formula, cumulative, household, servants, naming, nonsense]
    related: [law_formulaic_name_chain_accumulates_household, agency_speech, agency_domestic_labor, moral_comic_inversion]
    examples: [domestic_servants]

  atu_2019:
    name: Fair Katrinelje and Pif Paf Poltrie
    description: |
      Tale-type: a comic suitor seeks permission to marry by visiting
      each member of a household in a repeated formula of greeting,
      request, conditional consent, and location question, until the
      bride agrees and the exchange ends with dowry and trade banter.
    rationale: |
      First-class ATU membership preserves the tale as an oral-formula
      courtship piece rather than treating it as a reduced marriage
      plot. Its identity lies in iteration, name-play, domestic
      stationing, comic accounting, and the punchline that the suitor's
      "something better" trade is broom-making. KHM 131 needs the type
      for queries over cumulative/dialogic nonsense tales and
      formulaic wooing.
    tier: structural
    scope: tale
    lens: atu
    domains: [courtship, formula, nonsense, dialogue, household, trade]
    related: [law_formulaic_consent_circulates_through_household, agency_speech, moral_comic_inversion]
    examples: [fair_katrinelje_and_pif_paf_poltrie]

  atu_47a:
    name: The Fox and the Horse
    description: |
      Tale-type: an old service horse is expelled because it can no
      longer work; a fox helps by making the horse feign death, luring
      a lion as if to carrion, tying predator and horse together, and
      proving the horse's strength by having it drag the lion home.
    rationale: |
      First-class ATU membership separates this from general fox
      trickster episodes and from discarded-dog rescue tales. Its core
      is old service, conditional maintenance, feigned carcass,
      predator appetite, tail-binding, and restored feeding until
      death. KHM 132 needs the type for queries over animal service,
      aged livestock, fox-mediated rescue, and proof-of-worth tests.
    tier: structural
    scope: tale
    lens: atu
    domains: [horse, fox, lion, service, old-age, trickery]
    related: [arc_discarded_service_animal, law_feigned_carcass_traps_predator_for_restored_service, sp_horse, sp_fox, sp_lion]
    examples: [the_fox_and_the_horse]

  atu_851:
    name: The Riddle
    description: |
      Tale-type: a prince survives a witch/robber episode whose hidden
      causal chain becomes a riddle; a proud princess attempts to learn
      the answer by night spying, but her mantle proves the theft and
      turns into the wedding garment.
    rationale: |
      First-class ATU membership links riddle-marriage tales where the
      answer is private adventure-knowledge rather than abstract
      cleverness. KHM 22's type combines poison-chain, faithful servant
      substitution, three nocturnal spying attempts, proof-mantles, and
      marriage by exposed answer-theft.
    tier: structural
    scope: tale
    lens: atu
    domains: [riddle, poison, robber, princess, proof]
    related: [speech_riddle, law_poison_transfers_through_consumption, arc_faithful_servant, arc_proud_task_princess]
    examples: [the_riddle]

  atu_2260:
    name: The Golden Key
    description: |
      Tale-type: a poor boy sent into winter snow to fetch wood clears
      a place for a warming fire, finds a tiny golden key in the ground,
      reasons that a lock must be nearby, discovers an iron chest, fits
      the key into a nearly invisible keyhole, turns it once, and the
      tale stops before the lid is opened.
    rationale: |
      First-class ATU membership preserves this tiny closing tale as an
      open-ended wonder piece rather than forcing it into treasure-
      finding or poor-child reward plots. Its grammar is winter
      hardship, wood-gathering, fire-preparation, accidental key,
      inferred lock, buried chest, exact fit, and withheld revelation.
      The node supports comparative queries over miniature tales,
      narrative suspension, unopened treasure, and listener desire as
      the final effect.
    tier: structural
    scope: tale
    lens: atu
    domains: [key, chest, treasure, winter, suspense, open-ending]
    related: [law_unopened_treasure_suspends_reader_desire, moral_open_ended_wonder, affect_curiosity, agency_object_mediation]
    examples: [the_golden_key]
