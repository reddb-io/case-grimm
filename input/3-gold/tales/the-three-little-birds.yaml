propp:
  - { function: func_initial_situation, order: 1, actor: three_birds_king,
      scene: "The hunting king sees three cowherd sisters on the mountain.",
      evidence: "three girls were watching their cows upon the mountain" }
  - { function: func_marriage, order: 2, actor: three_birds_king,
      scene: "The eldest sister marries the king and the other sisters marry his ministers.",
      evidence: "the two ministers married the two sisters" }
  - { function: func_absentation, order: 3, actor: three_birds_king,
      scene: "The king repeatedly goes away when the queen is about to bear children.",
      evidence: "the King was obliged to go from home" }
  - { function: func_villainy, order: 4, actor: three_birds_false_sisters,
      scene: "The sisters throw the first star-born boy into the water.",
      evidence: "they would throw the beautiful boy into the water" }
  - { function: func_false_claim, order: 5, actor: three_birds_false_sisters,
      scene: "The sisters tell the king that the queen delivered a dog.",
      evidence: "the Queen had been delivered of a dog" }
  - { function: func_rescue, order: 6, actor: three_birds_fisherman,
      scene: "The fisherman rescues the first boy from the water and raises him.",
      evidence: "fished the little boy out again while he was still alive" }
  - { function: func_repetition, order: 7, actor: three_birds_false_sisters,
      scene: "The sisters repeat the water-casting and animal-birth lie with the second boy and the girl.",
      evidence: "the false sisters likewise took and threw into the water" }
  - { function: func_punishment, order: 8, actor: three_birds_king,
      scene: "After the third false birth report, the king imprisons the queen for many years.",
      evidence: "ordered his wife to be cast into prison" }
  - { function: func_departure, order: 9, actor: three_birds_elder_son,
      scene: "The eldest son, mocked as a foundling, sets out to find his father.",
      evidence: "Go thy way, foundling" }
  - { function: func_departure, order: 10, actor: three_birds_second_son,
      scene: "The second son follows to seek his brother and meets the same water threshold.",
      evidence: "the second boy set out to seek his brother" }
  - { function: func_donor_test, order: 11, actor: three_birds_daughter,
      scene: "The daughter greets the old woman kindly and receives passage, wand, and instructions.",
      evidence: "May God help you with your fishing" }
  - { function: func_difficult_task, order: 12, actor: three_birds_daughter,
      scene: "The daughter must pass the dog, drop the wand, cross the castle, take the bird, and draw fountain water.",
      evidence: "you must pass it silently and boldly" }
  - { function: func_liquidation, order: 13, actor: three_birds_daughter,
      scene: "The daughter retrieves the bird and water, finds her brothers, and releases the black dog into a prince.",
      evidence: "it turned into a handsome prince" }
  - { function: func_recognition, order: 14, actor: three_birds_truth_bird,
      scene: "The truth bird sings that the three youths are the king's children and names the false sisters' crime.",
      evidence: "These are thy children all" }
  - { function: func_restoration, order: 15, actor: three_birds_daughter,
      scene: "The daughter heals the imprisoned queen with the fountain water.",
      evidence: "she became strong and healthy" }
  - { function: func_punishment, order: 16, actor: three_birds_king,
      scene: "The false sisters are burned and the daughter marries the released prince.",
      evidence: "the two false sisters were burnt" }


