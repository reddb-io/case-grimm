slug: the-three-little-birds
khm: 96
atu: '707'
atu_name: The Three Golden Children / The Bird of Truth
canonical_source: ../../2-silver/canonical/the-three-little-birds/canonical.txt
title: The Three Little Birds


entities:

  characters:

    three_birds_king:
      name: The King of the Keuterberg
      species: sp_human
      agency_modes: [agency_social_rank, agency_speech, agency_violence]
      existential_states: [state_deceived]
      speech_acts_performed: [speech_command]
      affects: [affect_anger, affect_grief]
      traits: [hunting-king, eavesdropping-bridegroom, deceived-father, queen-imprisoner, bird-truth-hearer, family-restorer]
      evidence: |
        one of them who lived on the Keuterberg was very fond of
        hunting

    three_birds_queen:
      name: The Flax-Haired Queen
      species: sp_human
      agency_modes: [agency_endurance, agency_social_rank]
      existential_states: [state_imprisoned]
      affects: [affect_maternal_love, affect_grief]
      traits: [eldest-cowherd-sister, royal-bride, threefold-mother, falsely-accused, long-imprisoned, fountain-healed]
      evidence: |
        especially the Queen, who had hair like flax.

    three_birds_false_sisters:
      name: The Two False Sisters
      archetypes: [arc_envious_kin_persecutor]
      species: sp_human
      agency_modes: [agency_cunning, agency_speech, agency_violence]
      speech_acts_performed: [speech_lie]
      affects: [affect_envy, affect_fear]
      traits: [childless-sisters, ministers-wives, infant-disposers, animal-birth-liars, terrified-by-bird-song, burnt-persecutors]
      evidence: |
        But the two sisters had no children

    three_birds_elder_son:
      name: The Eldest Star-Born Son
      archetypes: [arc_foundling_child]
      species: sp_human
      agency_modes: [agency_endurance, agency_speech, agency_object_mediation]
      affects: [affect_grief]
      traits: [red-star-birth, river-castaway, fisherman-raised, foundling-shamed, father-seeker, lost-brother]
      evidence: |
        a little boy who brought a bright red star into the world with
        him

    three_birds_second_son:
      name: The Second River-Rescued Son
      archetypes: [arc_foundling_child]
      species: sp_human
      agency_modes: [agency_endurance, agency_speech, agency_music, agency_violence]
      affects: [affect_loyalty]
      traits: [second-castaway, fisherman-raised, brother-seeker, hunter, flutist, king-encounterer]
      evidence: |
        The fisherman, however, fished this one also out of the water

    three_birds_daughter:
      name: The River-Rescued Daughter
      archetypes: [arc_foundling_child]
      species: sp_human
      agency_modes: [agency_endurance, agency_speech, agency_object_mediation]
      speech_acts_performed: [speech_command]
      affects: [affect_grief, affect_loyalty, affect_pity]
      traits: [third-castaway, brother-seeker, courteous-donor-greeter, wand-carrier, bird-and-water-retriever, dog-prince-releaser, mother-healer, prince-bride]
      evidence: |
        she mourned for her brothers so much

    three_birds_fisherman:
      name: The Old Fisherman
      archetypes: [arc_wise_helper]
      species: sp_human
      agency_modes: [agency_domestic_labor, agency_speech, agency_object_mediation]
      affects: [affect_pity]
      traits: [river-dweller, child-rescuer, adoptive-father, truth-witness]
      evidence: |
        a fisherman who dwelt near the water fished the little boy out
        again while he was still alive

    three_birds_fishermans_wife:
      name: The Fisherman's Wife
      species: sp_human
      agency_modes: [agency_domestic_labor]
      affects: [affect_maternal_love]
      traits: [childless-wife, adoptive-mother, foundling-rearer]
      evidence: |
        as his wife had no children, they reared him.

    three_birds_old_woman:
      name: The Old Woman at the Great Water
      archetypes: [arc_supernatural_donor]
      species: sp_human
      agency_modes: [agency_speech, agency_object_mediation]
      existential_states: [state_cursed]
      affects: [affect_pity]
      traits: [fishing-threshold-guardian, courtesy-tester, water-carrier, wand-giver, freed-helper]
      evidence: |
        a great piece of water by the side of which stood an old woman
        fishing

    three_birds_black_dog_prince:
      name: The Black Dog / Handsome Prince
      archetypes: [arc_enchanted_prince]
      species: sp_dog
      agency_modes: [agency_endurance]
      existential_states: [state_cursed, state_transformed]
      transformations: [transform_animal_human]
      traits: [black-dog-threshold, wand-released-prince, daughter-bridegroom]
      evidence: |
        it turned into a handsome prince

    three_birds_truth_bird:
      name: The Truth-Telling Little Bird
      species: sp_bird
      agency_modes: [agency_music, agency_speech, agency_object_mediation]
      speech_acts_performed: [speech_testimony]
      traits: [birth-witness, water-casting-singer, caged-castle-marvel, wall-hung-truth-teller, lineage-revealer]
      evidence: |
        the little bird on the wall began to sing

  magic_objects:

    obj_three_birds_red_star:
      name: The Bright Red Birth-Star
      object_kind: token
      attributes:
        bearer: three_birds_elder_son
        function: marks the first child as wondrous at birth
      evidence: |
        brought a bright red star into the world with him

    obj_three_birds_truth_bird:
      name: The Caged Bird of Truth
      instance_of: obj_truth_telling_bird
      object_kind: creature_object
      attributes:
        function: reveals the hidden lineage of the three children
      evidence: |
        a bird in a cage which you must take down

    obj_three_birds_wand:
      name: The Old Woman's Wand
      object_kind: tool
      attributes:
        function: threshold token dropped at the castle and later used to release the black dog
      evidence: |
        gave her a wand

    obj_three_birds_fountain_water:
      name: The Water from the Old Fountain
      instance_of: obj_water_of_life
      object_kind: material
      attributes:
        function: restores the imprisoned queen to strength and health
      evidence: |
        Take likewise a glass of water out of the fountain

    obj_three_birds_crossbow:
      name: The Second Son's Cross-Bow
      object_kind: weapon
      attributes:
        function: hunting object that brings the youth into the king's domain
      evidence: |
        took his cross-bow and went a-hunting

    obj_three_birds_flute:
      name: The Second Son's Flute
      object_kind: instrument
      attributes:
        function: music heard by the hunting king
      evidence: |
        took his flute, and made music

  locations:

    loc_three_birds_keuterberg:
      name: The Keuterberg
      instance_of: loc_mountain
      evidence: |
        lived on the Keuterberg

    loc_three_birds_cow_mountain:
      name: The Cowherd Mountain
      instance_of: loc_mountain
      evidence: |
        three girls were watching their cows upon the mountain

    loc_three_birds_castle:
      name: The King's Castle
      instance_of: loc_castle
      threshold_type: threshold_doorway
      evidence: |
        riding forth from his castle

    loc_three_birds_weser:
      name: The Water / Weser
      instance_of: loc_river
      evidence: |
        I believe it was into the Weser

    loc_three_birds_fisher_house:
      name: The Fisherman's House
      instance_of: loc_house
      evidence: |
        went to the old fisherman

    loc_three_birds_great_water:
      name: The Great Piece of Water
      instance_of: loc_river
      evidence: |
        he came to a great piece of water

    loc_three_birds_black_dog_road:
      name: The Road of the Black Dog
      instance_of: loc_road
      evidence: |
        a great black dog

    loc_three_birds_high_castle:
      name: The Great High Castle
      instance_of: loc_castle
      threshold_type: threshold_doorway
      evidence: |
        Then you will come to a great high castle

    loc_three_birds_old_fountain:
      name: The Old Fountain and Tree
      instance_of: loc_well
      threshold_type: threshold_well
      evidence: |
        an old fountain out of which a large tree has grown

    loc_three_birds_prison:
      name: The Queen's Prison
      instance_of: loc_dungeon
      evidence: |
        ordered his wife to be cast into prison


