propp:

  - function: func_lack
    order: 1
    actor: four_skilful_poor_father
    scene: "the poor father has nothing to give his four sons and sends them to learn trades"
    evidence: "I have nothing to give you"

  - function: func_departure
    order: 2
    actor: four_skilful_brothers
    scene: "the four brothers depart together and separate at a four-way crossroads"
    evidence: "Here we must separate"

  - function: func_magical_agent
    order: 3
    actor: four_skilful_astronomer_master
    beneficiary: four_skilful_astronomer
    scene: "the astronomer receives a telescope that reveals all distant things"
    evidence: "nothing can remain concealed from thee"

  - function: func_magical_agent
    order: 4
    actor: four_skilful_huntsman_master
    beneficiary: four_skilful_huntsman
    scene: "the huntsman receives a gun that never misses"
    evidence: "whatsoever you aim at, you are certain to hit"

  - function: func_magical_agent
    order: 5
    actor: four_skilful_tailor_master
    beneficiary: four_skilful_tailor
    scene: "the tailor receives a needle that sews anything seamlessly"
    evidence: "no seam will be visible"

  - function: func_return
    order: 6
    actor: four_skilful_brothers
    scene: "after four years the brothers return together to their father"
    evidence: "When the appointed four years were over"

  - function: func_difficult_task
    order: 7
    actor: four_skilful_poor_father
    scene: "the father tests the four crafts on the chaffinch nest and five eggs"
    evidence: "I will put you all to the test"

  - function: func_villainy
    order: 8
    actor: four_skilful_dragon
    victim: four_skilful_princess
    scene: "a dragon carries off the king's daughter"
    evidence: "the King’s daughter was carried off by a dragon"

  - function: func_difficult_task
    order: 9
    actor: four_skilful_brothers
    scene: "the four brothers combine far-sight, theft, marksmanship, and sewing to rescue the princess"
    evidence: "This would be a fine opportunity for us to show what we can do"

  - function: func_victory
    order: 10
    actor: four_skilful_huntsman
    victim: four_skilful_dragon
    scene: "the huntsman shoots the pursuing dragon to the heart"
    evidence: "shot him to the heart"

  - function: func_rescue
    order: 11
    actor: four_skilful_tailor
    scene: "the tailor sews the planks and ship fragments back into a seaworthy vessel"
    evidence: "the ship was once more seaworthy"

  - function: func_recognition
    order: 12
    actor: four_skilful_king
    scene: "the king judges that each brother has an equal right"
    evidence: "Each of you has an equal right"

  - function: func_reward
    order: 13
    actor: four_skilful_king
    scene: "instead of marrying one brother to the princess, the king gives each half a kingdom"
    evidence: "I will give to each of you, as a reward, half a kingdom"


