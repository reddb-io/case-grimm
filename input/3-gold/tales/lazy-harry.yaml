propp:

  - function: func_lack
    order: 1
    actor: lazy_harry
    scene: Harry treats driving one goat to pasture as an intolerable burden.
    evidence: |
      Harry was lazy, and although he had nothing else to do but drive his goat daily to pasture

  - function: func_plan
    order: 2
    actor: lazy_harry
    scene: Harry decides to marry Trina so she can take his goat out with hers.
    evidence: |
      I will marry fat Trina who has also a goat

  - function: func_marriage
    order: 3
    actor: lazy_harry_trina_parents
    beneficiary: lazy_harry
    scene: Trina's parents consent to the marriage because like goes with like.
    evidence: |
      Birds of a feather, flock together

  - function: func_labor_transfer
    order: 4
    actor: lazy_harry_trina
    scene: Trina leads out both goats while Harry enjoys having no work.
    evidence: |
      led out both the goats

  - function: func_exchange
    order: 5
    actor: lazy_harry_trina
    scene: Trina proposes exchanging the two goats for a beehive that will work without care.
    evidence: |
      give the two goats which disturb us every morning in our sweetest sleep

  - function: func_passive_yield
    order: 6
    actor: lazy_harry_bees
    beneficiary: lazy_harry
    scene: The bees work tirelessly and fill the hive with honey.
    evidence: |
      filled the hive with the most beautiful honey

  - function: func_hypothetical_care
    order: 7
    actor: lazy_harry_trina
    scene: Trina refuses the goose exchange until they have a child to care for the geese.
    evidence: |
      not before we have a child to take care of them

  - function: func_accidental_loss
    order: 8
    actor: lazy_harry_trina
    scene: While demonstrating punishment for the imagined child, Trina hits and breaks the honey pitcher.
    evidence: |
      unhappily hit the honey-pitcher above the bed

  - function: func_comic_acceptance
    order: 9
    actor: lazy_harry
    scene: Harry treats the lost honey, goose, and gosling as no longer needing care.
    evidence: |
      There lie the goose and the young gosling

  - function: func_closing_maxim
    order: 10
    actor: lazy_harry_trina
    scene: Trina closes with the snail proverb that speed does no good.
    evidence: |
      Speed does no good.


edges:

  - from: lazy_harry
