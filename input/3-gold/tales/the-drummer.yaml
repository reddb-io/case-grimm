  - { from: drummer_king_daughter, to: obj_drummer_celestial_dresses, label: WISHES_MOON_DRESS,
      evidence: "A dress as silvery as the moon" }
  - { from: drummer_king_daughter, to: obj_drummer_celestial_dresses, label: WISHES_STAR_DRESS,
      evidence: "A dress glittering like the stars" }
  - { from: drummer_drummer, to: obj_drummer_sleeping_draught, label: AVOIDS_THIRD_DRAUGHT,
      evidence: "poured it behind the bed" }
  - { from: drummer_king_daughter, to: law_voice_recognizes_forgotten_bride, label: RESTORES_MEMORY_BY_VOICE,
