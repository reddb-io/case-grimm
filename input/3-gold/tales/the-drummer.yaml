      evidence: "Give me back my dress" }
  - { from: drummer_king_daughter, to: loc_drummer_glass_mountain, label: IMPRISONED_ON,
      evidence: "am shut up on the glass-mountain" }
  - { from: obj_drummer_white_linen_dress, to: drummer_king_daughter, label: ENABLES_FLIGHT,
      evidence: "I cannot fly back again without my dress" }
  - { from: drummer_drummer, to: loc_drummer_great_forest, label: ENTERS_WITHOUT_FEAR,
      evidence: "went without fear straight into the forest" }
  - { from: drummer_drummer, to: obj_drummer_drum, label: BEATS_REVEILLE,
      evidence: "beat such a reveille" }
