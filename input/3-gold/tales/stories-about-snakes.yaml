  - { from: law_serpent_treasure_requires_reciprocal_respect, to: stories_snakes_crown_snake, label: BREAKS_EXCHANGE_FOR,
      evidence: "when it no longer saw the crown" }
  - { from: stories_snakes_crown_snake, to: loc_stories_snakes_crown_hole, label: DIES_AGAINST_WALL_NEAR,
