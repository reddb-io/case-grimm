  - { from: stories_snakes_first_child, to: loc_stories_snakes_yard, label: EATS_IN,
      evidence: "seated herself in the yard" }
  - { from: stories_snakes_first_snake, to: loc_stories_snakes_wall_crevice, label: COMES_FROM,
      evidence: "came creeping out of a crevice in the wall" }
  - { from: stories_snakes_first_snake, to: obj_stories_snakes_milk_bread_bowl, label: SHARES,
      evidence: "dipped its little head in the dish" }
  - { from: stories_snakes_first_child, to: stories_snakes_first_snake, label: CALLS_TO_FOOD,
      evidence: "Snake, snake, come swiftly" }
  - { from: stories_snakes_first_snake, to: obj_stories_snake_treasures, label: BRINGS_IN_GRATITUDE,
      evidence: "brought the child all kinds of pretty things" }
  - { from: stories_snakes_first_child, to: obj_stories_snakes_spoon, label: STRIKES_GENTLY_WITH,
      evidence: "struck the snake gently on its head" }
  - { from: stories_snakes_mother, to: obj_stories_snakes_log, label: USES_TO_KILL,
      evidence: "ran out with a log of wood" }
  - { from: stories_snakes_mother, to: stories_snakes_first_snake, label: KILLS,
      evidence: "killed the good little creature" }
  - { from: law_house_snake_feeding_sustains_child_vitality, to: stories_snakes_first_child, label: WITHDRAWS_VITALITY_FROM,
      evidence: "now she lost her pretty rosy cheeks and wasted away" }
  - { from: stories_snakes_funeral_birds, to: stories_snakes_first_child, label: ANNOUNCE_FUNERAL_FOR,
      evidence: "redbreast to collect little branches and leaves for a funeral garland" }
  - { from: stories_snakes_first_child, to: loc_stories_snakes_child_bier, label: LIES_ON,
      evidence: "the child lay on her bier" }

  # Second story: crown and broken reciprocity
  - { from: stories_snakes_orphan, to: loc_stories_snakes_town_walls, label: SPINS_ON,
      evidence: "sitting on the town walls spinning" }
  - { from: stories_snakes_crown_snake, to: loc_stories_snakes_crown_hole, label: COMES_FROM,
      evidence: "coming out of a hole low down in the wall" }
  - { from: stories_snakes_orphan, to: obj_stories_snakes_silk_handkerchief, label: SPREADS,
