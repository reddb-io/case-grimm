  - { from: stories_snakes_crown_snake, to: obj_stories_snakes_silk_handkerchief, label: LAYS_CROWN_ON,
      evidence: "laid it on the handkerchief" }
  - { from: stories_snakes_orphan, to: obj_stories_snake_crown, label: TAKES,
