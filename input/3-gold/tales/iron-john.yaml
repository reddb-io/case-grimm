propp:

  - function: func_initial_situation
    order: 1
    actor: iron_john_father_king
    scene: "the king's forest becomes dangerous after huntsmen and hounds disappear"
    evidence: "no one would any longer venture into the forest"

  - function: func_capture
    order: 2
    actor: iron_john_strange_huntsman
    victim: iron_john_wild_man
    scene: "the strange huntsman drains the deep pool and captures the rusty wild man"
    evidence: "bale out the water"

  - function: func_interdiction
    order: 3
    actor: iron_john_father_king
    scene: "the king cages Iron John and forbids the door to be opened on pain of death"
    evidence: "forbade the door to be opened on pain of death"

  - function: func_violation
    order: 4
    actor: iron_john_prince
    scene: "the prince steals the key from under his mother's pillow and releases Iron John to recover the golden ball"
    evidence: "The door opened with difficulty"

  - function: func_abduction
    order: 5
    actor: iron_john_wild_man
    beneficiary: iron_john_prince
    scene: "Iron John carries the frightened boy into the forest to protect him after the release"
    evidence: "set him on his shoulder"

  - function: func_donor_sequence
    order: 6
    actor: iron_john_wild_man
    beneficiary: iron_john_prince
    scene: "Iron John tests the boy as guardian of the gold well across three contacts"
    evidence: "take care that nothing falls into it"

  - function: func_branding
    order: 7
    actor: loc_iron_john_golden_well
    beneficiary: iron_john_prince
    scene: "finger, hair, and then the whole head are gilded, leaving the prince with hidden golden hair"
    evidence: "the whole of the hair of his head was already golden"

  - function: func_exile
    order: 8
    actor: iron_john_wild_man
    beneficiary: iron_john_prince
    scene: "after the failed trial, Iron John sends the prince into the world to learn poverty but grants future help"
    evidence: "there thou wilt learn what poverty is"

  - function: func_unrecognized_service
    order: 9
    actor: iron_john_prince
    scene: "the prince serves first in the kitchen and then as the gardener's boy while hiding his golden hair"
    evidence: "exchanged him for the gardener’s boy"

  - function: func_recognition_attempt
    order: 10
    actor: iron_john_princess
    beneficiary: iron_john_prince
    scene: "the princess glimpses his shining hair, demands flowers, pulls off his cap, and gives ducats"
    evidence: "his golden hair rolled down on his shoulders"

  - function: func_helper_intervention
    order: 11
    actor: iron_john_wild_man
    beneficiary: iron_john_prince
    scene: "Iron John supplies a strong horse and iron soldiers for war"
    evidence: "a great troop of soldiers entirely equipped in iron"

  - function: func_victory
    order: 12
    actor: iron_john_prince
    victim: iron_john_enemy_army
    scene: "the hidden prince defeats the enemy army and returns the horse and troops to Iron John"
    evidence: "there was not a single man left"

  - function: func_difficult_task
    order: 13
    actor: iron_john_second_king
    scene: "the king proclaims a three-day feast where the princess will throw a golden apple to find the unknown knight"
    evidence: "thou shalt throw a golden apple"

  - function: func_helper_intervention
    order: 14
    actor: iron_john_wild_man
    beneficiary: iron_john_prince
    scene: "Iron John equips the prince in red, white, and black armour for the three apple-catching days"
    evidence: "Iron John equipped him as a white knight"

  - function: func_branding
    order: 15
    actor: iron_john_king_attendants
    beneficiary: iron_john_prince
    scene: "on the third day the pursuing attendants wound his leg and see the golden hair"
    evidence: "wounded the youth’s leg"

  - function: func_recognition
    order: 16
    actor: iron_john_second_king
    beneficiary: iron_john_prince
    scene: "golden hair, three apples, and the wound prove that the gardener's boy is the victorious knight"
    evidence: "Art thou the knight who came every day to the festival"

  - function: func_wedding
    order: 17
    actor: iron_john_prince
    beneficiary: iron_john_princess
    scene: "the prince asks for the king's daughter, she recognizes his worth, and the wedding is celebrated"
    evidence: "Give me your daughter to wife"

  - function: func_disenchantment
    order: 18
    actor: iron_john_wild_man
    scene: "Iron John appears as a stately king, reveals that the prince freed him from enchantment, and gives him treasure"
    evidence: "was by enchantment a wild man"


