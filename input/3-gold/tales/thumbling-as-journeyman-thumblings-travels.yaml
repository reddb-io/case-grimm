      evidence: "serve as picklock to us." }
  - { from: thumbling_journeyman, to: loc_thumbling_journeyman_treasure_chamber, label: ENTERS_THROUGH_CRACK,
      evidence: "got safely through the crevice into the treasure-chamber" }
  - { from: thumbling_journeyman, to: obj_thumbling_journeyman_thalers, label: THROWS_OUT,
