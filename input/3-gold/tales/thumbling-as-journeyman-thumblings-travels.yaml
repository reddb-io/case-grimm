  - { from: thumbling_journeyman, to: obj_thumbling_journeyman_black_pudding, label: ESCAPES_FROM,
      evidence: "cleared a passage for himself, and jumped out." }

  # Fox bargain and return home
  - { from: thumbling_journeyman, to: loc_thumbling_journeyman_open_country, label: TRAVELS_THROUGH,
      evidence: "In the open country he met with a fox" }
  - { from: thumbling_journeyman_fox, to: thumbling_journeyman, label: SNAPS_UP,
      evidence: "snapped him up in a fit of absence." }
  - { from: thumbling_journeyman, to: obj_thumbling_journeyman_fox_throat, label: STICKS_IN,
      evidence: "it is I who am sticking in your throat" }
  - { from: thumbling_journeyman, to: thumbling_journeyman_fox, label: PROMISES_FOWLS_TO,
      evidence: "Thou shalt have all the cocks and hens" }
  - { from: thumbling_journeyman_fox, to: thumbling_journeyman, label: RELEASES,
      evidence: "Then the fox let him go again" }
  - { from: thumbling_journeyman_fox, to: loc_thumbling_journeyman_tailor_home, label: CARRIES_HOME,
      evidence: "himself carried him home." }
  - { from: thumbling_journeyman_father, to: thumbling_journeyman_fox, label: GIVES_FOWLS_TO,
      evidence: "willingly gave the fox all the fowls" }
  - { from: thumbling_journeyman, to: thumbling_journeyman_father, label: GIVES_KREUZER_TO,
      evidence: "gave his father the kreuzer which he earned on his travels." }
  - { from: thumbling_journeyman, to: moral_restorative, label: RETURNS_HOME_UNHARMED,
