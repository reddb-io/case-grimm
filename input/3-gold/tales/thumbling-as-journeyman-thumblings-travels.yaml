  # Departure from home and first household
  - { from: thumbling_journeyman, to: loc_thumbling_journeyman_tailor_home, label: BORN_IN,
      evidence: "A certain tailor had a son" }
  - { from: thumbling_journeyman, to: arc_tiny_hero, label: EMBODIES,
      evidence: "no bigger than a Thumb" }
  - { from: thumbling_journeyman, to: loc_thumbling_journeyman_road, label: INSISTS_ON_DEPARTURE,
      evidence: "I must and will go out into the world." }
  - { from: thumbling_journeyman_father, to: obj_thumbling_journeyman_needle_sword, label: MAKES,
      evidence: "took a long darning-needle and made a knob of sealing-wax on it" }
  - { from: thumbling_journeyman_father, to: thumbling_journeyman, label: GIVES_WEAPON_TO,
      evidence: "there is a sword for thee to take with thee" }
  - { from: thumbling_journeyman, to: loc_thumbling_journeyman_hearth_chimney, label: PEEPS_FROM,
      evidence: "jumped on to the hearth, and peeped into the dish" }
  - { from: loc_thumbling_journeyman_hearth_chimney, to: thumbling_journeyman, label: CARRIES_UP_CHIMNEY,
      evidence: "carried him up the chimney" }
  - { from: thumbling_journeyman, to: thumbling_journeyman_mistress, label: MOCKS_FOOD_OF,
      evidence: "Too many potatoes, too little meat!" }
  - { from: thumbling_journeyman_mistress, to: thumbling_journeyman, label: TRIES_TO_STRIKE,
      evidence: "was just going to strike him" }
  - { from: thumbling_journeyman, to: obj_thumbling_journeyman_thimble, label: HIDES_UNDER,
      evidence: "crept nimbly under a thimble" }
  - { from: thumbling_journeyman_mistress, to: thumbling_journeyman, label: DRIVES_OUT,
      evidence: "drove him out of the house." }

  # Robber treasure-chamber episode
  - { from: thumbling_journeyman, to: loc_thumbling_journeyman_forest, label: ENTERS,
      evidence: "came to a great forest" }
