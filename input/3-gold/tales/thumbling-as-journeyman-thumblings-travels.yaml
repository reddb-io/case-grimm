      evidence: "What an ugly spider is creeping there" }
  - { from: thumbling_journeyman_king, to: loc_thumbling_journeyman_treasure_chamber, label: INSPECTS,
      evidence: "King coming to inspect his treasure-chamber" }
  - { from: thumbling_journeyman, to: thumbling_journeyman_sentries, label: MOCKS,
      evidence: "Ho, ho, here am I!" }
  - { from: thumbling_journeyman, to: obj_thumbling_journeyman_thalers, label: RIDES_DOWN_ON,
      evidence: "hopped nimbly upon it, and flew down with it through the window." }
  - { from: thumbling_journeyman_robbers, to: thumbling_journeyman, label: OFFER_CAPTAINCY_TO,
