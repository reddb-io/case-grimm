  - { from: thumbling_journeyman, to: loc_thumbling_journeyman_inn, label: HIRES_AT,
      evidence: "hired himself as man-servant in an inn." }
  - { from: thumbling_journeyman, to: thumbling_journeyman_maids, label: EXPOSES_SECRET_THEFTS_OF,
      evidence: "he told their master and mistress what they had taken off the plates" }
  - { from: thumbling_journeyman_maids, to: thumbling_journeyman, label: PLOT_AGAINST,
      evidence: "arranged with each other to play him a trick." }
  - { from: thumbling_journeyman_maids, to: obj_thumbling_journeyman_grass_cloth, label: MOW_INTO,
