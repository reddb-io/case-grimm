  - { from: thumbling_journeyman_master, to: thumbling_journeyman_black_cow, label: ORDERS_KILLED,
      evidence: "That cow shall be killed to-morrow." }
  - { from: thumbling_journeyman_butcher, to: thumbling_journeyman, label: ALMOST_CHOPS,
      evidence: "Don’t chop too deep, don’t chop too deep, I am amongst it." }
  - { from: thumbling_journeyman, to: obj_thumbling_journeyman_black_pudding, label: TRAPPED_IN,
      evidence: "thrust into a black-pudding with the bits of bacon." }
  - { from: obj_thumbling_journeyman_black_pudding, to: loc_thumbling_journeyman_smoking_chimney, label: HUNG_IN,
