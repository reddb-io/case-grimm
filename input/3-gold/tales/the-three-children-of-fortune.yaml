slug: the-three-children-of-fortune
khm: 70
atu: '1202/1281/1650/1651'
atu_name: The Three Brothers Inherit a Rooster, a Scythe, and a Cat / Harvesting Grain with a Cannon / Burning the Barn to Destroy an Unknown Animal / Dick Whittington and His Cat
canonical_source: ../../2-silver/canonical/the-three-children-of-fortune/canonical.txt
title: The Three Children of Fortune


entities:

  characters:

    three_children_father:
      name: The Dying Father
      species: sp_human
      agency_modes: [agency_speech, agency_object_mediation]
      speech_acts_performed: [speech_command]
      traits: [aged, poor, inheritance-planner, practical-counsellor]
      evidence: |
        I am already aged,” said he, “my death is nigh, and I have
        wished to take thought for you before my end

    three_children_eldest_brother:
      name: The Eldest Brother
      species: sp_human
      agency_modes: [agency_speech, agency_object_mediation, agency_cunning]
      speech_acts_performed: [speech_bargain]
      affects: [affect_greed]
      traits: [cock-inheritor, novelty-seeker, time-seller, gold-earner]
      evidence: |
        After the father’s death the eldest went away with his cock

    three_children_second_brother:
      name: The Second Brother
      species: sp_human
      agency_modes: [agency_speech, agency_object_mediation, agency_domestic_labor]
      speech_acts_performed: [speech_bargain]
      affects: [affect_greed]
      traits: [scythe-inheritor, imitator, quiet-mower, gold-earner]
      evidence: |
        I will go forth and see whether I cannot get rid of my scythe
        as profitably.

    three_children_third_brother:
      name: The Third Brother
      species: sp_human
      agency_modes: [agency_speech, agency_object_mediation, agency_cunning]
      speech_acts_performed: [speech_bargain]
      affects: [affect_greed]
      traits: [cat-inheritor, right-buyer-seeker, mouse-plague-solver, greatest-treasure-winner]
      evidence: |
        And now the third brother wanted to take his cat to the right
        man.

    three_children_cock:
      name: The Cock
      species: sp_rooster
      agency_modes: [agency_speech]
      traits: [domestic-fowl, time-caller, weather-signal, novelty-animal]
      evidence: |
        it calls you three times during the night, at fixed hours

    three_children_cat:
      name: The Cat
      species: sp_cat
      agency_modes: [agency_violence, agency_speech]
      traits: [mouse-killer, wonderful-beast, mewing-monster-to-strangers, palace-survivor]
      evidence: |
        But now the cat began her chase, and soon cleared a couple of
        rooms

    three_children_mice:
      name: The Mice in the Kingdom
      species: sp_mouse
      agency_modes: [agency_violence]
      traits: [plague, palace-invaders, table-dancers, gnawers]
      evidence: |
        mice squeaked in every corner, and gnawed whatever they could
        lay hold of with their teeth.

    three_children_cock_islanders:
      name: The Cock-Island People
      species: sp_human
      agency_modes: [agency_speech, agency_object_mediation]
      traits: [time-ignorant, wonder-struck, gold-paying-buyers]
      evidence: |
        the people knew nothing about cocks, and did not even understand
        how to divide their time.

    three_children_scythe_islanders:
      name: The Scythe-Island People
      species: sp_human
      agency_modes: [agency_violence, agency_object_mediation]
      traits: [scythe-ignorant, cannon-harvesters, astonished-buyers]
      evidence: |
        he chanced upon an island where the people knew nothing of
        scythes.

    three_children_cat_island_king:
      name: The King of the Mouse-Plagued Island
      species: sp_human
      agency_modes: [agency_social_rank, agency_speech, agency_object_mediation, agency_violence]
      speech_acts_performed: [speech_command]
      affects: [affect_fear]
      traits: [mouse-plagued, cat-buyer, fearful-ruler, cannon-orderer]
      evidence: |
        the King himself in his palace did not know how to secure
        himself against them

    three_children_cat_island_people:
      name: The Cat-Island People
      species: sp_human
      agency_modes: [agency_speech, agency_object_mediation, agency_violence]
      affects: [affect_fear]
      traits: [mouse-plagued, cat-buying-petitioners, mew-frightened, palace-besiegers]
      evidence: |
        The people complained bitterly of the plague

    three_children_noble_youth:
      name: The Noble Youth
      species: sp_human
      agency_modes: [agency_speech]
      speech_acts_performed: [speech_command]
      affects: [affect_fear]
      traits: [cat-herald, mew-mistranslator, royal-messenger]
      evidence: |
        A noble youth, therefore, was sent to ask the cat “whether she
        would peaceably quit the castle?”

  magic_objects:

    obj_three_children_scythe:
      name: The Scythe
      object_kind: tool
      attributes:
        function: ordinary harvest tool made valuable where mowing is unknown
      evidence: |
        he gave to the first a cock, to the second a scythe, and to the
        third a cat.

    obj_three_children_cock_gold:
      name: The Ass-Load of Gold
      object_kind: treasure
      attributes:
        function: payment for the cock as a time-keeping novelty
      evidence: |
        About as much gold as an ass can carry

    obj_three_children_scythe_gold:
      name: The Horse-Load of Gold
      object_kind: treasure
      attributes:
        function: payment for the scythe after the quiet harvest demonstration
      evidence: |
        he received a horse laden with as much gold as it could carry.

    obj_three_children_cat_gold:
      name: The Mule-Load of Gold
      object_kind: treasure
      attributes:
        function: payment for the cat's mouse-killing function
      evidence: |
        a mule laden with gold

    obj_three_children_field_cannon:
      name: The Field Cannon
      instance_of: obj_cannon
      object_kind: weapon
      attributes:
        function: excessive substitute for a harvest tool
      evidence: |
        they took cannon out to the fields and shot it down.

    obj_three_children_palace_cannon:
      name: The Palace Cannon
      instance_of: obj_cannon
      object_kind: weapon
      attributes:
        function: excessive attempt to remove the unknown cat from the palace
      evidence: |
        Cannon were brought out

  locations:

    loc_three_children_father_house:
      name: The Father's House
      instance_of: loc_house
      threshold_type: threshold_doorway
      evidence: |
        A father once called his three sons before him

    loc_three_children_cock_island:
      name: The Island without Cocks
      instance_of: loc_island
      evidence: |
        he came to an island where the people knew nothing about cocks

    loc_three_children_scythe_island:
      name: The Island without Scythes
      instance_of: loc_island
      evidence: |
        he chanced upon an island where the people knew nothing of
        scythes.

    loc_three_children_cat_island:
      name: The Island without Cats
      instance_of: loc_island
      evidence: |
        no cats had ever yet been seen there

    loc_three_children_corn_fields:
      name: The Cannon-Harvest Fields
      instance_of: loc_field
      evidence: |
        When the corn was ripe there, they took cannon out to the
        fields and shot it down.

    loc_three_children_royal_palace:
      name: The Mouse-Plagued Royal Palace
      instance_of: loc_castle
      threshold_type: threshold_doorway
      evidence: |
        the King himself in his palace did not know how to secure
        himself against them


