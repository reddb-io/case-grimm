    evidence: |
      St. Peter blew the bellows

  - from: old_man_lord
    label: HEATS
    to: old_man_beggar
    evidence: |
      pushed him in the forge in the midst of the red-hot fire

  - from: old_man_lord
    label: QUENCHES
    to: old_man_beggar
    evidence: |
      put the glowing little man into it so that the water closed over him

  - from: old_man_lord
