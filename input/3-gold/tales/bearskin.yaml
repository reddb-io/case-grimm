slug: bearskin
khm: 101
atu: '361'
atu_name: Bearskin
canonical_source: ../../2-silver/canonical/bearskin/canonical.txt
title: Bearskin


entities:

  characters:

    bearskin_soldier:
      name: Bearskin / The Discharged Soldier
      archetypes: [arc_discharged_soldier]
      species: sp_human
      existential_states: [state_bound_by_promise, state_infernal_unclean, state_hidden_identity]
      agency_modes: [agency_endurance, agency_violence, agency_object_mediation, agency_speech]
      speech_acts_performed: [speech_promise]
      affects: [affect_courage, affect_pity, affect_joy, affect_love]
      traits: [brave-soldier, dismissed-after-peace, homeless-brother, devil-pact-survivor, bear-skin-wearer, monstrous-looking-benefactor, faithful-betrothed, cleaned-bridegroom]
      evidence: |
        There was once a young fellow who enlisted as a soldier

    bearskin_devil:
      name: Greencoat / The Devil
      species: sp_human
      being_type: being_devil
      agency_modes: [agency_speech, agency_object_mediation, agency_social_rank]
      speech_acts_performed: [speech_command, speech_promise]
      affects: [affect_greed, affect_anger]
      traits: [green-coated-stranger, cloven-footed-tempter, courage-tester, pact-maker, soul-claimant, reluctant-cleanser, two-soul-winner]
      evidence: |
        a strange man stood before him, who wore a green coat

    bearskin_bear:
      name: The Trial Bear
      species: sp_bear
      agency_modes: [agency_violence]
      traits: [growling-test-beast, shot-through-muzzle, skin-source]
      evidence: |
        saw a large bear, which came growling towards him

    bearskin_brothers:
      name: The Hard-Hearted Brothers
      species: sp_human
      agency_modes: [agency_speech, agency_domestic_labor]
      affects: [affect_fear]
      traits: [kin-refusers, usefulness-calculators, failed-shelter-givers]
      evidence: |
        The brothers, however, were hard-hearted

    bearskin_innkeeper:
      name: The Frightened Innkeeper
      species: sp_human
      agency_modes: [agency_speech, agency_object_mediation]
      affects: [affect_fear, affect_greed]
      traits: [stable-refuser, bad-name-fearer, ducat-persuaded-host]
      evidence: |
        the landlord would not receive him

    bearskin_old_man:
      name: The Poor Old Debtor
      species: sp_human
      existential_states: [state_bound_by_promise]
      agency_modes: [agency_speech, agency_social_rank]
      speech_acts_performed: [speech_promise]
      affects: [affect_grief, affect_joy]
      traits: [weeping-debtor, prison-threatened-father, rescued-householder, daughter-promiser]
      evidence: |
        saw an old man weeping bitterly

    bearskin_youngest_bride:
      name: The Youngest Daughter / Faithful Bride
      archetypes: [arc_youngest_sibling]
      species: sp_human
      existential_states: [state_bound_by_promise]
      agency_modes: [agency_speech, agency_object_mediation, agency_endurance]
      speech_acts_performed: [speech_promise, speech_prayer]
      affects: [affect_pity, affect_grief, affect_love]
      traits: [promise-keeper, compassionate-judge, black-dressed-betrothed, mocked-sister, ring-half-keeper, recognizing-bride]
      evidence: |
        The youngest, however, said

    bearskin_elder_sisters:
      name: The Two Elder Sisters
      species: sp_human
      agency_modes: [agency_speech, agency_social_rank]
      affects: [affect_fear, affect_pride, affect_anger]
      traits: [appearance-rejecters, mockers, handsome-stranger-courters, enraged-self-destroyers, devil-soul-substitutes]
      evidence: |
        When the eldest saw him she was so terribly alarmed

  magic_objects:

    obj_bearskin_gun:
      name: The Soldier's Gun
      object_kind: weapon
      attributes:
        function: proves courage by killing the bear
      evidence: |
        The soldier had nothing left but his gun

    obj_bearskin_green_coat:
      name: The Devil's Green Coat
      object_kind: garment
      attributes:
        function: gives Bearskin endless money from its pocket during the seven-year term
      evidence: |
        The Devil took off his green coat

    obj_bearskin_bear_cloak:
      name: The Bearskin Cloak and Bed
      object_kind: garment
      attributes:
        function: compulsory cloak, bed, and name-source during the pact
      evidence: |
        This shall be thy cloak, and thy bed also

    obj_bearskin_ducats:
      name: The Ducats from the Coat Pocket
      object_kind: treasure
      attributes:
        function: buys shelter, pays debts, funds charity, and tests recognition through wealth
      evidence: |
        pulled out a handful of ducats

    obj_bearskin_gold_purse:
      name: The Purse Full of Gold
      object_kind: treasure
      attributes:
        function: releases the old man from debt and prison
      evidence: |
        put a purse full of gold into the poor old

    obj_bearskin_split_ring:
      name: The Two Halves of the Betrothal Ring
      instance_of: obj_betrothal_recognition_token
      object_kind: token
      attributes:
        function: proves that the cleaned handsome stranger is Bearskin
      evidence: |
        broke it in two, and gave her one half

    obj_bearskin_black_dress:
      name: The Bride's Black Dress
      object_kind: garment
      attributes:
        function: materializes mourning, fidelity, and deferred marriage during Bearskin's absence
      evidence: |
        dressed herself entirely in black

    obj_bearskin_velvet_coat:
      name: The Magnificent Velvet Coat
      object_kind: garment
      attributes:
        function: creates the handsome stranger appearance after the pact ends
      evidence: |
        put on a magnificent velvet coat

  locations:

    loc_bearskin_heath:
      name: The Wide Heath with the Circle of Trees
      threshold_type: threshold_forest
      evidence: |
        He came to a wide heath

    loc_bearskin_circle_trees:
      name: The Circle of Trees
      instance_of: loc_tree
      threshold_type: threshold_forest
      evidence: |
        nothing was to be seen but a circle of trees

    loc_bearskin_inn:
      name: The Fourth-Year Inn
      instance_of: loc_inn
      threshold_type: threshold_doorway
      evidence: |
        In the fourth year, he entered an inn

    loc_bearskin_debtor_house:
      name: The Old Man's House
      instance_of: loc_house
      threshold_type: threshold_doorway
      evidence: |
        Come with me

    loc_bearskin_town:
      name: The Town of the Restored Bridegroom
      instance_of: loc_marketplace
      evidence: |
        He went into the town

    loc_bearskin_well:
      name: The Well of the First Sister
      instance_of: loc_well
      evidence: |
        One of them drowned herself in the well

    loc_bearskin_tree:
      name: The Tree of the Second Sister
      instance_of: loc_tree
      evidence: |
        the other hanged herself on a tree


classifications:

  world_laws:
    - law_devil_pact_unclean_endurance_wins_freedom
    - law_split_betrothal_token_recognizes_true_bridegroom
    - law_promise_binds_reality

  moral_regimes:
