    - moral_restorative
    - moral_retributive

  agency_modes_dominant:
    - agency_endurance
    - agency_object_mediation
    - agency_speech
    - agency_social_rank

  affects_driving:
    - affect_fear
    - affect_courage
    - affect_pity
    - affect_grief
    - affect_love
    - affect_anger

  symbol_numbers:
    - num_7
    - num_3

  threshold_types:
    - threshold_forest
    - threshold_doorway


propp:
  - { function: func_initial_situation, order: 1, actor: bearskin_soldier,
      scene: "A brave soldier is dismissed when peace comes.",
      evidence: "when peace was made, he received his dismissal" }
  - { function: func_lack, order: 2, actor: bearskin_soldier,
      scene: "His parents are dead, his brothers reject him, and he foresees starvation.",
      evidence: "so I see beforehand that I shall have to starve" }
  - { function: func_donor_appearance, order: 3, actor: bearskin_devil,
      scene: "A stately green-coated stranger with a cloven foot appears on the heath.",
      evidence: "looked right stately, but had a hideous cloven foot" }
  - { function: func_test, order: 4, actor: bearskin_devil,
      scene: "The stranger tests whether the soldier is fearless by showing him a growling bear.",
      evidence: "first I must know if thou art fearless" }
  - { function: func_victory, order: 5, actor: bearskin_soldier,
      scene: "The soldier shoots the bear through the muzzle and passes the courage test.",
      evidence: "shot it through the muzzle" }
  - { function: func_contract, order: 6, actor: bearskin_devil,
      scene: "The Devil sets the seven-year no-washing, no-grooming, no-prayer pact with soul forfeiture if the soldier dies.",
      evidence: "thou shalt for the next seven years neither wash thyself" }
  - { function: func_magical_agent, order: 7, actor: bearskin_devil,
      scene: "The Devil gives the soldier the money-giving green coat and the bear skin cloak and bed.",
      evidence: "puttest thy hand into the pocket, thou wilt always find it full of money" }
  - { function: func_ordeal, order: 8, actor: bearskin_soldier,
      scene: "Bearskin wanders through the years as his hair, beard, claws, and dirt make him look monstrous.",
      evidence: "he began to look like a monster" }
  - { function: func_charity, order: 9, actor: bearskin_soldier,
      scene: "He gives poor people money so they will pray that he survives the seven years.",
      evidence: "gave the poor money to pray that he might not die" }
  - { function: func_rescue, order: 10, actor: bearskin_soldier,
      scene: "In the inn he hears the old man's lament, pays the debt, and adds a purse of gold.",
      evidence: "paid him and put a purse full of gold" }
  - { function: func_betrothal, order: 11, actor: bearskin_old_man,
      scene: "The grateful father offers Bearskin one of his beautiful daughters as a wife.",
      evidence: "choose one of them for thyself as a wife" }
  - { function: func_rejection, order: 12, actor: bearskin_elder_sisters,
      scene: "The two elder daughters reject Bearskin's appearance with fear and mockery.",
      evidence: "How can I accept a husband who no longer has a human form" }
  - { function: func_promise_kept, order: 13, actor: bearskin_youngest_bride,
      scene: "The youngest insists that the father's promise must be kept because Bearskin helped him.",
      evidence: "your promise must be kept" }
  - { function: func_token_division, order: 14, actor: bearskin_soldier,
      scene: "Bearskin breaks his ring in two, keeps one half, gives the other to the bride, and asks her to wait three years.",
      evidence: "broke it in two, and gave her one half" }
  - { function: func_fidelity_ordeal, order: 15, actor: bearskin_youngest_bride,
      scene: "The promised bride wears black, weeps, and endures contempt and mockery from her sisters.",
      evidence: "Nothing but contempt and mockery fell to her lot from her sisters" }
  - { function: func_term_completed, order: 16, actor: bearskin_soldier,
      scene: "On the last day of the seven years Bearskin returns to the heath and forces the Devil to clean him.",
      evidence: "the last day of the seven years dawned" }
  - { function: func_restoration, order: 17, actor: bearskin_devil,
      scene: "The Devil washes, combs, and cuts Bearskin until he looks like a handsome soldier again.",
      evidence: "wash Bearskin, comb his hair, and cut his nails" }
  - { function: func_arrival_in_disguise, order: 18, actor: bearskin_soldier,
      scene: "Bearskin returns as a magnificent, unrecognised stranger whom the father mistakes for a general.",
      evidence: "No one recognized him" }
  - { function: func_recognition, order: 19, actor: obj_bearskin_split_ring,
      scene: "The ring halves fit exactly, proving the stranger is the promised Bearskin.",
      evidence: "the two pieces fitted exactly together" }
  - { function: func_wedding, order: 20, actor: bearskin_soldier,
      scene: "The restored Bearskin embraces and kisses his faithful bride.",
      evidence: "embraced her, and gave her a kiss" }
  - { function: func_punishment, order: 21, actor: bearskin_elder_sisters,
      scene: "The elder sisters destroy themselves in rage, giving the Devil two souls instead of one.",
      evidence: "I have now got two souls in the place of thy one" }


