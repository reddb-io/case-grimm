# yaml-language-server: $schema=../schemas/tale.schema.json

slug: legend-09-the-heavenly-wedding
khm: null
legend_number: 9
canonical_source: ../../2-silver/canonical/legend-09-the-heavenly-wedding/canonical.txt
title: The Heavenly Wedding

entities:
  characters:
    heavenly_wedding_boy:
      name: The Literal Peasant-Boy
      species: sp_human
      archetypes: [arc_pious_orphan]
      agency_modes: [agency_speech, agency_domestic_labor, agency_object_mediation]
      speech_acts_performed: [speech_prayer, speech_testimony]
      affects: [affect_joy, affect_pity]
      traits: [poor, literal-minded, straight-path-walker, church-dweller, image-feeder, ill-for-eight-days, communion-dead, heavenly-wedding-guest]
      evidence: |
        A poor peasant-boy one day heard the priest say in church

    heavenly_wedding_priest:
      name: The Priest
      species: sp_human
      agency_modes: [agency_speech, agency_object_mediation]
      speech_acts_performed: [speech_command, speech_request]
      traits: [church-authority, tolerant, observer, communion-giver, wedding-denied]
      evidence: |
        The priest said, “If he believes that, we will leave him inside.”

    heavenly_wedding_clerk:
      name: The Clerk
      species: sp_human
      agency_modes: [agency_speech]
      speech_acts_performed: [speech_command]
      traits: [church-servant, exit-commander, priest-informer]
      evidence: |
        the clerk bade him go out

    heavenly_wedding_image:
      name: Our Lady with the Blessed Child Jesus
      species: sp_human
      being_type: being_divine
      agency_modes: [agency_speech, agency_object_mediation]
      speech_acts_performed: [speech_command]
      traits: [wooden-image, prayed-to, food-accepting, growing-stout, speaking, heavenly-wedding-inviter]
      evidence: |
        Our Lady with the blessed child Jesus which was carved in wood

  magic_objects:
    obj_heavenly_wedding_sacred_image:
      name: The Wooden Sacred Image
      instance_of: obj_sacred_answering_image
      object_kind: relic
      evidence: |
        Our Lady with the blessed child Jesus which was carved in wood

    obj_heavenly_wedding_half_dinner:
      name: The Shared Half Dinner
      object_kind: food
      evidence: |
        every day I will give you half my dinner

    obj_heavenly_wedding_host:
      name: The Holy Communion Host
      object_kind: food
      evidence: |
        when the host came to him

  locations:
    loc_heavenly_wedding_church:
      name: The Church Mistaken for Heaven
      instance_of: loc_church
      evidence: |
        into the midst of a church

    loc_heavenly_wedding_heaven:
      name: The Eternal Wedding
      instance_of: loc_heaven
      evidence: |
        was at the eternal wedding

classifications:
  world_laws:
    - law_child_feeding_sacred_image_invites_heavenly_wedding
  moral_regimes:
    - moral_providential_protection
  agency_modes_dominant: [agency_speech, agency_object_mediation, agency_domestic_labor]
  affects_driving: [affect_joy, affect_pity]
  symbol_numbers: [num_8]
  threshold_types: []

propp:
  - { function: func_literal_instruction, order: 1, actor: heavenly_wedding_boy,
      scene: "the boy follows the priest's words by walking straight onward toward heaven" }
  - { function: func_church_as_heaven, order: 2, actor: heavenly_wedding_boy,
      scene: "he enters a church, believes he has reached heaven, and refuses to leave" }
  - { function: func_image_feeding, order: 3, actor: heavenly_wedding_boy,
      beneficiary: heavenly_wedding_image,
      scene: "the boy gives half his dinner daily to the sacred image" }
  - { function: func_image_response, order: 4, actor: heavenly_wedding_image,
      beneficiary: heavenly_wedding_boy,
      scene: "the image eats, grows strong, and accepts the boy's goodwill" }
  - { function: func_heavenly_invitation, order: 5, actor: heavenly_wedding_image,
      beneficiary: heavenly_wedding_boy,
      scene: "the image invites only the boy to next Sunday's wedding" }
  - { function: func_sacramental_death, order: 6, actor: heavenly_wedding_priest,
      beneficiary: heavenly_wedding_boy,
      scene: "the priest gives communion and the boy dies into the eternal wedding" }

edges:
  - { from: heavenly_wedding_boy, to: loc_heavenly_wedding_church, label: ENTERS_AS_HEAVEN,
      evidence: "he thought he had reached heaven" }
  - { from: heavenly_wedding_boy, to: loc_heavenly_wedding_church, label: REFUSES_TO_LEAVE,
      evidence: "I am glad to be in heaven at last" }
  - { from: heavenly_wedding_boy, to: obj_heavenly_wedding_sacred_image, label: MISTAKES_FOR_GOD,
      evidence: "that is the good God" }
  - { from: heavenly_wedding_boy, to: obj_heavenly_wedding_half_dinner, label: OFFERS_DAILY,
      evidence: "every day I will give you half my dinner" }
  - { from: heavenly_wedding_image, to: obj_heavenly_wedding_half_dinner, label: ACCEPTS,
      evidence: "the image began to enjoy the food" }
  - { from: heavenly_wedding_image, to: heavenly_wedding_boy, label: INVITES_TO_WEDDING,
      evidence: "Next Sunday thou shalt go with me to the wedding" }
  - { from: heavenly_wedding_image, to: heavenly_wedding_priest, label: DENIES_WEDDING_ENTRY_TO,
      evidence: "No" }
  - { from: heavenly_wedding_priest, to: obj_heavenly_wedding_host, label: GIVES,
      evidence: "give him the holy communion" }
  - { from: heavenly_wedding_boy, to: loc_heavenly_wedding_heaven, label: DIES_INTO,
      evidence: "he fell down and died, and was at the eternal wedding" }
  - { from: obj_heavenly_wedding_sacred_image, to: law_child_feeding_sacred_image_invites_heavenly_wedding, label: MANIFESTS,
      evidence: "how she accepted it" }
