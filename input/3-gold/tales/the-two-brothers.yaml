slug: the-two-brothers
khm: 60
atu: '567/300/303'
atu_name: The Magic Bird Heart / The Dragon-Slayer / The Twin or Blood Brothers
canonical_source: ../../2-silver/canonical/the-two-brothers/canonical.txt
title: The Two Brothers


entities:

  characters:

    two_brothers_rich_goldsmith:
      name: The Rich Goldsmith
      archetypes: [arc_greedy_one]
      species: sp_human
      agency_modes: [agency_cunning, agency_speech, agency_social_rank]
      speech_acts_performed: [speech_lie, speech_command]
      affects: [affect_greed, affect_envy]
      traits: [rich-brother, evil-hearted, bird-power-knower, organ-loser, false-devil-accuser]
      evidence: |
        The goldsmith was crafty and cunning, and knew very well what
        kind of a bird it was.

    two_brothers_poor_broommaker:
      name: The Poor Broom-Maker
      species: sp_human
      agency_modes: [agency_domestic_labor, agency_speech, agency_violence]
      affects: [affect_fear, affect_grief]
      traits: [poor-brother, father-of-twins, golden-bird-finder, deceived-exposer]
      evidence: |
        The poor one supported himself by making brooms, and was good
        and honourable.

    two_brothers_goldsmith_wife:
      name: The Goldsmith's Wife
      species: sp_human
      agency_modes: [agency_domestic_labor, agency_cunning]
      affects: [affect_fear]
      traits: [bird-roaster, organ-substituter, cock-heart-replacer]
      evidence: |
        she quickly killed a young cock, took out his heart and liver

    two_brothers_younger_huntsman:
      name: The Younger Twin Huntsman / Young King
      archetypes: [arc_dragon_slayer]
      species: sp_human
      agency_modes: [agency_violence, agency_animal_aid, agency_object_mediation, agency_speech, agency_social_rank]
      transformations: [transform_resurrection_by_remedy]
      affects: [affect_loyalty, affect_love_at_first_sight, affect_fear, affect_anger]
      traits: [gold-producing-child, abandoned-twin, trained-huntsman, west-going-brother, animal-keeper, dragon-slayer, murdered-sleeper, revived-with-root, true-bridegroom, enchanted-forest-victim, jealous-fratricide, repentant]
      evidence: |
        he showed her the dragon all cut to pieces, and told her that
        she was now delivered.

    two_brothers_elder_huntsman:
      name: The Other Twin Huntsman / Rescuing Brother
      species: sp_human
      agency_modes: [agency_violence, agency_animal_aid, agency_cunning, agency_endurance]
      transformations: [transform_resurrection_by_remedy]
      affects: [affect_loyalty]
      traits: [gold-producing-child, abandoned-twin, trained-huntsman, east-going-brother, fate-knife-reader, mistaken-for-king, chaste-substitute, witch-shooter, brother-rescuer, wrongly-killed, revived-with-root]
      evidence: |
        he laid a two-edged sword between him and the young Queen

    two_brothers_foster_huntsman:
      name: The Foster-Huntsman
      archetypes: [arc_wise_helper]
      species: sp_human
      agency_modes: [agency_speech, agency_domestic_labor, agency_object_mediation]
      traits: [adoptive-father, trainer, trial-shot-master, fate-knife-giver]
      evidence: |
        I will be your father, and bring you up till you are big.

    two_brothers_hare:
      name: The Hare Helper
      archetypes: [arc_animal_helper]
      species: sp_hare
      agency_modes: [agency_animal_aid, agency_endurance, agency_speech]
      traits: [spared-animal, food-fetcher, life-root-fetcher, watch-chain-last]
      evidence: |
        Kill me not, I will bring our master to life again.

    two_brothers_fox:
      name: The Fox Helper
      archetypes: [arc_animal_helper]
      species: sp_fox
      agency_modes: [agency_animal_aid, agency_cunning, agency_speech]
      traits: [spared-animal, village-guide, poultry-knower, roast-meat-fetcher]
      evidence: |
        Hark ye, cunning fellows, provide us with something to eat.

    two_brothers_wolf:
      name: The Wolf Helper
      archetypes: [arc_animal_helper]
      species: sp_wolf
      agency_modes: [agency_animal_aid, agency_violence, agency_speech]
      traits: [spared-animal, vegetable-fetcher, fearless-palace-runner]
      evidence: |
        Then the wolf went straight to the palace, as he feared no one

    two_brothers_bear:
      name: The Bear Helper
      archetypes: [arc_animal_helper]
      species: sp_bear
      agency_modes: [agency_animal_aid, agency_violence, agency_speech]
      traits: [spared-animal, confectionery-fetcher, guard-scatterer]
      evidence: |
        gave them a few boxes on the ears, right and left

    two_brothers_lion:
      name: The Lion Helper
      archetypes: [arc_animal_helper]
      species: sp_lion
      agency_modes: [agency_animal_aid, agency_violence, agency_speech]
      traits: [spared-animal, clasp-bearer, wine-fetcher, head-rejoiner, recognition-animal]
      evidence: |
        the lion received the golden clasp.

    two_brothers_humble_bee:
      name: The Humble-Bee
      species: sp_bee
      agency_modes: [agency_violence]
      traits: [hare-waker, third-sting-trigger]
      evidence: |
        came for the third time, and stung his nose so that he awoke.

    two_brothers_king:
      name: The King of the Dragon Town
      archetypes: [arc_oath_enforcer]
      species: sp_human
      agency_modes: [agency_social_rank, agency_speech, agency_violence]
      speech_acts_performed: [speech_promise, speech_command]
      affects: [affect_grief]
      traits: [daughter-father, dragon-tribute-ruler, bride-reward-promiser, proof-judge, viceroy-maker]
      evidence: |
        The King has promised that he who conquers the dragon shall
        have his daughter to wife

    two_brothers_princess:
      name: The King's Daughter / Young Queen
      species: sp_human
      agency_modes: [agency_speech, agency_social_rank, agency_object_mediation]
      speech_acts_performed: [speech_promise, speech_testimony]
      affects: [affect_fear, affect_love_at_first_sight, affect_loyalty]
      traits: [dragon-tribute-maiden, rescued-princess, token-giver, coerced-silent-witness, delayed-bride, recognition-witness, anxious-wife]
      evidence: |
        she took off her necklace of coral, and divided it amongst the
        animals

    two_brothers_marshal:
      name: The Wicked Marshal
      archetypes: [arc_false_hero]
      species: sp_human
      agency_modes: [agency_violence, agency_cunning, agency_speech, agency_social_rank]
      speech_acts_performed: [speech_lie, speech_command]
      affects: [affect_greed, affect_fear]
      traits: [distant-witness, sleeping-hero-killer, princess-coercer, dragon-credit-thief, exposed-liar, executed]
      evidence: |
        I have killed the dragon, and delivered the maiden and the
        whole kingdom as well

    two_brothers_dragon:
      name: The Seven-Headed Dragon
      being_type: being_dragon
      agency_modes: [agency_violence, agency_speech]
      traits: [seven-headed, virgin-demanding, fire-breathing, country-waster, slain-monster]
      evidence: |
        the seven-headed dragon came thither with loud roaring.

    two_brothers_innkeeper:
      name: The Innkeeper
      species: sp_human
      agency_modes: [agency_speech]
      traits: [black-crape-explainer, red-cloth-explainer, wager-loser, mercy-recipient]
      evidence: |
        Last year the town was all hung with black crape, what means
        the red cloth to-day?

    two_brothers_witch:
      name: The Old Woman in the Enchanted Forest
      being_type: being_witch
      agency_modes: [agency_speech, agency_cunning, agency_violence]
      transformations: [transform_petrification]
      speech_acts_performed: [speech_lie, speech_command]
      affects: [affect_fear]
      traits: [tree-sitter, cold-pretender, wand-giver, animal-petrifier, vault-keeper, silver-vulnerable, forced-reviver, burned]
      evidence: |
        she leapt down and touched him also with a wand, and changed
        him to stone.

  magic_objects:

    obj_two_brothers_golden_bird:
      name: The Wondrous Golden Bird
      instance_of: obj_golden_bird
      object_kind: creature_object
      attributes:
        function: source of feather, egg, body, and wealth-generating organs
      evidence: |
        a bird which was quite golden

    obj_two_brothers_golden_feather:
      name: The Golden Feather
      object_kind: token
      attributes:
        function: first proof that the bird is pure gold
      evidence: |
        one golden feather only fell down

    obj_two_brothers_golden_egg:
      name: The Golden Egg
      object_kind: treasure
      attributes:
        function: second golden token taken from the bird's nest
      evidence: |
        an egg lay inside it, which was of gold.

    obj_two_brothers_bird_heart_liver:
      name: The Bird's Heart and Liver
      instance_of: obj_magic_bird_heart_liver
      object_kind: food
      attributes:
        function: eaten by the twins, producing daily gold under pillows
      evidence: |
        That must have been the heart and the liver

    obj_two_brothers_daily_gold:
      name: The Daily Gold Pieces
      object_kind: treasure
      attributes:
        function: recurring fortune under the twins' pillows
      evidence: |
        every morning a piece of gold beneath his pillow

    obj_two_brothers_fate_knife:
      name: The Bright Life-Reporting Knife
      instance_of: obj_fate_reporting_knife
      object_kind: weapon
      attributes:
        function: reports whether the separated brother lives or dies by rust
      evidence: |
        the side of the knife which is turned in the direction by which
        he went, will rust if he dies

    obj_two_brothers_good_guns:
      name: The Good Guns
      object_kind: weapon
      attributes:
        function: trial-shot and hunting weapons for the twins
      evidence: |
        presented each of them with a good gun and a dog

    obj_two_brothers_strength_cups:
      name: The Three Strength Cups
      object_kind: relic
      attributes:
        function: make the drinker strong enough to wield the buried sword
      evidence: |
        three full cups were standing

    obj_two_brothers_dragon_sword:
      name: The Buried Dragon Sword
      object_kind: weapon
      attributes:
        function: sword that can be wielded only after drinking the cups
      evidence: |
        the sword which is buried before the threshold of the door

    obj_two_brothers_dragon_tongues:
      name: The Seven Dragon Tongues
      instance_of: obj_forensic_token
      object_kind: relic
      attributes:
        function: proof that exposes the marshal's false dragon-slayer claim
      evidence: |
        cut the tongues out of the dragon’s seven heads

    obj_two_brothers_princess_handkerchief:
      name: The Princess's Named Handkerchief
      instance_of: obj_forensic_token
      object_kind: token
      attributes:
        function: wraps the dragon tongues and proves the princess gave it to the true slayer
      evidence: |
        Her pocket-handkerchief, however, on which was her name

    obj_two_brothers_animal_collars:
      name: The Animal Collars and Golden Clasp
      object_kind: token
      attributes:
        function: recognition tokens connecting the animals to the rescued princess
      evidence: |
        took the collar off each of them and the golden clasp from the
        lion

    obj_two_brothers_life_root:
      name: The Mountain Life-Root
      instance_of: obj_life_restoring_root
      object_kind: relic
      attributes:
        function: restores the beheaded huntsmen to life
      evidence: |
        brought the root with him.

    obj_two_brothers_witch_wand:
      name: The Witch's Petrifying Wand
      instance_of: obj_enchanting_wand
      object_kind: tool
      attributes:
        function: turns animals and men to stone, then restores them under compulsion
      evidence: |
        I will throw down a wand from the tree

    obj_two_brothers_silver_buttons:
      name: The Three Silver Buttons
      object_kind: weapon
      attributes:
        function: silver shot that defeats the lead-proof witch
      evidence: |
        tore three silver buttons off his coat, and loaded his gun with
        them

    obj_two_brothers_chastity_sword:
      name: The Two-Edged Sword in the Bed
      object_kind: weapon
      attributes:
        function: separates the mistaken twin from his brother's wife
      evidence: |
        laid a two-edged sword between him and the young Queen

  locations:

    loc_two_brothers_rich_house:
      name: The Rich Goldsmith's House
      instance_of: loc_house
      evidence: |
        The two boys went backwards and forwards to the rich house

    loc_two_brothers_first_forest:
      name: The Golden Bird Forest
      instance_of: loc_forest
      threshold_type: threshold_forest
      evidence: |
        going into the forest to fetch brush-wood

    loc_two_brothers_foster_house:
      name: The Foster-Huntsman's House
      instance_of: loc_house
      evidence: |
        he took them home with him

    loc_two_brothers_parting_tree:
      name: The Parting Tree of the Knife
      instance_of: loc_tree
      evidence: |
        stick this knife into a tree at the place where you part

    loc_two_brothers_dragon_town:
      name: The Town Hung with Black and Red Cloth
      evidence: |
        arrived with his beasts in a town which was all hung with black
        crape.

    loc_two_brothers_inn:
      name: The Inn of Wagers and News
      instance_of: loc_inn
      evidence: |
        He went into an inn

    loc_two_brothers_dragon_hill:
      name: The Dragon's High Hill
      instance_of: loc_mountain
      evidence: |
        There is a high hill without the town, whereon dwells a dragon

    loc_two_brothers_hill_church:
      name: The Little Church on the Dragon Hill
      instance_of: loc_church
      threshold_type: threshold_doorway
      evidence: |
        A little church stood at the top of it

    loc_two_brothers_palace:
      name: The King's Palace
      instance_of: loc_castle
      evidence: |
        went straight to the King’s daughter

    loc_two_brothers_enchanted_forest:
      name: The Haunted Enchanted Forest
      instance_of: loc_forest
      threshold_type: threshold_forest
      evidence: |
        there was a forest of which it was reported that it was haunted

    loc_two_brothers_witch_tree:
      name: The Witch's Tree
      instance_of: loc_tree
      evidence: |
        saw an old woman sitting in the tree

    loc_two_brothers_stone_vault:
      name: The Vault of Petrified People
      instance_of: loc_tomb
      evidence: |
        dragged him and the animals into a vault, where many more such
        stones already lay.


