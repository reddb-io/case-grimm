propp:
  - { function: func_initial_situation, order: 1, actor: two_brothers_poor_broommaker,
      scene: "rich goldsmith and poor broom-maker are brothers; the poor man's twin sons live on scraps" }
  - { function: func_magical_agent, order: 2, actor: two_brothers_poor_broommaker,
      scene: "poor broom-maker captures golden bird, feather, and egg for the goldsmith" }
  - { function: func_transference, order: 3, actor: two_brothers_younger_huntsman,
      scene: "the twins accidentally eat the golden bird's heart and liver and receive daily gold" }
  - { function: func_villainy, order: 4, actor: two_brothers_rich_goldsmith,
      scene: "goldsmith lies that the twins belong to the Evil One, causing their father to abandon them" }
  - { function: func_rescue, order: 5, actor: two_brothers_foster_huntsman,
      scene: "huntsman adopts the abandoned twins and trains them as huntsmen" }
  - { function: func_departure, order: 6, actor: two_brothers_younger_huntsman,
      scene: "twins receive guns, dogs, gold, and fate knife, then separate east and west" }
  - { function: func_donor_test, order: 7, actor: two_brothers_hare,
      scene: "brothers spare hare, fox, wolf, bear, and lion and receive young animal helpers" }
  - { function: func_mediation, order: 8, actor: two_brothers_innkeeper,
      scene: "younger brother learns the princess will be sacrificed to the dragon" }
  - { function: func_victory, order: 9, actor: two_brothers_younger_huntsman,
      scene: "after drinking the cups, the huntsman and animals kill the seven-headed dragon" }
  - { function: func_false_claims, order: 10, actor: two_brothers_marshal,
      scene: "marshal beheads the sleeping hero, coerces the princess, and claims dragon victory" }
  - { function: func_resurrection, order: 11, actor: two_brothers_hare,
      scene: "hare fetches the life-root and the animals revive their beheaded master" }
  - { function: func_return, order: 12, actor: two_brothers_younger_huntsman,
      scene: "after one year the huntsman returns to the red-cloth wedding town" }
  - { function: func_recognition, order: 13, actor: two_brothers_younger_huntsman,
      scene: "royal food errands and dragon tongues expose the marshal and identify the true slayer" }
  - { function: func_wedding, order: 14, actor: two_brothers_king,
      scene: "marshal is executed; the true huntsman marries the princess and becomes viceroy" }
  - { function: func_interdiction, order: 15, actor: two_brothers_king,
      scene: "young king is warned away from the haunted forest but follows the white hart" }
  - { function: func_villainy, order: 16, actor: two_brothers_witch,
      scene: "witch tricks the young king into striking his animals with the wand and turns all to stone" }
  - { function: func_mediation, order: 17, actor: two_brothers_elder_huntsman,
      scene: "other brother reads the half-rusted knife and travels west to rescue him" }
  - { function: func_trickery, order: 18, actor: two_brothers_elder_huntsman,
      scene: "he accepts mistaken identity as the young king but lays a sword between himself and the queen" }
  - { function: func_victory, order: 19, actor: two_brothers_elder_huntsman,
      scene: "silver buttons bring down the witch; she restores the petrified brother and others" }
  - { function: func_villainy, order: 20, actor: two_brothers_younger_huntsman,
      scene: "jealous younger brother kills the loyal rescuer after hearing about the queen's bed" }
  - { function: func_resurrection, order: 21, actor: two_brothers_hare,
      scene: "the life-root revives the wrongly killed brother" }
  - { function: func_recognition, order: 22, actor: two_brothers_princess,
      scene: "the queen identifies the true husband by the lion's golden clasp" }


edges:

  # Magic bird heart and exile
  - { from: two_brothers_poor_broommaker, to: obj_two_brothers_golden_feather, label: SELLS,
      evidence: "gave him a great deal of money for it." }
  - { from: two_brothers_poor_broommaker, to: obj_two_brothers_golden_egg, label: SELLS,
      evidence: "gave him what it was worth." }
  - { from: two_brothers_rich_goldsmith, to: obj_two_brothers_golden_bird, label: DEMANDS,
      evidence: "I should indeed like to have the bird itself." }
  - { from: two_brothers_younger_huntsman, to: obj_two_brothers_bird_heart_liver, label: EATS,
      evidence: "We will eat these two little bits" }
  - { from: obj_two_brothers_bird_heart_liver, to: obj_two_brothers_daily_gold, label: PRODUCES,
      evidence: "every morning a piece of gold beneath his pillow" }
  - { from: two_brothers_rich_goldsmith, to: two_brothers_poor_broommaker, label: DECEIVES,
      evidence: "Thy children are in league with the Evil One" }
  - { from: two_brothers_poor_broommaker, to: two_brothers_younger_huntsman, label: ABANDONS,
      evidence: "led the twins forth into the forest" }
  - { from: two_brothers_foster_huntsman, to: two_brothers_younger_huntsman, label: ADOPTS,
      evidence: "he took them home with him" }
  - { from: two_brothers_foster_huntsman, to: obj_two_brothers_fate_knife, label: GIVES,
      evidence: "he gave them a bright knife" }
  - { from: obj_two_brothers_fate_knife, to: two_brothers_elder_huntsman, label: REPORTS_DANGER_TO,
      evidence: "his brother’s side of the knife was half rusted, and half bright." }

  # Animal helpers and dragon combat
  - { from: two_brothers_younger_huntsman, to: two_brothers_hare, label: SPARES,
      evidence: "Dear huntsman, do but let me live" }
  - { from: two_brothers_fox, to: two_brothers_younger_huntsman, label: GUIDES_TO_FOOD,
      evidence: "we will show you the way there." }
  - { from: two_brothers_innkeeper, to: two_brothers_younger_huntsman, label: REPORTS_SACRIFICE_TO,
      evidence: "our King’s only daughter is to die to-morrow." }
  - { from: two_brothers_king, to: two_brothers_princess, label: OFFERS_AS_REWARD,
      evidence: "he who conquers the dragon shall have his daughter to wife" }
  - { from: obj_two_brothers_strength_cups, to: two_brothers_younger_huntsman, label: STRENGTHENS,
      evidence: "emptied the cups, and now he was strong enough" }
  - { from: obj_two_brothers_dragon_sword, to: two_brothers_dragon, label: BEHEADS,
      evidence: "struck off three of his heads." }
  - { from: two_brothers_lion, to: two_brothers_dragon, label: TEARS_TO_PIECES,
      evidence: "called up his animals who tore it in pieces." }
  - { from: two_brothers_princess, to: obj_two_brothers_animal_collars, label: GIVES,
      evidence: "divided it amongst the animals in order to reward them" }
  - { from: two_brothers_younger_huntsman, to: obj_two_brothers_dragon_tongues, label: PRESERVES_PROOF,
      evidence: "wrapped them in the handkerchief, and preserved them carefully." }

  # False hero, resurrection, and exposure
  - { from: two_brothers_marshal, to: two_brothers_younger_huntsman, label: BEHEADS,
      evidence: "cut off the huntsman’s head" }
  - { from: two_brothers_marshal, to: two_brothers_princess, label: COERCES_SILENCE_FROM,
      evidence: "threatened to kill her if she did not obey him" }
  - { from: two_brothers_marshal, to: two_brothers_king, label: FALSELY_CLAIMS,
      evidence: "I have killed the dragon" }
  - { from: two_brothers_humble_bee, to: two_brothers_hare, label: AWAKENS,
      evidence: "stung his nose so that he awoke." }
  - { from: two_brothers_hare, to: obj_two_brothers_life_root, label: FETCHES,
      evidence: "brought the root with him." }
  - { from: obj_two_brothers_life_root, to: two_brothers_younger_huntsman, label: REVIVES,
      evidence: "his heart beat, and life came back." }
  - { from: two_brothers_hare, to: two_brothers_princess, label: ANNOUNCES_TRUE_SLAYER_TO,
      evidence: "My master, who killed the dragon, is here" }
  - { from: obj_two_brothers_dragon_tongues, to: two_brothers_marshal, label: EXPOSES,
      evidence: "the dragon’s tongues are the tokens of the victor" }
  - { from: obj_two_brothers_princess_handkerchief, to: two_brothers_younger_huntsman, label: IDENTIFIES,
      evidence: "To him who killed the dragon." }
  - { from: two_brothers_king, to: two_brothers_marshal, label: EXECUTES,
      evidence: "they sentenced him to be torn to pieces by four bulls." }

  # Enchanted forest and twin substitution
  - { from: two_brothers_younger_huntsman, to: loc_two_brothers_enchanted_forest, label: ENTERS,
      evidence: "followed a white hart into the enchanted forest" }
  - { from: two_brothers_witch, to: obj_two_brothers_witch_wand, label: THROWS_DOWN,
      evidence: "I will throw down a wand from the tree" }
  - { from: obj_two_brothers_witch_wand, to: two_brothers_younger_huntsman, label: PETRIFIES,
      evidence: "changed him to stone." }
  - { from: two_brothers_witch, to: loc_two_brothers_stone_vault, label: HIDES_VICTIMS_IN,
      evidence: "where many more such stones already lay." }
  - { from: obj_two_brothers_silver_buttons, to: two_brothers_witch, label: WOUNDS,
      evidence: "when he fired she fell down at once with a scream." }
  - { from: two_brothers_elder_huntsman, to: two_brothers_witch, label: COMPELS_REVERSAL_FROM,
      evidence: "make my brother and all the human beings lying here, alive again" }
