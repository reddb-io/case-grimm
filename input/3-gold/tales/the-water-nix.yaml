      evidence: "Now I have got you" }
  - { from: water_nix_nix, to: water_nix_brother, label: CAPTURES,
      evidence: "Now I have got you" }
  - { from: water_nix_nix, to: water_nix_sister, label: COMMANDS_LABOR,
