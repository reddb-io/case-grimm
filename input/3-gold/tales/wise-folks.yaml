slug: wise-folks
khm: 104
atu: '1384'
atu_name: A Man Seeks Someone as Stupid as His Wife
canonical_source: ../../2-silver/canonical/wise-folks/canonical.txt
title: Wise Folks


entities:

  characters:

    wise_folks_hans:
      name: Hans the Peasant Husband
      archetypes: [arc_trickster]
      species: sp_human
      agency_modes: [agency_speech, agency_cunning, agency_object_mediation, agency_violence]
      speech_acts_performed: [speech_command, speech_lie]
      affects: [affect_anger, affect_greed, affect_pity]
      traits: [travelling-husband, violent-threatener, folly-comparer, false-heaven-man, horse-and-purse-winner, beating-postponer]
      evidence: |
        One day a peasant took his good hazel-stick

    wise_folks_trina:
      name: Trina
      archetypes: [arc_fool]
      species: sp_human
      agency_modes: [agency_speech, agency_domestic_labor, agency_object_mediation]
      existential_states: [state_deceived]
      affects: [affect_fear, affect_joy]
      traits: [wife, cow-seller, foolish-collateral-keeper, smallest-cow-pledge-holder, spared-by-comparison]
      evidence: |
        said to his wife, “Trina,

    wise_folks_cattle_dealer:
      name: The Cattle-Dealer
      archetypes: [arc_trickster]
      species: sp_human
      agency_modes: [agency_speech, agency_cunning, agency_object_mediation]
      speech_acts_performed: [speech_lie]
      traits: [cow-buyer, money-belt-excuser, false-pledge-offerer, two-cow-taker]
      evidence: |
        the cattle-dealer came

    wise_folks_waggon_woman:
      name: The Standing Woman in the Waggon
      archetypes: [arc_fool]
      species: sp_human
      agency_modes: [agency_speech, agency_object_mediation, agency_domestic_labor]
      existential_states: [state_deceived]
      affects: [affect_pity, affect_grief, affect_joy]
      traits: [widow-like-believer, standing-rider, heaven-courier-dupe, dead-husband-provider, purse-giver]
      evidence: |
        a woman was standing upright in the middle of it

    wise_folks_waggon_son:
      name: The Woman's Son
      archetypes: [arc_fool]
      species: sp_human
      agency_modes: [agency_speech, agency_object_mediation, agency_domestic_labor]
      existential_states: [state_deceived]
      affects: [affect_joy]
      traits: [field-worker, heaven-news-seeker, horse-lender, father-horse-sender]
      evidence: |
        she found her son who had come in from the field

    wise_folks_dead_husband:
      name: The Husband in Heaven
      species: sp_human
      agency_modes: [agency_domestic_labor]
      traits: [dead-husband, imagined-heaven-shepherd, recipient-of-money-and-horse]
      evidence: |
        my husband, who has been there these three years

  magic_objects:

    obj_wise_folks_hazel_stick:
      name: Hans's Hazel-Stick
      object_kind: weapon
      attributes:
        function: threatened punishment that motivates the search for greater fools
      evidence: |
        his good hazel-stick

    obj_wise_folks_three_cows:
      name: The Three Cows
      object_kind: creature_object
      attributes:
        price: two hundred thalers
        function: sale property whose false pledge exposes Trina's folly
      evidence: |
        our three cows

    obj_wise_folks_smallest_cow:
      name: The Smallest Cow Kept as Security
      object_kind: creature_object
      attributes:
        function: mistaken pledge for the two cows already taken
      evidence: |
        I have kept the smallest

    obj_wise_folks_money_belt:
      name: The Forgotten Money-Belt
      object_kind: token
      attributes:
        function: excuse that lets the cattle-dealer remove two cows without paying
      evidence: |
        I have forgotten to buckle on my money-belt

    obj_wise_folks_purse:
      name: The Purse of Wheat Money
      object_kind: treasure
      attributes:
        function: money supposedly sent to the woman's dead husband in heaven
      evidence: |
        I will send that to him

    obj_wise_folks_horse:
      name: The Son's Horse
      object_kind: creature_object
      attributes:
        function: second profit gained by the false-heaven-message trick
      evidence: |
        He saddled the horse

  locations:

    loc_wise_folks_house:
      name: Hans and Trina's House
      instance_of: loc_house
      evidence: |
        When the peasant got home

    loc_wise_folks_byre:
      name: The Cow Byre
      instance_of: loc_stable
      threshold_type: threshold_doorway
      evidence: |
        drove them out of the byre

    loc_wise_folks_yard_door:
      name: The Yard-Door
      instance_of: loc_gate
      threshold_type: threshold_gate
      evidence: |
        going out of the yard-door

    loc_wise_folks_highway:
      name: The Great Highways
      instance_of: loc_road
      evidence: |
        went out into the great highways

    loc_wise_folks_heaven:
      name: The Imagined Heaven
      instance_of: loc_heaven
      threshold_type: threshold_gate
      evidence: |
        I have fallen down from heaven

    loc_wise_folks_willow_tree:
      name: The Willow-Tree Counting Place
      instance_of: loc_tree
      evidence: |
        sitting under a willow-tree

    loc_wise_folks_stable:
      name: Hans's Stable
      instance_of: loc_stable
      evidence: |
        put the horse in the stable


