propp:
  - { function: func_lack, order: 1, actor: pink_queen,
      scene: "the childless queen prays daily for a child" }
  - { function: func_prophecy, order: 2, actor: pink_angels,
      scene: "an angel announces that the queen will bear a son with the power of wishing" }
  - { function: func_villainy, order: 3, actor: pink_old_cook,
      scene: "the cook steals the child and fabricates blood evidence against the queen" }
  - { function: func_false_accusation, order: 4, actor: pink_old_cook,
      scene: "the cook accuses the queen of letting wild beasts take the child" }
  - { function: func_punishment_of_innocent, order: 5, actor: pink_king,
      scene: "the deceived king walls the queen into a sunless and moonless tower" }
  - { function: func_divine_aid, order: 6, actor: pink_angels,
      scene: "dove-shaped angels feed the queen throughout the seven years" }
  - { function: func_magical_creation, order: 7, actor: pink_kings_son,
      scene: "the boy wishes a palace, garden, and maiden companion into being" }
  - { function: func_villainous_command, order: 8, actor: pink_old_cook,
      scene: "the cook commands the maiden to murder the sleeping boy and bring his heart and tongue" }
  - { function: func_refusal, order: 9, actor: pink_maiden,
      scene: "the maiden refuses to shed innocent blood and substitutes a hind's heart and tongue" }
  - { function: func_punishment, order: 10, actor: pink_kings_son,
      scene: "the boy turns the cook into a coal-eating black poodle with a gold collar" }
  - { function: func_return, order: 11, actor: pink_kings_son,
      scene: "the son carries the maiden as a pink flower and returns to his own country" }
  - { function: func_recognition_preparation, order: 12, actor: pink_kings_son,
      scene: "the son reaches his mother by a wished ladder and enters his father's service as a strange huntsman" }
  - { function: func_demonstration, order: 13, actor: pink_kings_son,
      scene: "the strange huntsman summons game by wishing and earns a place beside the king" }
  - { function: func_exposure, order: 14, actor: pink_kings_son,
      scene: "the son reveals himself, vindicates the queen, and identifies the cook as the abductor" }
  - { function: func_restoration, order: 15, actor: pink_kings_son,
      scene: "the son restores the poodle to cook form and the pink flower to maiden form" }
  - { function: func_closure, order: 16, actor: pink_king,
      scene: "the queen dies faithfully, the cook is quartered, the grieving king dies, and the son marries the maiden" }


