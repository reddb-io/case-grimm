title: The Pink


entities:

  characters:

    pink_queen:
      name: The Queen
      species: sp_human
      agency_modes: [agency_endurance, agency_speech]
      existential_states: [state_imprisoned]
      speech_acts_performed: [speech_wish]
      affects: [affect_longing, affect_maternal_love]
      traits: [childless-praying-mother, angel-promised, blood-framed, tower-walled, dove-fed, faithful-to-god, restored-to-table, happy-dead]
      evidence: |
        Every morning she went into the garden and prayed to God in
        heaven to bestow on her a son or a daughter.

    pink_king:
      name: The King
      species: sp_human
      agency_modes: [agency_social_rank, agency_speech, agency_violence]
      existential_states: [state_deceived]
      speech_acts_performed: [speech_command]
      affects: [affect_grief]
      traits: [joyful-father, deceived-husband, tower-sentencer, feast-giver, truth-receiver, cook-punisher, grief-consumed]
      evidence: |
        When the King saw the blood on her apron, he believed this

    pink_kings_son:
      name: The King's Son
      archetypes: [arc_luck_child]
      species: sp_human
      agency_modes: [agency_speech, agency_cunning, agency_social_rank, agency_object_mediation]
      existential_states: [state_hidden_identity]
      speech_acts_performed: [speech_wish, speech_command, speech_testimony]
      affects: [affect_maternal_love, affect_loyalty]
      traits: [wish-powered-child, stolen-infant, palace-wisher, companion-wisher, cook-sentencer, poodle-maker, flower-carrier, ladder-wisher, strange-huntsman, game-summoner, mother-vindicator, bridegroom]
      evidence: |
        thou shalt have a son with the power of wishing, so that
        whatsoever in the world he wishes for, that shall he have.

    pink_old_cook:
      name: The Old Cook
      species: sp_human
      agency_modes: [agency_cunning, agency_violence, agency_speech, agency_domestic_labor]
      existential_states: [state_transformed, state_imprisoned]
      transformations: [transform_animal_human]
      speech_acts_performed: [speech_lie, speech_command]
      affects: [affect_fear]
      traits: [wish-power-knower, child-thief, blood-framer, false-accuser, hidden-nurse-controller, murder-plotter, poodle-punished, dungeon-cast, quartered]
      evidence: |
        Then came the old cook, who knew that the child had the power
        of wishing, and stole it away

    pink_maiden:
      name: The Wished-for Maiden
      species: sp_human
      agency_modes: [agency_endurance, agency_cunning, agency_speech, agency_object_mediation]
      existential_states: [state_transformed]
      speech_acts_performed: [speech_testimony]
      affects: [affect_loyalty, affect_fear]
      traits: [wish-created-companion, beloved, murder-refuser, hind-token-substituter, flower-carried, restored-maiden, bride]
      evidence: |
        Then the King’s son wished for one, and she immediately stood
        before him

    pink_angels:
      name: The Two White Dove-Angels
      species: sp_bird
      being_type: being_divine
      agency_modes: [agency_animal_aid, agency_object_mediation]
      traits: [white-dove-shaped, tower-feeders, grave-followers]
      evidence: |
        two angels from heaven in the shape of white doves

    pink_nurse:
      name: The Secret Nurse
      species: sp_human
      agency_modes: [agency_domestic_labor, agency_endurance]
      traits: [obliged-suckler, secret-place-carer]
      evidence: |
        a secret place, where a nurse was obliged to suckle it

    pink_marshal:
      name: The Marshal
      species: sp_human
      agency_modes: [agency_social_rank, agency_speech]
      speech_acts_performed: [speech_testimony]
      traits: [principal-servant, wish-prompted-questioner, queen-inquirer]
      evidence: |
        the marshal began, and said, “Your majesty, we live joyously
        here, but how is the Queen living in the tower?

    pink_huntsmen:
      name: The Huntsmen
      species: sp_human
      agency_modes: [agency_violence, agency_social_rank]
      traits: [forest-circle-makers, summoned-hunters, deer-shooters]
      evidence: |
        he summoned all the huntsmen together, and bade them go out
        into the forest with him.

  magic_objects:

    obj_pink_chicken_blood:
      name: The Chicken Blood on the Queen's Garments
      instance_of: obj_false_blood_evidence
      object_kind: material
      attributes:
        function: fabricated proof that the queen let the child be taken by beasts
      evidence: |
        dropped some of its blood on the Queen’s apron and on her dress.

    obj_pink_murder_knife:
      name: The Cook's Murder Knife
      object_kind: weapon
      attributes:
        function: ordered instrument for killing the innocent boy
      evidence: |
        plunge this knife into his heart

    obj_pink_hind_heart_tongue:
      name: The Hind's Heart and Tongue
      instance_of: obj_forensic_token
      object_kind: relic
      attributes:
        function: substitute body tokens that let the maiden refuse murder while deceiving the cook
      evidence: |
        took her heart and tongue, and laid them on a plate

    obj_pink_gold_collar:
      name: The Gold Collar
      object_kind: treasure
      attributes:
        function: visible mark of the cook's punitive poodle form
      evidence: |
        have a gold collar round thy neck

    obj_pink_live_coals:
      name: The Live Coals
      object_kind: material
      attributes:
        function: punitive food forced on the transformed cook
      evidence: |
        the cooks were ordered to bring up some live coals

    obj_pink_flower:
      name: The Pink Flower
      object_kind: token
      attributes:
        function: portable transformed form of the beloved maiden
      evidence: |
        changed into a beautiful pink

    obj_pink_ladder:
      name: The Wished Ladder
      object_kind: tool
      attributes:
        function: vertical access to the sealed tower
      evidence: |
        wished for a ladder which would reach up to the very top.

  locations:

    loc_pink_prayer_garden:
      name: The Queen's Prayer Garden
      instance_of: loc_garden
      evidence: |
        Every morning she went into the garden and prayed to God in
        heaven

    loc_pink_clear_stream:
      name: The Clear Stream
      instance_of: loc_river
      evidence: |
        washed herself there in a clear stream.

    loc_pink_secret_place:
      name: The Cook's Secret Place
      instance_of: loc_house
      evidence: |
        Then he carried the child away to a secret place

    loc_pink_queen_tower:
      name: The Sunless and Moonless Tower
      instance_of: loc_tower
      evidence: |
        a high tower to be built, in which neither sun nor moon could
        be seen

    loc_pink_wished_palace:
      name: The Wished Palace and Garden
      instance_of: loc_castle
      evidence: |
        Wish for a beautiful palace for thyself with a garden

    loc_pink_forest_hunt:
      name: The Forest Hunting Circle
      instance_of: loc_forest
      threshold_type: threshold_forest
      evidence: |
        go out into the forest with him.

    loc_pink_royal_table:
      name: The Royal Table
      instance_of: loc_castle
      evidence: |
        he was able to deck his table with game

    loc_pink_deepest_dungeon:
      name: The Deepest Dungeon
      instance_of: loc_dungeon
      evidence: |
        ordered him to be cast into the deepest dungeon.

    loc_pink_grave:
      name: The Queen's Grave
      instance_of: loc_tomb
      evidence: |
        followed her body and seated themselves on her grave.


