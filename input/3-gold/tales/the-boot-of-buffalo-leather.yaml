      scene: "the soldier enters despite warning because hunger or murder seem equivalent" }
  - { function: func_robber_feast, order: 5, actor: buffalo_boot_twelve_robbers,
      scene: "twelve robbers burst in and eat roast meat at the laid table" }
  - { function: func_table_intrusion, order: 6, actor: buffalo_boot_soldier,
      scene: "the soldier coughs, exposes himself, and demands food before execution" }
  - { function: func_petrifying_toast, order: 7, actor: buffalo_boot_soldier,
      victim: buffalo_boot_twelve_robbers,
      scene: "the soldier brandishes the bottle and freezes the robbers in toast posture" }
  - { function: func_booty_delay, order: 8, actor: buffalo_boot_soldier,
      scene: "the soldier eats and drinks through the night while the robbers remain fixed" }
  - { function: func_military_arrest, order: 9, actor: buffalo_boot_old_comrades,
      victim: buffalo_boot_twelve_robbers,
      scene: "old comrades bind the revived robbers and drive them to prison" }
