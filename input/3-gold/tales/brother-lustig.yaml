title: Brother Lustig


entities:

  characters:

    brother_lustig:
      name: Brother Lustig
      archetypes: [arc_discharged_soldier, arc_trickster]
      species: sp_human
      agency_modes: [agency_cunning, agency_speech, agency_object_mediation, agency_violence, agency_endurance]
      speech_acts_performed: [speech_lie, speech_wish, speech_command]
      affects: [affect_hunger, affect_greed, affect_fear, affect_anger]
      traits: [dismissed-soldier, bread-sharer, saint-companion, lamb-heart-eater, heart-denier, gold-confessor, failed-resurrector, wish-knapsack-owner, goose-thief, devil-trapper, hell-refused, heaven-trickster]
      evidence: |
        Then Brother Lustig also received his dismissal

    brother_lustig_st_peter:
      name: St. Peter
      archetypes: [arc_supernatural_donor, arc_wise_helper]
      species: sp_human
      being_type: being_divine
      agency_modes: [agency_speech, agency_cunning, agency_object_mediation, agency_endurance]
      speech_acts_performed: [speech_command]
      traits: [beggar-disguised, soldier-disguised, healer, resurrector, lamb-heart-tester, rescuer-of-failed-imitation, wish-knapsack-giver, heaven-doorkeeper]
      evidence: |
        St. Peter had, however, placed himself in his way in the shape
        of a poor beggar

    brother_lustig_peasant_couple:
      name: The Sick Peasant and His Wife
      species: sp_human
      agency_modes: [agency_speech, agency_domestic_labor]
      affects: [affect_grief]
      traits: [deathbed-household, loudly-lamenting, healed, lamb-offering]
      evidence: |
        the husband was lying sick unto death, and very near his end,
        and his wife was crying and weeping quite loudly.

    brother_lustig_first_king:
      name: The First King
      species: sp_human
      agency_modes: [agency_social_rank, agency_speech]
      affects: [affect_grief]
      traits: [dead-daughter-father, half-kingdom-offerer, treasurer-orderer]
      evidence: |
        Then they went to the royal palace, where every one was in
        great grief

    brother_lustig_first_princess:
      name: The First Dead Princess
      species: sp_human
      existential_states: [state_liminal_dead]
      traits: [dead-daughter, dismembered-boiled, bone-ordered, trinity-raised, healthy-and-beautiful]
      evidence: |
        the princess arose, living, healthy and beautiful.

    brother_lustig_second_king:
      name: The Second King
      species: sp_human
      agency_modes: [agency_social_rank, agency_speech]
      traits: [dead-daughter-father, councillor-consulter, reward-offerer, knapsack-filler]
      evidence: |
        he consulted his councillors first

    brother_lustig_second_princess:
      name: The Second Dead Princess
      species: sp_human
      existential_states: [state_liminal_dead]
      traits: [dead-daughter, wrongly-boned, rescued-by-peter, restored]
      evidence: |
        his daughter was dead

    brother_lustig_journeymen:
      name: The Two Journeymen
      species: sp_human
      agency_modes: [agency_speech, agency_endurance]
      affects: [affect_hunger]
      traits: [hungry-eyed, gifted-goose-eaters, falsely-accused, cudgelled]
      evidence: |
        two journeymen came up and looked at the second goose

    brother_lustig_landlord:
      name: The Goose Inn Landlord
      species: sp_human
      agency_modes: [agency_social_rank, agency_violence, agency_speech]
      affects: [affect_anger]
      traits: [goose-owner, theft-accuser, hazel-stick-threatener, journeymen-beater]
      evidence: |
        The landlord ran thither, and behold the oven was empty!

    brother_lustig_castle_host:
      name: The Haunted Castle Host
      species: sp_human
      agency_modes: [agency_speech, agency_social_rank]
      traits: [lodging-refuser, castle-warning-host, key-giver]
      evidence: |
        no one who has tried it so far, has ever come out of it alive.

    brother_lustig_nobleman:
      name: The Nobleman Who Owns the Castle
      species: sp_human
      agency_modes: [agency_social_rank, agency_speech]
      traits: [castle-owner, astonished-witness, reward-giver]
      evidence: |
        the nobleman to whom the castle belonged

    brother_lustig_nine_devils:
      name: The Nine Devils
      being_type: being_devil
      agency_modes: [agency_violence, agency_speech]
      affects: [affect_fear]
      traits: [haunting-dancers, hair-tearers, knapsack-trapped, smithy-hammered, eight-dead-one-escaped]
      evidence: |
        he saw nine ugly devils in the room

    brother_lustig_ninth_devil:
      name: The Escaped Ninth Devil
      being_type: being_devil
      agency_modes: [agency_speech, agency_cunning]
      affects: [affect_fear]
      traits: [black-eyed-survivor, hell-doorkeeper, knapsack-warning-speaker]
      evidence: |
        one which had been lying in a fold of it, was still alive

    brother_lustig_smiths:
      name: The Smith and His Apprentices
      species: sp_human
      agency_modes: [agency_violence, agency_domestic_labor, agency_object_mediation]
      traits: [anvil-workers, hammer-strikers, devil-punishers]
      evidence: |
        asked the smith and his apprentices to strike it.

    brother_lustig_hermit:
      name: The Pious Hermit
      species: sp_human
      agency_modes: [agency_speech]
      traits: [road-adviser, heaven-hell-path-explainer]
      evidence: |
        a hermit who was known to be a pious man

  magic_objects:

    obj_brother_lustig_bread_coins:
      name: The Contract-Bread and Four Kreuzers
      object_kind: food
      attributes:
        function: discharge provision shared with St. Peter's beggar forms
      evidence: |
        nothing but a small loaf of contract-bread, and four kreuzers
        in money

    obj_brother_lustig_healing_salve:
      name: St. Peter's Healing Salve
      object_kind: material
      attributes:
        function: medicine that cures the dying peasant at once
      evidence: |
        he took a salve out of his pocket

    obj_brother_lustig_lamb:
      name: The Reward Lamb
      object_kind: food
      attributes:
        function: reward animal carried, cooked, and eaten by Brother Lustig
      evidence: |
        the woman brought a lamb

    obj_brother_lustig_lamb_heart:
      name: The Lamb's Heart
      object_kind: food
      attributes:
        function: best part secretly eaten and later confessed for a gold share
      evidence: |
        found the heart.

    obj_brother_lustig_kettle:
      name: The Resurrection Kettle and Water
      object_kind: tool
      attributes:
        function: vessel used to boil dead bodies before bone-order resurrection
      evidence: |
        Bring me a kettle and some water

    obj_brother_lustig_ordered_bones:
      name: The Correctly Ordered White Bones
      object_kind: relic
      attributes:
        function: anatomical arrangement required before resurrection speech works
      evidence: |
        arranged them together in their natural order.

    obj_brother_lustig_confused_bones:
      name: The Confused Bones
      object_kind: relic
      attributes:
        function: failed imitation of resurrection because the bones are placed wrongly
      evidence: |
        placed them all wrong and in confusion.

    obj_brother_lustig_knapsack:
      name: Brother Lustig's Wish-Knapsack
      instance_of: obj_wish_knapsack
      object_kind: tool
      attributes:
        function: container that receives wished geese, devils, and Brother Lustig himself
      evidence: |
        whatsoever thou wishest to have inside it, shall be there.

    obj_brother_lustig_two_geese:
      name: The Two Roasted Geese
      object_kind: food
      attributes:
        function: inn food wished into the knapsack and passed to hungry journeymen
      evidence: |
        two geese standing in the oven

    obj_brother_lustig_castle_key:
      name: The Haunted Castle Key
      object_kind: tool
      attributes:
        function: access object for the castle night with the devils
      evidence: |
        just give me the key

    obj_brother_lustig_chair_leg:
      name: The Chair Leg
      object_kind: weapon
      attributes:
        function: improvised weapon used before the devils are wished into the knapsack
      evidence: |
        got the leg of a chair and struck out

  locations:

    loc_brother_lustig_road:
