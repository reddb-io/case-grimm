    loc_brother_lustig_peasant_house:
      name: The Lamenting Peasant House
      instance_of: loc_house
      evidence: |
        they came to a peasant’s house

    loc_brother_lustig_lamb_wood:
      name: The Lamb-Cooking Wood
      instance_of: loc_forest
      evidence: |
        they departed and came to a wood

    loc_brother_lustig_test_stream:
      name: The Rising Water Test
      instance_of: loc_river
