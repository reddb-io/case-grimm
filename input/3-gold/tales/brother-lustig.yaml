      evidence: |
        Then they went to the royal palace

    loc_brother_lustig_second_palace:
      name: The Second Royal Palace
      instance_of: loc_castle
      evidence: |
        he went to the King, and offered to raise the dead girl to life again

    loc_brother_lustig_goose_inn:
      name: The Goose Inn
      instance_of: loc_inn
      threshold_type: threshold_doorway
