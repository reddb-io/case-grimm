propp:
  - { function: func_initial_situation, order: 1, actor: old_hildebrand_parson,
      scene: "The parson and Hildebrand's wife desire a day alone together.",
      evidence: "had wished for a long while to spend a whole day happily with her" }
  - { function: func_trickery, order: 2, actor: old_hildebrand_parson,
      scene: "The parson designs a false illness and sermon-pilgrimage to send Hildebrand away.",
      evidence: "I have now thought of a way" }
  - { function: func_complicity, order: 3, actor: old_hildebrand_wife,
      scene: "The wife agrees and takes to bed, performing illness until Sunday.",
      evidence: "took to her bed, and complained and lamented as agreed on" }
  - { function: func_false_preaching, order: 4, actor: old_hildebrand_parson,
      scene: "The parson preaches that a pilgrimage to Göckerli hill will cure sick family members.",
      evidence: "the sick child, sick husband, sick wife, sick father, sick mother, sick sister, brother, or whosoever else it might be, would be restored to health instantly" }
  - { function: func_departure, order: 5, actor: old_hildebrand_hildebrand,
      scene: "Hildebrand leaves with the bag and kreuzer to cure his supposedly sick wife.",
      evidence: "will at once begin my journey so that thou mayst get well the faster" }
  - { function: func_exposure_helper, order: 6, actor: old_hildebrand_gossip,
      scene: "The egg-merchant explains the parson's real purpose and offers to carry Hildebrand home hidden in the basket.",
      evidence: "The parson wants to spend a whole day alone with your wife" }
  - { function: func_hidden_return, order: 7, actor: old_hildebrand_gossip,
      scene: "The gossip puts Hildebrand in the egg-basket and carries him home.",
      evidence: "put the peasant into his egg-basket and carried him home" }
  - { function: func_witnessing, order: 8, actor: old_hildebrand_hildebrand,
      scene: "At home the wife and parson feast, play fiddle, and sing over Hildebrand's absence.",
      evidence: "The parson, however, and the woman, were as merry as possible" }
  - { function: func_exposure_song, order: 9, actor: old_hildebrand_gossip,
      scene: "The gossip sings to Hildebrand in the basket, prompting the hidden husband to reveal himself.",
      evidence: "What art thou doing, my Hildebrand dear" }
  - { function: func_punishment, order: 10, actor: old_hildebrand_hildebrand,
      scene: "Hildebrand climbs from the basket and cudgels the parson out of the house.",
      evidence: "cudgelled the parson out of the house" }


