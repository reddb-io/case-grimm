# yaml-language-server: $schema=../schemas/tale.schema.json

slug: hansel-and-gretel
khm: 15
atu: 327A
atu_name: Hansel and Gretel
canonical_source: ../../2-silver/canonical/hansel-and-gretel/canonical.txt
title: Hansel and Gretel


entities:

  characters:

    hansel:
      name: Hansel
      archetypes: [arc_abandoned_child, arc_youngest_sibling]
      species: sp_human
      agency_modes: [agency_cunning, agency_speech, agency_endurance]
      existential_states: [state_trapped]
      affects: [affect_fear, affect_loyalty]
      traits: [pebble-planner, breadcrumb-planner, sister-comforter, bone-trickster, treasure-taker]
      evidence: |
        "Be quiet, Grethel... I will soon find a way to help us."

    gretel:
      name: Gretel / Grethel
      archetypes: [arc_abandoned_child]
      species: sp_human
      agency_modes: [agency_cunning, agency_endurance, agency_violence, agency_speech]
      affects: [affect_fear, affect_loyalty, affect_grief]
      traits: [crying-child, bread-sharer, forced-cook, oven-trickster, rescuer]
      evidence: |
        "But Grethel saw what she had in her mind" and pushes the witch
        into the oven.

    hansel_gretel_father:
      name: The Poor Woodcutter Father
      species: sp_human
      agency_modes: [agency_endurance, agency_speech]
      affects: [affect_grief, affect_shame]
      traits: [poor, anxious, reluctant-abandoner, later-rejoicing]
      evidence: |
        "But I feel very sorry for the poor children, all the same."

    hansel_gretel_stepmother:
      name: The Stepmother / Wife
      archetypes: [arc_cruel_stepmother]
      species: sp_human
      agency_modes: [agency_social_rank, agency_speech, agency_cunning]
      affects: [affect_fear, affect_anger]
      traits: [famine-rationalizing, abandonment-planner, door-locker, dead-before-return]
      evidence: |
        "we will take the children out into the forest... and leave
         them alone."

    hansel_gretel_witch:
      name: The Cannibal Witch in the Edible House
      archetypes: [arc_predator]
      species: sp_human
      being_type: being_witch
      agency_modes: [agency_cunning, agency_violence, agency_speech]
      speech_acts_performed: [speech_lie, speech_command]
      affects: [affect_greed]
      traits: [child-eater, red-eyed, keen-scented, false-hospitable, oven-killed]
      evidence: |
        "she was in reality a wicked witch, who lay in wait for children"

    hansel_gretel_white_bird:
      name: The Snow-White Bird (guide to edible house)
      archetypes: [arc_animal_helper]
      species: sp_bird
      agency_modes: [agency_animal_aid, agency_music]
      traits: [song-guide, forest-leading, ambiguous-helper]
      evidence: |
        "a beautiful snow-white bird... sang so delightfully" and led
        them to the little house.

    hansel_gretel_duck:
      name: The White Duck (water-crossing helper)
      archetypes: [arc_animal_helper]
      species: sp_bird
      agency_modes: [agency_animal_aid]
      traits: [river-ferry, one-at-a-time-carrier]
      evidence: |
        "The good little duck did so" and carried the children across.

    hansel_gretel_birds:
      name: The Forest Birds (breadcrumb-eaters)
      species: sp_bird
      agency_modes: [agency_animal_aid]
      traits: [many, forest-foraging, trail-destroying]
      evidence: |
        "the many thousands of birds which fly about in the woods and
         fields had picked them all up."

  magic_objects:

    obj_white_pebbles_trail:
      name: The White Pebble Trail
      object_kind: trail
      attributes:
        function: moonlit return path after first abandonment
      evidence: |
        "followed the pebbles which shone like newly-coined silver
         pieces, and showed them the way."

    obj_breadcrumb_trail:
      name: The Breadcrumb Trail
      object_kind: trail
      attributes:
        function: intended return path; eaten by birds
      evidence: |
        "Hansel... threw all the crumbs on the path."

    obj_witch_edible_house_hansel_gretel:
      name: The Witch's Edible House
      instance_of: obj_edible_house
      object_kind: architecture
      attributes:
        roof: bread and cakes
        windows: clear sugar
        function: hunger-lure for children
      evidence: |
        "built of bread and covered with cakes, but that the windows
         were of clear sugar."

    obj_witch_oven:
      name: The Witch's Heated Oven
      object_kind: architecture
      attributes:
        intended_victim: gretel
        actual_victim: hansel_gretel_witch
      evidence: |
        "I have already heated the oven, and kneaded the dough."

    obj_hansel_bone:
      name: Hansel's Little Bone (false finger)
      object_kind: tool
      attributes:
        function: deceives dim-eyed witch about his fatness
      evidence: |
        "Hansel, however, stretched out a little bone to her"

    obj_witch_treasure:
      name: The Witch's Pearls and Jewels
      object_kind: treasure
      attributes:
        function: return wealth ending family scarcity
      evidence: |
        "in every corner there stood chests full of pearls and jewels."

  locations:

    loc_house_hansel_gretel:
      name: The Woodcutter's House
      instance_of: loc_house
      evidence: |
        "Hard by a great forest dwelt a poor wood-cutter with his wife
         and his two children."

    loc_forest_hansel_gretel:
      name: The Great Forest of Abandonment
      instance_of: loc_forest
      threshold_type: threshold_forest
      evidence: |
        "we will take the children out into the forest to where it is
         the thickest"

    loc_fire_abandonment:
      name: The Forest Fire Where the Children Are Left
      instance_of: loc_forest
      evidence: |
        "Now, children, lay yourselves down by the fire and rest"

    loc_witch_house_hansel_gretel:
      name: The Witch's Little House
      instance_of: loc_house
      attributes:
        edible_form: obj_witch_edible_house_hansel_gretel
      evidence: |
        "they reached a little house, on the roof of which it alighted"

    loc_hansel_stable:
      name: Hansel's Grated Stable Prison
      instance_of: loc_house
      evidence: |
        "carried him into a little stable, and shut him in with a
         grated door."

    loc_water_crossing_hansel_gretel:
      name: The Great Piece of Water
      instance_of: loc_river
      evidence: |
        "they came to a great piece of water. 'We cannot get over'"


classifications:

  world_laws:
    - law_forest_suspends_domestic_order

  moral_regimes:
    - moral_retributive
    - moral_restorative

  agency_modes_dominant:
    - agency_cunning
    - agency_endurance
    - agency_violence

  affects_driving:
    - affect_fear
    - affect_grief
    - affect_greed

  symbol_numbers:
    - num_2   # sibling pair; two abandonment attempts; duck carries one after the other
    - num_3   # three mornings after leaving home

  threshold_types:
    - threshold_forest


propp:
  - { function: func_lack, order: 1, actor: hansel_gretel_father,
      scene: "great scarcity leaves family without daily bread" }
  - { function: func_villainy, order: 2, actor: hansel_gretel_stepmother,
      scene: "stepmother plans to abandon the children in the forest" }
  - { function: func_departure, order: 3, actor: hansel,
      scene: "first forest abandonment; Hansel drops moonlit pebbles" }
  - { function: func_return, order: 4, actor: hansel,
      scene: "children follow pebbles home by moonlight" }
  - { function: func_villainy, order: 5, actor: hansel_gretel_stepmother,
      scene: "second abandonment deeper in forest after door is locked" }
  - { function: func_violation, order: 6, actor: hansel_gretel_birds,
      scene: "birds eat breadcrumb trail and children are lost" }
  - { function: func_mediation, order: 7, actor: hansel_gretel_white_bird,
      scene: "white bird leads starving children to edible house" }
  - { function: func_trickery, order: 8, actor: hansel_gretel_witch,
      scene: "witch pretends kindness and feeds the children" }
  - { function: func_villainy, order: 9, actor: hansel_gretel_witch,
      scene: "witch imprisons Hansel, fattens him, and forces Gretel to cook" }
  - { function: func_struggle, order: 10, actor: gretel,
      scene: "Gretel tricks witch into showing the oven and pushes her in" }
  - { function: func_rescue, order: 11, actor: gretel,
      scene: "Gretel opens Hansel's stable and frees him" }
  - { function: func_liquidation, order: 12, actor: hansel,
      scene: "children take witch's treasure and escape the witch's forest" }
  - { function: func_return, order: 13, actor: hansel_gretel_duck,
      scene: "white duck ferries children over water toward home" }
  - { function: func_recognition, order: 14, actor: hansel_gretel_father,
      scene: "children return to father; stepmother is dead; anxiety ends" }


edges:

  # Famine household and first abandonment
  - { from: hansel_gretel_stepmother, to: hansel, label: PLANS_ABANDONMENT_OF,
      evidence: "we will take the children out into the forest... and leave them alone." }
  - { from: hansel_gretel_stepmother, to: gretel, label: PLANS_ABANDONMENT_OF,
      evidence: "They will not find the way home again, and we shall be rid of them." }
  - { from: hansel_gretel_father, to: hansel_gretel_stepmother, label: YIELDS_TO,
      evidence: "she left him no peace until he consented." }
  - { from: hansel, to: obj_white_pebbles_trail, label: GATHERS,
      evidence: "put as many of them in the little pocket of his coat as he could possibly get in." }
  - { from: hansel, to: obj_white_pebbles_trail, label: LAYS_TRAIL,
      evidence: "throwing one of the white pebble-stones out of his pocket on the road." }
  - { from: obj_white_pebbles_trail, to: hansel, label: GUIDES_HOME,
      evidence: "followed the pebbles which shone... and showed them the way." }
  - { from: obj_white_pebbles_trail, to: gretel, label: GUIDES_HOME,
      evidence: "by break of day came once more to their father's house." }

  # Second abandonment and failed breadcrumb trail
  - { from: hansel_gretel_stepmother, to: hansel, label: LOCKS_IN,
      evidence: "the woman had locked the door, and Hansel could not get out." }
  - { from: hansel, to: obj_breadcrumb_trail, label: LAYS_TRAIL,
      evidence: "little by little, threw all the crumbs on the path." }
  - { from: hansel_gretel_birds, to: obj_breadcrumb_trail, label: EATS,
      evidence: "the many thousands of birds... had picked them all up." }
  - { from: hansel_gretel_stepmother, to: hansel, label: ABANDONS_IN,
      attributes: { location: loc_forest_hansel_gretel },
      evidence: "we are going into the forest to cut wood... we will come and fetch you away." }
  - { from: hansel_gretel_stepmother, to: gretel, label: ABANDONS_IN,
      attributes: { location: loc_forest_hansel_gretel },
      evidence: "evening came and went, but no one came to the poor children." }

  # Bird guide and edible house
  - { from: hansel_gretel_white_bird, to: hansel, label: GUIDES,
      evidence: "flew away before them, and they followed it until they reached a little house" }
  - { from: hansel_gretel_white_bird, to: gretel, label: GUIDES,
      evidence: "flew away before them, and they followed it until they reached a little house" }
  - { from: obj_witch_edible_house_hansel_gretel, to: hansel, label: LURES,
      evidence: "I will eat a bit of the roof" }
  - { from: obj_witch_edible_house_hansel_gretel, to: gretel, label: LURES,
      evidence: "thou, Grethel, canst eat some of the window" }
  - { from: hansel_gretel_witch, to: hansel, label: DECEIVES,
      evidence: "Do come in, and stay with me. No harm shall happen to you." }
  - { from: hansel_gretel_witch, to: gretel, label: DECEIVES,
      evidence: "The old woman had only pretended to be so kind" }

  # Captivity and counter-trick
  - { from: hansel_gretel_witch, to: hansel, label: IMPRISONS,
      evidence: "carried him into a little stable, and shut him in with a grated door." }
  - { from: hansel_gretel_witch, to: gretel, label: COMMANDS,
      evidence: "fetch some water, and cook something good for thy brother" }
  - { from: hansel, to: hansel_gretel_witch, label: DECEIVES,
      attributes: { object: obj_hansel_bone },
      evidence: "Hansel, however, stretched out a little bone to her" }
  - { from: hansel_gretel_witch, to: gretel, label: TRIES_TO_BAKE,
      attributes: { object: obj_witch_oven },
      evidence: "when once Grethel was inside, she intended to shut the oven and let her bake in it" }
  - { from: gretel, to: hansel_gretel_witch, label: DECEIVES,
      evidence: "I do not know how I am to do it; how do you get in?" }
  - { from: gretel, to: hansel_gretel_witch, label: KILLS,
      attributes: { instrument: obj_witch_oven },
      evidence: "gave her a push that drove her far into it, and shut the iron door" }
  - { from: gretel, to: hansel, label: RESCUES,
      evidence: "ran like lightning to Hansel, opened his little stable" }

  # Treasure and return
  - { from: hansel, to: obj_witch_treasure, label: TAKES,
      evidence: "thrust into his pockets whatever could be got in" }
  - { from: gretel, to: obj_witch_treasure, label: TAKES,
      evidence: "filled her pinafore full." }
  - { from: hansel_gretel_duck, to: hansel, label: FERRIES,
      evidence: "The good little duck did so" }
  - { from: hansel_gretel_duck, to: gretel, label: FERRIES,
      evidence: "she shall take us across, one after the other." }
  - { from: hansel, to: hansel_gretel_father, label: RETURNS_TO,
      evidence: "rushed into the parlour, and threw themselves into their father's arms." }
  - { from: gretel, to: hansel_gretel_father, label: RETURNS_TO,
      evidence: "rushed into the parlour, and threw themselves into their father's arms." }
  - { from: obj_witch_treasure, to: hansel_gretel_father, label: ENDS_SCARCITY_FOR,
      evidence: "Then all anxiety was at an end, and they lived together in perfect happiness." }
