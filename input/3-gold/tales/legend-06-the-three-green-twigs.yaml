    green_twigs_angel:
      name: The Angel of God
      being_type: being_divine
      archetypes: [arc_supernatural_donor]
      agency_modes: [agency_speech, agency_object_mediation]
      speech_acts_performed: [speech_command]
      traits: [visible-helper, step-counter, food-bringer, penance-giver, dry-branch-bearer]
