propp:
  - { function: func_pious_service, order: 1, actor: green_twigs_hermit,
      scene: "the hermit carries water up the mountain and receives visible angelic aid" }
  - { function: func_sinful_judgment, order: 2, actor: green_twigs_hermit,
      scene: "the hermit condemns a poor sinner being led to the gallows" }
  - { function: func_grace_withdrawn, order: 3, actor: green_twigs_angel,
      victim: green_twigs_hermit,
      scene: "the angel and food disappear until the hermit understands his sin" }
  - { function: func_penance_imposed, order: 4, actor: green_twigs_angel,
      beneficiary: green_twigs_hermit,
      scene: "the angel commands him to carry dry wood until three green twigs sprout" }
  - { function: func_testimony_converts, order: 5, actor: green_twigs_hermit,
      beneficiary: green_twigs_three_robbers,
      scene: "the hermit's account of one sinful word moves the robbers to repentance" }
  - { function: func_penance_fulfilled, order: 6, actor: obj_green_twigs_dry_branch,
      scene: "the dry branch grows three green twigs after the hermit dies" }

edges:
