  - { from: green_twigs_angel, to: green_twigs_hermit, label: FEEDS,
      evidence: "brought him his food" }
  - { from: green_twigs_hermit, to: green_twigs_gallows_road, label: SEES_SINNER_AT,
      evidence: "being taken to the gallows" }
  - { from: green_twigs_hermit, to: law_judgment_word_interrupts_visible_grace, label: TRIGGERS,
      evidence: "There, that one is getting his deserts!" }
  - { from: green_twigs_bird, to: green_twigs_hermit, label: INTERPRETS_SIN_FOR,
      evidence: "Thou hast done injustice" }
  - { from: green_twigs_bird, to: moral_mercy_over_judgment, label: TEACHES,
      evidence: "He alone sits in judgement" }
  - { from: green_twigs_angel, to: obj_green_twigs_dry_branch, label: GIVES_AS_PENANCE,
      evidence: "dry branch in his hand" }
  - { from: green_twigs_hermit, to: green_twigs_three_robbers, label: CONVERTS_BY_TESTIMONY,
      evidence: "began with hearty repentance to do penance for it" }
  - { from: obj_green_twigs_dry_branch, to: law_dry_branch_sprouts_when_penance_converts_sinners, label: MANIFESTS,
      evidence: "three green twigs had grown up on high" }
  - { from: green_twigs_hermit, to: moral_repentance, label: RECEIVED_INTO_FAVOUR_BY,
      evidence: "Thus the Lord had once more received him into his favour" }
