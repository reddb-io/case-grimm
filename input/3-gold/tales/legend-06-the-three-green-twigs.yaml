      name: The Three Robber Sons
      species: sp_human
      archetypes: [arc_repentant_sinner]
      agency_modes: [agency_speech]
      affects: [affect_fear, affect_grief]
      traits: [wicked, wild, robbers, cave-returning, testimony-touched, penitent]
      evidence: |
