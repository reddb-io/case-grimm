propp:
  - { function: func_character_exposition, order: 1, actor: master_pfriem,
      scene: "Pfriem is introduced as a restless shoemaker who criticizes everything" }
  - { function: func_domestic_faultfinding, order: 2, actor: master_pfriem,
      scene: "he scolds apprentices, wife, servants, builders, carpenters, and peasants" }
  - { function: func_corrective_exposure, order: 3, actor: pfriem_apprentice,
      scene: "the apprentice reveals that the badly cut shoe is Pfriem's own work" }
  - { function: func_dream_death, order: 4, actor: master_pfriem,
      scene: "Pfriem dreams he is dead and on the way to heaven" }
  - { function: func_conditional_admission, order: 5, actor: pfriem_saint_peter,
      scene: "Saint Peter admits him but warns him to find fault with nothing in heaven" }
  - { function: func_suppressed_criticism, order: 6, actor: master_pfriem,
      scene: "Pfriem silently judges the beam, bucket, and cart while restraining his tongue" }
  - { function: func_failed_restraint, order: 7, actor: master_pfriem,
      scene: "the backward harnessing of horses makes Pfriem burst out in criticism" }
  - { function: func_expulsion, order: 8, actor: pfriem_heaven_inhabitant,
      scene: "an inhabitant of heaven seizes Pfriem and pushes him forth" }
  - { function: func_hidden_order_revealed, order: 9, actor: pfriem_winged_horses,
      scene: "Pfriem sees the cart rise into the air by four winged horses" }
  - { function: func_waking_nonreform, order: 10, actor: master_pfriem,
      scene: "Pfriem wakes, excuses heaven somewhat, but remains ready to correct his household" }


