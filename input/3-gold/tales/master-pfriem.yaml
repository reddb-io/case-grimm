title: Master Pfriem


entities:

  characters:

    master_pfriem:
      name: Master Pfriem
      species: sp_human
      archetypes: [arc_fool]
      agency_modes: [agency_speech, agency_domestic_labor, agency_violence]
      affects: [affect_anger, affect_pride]
      traits: [short-thin-lively, restless, shoemaker, universal-critic, always-right, dream-dead, heaven-expelled, unreformed-faultfinder]
      evidence: |
        He saw everything, criticised everything, knew everything best

    pfriem_apprentice:
      name: Pfriem's Apprentice
      species: sp_human
      agency_modes: [agency_domestic_labor, agency_speech]
      traits: [shoemaking-apprentice, criticized-worker, beaten-worker, truth-speaker]
      evidence: |
        No apprentice stayed more than a month with him

    pfriem_household_workers:
      name: Pfriem's Wife and Servants
      species: sp_human
      agency_modes: [agency_domestic_labor]
      traits: [fire-lighters, washing-workers, gossiping-servants, scolded-household]
      evidence: |
        If the servants were standing by their wash-tubs

    pfriem_builders:
      name: The Builders and Carpenters
      species: sp_human
      agency_modes: [agency_domestic_labor]
      traits: [house-builders, stone-layers, carpenters, conscience-appealed-workers]
      evidence: |
        Someone was building a new house

    pfriem_saint_peter:
      name: Saint Peter
      being_type: being_divine
      agency_modes: [agency_social_rank, agency_speech]
      speech_acts_performed: [speech_warning]
      traits: [heaven-door-opener, admission-giver, warning-speaker]
      evidence: |
        The apostle Peter opened the door

    pfriem_angels:
      name: The Angels at Work in Heaven
      being_type: being_divine
      agency_modes: [agency_domestic_labor, agency_object_mediation]
      traits: [beam-carriers, rain-waterers, cart-helpers, hidden-order-workers]
      evidence: |
        he saw two angels who were carrying away a beam

    pfriem_good_wishes_man:
      name: The Man with the Cart of Good Wishes
      species: sp_human
      agency_modes: [agency_speech, agency_endurance]
      traits: [stuck-cart-keeper, good-wishes-carrier, safely-arrived]
      evidence: |
        Good wishes

    pfriem_winged_horses:
      name: The Four Winged Horses
      species: sp_horse
      agency_modes: [agency_extraordinary_body]
      traits: [four, winged, heavenly-cart-lifters, hidden-solution]
      evidence: |
        four winged horses

    pfriem_heaven_inhabitant:
      name: The Inhabitant of Heaven
      being_type: being_divine
      agency_modes: [agency_violence, agency_social_rank]
      traits: [irresistible-expeller, throat-seizer, heaven-boundary-enforcer]
      evidence: |
        one of the inhabitants of heaven seized him by the throat

  magic_objects:

    obj_pfriem_heavenly_beam:
      name: The Obliquely Carried Beam
      object_kind: material
      attributes:
        function: apparent heavenly mistake that tests Pfriem's restraint
      evidence: |
        It was the beam which some one had had in his own eye

    obj_pfriem_leaky_bucket:
      name: The Leaky Rain Bucket
      object_kind: tool
      attributes:
        function: heavenly rain-making work that looks useless to Pfriem
      evidence: |
        the bucket was full of holes

    obj_pfriem_good_wishes_cart:
      name: The Cart of Good Wishes
      object_kind: tool
      attributes:
        cargo: good wishes
        problem: stuck fast in a deep hole
      evidence: |
        a cart which had stuck fast in a deep hole

  locations:

