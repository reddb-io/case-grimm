propp:
  - { function: func_initial_situation, order: 1, actor: jorinda_joringel_witch,
      scene: "a witch dwells alone in a castle whose circle immobilizes intruders and turns maidens into birds" }
  - { function: func_initial_situation, order: 2, actor: jorinda_joringel_jorinda,
      scene: "Jorinda and Joringel are betrothed and happy together" }
  - { function: func_interdiction, order: 3, actor: jorinda_joringel_joringel,
      scene: "Joringel warns Jorinda not to go too near the castle" }
  - { function: func_violation, order: 4, actor: jorinda_joringel_jorinda,
      scene: "the betrothed pair lose their way and come close to the castle walls" }
  - { function: func_villainy, order: 5, actor: jorinda_joringel_witch,
      victim: jorinda_joringel_jorinda,
      scene: "the witch changes Jorinda into a nightingale and carries her away" }
  - { function: func_villainy, order: 6, actor: law_enchanted_perimeter_immobilizes_intruders,
      victim: jorinda_joringel_joringel,
      scene: "Joringel is held speechless and motionless until the witch releases him" }
  - { function: func_lack, order: 7, actor: jorinda_joringel_joringel,
      scene: "Joringel begs for Jorinda but the witch refuses to return her" }
  - { function: func_departure, order: 8, actor: jorinda_joringel_joringel,
      scene: "Joringel goes to a strange village and keeps sheep while circling the castle at a distance" }
  - { function: func_donor_guidance, order: 9, actor: obj_jorinda_joringel_blood_red_flower,
      beneficiary: jorinda_joringel_joringel,
      scene: "a dream reveals the blood-red flower that frees everything it touches" }
  - { function: func_acquisition, order: 10, actor: jorinda_joringel_joringel,
      scene: "after nine days of seeking he finds the blood-red flower with pearl-like dew" }
  - { function: func_return, order: 11, actor: jorinda_joringel_joringel,
      scene: "the flower lets him cross the hundred-pace boundary and enter the castle" }
  - { function: func_recognition, order: 12, actor: jorinda_joringel_joringel,
      scene: "he recognizes the witch's attempt to remove the cage containing Jorinda" }
  - { function: func_liquidation, order: 13, actor: obj_jorinda_joringel_blood_red_flower,
      beneficiary: jorinda_joringel_jorinda,
      scene: "the flower breaks the witch's power and restores Jorinda and the other bird-maidens" }
  - { function: func_wedding, order: 14, actor: jorinda_joringel_joringel,
      beneficiary: jorinda_joringel_jorinda,
      scene: "Joringel takes Jorinda home and marries her" }


