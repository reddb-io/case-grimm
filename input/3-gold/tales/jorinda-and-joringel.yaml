title: Jorinda and Joringel


entities:

  characters:

    jorinda_joringel_jorinda:
      name: Jorinda
      archetypes: [arc_imprisoned_maiden]
      species: sp_human
      agency_modes: [agency_endurance, agency_speech]
      existential_states: [state_cursed, state_transformed]
      transformations: [transform_animal_human, transform_curse]
      affects: [affect_grief, affect_fear, affect_loyalty]
      traits: [fair-maiden, betrothed, sorrowful-singer, nightingale-transformed, caged-bird, restored-bride]
      evidence: |
        Joringel looked for Jorinda. She was changed into a
        nightingale, and sang, “jug, jug, jug.”

    jorinda_joringel_joringel:
      name: Joringel
      species: sp_human
      agency_modes: [agency_endurance, agency_speech, agency_object_mediation]
      speech_acts_performed: [speech_warning]
      affects: [affect_fear, affect_grief, affect_loyalty]
      traits: [handsome-youth, betrothed, castle-warner, immobilized-lover, shepherd, dream-guided, flower-seeker, rescuer, bridegroom]
      evidence: |
        Joringel could not move: he stood there like a stone, and could
        neither weep nor speak, nor move hand or foot.

    jorinda_joringel_witch:
      name: The Witch in the Castle
      species: sp_human
      being_type: being_witch
      agency_modes: [agency_cunning, agency_violence, agency_speech, agency_object_mediation]
      existential_states: [state_transformed]
      transformations: [transform_animal_human]
      speech_acts_performed: [speech_command]
      affects: [affect_anger]
      traits: [old, solitary, cat-form, screech-owl-form, beast-lurer, bird-maiden-cager, zachiel-speaker, disarmed-by-flower]
      evidence: |
        in it an old woman who was a witch dwelt all alone.

    jorinda_joringel_caged_maidens:
      name: The Caged Maidens
      archetypes: [arc_imprisoned_maiden]
      species: sp_human
      agency_modes: [agency_endurance]
      existential_states: [state_cursed, state_transformed]
      transformations: [transform_animal_human, transform_curse]
      affects: [affect_grief]
      traits: [innocent-maidens, bird-transformed, caged, restored-to-human-form]
      evidence: |
        whenever an innocent maiden came within this circle, she
        changed her into a bird

  magic_objects:

    obj_jorinda_joringel_blood_red_flower:
      name: The Blood-Red Flower
      instance_of: obj_disenchanting_flower
      object_kind: material
      attributes:
        color: blood-red
        mark: pearl-like dew-drop
        function: contact counter-magic that frees beings and spaces from enchantment
      evidence: |
        he found the blood-red flower. In the middle of it there was a
        large dew-drop, as big as the finest pearl.

    obj_jorinda_joringel_wicker_cages:
      name: The Wicker-Work Bird Cages
      object_kind: architecture
      attributes:
        function: containers for maidens transformed into birds
        count: 7000
      evidence: |
        shut her up in a wicker-work cage

  locations:

    loc_jorinda_joringel_forest:
      name: The Large Thick Forest
      instance_of: loc_forest
      threshold_type: threshold_forest
      evidence: |
        in the midst of a large and thick forest

    loc_jorinda_joringel_witch_castle:
      name: The Witch's Castle
      instance_of: loc_witch_house
      threshold_type: threshold_enchantment_circle
      evidence: |
        There was once an old castle in the midst of a large and thick
        forest

    loc_jorinda_joringel_hundred_pace_circle:
      name: The Hundred-Pace Circle
      threshold_type: threshold_enchantment_circle
      attributes:
        radius_paces: 100
        effect: immobilizes intruders and transforms innocent maidens into birds
      evidence: |
        If any one came within one hundred paces of the castle he was
        obliged to stand still

    loc_jorinda_joringel_village:
      name: The Strange Village
      instance_of: loc_village
      evidence: |
        at last came to a strange village

    loc_jorinda_joringel_bird_room:
      name: The Bird-Cage Room
      instance_of: loc_castle
      evidence: |
        carried the cage into a room in the castle


