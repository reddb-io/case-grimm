      evidence: |
        a hollow old horse’s hoof shall be your wine-glass

    obj_devil_grandmother_grandmother_table:
      name: The Grandmother's Dinner Table
      object_kind: tool
      attributes:
        function: domestic setting that makes the Devil talk about the riddle
      evidence: |
        The grandmother laid the table

