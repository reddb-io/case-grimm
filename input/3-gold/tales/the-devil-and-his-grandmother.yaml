      threshold_type: threshold_doorway
      evidence: |
        a fallen rock which looks like a little house

    loc_devil_grandmother_cellar:
      name: The Hidden Cellar Under the Stone
      instance_of: loc_cellar
      evidence: |
        a great stone which lay above a cellar

    loc_devil_grandmother_hell:
      name: Hell as the Threatened Meal-Place
      instance_of: loc_hell
      threshold_type: threshold_doorway
      evidence: |
        I will take you with me to hell

    loc_devil_grandmother_north_sea:
      name: The Great North Sea of the Riddle
      instance_of: loc_sea
      evidence: |
        In the great North Sea


