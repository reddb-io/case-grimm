      speech_acts_performed: [speech_request, speech_warning]
      traits: [trouble-inquirer, forest-rock-guide, salvation-pointer]
      evidence: |
        an aged woman came up to them

    devil_grandmother_grandmother:
      name: The Devil's Grandmother
      species: sp_human
      agency_modes: [agency_domestic_labor, agency_cunning, agency_speech]
      speech_acts_performed: [speech_request]
      affects: [affect_pity]
      traits: [infernal-grandmother, householder, pitying-helper, cellar-hider, table-layer, riddle-answer-extractor]
      evidence: |
        a very aged woman was sitting, who was the Devil’s grandmother

  magic_objects:

    obj_devil_grandmother_gold_whip:
      name: The Gold-Summoning Whip
      instance_of: obj_gold_summoning_whip
      object_kind: weapon
      attributes:
        function: produces as much gold as wished when cracked
      evidence: |
        Whip with it and crack it

    obj_devil_grandmother_contract_book:
      name: The Devil's Signed Book
      object_kind: book
      attributes:
