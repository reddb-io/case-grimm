propp:

  - function: func_initial_lack
    order: 1
    actor: devil_grandmother_three_soldiers
    scene: Three soldiers desert because the king's pay is too small to live on.
    evidence: |
      gave them small pay

  - function: func_concealment
    order: 2
    actor: devil_grandmother_three_soldiers
    scene: They hide in the cornfield but are trapped there by the surrounding troops.
    evidence: |
      They crept into the corn

  - function: func_infernal_bargain
    order: 3
    actor: devil_grandmother_devil
    beneficiary: devil_grandmother_three_soldiers
    scene: The fiery dragon rescues them in exchange for seven years of service.
    evidence: |
      If you will serve me for seven years

  - function: func_magical_agent
    order: 4
    actor: devil_grandmother_devil
    beneficiary: devil_grandmother_three_soldiers
    scene: The Devil gives them a whip that produces gold and has them sign his book.
    evidence: |
      then as much gold will spring up round about as you can wish for

  - function: func_term_approaches
    order: 5
    actor: devil_grandmother_three_soldiers
    scene: As the seven years near their end, two soldiers become anxious and the third trusts his wit.
    evidence: |
      two of them were terribly anxious and alarmed

  - function: func_helper_direction
    order: 6
    actor: devil_grandmother_aged_woman
    beneficiary: devil_grandmother_merry_soldier
    scene: The aged woman tells them that one soldier must enter the forest rock-house to obtain help.
    evidence: |
      there he will come to a fallen rock

  - function: func_hidden_hearing
    order: 7
    actor: devil_grandmother_grandmother
    beneficiary: devil_grandmother_merry_soldier
    scene: The Devil's grandmother hides the merry soldier in the cellar beneath the stone.
    evidence: |
      Conceal thyself there

  - function: func_riddle_extraction
    order: 8
    actor: devil_grandmother_grandmother
    victim: devil_grandmother_devil
    scene: She feeds the Devil and gets him to reveal the riddle's three answers.
    evidence: |
      I will question him about the riddle

  - function: func_answer_transmission
    order: 9
    actor: devil_grandmother_merry_soldier
    beneficiary: devil_grandmother_three_soldiers
    scene: The merry soldier returns secretly and tells his companions the riddle answers.
    evidence: |
      he had learned the answer to the riddle from him

  - function: func_final_claim
    order: 10
    actor: devil_grandmother_devil
    victim: devil_grandmother_three_soldiers
    scene: The Devil arrives with the signed book to claim the soldiers for hell.
    evidence: |
      showed the signatures

  - function: func_riddle_solution
    order: 11
    actor: devil_grandmother_three_soldiers
    scene: The three soldiers answer dog-fish, whale rib, and horse hoof correctly.
    evidence: |
      An old horse’s hoof is to be our wineglass

  - function: func_release
    order: 12
    actor: devil_grandmother_devil
    beneficiary: devil_grandmother_three_soldiers
    scene: The Devil loses power over them, and they keep the whip and live happily.
    evidence: |
      had no more power over them


