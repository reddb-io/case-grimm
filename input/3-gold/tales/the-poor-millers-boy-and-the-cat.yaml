      evidence: "cats who were her servants" }
  - { from: poor_millers_cat_servants, to: agency_music, label: PERFORM,
      evidence: "three of them had to make music" }
  - { from: poor_millers_cat_princess, to: poor_millers_boy_hans, label: INVITES_TO_DANCE,
