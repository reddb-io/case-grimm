  - { from: poor_millers_boy_hans, to: poor_millers_cat_princess, label: REFUSES_CAT_DANCE,
      evidence: "I won’t dance with a pussy cat" }
  - { from: poor_millers_boy_hans, to: obj_poor_millers_silver_wood_tools, label: USES_DAILY,
      evidence: "chop some wood every day" }
  - { from: poor_millers_boy_hans, to: obj_poor_millers_silver_scythe, label: USES_TO_MOW,
      evidence: "Go and mow my meadow" }
  - { from: poor_millers_boy_hans, to: obj_poor_millers_silver_building_tools, label: USES_TO_BUILD,
      evidence: "Then Hans built the small house" }
  - { from: poor_millers_cat_princess, to: obj_poor_millers_twelve_horses, label: SHOWS,
      evidence: "there stood twelve horses" }
  - { from: law_faithful_service_to_animal_bride_reveals_reward, to: poor_millers_boy_hans, label: REWARDS_SERVICE_OF,
      evidence: "the seven years had gone by with him as if they were six months" }

  # Return humiliation and revealed prize
  - { from: poor_millers_boy_hans, to: obj_poor_millers_smock_frock, label: RETURNS_WEARING,
      evidence: "his dirty old smock-frock" }
  - { from: poor_millers_two_apprentices, to: obj_poor_millers_defective_horses, label: BRING,
      evidence: "one of them was a blind one, and the other lame" }
  - { from: poor_millers_old_miller, to: poor_millers_boy_hans, label: EXCLUDES_FROM_TABLE,
      evidence: "he should not sit down to table" }
  - { from: poor_millers_two_apprentices, to: poor_millers_boy_hans, label: DENY_BED_TO,
      evidence: "would not let him have a bed" }
  - { from: poor_millers_boy_hans, to: loc_poor_millers_goose_house, label: SLEEPS_IN,
      evidence: "creep into the goose-house" }
  - { from: poor_millers_cat_princess, to: poor_millers_boy_hans, label: ARRIVES_FOR,
      evidence: "a magnificent princess alighted from the coach" }
  - { from: poor_millers_cat_princess, to: transform_animal_human, label: REVEALED_BY,
      evidence: "this princess was the little tabby-cat" }
  - { from: poor_millers_princess_servants, to: obj_poor_millers_splendid_garments, label: UNPACK,
      evidence: "unpacked splendid garments" }
  - { from: poor_millers_princess_servants, to: poor_millers_boy_hans, label: WASH_AND_DRESS,
      evidence: "washed him and dressed him" }
  - { from: poor_millers_princess_servants, to: obj_poor_millers_seventh_horse, label: BRING,
      evidence: "ordered the servant to bring the seventh horse" }
  - { from: obj_poor_millers_seventh_horse, to: poor_millers_boy_hans, label: BELONGS_TO,
      evidence: "that is for the third miller’s boy" }
  - { from: poor_millers_cat_princess, to: poor_millers_boy_hans, label: TAKES_AWAY_AS_FAITHFUL,
      evidence: "took her faithful Hans" }
  - { from: loc_poor_millers_small_house, to: loc_poor_millers_great_castle, label: REVEALS_AS,
      evidence: "it was a great castle" }
  - { from: poor_millers_cat_princess, to: poor_millers_boy_hans, label: MARRIES,
      evidence: "then she married him" }
  - { from: poor_millers_boy_hans, to: moral_restorative, label: EXEMPLIFIES,
      evidence: "let no one ever say that anyone who is silly can never become a person of importance" }
