    loc_blue_light_royal_palace:
      name: The Royal Palace
      instance_of: loc_castle
      threshold_type: threshold_doorway
      evidence: |
        carried her back to the royal palace

    loc_blue_light_streets:
      name: The Streets of the Night Carrying
      instance_of: loc_road
      evidence: |
        carried through the streets

    loc_blue_light_dungeon:
      name: The Soldier's Dungeon
      instance_of: loc_dungeon
      evidence: |
        standing at the window of his dungeon

    loc_blue_light_gallows:
      name: The Gallows and Execution Road
      instance_of: loc_gallows
      threshold_type: threshold_doorway
      evidence: |
        When he was led forth to die


