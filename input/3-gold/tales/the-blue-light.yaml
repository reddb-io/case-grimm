title: The Blue Light


entities:

  characters:

    blue_light_soldier:
      name: The Discharged Soldier
      archetypes: [arc_discharged_soldier, arc_trickster]
      species: sp_human
      agency_modes: [agency_endurance, agency_domestic_labor, agency_speech, agency_object_mediation, agency_violence, agency_cunning]
      existential_states: [state_imprisoned]
      speech_acts_performed: [speech_request, speech_command]
      affects: [affect_hunger, affect_anger, affect_fear, affect_joy]
      traits: [wounded-veteran, dismissed-without-wages, witch-labourer, well-abandoned, blue-light-bearer, revenge-seeker, princess-coercer, condemned-prisoner, execution-reverser, king]
      evidence: |
        a soldier who for many years had served the King faithfully

    blue_light_king:
      name: The Ungrateful King
      archetypes: [arc_oath_enforcer]
      species: sp_human
      agency_modes: [agency_social_rank, agency_speech, agency_violence]
      speech_acts_performed: [speech_command]
      affects: [affect_fear]
      traits: [soldier-dismisser, wage-refuser, father, track-strategist, execution-authorizer, mercy-beggar, kingdom-yielder]
      evidence: |
        I need thee no longer

    blue_light_witch:
      name: The Witch of the Forest House
      species: sp_human
      being_type: being_witch
      agency_modes: [agency_domestic_labor, agency_speech, agency_cunning, agency_violence]
      speech_acts_performed: [speech_bargain, speech_command]
      affects: [affect_greed, affect_anger]
      traits: [forest-host, hungry-soldier-exploiter, garden-taskmaster, well-betrayer, blue-light-seeker, gallows-punished]
      evidence: |
        a house wherein lived a witch

    blue_light_black_mannikin:
      name: The Little Black Mannikin / Dwarf
      being_type: being_dwarf
      agency_modes: [agency_object_mediation, agency_speech, agency_violence, agency_cunning]
      speech_acts_performed: [speech_command]
      traits: [smoke-summoned-servitor, command-bound-helper, underground-guide, treasure-revealer, witch-executor, princess-abductor, pea-countermeasure-maker, cudgel-wielder]
      evidence: |
        suddenly a little black dwarf stood before him

    blue_light_princess:
      name: The King's Daughter
      species: sp_human
      agency_modes: [agency_domestic_labor, agency_speech, agency_cunning, agency_social_rank]
      speech_acts_performed: [speech_testimony]
      affects: [affect_fear]
      traits: [sleep-carried-princess, dream-testifier, forced-servant, pea-trail-attempter, shoe-hider, final-bride]
      evidence: |
        the King’s daughter is in bed

    blue_light_landlord:
      name: The Inn Landlord
      species: sp_human
      agency_modes: [agency_domestic_labor, agency_speech]
      traits: [room-furnisher, clothes-provider, inn-keeper]
      evidence: |
        bade the landlord furnish him a room

    blue_light_comrade:
      name: The Passing Comrade
      species: sp_human
      agency_modes: [agency_speech, agency_endurance]
      traits: [window-summoned-helper, bundle-fetcher, ducat-earner]
      evidence: |
        one of his comrades passing by

    blue_light_judge_constable:
      name: The False Judge and Constable
      species: sp_human
      agency_modes: [agency_social_rank, agency_violence]
      traits: [death-condemners, cudgel-struck-authorities]
      evidence: |
        that false judge there, and his constable

    blue_light_poor_children:
      name: The Poor Children Picking Peas
      species: sp_human
      agency_modes: [agency_domestic_labor, agency_speech]
      traits: [street-pea-gatherers, track-confusers, rain-of-peas-speakers]
      evidence: |
        in every street poor children were sitting, picking up peas

  magic_objects:

    obj_blue_light:
      name: The Blue Light
      instance_of: obj_blue_summoning_light
      object_kind: relic
      attributes:
        function: never-extinguished flame that lights the soldier's pipe and summons the mannikin
      evidence: |
        it burns blue, and never goes out

    obj_blue_light_pipe:
      name: The Soldier's Half-Full Tobacco Pipe
      instance_of: obj_summoning_pipe
      object_kind: tool
      attributes:
        function: when lit at the blue light, calls the black mannikin
      evidence: |
        found his tobacco pipe, which was still half full

    obj_blue_light_well_basket:
      name: The Witch's Well Basket
      object_kind: tool
      attributes:
        function: lowers the soldier into the old dry well and enables the witch's betrayal
      evidence: |
        let him down in a basket

    obj_blue_light_hidden_gold:
      name: The Witch's Hidden Gold
      object_kind: treasure
      attributes:
        function: underground treasure taken by the soldier after the mannikin leads him out
      evidence: |
        the soldier took as much gold as he could carry

    obj_blue_light_peas:
      name: The Princess's Peas
      object_kind: food
      attributes:
        function: intended trail-marker defeated by the mannikin scattering peas everywhere
      evidence: |
        Fill thy pocket full of peas

    obj_blue_light_shoe:
      name: The Hidden Princess Shoe
      object_kind: garment
      attributes:
        function: successful proof object found in the soldier's room
      evidence: |
        she hid her shoe under the bed

    obj_blue_light_forgotten_bundle:
      name: The Forgotten Bundle with Blue Light and Gold
      object_kind: material
      attributes:
        function: contains the valuable objects needed for the prison rescue
      evidence: |
        the small bundle I have left lying in the inn

    obj_blue_light_cudgel:
      name: The Mannikin's Small Cudgel
      object_kind: weapon
      attributes:
        function: strikes down judge, constable, king, and bystanders during the execution reversal
      evidence: |
        the mannikin was there with a small cudgel in his hand

  locations:

    loc_blue_light_forest:
      name: The Forest of Hunger and Witch-Light
      instance_of: loc_forest
      threshold_type: threshold_forest
      evidence: |
        he entered a forest

    loc_blue_light_witch_house:
      name: The Witch's Forest House
      instance_of: loc_witch_house
