propp:

  - function: func_initial_situation
    order: 1
    actor: blue_light_soldier
    scene: The wounded faithful soldier is dismissed without wages after the war.
    evidence: |
      thou wilt not receive any more money

  - function: func_lack
    order: 2
    actor: blue_light_soldier
    scene: The hungry soldier wanders into the forest and asks the witch for food and lodging.
    evidence: |
      Do give me one night’s lodging, and a little to eat and drink

  - function: func_donor_contract
    order: 3
    actor: blue_light_witch
    victim: blue_light_soldier
    scene: The witch grants lodging in exchange for garden-digging and wood-chopping labour.
    evidence: |
      if you will do what I wish

  - function: func_descent
    order: 4
    actor: blue_light_witch
    victim: blue_light_soldier
    scene: The witch lowers the soldier into the dry well to retrieve the blue light.
    evidence: |
      let him down in a basket

  - function: func_villainy
    order: 5
    actor: blue_light_witch
    victim: blue_light_soldier
    scene: The witch tries to take the blue light before raising him fully, then abandons him below.
    evidence: |
      let him down again into the well, and went away

  - function: func_magical_agent
    order: 6
    actor: obj_blue_light_pipe
    beneficiary: blue_light_soldier
    scene: The soldier lights his pipe from the blue light and summons the black mannikin.
    evidence: |
      lit it at the blue light and began to smoke

  - function: func_rescue
    order: 7
    actor: blue_light_black_mannikin
    beneficiary: blue_light_soldier
    scene: The mannikin leads the soldier out through an underground passage and shows him treasure.
    evidence: |
      led him through an underground passage

  - function: func_punishment
    order: 8
    actor: blue_light_black_mannikin
    victim: blue_light_witch
    scene: The soldier commands the mannikin to bind the witch and carry her before the judge.
    evidence: |
      the witch is already hanging on the gallows

  - function: func_revenge_command
    order: 9
    actor: blue_light_soldier
    victim: blue_light_princess
    scene: The soldier summons the mannikin from the inn and orders the sleeping princess brought to do servant work.
    evidence: |
      bring her here in her sleep

  - function: func_counteraction
    order: 10
    actor: blue_light_king
    beneficiary: blue_light_princess
    scene: The king advises peas and then a hidden shoe to discover where the princess is taken.
    evidence: |
      leave a track in the streets

  - function: func_exposure
    order: 11
    actor: obj_blue_light_shoe
    victim: blue_light_soldier
    scene: The hidden shoe is found in the soldier's room and he is imprisoned.
    evidence: |
      It was found at the soldier’s

  - function: func_helper_recovery
    order: 12
    actor: blue_light_comrade
    beneficiary: blue_light_soldier
    scene: A comrade fetches the forgotten bundle from the inn to the dungeon.
    evidence: |
      brought him what he wanted

  - function: func_execution
    order: 13
    actor: blue_light_judge_constable
    victim: blue_light_soldier
    scene: The judge condemns the soldier to death.
    evidence: |
      the judge condemned him to death

  - function: func_last_request
    order: 14
    actor: blue_light_soldier
    scene: The soldier asks to smoke one more pipe on the way to execution.
    evidence: |
      I may smoke one more pipe on my way

  - function: func_victory
    order: 15
    actor: blue_light_black_mannikin
    beneficiary: blue_light_soldier
    scene: The summoned mannikin strikes down judge, constable, king, and everyone touched by the cudgel.
    evidence: |
      whosoever was so much as touched by his cudgel fell to earth

  - function: func_wedding
    order: 16
    actor: blue_light_king
    beneficiary: blue_light_soldier
    scene: The terrified king gives the soldier the kingdom and the princess as wife.
    evidence: |
      gave him his kingdom for his own, and the princess to wife


