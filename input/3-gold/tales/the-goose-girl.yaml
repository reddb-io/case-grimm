  - { from: goose_girl_princess, to: obj_goose_girl_falada_head, label: LAMENTS_TO,
      evidence: "Alas, Falada, hanging there!" }
  - { from: obj_goose_girl_falada_head, to: goose_girl_princess, label: ANSWERS,
