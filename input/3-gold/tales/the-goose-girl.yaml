      evidence: "betrothed to a prince who lived at a great distance" }
  - { from: goose_girl_old_queen, to: obj_goose_girl_dowry, label: PACKS,
      evidence: "everything which appertained to a royal dowry" }
  - { from: goose_girl_old_queen, to: goose_girl_waiting_maid, label: SENDS_WITH,
      evidence: "She likewise sent her maid in waiting" }
  - { from: goose_girl_princess, to: goose_girl_falada, label: RIDES,
      evidence: "the horse of the King’s daughter was called Falada" }
  - { from: goose_girl_falada, to: agency_animal_language, label: HAS,
      evidence: "could speak" }
  - { from: goose_girl_old_queen, to: obj_goose_girl_blood_handkerchief, label: CREATES,
      evidence: "cut her finger with it until it bled" }
  - { from: goose_girl_old_queen, to: goose_girl_princess, label: GIVES_BLOOD_TOKEN,
      evidence: "preserve this carefully" }
  - { from: goose_girl_princess, to: goose_girl_waiting_maid, label: REQUESTS_WATER,
      evidence: "get me some water from the stream" }
  - { from: goose_girl_waiting_maid, to: goose_girl_princess, label: REFUSES_SERVICE,
      evidence: "I don’t choose to be your servant" }
  - { from: obj_goose_girl_blood_handkerchief, to: goose_girl_princess, label: ANSWERS_FOR_MOTHER,
      evidence: "If thy mother knew, her heart would break." }
  - { from: obj_goose_girl_blood_handkerchief, to: loc_goose_girl_stream, label: FLOATS_AWAY,
      evidence: "floated away with the water" }

  # Role theft and hidden identity
  - { from: goose_girl_waiting_maid, to: goose_girl_princess, label: GAINS_POWER_OVER,
      evidence: "she had now power over the bride" }
  - { from: goose_girl_waiting_maid, to: goose_girl_falada, label: TAKES,
      evidence: "Falada is more suitable for me" }
  - { from: goose_girl_waiting_maid, to: obj_goose_girl_royal_apparel, label: FORCES_EXCHANGE_OF,
      evidence: "exchange her royal apparel for her own shabby clothes" }
  - { from: goose_girl_waiting_maid, to: goose_girl_princess, label: FORCES_OATH_SILENCE,
      evidence: "she was compelled to swear by the clear sky above her" }
  - { from: goose_girl_waiting_maid, to: loc_goose_girl_royal_palace, label: ENTERS_AS_FALSE_BRIDE,
      evidence: "the prince sprang forward to meet her" }
  - { from: goose_girl_young_king, to: goose_girl_waiting_maid, label: MISTAKES_FOR_CONSORT,
      evidence: "thought she was his consort" }
  - { from: goose_girl_princess, to: state_hidden_identity, label: FALLS_INTO,
      evidence: "the real princess was left standing below" }
  - { from: goose_girl_old_king, to: goose_girl_princess, label: ASSIGNS_GOOSE_WORK,
      evidence: "she may help him" }
  - { from: goose_girl_princess, to: goose_girl_conrad, label: TENDS_GEESE_WITH,
      evidence: "the true bride had to help him to tend the geese" }

  # Falada as murdered witness
  - { from: goose_girl_waiting_maid, to: goose_girl_young_king, label: ASKS_FAVOR,
      evidence: "I beg you to do me a favour" }
  - { from: goose_girl_waiting_maid, to: goose_girl_falada, label: ORDERS_BEHEADING_OF,
      evidence: "have the head of the horse on which I rode here cut off" }
  - { from: goose_girl_waiting_maid, to: goose_girl_falada, label: FEARS_TESTIMONY_FROM,
      evidence: "afraid that the horse might tell" }
  - { from: goose_girl_princess, to: goose_girl_knacker, label: SECRETLY_PAYS,
      evidence: "secretly promised to pay the knacker a piece of gold" }
  - { from: goose_girl_knacker, to: obj_goose_girl_falada_head, label: NAILS_UP,
