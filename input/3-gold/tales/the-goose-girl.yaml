  - { from: goose_girl_princess, to: obj_goose_girl_iron_stove, label: LAMENTS_TO,
      evidence: "began to weep and lament" }
  - { from: goose_girl_princess, to: goose_girl_waiting_maid, label: ACCUSES_IN_OBJECT_CONFESSION,
