  - { from: goose_girl_waiting_maid, to: obj_goose_girl_nail_barrel, label: PRONOUNCES_SENTENCE,
      evidence: "put in a barrel which is studded inside with pointed nails" }
  - { from: goose_girl_old_king, to: goose_girl_waiting_maid, label: IDENTIFIES_CULPRIT,
      evidence: "It is thou" }
  - { from: law_self_sentence_punishes_false_bride, to: goose_girl_waiting_maid, label: PUNISHES,
      evidence: "thou hast pronounced thine own sentence" }
  - { from: goose_girl_young_king, to: goose_girl_princess, label: MARRIES_TRUE_BRIDE,
      evidence: "married his true bride" }
  - { from: goose_girl_young_king, to: goose_girl_princess, label: REIGNS_WITH,
      evidence: "reigned over their kingdom in peace and happiness" }
