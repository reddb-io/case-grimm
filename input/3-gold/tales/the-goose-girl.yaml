  # Oath-bound truth routed through object
  - { from: goose_girl_old_king, to: goose_girl_princess, label: ASKS_WHY,
      evidence: "asked why she did all these things" }
  - { from: goose_girl_princess, to: state_bound_by_promise, label: CANNOT_TELL_HUMANS,
