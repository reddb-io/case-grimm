propp:

  - function: func_departure
    order: 1
    actor: skilful_huntsman
    scene: The locksmith's apprentice leaves home to seek fortune.
    evidence: |
      go out into the world and seek his fortune

  - function: func_training
    order: 2
    actor: skilful_green_huntsman
    beneficiary: skilful_huntsman
    scene: The youth binds himself to the green huntsman and learns hunting.
    evidence: |
      bound himself to him for some years, and learnt the art of hunting

  - function: func_acquisition
    order: 3
    actor: skilful_huntsman
    scene: The huntsman receives the never-missing air-gun.
    evidence: |
      it hit its mark without fail whenever he shot with it

  - function: func_encounter
    order: 4
    actor: skilful_huntsman
    scene: The huntsman finds the giants' fire in the forest.
    evidence: |
      three giants were sitting by it

  - function: func_test
    order: 5
    actor: skilful_huntsman
    scene: Perfect shots from hiding prove his usefulness to the giants.
    evidence: |
      the huntsman again shot it away from him

  - function: func_villainy
    order: 6
    actor: skilful_three_giants
    victim: skilful_princess
    scene: The giants plan to abduct the princess from the tower.
    evidence: |
      in the tower was imprisoned a lovely princess, whom they wished very much to carry off

  - function: func_rescue
    order: 7
    actor: skilful_huntsman
    beneficiary: skilful_princess
    scene: The huntsman kills the warning dog, enters alone, and protects the sleeping princess.
    evidence: |
      How can I give an innocent maiden into the power of the wild giants

  - function: func_victory
    order: 8
    actor: skilful_huntsman
    victim: skilful_three_giants
    scene: The huntsman draws the giants through the hole and beheads them with the sword.
    evidence: |
      cut it off at one stroke with his sword

  - function: func_false_claim
    order: 9
    actor: skilful_false_captain
    scene: The one-eyed captain claims the rescue and is promised the princess.
    evidence: |
      he said that he had done it

  - function: func_exile
    order: 10
    actor: skilful_old_king
    victim: skilful_princess
    scene: The king humiliates the princess to force marriage with the false captain.
    evidence: |
      wished by this to force her to marry the captain

  - function: func_recognition
    order: 11
    actor: skilful_huntsman
    beneficiary: skilful_princess
    scene: The huntsman reveals the tokens and the princess recognizes her true rescuer.
    evidence: |
      he also showed her the slipper, and the corner of the neck-kerchief, and the bit of the night-dress

  - function: func_exposure
    order: 12
    actor: skilful_old_king
    victim: skilful_false_captain
    scene: The king's riddle about missing giant tongues exposes the false claimant.
    evidence: |
      where the giants’ tongues were

  - function: func_punishment
    order: 13
    actor: skilful_old_king
    victim: skilful_false_captain
    scene: The captain pronounces his own sentence and is torn in pieces.
    evidence: |
      he had pronounced his own sentence

  - function: func_wedding
    order: 14
    actor: skilful_princess
    beneficiary: skilful_huntsman
    scene: The princess marries the huntsman, who later receives the kingdom.
    evidence: |
      the King’s daughter was married to the huntsman


