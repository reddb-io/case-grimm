  - from: glass_coffin_maiden
    label: OPENS
    to: obj_glass_coffin_smoke_bottles
    evidence: |
      The maiden had scarcely opened the bottles

  - from: law_opened_enchantment_vessels_restore_household
    label: RESTORES
    to: glass_coffin_smoke_people
    evidence: |
      changed itself into living men

  - from: glass_coffin_brother_stag
