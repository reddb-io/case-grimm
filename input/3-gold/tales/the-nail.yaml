        the stable-boy brought out his horse

  magic_objects:

    obj_nail_money_bags:
      name: The Merchant's Money-Bags
      object_kind: treasure
      attributes:
        contents: gold and silver
        function: profit that motivates the hurried homeward ride
      evidence: |
        lined his money-bags with gold and silver

    obj_nail_trunk:
      name: The Trunk of Money
      object_kind: token
      attributes:
        function: load first carried by the horse and later by the merchant
      evidence: |
        packed his trunk with the money on his horse

    obj_nail_missing_nail:
      name: The Missing Nail
      object_kind: tool
      attributes:
        function: small unrepaired defect that begins the disaster cascade
      evidence: |
        A nail is wanting

    obj_nail_missing_shoe:
      name: The Missing Horseshoe
      object_kind: tool
      attributes:
        function: second-stage failure after the nail is ignored
      evidence: |
        a shoe is missing

  locations:

    loc_nail_fair:
      name: The Fair
      instance_of: loc_town
      evidence: |
        at the fair

    loc_nail_town_noon:
      name: The Noon Town
      instance_of: loc_town
      evidence: |
        At noon he rested in a town

    loc_nail_stable:
      name: The Stable
      instance_of: loc_stable
      evidence: |
        the stable-boy brought out his horse

    loc_nail_home_road:
      name: The Homeward Road
      instance_of: loc_road
      evidence: |
        rode away

    loc_nail_home_house:
      name: The Merchant's House
      instance_of: loc_house
      evidence: |
        be in his own house before nightfall


