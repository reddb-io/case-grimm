entities:

  characters:

    nail_merchant:
      name: The Merchant
      species: sp_human
      agency_modes: [agency_domestic_labor, agency_speech, agency_endurance, agency_object_mediation]
      speech_acts_performed: [speech_command, speech_testimony]
      traits: [successful-at-fair, gold-and-silver-carrier, homeward-rider, hurried, warning-dismissive, forced-foot-traveller, late-arriver]
      evidence: |
        A merchant had done good business at the fair

    nail_horse:
      name: The Merchant's Horse
      species: sp_horse
      agency_modes: [agency_endurance]
      traits: [money-trunk-carrier, missing-nail, missing-shoe, limping, stumbling, broken-legged, abandoned]
      evidence: |
        packed his trunk with the money on his horse

    nail_stable_boys:
      name: The Stable-Boys
      species: sp_human
      agency_modes: [agency_domestic_labor, agency_speech]
