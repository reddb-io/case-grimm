  threshold_types: []


propp:
  - { function: func_initial_profit, order: 1, actor: nail_merchant,
      scene: "the merchant sells his wares and rides home with gold and silver" }
  - { function: func_first_warning, order: 2, actor: nail_stable_boys,
      beneficiary: nail_merchant,
      scene: "the stable-boy warns that one nail is missing from the horse's shoe" }
  - { function: func_warning_rejected, order: 3, actor: nail_merchant,
      scene: "the merchant refuses repair because he is in a hurry" }
  - { function: func_second_warning, order: 4, actor: nail_stable_boys,
      beneficiary: nail_merchant,
      scene: "the stable-boy warns that the whole shoe is missing" }
  - { function: func_warning_rejected, order: 5, actor: nail_merchant,
      scene: "the merchant again refuses the blacksmith because he is in haste" }
  - { function: func_cascade_failure, order: 6, actor: law_unrepaired_small_defect_cascades_into_disaster,
      victim: nail_horse,
      scene: "the horse limps, stumbles, falls, and breaks its leg" }
  - { function: func_loss_of_transport, order: 7, actor: nail_merchant,
      scene: "the merchant leaves the horse and carries the trunk home on his back" }
  - { function: func_proverbial_moral, order: 8, actor: moral_prudent_pacing,
      scene: "the merchant names the unlucky nail as the cause and the tale closes with 'Hasten slowly'" }


