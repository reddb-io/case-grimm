propp:

  - function: func_initial_situation
    order: 1
    actor: three_black_enemy
    victim: three_black_townsfolk
    scene: "East India is besieged until the enemy receives six hundred dollars"
    evidence: "East India was besieged by an enemy"

  - function: func_transaction
    order: 2
    actor: three_black_enemy
    victim: three_black_fisherman_son
    scene: "the enemy takes the fisherman's son prisoner and pays the father the six hundred dollars"
    evidence: "took the son prisoner"

  - function: func_social_elevation
    order: 3
    actor: three_black_townsfolk
    beneficiary: three_black_fisherman_father
    scene: "the father gives the money to the town and becomes burgomaster"
    evidence: "the fisherman became burgomaster"

  - function: func_escape
    order: 4
    actor: three_black_fisherman_son
    scene: "the son escapes from the enemy and reaches the mountain forest"
    evidence: "The son got away again from the enemy"

  - function: func_threshold_crossing
    order: 5
    actor: three_black_fisherman_son
    scene: "the mountain opens and admits the son into the black enchanted castle"
    evidence: "The mountain opened"

  - function: func_donor_sequence
    order: 6
    actor: three_black_princesses
    beneficiary: three_black_fisherman_son
    scene: "the princesses promise that he can deliver them if he spends a year without speaking to them or looking at them"
    evidence: "not speak to them and also not look at them"

  - function: func_temporary_return
    order: 7
    actor: three_black_princesses
    beneficiary: three_black_fisherman_son
    scene: "the princesses give purse and coat, send him instantly home, and require return within a week"
    evidence: "in a week he must be back there again"

  - function: func_recognition
    order: 8
    actor: three_black_fisherman_son
    beneficiary: three_black_fisherman_father
    scene: "the son proves his identity by putting on the old smock-frock of his poor fisherman life"
    evidence: "Am I not the son of the poor fisherman"

  - function: func_false_counsel
    order: 9
    actor: three_black_mother
    beneficiary: three_black_fisherman_son
    scene: "the mother fears the princesses and advises him to take a holy-water vessel and boiling water"
    evidence: "drop some boiling water on their faces"

  - function: func_violation
    order: 10
    actor: three_black_fisherman_son
    victim: three_black_princesses
    scene: "in fear, the son drops boiling water on the sleeping princesses instead of maintaining the release condition"
    evidence: "he dropped the water on their faces"

  - function: func_failed_disenchantment
    order: 11
    actor: three_black_princesses
    scene: "the princesses turn half-white, curse him, and declare that no man can now set them free"
    evidence: "no man born in the world"

  - function: func_punishment
    order: 12
    actor: loc_three_black_enchanted_castle
    victim: three_black_fisherman_son
    scene: "the castle shrieks, the son leaps out and breaks his leg, and the castle sinks back into the earth"
    evidence: "the castle sank into the earth again"


