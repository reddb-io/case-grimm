title: The Three Black Princesses


entities:

  characters:

    three_black_fisherman_son:
      name: The Fisherman's Son
      archetypes: [arc_naive_victim]
      species: sp_human
      agency_modes: [agency_speech, agency_endurance, agency_object_mediation]
      existential_states: [state_maimed]
      speech_acts_performed: [speech_request]
      affects: [affect_fear, affect_shame]
      traits: [sold-captive, escaped-son, enchanted-castle-guest, taboo-bound-rescuer, father-recognizer, failed-deliverer, broken-legged]
      evidence: |
        there was a poor fisherman who fished on the lake with his son

    three_black_fisherman_father:
      name: The Fisherman Who Becomes Burgomaster
      species: sp_human
      agency_modes: [agency_social_rank, agency_speech, agency_object_mediation]
      speech_acts_performed: [speech_warning]
      affects: [affect_fear, affect_shame]
      traits: [poor-fisherman, ransom-taker, new-burgomaster, title-enforcer, recognizing-father]
      evidence: |
        the fisherman became burgomaster

    three_black_mother:
      name: The Fisherman's Wife Who Counsels Scalding Water
      species: sp_human
      agency_modes: [agency_speech, agency_object_mediation]
      speech_acts_performed: [speech_warning, speech_command]
      affects: [affect_fear]
      traits: [fearful-mother, holy-water-vessel-adviser, rescue-disruptor]
      evidence: |
        his mother said that might very likely not be a good thing to do

    three_black_enemy:
      name: The Besieging Enemy
      species: sp_human
      agency_modes: [agency_violence, agency_object_mediation]
      traits: [besieger, ransom-demander, child-buyer]
      evidence: |
        East India was besieged by an enemy

    three_black_townsfolk:
      name: The Townsfolk and Great Men
      species: sp_human
      agency_modes: [agency_social_rank, agency_speech, agency_violence]
      speech_acts_performed: [speech_command]
      traits: [proclamation-makers, burgomaster-makers, gallows-enforcers]
      evidence: |
        the townsfolk caused it to be proclaimed by beat of drum

    three_black_princesses:
      name: The Three Black Princesses
      archetypes: [arc_imprisoned_maiden]
      species: sp_human
      agency_modes: [agency_speech]
      existential_states: [state_cursed, state_imprisoned, state_transformed]
      speech_acts_performed: [speech_command, speech_warning, speech_curse]
      affects: [affect_fear, affect_anger]
      traits: [black-clad, partly-white-faced, silence-taboo-setters, sleeping-victims, half-white-cursed-princesses]
      evidence: |
        three young princesses who were entirely dressed in black

    three_black_bound_brothers:
      name: The Three Brothers Bound by Seven Chains
      species: sp_human
      agency_modes: [agency_violence]
      existential_states: [state_imprisoned]
      traits: [chain-bound, vengeance-threat, unseen-brothers]
      evidence: |
        three brothers who are bound by seven chains

  magic_objects:

    obj_three_black_six_hundred_dollars:
      name: The Six Hundred Dollars
      object_kind: treasure
      attributes:
        function: ransom price that converts the poor fisherman into burgomaster
      evidence: |
        received six hundred dollars

    obj_three_black_money_purse:
      name: The Castle Purse of Money
      object_kind: treasure
      attributes:
        source: three_black_princesses
        function: equips the son for the one-week visit home
      evidence: |
        this purse with money

    obj_three_black_coat:
      name: The Castle Coat
      object_kind: garment
      attributes:
        source: three_black_princesses
        function: accompanies the son during magical transport home
      evidence: |
        put on this coat

    obj_three_black_old_smock_frock:
      name: The Old Smock-Frock
      object_kind: garment
      attributes:
        function: proves the son's identity as the poor fisherman's child
      evidence: |
        put on his old smock-frock

    obj_three_black_holy_water_vessel:
      name: The Holy-Water Vessel
      object_kind: relic
      attributes:
        source: three_black_mother
        function: vessel used to carry boiling water into the enchanted castle
      evidence: |
        take a holy-water vessel with him

    obj_three_black_boiling_water:
      name: The Boiling Water
      object_kind: material
      attributes:
        function: scalds the sleeping princesses and turns them half-white
      evidence: |
        drop some boiling water on their faces

    obj_three_black_seven_chains:
      name: The Seven Chains Binding the Brothers
      object_kind: material
      attributes:
        count: 7
        function: restrain the avenging brothers named by the princesses
      evidence: |
        bound by seven chains

  locations:

    loc_three_black_east_india:
      name: East India
      instance_of: loc_town
      evidence: |
        East India was besieged by an enemy

    loc_three_black_lake:
      name: The Fisherman's Lake
      instance_of: loc_lake
      evidence: |
        fished on the lake with his son

    loc_three_black_gallows:
      name: The Burgomaster's Gallows
      instance_of: loc_gallows
      evidence: |
        put to death on the gallows

    loc_three_black_high_mountain:
      name: The High Mountain in the Great Forest
      instance_of: loc_mountain
      threshold_type: threshold_forest
      evidence: |
        a great forest on a high mountain

    loc_three_black_enchanted_castle:
      name: The Black-Hung Enchanted Castle
      instance_of: loc_castle
      threshold_type: threshold_doorway
      evidence: |
        a great enchanted castle

    loc_three_black_fisherman_hut:
      name: The Old Fisherman's Hut
      instance_of: loc_house
      evidence: |
        the old fisherman’s hut


