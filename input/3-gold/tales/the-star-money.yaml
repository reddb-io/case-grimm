      give me something to eat, I am so hungry

  - from: star_money_girl
    label: GIVES
    to: obj_star_money_bread
    evidence: |
      She reached him the whole of her piece of bread

  - from: star_money_girl
    label: BLESSES_GIFT
    to: speech_blessing
    evidence: |
      May God bless it to thy use

  - from: star_money_cold_head_child
    label: REQUESTS
    to: obj_star_money_hood
    evidence: |
      My head is so cold, give me something to cover it with

  - from: star_money_girl
    label: GIVES
    to: obj_star_money_hood
    evidence: |
      she took off her hood and gave it to him

  - from: star_money_girl
    label: GIVES
    to: obj_star_money_jacket
    evidence: |
      she gave it her own

  - from: star_money_girl
    label: GIVES
    to: obj_star_money_frock
    evidence: |
      one begged for a frock, and she gave away that also

  - from: star_money_girl
    label: GIVES_LAST_GARMENT
    to: obj_star_money_little_shirt
    evidence: |
      took it off, and gave away that also

  - from: obj_star_money_fallen_money
    label: FALLS_FROM
    to: loc_star_money_heaven
    evidence: |
      stars from heaven fell down

  - from: obj_star_money_fallen_money
    label: BECOMES_MONEY
    to: obj_star_money_fallen_money
    evidence: |
      hard smooth pieces of money

  - from: obj_star_money_new_linen_shirt
    label: REPLACES
    to: obj_star_money_little_shirt
    evidence: |
      although she had just given her little shirt away, she had a new one

  - from: star_money_girl
    label: GATHERS_MONEY_IN
    to: obj_star_money_new_linen_shirt
    evidence: |
      gathered together the money into this

  - from: law_total_almsgiving_draws_heavenly_replacement
    label: REWARDS
    to: star_money_girl
    evidence: |
      was rich all the days of her life
