entities:

  characters:

    allerleirauh_princess:
      name: Allerleirauh
      archetypes: [arc_oppressed_maiden]
      species: sp_human
      agency_modes: [agency_cunning, agency_endurance, agency_domestic_labor, agency_object_mediation, agency_speech]
      existential_states: [state_hidden_identity, state_disguised]
      speech_acts_performed: [speech_command, speech_lie]
      affects: [affect_fear, affect_shame, affect_grief]
      traits: [golden-haired-princess, impossible-gift-requester, fugitive-daughter, fur-disguised, soot-blackened, kitchen-servant, festival-bride, token-sender, revealed-bride]
      evidence: |
        The daughter was still more shocked when she became aware of her
        father’s resolution, but hoped to turn him from his design.

    allerleirauh_dead_queen:
      name: The Dead Golden-Haired Queen
      species: sp_human
      agency_modes: [agency_speech]
      speech_acts_performed: [speech_promise]
      affects: [affect_maternal_love]
      traits: [beautiful, golden-haired, deathbed-promise-maker, beauty-template]
      evidence: |
        If thou wishest to marry again after my death, take no one who
        is not quite as beautiful as I am

    allerleirauh_father_king:
      name: Allerleirauh's Father King
      archetypes: [arc_taboo_desiring_father]
      species: sp_human
      agency_modes: [agency_social_rank, agency_speech]
      existential_states: [state_bound_by_promise]
      speech_acts_performed: [speech_promise, speech_command]
      affects: [affect_grief, affect_taboo_desire]
      traits: [widowed, oath-bound, bride-searcher, daughter-desiring, taboo-marriage-insister, impossible-gift-provider]
      evidence: |
        I will marry my daughter, for she is the counterpart of my late
        wife

    allerleirauh_councillors:
      name: The Shocked Councillors
      species: sp_human
      agency_modes: [agency_speech, agency_social_rank]
      speech_acts_performed: [speech_prohibition]
      affects: [affect_fear]
      traits: [marriage-advisers, taboo-witnesses, ruin-warners]
      evidence: |
        God has forbidden a father to marry his daughter

    allerleirauh_huntsmen:
      name: The Second King's Huntsmen
      species: sp_human
      agency_modes: [agency_violence, agency_social_rank]
      affects: [affect_curiosity]
      traits: [forest-searchers, beast-misrecognizers, captors, kitchen-deliverers]
      evidence: |
        A wondrous beast is lying in the hollow tree

    allerleirauh_second_king:
      name: The Second King
      species: sp_human
      agency_modes: [agency_social_rank, agency_speech, agency_object_mediation]
      speech_acts_performed: [speech_command]
      affects: [affect_love_at_first_sight, affect_curiosity]
      traits: [forest-owner, hunter, festival-dancer, soup-questioner, ring-strategist, bride-recognizer]
      evidence: |
        My eyes have never yet seen any one so beautiful!

    allerleirauh_cook:
      name: The Palace Cook
      species: sp_human
      agency_modes: [agency_domestic_labor, agency_speech, agency_social_rank]
      speech_acts_performed: [speech_command]
      affects: [affect_fear]
      traits: [kitchen-supervisor, feast-watcher, soup-delegator, hair-threatener, reluctant-confessor]
      evidence: |
        Leave that alone till morning, and make me the soup for the King

    allerleirauh_palace_court:
      name: The Festival Court
      species: sp_human
      agency_modes: [agency_social_rank]
      traits: [festival-guests, beauty-witnesses, mistaken-princess-witnesses]
      evidence: |
        every one made way for her, for no one knew her

  magic_objects:

    obj_allerleirauh_celestial_dresses:
      name: The Dresses of Sun, Moon, and Stars
      instance_of: obj_celestial_dresses
      object_kind: garment
      attributes:
        sequence: [sun, moon, stars]
        initial_function: impossible bride-gift demand
        later_function: festival visibility and recognition escalation
      evidence: |
        three dresses, one as golden as the sun, one as silvery as the
        moon, and one as bright as the stars

    obj_allerleirauh_fur_mantle:
      name: The Mantle of All Kinds of Fur
      instance_of: obj_fur_disguise_mantle
      object_kind: garment
      attributes:
        material: one skin-piece from every animal in the kingdom
        function: animal-like disguise and name-source
      evidence: |
        a mantle of a thousand different kinds of fur and hair joined
        together

    obj_allerleirauh_nutshell:
      name: The Nutshell Holding the Dresses
      object_kind: tool
      attributes:
        function: impossible compression of royal garments into portable flight storage
      evidence: |
        The three dresses of the sun, moon, and stars she put into a
        nutshell

    obj_allerleirauh_soot:
      name: The Soot and Ashes
      object_kind: material
      attributes:
        function: darkens face and hands, lowering royal appearance into kitchen anonymity
      evidence: |
        blackened her face and hands with soot

    obj_allerleirauh_golden_ring:
      name: The Golden Ring in the Soup
      instance_of: obj_hidden_bride_token
      object_kind: token
      attributes:
        sequence: first soup token
        function: summons inquiry from the second king
      evidence: |
        put it in the bowl in which the soup was served

    obj_allerleirauh_golden_spinning_wheel:
      name: The Little Golden Spinning-Wheel
      object_kind: token
      attributes:
        material_form: spinning-wheel
        sequence: second soup token
        function: repeats recognition inquiry through domestic-work symbol
      evidence: |
        fetched the little golden spinning-wheel, and put it in the bowl

    obj_allerleirauh_golden_reel:
      name: The Golden Reel in the Soup
      instance_of: obj_hidden_bride_token
      object_kind: token
      attributes:
        sequence: third soup token
        function: final token before visual exposure
      evidence: |
        put her golden reel into it

    obj_allerleirauh_bread_soup:
      name: The King's Bread Soup
      object_kind: food
      attributes:
        function: domestic carrier for hidden bride tokens
      evidence: |
        make the King the bread soup which he so much likes

    obj_allerleirauh_second_king_ring:
      name: The Ring Slipped onto Allerleirauh's Finger
      object_kind: token
      attributes:
        function: counter-token placed by the second king to fix the festival woman's identity
      evidence: |
        he contrived, without her noticing it, to slip a golden ring on
        her finger

  locations:

    loc_allerleirauh_father_kingdom:
      name: The Father's Kingdom
      instance_of: loc_castle
      evidence: |
        one of every kind of animal in your kingdom must give a piece
        of his skin for it

    loc_allerleirauh_forest:
      name: The Great Forest
      instance_of: loc_forest
      threshold_type: threshold_forest
      evidence: |
        walked the whole night until she reached a great forest

    loc_allerleirauh_hollow_tree:
      name: The Hollow Tree
      instance_of: loc_tree
      threshold_type: threshold_forest
      evidence: |
        she got into a hollow tree, and fell asleep

    loc_allerleirauh_second_palace:
      name: The Second King's Palace
      instance_of: loc_castle
      evidence: |
        took her home to the royal palace

    loc_allerleirauh_stair_closet:
      name: The Closet Under the Stairs
      instance_of: loc_house
      threshold_type: threshold_doorway
      evidence: |
        a closet under the stairs, where no daylight entered

    loc_allerleirauh_palace_kitchen:
      name: The Palace Kitchen and Hearth
      instance_of: loc_hearth
      evidence: |
        Then she was sent into the kitchen

    loc_allerleirauh_festival_hall:
      name: The Festival Hall
      instance_of: loc_castle
      evidence: |
        she went up to the festival


