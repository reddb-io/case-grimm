propp:

  - function: func_donor_test
    order: 1
    actor: donkey_cabbages_wise_crone
    beneficiary: donkey_cabbages_huntsman
    scene: The hungry crone asks the merry huntsman for alms, and he gives what he can.
    evidence: |
      do give me an alms

  - function: func_donor_reward
    order: 2
    actor: donkey_cabbages_wise_crone
    beneficiary: donkey_cabbages_huntsman
    scene: In return for kindness, she tells him how to obtain the wishing-cloak and gold-producing bird heart.
    evidence: |
      I will make you a present in return for your kindness

  - function: func_magical_agent_acquisition
    order: 3
    actor: donkey_cabbages_huntsman
    scene: The huntsman shoots among the nine birds, takes the cloak, and swallows the dead bird's heart.
    evidence: |
      swallowed it down, and took the cloak home with him

  - function: func_departure
    order: 4
    actor: donkey_cabbages_huntsman
    scene: After accumulating gold, he leaves home to see the world.
    evidence: |
      I will go forth and see the world

  - function: func_villainy_planning
    order: 5
    actor: donkey_cabbages_old_witch
    victim: donkey_cabbages_huntsman
    scene: The old witch sees the treasure in his body and instructs her daughter to steal it.
    evidence: |
      we must filch it from him

  - function: func_deception
    order: 6
    actor: donkey_cabbages_maiden
    victim: donkey_cabbages_huntsman
    scene: The maiden makes the huntsman fall in love and helps remove the bird heart with the prepared drink.
    evidence: |
      he was so much in love with the young witch

  - function: func_theft
    order: 7
    actor: donkey_cabbages_maiden
    victim: donkey_cabbages_huntsman
    scene: The maiden steals the wishing-cloak while he sleeps on the Garnet Mountain.
    evidence: |
      she unfastened the mantle from his shoulders

  - function: func_abandonment
    order: 8
    actor: donkey_cabbages_maiden
    victim: donkey_cabbages_huntsman
    scene: She wishes herself home with the cloak and leaves him alone on the wild mountain.
    evidence: |
      left him alone on the wild mountain

  - function: func_escape_guidance
    order: 9
    actor: donkey_cabbages_giants
    beneficiary: donkey_cabbages_huntsman
    scene: The giants unknowingly reveal that clouds can carry him from the mountain summit.
    evidence: |
      the clouds will lay hold of him and bear him away

  - function: func_transformation_discovery
    order: 10
    actor: obj_donkey_cabbages_bad_cabbage
    victim: donkey_cabbages_huntsman
    scene: Hungry in the cabbage garden, the huntsman eats leaves and becomes an ass.
    evidence: |
      he was changed into an ass

  - function: func_counteragent_discovery
    order: 11
    actor: obj_donkey_cabbages_good_cabbage
    beneficiary: donkey_cabbages_huntsman
    scene: Eating a different cabbage restores his human form.
    evidence: |
      reassumed his former human shape

  - function: func_return_in_disguise
    order: 12
    actor: donkey_cabbages_huntsman
    scene: He dyes his face, returns as a king's messenger, and offers the witch the bad cabbage as exquisite salad.
    evidence: |
      I am a King’s messenger

  - function: func_punishment
    order: 13
    actor: obj_donkey_cabbages_bad_cabbage
    victim: donkey_cabbages_old_witch
    scene: The witch, servant, and maiden all eat the bad cabbage and become asses.
    evidence: |
      was, like the others, immediately deprived of her human form

  - function: func_retributive_service
    order: 14
    actor: donkey_cabbages_huntsman
    victim: donkey_cabbages_old_witch
    scene: He sends the three transformed women to the mill under unequal beating and feeding terms.
    evidence: |
      three beatings and one meal daily to the old donkey

  - function: func_pity_restoration
    order: 15
    actor: donkey_cabbages_huntsman
    beneficiary: donkey_cabbages_maiden
    scene: After the old witch dies and the other two sadden, he restores them with the good cabbage.
    evidence: |
      he gave them some of the good salad, so that they became human again

  - function: func_wedding
    order: 16
    actor: donkey_cabbages_huntsman
    beneficiary: donkey_cabbages_maiden
    scene: The maiden repents, offers back the stolen magic, and the huntsman marries her.
    evidence: |
      I will take thee for my true wife


