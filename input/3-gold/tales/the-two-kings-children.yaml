    two_kings_prince:
      name: The King's Son
      species: sp_human
      existential_states: [state_transformed, state_forgotten_bride]
      transformations: [transform_fugitive_pair]
      agency_modes: [agency_endurance, agency_speech, agency_social_rank]
      speech_acts_performed: [speech_promise]
      affects: [affect_fear, affect_love, affect_loyalty, affect_grief]
      traits: [sixteen-year-prophecy-target, stag-chaser, lake-palace-captive, threshold-sleeper, task-hero, fugitive-bridegroom, kiss-forgetter, restored-bridegroom]
      evidence: |
        the King’s son was separated from the others

    two_kings_youngest_princess:
      name: The Youngest King's Daughter
      archetypes: [arc_wise_helper]
      species: sp_human
      existential_states: [state_transformed, state_hidden_identity, state_forgotten_bride]
      transformations: [transform_fugitive_pair]
      agency_modes: [agency_cunning, agency_speech, agency_object_mediation, agency_domestic_labor, agency_endurance]
      speech_acts_performed: [speech_command, speech_bargain]
      affects: [affect_love, affect_loyalty, affect_grief, affect_fear]
      traits: [youngest-daughter, saint-image-commander, earth-worker-summoner, hair-comber, magic-flight-transformer, walnut-keeper, mill-servant, lamenting-forgotten-bride, true-bride]
      evidence: |
        the one by whom he last watched, can take him something

    two_kings_lake_king:
      name: The Lake-Palace King / Tall Stag-Man
      species: sp_human
      agency_modes: [agency_violence, agency_speech, agency_social_rank]
      speech_acts_performed: [speech_command, speech_promise]
      affects: [affect_anger]
      traits: [stag-disguised-captor, lake-dragger, daughter-guardian, death-threatener, impossible-task-setter, pursuing-father]
      evidence: |
        a great tall man was standing there instead of the stag

    two_kings_lake_queen:
      name: The Lake-Palace Queen
      species: sp_human
      agency_modes: [agency_cunning, agency_speech, agency_object_mediation]
      speech_acts_performed: [speech_command]
      affects: [affect_anger]
      traits: [father-corrector, final-pursuer, pond-drinker, walnut-giver, failed-retriever]
      evidence: |
        It is no use to send thee, I must go there myself.

    two_kings_elder_princesses:
      name: The Two Elder Daughters
      species: sp_human
      agency_modes: [agency_social_rank, agency_speech]
      traits: [elder-sisters, food-refusers, marriage-delay-pretext]
      evidence: |
        I cannot give away my youngest daughter until the two eldest are married.

    two_kings_earth_workers:
      name: The Little Earth-Workers
      being_type: being_dwarf
      agency_modes: [agency_domestic_labor, agency_endurance]
      traits: [summoned-little-earth-men, kindred-gatherers, forest-cutters, pond-cleaners, castle-builders, dismissed-workers]
      evidence: |
        numbers of little earth-men came forth

    two_kings_prince_mother:
      name: The Prince's Mother / False Mother
      species: sp_human
      agency_modes: [agency_cunning, agency_social_rank, agency_speech]
      speech_acts_performed: [speech_command]
      affects: [affect_anger]
      traits: [homecoming-kisser, memory-eraser, carriage-canceller, false-bride-arranger, door-locker, expelled-mother]
      evidence: |
        his mother gave him a kiss

    two_kings_false_bride:
      name: The Distant False Bride
      archetypes: [arc_false_bride]
      species: sp_human
      agency_modes: [agency_social_rank, agency_speech, agency_cunning]
      speech_acts_performed: [speech_bargain]
      affects: [affect_envy]
      traits: [distant-bride, dress-envier, night-bargainer, displaced-rival, expelled-bride]
      evidence: |
        a wife for her son, who came from quite a distant part of the world

    two_kings_servants:
      name: The Castle Servants
      species: sp_human
      agency_modes: [agency_domestic_labor, agency_speech]
      traits: [sleeping-drink-givers, awakened-listeners, second-night-allies]
      evidence: |
        the servants were ordered to give the King’s son a sleeping-drink

    two_kings_miller:
      name: The Miller
      species: sp_human
      agency_modes: [agency_domestic_labor, agency_speech]
      traits: [employer, church-leave-giver]
      evidence: |
        the maiden served the miller honorably and faithfully

    two_kings_priest:
      name: The Wedding Priest
      species: sp_human
      agency_modes: [agency_speech, agency_social_rank]
      traits: [wedding-blesser, altar-officiant]
      evidence: |
        they were blessed by the priest

  magic_objects:

    obj_two_kings_stag_form:
      name: The Great Stag Form
      object_kind: creature_object
      attributes:
        function: lure-form that draws the prince out of the forest to the tall captor
      evidence: |
        he saw a great stag which he wanted to shoot

    obj_two_kings_glass_skates:
      name: The Six Pairs of Ruined Glass Skates
      object_kind: garment
      attributes:
        count: 6
        function: comic measure of the tall man's long pursuit of the prince
      evidence: |
        ruined six pairs of glass skates

    obj_two_kings_st_christopher_images:
      name: The Three Stone Images of St. Christopher
      instance_of: obj_sacred_answering_image
      object_kind: relic
      attributes:
        count: 3
        function: answer the father's hourly watch-calls while the prince sleeps
      evidence: |
        there stood a stone image of St. Christopher

    obj_two_kings_glass_tools:
      name: The Glass Tools for Impossible Labour
      object_kind: tool
      attributes:
        forms: [axe, wedge, mallet, shovel, hoe, gimlet]
        function: fragile tools that make the forest, pond, and mountain tasks humanly impossible
      evidence: |
        he gave him a glass axe, a glass wedge, and a glass mallet

    obj_two_kings_knotted_handkerchief:
      name: The Knotted White Handkerchief
      instance_of: obj_summoning_handkerchief
      object_kind: garment
      attributes:
        function: summons and dismisses the earth-workers when struck three times on the earth
      evidence: |
        she took her handkerchief and made a knot in it

    obj_two_kings_three_walnuts:
      name: The Three Need-Walnuts
      object_kind: token
      attributes:
        count: 3
        function: deferred help from the mother after the failed pursuit
      evidence: |
        the Queen gave her daughter three walnuts

    obj_two_kings_walnut_dresses:
      name: The Three Dresses Inside the Walnuts
      object_kind: garment
      attributes:
        count: 3
        function: increasingly splendid dresses bartered for nights beside the forgotten prince
      evidence: |
        a beautiful dress lay inside it

    obj_two_kings_sleeping_drink:
      name: The Sleeping-Drink
      instance_of: obj_sleeping_draught
      object_kind: food
      attributes:
        function: drugged drink intended to prevent the prince from hearing the forgotten bride's lament
      evidence: |
        give the King’s son a sleeping-drink

    obj_two_kings_wedding_flowers_ribbons:
      name: The Wedding Flowers and Foot-Ribbons
      object_kind: material
      attributes:
        function: children's festive gifts at the restored true wedding
      evidence: |
        gave them flowers, and offered them gay ribbons to bind about their feet

  locations:

    loc_two_kings_hunting_forest:
      name: The Hunting Forest
