propp:

  - function: func_prophecy
    order: 1
    actor: two_kings_prince
    scene: The prince is foretold to die by a stag at sixteen.
    evidence: |
      it had been foretold that he should be killed by a stag

  - function: func_capture
    order: 2
    actor: two_kings_lake_king
    victim: two_kings_prince
    scene: The stag chase draws the prince from the forest to the tall man, who drags him through the lake.
    evidence: |
      dragged him through a great lake to a great palace

  - function: func_difficult_task
    order: 3
    actor: two_kings_lake_king
    victim: two_kings_prince
    scene: The king imposes three nights of answering watch-calls under threat of death.
    evidence: |
      if thou then givest me no answer, to-morrow morning thou shall be put to death

  - function: func_magical_agent
    order: 4
    actor: two_kings_youngest_princess
    beneficiary: two_kings_prince
    scene: The princess commands St. Christopher images to answer for the sleeping prince.
    evidence: |
      give him an answer instead of the King’s son

  - function: func_difficult_task
    order: 5
    actor: two_kings_lake_king
    victim: two_kings_prince
    scene: The king requires forest-cutting, pond-clearing, and castle-building with fragile glass tools.
    evidence: |
      thou must still do something more for her sake

  - function: func_helper_intervention
    order: 6
    actor: two_kings_youngest_princess
    beneficiary: two_kings_prince
    scene: The princess summons earth-workers three times while the prince sleeps.
    evidence: |
      Earth-workers, come forth

  - function: func_task_solution
    order: 7
    actor: two_kings_earth_workers
    beneficiary: two_kings_prince
    scene: The earth-workers complete the impossible forest, pond, and mountain-castle tasks.
    evidence: |
      all was ready

  - function: func_departure
    order: 8
    actor: two_kings_prince
    beneficiary: two_kings_youngest_princess
    scene: The lovers flee by night after the father postpones marriage again.
    evidence: |
      ran away with her

  - function: func_pursuit
    order: 9
    actor: two_kings_lake_king
    victim: two_kings_youngest_princess
    scene: The father pursues twice and is fooled by briar/rose and church/priest transformations.
    evidence: |
      saw her father behind her

  - function: func_pursuit
    order: 10
    actor: two_kings_lake_queen
    victim: two_kings_youngest_princess
    scene: The mother pursues herself and is defeated by the fishpond/fish transformation.
    evidence: |
      Now we are undone, for my mother is coming herself

  - function: func_donor_gift
    order: 11
    actor: two_kings_lake_queen
    beneficiary: two_kings_youngest_princess
    scene: The mother concedes and gives the princess three walnuts for greatest need.
    evidence: |
      With these thou canst help thyself when thou art in thy greatest need.

  - function: func_absentation
    order: 12
    actor: two_kings_prince
    victim: two_kings_youngest_princess
    scene: The prince leaves the bride in the village while he goes to fetch a carriage.
    evidence: |
      Stay here, my dearest

  - function: func_villainy
    order: 13
    actor: two_kings_prince_mother
    victim: two_kings_youngest_princess
    scene: The prince's mother kisses him, making him forget bride and mission.
    evidence: |
      his mother gave him a kiss, and he forgot everything

  - function: func_unrecognized_service
    order: 14
    actor: two_kings_youngest_princess
    scene: The forgotten bride takes mill service near the prince's castle.
    evidence: |
      the maiden served the miller honorably and faithfully

  - function: func_false_wedding
    order: 15
    actor: two_kings_false_bride
    victim: two_kings_youngest_princess
    scene: A distant bride is brought for the prince and the forgotten princess attends in a walnut dress.
    evidence: |
      a wife for her son, who came from quite a distant part of the world

  - function: func_bargain
    order: 16
    actor: two_kings_youngest_princess
    beneficiary: two_kings_false_bride
    scene: The princess trades the first dress for a night outside the prince's door, but he is drugged.
    evidence: |
      the bride might perhaps earn it

  - function: func_recognition
    order: 17
    actor: two_kings_prince
    beneficiary: two_kings_youngest_princess
    scene: On the second purchased night the prince hears her lament and his memory returns.
    evidence: |
      what was past came back to him

  - function: func_wedding
    order: 18
    actor: two_kings_priest
    beneficiary: two_kings_youngest_princess
    scene: The true pair marry after the third walnut dress, while the false mother and bride depart.
    evidence: |
      they were blessed by the priest, and had a merry wedding


