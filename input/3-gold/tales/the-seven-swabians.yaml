propp:

  - function: func_initial_situation
    order: 1
    actor: seven_swabians_allies
    scene: Seven named Swabians decide to seek adventures and great deeds.
    evidence: |
      travel about the world to seek adventures, and perform great deeds

  - function: func_equipping
    order: 2
    actor: seven_swabians_allies
    scene: They make one long spear and all hold it at once for security.
    evidence: |
      This spear all seven of them took in their hands at once

  - function: func_false_threat
    order: 3
    actor: seven_swabians_beetle_hornet
    victim: seven_swabians_master_schulz
    scene: A humming insect is misheard as a drum and starts the first panic.
    evidence: |
      I hear a drum

  - function: func_panic
    order: 4
    actor: seven_swabians_master_schulz
    scene: Schulz flees over a hedge, lands on a rake, and surrenders to an enemy who is not there.
    evidence: |
      Take me prisoner; I surrender! I surrender!

  - function: func_collective_contagion
    order: 5
    actor: seven_swabians_allies
    scene: The other six imitate Schulz's surrender and then swear silence about the mistake.
    evidence: |
      If you surrender, I surrender too!

  - function: func_second_false_threat
    order: 6
    actor: seven_swabians_hare
    victim: seven_swabians_allies
    scene: The sleeping hare is taken for a horrible wild beast that might swallow them.
    evidence: |
      All of them were alarmed at the sight of the horrible wild beast

  - function: func_mock_combat
    order: 7
    actor: seven_swabians_allies
    scene: The allies advance with battle verse, prayer, and anguish against the supposed dragon.
    evidence: |
      Hereupon they all together set on the dragon

  - function: func_exposure
    order: 8
    actor: seven_swabians_hare
    scene: The hare wakes and runs away, revealing that the monster is only a hare.
    evidence: |
      The monster’s nothing but a hare!

  - function: func_crossing_question
    order: 9
    actor: seven_swabians_allies
    scene: At the Moselle, they ask a man across the river how people get over.
    evidence: |
      to know how people contrived to get across

  - function: func_misheard_answer
    order: 10
    actor: seven_swabians_river_worker
    victim: seven_swabians_master_schulz
    scene: The man's "What? what?" is misheard as an instruction to wade.
    evidence: |
      Master Schulz thought he was saying, “Wade, wade through the water,”

  - function: func_drowning
    order: 11
    actor: loc_seven_swabians_moselle
    victim: seven_swabians_master_schulz
    scene: Schulz enters the Moselle and sinks in mud and deep waves.
    evidence: |
      he sank in the mud and the deep waves

  - function: func_fatal_echo
    order: 12
    actor: seven_swabians_frog
    victim: seven_swabians_allies
    scene: The frog croaks beside Schulz's hat and the six hear it as their leader calling them.
    evidence: |
      Master Schulz is calling us

  - function: func_anti_return
    order: 13
    actor: loc_seven_swabians_moselle
    victim: seven_swabians_allies
    scene: The remaining six jump in and all the Swabian allies die away from home.
    evidence: |
      not one of the Swabian allies ever reached home again


