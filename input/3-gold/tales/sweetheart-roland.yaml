propp:

  - function: func_villainy
    order: 1
    actor: sweetheart_roland_witch_daughter
    victim: sweetheart_roland_maiden
    scene: "envy over the apron leads the witch's daughter to demand it"
    evidence: "fancied so much that she became envious"

  - function: func_villainy
    order: 2
    actor: sweetheart_roland_witch
    victim: sweetheart_roland_maiden
    scene: "witch plots to cut off the stepdaughter's head in bed"
    evidence: "to-night when she is asleep I will come and cut her head off."

  - function: func_trickery
    order: 3
    actor: sweetheart_roland_maiden
    victim: sweetheart_roland_witch
    scene: "maiden changes bed positions so the witch kills her own child"
    evidence: "took for herself the place at the back, close by the wall."

  - function: func_departure
    order: 4
    actor: sweetheart_roland_maiden
    beneficiary: sweetheart_roland
    scene: "maiden wakes Roland and the lovers flee with the stolen wand"
    evidence: "we must fly in all haste"

  - function: func_magical_agent
    order: 5
    actor: obj_sweetheart_roland_blood_drops
    beneficiary: sweetheart_roland_maiden
    scene: "three blood drops answer the witch from stairs, kitchen, and bed"
    evidence: "dropped three drops of blood on the ground"

  - function: func_pursuit
    order: 6
    actor: sweetheart_roland_witch
    victim: sweetheart_roland_maiden
    scene: "witch pursues the fugitives with many-league boots"
    evidence: "it was not long before she overtook them."

  - function: func_rescue
    order: 7
    actor: sweetheart_roland_maiden
    beneficiary: sweetheart_roland
    scene: "maiden transforms Roland into a lake and herself into a duck"
    evidence: "changed, with her magic wand, her sweetheart Roland into a lake"

  - function: func_rescue
    order: 8
    actor: sweetheart_roland
    beneficiary: sweetheart_roland_maiden
    scene: "Roland's fiddle compels the witch to dance in thorns until dead"
    evidence: "she was forced to dance"

  - function: func_absentation
    order: 9
    actor: sweetheart_roland
    victim: sweetheart_roland_maiden
    scene: "Roland leaves to arrange the wedding while the maiden waits as a landmark"
    evidence: "Now I will go to my father and arrange for the wedding."

  - function: func_villainy
    order: 10
    actor: sweetheart_roland_rival_woman
    victim: sweetheart_roland_maiden
    scene: "another woman makes Roland forget the maiden"
    evidence: "he forgot the maiden."

  - function: func_transformation
    order: 11
    actor: sweetheart_roland_maiden
    scene: "forgotten maiden becomes a flower and is taken by the shepherd"
    evidence: "changed herself into a flower"

  - function: func_unrecognized_service
    order: 12
    actor: sweetheart_roland_maiden
    beneficiary: sweetheart_roland_shepherd
    scene: "flower-maiden secretly keeps the shepherd's house"
    evidence: "all the work was already done"

  - function: func_release
    order: 13
    actor: obj_sweetheart_roland_white_cloth
    beneficiary: sweetheart_roland_maiden
    scene: "white cloth ends the flower transformation"
    evidence: "Instantly the transformation came to an end"

  - function: func_recognition
    order: 14
    actor: sweetheart_roland
    beneficiary: sweetheart_roland_maiden
    scene: "Roland hears her song and recognizes the true bride"
    evidence: "I know the voice, that is the true bride"

  - function: func_wedding
    order: 15
    actor: sweetheart_roland
    beneficiary: sweetheart_roland_maiden
    scene: "faithful maiden marries Roland and grief ends"
    evidence: "held her wedding with her sweetheart Roland"


