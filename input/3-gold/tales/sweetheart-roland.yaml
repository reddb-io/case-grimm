# yaml-language-server: $schema=../schemas/tale.schema.json

slug: sweetheart-roland
khm: 56
atu: '1119/313/884'
atu_name: Sweetheart Roland
canonical_source: ../../2-silver/canonical/sweetheart-roland/canonical.txt
title: Sweetheart Roland


entities:

  characters:

    sweetheart_roland_witch:
      name: The Witch Stepmother
      archetypes: [arc_cruel_stepmother]
      species: sp_human
      being_type: being_witch
      agency_modes: [agency_cunning, agency_violence, agency_speech, agency_object_mediation]
      speech_acts_performed: [speech_command]
      affects: [affect_envy, affect_anger]
      traits: [real-witch, own-daughter-favouring, stepdaughter-hating, axe-murderer, many-league-pursuer, bread-crumb-tempter, dance-punished]
      evidence: |
        There was once on a time a woman who was a real witch

    sweetheart_roland_witch_daughter:
      name: The Ugly Wicked Daughter
      archetypes: [arc_envious_witness]
      species: sp_human
      agency_modes: [agency_speech]
      affects: [affect_envy]
      traits: [own-daughter, apron-envying, bed-positioned, mistaken-victim, beheaded]
      evidence: |
        one ugly and wicked, and this one she loved because she was her
        own daughter

    sweetheart_roland_maiden:
      name: The Faithful Stepmother's Daughter
      archetypes: [arc_oppressed_maiden]
      species: sp_human
      agency_modes: [agency_cunning, agency_speech, agency_endurance, agency_domestic_labor, agency_music]
      existential_states: [state_transformed, state_forgotten_bride]
      transformations: [transform_fugitive_pair]
      affects: [affect_fear, affect_loyalty, affect_grief]
      traits: [beautiful, good, apron-owner, murder-overhearer, place-switcher, wand-thief, blood-decoy-maker, magic-flight-transformer, red-landmark, flower-maid, shepherd-housekeeper, faithful-singer, true-bride]
      evidence: |
        one beautiful and good, and this one she hated, because she was
        her step-daughter.

    sweetheart_roland:
      name: Sweetheart Roland
      species: sp_human
      agency_modes: [agency_speech, agency_music, agency_endurance]
      existential_states: [state_transformed, state_deceived]
      transformations: [transform_fugitive_pair]
      affects: [affect_loyalty]
      traits: [lover, wand-counsellor, lake-form, fiddler-form, wedding-arranger, forgetful-bridegroom, voice-recognizer]
      evidence: |
        her sweetheart, who was called Roland

    sweetheart_roland_rival_woman:
      name: The Woman Who Makes Roland Forget
      archetypes: [arc_false_bride]
      species: sp_human
      agency_modes: [agency_cunning]
      traits: [forgetfulness-agent, rival-bride, wedding-displaced]
      evidence: |
        he fell into the snares of another, who prevailed on him so far
        that he forgot the maiden.

    sweetheart_roland_shepherd:
      name: The Shepherd Who Finds the Flower
      species: sp_human
      agency_modes: [agency_domestic_labor, agency_speech]
      affects: [affect_fear]
      traits: [field-shepherd, flower-picker, chest-keeper, enchanted-householder, wise-woman-seeker, rejected-suitor]
      evidence: |
        a shepherd kept his sheep in the field, and saw the flower

    sweetheart_roland_wise_woman:
      name: The Wise Woman Who Breaks the Flower Spell
      archetypes: [arc_wise_helper]
      species: sp_human
      agency_modes: [agency_speech]
      traits: [enchantment-diagnoser, dawn-instruction-giver, white-cloth-counsellor]
      evidence: |
        he went to a wise woman and asked for her advice.

    sweetheart_roland_country_girls:
      name: The Country Girls at Roland's Wedding
      species: sp_human
      agency_modes: [agency_music, agency_speech]
      traits: [custom-singers, bride-honourers, maiden-summoners]
      evidence: |
        all the girls were to be present at it, and sing in honour of
        the bridal pair.

  magic_objects:

    obj_sweetheart_roland_pretty_apron:
      name: The Pretty Apron
      object_kind: garment
      attributes:
        function: desired object that triggers envy and murder plot
      evidence: |
        The step-daughter once had a pretty apron

    obj_sweetheart_roland_murder_axe:
      name: The Witch's Axe
      object_kind: weapon
      attributes:
        function: murder weapon that kills the witch's own daughter by bed substitution
      evidence: |
        she held an axe in her right hand

    obj_sweetheart_roland_magic_wand:
      name: The Witch's Magic Wand
      instance_of: obj_enchanting_wand
      object_kind: tool
      attributes:
        function: stolen transformation instrument for the magic flight
      evidence: |
        I counsel thee first to take away her magic wand

    obj_sweetheart_roland_blood_drops:
      name: The Three Speaking Drops of Blood
      instance_of: obj_speaking_blood_decoy
      object_kind: token
      attributes:
        count: 3
        locations: [bed-front, kitchen, stairs]
        function: answer the witch and delay discovery of the flight
      evidence: |
        dropped three drops of blood on the ground

    obj_sweetheart_roland_many_league_boots:
      name: The Witch's Many League Boots
      instance_of: obj_many_league_boots
      object_kind: garment
      attributes:
        function: accelerates the witch's pursuit of the fugitives
      evidence: |
        many league boots, in which went an hour’s walk at every step

    obj_sweetheart_roland_bread_crumbs:
      name: The Witch's Bread-crumbs
      object_kind: food
      attributes:
        function: lure thrown from shore to entice the duck-form maiden
      evidence: |
        threw bread-crumbs in

    obj_sweetheart_roland_fiddle:
      name: Roland's Fiddle
      instance_of: obj_fiddle
      object_kind: instrument
      attributes:
        function: compels the witch into the thorn-dance that kills her
      evidence: |
        her sweetheart Roland into a fiddler.

    obj_sweetheart_roland_red_landmark:
      name: The Red Stone Landmark Form
      object_kind: token
      attributes:
        function: self-concealing waiting form while Roland arranges the wedding
      evidence: |
        I will change myself into a red stone land-mark.

    obj_sweetheart_roland_flower_form:
      name: The Maiden's Flower Form
      object_kind: material
      attributes:
        function: abandoned waiting form; later hidden in the shepherd's chest
      evidence: |
        changed herself into a flower

    obj_sweetheart_roland_shepherd_chest:
      name: The Shepherd's Chest
      object_kind: architecture
      attributes:
        function: keeps the flower form from which the maiden secretly keeps house
      evidence: |
        took it with him, and laid it away in his chest.

    obj_sweetheart_roland_white_cloth:
      name: The White Cloth That Stops the Magic
      object_kind: garment
      attributes:
        function: breaks the flower transformation when thrown over the emerging form
      evidence: |
        throw a white cloth over it

  locations:

    loc_sweetheart_roland_witch_house:
      name: The Witch Household
      instance_of: loc_witch_house
      threshold_type: threshold_doorway
      evidence: |
        All day long she dared not go out of doors

    loc_sweetheart_roland_murder_bed:
      name: The Murder Bed
      instance_of: loc_house
      evidence: |
        be careful that thou art at the far-side of the bed

    loc_sweetheart_roland_kitchen:
      name: The Kitchen of the Blood Decoy
      instance_of: loc_hearth
      evidence: |
        Here in the kitchen, I am warming myself

    loc_sweetheart_roland_stairs:
      name: The Stairs of the Blood Decoy
      instance_of: loc_house
      threshold_type: threshold_doorway
      evidence: |
        Here, on the stairs, I am sweeping

    loc_sweetheart_roland_lake:
      name: The Lake and Duck Transformation
      instance_of: loc_brook
      evidence: |
        changed, with her magic wand, her sweetheart Roland into a lake

    loc_sweetheart_roland_briar_hedge:
      name: The Briar Hedge of the Magical Dance
      instance_of: loc_forest
      threshold_type: threshold_forest
      evidence: |
        a beautiful flower which stood in the midst of a briar hedge

    loc_sweetheart_roland_field:
      name: The Field of Waiting and Shepherding
      instance_of: loc_meadow
      evidence: |
        the girl stood like a red land-mark in the field

    loc_sweetheart_roland_shepherd_house:
      name: The Shepherd's House
      instance_of: loc_house
      threshold_type: threshold_doorway
      evidence: |
        strange things happened in the shepherd’s house.

    loc_sweetheart_roland_wedding:
      name: Roland's Rival Wedding
      instance_of: loc_castle
      threshold_type: threshold_doorway
      evidence: |
        Roland’s wedding was to be celebrated


classifications:

  world_laws:
    - law_speaking_blood_decoys_pursuit
    - law_loyal_pair_magic_flight
    - law_music_attracts
    - law_voice_recognizes_forgotten_bride

  moral_regimes:
