propp:

  - function: func_initial_situation
    order: 1
    actor: lambfish_brother_fish
    beneficiary: lambfish_sister_lamb
    scene: "a motherless brother and sister love one another while the unkind stepmother secretly seeks to hurt them"
    evidence: "loved each other with all their hearts"

  - function: func_play_formula
    order: 2
    actor: lambfish_brother_fish
    scene: "the children play counting-out in the meadow around the pond"
    evidence: "played at counting out"

  - function: func_villainy
    order: 3
    actor: lambfish_stepmother
    victim: lambfish_brother_fish
    scene: "angry at their merry play, the witch-stepmother changes the brother into a fish and the sister into a lamb"
    evidence: "bewitched them both"

  - function: func_animal_lament
    order: 4
    actor: lambfish_brother_fish
    beneficiary: lambfish_sister_lamb
    scene: "the fish and lamb live sadly apart, one in the pond and one in the meadow"
    evidence: "was very sad"

  - function: func_murder_attempt
    order: 5
    actor: lambfish_stepmother
    victim: lambfish_sister_lamb
    scene: "when visitors arrive, the stepmother orders the cook to kill the lamb for the meal"
    evidence: "Go and fetch the lamb from the meadow and kill it"

  - function: func_recognition_by_lament
    order: 6
    actor: lambfish_cook
    beneficiary: lambfish_sister_lamb
    scene: "the cook hears the lamb and fish speak as siblings and understands that the lamb is bewitched"
    evidence: "could be no common lamb"

  - function: func_rescue
    order: 7
    actor: lambfish_cook
    beneficiary: lambfish_sister_lamb
    scene: "the cook refuses to kill the lamb, substitutes another sheep, and sends the lamb to a good peasant woman"
    evidence: "I will not kill thee"

  - function: func_disenchantment
    order: 8
    actor: lambfish_wise_woman
    beneficiary: lambfish_brother_fish
    scene: "the foster-mother brings the lamb to a wise woman whose blessing restores both siblings to human form"
    evidence: "they regained their human forms"

  - function: func_resolution
    order: 9
    actor: lambfish_wise_woman
    beneficiary: lambfish_sister_lamb
    scene: "the wise woman takes both restored children into a forest hut, where they live contentedly"
    evidence: "were contented and happy"


