    loc_iron_stove_glass_mountain:
      name: The High Glass Mountain
      instance_of: loc_mountain
      evidence: |
        a high glass mountain

    loc_iron_stove_piercing_swords:
      name: The Three Piercing Swords
      instance_of: loc_road
      evidence: |
        go over three piercing swords

    loc_iron_stove_great_lake:
      name: The Great Lake Before the Prince's Castle
      instance_of: loc_lake
      evidence: |
        a great lake

    loc_iron_stove_prince_castle:
      name: The Prince's Castle of the False Bride
      instance_of: loc_castle
      threshold_type: threshold_doorway
      evidence: |
        she came to a large and beautiful castle

    loc_iron_stove_scullery:
      name: The Low-Wage Scullery
      instance_of: loc_house
      evidence: |
        she was taken as a scullery-maid at low wages

    loc_iron_stove_bridegroom_chamber:
      name: The Bridegroom's Chamber
      instance_of: loc_bedchamber
      threshold_type: threshold_doorway
      evidence: |
        sleep one night in her bridegroom’s chamber

    loc_iron_stove_final_castle:
      name: The Disenchanted Toad Castle
      instance_of: loc_castle
      threshold_type: threshold_doorway
      evidence: |
        it was a great castle


