propp:

  - function: func_villainy
    order: 1
    actor: iron_stove_old_witch
    victim: iron_stove_prince
    scene: "an old witch imprisons the king's son in an iron stove in the forest"
    evidence: "bewitched by an old witch, and shut up in an iron stove in a forest"

  - function: func_lack
    order: 2
    actor: iron_stove_princess
    scene: "the king's daughter is lost in the forest and cannot return home"
    evidence: "I have lost my father’s kingdom, and cannot get home again"

  - function: func_donor_contract
    order: 3
    actor: iron_stove_prince
    beneficiary: iron_stove_princess
    scene: "the stove promises swift return home if she promises release and marriage"
    evidence: "if thou wilt promise to do what I desire of thee"

  - function: func_false_solution
    order: 4
    actor: iron_stove_old_king
    scene: "the father sends two beautiful substitutes, but the stove rejects both"
    evidence: "They therefore resolved they would send, in her place"

  - function: func_difficult_task
    order: 5
    actor: iron_stove_princess
    scene: "the true promised bride scrapes the iron until the prince can emerge"
    evidence: "she went on scraping, and made the hole so large that he was able to get out"

  - function: func_violation
    order: 6
    actor: iron_stove_princess
    scene: "she speaks more than the permitted three words to her father"
    evidence: "she spoke more than three words"

  - function: func_departure
    order: 7
    actor: iron_stove_princess
    scene: "she returns to the forest and seeks the vanished stove for nine days"
    evidence: "For nine days she sought it"

  - function: func_donor_test
    order: 8
    actor: iron_stove_fat_toad
    beneficiary: iron_stove_princess
    scene: "the toad household feeds, lodges, and equips her for the impossible thresholds"
    evidence: "the old toad gave her three needles out of the great box"

  - function: func_guidance
    order: 9
    actor: obj_iron_stove_three_needles
    scene: "the donor tools carry her over glass mountain, piercing swords, and lake"
    evidence: "If she did all this she would get her lover back again"

  - function: func_difficult_task
    order: 10
    actor: iron_stove_princess
    scene: "as a low-wage scullery-maid she barters three nut-dresses for nights in the bridegroom's chamber"
    evidence: "leave to sleep one night in her bridegroom’s chamber"

  - function: func_recognition
    order: 11
    actor: iron_stove_prince
    scene: "on the third night he hears her lament and recognizes the true bride"
    evidence: "Thou art the true one, thou art mine, and I am thine."

  - function: func_return
    order: 12
    actor: iron_stove_princess
    scene: "the couple return across lake, swords, and glass mountain to the toad house"
    evidence: "When they came to the great lake, they sailed across it"

  - function: func_transfiguration
    order: 13
    actor: iron_stove_toad_household
    scene: "the toads are disenchanted as king's children and their house becomes a great castle"
    evidence: "the toads were all disenchanted, and were King’s children"

  - function: func_wedding
    order: 14
    actor: iron_stove_princess
    scene: "the true couple celebrates the wedding and unites two kingdoms"
    evidence: "Then the wedding was celebrated"


