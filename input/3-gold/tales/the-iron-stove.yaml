title: The Iron Stove


entities:

  characters:

    iron_stove_princess:
      name: The King's Daughter / Faithful Seeker
      archetypes: [arc_reluctant_bride]
      species: sp_human
      agency_modes: [agency_endurance, agency_object_mediation, agency_speech, agency_domestic_labor, agency_cunning]
      existential_states: [state_bound_by_promise, state_forgotten_bride]
      speech_acts_performed: [speech_promise, speech_bargain, speech_request]
      affects: [affect_fear, affect_grief, affect_loyalty, affect_hunger, affect_love]
      traits: [lost-princess, promise-bound, substitute-protected, iron-scraper, speech-limit-breaker, nine-day-seeker, toad-house-guest, impossible-threshold-crosser, scullery-maid, night-bargainer, true-bride]
      evidence: |
        a King’s daughter came into the forest, who had lost herself

    iron_stove_old_king:
      name: The Old King, Her Father
      species: sp_human
      agency_modes: [agency_social_rank, agency_speech, agency_cunning]
      speech_acts_performed: [speech_command]
      affects: [affect_fear, affect_grief]
      traits: [one-daughter-father, substitute-sender, promise-evader, later-fetched]
      evidence: |
        the old King fell on her neck and kissed her

    iron_stove_prince:
      name: The King's Son Inside the Iron Stove
      archetypes: [arc_enchanted_prince]
      species: sp_human
      agency_modes: [agency_speech, agency_social_rank, agency_object_mediation]
      existential_states: [state_imprisoned, state_forgotten_bride]
      transformations: [transform_release_by_violence]
      speech_acts_performed: [speech_promise, speech_command, speech_bargain]
      affects: [affect_love, affect_grief]
      traits: [bewitched-prince, stove-prisoner, voice-in-iron, substitute-detector, released-bridegroom, displaced-lover, third-night-recognizer]
      evidence: |
        a King’s son was bewitched by an old witch, and shut up in an iron stove

    iron_stove_old_witch:
      name: The Old Witch Who Bewitched the Prince
      being_type: being_witch
      agency_modes: [agency_violence]
      traits: [offstage-curser, stove-imprisoner]
      evidence: |
        bewitched by an old witch

    iron_stove_silent_companion:
      name: The Silent Homeward Companion
      archetypes: [arc_wise_helper]
      agency_modes: [agency_animal_aid, agency_endurance]
      traits: [silent-guide, two-hour-home-leader]
      evidence: |
        a companion who walked near her, but did not speak

    iron_stove_millers_daughter:
      name: The Miller's Daughter Substitute
      archetypes: [arc_false_bride]
      species: sp_human
      agency_modes: [agency_domestic_labor, agency_speech]
      traits: [beautiful-substitute, iron-scraper, mill-noise-revealer, rejected]
      evidence: |
        the miller’s daughter, who was very beautiful

    iron_stove_swineherds_daughter:
      name: The Swineherd's Daughter Substitute
      archetypes: [arc_false_bride]
      species: sp_human
      agency_modes: [agency_domestic_labor, agency_speech]
      traits: [prettier-substitute, gold-paid, horn-noise-revealer, rejected]
      evidence: |
        a swine-herd’s daughter, who was even prettier

    iron_stove_fat_toad:
      name: The Old Fat Toad Donor
      archetypes: [arc_supernatural_donor]
      species: sp_toad
      agency_modes: [agency_speech, agency_object_mediation, agency_domestic_labor]
      existential_states: [state_transformed]
      speech_acts_performed: [speech_command]
      traits: [old-house-host, box-keeper, food-giver, threshold-tool-donor, disenchanted-royal]
      evidence: |
        The fat toad cried

    iron_stove_little_toad:
      name: The Little Green Waiting-Maid Toad
      species: sp_toad
      agency_modes: [agency_domestic_labor, agency_speech]
      existential_states: [state_transformed]
      traits: [limping-waiting-maid, door-opener, box-bringer, disenchanted-royal]
      evidence: |
        a small toad came walking by and opened the door to her

    iron_stove_toad_household:
      name: The Toad Household / King's Children
      species: sp_toad
      agency_modes: [agency_domestic_labor]
      existential_states: [state_transformed]
      transformations: [transform_animal_human]
      traits: [big-and-little-toads, hospitable-household, disenchanted-kings-children]
      evidence: |
        the toads were all disenchanted, and were King’s children

    iron_stove_false_bride:
      name: The Other Maiden / False Bride
      archetypes: [arc_false_bride]
      species: sp_human
      agency_modes: [agency_cunning, agency_speech, agency_object_mediation]
      speech_acts_performed: [speech_bargain]
      affects: [affect_greed, affect_envy]
      traits: [replacement-bride, dress-coveter, sleeping-draught-user, displaced-rival]
      evidence: |
        another maiden by his side whom he wanted to marry

    iron_stove_servants:
      name: The Chamber-Door Servants
      species: sp_human
      agency_modes: [agency_domestic_labor, agency_speech]
      traits: [night-listeners, lament-reporters]
      evidence: |
        The servants sat by the chamber-door

  magic_objects:

    obj_iron_stove_prison:
      name: The Enchanted Iron Stove
      instance_of: obj_enchanted_iron_stove_prison
      object_kind: architecture
      attributes:
        function: iron prison of the bewitched prince and voice-source of the bargain
      evidence: |
        shut up in an iron stove in a forest

    obj_iron_stove_scraping_knife:
      name: The Knife for Scraping Iron
      object_kind: tool
      attributes:
        function: release tool that scrapes a hole in the iron stove
      evidence: |
        bring a knife with thee, and scrape a hole in the iron

    obj_iron_stove_three_needles:
      name: The Three Large Needles
      object_kind: tool
      attributes:
        count: 3
        function: grip-tools for crossing the slippery glass mountain
      evidence: |
        three large needles

    obj_iron_stove_plough_wheel:
      name: The Plough-Wheel
      object_kind: tool
      attributes:
        function: rolling vehicle for crossing the three piercing swords
      evidence: |
        a plough-wheel

    obj_iron_stove_three_nuts:
      name: The Three Dress-Nuts
      object_kind: token
      attributes:
        count: 3
        function: deferred donor-gifts containing royal garments
      evidence: |
        three nuts

    obj_iron_stove_royal_garments:
      name: The Three Royal Garments from the Nuts
      instance_of: obj_celestial_dresses
      object_kind: garment
      attributes:
        count: 3
        function: wonder-gifts bartered for three nights near the bridegroom
      evidence: |
        there was a stately royal garment in it

    obj_iron_stove_sleeping_draught:
      name: The Sleeping-Draught in Wine
      instance_of: obj_sleeping_draught
      object_kind: food
      attributes:
        function: drugged wine that prevents recognition on the first two nights
      evidence: |
        a glass of wine in which she had poured a sleeping-draught

  locations:

    loc_iron_stove_forest:
      name: The Great Wild Forest
