slug: the-peasants-clever-daughter
khm: 94
atu: '875'
atu_name: The Clever Peasant Girl
canonical_source: ../../2-silver/canonical/the-peasants-clever-daughter/canonical.txt
title: The Peasant's Clever Daughter


entities:

  characters:

    peasants_clever_daughter:
      name: The Peasant's Clever Daughter / Queen
      archetypes: [arc_clever_peasant_bride]
      species: sp_human
      agency_modes: [agency_cunning, agency_speech, agency_social_rank, agency_object_mediation]
      speech_acts_performed: [speech_riddle, speech_command]
      affects: [affect_love, affect_loyalty, affect_pity]
      traits: [poor-peasant-daughter, practical-wisdom, riddle-solver, queen, judicial-adviser, literal-command-restorer]
      evidence: |
        She at once said yes, she would guess it.

    peasants_clever_father:
      name: The Poor Peasant Father
      species: sp_human
      agency_modes: [agency_speech, agency_domestic_labor]
      existential_states: [state_imprisoned]
      affects: [affect_grief]
      traits: [landless, grateful-to-king, daughter-disobeyer, prison-regretful, released-father]
      evidence: |
        Ah! if I had but listened to my daughter!

    peasants_clever_king:
      name: The King
      species: sp_human
      agency_modes: [agency_social_rank, agency_speech]
      speech_acts_performed: [speech_riddle, speech_command]
      affects: [affect_love, affect_anger, affect_shame]
      traits: [land-granter, riddle-tester, husband, bad-judge, wife-dismisser, reconciled-king]
      evidence: |
        he would set her a riddle, and if she could guess that, he
        would marry her.

    peasants_clever_servants:
      name: The King's Servants
      species: sp_human
      agency_modes: [agency_domestic_labor, agency_speech]
      traits: [prison-feeders, report-the-prisoner, carriage-assistants]
      evidence: |
        The servants had daily to carry him bread and water

    peasants_clever_wood_peasants:
      name: The Wood-Selling Peasants
      species: sp_human
      agency_modes: [agency_domestic_labor, agency_speech, agency_violence]
      traits: [wagon-drivers, parade-blockers, quarrelers, beaten-disputants]
      evidence: |
        some peasants who had been selling wood stopped with their
        waggons before the palace

    peasants_clever_horse_peasant:
      name: The Peasant with Three Horses
      species: sp_human
      agency_modes: [agency_speech, agency_cunning]
      affects: [affect_grief]
      traits: [foal-owner, wronged-litigant, queen-suppliant, tortured-confessor]
      evidence: |
        There was one peasant who had three horses

    peasants_clever_oxen_peasant:
      name: The Peasant with the Oxen
      species: sp_human
      agency_modes: [agency_speech, agency_violence]
      affects: [affect_greed]
      existential_states: [state_deceived]
      traits: [false-foal-claimant, verdict-winner, beneficiary-of-bad-judgment]
      evidence: |
        the peasant with the oxen wanted to keep the foal

    peasants_clever_foal:
      name: The Disputed Foal
      species: sp_horse
      traits: [newborn, misplaced-between-oxen, disputed-property, judgment-object]
      evidence: |
        one of which was delivered of a young foal

    peasants_clever_oxen:
      name: The Two Oxen
      traits: [wagon-yoked, false-parents-in-verdict, absurd-birth-claim]
      evidence: |
        two oxen which were in front of the waggon

    peasants_clever_ass:
      name: The Hired Ass
      species: sp_donkey
      traits: [riddle-vehicle, net-dragger, neither-riding-nor-walking-device]
      evidence: |
        she hired an ass

  magic_objects:

    obj_peasants_clever_gold_mortar:
      name: The Pure Gold Mortar
      object_kind: treasure
      attributes:
        function: gift-object that triggers the king's demand for its missing pair
      evidence: |
        a mortar made of pure gold

    obj_peasants_clever_missing_pestle:
      name: The Missing Pestle
      object_kind: tool
      attributes:
        function: absent counterpart demanded by the king
      evidence: |
        he must now bring him the pestle

    obj_peasants_clever_fishing_net:
      name: The Fishing Net
      object_kind: tool
      attributes:
        first_use: clothing-paradox solution
        second_use: dry-land fishing analogy
      evidence: |
        took a great fishing net

    obj_peasants_clever_sleeping_draught:
      name: The Powerful Sleeping Draught
      object_kind: food
      attributes:
        function: puts the king to sleep so the queen can take him away as her dearest thing
      evidence: |
        a powerful sleeping draught

    obj_peasants_clever_white_linen:
      name: The Fair White Linen Cloth
      object_kind: material
      attributes:
        function: wraps the sleeping king for transport
      evidence: |
        took a fair white linen cloth and wrapped the King in it

    obj_peasants_clever_carriage:
      name: The Carriage before the Door
      object_kind: tool
      attributes:
        function: carries the sleeping king from palace to peasant house
      evidence: |
        a carriage that stood before the door

  locations:

    loc_peasants_clever_house:
      name: The Poor Peasant's Small House
      instance_of: loc_house
      evidence: |
        only a small house

    loc_peasants_clever_cleared_land:
      name: The Newly-Cleared Land
      instance_of: loc_field
      evidence: |
        a bit of newly-cleared land

    loc_peasants_clever_prison:
      name: The King's Prison
      instance_of: loc_dungeon
      evidence: |
        he was put in prison

    loc_peasants_clever_palace:
      name: The Royal Palace
      instance_of: loc_castle
      threshold_type: threshold_doorway
      evidence: |
        before the palace

    loc_peasants_clever_parade_road:
      name: The Parade Road
      instance_of: loc_road
      evidence: |
        in the middle of the road by which he must pass

    loc_peasants_clever_peasant_hut:
      name: The Queen's Peasant Hut
      instance_of: loc_house
      evidence: |
        thy peasant’s hut

    loc_peasants_clever_little_bed:
      name: The Queen's Little Bed
      instance_of: loc_house
      evidence: |
        She laid him in her own little bed


