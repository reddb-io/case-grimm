propp:

  - function: func_initial_situation
    order: 1
    actor: army_surgeons_first
    scene: Three army-surgeons travel the world confident that their art is perfect.
    evidence: |
      Three army-surgeons who thought they knew their art perfectly

  - function: func_challenge
    order: 2
    actor: army_surgeons_innkeeper
    scene: The host asks the surgeons to show what they can do.
    evidence: |
      Just show me for once in a way what you can do

  - function: func_boast
    order: 3
    actor: army_surgeons_first
    scene: Each surgeon promises to remove and restore a vital body part overnight.
    evidence: |
      cut off his hand, and put it on again early next morning

  - function: func_self_mutilation
    order: 4
    actor: army_surgeons_first
    scene: The surgeons remove hand, heart, and eyes and place them on a plate.
    evidence: |
      laid them all together on a plate

  - function: func_custody
    order: 5
    actor: army_surgeons_innkeeper
    beneficiary: army_surgeons_servant_girl
    scene: The innkeeper gives the plate to the servant-girl for safekeeping in the cupboard.
    evidence: |
      take good care of it

  - function: func_violation
    order: 6
    actor: army_surgeons_servant_girl
    scene: The servant-girl feeds her secret lover and forgets the cupboard-door open.
    evidence: |
      in her love forgot to shut the cupboard-door again

  - function: func_loss
    order: 7
    actor: army_surgeons_cat
    victim: army_surgeons_servant_girl
    scene: The cat steals the original hand, heart, and eyes from the open cupboard.
    evidence: |
      took the hand and heart and eyes of the three army-surgeons

  - function: func_substitution
    order: 8
    actor: army_surgeons_soldier_lover
    beneficiary: army_surgeons_servant_girl
    scene: The soldier lover replaces the lost organs with a thief's hand, cat's eyes, and pig's heart.
    evidence: |
      fetched a pig’s heart

  - function: func_false_restoration
    order: 9
    actor: obj_army_surgeons_rejoining_salve
    beneficiary: army_surgeons_first
    scene: The surgeons attach the substitute parts with the salve and appear successful.
    evidence: |
      it grew to his arm directly

  - function: func_revelation
    order: 10
    actor: army_surgeons_first
    scene: The thief's hand steals, the cat's eyes see mice in darkness, and the pig's heart roots in dirt.
    evidence: |
      My hand twitches, and I am forced to snatch things whether I will or not.

  - function: func_return
    order: 11
    actor: army_surgeons_second
    scene: The surgeons realize they have not received their own organs and return to the innkeeper.
    evidence: |
      we have not got back again what is ours

  - function: func_compensation
    order: 12
    actor: army_surgeons_innkeeper
    beneficiary: army_surgeons_first
    scene: The innkeeper pays a great deal of money under threat of having his house burned.
    evidence: |
      they would set his house on fire


