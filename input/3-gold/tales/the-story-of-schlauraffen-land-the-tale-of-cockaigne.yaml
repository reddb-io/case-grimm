  - function: func_impossibility_catalogue
    order: 3
    actor: cockaigne_silver_nosed_ass
    scene: A silver-nosed ass pursues fleet hares, and hot cakes grow on a lime-tree.
    evidence: |
      pursued two fleet hares

  - function: func_impossibility_catalogue
    order: 4
    actor: cockaigne_lean_goat
    scene: A lean goat carries huge loads of fat and salt.
    evidence: |
      sixty loads of salt

  - function: func_lie_marker
    order: 5
    actor: cockaigne_narrator
    scene: The narrator openly marks the catalogue as lies before continuing.
    evidence: |
      Have I not told enough lies?

  - function: func_impossibility_catalogue
    order: 6
    actor: cockaigne_animal_workers
    scene: Animals perform impossible human labour, violence, and ecclesiastical acts.
    evidence: |
      two mice consecrating a bishop

  - function: func_closure
    order: 7
    actor: cockaigne_rooster
    scene: A cockcrow ends the nonsense catalogue.
    evidence: |
      The story is all told,—Cock-a-doodle-doo!


