propp:

  - function: func_lack
    order: 1
    actor: hans_countryman_father
    scene: Childlessness makes wealth incomplete and exposes the father to mockery.
    evidence: |
      one thing was still wanting in his happiness he had no children

  - function: func_wish
    order: 2
    actor: hans_countryman_father
    scene: The father's angry wish literally shapes the child as hedgehog and boy.
    evidence: |
      I will have a child, even if it be a hedgehog.

  - function: func_departure
    order: 3
    actor: hans_hedgehog_form
    scene: Hans takes bagpipes, has the cock shod, and leaves the parental house.
    evidence: |
      then I will ride away, and never come back again

  - function: func_mediation
    order: 4
    actor: hans_hedgehog_form
    scene: Beautiful bagpipe music attracts lost kings to the tree-top herdsman.
    evidence: |
      heard the music. He was astonished at it

  - function: func_bargain
    order: 5
    actor: hans_hedgehog_form
    scene: Hans offers each lost king the road home for a first-homecoming promise.
    evidence: |
      if he would give him for his own whatsoever first met him in front of his royal palace

  - function: func_deception
    order: 6
    actor: hans_first_king
    scene: The first king writes a false bond to evade the promise.
    evidence: |
      he had written that he should not have it

  - function: func_claim
    order: 7
    actor: hans_hedgehog_form
    scene: Hans returns from the forest herd to claim the promised daughters.
    evidence: |
      the King must give him what he had promised

  - function: func_punishment
    order: 8
    actor: hans_hedgehog_form
    victim: hans_first_princess
    scene: The false promise is answered by bodily disgrace rather than marriage.
    evidence: |
      That is the reward of your falseness

  - function: func_wedding
    order: 9
    actor: hans_second_princess
    beneficiary: hans_hedgehog_form
    scene: The second princess keeps the paternal promise despite fear.
    evidence: |
      She remembered however, that she could not change her mind

  - function: func_transfiguration
    order: 10
    actor: hans_hedgehog_form
    beneficiary: hans_human_form
    scene: Watchmen burn the cast-off skin, and Hans is delivered into human form.
    evidence: |
      when the fire had consumed it, he was delivered

  - function: func_recognition
    order: 11
    actor: hans_human_form
    beneficiary: hans_countryman_father
    scene: Hans returns as human son and receives paternal recognition.
    evidence: |
      Then Hans made himself known, and the old father rejoiced


