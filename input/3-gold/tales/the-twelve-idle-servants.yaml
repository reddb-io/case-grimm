    to: idle_servants_horse
    evidence: |
      I have a horse to look after, but I leave the bit in his mouth

  - from: idle_servants_second
    label: SLEEPS_IN
    to: obj_idle_servants_oat_chest
    evidence: |
      lay myself in the oat-chest and sleep for four hours

  - from: idle_servants_third
    label: ENDURES_RAIN_INJURY
