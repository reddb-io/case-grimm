    evidence: |
      I got a hole in the skull; I put a plaster on it

  - from: idle_servants_fourth
    label: DELEGATES_WORK
    to: agency_domestic_labor
    evidence: |
      I let him do the chief of the work

  - from: idle_servants_fifth
    label: HALF_RAISES
    to: obj_idle_servants_manure_fork
    evidence: |
      I only half-raise it up

  - from: idle_servants_sixth
    label: RESTS_BY_COUNTING
    to: loc_idle_servants_grass
    evidence: |
      I count the rest of them that I may know where I must rest

  - from: idle_servants_seventh
    label: MUST_BE_CARRIED
    to: idle_servants_master
    evidence: |
      they had to carry me

  - from: idle_servants_eighth
    label: REFUSES_TO_STEP_OVER
    to: obj_idle_servants_stone
    evidence: |
      if a stone lie before me

  - from: idle_servants_ninth
    label: REFUSES_TO_TAKE
    to: obj_idle_servants_bread
