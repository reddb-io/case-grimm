  magic_objects:

    obj_strong_hans_fir_club:
      name: Hans's Fir Club
      object_kind: weapon
      attributes:
        function: childhood weapon that lets Hans overpower the robber household and later kill the dwarf
      evidence: |
        he made himself a strong club out of a branch of fir

    obj_strong_hans_entrance_key:
      name: The Robber-Cave Entrance Key
      object_kind: token
      attributes:
        function: key taken from the robber captain to open the hidden cave passage
      evidence: |
        She took from the captain the key to the entrance-door

    obj_strong_hans_meal_sack_treasure:
      name: The Meal-Sack of Robber Treasure
      object_kind: treasure
      attributes:
        function: stolen robber wealth that funds the restored family house and farm
      evidence: |
        Hans fetched a great meal-sack and packed into it gold and silver

    obj_strong_hans_hundredweight_stick:
      name: The Hundredweight Walking-Stick
      object_kind: weapon
      attributes:
        function: travel weapon whose excessive weight nearly drowns Hans during the sea pursuit
      evidence: |
        a walking-stick that weighs a hundred-weight

    obj_strong_hans_basket_rope:
      name: The Basket and Rope
      object_kind: tool
      attributes:
        function: vertical descent apparatus that lets Hans reach the rock prison but also enables companion betrayal
      evidence: |
        they took a basket and a rope

    obj_strong_hans_summoning_ring:
      name: The Dwarf's Sparkling Summoning Ring
      instance_of: obj_wishing_ring
      object_kind: token
      attributes:
        function: ring that summons air spirits when turned on the finger
      evidence: |
        the dwarf had a ring on his finger which shone and sparkled

