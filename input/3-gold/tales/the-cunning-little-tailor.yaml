    - affect_envy
    - affect_anger
    - affect_joy

  symbol_numbers:
    - num_2
    - num_3

  threshold_types:
    - threshold_doorway


propp:

  - function: func_initial_situation
    order: 1
    actor: cunning_tailor_proud_princess
    scene: Proud princess rejects wooers by riddles but publicly promises marriage to the solver.
    evidence: |
      whosoever solved her riddle should marry her

  - function: func_departure
    order: 2
    actor: cunning_tailor_little_tailor
    scene: The little tailor ignores the elder tailors' contempt and goes to the princess.
    evidence: |
      he went forth as if the whole world were his

  - function: func_test
    order: 3
    actor: cunning_tailor_proud_princess
    victim: cunning_tailor_little_tailor
    scene: The princess poses the two-coloured hair riddle to the three tailors.
    evidence: |
      I have two kinds of hair on my head

  - function: func_solution
    order: 4
    actor: cunning_tailor_little_tailor
    beneficiary: cunning_tailor_little_tailor
    scene: The little tailor answers silver and golden hair correctly.
    evidence: |
      The princess has a silver and a golden hair on her head

  - function: func_difficult_task
    order: 5
    actor: cunning_tailor_proud_princess
    victim: cunning_tailor_little_tailor
    scene: The princess adds the stable-bear night to evade the marriage promise.
    evidence: |
      Below, in the stable is a bear with which thou shalt pass the night

  - function: func_trickery
    order: 6
    actor: cunning_tailor_little_tailor
    victim: cunning_tailor_bear
    scene: The tailor substitutes pebbles for nuts and makes the bear doubt its strength.
    evidence: |
      they were, however, not nuts, but pebbles

  - function: func_trickery
    order: 7
    actor: cunning_tailor_little_tailor
    victim: cunning_tailor_bear
    scene: The tailor plays violin, promises lessons, and screws the bear's claws in a vise.
    evidence: |
      the little tailor screwed it tight

  - function: func_victory
    order: 8
    actor: cunning_tailor_little_tailor
    beneficiary: cunning_tailor_little_tailor
    scene: The tailor survives the night in the stable and the princess is held to the wedding.
    evidence: |
      the tailor stood gaily before her

  - function: func_pursuit
    order: 9
    actor: cunning_tailor_bear
    victim: cunning_tailor_little_tailor
    scene: The envious elder tailors release the bear, who pursues the wedding carriage.
    evidence: |
      The bear in great fury ran after the carriage

  - function: func_rescue
    order: 10
    actor: cunning_tailor_little_tailor
    beneficiary: cunning_tailor_little_tailor
    scene: The tailor frightens the bear away by threatening the vise again.
    evidence: |
      If thou dost not be off thou shalt be put into it again

  - function: func_wedding
    order: 11
    actor: cunning_tailor_little_tailor
    beneficiary: cunning_tailor_proud_princess
    scene: The tailor reaches church and marries the princess at once.
    evidence: |
      the princess was married to him at once


edges:

  - from: cunning_tailor_proud_princess
    label: POSES_RIDDLE_TO
    to: cunning_tailor_little_tailor
    evidence: |
      she gave him some riddle to guess

  - from: cunning_tailor_proud_princess
    label: PROMISES_MARRIAGE_TO_SOLVER
    to: speech_riddle
    evidence: |
      whosoever solved her riddle should marry her

  - from: cunning_tailor_two_elder_tailors
    label: MOCKS
    to: cunning_tailor_little_tailor
    evidence: |
      thou canst not do much with thy little bit of understanding

  - from: cunning_tailor_proud_princess
    label: ASKS_COLOR_OF
    to: obj_cunning_tailor_silver_golden_hair
    evidence: |
      I have two kinds of hair on my head

  - from: cunning_tailor_little_tailor
    label: SOLVES
    to: obj_cunning_tailor_silver_golden_hair
    evidence: |
      The princess has a silver and a golden hair on her head

  - from: cunning_tailor_proud_princess
    label: FEARS_SOLVED_RIDDLE
    to: cunning_tailor_little_tailor
    evidence: |
      she turned pale and nearly fell down with terror

  - from: cunning_tailor_proud_princess
    label: ASSIGNS_BEAR_ORDEAL_TO
    to: cunning_tailor_little_tailor
    evidence: |
      with which thou shalt pass the night

  - from: cunning_tailor_bear
    label: LIVES_IN
    to: loc_cunning_tailor_bear_stable
    evidence: |
      Below, in the stable is a bear

  - from: cunning_tailor_little_tailor
    label: CRACKS
    to: obj_cunning_tailor_nuts
    evidence: |
      cracked them, and ate the kernels

  - from: cunning_tailor_little_tailor
    label: GIVES_AS_NUTS
    to: obj_cunning_tailor_pebbles
    evidence: |
      reached him a handful; they were, however, not nuts, but pebbles

  - from: cunning_tailor_bear
    label: FAILS_TO_CRACK
    to: obj_cunning_tailor_pebbles
    evidence: |
      could get nothing out of them

  - from: cunning_tailor_little_tailor
    label: PLAYS
    to: obj_cunning_tailor_violin
    evidence: |
      played a piece of it to himself

  - from: obj_cunning_tailor_violin
    label: MAKES_DANCE
    to: cunning_tailor_bear
    evidence: |
      he could not help beginning to dance

  - from: cunning_tailor_bear
    label: ASKS_LESSONS_FROM
    to: cunning_tailor_little_tailor
    evidence: |
      Wilt thou give me lessons?

  - from: cunning_tailor_little_tailor
    label: TRAPS_IN
    to: obj_cunning_tailor_vise
    evidence: |
      the little tailor screwed it tight

  - from: obj_cunning_tailor_vise
    label: TRAPS
    to: cunning_tailor_bear
    evidence: |
      the bear put his claws in it

  - from: cunning_tailor_little_tailor
    label: SLEEPS_IN
    to: loc_cunning_tailor_bear_stable
    evidence: |
      lay down in the corner on a bundle of straw, and fell asleep

  - from: cunning_tailor_proud_princess
    label: MISREADS_GROWLING_AS
    to: cunning_tailor_little_tailor
    evidence: |
      believed nothing else but that he was growling for joy

  - from: cunning_tailor_king
    label: ORDERS
    to: obj_cunning_tailor_carriage
    evidence: |
      the King ordered a carriage to be brought

  - from: cunning_tailor_two_elder_tailors
    label: RELEASES
    to: cunning_tailor_bear
    evidence: |
      unscrewed the bear again

  - from: cunning_tailor_bear
    label: PURSUES
    to: obj_cunning_tailor_carriage
    evidence: |
      ran after the carriage

  - from: cunning_tailor_proud_princess
    label: WARNS
    to: cunning_tailor_little_tailor
    evidence: |
      the bear is behind us and wants to get thee

  - from: cunning_tailor_little_tailor
    label: THREATENS_WITH
    to: obj_cunning_tailor_vise
    evidence: |
      Dost thou see the vise?

  - from: obj_cunning_tailor_vise
    label: FRIGHTENS_AWAY
    to: cunning_tailor_bear
    evidence: |
      he turned round and ran away

  - from: cunning_tailor_little_tailor
    label: MARRIES
    to: cunning_tailor_proud_princess
    evidence: |
      the princess was married to him at once

  - from: cunning_tailor_little_tailor
    label: DRIVES_TO
    to: loc_cunning_tailor_church
    evidence: |
      The tailor drove quietly to church
