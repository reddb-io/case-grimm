# yaml-language-server: $schema=../schemas/tale.schema.json

slug: the-cunning-little-tailor
khm: 114
atu: '850'
atu_name: The Cunning Little Tailor
canonical_source: ../../2-silver/canonical/the-cunning-little-tailor/canonical.txt
title: The Cunning Little Tailor


entities:

  characters:

    cunning_tailor_little_tailor:
      name: The Cunning Little Tailor
      archetypes: [arc_trickster]
      species: sp_human
      agency_modes: [agency_cunning, agency_speech, agency_object_mediation, agency_music, agency_endurance, agency_domestic_labor]
      speech_acts_performed: [speech_riddle, speech_bargain]
      affects: [affect_pride, affect_joy]
      traits: [little, low-status-tailor, useless-land-louper, lucky-suitor, riddle-solver, bear-tricker, vise-threatener, successful-bridegroom]
      evidence: |
        the third was a little useless land-louper

    cunning_tailor_proud_princess:
      name: The Proud Riddle Princess
      archetypes: [arc_proud_task_princess]
      species: sp_human
      agency_modes: [agency_social_rank, agency_speech, agency_cunning]
      speech_acts_performed: [speech_riddle, speech_promise, speech_command]
      existential_states: [state_deceived]
      affects: [affect_pride, affect_fear]
      traits: [extremely-proud, riddle-setter, contemptuous-rejecter, bear-ordeal-setter, promise-bound-bride, terrified-carriage-passenger]
      evidence: |
        There was once on a time a princess who was extremely proud.

    cunning_tailor_two_elder_tailors:
      name: The Two Elder Tailors
      species: sp_human
      agency_modes: [agency_speech, agency_cunning, agency_domestic_labor]
      affects: [affect_envy, affect_pride]
      traits: [self-confident-craftsmen, failed-guessers, envious-bear-releasers, false-hearted]
      evidence: |
        the two other tailors, who had false hearts and envied him his good fortune

    cunning_tailor_bear:
      name: The Stable Bear
      species: sp_bear
      existential_states: [state_deceived, state_trapped]
      agency_modes: [agency_violence, agency_music]
      affects: [affect_anger, affect_fear]
      traits: [lethal-stable-bear, nut-envier, pebble-dupe, dancing-bear, fiddle-student, vise-trapped, carriage-pursuer, threat-frightened]
      evidence: |
        the bear had never yet left any one alive who had fallen into his clutches

    cunning_tailor_king:
      name: The King
      archetypes: [arc_oath_enforcer]
      species: sp_human
      agency_modes: [agency_social_rank, agency_speech]
      speech_acts_performed: [speech_command]
      traits: [public-promise-enforcer, carriage-orderer, wedding-authorizer]
      evidence: |
        the King ordered a carriage to be brought

  magic_objects:

    obj_cunning_tailor_silver_golden_hair:
      name: The Silver and Golden Hair Riddle
      object_kind: material
      attributes:
        function: hidden bodily fact whose correct answer binds the princess's marriage promise
      evidence: |
        The princess has a silver and a golden hair on her head

    obj_cunning_tailor_nuts:
      name: The Tailor's Nuts
      object_kind: food
      attributes:
        function: real nuts cracked by the tailor to bait the bear into imitation
      evidence: |
        he took some nuts out of his pocket

    obj_cunning_tailor_pebbles:
      name: The Pebbles Given as Nuts
      object_kind: material
      attributes:
        function: substituted stones that make the bear believe it cannot crack nuts
      evidence: |
        they were, however, not nuts, but pebbles

    obj_cunning_tailor_violin:
      name: The Tailor's Violin
      instance_of: obj_fiddle
      object_kind: instrument
      attributes:
        function: music makes the bear dance and creates the false fiddling lesson
      evidence: |
        the tailor took out a violin from beneath his coat

    obj_cunning_tailor_vise:
      name: The Vise for the Bear's Claws
      object_kind: tool
      attributes:
        function: mechanical trap that holds the bear through the night and later frightens him away
      evidence: |
        a vise was brought, and the bear put his claws in it

    obj_cunning_tailor_carriage:
      name: The Wedding Carriage
      object_kind: architecture
      attributes:
        function: vehicle to church, pursued by the released bear
      evidence: |
        the King ordered a carriage to be brought

  locations:

    loc_cunning_tailor_princess_court:
      name: The Proud Princess's Court
      instance_of: loc_castle
      threshold_type: threshold_doorway
      evidence: |
        They all three announced themselves to the princess

    loc_cunning_tailor_bear_stable:
      name: The Bear Stable
      instance_of: loc_stable
      threshold_type: threshold_doorway
      evidence: |
        Below, in the stable is a bear

    loc_cunning_tailor_wedding_road:
      name: The Road to Church
      instance_of: loc_road
      evidence: |
        ran after the carriage

    loc_cunning_tailor_church:
      name: The Wedding Church
      instance_of: loc_church
      threshold_type: threshold_doorway
      evidence: |
        The tailor drove quietly to church


classifications:

  world_laws:
    - law_promise_binds_reality
    - law_music_attracts
    - law_imitation_trap_overpowers_brute

  moral_regimes:
    - moral_trickster_wins
    - moral_comic_inversion

  agency_modes_dominant:
    - agency_cunning
