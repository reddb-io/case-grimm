# yaml-language-server: $schema=../schemas/tale.schema.json

slug: the-little-folks-presents
khm: 182
atu: "503"
atu_name: The Elves / Gifts of the Little People
canonical_source: ../../2-silver/canonical/the-little-folks-presents/canonical.txt
title: The Little Folks' Presents


entities:

  characters:

    little_folks_tailor:
      name: The Tailor
      species: sp_human
      agency_modes: [agency_endurance, agency_speech, agency_object_mediation, agency_domestic_labor]
      speech_acts_performed: [speech_testimony]
      affects: [affect_fear, affect_joy]
      traits: [travelling-tailor, cautious, dance-entrant, shaved-without-struggle, coal-recipient, contented, future-master, generous-comrade]
      evidence: |
        the tailor felt a little afraid at first

    little_folks_goldsmith:
      name: The Goldsmith
      species: sp_human
      archetypes: [arc_greedy_one]
      agency_modes: [agency_endurance, agency_speech, agency_object_mediation, agency_domestic_labor]
      existential_states: [state_maimed]
      speech_acts_performed: [speech_request, speech_testimony]
      affects: [affect_greed, affect_fear, affect_joy, affect_grief]
      traits: [travelling-goldsmith, hunchbacked, brave, first-dance-entrant, shaved-without-struggle, overfilled-pockets, second-night-returner, bald-punished, double-humped]
      evidence: |
        The goldsmith, who had a hump

    little_folks_old_man:
      name: The Old Man of the Little Folks
      archetypes: [arc_supernatural_donor]
      being_type: being_dwarf
      agency_modes: [agency_speech, agency_object_mediation]
      speech_acts_performed: [speech_command]
      traits: [taller-than-the-rest, parti-coloured-coat, iron-grey-beard, circle-inviter, ritual-shaver, coal-gift-director, donor-judge]
      evidence: |
        In the midst of them sat an old man

    little_folks_dancers:
      name: The Little Men and Women
      being_type: being_dwarf
      agency_modes: [agency_music, agency_speech]
      traits: [moonlit-dancers, hand-holding-circle, singers, circle-openers, midnight-vanishers]
      evidence: |
        a crowd of little men and women

  magic_objects:

    obj_little_folks_coals:
      name: The Little Folks' Coals
      object_kind: material
      attributes:
        function: worthless-looking gift that becomes gold after the first night and reverts under greed
      evidence: |
        a heap of coals

    obj_little_folks_gold:
      name: The Coal-Transformed Gold
      object_kind: treasure
      attributes:
        function: first reward for accepting the little folks' rite without struggle
      evidence: |
        not filled with coals, but with pure gold

    obj_little_folks_knife:
      name: The Old Man's Large Knife
      object_kind: tool
      attributes:
        function: frightening ritual instrument used to shave the travellers before the gift
      evidence: |
        took a large knife which hung to his girdle

    obj_little_folks_goldsmith_bags:
      name: The Goldsmith's Two Bags
      object_kind: tool
      attributes:
        function: greedy storage for the second attempted harvest of coal-gold
      evidence: |
        hung a couple of bags over his shoulders

    obj_little_folks_cap:
      name: The Goldsmith's Cap
      object_kind: garment
      attributes:
        function: covering for the permanent baldness left by punishment
      evidence: |
        cover his bald head with a cap

  locations:

    loc_little_folks_moonlit_hill:
      name: The Moonlit Hill of the Little Folks
      instance_of: loc_mountain
      evidence: |
        reached a hill

    loc_little_folks_valley:
      name: The Valley below the Hill
      instance_of: loc_mountain
      evidence: |
        When they had got into the valley

    loc_little_folks_inn:
      name: The Travellers' Inn
      instance_of: loc_inn
      evidence: |
        found an inn


classifications:

  world_laws:
    - law_otherworld_coal_gift_tests_contentment

  moral_regimes:
    - moral_overreach_reversal

  agency_modes_dominant:
    - agency_music
    - agency_object_mediation
    - agency_endurance
    - agency_speech

  affects_driving:
    - affect_greed
    - affect_fear
    - affect_joy

  symbol_numbers:
    - num_2

  threshold_types: []


propp:
  - { function: func_initial_travel, order: 1, actor: little_folks_tailor,
      scene: "the tailor and goldsmith travel together at evening" }
  - { function: func_supernatural_summons, order: 2, actor: little_folks_dancers,
      scene: "distant music draws the travellers to a moonlit hill" }
  - { function: func_donor_circle_opened, order: 3, actor: little_folks_old_man,
      beneficiary: little_folks_tailor,
      scene: "the old man signs for the strangers to enter the dancing circle" }
  - { function: func_frightening_rite, order: 4, actor: little_folks_old_man,
      victim: little_folks_goldsmith,
      scene: "the old man sharpens his knife and shaves both travellers" }
  - { function: func_obedient_acceptance, order: 5, actor: little_folks_tailor,
      scene: "both travellers endure the shaving willingly and without struggle" }
  - { function: func_donor_gift, order: 6, actor: little_folks_old_man,
      beneficiary: little_folks_tailor,
      scene: "the old man gestures for the travellers to fill their pockets with coal" }
  - { function: func_reward, order: 7, actor: law_otherworld_coal_gift_tests_contentment,
      beneficiary: little_folks_tailor,
      scene: "the morning reveals coal changed to gold and hair restored" }
  - { function: func_greedy_return, order: 8, actor: little_folks_goldsmith,
      scene: "the goldsmith returns with bags to gather greater treasure" }
  - { function: func_reversal, order: 9, actor: law_otherworld_coal_gift_tests_contentment,
      victim: little_folks_goldsmith,
      scene: "the second harvest remains coal and the first gold reverts to coal" }
  - { function: func_bodily_punishment, order: 10, actor: law_otherworld_coal_gift_tests_contentment,
      victim: little_folks_goldsmith,
      scene: "the goldsmith remains bald and receives a second hump" }
  - { function: func_compassionate_sharing, order: 11, actor: little_folks_tailor,
      beneficiary: little_folks_goldsmith,
      scene: "the tailor keeps his comrade and shares his wealth" }


