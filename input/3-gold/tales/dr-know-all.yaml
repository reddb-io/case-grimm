    loc_dr_know_all_village:
      name: Doctor Knowall's Village
      instance_of: loc_village
      evidence: |
        Doctor Knowall who lived in such and such a village

    loc_dr_know_all_castle:
      name: The Nobleman's Castle
      instance_of: loc_castle
      threshold_type: threshold_doorway
      evidence: |
        When they came to the nobleman’s castle

    loc_dr_know_all_table:
      name: The Nobleman's Table
