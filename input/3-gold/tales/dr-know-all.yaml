      evidence: |
        some money stolen

    obj_dr_know_all_covered_dish:
      name: The Covered Dish with Crabs
      object_kind: food
      attributes:
        function: test object whose contents match Crabb's name
      evidence: |
        a dish that was covered

    obj_dr_know_all_table_fare:
      name: The Delicate Table Fare
      object_kind: food
      attributes:
        function: rich eating that makes Crabb desire the doctor's status
      evidence: |
        how daintily he ate and drank

  locations:

    loc_dr_know_all_town:
      name: The Town of the Real Doctor
      instance_of: loc_marketplace
      evidence: |
        drove with two oxen a load of wood to the town

    loc_dr_know_all_house:
      name: Crabb's House-Door
