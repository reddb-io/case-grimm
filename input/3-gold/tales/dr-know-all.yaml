      scene: "Crabb sells wood to a doctor and envies the doctor's rich table.",
      evidence: "his heart desired what he saw" }
  - { function: func_transformation_by_staging, order: 2, actor: dr_know_all_real_doctor,
      scene: "The doctor tells Crabb to buy the ABC book, sell cart and oxen, buy clothes, and put up the Knowall sign.",
      evidence: "that is soon managed" }
  - { function: func_false_identity, order: 3, actor: dr_know_all_crabb,
      scene: "Crabb adopts the public identity of Doctor Knowall.",
      evidence: "The peasant did everything that he had been told to do" }
  - { function: func_lack, order: 4, actor: dr_know_all_lord,
      scene: "A rich lord has money stolen and summons Doctor Knowall.",
      evidence: "a rich and great lord had some money stolen" }
  - { function: func_accidental_exposure, order: 5, actor: dr_know_all_crabb,
      scene: "Crabb counts dishes to Grethe, and the thieving servants hear themselves accused.",
      evidence: "Grethe, that was the first" }
  - { function: func_accidental_test, order: 6, actor: dr_know_all_crabb,
      scene: "Crabb says his own name over the covered dish, accidentally naming the crabs beneath it.",
      evidence: "Ah, poor Crabb" }
  - { function: func_confession, order: 7, actor: dr_know_all_four_thieves,
      scene: "The terrified thieves confess, promise repayment and bribe, and show where the money is hidden.",
      evidence: "all four of them confessed to him" }
  - { function: func_second_accidental_exposure, order: 8, actor: dr_know_all_crabb,
      scene: "Crabb searches his ABC book for the cock, and the hidden fifth servant thinks he has been detected.",
      evidence: "I know you are there, so you had better show yourself" }
  - { function: func_reward, order: 9, actor: dr_know_all_crabb,
      scene: "Dr. Knowall reveals the money's location, protects the thieves' identities, receives money from both sides, and becomes renowned.",
      evidence: "received from both sides much money in reward" }


