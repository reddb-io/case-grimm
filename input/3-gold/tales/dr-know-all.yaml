    dr_know_all_grethe:
      name: Grethe
      species: sp_human
      agency_modes: [agency_speech, agency_domestic_labor]
      traits: [wife, table-companion, dish-counting-addressee, carriage-passenger]
      evidence: |
        Grethe, my wife, must go too.

