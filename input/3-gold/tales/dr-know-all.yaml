      agency_modes: [agency_speech, agency_cunning, agency_object_mediation]
      speech_acts_performed: [speech_boast, speech_lie]
      affects: [affect_greed, affect_fear]
      traits: [poor-peasant, wood-seller, status-desirer, self-made-doctor, accidental-detective, rewarded-impostor, renowned-man]
      evidence: |
