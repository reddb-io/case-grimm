    - threshold_grave


propp:

  - function: func_initial_problem
    order: 1
    actor: three_brothers_father
    scene: The father has three sons and one ancestral house that he does not want to sell.
    evidence: |
      did not wish to sell the house

  - function: func_task_assignment
    order: 2
    actor: three_brothers_father
    beneficiary: three_brothers_eldest_blacksmith
    scene: He sends the sons into the world to learn trades and promises the house for the best masterpiece.
    evidence: |
      he who makes the best masterpiece shall have the house

  - function: func_apprenticeship
    order: 3
    actor: three_brothers_skilful_masters
    beneficiary: three_brothers_eldest_blacksmith
    scene: Each brother finds a skilful master and learns his trade well.
    evidence: |
      who taught them their trades well

  - function: func_return
    order: 4
    actor: three_brothers_eldest_blacksmith
    scene: At the appointed time the three brothers return to their father.
    evidence: |
      the three brothers came back home to their father

  - function: func_first_masterpiece
    order: 5
    actor: three_brothers_second_barber
    scene: The barber shaves a running hare without cutting its skin or injuring a hair.
    evidence: |
      shaved off the hare’s whiskers whilst he was running at the top of his speed

  - function: func_second_masterpiece
    order: 6
    actor: three_brothers_eldest_blacksmith
    scene: The blacksmith replaces all four shoes of a galloping horse without stopping it.
    evidence: |
      took all four shoes off the feet of one of the horses whilst he was galloping

  - function: func_third_masterpiece
    order: 7
    actor: three_brothers_third_fencing_master
    scene: The fencing-master keeps himself dry in a torrent by swordplay.
    evidence: |
      remained as dry as if he were sitting in a house

  - function: func_judgment
    order: 8
    actor: three_brothers_father
    beneficiary: three_brothers_third_fencing_master
    scene: The father declares the fencing performance the masterpiece and awards the house.
    evidence: |
      This is the master-piece, the house is yours!

  - function: func_harmony
    order: 9
    actor: three_brothers_eldest_blacksmith
    scene: The brothers accept the judgment, live together, follow their trades, and prosper.
    evidence: |
      they all three stayed together in the house

  - function: func_common_death
    order: 10
    actor: three_brothers_eldest_blacksmith
    scene: Their mutual grief makes the two surviving brothers die soon after the first, and all share one grave.
    evidence: |
      they were all laid in the same grave


