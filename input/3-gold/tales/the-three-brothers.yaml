atu_name: The Three Brothers
canonical_source: ../../2-silver/canonical/the-three-brothers/canonical.txt
title: The Three Brothers


entities:

  characters:

    three_brothers_father:
      name: The Father with One House
      species: sp_human
      agency_modes: [agency_social_rank, agency_speech, agency_domestic_labor]
      speech_acts_performed: [speech_command]
      affects: [affect_love]
      traits: [father, equal-lover-of-sons, ancestral-householder, inheritance-arbiter]
      evidence: |
        the father loved them all alike

    three_brothers_eldest_blacksmith:
      name: The Eldest Brother, Blacksmith
      species: sp_human
      agency_modes: [agency_domestic_labor, agency_endurance]
      affects: [affect_pride, affect_loyalty]
      traits: [eldest-son, blacksmith, king-horse-shoer, galloping-horse-shoe-master, satisfied-brother]
      evidence: |
        the eldest determined to be a blacksmith

    three_brothers_second_barber:
      name: The Second Brother, Barber
      species: sp_human
      agency_modes: [agency_domestic_labor, agency_endurance]
      affects: [affect_pride, affect_loyalty]
      traits: [second-son, barber, great-people-shaver, running-hare-shaver, satisfied-brother]
      evidence: |
        the second a barber

    three_brothers_third_fencing_master:
      name: The Third Brother, Fencing-Master
      species: sp_human
      agency_modes: [agency_domestic_labor, agency_endurance, agency_violence]
      affects: [affect_pride, affect_loyalty]
      traits: [third-son, fencing-master, blow-endurer, rain-fencer, masterpiece-winner, shared-householder]
      evidence: |
        the third a fencing-master

    three_brothers_skilful_masters:
      name: The Skilful Trade Masters
      species: sp_human
      agency_modes: [agency_domestic_labor, agency_speech]
      speech_acts_performed: [speech_command]
      traits: [trade-teachers, apprenticeship-masters]
      evidence: |
        they all found skilful masters

    three_brothers_running_hare:
      name: The Running Hare
      species: sp_hare
      agency_modes: [agency_endurance]
      traits: [field-runner, barber-masterpiece-subject, unharmed-animal]
      evidence: |
        a hare came running across the field

    three_brothers_nobleman:
      name: The Nobleman in the Coach
      species: sp_human
      agency_modes: [agency_social_rank]
      traits: [coach-rider, blacksmith-test-arrival]
      evidence: |
        up came a nobleman in his coach

    three_brothers_galloping_horse:
      name: The Galloping Coach Horse
      species: sp_horse
      agency_modes: [agency_endurance]
      traits: [coach-horse, galloping-test-subject, reshod-in-motion]
      evidence: |
        one of the horses whilst he was galloping

  magic_objects:

    obj_three_brothers_ancestral_house:
      name: The Ancestral House
      object_kind: architecture
      attributes:
        function: indivisible inheritance awarded by the best craft masterpiece
      evidence: |
        nothing else in the world but the house in which he lived

    obj_three_brothers_barber_basin_soap:
      name: The Barber's Basin and Soap
      object_kind: tool
      attributes:
        function: used to shave the running hare without harm
      evidence: |
        he took his basin and soap

    obj_three_brothers_blacksmith_shoes:
      name: The Four New Horseshoes
      object_kind: tool
      attributes:
        function: replace all four shoes of a galloping horse without stopping it
      evidence: |
        put him on four new shoes without stopping him

    obj_three_brothers_fencing_sword:
      name: The Fencing-Master's Sword
      object_kind: weapon
      attributes:
        function: flourished so fast that rain cannot touch him
      evidence: |
        he drew his sword

    obj_three_brothers_common_grave:
      name: The Same Grave of the Three Brothers
      object_kind: architecture
      attributes:
        function: final sign of brotherly unity after shared life and grief
      evidence: |
        they were all laid in the same grave

  locations:

    loc_three_brothers_father_house:
      name: The Father's Ancestral House
      instance_of: loc_house
      threshold_type: threshold_doorway
      evidence: |
        the house in which he lived

    loc_three_brothers_world:
      name: The World of Apprenticeship
      instance_of: loc_road
      evidence: |
        Go into the world

    loc_three_brothers_field:
      name: The Field of the Running Hare
      instance_of: loc_field
      evidence: |
        a hare came running across the field

    loc_three_brothers_coach_road:
      name: The Road of the Nobleman's Coach
      instance_of: loc_road
      evidence: |
        up came a nobleman in his coach

    loc_three_brothers_shared_grave:
      name: The Shared Grave
      instance_of: loc_tomb
      threshold_type: threshold_grave
      evidence: |
        the same grave


