title: The Jew among Thorns


entities:

  characters:

    thorns_honest_servant:
      name: The Honest Servant
      archetypes: [arc_trickster]
      species: sp_human
      agency_modes: [agency_music, agency_object_mediation, agency_speech, agency_cunning, agency_violence]
      speech_acts_performed: [speech_wish, speech_request]
      affects: [affect_pity, affect_joy]
      traits: [underpaid-servant, diligent-worker, cheerful-fool, generous-donor-recipient, magical-fiddler, coerced-dance-trickster, condemned-man, gallows-reverser]
      evidence: |
        a servant who served him diligently and honestly

    thorns_rich_master:
      name: The Rich Miserly Master
      archetypes: [arc_greedy_one]
      species: sp_human
      agency_modes: [agency_social_rank, agency_cunning, agency_speech]
      affects: [affect_greed]
      traits: [wage-withholder, miser, false-liberal-master, three-farthing-payer]
      evidence: |
        his master gave him no wages

    thorns_dwarf_donor:
      name: The Little Man / Dwarf Donor
      archetypes: [arc_supernatural_donor]
      species: sp_human
      being_type: being_dwarf
      agency_modes: [agency_speech, agency_object_mediation]
      speech_acts_performed: [speech_request, speech_wish]
      traits: [needy-old-man, donor-in-disguise, three-gift-granter]
      evidence: |
        a little man stepped out

    thorns_jewish_man:
      name: The Jewish Man in the Thorn-Bushes
      species: sp_human
      agency_modes: [agency_speech, agency_object_mediation]
      speech_acts_performed: [speech_request, speech_lie, speech_confession]
      affects: [affect_greed, affect_fear, affect_anger]
      traits: [source-stereotyped-outsider, bird-desirer, coerced-dancer, thorn-wounded-complainant, prejudicially-believed-accuser, coerced-confessor, executed-man]
      evidence: |
        he met a Jew with a long goat’s-beard

    thorns_bird:
      name: The Singing Bird in the Tree
      species: sp_bird
      agency_modes: [agency_music]
      traits: [loud-singer, desired-bird, shot-into-thorns]
      evidence: |
        a bird which was sitting up at the top of a tree

    thorns_judge:
      name: The Judge
      species: sp_human
      agency_modes: [agency_social_rank, agency_speech]
      speech_acts_performed: [speech_command, speech_request]
      affects: [affect_fear]
      traits: [prejudicial-judge, death-sentencer, compelled-request-granter, dancing-authority, life-giver]
      evidence: |
        This is a bad defence, no Jew would do that.

    thorns_hangman:
      name: The Hangman
      species: sp_human
      agency_modes: [agency_social_rank, agency_violence]
      traits: [executioner, ladder-holder, compelled-dancer]
      evidence: |
        The servant walked quietly with the hangman up the ladder

    thorns_clerk_and_crowd:
      name: The Clerk, Officers, Crowd, and Dogs
      species: sp_human
      agency_modes: [agency_social_rank]
      traits: [marketplace-witnesses, compelled-dancers, mixed-crowd]
      evidence: |
        all who had gathered in the market-place out of curiosity were dancing with them

  magic_objects:

    obj_thorns_three_farthings:
      name: The Three Farthings of Three Years' Wages
      object_kind: treasure
      attributes:
        function: miserly wages converted by generosity into three supernatural gifts
      evidence: |
        a farthing for each year

    obj_thorns_never_miss_gun:
      name: The Never-Miss Gun
      instance_of: obj_never_miss_gun
      object_kind: weapon
      attributes:
        function: shoots the bird into the thorn-bushes with guaranteed accuracy
      evidence: |
        a gun, which shall hit everything that I aim at

    obj_thorns_compelling_fiddle:
      name: The Compelling Fiddle
      instance_of: obj_fiddle
      object_kind: instrument
      attributes:
        function: forces all hearers to dance, first in thorns and later at the gallows
      evidence: |
        a fiddle, which when I play on it, shall compel all who hear it to dance

    obj_thorns_purse_of_gold:
      name: The Purse Full of Gold
      object_kind: treasure
      attributes:
        function: payment extracted to stop the thorn-dance, later legal evidence against the servant
      evidence: |
        a purse full of gold

    obj_thorns_gallows_rope:
      name: The Gallows Rope
      object_kind: tool
      attributes:
        function: execution object interrupted when the fiddle compels the hangman to dance
      evidence: |
        the cord fell out of the hand of the one who was going to tie the Jew fast

  locations:

    loc_thorns_master_house:
      name: The Rich Master's House
      instance_of: loc_house
      evidence: |
        He was every morning the first out of bed

    loc_thorns_road:
      name: The Road Up Hill and Down Dale
      instance_of: loc_road
      evidence: |
        on he went, up hill and down dale

    loc_thorns_donor_bush:
      name: The Bush Where the Little Man Appears
      instance_of: loc_thorn_thicket
      evidence: |
        as he was going by a thicket a little man stepped out

    loc_thorns_tree:
      name: The Bird's Tree
      instance_of: loc_tree
      evidence: |
        sitting up at the top of a tree

    loc_thorns_thorn_bushes:
      name: The Thorn-Bushes
      instance_of: loc_thorn_thicket
      evidence: |
        down fell the bird into the thorn-bushes

    loc_thorns_town_court:
      name: The Town Court of the Justice
      instance_of: loc_town
      evidence: |
        he ran into the town to the justice

    loc_thorns_marketplace_gallows:
      name: The Market-Place Gallows
      instance_of: loc_gallows
      threshold_type: threshold_grave
      evidence: |
        Soon all who had gathered in the market-place out of curiosity were dancing with them


