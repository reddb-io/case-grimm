propp:

  - function: func_lack
    order: 1
    actor: thorns_honest_servant
    scene: Three years of honest service are withheld as wages by the master.
    evidence: |
      Master, for three years I have served you honestly

  - function: func_donor_test
    order: 2
    actor: thorns_dwarf_donor
    beneficiary: thorns_honest_servant
    scene: The little man asks for the servant's entire poor wage.
    evidence: |
      give me your three farthings

  - function: func_reward
    order: 3
    actor: thorns_dwarf_donor
    beneficiary: thorns_honest_servant
    scene: The servant's generosity is converted into three magical wishes.
    evidence: |
      I grant you three wishes, one for each farthing

  - function: func_acquisition
    order: 4
    actor: thorns_honest_servant
    scene: The servant receives the never-miss gun, compelling fiddle, and irrefusable-request gift.
    evidence: |
      All that shall you have

  - function: func_villainy
    order: 5
    actor: thorns_honest_servant
    victim: thorns_jewish_man
    scene: The servant forces the Jewish man to dance in the thorns and extracts gold to stop.
    evidence: |
      he took up his fiddle and began to play

  - function: func_accusation
    order: 6
    actor: thorns_jewish_man
    victim: thorns_honest_servant
    scene: The wounded man reports robbery and mistreatment to the judge.
    evidence: |
      I have come to make a complaint

  - function: func_condemnation
    order: 7
    actor: thorns_judge
    victim: thorns_honest_servant
    scene: The judge disbelieves the servant and sentences him to hang.
    evidence: |
      he sentenced the good servant to be hanged

  - function: func_last_request
    order: 8
    actor: thorns_honest_servant
    scene: The servant's irrefusable last request opens the way for the fiddle.
    evidence: |
      as a last favor let me play once more upon my fiddle

  - function: func_rescue
    order: 9
    actor: thorns_honest_servant
    beneficiary: thorns_honest_servant
    scene: The compelling fiddle makes judge, hangman, crowd, and dogs dance until execution collapses.
    evidence: |
      the hangman let go his hold of the good servant

  - function: func_exposure
    order: 10
    actor: thorns_honest_servant
    victim: thorns_jewish_man
    scene: Under renewed threat of the fiddle, the Jewish man confesses theft in the tale's logic.
    evidence: |
      I stole it, I stole it!

  - function: func_punishment
    order: 11
    actor: thorns_judge
    victim: thorns_jewish_man
    scene: The judge has the accuser executed as a thief.
    evidence: |
      the judge had the Jew taken to the gallows and hanged as a thief


