slug: ferdinand-the-faithful
khm: 126
atu: '531'
atu_name: Ferdinand the Faithful
canonical_source: ../../2-silver/canonical/ferdinand-the-faithful/canonical.txt
title: Ferdinand the Faithful


entities:

  characters:

    ferdinand_faithful_parents:
      name: Ferdinand's Poor Parents
      species: sp_human
      agency_modes: [agency_speech, agency_endurance]
      affects: [affect_grief]
      traits: [formerly-rich, poor-parents, godfather-seekers, key-keepers]
      evidence: |
        had no children, but when they were poor they had a little boy

    ferdinand_faithful_godfather:
      name: The Poor Godfather
      archetypes: [arc_supernatural_godfather]
      species: sp_human
      agency_modes: [agency_speech, agency_object_mediation]
      speech_acts_performed: [speech_promise, speech_command]
      traits: [poor-beggar, church-sponsor, name-giver, delayed-key-donor]
      evidence: |
        I will be godfather for you

    ferdinand_faithful:
      name: Ferdinand the Faithful
      archetypes: [arc_faithful_servant]
      species: sp_human
      agency_modes: [agency_endurance, agency_animal_aid, agency_object_mediation, agency_speech]
      existential_states: [state_bound_by_promise]
      speech_acts_performed: [speech_request, speech_command]
      affects: [affect_joy, affect_fear, affect_loyalty, affect_love]
      traits: [poor-godson, named-faithful, key-inheritor, white-horse-rider, pen-keeper, fish-rescuer, royal-outrider, dangerous-task-bearer, bride-fetcher, writings-fetcher, restored-decapitation-victim, final-bridegroom]
      evidence: |
        he gave the child the name of Ferdinand the Faithful

    ferdinand_faithful_white_horse:
      name: The Speaking White Horse
      archetypes: [arc_animal_helper, arc_enchanted_prince]
      species: sp_horse
      agency_modes: [agency_animal_aid, agency_speech, agency_cunning]
      existential_states: [state_transformed, state_hidden_identity]
      transformations: [transform_animal_human]
      speech_acts_performed: [speech_warning, speech_command]
      affects: [affect_loyalty]
      traits: [white-horse, hidden-in-castle, stable-speaker, task-adviser, ship-planner, final-kings-son]
      evidence: |
        Dost thou speak, my little white horse

    ferdinand_faithful_fish:
      name: The Rescued Fish
      archetypes: [arc_animal_helper]
      species: sp_fish
      agency_modes: [agency_animal_aid, agency_speech, agency_object_mediation]
      speech_acts_performed: [speech_promise]
      affects: [affect_pity]
      traits: [mud-stranded, lake-returned, flute-giver, pen-retriever]
      evidence: |
        a fish was lying on the bank, gasping and panting for breath

    ferdinand_unfaithful:
      name: Ferdinand the Unfaithful
      archetypes: [arc_treacherous_travel_companion, arc_false_hero]
      species: sp_human
      agency_modes: [agency_cunning, agency_speech, agency_social_rank]
      speech_acts_performed: [speech_lie, speech_command]
      affects: [affect_envy]
      traits: [wicked-arts-knower, namesake-double, hostile-companion, task-instigator, execution-instigator]
      evidence: |
        I am called Ferdinand the Unfaithful

    ferdinand_faithful_inn_girl:
      name: The Honest Girl at the Inn
      species: sp_human
      agency_modes: [agency_speech, agency_cunning]
      speech_acts_performed: [speech_request]
      affects: [affect_love, affect_fear]
      traits: [honest, bright-faced, patronage-broker, cautious-helper]
      evidence: |
        an honest girl, who had a bright face

    ferdinand_faithful_king:
      name: The Noseless King
      species: sp_human
      agency_modes: [agency_social_rank, agency_speech, agency_violence]
      speech_acts_performed: [speech_command]
      affects: [affect_love, affect_fear]
      traits: [love-lamenting, servant-hiring, death-threatener, no-nose-husband, failed-decapitation-subject]
      evidence: |
        The Queen, however, did not love the King because he had no nose

    ferdinand_faithful_princess:
      name: The Sleeping Princess Who Becomes Queen
      species: sp_human
      agency_modes: [agency_speech, agency_violence, agency_cunning]
      transformations: [transform_decapitation_restoration]
      speech_acts_performed: [speech_command]
      affects: [affect_love]
      traits: [sleeping-bride, writings-claimer, queen, head-restoration-magician, king-remover, ferdinand-bride]
      evidence: |
        the princess lies sleeping

    ferdinand_faithful_giants:
      name: The Lake Giants
      being_type: being_giant
      agency_modes: [agency_violence, agency_domestic_labor]
      affects: [affect_hunger]
      traits: [lake-dwellers, meat-pacified, bed-carriers, bride-lifters]
      evidence: |
        Great giants dwell on the lake

    ferdinand_faithful_large_birds:
      name: The Large Birds
      species: sp_bird
      agency_modes: [agency_violence]
      affects: [affect_hunger]
      traits: [eye-pickers, bread-pacified, passage-guards]
      evidence: |
        there are the large birds which would pick the eyes out of thy head

    ferdinand_faithful_lords:
      name: The Lords of the Court
      species: sp_human
      agency_modes: [agency_social_rank]
      traits: [court-witnesses, magic-feat-audience]
      evidence: |
        when all the lords of the court were together

  magic_objects:

    obj_ferdinand_faithful_key:
      name: The Godfather's Delayed Key
      instance_of: obj_delayed_inheritance_key
      object_kind: token
      attributes:
        function: opens the hidden heath-castle when Ferdinand reaches fourteen
      evidence: |
        he gave a key to the nurse

    obj_ferdinand_faithful_white_horse:
      name: The White Horse as Inheritance
      instance_of: obj_enchanted_helper_horse
      object_kind: creature_object
      attributes:
        function: inherited horse, advisor, mount, and enchanted king's son
      evidence: |
        nothing within but a horse, a white one

    obj_ferdinand_faithful_road_pen:
      name: The Roadside Pen
      object_kind: tool
      attributes:
        function: small object Ferdinand is told by an unseen voice to keep
      evidence: |
        a pen was lying on the road

    obj_ferdinand_faithful_flute:
      name: The Fish's Flute
      instance_of: obj_animal_helper_flute
      object_kind: instrument
      attributes:
        function: summons the rescued fish when something falls into water
      evidence: |
        I will give thee a flute

    obj_ferdinand_faithful_meat_ship:
      name: The Ship Full of Meat
      object_kind: food
      attributes:
        function: provision that pacifies the lake giants
      evidence: |
        a ship full of meat

    obj_ferdinand_faithful_bread_ship:
      name: The Ship Full of Bread
      object_kind: food
      attributes:
        function: provision that pacifies the large birds
      evidence: |
        a ship full of bread

    obj_ferdinand_faithful_writings:
      name: The Princess's Writings
      object_kind: book
      attributes:
        function: second retrieval object required before the wedding can stand
      evidence: |
        must have her writings

  locations:

    loc_ferdinand_faithful_church:
      name: The Baptism Church
      instance_of: loc_church
      threshold_type: threshold_doorway
      evidence: |
        come to the church with the child

    loc_ferdinand_faithful_heath:
      name: The Heath of the Delayed Castle
      instance_of: loc_meadow
      evidence: |
        go on the heath

    loc_ferdinand_faithful_heath_castle:
      name: The Castle Opened by the Key
      instance_of: loc_castle
      threshold_type: threshold_doorway
      evidence: |
        there stood the castle

    loc_ferdinand_faithful_road:
      name: The Road of the Pen and Namesake
      instance_of: loc_road
      evidence: |
        a pen was lying on the road

    loc_ferdinand_faithful_lake:
      name: The Lake of Fish, Giants, and Birds
      instance_of: loc_lake
      evidence: |
        he passed by a lake

    loc_ferdinand_faithful_inn:
      name: The Inn Where the Ferdinands Meet Service
      instance_of: loc_inn
      threshold_type: threshold_doorway
      evidence: |
        they both set out to the inn

    loc_ferdinand_faithful_royal_castle:
      name: The King's Castle
      instance_of: loc_castle
      threshold_type: threshold_doorway
      evidence: |
        So he took the writings to the castle

    loc_ferdinand_faithful_stable:
      name: The Stable of the White Horse
      instance_of: loc_stable
      evidence: |
        went into the stable to his white horse

    loc_ferdinand_faithful_ship:
      name: The Provisioned Quest Ships
      instance_of: loc_ship
      evidence: |
        the ships might be filled

    loc_ferdinand_faithful_princess_castle:
      name: The Sleeping Princess's Castle
      instance_of: loc_castle
      threshold_type: threshold_doorway
      evidence: |
        when thou comest to the castle

    loc_ferdinand_faithful_bedroom:
      name: The Princess's Bedroom of Writings
      instance_of: loc_bedchamber
      threshold_type: threshold_doorway
      evidence: |
        on the table in the princess’s bed-room lay the writings


classifications:

  world_laws:
    - law_delayed_godfather_key_reveals_hidden_inheritance
    - law_rescued_animals_repay_kindness
    - law_animal_advice_requires_exact_obedience
    - law_provisioned_passage_pacifies_monsters

  moral_regimes:
