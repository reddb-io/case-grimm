    - moral_restorative
    - moral_retributive

  agency_modes_dominant:
    - agency_animal_aid
    - agency_object_mediation
    - agency_speech
    - agency_cunning
    - agency_social_rank
    - agency_violence

  affects_driving:
    - affect_loyalty
    - affect_love
    - affect_envy
    - affect_fear
    - affect_hunger

  symbol_numbers:
    - num_7

  threshold_types:
    - threshold_doorway


propp:

  - function: func_lack
    order: 1
    actor: ferdinand_faithful_parents
    scene: "poor parents cannot find a godfather for the child"
    evidence: "so no one would stand as godfather for him"

  - function: func_donor_appearance
    order: 2
    actor: ferdinand_faithful_godfather
    scene: "the poor man agrees to stand as godfather and names the child Ferdinand the Faithful"
    evidence: "he gave the child the name of Ferdinand the Faithful"

  - function: func_magical_agent
    order: 3
    actor: ferdinand_faithful_godfather
    beneficiary: ferdinand_faithful
    scene: "the godfather leaves a key that will fit a castle on the heath when Ferdinand is fourteen"
    evidence: "when he was fourteen years old"

  - function: func_departure
    order: 4
    actor: ferdinand_faithful
    scene: "Ferdinand finds the castle, receives the white horse, and travels"
    evidence: "Now I have a white horse, and I will travel"

  - function: func_donor_test
    order: 5
    actor: ferdinand_faithful_fish
    beneficiary: ferdinand_faithful
    scene: "Ferdinand rescues the gasping fish from the bank"
    evidence: "I will help thee get into the water"

  - function: func_villainy
    order: 6
    actor: ferdinand_unfaithful
    victim: ferdinand_faithful
    scene: "the unfaithful namesake turns the king's longing into a death-bound bride-fetching task"
    evidence: "if he does not do it, his head must be struck off"

  - function: func_guidance
    order: 7
    actor: ferdinand_faithful_white_horse
    beneficiary: ferdinand_faithful
    scene: "the white horse tells Ferdinand to request ships of meat and bread"
    evidence: "Go thou to the King, and say if he will give thou what thou must have"

  - function: func_difficult_task
    order: 8
    actor: ferdinand_faithful
    scene: "Ferdinand crosses the lake, pacifies giants and birds, and has the princess carried sleeping to the ship"
    evidence: "they carried the princess in her bed to the King"

  - function: func_difficult_task
    order: 9
    actor: ferdinand_faithful
    scene: "Ferdinand repeats the passage to fetch the princess's writings"
    evidence: "he must fetch the writings from the castle"

  - function: func_magical_agent
    order: 10
    actor: ferdinand_faithful_fish
    beneficiary: ferdinand_faithful
    scene: "the fish returns the pen from the lake when Ferdinand plays the flute"
    evidence: "the fish came with the pen in its mouth"

  - function: func_victory
    order: 11
    actor: ferdinand_faithful_princess
    victim: ferdinand_faithful_king
    scene: "the queen withholds head-restoration from the noseless king"
    evidence: "But she cut off his head, and did not put it on again"

  - function: func_wedding
    order: 12
    actor: ferdinand_faithful
    scene: "the queen marries Ferdinand the Faithful"
    evidence: "she married Ferdinand the Faithful"

  - function: func_transfiguration
    order: 13
    actor: ferdinand_faithful_white_horse
    scene: "the white horse circles the heath and becomes a king's son"
    evidence: "was changed into a King’s son"


