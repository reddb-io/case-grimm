  threshold_types: []


propp:

  - function: func_initial_situation
    order: 1
    actor: going_travelling_youth
    scene: "a poor woman's son wants to travel although the household has no money for him"
    evidence: "much wished to travel"

  - function: func_formula_choice
    order: 2
    actor: going_travelling_youth
    scene: "the son decides he will manage by always saying not much"
    evidence: "I will always say, Not much"

  - function: func_misapplied_formula
    order: 3
    actor: going_travelling_youth
    victim: going_travelling_fishermen
    scene: "he says not much to fishermen whose net indeed catches little fish and is beaten"
    evidence: "they had not caught much fish"

  - function: func_correction
    order: 4
    actor: going_travelling_fishermen
    beneficiary: going_travelling_youth
    scene: "the fishermen correct him to say get it full"
    evidence: "Thou must say, ‘Get it full, get it full.’"

  - function: func_misapplied_formula
    order: 5
    actor: going_travelling_youth
    victim: going_travelling_execution_people
    scene: "he repeats get it full at the gallows, implying the world needs more condemned people"
    evidence: "Dost thou want to make out that there are still more wicked people"

  - function: func_correction
    order: 6
    actor: going_travelling_execution_people
    beneficiary: going_travelling_youth
    scene: "the gallows crowd tells him to pray for the poor soul"
    evidence: "may God have pity on the poor soul"

  - function: func_misapplied_formula
    order: 7
    actor: going_travelling_youth
    victim: going_travelling_knacker
    scene: "he repeats the pity formula over a knacker's dead horse and is boxed blind"
    evidence: "could not see out of his eyes"

  - function: func_correction
    order: 8
    actor: going_travelling_knacker
    beneficiary: going_travelling_youth
    scene: "the knacker tells him to say there lies the carrion in the pit"
    evidence: "There lies the carrion in the pit"

  - function: func_final_misapplication
    order: 9
    actor: going_travelling_youth
    victim: going_travelling_cart_people
    scene: "he says the carrion formula to a cart full of people, is pushed into a hole and whipped home"
    evidence: "there lies the carrion in the pit"

  - function: func_resolution
    order: 10
    actor: going_travelling_youth
    scene: "the beaten youth crawls back to his mother and never travels again"
    evidence: "never went out a-travelling again"


