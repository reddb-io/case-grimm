slug: how-six-men-got-on-in-the-world
khm: 71
atu: '513A'
atu_name: Six Go through the Whole World / Six Soldiers of Fortune
canonical_source: ../../2-silver/canonical/how-six-men-got-on-in-the-world/canonical.txt
title: How Six Men Got On in the World


entities:

  characters:

    how_six_discharged_soldier:
      name: The Discharged Soldier
      archetypes: [arc_trickster]
      species: sp_human
      agency_modes: [agency_speech, agency_cunning, agency_object_mediation]
      speech_acts_performed: [speech_bargain, speech_command]
      affects: [affect_anger, affect_greed]
      traits: [brave-soldier, underpaid, angry-recruiter, servant-race-sponsor, bride-renouncer, treasure-claimant]
      evidence: |
        he received his dismissal, and three farthings for his expenses
        on the way.

    how_six_strong_companion:
      name: The Tree-Plucking Strong Man
      archetypes: [arc_extraordinary_companion]
      species: sp_human
      agency_modes: [agency_extraordinary_body, agency_violence, agency_object_mediation]
      traits: [tree-plucker, mother-serving-son, sack-carrier, treasure-remover]
      evidence: |
        a man standing therein who had plucked up six trees as if they
        were blades of corn.

    how_six_huntsman:
      name: The Sharp-Eyed Huntsman
      archetypes: [arc_extraordinary_companion]
      species: sp_human
      agency_modes: [agency_extraordinary_body, agency_violence]
      traits: [two-mile-marksman, fly-eye-shooter, castle-top-watcher, skull-shooter]
      evidence: |
        Two miles from here a fly is sitting on the branch of an
        oak-tree, and I want to shoot its left eye out.

    how_six_blower:
      name: The Blower
      archetypes: [arc_extraordinary_companion]
      species: sp_human
      agency_modes: [agency_extraordinary_body, agency_violence]
      traits: [windmill-blower, nostril-worker, regiment-scatterer, mercy-giver]
      evidence: |
        Two miles from here are seven windmills; look, I am blowing them
        till they turn round.

    how_six_runner:
      name: The One-Legged Runner
      archetypes: [arc_extraordinary_companion]
      species: sp_human
      agency_modes: [agency_extraordinary_body, agency_endurance]
      traits: [leg-remover, bird-faster-runner, water-race-servant, sleeping-racer, recovery-runner]
      evidence: |
        I am a runner,” he replied, “and to stop myself running far too
        fast, I have taken off one of my legs

    how_six_frost_man:
      name: The Frost-Cap Man
      archetypes: [arc_extraordinary_companion]
      species: sp_human
      agency_modes: [agency_extraordinary_body, agency_object_mediation]
      traits: [sideways-cap-wearer, frost-maker, bird-freezer, iron-room-saviour]
      evidence: |
        if I set my hat straight, a terrible frost comes on

    how_six_king:
      name: The King
      archetypes: [arc_oath_enforcer]
      species: sp_human
      agency_modes: [agency_social_rank, agency_speech, agency_violence, agency_object_mediation]
      speech_acts_performed: [speech_command, speech_bargain]
      affects: [affect_fear, affect_anger, affect_greed]
      traits: [race-proclaimer, head-staker, daughter-protector, iron-room-trapper, treasure-bargainer, pursuit-orderer, defeated-ruler]
      evidence: |
        the King had proclaimed that whosoever ran a race with his
        daughter and won the victory, should be her husband

    how_six_princess:
      name: The King's Daughter
      species: sp_human
      agency_modes: [agency_extraordinary_body, agency_cunning]
      affects: [affect_fear]
      traits: [swift-runner, race-prize, rival-runner, sleeping-enemy-exploiter, pitcher-emptier]
      evidence: |
        the King’s daughter, who could also run very well quite as well
        as any ordinary mortal can

    how_six_cook:
      name: The Cook
      species: sp_human
      agency_modes: [agency_domestic_labor, agency_violence]
      speech_acts_performed: [speech_command]
      traits: [fire-maker, king-servant, iron-room-heater, falsely-scolded]
      evidence: |
        he sent for the cook, and commanded him to make a fire under the
        room

    how_six_sergeant:
      name: The Wounded Sergeant
      species: sp_human
      agency_modes: [agency_speech, agency_violence]
      affects: [affect_fear]
      traits: [regiment-pursuer, nine-wounded, mercy-beggar, royal-message-bearer]
      evidence: |
        One sergeant cried for mercy; he had nine wounds

    how_six_horsemen:
      name: The Two Regiments of Horsemen
      species: sp_human
      agency_modes: [agency_violence, agency_social_rank]
      traits: [pursuers, royal-troops, prisoner-callers, sky-blown]
      evidence: |
        Two regiments speedily overtook the six

  magic_objects:

    obj_how_six_huntsman_gun:
      name: The Huntsman's Gun
      object_kind: weapon
      attributes:
        function: precise long-distance shot that wakes the sleeping runner without injury
      evidence: |
        he loaded his gun, and shot so cleverly

    obj_how_six_runner_pitcher:
      name: The Runner's Pitcher
      object_kind: tool
      attributes:
        function: race token whose full or emptied state determines victory
      evidence: |
        The runner received a pitcher, and the King’s daughter one too

    obj_how_six_horse_skull:
      name: The Horse's Skull Pillow
      object_kind: relic
      attributes:
        function: uncomfortable pillow intended to keep the runner from sleeping too long
      evidence: |
        He had, however, made a pillow of a horse’s skull

    obj_how_six_frost_cap:
      name: The Frost Cap
      object_kind: garment
      attributes:
        function: straightening the cap causes deadly frost and counters the iron room's fire
      evidence: |
        if I set my hat straight, a terrible frost comes on

    obj_how_six_treasure_sack:
      name: The Kingdom-Sized Sack
      object_kind: tool
      attributes:
        function: tailored container for carrying away the kingdom's treasure
        making_time_days: 14
      evidence: |
        all the tailors in the whole kingdom, and they were to sit for
        fourteen days and sew a sack.

  locations:

    loc_how_six_forest:
      name: The Recruitment Forest
      instance_of: loc_forest
      threshold_type: threshold_forest
      evidence: |
        Then full of anger he went into the forest

    loc_how_six_race_town:
      name: The Race Town
      instance_of: loc_town
      evidence: |
        the six came to a town where the King had proclaimed

    loc_how_six_far_well:
      name: The Far-Distant Well
      instance_of: loc_well
      threshold_type: threshold_well
      evidence: |
        some water from a far distant well

    loc_how_six_castle_top:
      name: The Top of the Castle
      instance_of: loc_castle
      evidence: |
        standing at the top of the castle

    loc_how_six_iron_room:
      name: The Iron Room
      instance_of: loc_castle
      threshold_type: threshold_doorway
      attributes:
        floor: iron
        doors: iron
        windows: iron bars
        function: royal death-trap heated from below
      evidence: |
        a room which had a floor of iron, and the doors also were of
        iron, and the windows were guarded with iron bars.

    loc_how_six_kingdom_treasury:
      name: The Kingdom's Treasure
      instance_of: loc_castle
      evidence: |
        all his treasure


