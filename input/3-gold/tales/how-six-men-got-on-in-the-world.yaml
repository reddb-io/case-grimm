propp:
  - { function: func_initial_situation, order: 1, actor: how_six_discharged_soldier,
      scene: "a brave discharged soldier receives only three farthings and vows the king will give him the country's treasure" }
  - { function: func_departure, order: 2, actor: how_six_discharged_soldier,
      scene: "he enters the forest and begins recruiting extraordinary companions" }
  - { function: func_helper_acquisition, order: 3, actor: how_six_discharged_soldier,
      scene: "the strong man, huntsman, blower, runner, and frost-cap man join him" }
  - { function: func_interdiction, order: 4, actor: how_six_king,
      scene: "the king stakes marriage and beheading on a race against his daughter" }
  - { function: func_task, order: 5, actor: how_six_runner,
      scene: "the runner races the princess to bring water from a far well" }
  - { function: func_trickery, order: 6, actor: how_six_princess,
      scene: "the princess finds the runner sleeping, empties his pitcher, and runs ahead" }
  - { function: func_helper_intervention, order: 7, actor: how_six_huntsman,
      scene: "the huntsman shoots the horse's skull from under the runner without hurting him" }
  - { function: func_victory, order: 8, actor: how_six_runner,
      scene: "the runner refills the pitcher and returns ten minutes before the princess" }
  - { function: func_villainy, order: 9, actor: how_six_king,
      scene: "the king traps the six in an iron room and heats it from below" }
  - { function: func_helper_intervention, order: 10, actor: how_six_frost_man,
      scene: "the frost-cap man straightens his cap and freezes the iron room" }
  - { function: func_bargain, order: 11, actor: how_six_discharged_soldier,
      scene: "the soldier renounces the princess in exchange for as much gold as his servant can carry" }
  - { function: func_acquisition, order: 12, actor: how_six_strong_companion,
      scene: "the strong man fills the giant sack with the kingdom's treasure and carts" }
  - { function: func_pursuit, order: 13, actor: how_six_king,
      scene: "the enraged king sends two regiments to recover the sack" }
  - { function: func_rescue, order: 14, actor: how_six_blower,
      scene: "the blower scatters the pursuing regiments into the sky" }
  - { function: func_return, order: 15, actor: how_six_discharged_soldier,
      scene: "the six divide the riches and live content until death" }


