slug: one-eye-two-eyes-and-three-eyes
khm: 130
atu: '511'
atu_name: One-Eye, Two-Eyes, and Three-Eyes
canonical_source: ../../2-silver/canonical/one-eye-two-eyes-and-three-eyes/canonical.txt
title: One-Eye, Two-Eyes, and Three-Eyes


entities:

  characters:

    one_two_three_two_eyes:
      name: Two-Eyes
      archetypes: [arc_oppressed_maiden]
      species: sp_human
      agency_modes: [agency_endurance, agency_speech, agency_object_mediation, agency_domestic_labor]
      speech_acts_performed: [speech_wish, speech_command, speech_prayer]
      affects: [affect_grief, affect_hunger, affect_joy]
      traits: [ordinary-eyed, despised-daughter, goat-herd, formula-speaker, rightful-tree-owner, merciful-sister]
      evidence: |
        Two-eyes saw just as other human beings did

    one_two_three_mother:
      name: The Envious Mother
      species: sp_human
      agency_modes: [agency_social_rank, agency_speech, agency_violence]
      speech_acts_performed: [speech_command]
      affects: [affect_envy, affect_anger]
      traits: [persecuting-mother, surveillance-organizer, goat-killer, fruit-claimer]
      evidence: |
        my sisters and mother hate me for it

    one_two_three_one_eye:
      name: One-Eye
      archetypes: [arc_envious_kin_persecutor]
      species: sp_human
      agency_modes: [agency_cunning, agency_speech, agency_social_rank]
      affects: [affect_envy]
      traits: [single-eyed-elder-sister, first-spy, sleep-charmed, false-tree-claimant, later-beggar]
      evidence: |
        called One-eye, because she had only one eye in the middle of her forehead

    one_two_three_three_eyes:
      name: Three-Eyes
      archetypes: [arc_envious_kin_persecutor]
      species: sp_human
      agency_modes: [agency_cunning, agency_speech, agency_social_rank]
      speech_acts_performed: [speech_lie]
      affects: [affect_envy]
      traits: [three-eyed-youngest-sister, successful-spy, third-eye-witness, false-tree-claimant, later-beggar]
      evidence: |
        the youngest, Three-eyes, because she had three eyes

    one_two_three_wise_woman:
      name: The Wise Woman
      archetypes: [arc_supernatural_donor, arc_wise_helper]
      species: sp_human
      agency_modes: [agency_speech, agency_object_mediation]
      speech_acts_performed: [speech_command]
      traits: [field-appearing-helper, formula-giver, entrails-counsellor]
      evidence: |
        a woman was standing beside her

    one_two_three_goat:
      name: Two-Eyes' Goat
      species: sp_goat
      agency_modes: [agency_animal_aid, agency_object_mediation]
      existential_states: [state_liminal_dead]
      traits: [pasture-goat, formulaic-provider, slaughtered-helper, tree-source]
      evidence: |
        The goat which covered the table for me every day

    one_two_three_knight:
      name: The Young Knight
      species: sp_human
      agency_modes: [agency_social_rank, agency_speech]
      speech_acts_performed: [speech_promise]
      affects: [affect_love]
      traits: [handsome-lord, tree-admirer, public-recognizer, rescuer-husband]
      evidence: |
        a young knight came up

    one_two_three_poor_sisters:
      name: The Two Poor Repentant Sisters
      archetypes: [arc_repentant_sinner]
      species: sp_human
      agency_modes: [agency_endurance]
      affects: [affect_repentance]
      traits: [fallen-into-poverty, wandering-beggars, repentant-kin]
      evidence: |
        recognized her sisters, One-eye, and Three-eyes

  magic_objects:

    obj_one_two_three_food_table:
      name: The Goat-Summoned Food Table
      instance_of: obj_wishing_table
      object_kind: architecture
      attributes:
        start_formula: "Bleat, my little goat, bleat"
        stop_formula: "take the table quite away"
        function: feeds Two-Eyes secretly in the field
      evidence: |
        a little table, covered with a white cloth, was standing there

    obj_one_two_three_goat_entrails:
      name: The Slaughtered Goat's Entrails
      object_kind: creature_object
      attributes:
        source: one_two_three_goat
        function: buried seed of the silver-leaf and golden-fruit tree
      evidence: |
        give me the entrails

    obj_one_two_three_golden_apples:
      name: The Golden Apples
      object_kind: treasure
      attributes:
        tree_source: loc_one_two_three_rightful_tree
        function: reveal rightful ownership and expose false claims
      evidence: |
        fruit of gold hanging among them

    obj_one_two_three_silver_branch:
      name: The Silver-Leafed Golden-Fruit Branch
      object_kind: treasure
      attributes:
        given_to: one_two_three_knight
        function: exchange-token for Two-Eyes' rescue from hunger and want
      evidence: |
        a branch with beautiful silver leaves and golden fruit

    obj_one_two_three_barrel:
      name: The Empty Barrel
      object_kind: material
      attributes:
        function: hides Two-Eyes from the knight and fails as concealment
      evidence: |
        turned an empty barrel which was standing close by the tree over poor Two-eyes

  locations:

    loc_one_two_three_household:
      name: The Hostile Family House
      instance_of: loc_house
      evidence: |
        In the evening, when she went home with her goat

    loc_one_two_three_field_ridge:
      name: The Field Ridge of Weeping
      instance_of: loc_field
      evidence: |
        seated herself on the ridge of grass at the edge of the field

    loc_one_two_three_pasture:
      name: The Goat Pasture
      instance_of: loc_meadow
      evidence: |
        drive her goat to the pasture

    loc_one_two_three_house_door:
      name: The Ground Before the House-Door
      instance_of: loc_house
      threshold_type: threshold_doorway
      evidence: |
        in front of the house-door

    loc_one_two_three_rightful_tree:
      name: The Silver-Leafed Golden-Fruit Tree
      instance_of: loc_tree
      attributes:
        grown_from: obj_one_two_three_goat_entrails
        follows_owner: one_two_three_two_eyes
      evidence: |
        there stood a strangely magnificent tree with leaves of silver, and fruit of gold

    loc_one_two_three_knight_castle:
      name: The Knight's Father's Castle
      instance_of: loc_castle
      evidence: |
        took her home with him to his father’s castle


