propp:

  - function: func_villainy
    order: 1
    actor: one_two_three_mother
    victim: one_two_three_two_eyes
    scene: "the mother and sisters despise Two-Eyes for having ordinary human eyes and deprive her of food"
    evidence: "gave her nothing to eat but what they left"

  - function: func_departure
    order: 2
    actor: one_two_three_two_eyes
    scene: "Two-Eyes goes hungry into the fields to tend the goat"
    evidence: "Two-eyes had to go out into the fields and tend the goat"

  - function: func_donor_sequence
    order: 3
    actor: one_two_three_wise_woman
    beneficiary: one_two_three_two_eyes
    scene: "the wise woman gives Two-Eyes the formula for summoning and dismissing the food table"
    evidence: "I will tell thee something to stop thee ever suffering from hunger again"

  - function: func_magical_agent
    order: 4
    actor: one_two_three_goat
    beneficiary: one_two_three_two_eyes
    scene: "the goat mediates the spoken charm that covers the table with food"
    evidence: "Cover the table with something to eat"

  - function: func_villainy
    order: 5
    actor: one_two_three_mother
    victim: one_two_three_goat
    scene: "after Three-Eyes discovers the secret, the mother kills the goat"
    evidence: "thrust it into the heart of the goat"

  - function: func_donor_sequence
    order: 6
    actor: one_two_three_wise_woman
    beneficiary: one_two_three_two_eyes
    scene: "the wise woman instructs Two-Eyes to bury the slaughtered goat's entrails before the house"
    evidence: "bury them in the ground in front of the house"

  - function: func_magical_agent
    order: 7
    actor: loc_one_two_three_rightful_tree
    beneficiary: one_two_three_two_eyes
    scene: "the buried entrails become a silver-leafed tree with golden fruit that only Two-Eyes can pluck"
    evidence: "came into her hand of their own accord"

  - function: func_false_claims
    order: 8
    actor: one_two_three_one_eye
    scene: "One-Eye and Three-Eyes claim the tree before the knight but cannot break off its branch"
    evidence: "They again asserted that the tree was their property"

  - function: func_recognition
    order: 9
    actor: one_two_three_knight
    beneficiary: one_two_three_two_eyes
    scene: "Two-Eyes rolls out golden apples, comes from beneath the barrel, and proves the tree is hers"
    evidence: "Two-eyes, come forth"

  - function: func_rescue
    order: 10
    actor: one_two_three_knight
    beneficiary: one_two_three_two_eyes
    scene: "the knight takes Two-Eyes away from hunger, thirst, grief, and want"
    evidence: "if you would take me with you"

  - function: func_wedding
    order: 11
    actor: one_two_three_knight
    beneficiary: one_two_three_two_eyes
    scene: "the knight marries Two-Eyes at his father's castle"
    evidence: "he married her"

  - function: func_punishment
    order: 12
    actor: loc_one_two_three_rightful_tree
    victim: one_two_three_one_eye
    scene: "the tree vanishes from the persecutors' house and follows Two-Eyes"
    evidence: "the tree had vanished"

  - function: func_forgiveness
    order: 13
    actor: one_two_three_two_eyes
    beneficiary: one_two_three_poor_sisters
    scene: "Two-Eyes receives her fallen sisters, cares for them, and they repent"
    evidence: "made them welcome, and was kind to them"


