propp:

  - function: func_lack
    order: 1
    actor: donkey_birth_queen
    scene: Royal wealth lacks continuity because the King and Queen have no child.
    evidence: |
      had everything they wanted, but no children

  - function: func_wish
    order: 2
    actor: donkey_birth_queen
    beneficiary: donkey_prince
    scene: The queen's child-wish is granted, but the child arrives as a donkey.
    evidence: |
      God gave her her wish

  - function: func_recognition
    order: 3
    actor: donkey_birth_king
    beneficiary: donkey_prince
    scene: The father recognizes the donkey-child as divinely sent son and heir.
    evidence: |
      since God has sent him he shall be my son and heir

  - function: func_acquisition
    order: 4
    actor: donkey_prince
    scene: The donkey masters the lute despite an unsuitable animal body.
    evidence: |
      at last learnt to do it as well as the master himself

  - function: func_departure
    order: 5
    actor: donkey_prince
    scene: Reflection in the well turns bodily self-knowledge into exile.
    evidence: |
      saw his donkey’s form. He was so distressed about it, that he went out into the wide world

  - function: func_mediation
    order: 6
    actor: donkey_prince
    scene: Lute music at the gate makes the second court admit the uncanny guest.
    evidence: |
      played it in the most delightful manner with his two fore-feet

  - function: func_claim
    order: 7
    actor: donkey_prince
    scene: The donkey refuses servant and warrior seating, claiming noble proximity to the king.
    evidence: |
      I am no common stable-ass, I am a noble one

  - function: func_wedding
    order: 8
    actor: donkey_prince
    beneficiary: donkey_princess
    scene: The old king offers his daughter, and the donkey receives the desired marriage.
    evidence: |
      Wilt thou have my pretty daughter to wife?

  - function: func_exposure
    order: 9
    actor: donkey_hidden_servant
    scene: A hidden servant witnesses the bridegroom's nightly skin-shedding and reveals it.
    evidence: |
      The King was surprised, but the servant who had concealed himself came and revealed everything to him.

  - function: func_transfiguration
    order: 10
    actor: donkey_old_king
    beneficiary: donkey_human_youth
    scene: The old king burns the ass-skin, forcing the hidden human form to remain.
    evidence: |
      threw the skin into it, and remained by it himself until it was all burnt to ashes

  - function: func_reward
    order: 11
    actor: donkey_old_king
    beneficiary: donkey_human_youth
    scene: The released youth receives half the kingdom and later inherits two kingdoms.
    evidence: |
      I will now give thee half my kingdom


