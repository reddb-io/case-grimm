title: The Donkey


entities:

  characters:

    donkey_birth_king:
      name: The Donkey Prince's Father King
      species: sp_human
      agency_modes: [agency_social_rank, agency_speech]
      speech_acts_performed: [speech_command, speech_promise]
      affects: [affect_love, affect_joy]
      traits: [rich-childless-king, divine-child-acceptor, donkey-heir-defender, throne-promiser]
      evidence: |
        since God has sent him he shall be my son and heir

    donkey_birth_queen:
      name: The Donkey Prince's Mother Queen
      species: sp_human
      agency_modes: [agency_speech, agency_social_rank]
      speech_acts_performed: [speech_wish, speech_command]
      affects: [affect_grief, affect_disgust, affect_shame]
      traits: [childless-queen, barren-field-lamenter, donkey-child-rejecter, drowning-demanding-mother]
      evidence: |
        I am like a field on which nothing grows

    donkey_prince:
      name: The Donkey Prince
      archetypes: [arc_hybrid_outcast_bridegroom]
      species: sp_donkey
      agency_modes: [agency_music, agency_speech, agency_social_rank, agency_endurance, agency_object_mediation]
      existential_states: [state_transformed, state_hidden_identity]
      transformations: [transform_animal_human]
      speech_acts_performed: [speech_request, speech_command]
      affects: [affect_shame, affect_grief, affect_love, affect_joy, affect_fear]
      traits: [royal-donkey-child, lute-student, self-recognizing-outcast, gate-musician, noble-rank-claimer, hidden-human-bridegroom, skin-shedding-youth]
      evidence: |
        did not look like a human child, but was a little donkey

    donkey_human_youth:
      name: The Donkey Prince in Human Form
      species: sp_human
      agency_modes: [agency_social_rank, agency_speech]
      existential_states: [state_hidden_identity]
      transformations: [transform_animal_human]
      affects: [affect_fear, affect_grief, affect_joy]
      traits: [handsome-royal-youth, exposed-true-form, reluctant-to-remain-unhidden, double-kingdom-heir]
      evidence: |
        stood there in the form of a handsome royal youth

    donkey_musician:
      name: The Celebrated Musician
      species: sp_human
      agency_modes: [agency_music, agency_speech]
      speech_acts_performed: [speech_request]
      traits: [lute-master, reluctant-teacher, animal-student-instructor]
      evidence: |
        he went to a celebrated musician and said

    donkey_faithful_companion:
      name: The Donkey's Faithful Companion
      archetypes: [arc_faithful_servant]
      species: sp_human
      agency_modes: [agency_endurance]
      traits: [wide-world-companion, loyal-traveller]
      evidence: |
        only took with him one faithful companion

    donkey_old_king:
      name: The Old King of the Second Kingdom
      species: sp_human
      agency_modes: [agency_social_rank, agency_speech, agency_cunning, agency_object_mediation, agency_violence]
      speech_acts_performed: [speech_command, speech_request, speech_promise]
      affects: [affect_love, affect_joy]
      traits: [courtly-host, amused-animal-guest-receiver, bride-giver, hidden-witness-user, moonlight-watcher, skin-burner, kingdom-giver]
      evidence: |
        I will now give thee half my kingdom

    donkey_princess:
      name: The Old King's Daughter
      species: sp_human
      agency_modes: [agency_social_rank, agency_speech]
      speech_acts_performed: [speech_promise]
      affects: [affect_love, affect_joy]
      traits: [only-daughter, beautiful-princess, animal-bridegroom-wife, hidden-form-beloved]
      evidence: |
        I love him as well as if he were the handsomest in the world

    donkey_doorkeeper:
      name: The Door-Keeper
      species: sp_human
      agency_modes: [agency_speech, agency_social_rank]
      speech_acts_performed: [speech_testimony]
      affects: [affect_joy]
      traits: [gate-witness, lute-playing-donkey-reporter]
      evidence: |
        Outside by the gate sits a young donkey which plays the lute

    donkey_hidden_servant:
      name: The Hidden Servant
      species: sp_human
      agency_modes: [agency_cunning, agency_speech]
      speech_acts_performed: [speech_testimony, speech_command]
      traits: [bedchamber-spy, revelation-witness, skin-burning-adviser]
      evidence: |
        ordered a servant to hide himself there

    donkey_court:
      name: The Laughing Court
      species: sp_human
      agency_modes: [agency_social_rank, agency_speech]
      affects: [affect_joy]
      traits: [laughing-courtiers, rank-testing-witnesses]
      evidence: |
        every one began to laugh at the lute-player

  magic_objects:

    obj_donkey_lute:
      name: The Donkey's Lute
      instance_of: obj_lute
      object_kind: instrument
      attributes:
        function: refined musical instrument that opens the gate and legitimates the donkey before court
      evidence: |
        took his lute and played it in the most delightful manner

    obj_donkey_ass_skin:
      name: The Donkey Prince's Ass-Skin
      instance_of: obj_cast_off_animal_skin
      object_kind: garment
      attributes:
        function: removable animal exterior burned so the hidden human form remains visible
      evidence: |
        suddenly threw off his ass’s skin

    obj_donkey_mirror_well_water:
      name: The Mirror-Clear Well Water
      object_kind: material
      attributes:
        function: reflective water that makes the prince perceive his donkey form as social shame
      evidence: |
        in the mirror-clear water saw his donkey’s form

    obj_donkey_skin_fire:
      name: The Great Fire Outside
      object_kind: material
      attributes:
        function: consumes the ass-skin until return to donkey form is impossible
      evidence: |
        had a great fire lighted outside, and threw the skin into it

  locations:

    loc_donkey_birth_castle:
      name: The Birth Kingdom's Royal House
      instance_of: loc_castle
      evidence: |
        there lived a King and a Queen, who were rich

    loc_donkey_well:
      name: The Mirror-Clear Well
      instance_of: loc_well
      threshold_type: threshold_well
      evidence: |
        came to a well, he looked into it

    loc_donkey_wide_world_road:
      name: The Wide-World Road
      instance_of: loc_road
      evidence: |
        went out into the wide world

    loc_donkey_old_king_gate:
      name: The Gate of the Old King's Kingdom
      instance_of: loc_gate
      threshold_type: threshold_gate
      evidence: |
        knocked at the gate, and cried

    loc_donkey_old_king_court:
      name: The Old King's Court
      instance_of: loc_castle
      evidence: |
        When, however, a donkey came in, every one began to laugh

    loc_donkey_wedding_bedroom:
      name: The Wedding Bed-Room
      instance_of: loc_bedchamber
      threshold_type: threshold_doorway
      evidence: |
        the bride and bridegroom were led into their bed-room

    loc_donkey_outside_fire:
      name: The Outside Fire-Place
      instance_of: loc_courtyard
      evidence: |
        had a great fire lighted outside


