    evidence: |
      cleaned them, span them fine

  - from: obj_odds_discarded_flax_bits
    label: BECOMES
    to: obj_odds_pretty_dress
    evidence: |
      had a beautiful gown made out of them

  - from: odds_industrious_servant
    label: DANCES_IN
    to: obj_odds_pretty_dress
    evidence: |
      dancing merrily about in her pretty dress

  - from: odds_lazy_maiden
    label: DISCLOSES_SOURCE_OF
    to: obj_odds_pretty_dress
    evidence: |
      dressed in my odds and ends

  - from: odds_young_man
    label: HEARS_DISCLOSURE_FROM
    to: odds_lazy_maiden
    evidence: |
