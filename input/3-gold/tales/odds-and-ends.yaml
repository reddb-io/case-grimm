    to: odds_lazy_maiden
    evidence: |
      saw how idle she was

  - from: odds_young_man
    label: RECOGNIZES_INDUSTRY_OF
    to: odds_industrious_servant
    evidence: |
      how industrious the poor girl was

  - from: odds_young_man
    label: GIVES_UP
    to: odds_lazy_maiden
    evidence: |
      he gave her up

  - from: odds_young_man
    label: CHOOSES_AS_WIFE
    to: odds_industrious_servant
    evidence: |
      chose her as his wife

  - from: law_discarded_flax_reveals_domestic_industry
    label: SELECTS
    to: odds_industrious_servant
    evidence: |
      chose her as his wife
