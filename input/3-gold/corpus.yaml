    explicit_branch_count: 0
  - id: rumpelstiltskin:dwarf-s-fate
    canonical_slug: rumpelstiltskin
    section_id: dwarf-s-fate
    title: dwarf's fate
    canonical_type: conflict
    canonical_rationale: >-
      Three witnesses (Hunt, Olcott, Dutch) end in self-destruction; two (Taylor, Gruelle) soften for child audiences.
      ATU 500 canonically ends with the supernatural helper's self-defeat upon being named — this is the type's moral
      logic, not a stylistic choice. Hunt agrees with the KHM original 1812 text.
    kept_book_ids:
      - pg5314-grimm-hunt
    explicit_branch_count: 2
