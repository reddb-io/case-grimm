  - id: rumpelstiltskin:dwarf-s-fate:1
    section_ref: rumpelstiltskin:dwarf-s-fate
    canonical_slug: rumpelstiltskin
    section_id: dwarf-s-fate
    branch_index: 1
    type: fork
    from_book_id: pg11027-grimm-gruelle
    description: dwarf loses a leg and hops away alive, never seen again
    text: >-
      and stamped his right foot so hard in the ground with rage that he could not draw it out again. Then he took hold
      of his left leg with both his hands, and pulled away so hard that his right came off in the struggle, and he
      hopped away howling terribly. And from that day to this the Queen has heard no more of her troublesome visitor.
    consequences:
      - 'villain survives: the bargain economy is not closed; naming-as-defeat is incomplete'
      - 'moral_regime shifts: moral_violent_punishment → moral_humiliation (mutilation, not death)'
      - ATU 500 type-marker (helper destroyed by being named) is weakened — naming exposes but doesn't undo
      - 'the law_promise_binds_reality becomes asymmetric: the queen escapes, but the supernatural party persists'
    consequence_count: 4
    plot_breaks: >-
      the closing rhyme "And from that day to this the Queen has heard no more..." presupposes the dwarf is gone but
      alive — incompatible with canonical's death.
    has_plot_break: true
  - id: rumpelstiltskin:dwarf-s-fate:2
    section_ref: rumpelstiltskin:dwarf-s-fate
    canonical_slug: rumpelstiltskin
    section_id: dwarf-s-fate
    branch_index: 2
    type: fork
    from_book_id: pg2591-grimm-taylor
    description: dwarf's foot sticks in the floor; he frees it, the court jeers, he leaves alive
    text: >-
      and dashed his right foot in a rage so deep into the floor, that he was forced to lay hold of it with both hands
      to pull it out. Then he made the best of his way off, while the nurse laughed and the baby crowed; and all the
      court jeered at him for having had so much trouble for nothing, and said, “We wish you a very good morning, and a
      merry feast, Mr RUMPLESTILTSKIN!”
    consequences:
      - 'moral_regime shifts: moral_violent_punishment → moral_social_humiliation (public shaming)'
      - introduces named-court audience (nurse, baby, courtiers) absent in canonical — the queen has witnesses
      - the dwarf's defeat is communal-comic rather than private-tragic
      - 'tone register shifts: tale becomes farce rather than parable'
    consequence_count: 4
    plot_breaks: >-
      the nurse, baby, and court must be present at the climax — these characters don't exist in the canonical version
      where the confrontation is private between queen and dwarf.
    has_plot_break: true
