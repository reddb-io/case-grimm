  - id: little-snow-white:stepmother-s-fate
    canonical_slug: little-snow-white
    section_id: stepmother-s-fate
    title: stepmother's fate
    canonical_type: conflict
    canonical_rationale: >-
      KHM 1857 explicitly has *eiserne Pantoffeln* heated *im Kohlenfeuer*. 3 of 5 sources keep it. ATU 709 motif
      requires retributive ending — the envious stepmother's compelled-death is the structural moral closure of the tale
      type. Removing it changes the tale's moral regime from `moral_violent_punishment` to `moral_arbitrary`.
    kept_book_ids:
