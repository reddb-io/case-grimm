  - id: rumpelstiltskin:spinning-song
    canonical_slug: rumpelstiltskin
    section_id: spinning-song
    title: spinning song
    canonical_type: enrichment
    canonical_rationale: >-
      Structurally significant: in the KHM original German the dwarf utters incantatory speech while spinning. Hunt
      suppresses it; Taylor preserves it. The song materially establishes that the dwarf's power operates through speech
      (paralleling the later naming-as-defeat). This is the most important enrichment in the merge.
    kept_book_ids:
