canonical_branch_sections:
  - id: briar-rose:animal-that-announces-the-birth
    canonical_slug: briar-rose
    section_id: animal-that-announces-the-birth
    title: animal that announces the birth
    canonical_type: conflict
    canonical_rationale: Three of five sources use frog; final KHM 1857 text uses *Frosch*. Hunt is canonical voice.
    kept_book_ids:
      - pg5314-grimm-hunt
      - pg52521-grimm-olcott
      - pg22555-grimm-eeden-dutch
    explicit_branch_count: 1
  - id: briar-rose:thirteen-wise-women
    canonical_slug: briar-rose
    section_id: thirteen-wise-women
    title: thirteen wise women
    canonical_type: terminological
    canonical_rationale: >-
      Hunt and Olcott (English) plus Dutch ('wijze vrouwen') agree. 'Fairies' (Taylor/Gruelle) modernises and softens
      the term, losing the occult older sense.
    kept_book_ids:
      - pg5314-grimm-hunt
    explicit_branch_count: 0
  - id: briar-rose:sleep-tableau-butler
    canonical_slug: briar-rose
    section_id: sleep-tableau-butler
    title: sleep tableau — butler
    canonical_type: enrichment
    canonical_rationale: >-
      Taylor's butler-tasting-ale is a vivid frozen-action detail consistent with the universal-stillness motif. Hunt
      omits it; restoring it enriches the tableau without changing facts. The butler also reappears in §7 awakening,
      mirroring the structure.
    kept_book_ids:
      - pg5314-grimm-hunt
      - pg2591-grimm-taylor
    explicit_branch_count: 0
  - id: briar-rose:awakening-cascade
    canonical_slug: briar-rose
    section_id: awakening-cascade
    title: awakening cascade
    canonical_type: enrichment
    canonical_rationale: Structural consistency — if the butler slept in §5, he must wake here.
    kept_book_ids:
      - pg5314-grimm-hunt
      - pg2591-grimm-taylor
    explicit_branch_count: 0
  - id: hans-in-luck:opening-frame
    canonical_slug: hans-in-luck
    section_id: opening-frame
    title: opening philosophical frame
    canonical_type: stylistic
    canonical_rationale: |
      Hunt opens directly with action ("Hans had served his master for
      seven years"). Taylor prefaces with a ~90-word reflection on
      lucky men, which is Victorian editorial framing, not in KHM.
      Preserved here for tone-marker.
    kept_book_ids:
      - pg5314-grimm-hunt
    explicit_branch_count: 1
  - id: hans-in-luck:lump-material
    canonical_slug: hans-in-luck
    section_id: lump-material
    title: master's payment material
    canonical_type: conflict
    canonical_rationale: |
      Hunt: "lump of gold as big as his head" — KHM faithful ("ein
      Klumpen Gold"). Taylor: "lump of silver" — translation drift.
      Hunt kept.
    kept_book_ids:
      - pg5314-grimm-hunt
    explicit_branch_count: 1
  - id: hans-in-luck:riding-song
    canonical_slug: hans-in-luck
    section_id: riding-song
    title: Hans's song on horseback
    canonical_type: enrichment
    canonical_rationale: |
      Taylor preserves a quatrain Hans sings while riding ("No care and
      no sorrow..."). Hunt suppresses it. Restored via merge.yaml#edit-1
      with a 3-word bridge ("And he sang—") to introduce the verse.
    kept_book_ids:
      - pg5314-grimm-hunt
      - pg2591-grimm-taylor
    explicit_branch_count: 0
  - id: hans-in-luck:scissors-grinder-song
    canonical_slug: hans-in-luck
    section_id: scissors-grinder-song
    title: scissors-grinder's song
    canonical_type: stylistic
    canonical_rationale: |
      Hunt's 2-line couplet ("I sharpen scissors and quickly grind, / My
      coat blows out in the wind behind") is closer to the KHM original
      ("Ich schleife die Schere und drehe geschwind"). Taylor's 5-line
      version is expanded translation.
    kept_book_ids:
      - pg5314-grimm-hunt
    explicit_branch_count: 1
  - id: hans-in-luck:ending-stones
    canonical_slug: hans-in-luck
    section_id: ending-stones
    title: ending — stones falling into well
    canonical_type: conflict
    canonical_rationale: |
      Hunt has TWO stones (grindstone + an extra "strong stone for old
      nails") — matches KHM "die beiden Steine". Taylor reduces to one.
      Hunt is faithful to original.
    kept_book_ids:
      - pg5314-grimm-hunt
    explicit_branch_count: 1
  - id: jorinda-and-joringel:jorindas-song
    canonical_slug: jorinda-and-joringel
    section_id: jorindas-song
    title: Jorinda's song before transformation
    canonical_type: stylistic
    canonical_rationale: |
      Hunt's "My little bird, with the necklace red" is closer to KHM
      "Mein Vögelein mit dem Ringlein rot". Both translations preserve
      the dove-bird soul-symbol; Hunt's matches the original meter.
    kept_book_ids:
      - pg5314-grimm-hunt
    explicit_branch_count: 1
  - id: jorinda-and-joringel:witchs-incantation
    canonical_slug: jorinda-and-joringel
    section_id: witchs-incantation
    title: witch's incantation upon returning
    canonical_type: stylistic
    canonical_rationale: |
      Hunt preserves the KHM-faithful invocation: "Greet thee, Zachiel.
      If the moon shines on the cage, Zachiel, let him loose at once."
      "Zachiel" is the demon-name the witch addresses. Taylor replaces
      this with a poetic English incantation, losing the demon-naming.
    kept_book_ids:
      - pg5314-grimm-hunt
    explicit_branch_count: 1
  - id: jorinda-and-joringel:cages-count
    canonical_slug: jorinda-and-joringel
    section_id: cages-count
    title: number of bird cages in the castle
    canonical_type: conflict
    canonical_rationale: |
      Hunt: 7000 cages (KHM "siebentausend"). Taylor: 700 cages.
      Hunt is faithful; Taylor's smaller number reduces the scale of
      the witch's collection.
    kept_book_ids:
