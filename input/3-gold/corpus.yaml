    title: dwarf's first appearance
    canonical_type: enrichment
    canonical_rationale: >-
      Taylor describes the dwarf as wearing 'a sugarloaf cap and a scarlet cloak'. Hunt omits visual detail. The
      description matters because the dwarf returns at the wedding wearing the same costume — restoration depends on
      having the original description.
    kept_book_ids:
      - pg5314-grimm-hunt
      - pg2591-grimm-taylor
