    title: three trials and wedding
    canonical_type: enrichment
    canonical_rationale: >-
      Hunt truncates the KHM 1857 ending, dropping three structurally important trials. Taylor preserves them. This is
      verifiable against KHM (Die goldene Gans, 1857 final edition). Restoration adds three new helper characters and
      three new tasks to the gold-layer model.
    kept_book_ids:
      - pg5314-grimm-hunt
