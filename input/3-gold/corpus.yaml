    from_book_id: pg2591-grimm-taylor
    description: queen dies of rage on sight of Snow-white at the wedding — no compelled iron-shoe dance
    text: >-
      When she heard this she started with rage; but her envy and curiosity were so great, that she could not help
      setting out to see the bride. And when she got there, and saw that it was no other than Snow-white, who, as she
      thought, had been dead a long while, she choked with rage, and fell down and died.
    consequences:
