  - id: the-water-of-life:wedding-celebration-closing-rhyme
    canonical_slug: the-water-of-life
    section_id: wedding-celebration-closing-rhyme
    title: wedding celebration + closing rhyme
    canonical_type: enrichment
    canonical_rationale: >-
      KHM 1857 closes with a wedding celebration that the dwarf attends — a structural closure where the helper-figure
      witnesses the quest's success. Hunt truncates this. Restoring it preserves the helper-returns motif and the tale's
      final folkloric rhyme.
    kept_book_ids:
      - pg5314-grimm-hunt
      - pg2591-grimm-taylor
    explicit_branch_count: 0
canonical_branches:
  - id: briar-rose:animal-that-announces-the-birth:1
    section_ref: briar-rose:animal-that-announces-the-birth
    canonical_slug: briar-rose
    section_id: animal-that-announces-the-birth
    branch_index: 1
    type: fork
    from_book_id: pg2591-grimm-taylor
    description: fish (rescued by queen from riverbank) replaces frog as birth-announcer
    text: >-
      But one day as the queen was walking by the side of the river, at the bottom of the garden, she saw a poor little
      fish, that had thrown itself out of the water, and lay gasping and nearly dead on the bank. Then the queen took
      pity on the little fish, and threw it back again into the river; and before it swam away it lifted its head out of
      the water and said, “I know what your wish is, and it shall be fulfilled, in return for your kindness to me—you
      will soon have a daughter.”
    consequences:
      - 'introduces kindness-reciprocity motif: queen''s compassion → supernatural blessing'
      - activates law_kindness_invokes_hidden_aid as a tale-level world law (absent in canonical)
      - queen's character gains agency_virtue (rescuing weak creature) before pregnancy
      - 'announcer species shifts: amphibian-liminal (frog) → fish (water-creature, often soul-symbol in folklore)'
    consequence_count: 4
    plot_breaks: none — no later scene references the announcer's species or the rescue.
    has_plot_break: false
  - id: hans-in-luck:opening-frame:1
    section_ref: hans-in-luck:opening-frame
    canonical_slug: hans-in-luck
    section_id: opening-frame
    branch_index: 1
    type: addition
    from_book_id: pg2591-grimm-taylor
    description: philosophical opening on luck — frames Hans as archetype
    text: |
      Some men are born to good luck: all they do or try to do comes
      right—all that falls to them is so much gain—all their geese are
      swans—all their cards are trumps—toss them which way you will,
      they will always, like poor puss, alight upon their legs, and only
      move on so much the faster.
    consequences:
      - explicitly frames Hans as agency_fortune (lucky archetype) — graph layer can attach affect_arbitrary
      - establishes moral_regime as moral_arbitrary up front, not just by ending
      - makes the tale into a parable about luck rather than a single character study
    consequence_count: 3
    plot_breaks: none — pure framing, removable
    has_plot_break: false
