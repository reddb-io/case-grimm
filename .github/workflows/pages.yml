name: Deploy Docsify site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'input/**'
      - 'scripts/**'
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'grimm'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Generate docs data
        run: |
          ./grimm setup
          rm -f output/embedded.rdb*
          rm -f output/embedded.result-cache.l2*
          rm -f output/red-slow.log output/.audit.log
          ./grimm rebuild
          ./grimm export docs

      - name: Verify docs export
        run: |
          test -s docs/data/tales.json
          test -s docs/data/overview.json
          test -s docs/data/questions.json
          node --input-type=module -e "
            import { readFileSync } from 'node:fs'
            const payload = JSON.parse(readFileSync('docs/data/tales.json', 'utf8'))
            if (payload.totals?.tales !== 206) throw new Error('Expected 206 exported tales')
            const hansel = payload.tales.find((tale) => tale.slug === 'hansel-and-gretel')
            if (!hansel?.text) throw new Error('Missing gold tale text export')
            if (!hansel.sources?.some((source) => source.text)) throw new Error('Missing silver source text export')
          "

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
